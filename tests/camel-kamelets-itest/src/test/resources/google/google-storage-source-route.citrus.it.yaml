name: google-storage-source-route-test
description: 'google-storage-source reads a file of the bucket, with its bucket, name and content type, and deletes it'
actions:
  # Start the Floci GCP emulator, which serves Pub/Sub, Cloud Storage and BigQuery on one port, without logging in
  - testcontainers:
      start:
        container:
          name: "gcp"
          image: "floci/floci-gcp:0.12.0"
          autoRemove: true
          startUpTimeout: 120
          exposedPorts:
            - 4588
          waitFor:
            logMessage: '.*Listening on.*'

  # The bucket kamelets-orders, with a file in the folder in
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_GCP_HOST}:${CITRUS_TESTCONTAINERS_GCP_PORT}"
      sendRequest:
        POST:
          path: "/storage/v1/b"
          contentType: "application/json"
          parameters:
            - name: "project"
              value: 'kamelets'
          body:
            data: '{"name":"kamelets-orders"}'
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_GCP_HOST}:${CITRUS_TESTCONTAINERS_GCP_PORT}"
      receiveResponse:
        response:
          status: 200

  - http:
      client: "http://${CITRUS_TESTCONTAINERS_GCP_HOST}:${CITRUS_TESTCONTAINERS_GCP_PORT}"
      sendRequest:
        POST:
          path: "/upload/storage/v1/b/kamelets-orders/o"
          contentType: "text/plain"
          parameters:
            - name: "uploadType"
              value: 'media'
            - name: "name"
              value: 'in/order-1.txt'
          body:
            data: 'Hello Cloud Storage'
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_GCP_HOST}:${CITRUS_TESTCONTAINERS_GCP_PORT}"
      receiveResponse:
        response:
          status: 200

  # Create Camel JBang integration
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "google/google-storage-source-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${gcp.server.port}"
                - name: "gcp.url"
                  value: "http://${CITRUS_TESTCONTAINERS_GCP_HOST}:${CITRUS_TESTCONTAINERS_GCP_PORT}"
                - name: "gcp.projectId"
                  value: "kamelets"
                - name: "gcp.serviceAccountKey"
                  value: "e30="
          resources:
            - "GoogleStorageClient.java"

  # The content of the file, as a stream, with the bucket, the name and the content type
  - http:
      server: "gcpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'org.apache.camel.converter.stream.InputStreamCache'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "X-Bucket-Name"
              value: 'kamelets-orders'
            - name: "X-Object-Name"
              value: 'in/order-1.txt'
            - name: "X-Object-Content-Type"
              value: 'text/plain'
          body:
            data: 'Hello Cloud Storage'
  - http:
      server: "gcpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
