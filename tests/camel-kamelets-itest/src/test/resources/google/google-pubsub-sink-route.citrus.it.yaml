name: google-pubsub-sink-route-test
description: 'google-pubsub-sink publishes the body to the topic, with the headers as attributes'
actions:
  # Start the Floci GCP emulator, which serves Pub/Sub, Cloud Storage and BigQuery on one port, without logging in
  - testcontainers:
      start:
        container:
          name: "gcp"
          image: "floci/floci-gcp:0.12.0"
          autoRemove: true
          startUpTimeout: 120
          exposedPorts:
            - 4588
          waitFor:
            logMessage: '.*Listening on.*'

  # The topic orders, with the subscription orders-sub
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_GCP_HOST}:${CITRUS_TESTCONTAINERS_GCP_PORT}"
      sendRequest:
        PUT:
          path: "/v1/projects/kamelets/topics/orders"
          contentType: "application/json"
          body:
            data: '{}'
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_GCP_HOST}:${CITRUS_TESTCONTAINERS_GCP_PORT}"
      receiveResponse:
        response:
          status: 200

  - http:
      client: "http://${CITRUS_TESTCONTAINERS_GCP_HOST}:${CITRUS_TESTCONTAINERS_GCP_PORT}"
      sendRequest:
        PUT:
          path: "/v1/projects/kamelets/subscriptions/orders-sub"
          contentType: "application/json"
          body:
            data: '{"topic":"projects/kamelets/topics/orders"}'
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_GCP_HOST}:${CITRUS_TESTCONTAINERS_GCP_PORT}"
      receiveResponse:
        response:
          status: 200

  # Create Camel JBang integration. The Pub/Sub client goes to the emulator without logging in.
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "google/google-pubsub-sink-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${gcp.server.port}"
                - name: "gcp.url"
                  value: "http://${CITRUS_TESTCONTAINERS_GCP_HOST}:${CITRUS_TESTCONTAINERS_GCP_PORT}"
                - name: "gcp.projectId"
                  value: "kamelets"
                - name: "gcp.serviceAccountKey"
                  value: "e30="
                - name: "camel.component.google-pubsub.endpoint"
                  value: "${CITRUS_TESTCONTAINERS_GCP_HOST}:${CITRUS_TESTCONTAINERS_GCP_PORT}"
                - name: "camel.component.google-pubsub.authenticate"
                  value: "false"

  # The message goes on unchanged, with the ID that Pub/Sub gave it
  - http:
      server: "gcpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "X-Message-Id"
              value: '@matches([0-9]+)@'
          body:
            data: 'Hello Pub/Sub'
  - http:
      server: "gcpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # The subscription has the message: the body, in base64, and the header origin as an attribute
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_GCP_HOST}:${CITRUS_TESTCONTAINERS_GCP_PORT}"
      sendRequest:
        POST:
          path: "/v1/projects/kamelets/subscriptions/orders-sub:pull"
          contentType: "application/json"
          body:
            data: '{"maxMessages":10}'
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_GCP_HOST}:${CITRUS_TESTCONTAINERS_GCP_PORT}"
      receiveResponse:
        response:
          status: 200
          type: "json"
          body:
            data: '{"receivedMessages":[{"ackId":"@ignore@","message":{"messageId":"@ignore@","data":"SGVsbG8gUHViL1N1Yg==","attributes":{"origin":"citrus"}}}]}'
