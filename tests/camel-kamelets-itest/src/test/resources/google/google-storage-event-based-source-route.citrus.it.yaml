name: google-storage-event-based-source-route-test
description: 'google-storage-event-based-source gets the notification of a new file from Pub/Sub, and with getObject its content'
actions:
  # Start the Floci GCP emulator, which serves Pub/Sub, Cloud Storage and BigQuery on one port, without logging in
  - testcontainers:
      start:
        container:
          name: "gcp"
          image: "floci/floci-gcp:0.12.0"
          autoRemove: true
          startUpTimeout: 120
          exposedPorts:
            - 4588
          waitFor:
            logMessage: '.*Listening on.*'

  # The bucket kamelets-orders, whose notifications go to the topic events
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_GCP_HOST}:${CITRUS_TESTCONTAINERS_GCP_PORT}"
      sendRequest:
        POST:
          path: "/storage/v1/b"
          contentType: "application/json"
          parameters:
            - name: "project"
              value: 'kamelets'
          body:
            data: '{"name":"kamelets-orders"}'
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_GCP_HOST}:${CITRUS_TESTCONTAINERS_GCP_PORT}"
      receiveResponse:
        response:
          status: 200

  - http:
      client: "http://${CITRUS_TESTCONTAINERS_GCP_HOST}:${CITRUS_TESTCONTAINERS_GCP_PORT}"
      sendRequest:
        PUT:
          path: "/v1/projects/kamelets/topics/events"
          contentType: "application/json"
          body:
            data: '{}'
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_GCP_HOST}:${CITRUS_TESTCONTAINERS_GCP_PORT}"
      receiveResponse:
        response:
          status: 200

  - http:
      client: "http://${CITRUS_TESTCONTAINERS_GCP_HOST}:${CITRUS_TESTCONTAINERS_GCP_PORT}"
      sendRequest:
        PUT:
          path: "/v1/projects/kamelets/subscriptions/events-sub"
          contentType: "application/json"
          body:
            data: '{"topic":"projects/kamelets/topics/events"}'
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_GCP_HOST}:${CITRUS_TESTCONTAINERS_GCP_PORT}"
      receiveResponse:
        response:
          status: 200

  - http:
      client: "http://${CITRUS_TESTCONTAINERS_GCP_HOST}:${CITRUS_TESTCONTAINERS_GCP_PORT}"
      sendRequest:
        POST:
          path: "/storage/v1/b/kamelets-orders/notificationConfigs"
          contentType: "application/json"
          body:
            data: '{"topic":"projects/kamelets/topics/events","payload_format":"JSON_API_V1"}'
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_GCP_HOST}:${CITRUS_TESTCONTAINERS_GCP_PORT}"
      receiveResponse:
        response:
          status: 200

  # A new file
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_GCP_HOST}:${CITRUS_TESTCONTAINERS_GCP_PORT}"
      sendRequest:
        POST:
          path: "/upload/storage/v1/b/kamelets-orders/o"
          contentType: "text/plain"
          parameters:
            - name: "uploadType"
              value: 'media'
            - name: "name"
              value: 'in/order-1.txt'
          body:
            data: 'Hello Cloud Storage'
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_GCP_HOST}:${CITRUS_TESTCONTAINERS_GCP_PORT}"
      receiveResponse:
        response:
          status: 200

  # Create Camel JBang integration. The Pub/Sub and the Cloud Storage clients go to the emulator without logging in.
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "google/google-storage-event-based-source-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${gcp.server.port}"
                - name: "gcp.url"
                  value: "http://${CITRUS_TESTCONTAINERS_GCP_HOST}:${CITRUS_TESTCONTAINERS_GCP_PORT}"
                - name: "gcp.projectId"
                  value: "kamelets"
                - name: "gcp.serviceAccountKey"
                  value: "e30="
                - name: "camel.component.google-pubsub.endpoint"
                  value: "${CITRUS_TESTCONTAINERS_GCP_HOST}:${CITRUS_TESTCONTAINERS_GCP_PORT}"
                - name: "camel.component.google-pubsub.authenticate"
                  value: "false"
          resources:
            - "GoogleStorageClient.java"

  # The content of the new file, as bytes, with the event type, the names of the file and the bucket, and its content type
  - http:
      server: "gcpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: '[B'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "X-Event-Type"
              value: 'OBJECT_FINALIZE'
            - name: "X-Object-Id"
              value: 'in/order-1.txt'
            - name: "X-Bucket-Id"
              value: 'kamelets-orders'
            - name: "X-Object-Content-Type"
              value: 'text/plain'
            - name: "X-Object-Name"
              value: 'name='
            - name: "X-Bucket-Name"
              value: 'bucket='
          body:
            data: 'Hello Cloud Storage'
  - http:
      server: "gcpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
