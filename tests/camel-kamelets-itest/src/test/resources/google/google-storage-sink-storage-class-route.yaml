- route:
    from:
      uri: "timer:send"
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            constant: 'Hello Cloud Storage'
        - setHeader:
            name: file
            constant: 'orders/order-1.txt'
        - to:
            uri: "kamelet:google-storage-sink"
            parameters:
              bucketNameOrArn: 'kamelets-orders'
              storageClass: 'COLDLINE'
              serviceAccountKey: '{{gcp.serviceAccountKey}}'
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        # the HTTP server reads an application/octet-stream body as bytes: send the body as text
        - removeHeader:
            name: Content-Type
        - setHeader:
            name: X-Storage-Class
            simple: "${body.getStorageClass()}"
        - setHeader:
            name: X-Object-Name
            simple: "${header.CamelGoogleCloudStorageObjectName}"
        # the body describes the file: its name and size, as text for the HTTP call
        - setBody:
            simple: "${body.getName()} size=${body.getSize()}"
        - to:
            uri: "{{http.sink.url}}/result"
        # read the file back, to show what arrived
        - to:
            uri: "google-storage://kamelets-orders"
            parameters:
              operation: getObject
              objectName: 'orders/order-1.txt'
        - convertBodyTo:
            type: "java.lang.String"
        - log:
            message: 'Read back orders/order-1.txt: ${body} storageClass=${header.CamelGoogleCloudStorageStorageClass}'
