- route:
    from:
      uri: "kamelet:google-storage-event-based-source"
      parameters:
        projectId: '{{gcp.projectId}}'
        subscriptionName: 'events-sub'
        bucketNameOrArn: 'kamelets-orders'
        getObject: 'true'
        serviceAccountKey: '{{gcp.serviceAccountKey}}'
      steps:
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - setHeader:
            name: X-Event-Type
            simple: "${header.eventType}"
        - setHeader:
            name: X-Object-Id
            simple: "${header.objectId}"
        - setHeader:
            name: X-Bucket-Id
            simple: "${header.bucketId}"
        - setHeader:
            name: X-Event-Id
            simple: "${header[google-storage-event-id]}"
        - setHeader:
            name: X-Object-Content-Type
            simple: "${header.CamelGoogleCloudStorageContentType}"
        - setHeader:
            name: X-Object-Name
            simple: "name=${header.CamelGoogleCloudStorageObjectName}"
        - setHeader:
            name: X-Bucket-Name
            simple: "bucket=${header.CamelGoogleCloudStorageBucketName}"
        # the body as text, for the HTTP call
        - convertBodyTo:
            type: "java.lang.String"
        - to:
            uri: "{{http.sink.url}}/result"
