name: google-storage-sink-route-test
description: 'google-storage-sink uploads the body to the bucket, named by the file header'
actions:
  # Start the Floci GCP emulator, which serves Pub/Sub, Cloud Storage and BigQuery on one port, without logging in
  - testcontainers:
      start:
        container:
          name: "gcp"
          image: "floci/floci-gcp:0.12.0"
          autoRemove: true
          startUpTimeout: 120
          exposedPorts:
            - 4588
          waitFor:
            logMessage: '.*Listening on.*'

  # The bucket kamelets-orders
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_GCP_HOST}:${CITRUS_TESTCONTAINERS_GCP_PORT}"
      sendRequest:
        POST:
          path: "/storage/v1/b"
          contentType: "application/json"
          parameters:
            - name: "project"
              value: 'kamelets'
          body:
            data: '{"name":"kamelets-orders"}'
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_GCP_HOST}:${CITRUS_TESTCONTAINERS_GCP_PORT}"
      receiveResponse:
        response:
          status: 200

  # Create Camel JBang integration
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "google/google-storage-sink-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${gcp.server.port}"
                - name: "gcp.url"
                  value: "http://${CITRUS_TESTCONTAINERS_GCP_HOST}:${CITRUS_TESTCONTAINERS_GCP_PORT}"
                - name: "gcp.projectId"
                  value: "kamelets"
                - name: "gcp.serviceAccountKey"
                  value: "e30="
          resources:
            - "GoogleStorageClient.java"

  # Afterwards the body describes the uploaded file, and CamelGoogleCloudStorageObjectName gives its name
  - http:
      server: "gcpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'com.google.cloud.storage.Blob'
            - name: "X-Content-Type"
              value: 'ct=application/octet-stream'
            - name: "X-Object-Name"
              value: 'orders/order-1.txt'
          body:
            data: 'orders/order-1.txt size=19'
  - http:
      server: "gcpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # The file holds the body
  - camel:
      cli:
        verify:
          integration: "google-storage-sink-route"
          logMessage: 'Read back orders/order-1.txt: Hello Cloud Storage'
          maxAttempts: 30
          delayBetweenAttempts: 1000
