- route:
    from:
      uri: "timer:tick"
      parameters:
        period: "1000"
        repeatCount: 1
      steps:
        # a text message to the chat of the chatId option; the CamelTelegramChatId header is removed by the Kamelet
        - setBody:
            constant: 'Order ORD-1 has shipped'
        - setHeader:
            name: CamelTelegramChatId
            constant: '999'
        - to:
            uri: "kamelet:telegram-sink"
            parameters:
              authorizationToken: '{{telegram.token}}'
              chatId: '-100123'
        # what the Kamelet leaves: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - to:
            uri: "{{http.sink.url}}/result"
        # a photo, by its Content-Type, to the chat of the chat-id header, with the text header as its caption
        - removeHeaders:
            pattern: "X-*"
        - setBody:
            constant: 'PNG image bytes'
        - setHeader:
            name: Content-Type
            constant: 'image/png'
        - setHeader:
            name: chat-id
            constant: '4711'
        - setHeader:
            name: text
            constant: 'The parcel'
        - to:
            uri: "kamelet:telegram-sink"
            parameters:
              authorizationToken: '{{telegram.token}}'
              chatId: '-100123'
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - to:
            uri: "{{http.sink.url}}/result"
