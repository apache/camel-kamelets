- route:
    from:
      uri: "timer:tick"
      parameters:
        period: "1000"
        repeatCount: 1
      steps:
        - setBody:
            constant: '{"name":"Ann","items":[{"price":2},{"price":3}]}'
        - to:
            uri: "kamelet:jolt-transformation-action"
            parameters:
              template: 'classpath:order-jolt.json'
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - to:
            uri: "kamelet:json-serialize-action"
        - to:
            uri: "{{http.sink.url}}/result"

        # A Jackson JsonNode is not read: the body becomes empty (null), with no error
        - removeHeaders:
            pattern: "*"
        - setBody:
            constant: '{"name":"Ann","items":[{"price":2},{"price":3}]}'
        - to:
            uri: "kamelet:json-deserialize-action"
        - to:
            uri: "kamelet:jolt-transformation-action"
            parameters:
              template: 'classpath:order-jolt.json'
        - setHeader:
            name: X-Body-Null
            groovy: "body == null"
        # without a body the HTTP call would be a GET
        - setHeader:
            name: CamelHttpMethod
            constant: POST
        - to:
            uri: "{{http.sink.url}}/json-node"

        # With json-serialize-action before it, the JsonNode is read as JSON text
        - removeHeaders:
            pattern: "*"
        - setBody:
            constant: '{"name":"Ann","items":[{"price":2},{"price":3}]}'
        - to:
            uri: "kamelet:json-deserialize-action"
        - to:
            uri: "kamelet:json-serialize-action"
        - to:
            uri: "kamelet:jolt-transformation-action"
            parameters:
              template: 'classpath:order-jolt.json'
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - to:
            uri: "kamelet:json-serialize-action"
        - to:
            uri: "{{http.sink.url}}/json-node-serialized"
