name: solr-sink-route-test
actions:
  # Solr in standalone mode, with the core "kamelets" created at start
  - testcontainers:
      start:
        container:
          name: "solr"
          image: "solr:9.10.1-slim"
          command: "solr-precreate kamelets"
          startUpTimeout: 180
          exposedPorts:
            - 8983
          waitFor:
            url: "http://localhost:8983/solr/kamelets/admin/ping"

  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "solr/solr-sink-route.yaml"
            systemProperties:
              properties:
                - name: "solr.host"
                  value: "${CITRUS_TESTCONTAINERS_SOLR_HOST}"
                - name: "solr.port"
                  value: "${CITRUS_TESTCONTAINERS_SOLR_PORT}"
                - name: "http.sink.url"
                  value: "http://localhost:${search.server.port}"

  # the body afterwards is the answer of Solr, with its responseHeader
  - http:
      server: "searchServer"
      receiveRequest:
        POST:
          path: "/result"
          headers:
            - name: "X-Body-Type"
              value: 'org.apache.solr.common.util.SimpleOrderedMap'
            - name: "X-Content-Type"
              value: 'ct='
          body:
            data: '{"responseHeader":{"status":0,"QTime":"@ignore@"}}'
  - http:
      server: "searchServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # with autocommit, the document can be searched at once
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_SOLR_HOST}:${CITRUS_TESTCONTAINERS_SOLR_PORT}"
      sendRequest:
        GET:
          path: "/solr/kamelets/select"
          parameters:
            - name: "q"
              value: "id:order-1"
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_SOLR_HOST}:${CITRUS_TESTCONTAINERS_SOLR_PORT}"
      receiveResponse:
        response:
          status: 200
          body:
            data: '{"responseHeader":"@ignore@","response":{"numFound":1,"start":0,"numFoundExact":true,"docs":[{"id":"order-1","status_s":"shipped","_version_":"@ignore@","_root_":"order-1"}]}}'
