# Tab-separated values: csv-tab.properties sets the delimiter of both Kamelets to a tab,
# as a parameter of the Kamelet in a route cannot hold a tab
- route:
    from:
      uri: "timer:tab"
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            constant: "id\tname\n1\tAnn, A\n"
        - to: "kamelet:csv-deserialize-action"
        - log: "Tab rows ${body}"
        - to: "kamelet:csv-serialize-action"
        - log: "Tab text ${body.replace('\t', '<TAB>').replace('\r', '<CR>').replace('\n', '<LF>')}"
