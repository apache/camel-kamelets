name: csv-tab-test
actions:
  # A tab as delimiter, set as a property in csv-tab.properties: it cannot be given as a parameter of the Kamelet in a route
  - camel:
      cli:
        run:
          resources:
            - "csv-tab.properties"
          integration:
            file: "csv/csv-tab-route.yaml"
  - camel:
      cli:
        verify:
          integration: "csv-tab-route"
          logMessage: 'Tab rows [{id=1, name=Ann, A}]'
  - camel:
      cli:
        verify:
          integration: "csv-tab-route"
          logMessage: 'Tab text id<TAB>name<CR><LF>1<TAB>Ann, A<CR><LF>'
