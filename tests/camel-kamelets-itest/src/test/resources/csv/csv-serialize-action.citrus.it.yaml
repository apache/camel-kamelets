name: csv-serialize-action-test
actions:
  - camel:
      cli:
        run:
          integration:
            file: "csv/csv-serialize-action-route.yaml"
  # Round trip: the text, as a String, is the text that csv-deserialize-action read, and the Content-Type is text/csv
  - camel:
      cli:
        verify:
          integration: "csv-serialize-action-route"
          logMessage: 'Roundtrip java.lang.String ct=text/csv same=true: id,name,city<CR><LF>1,Zoë,"Oslo, Norway"<CR><LF>2,"Bob ""B""","line1<LF>line2"<CR><LF>'
  # A single Map: a header line of its keys and one row
  - camel:
      cli:
        verify:
          integration: "csv-serialize-action-route"
          logMessage: 'Map id,name<CR><LF>1,Ann<CR><LF>'
  # Given columns without a header line: their order, other keys left out, a missing key empty
  - camel:
      cli:
        verify:
          integration: "csv-serialize-action-route"
          logMessage: 'Columns Oslo,1<CR><LF>,2<CR><LF>'
  # List rows, the delimiter ; and the quote character ': no header line
  - camel:
      cli:
        verify:
          integration: "csv-serialize-action-route"
          logMessage: "Lists 1;'Ann;A'<CR><LF>2;Bob<CR><LF>"
  # Parsed JSON: the keys of the first row are the header line and the columns of all the rows; a nested object
  # is text, a null is empty, the keys the second row does not have are empty, and the key that only it has is
  # left out
  - camel:
      cli:
        verify:
          integration: "csv-serialize-action-route"
          logMessage: 'Json id,name,tags,note<CR><LF>1,Ann,{a=1},<CR><LF>2,Bob,,<CR><LF>'
  # Spaces around the names of columns are left out, and a name can hold a single quote
  - camel:
      cli:
        verify:
          integration: "csv-serialize-action-route"
          logMessage: "Spaces owner's name,id<CR><LF>Ann,1<CR><LF>"
  # An empty List: empty text, or only the header line with columns
  - camel:
      cli:
        verify:
          integration: "csv-serialize-action-route"
          logMessage: 'Empty [], with columns id,name<CR><LF>'
  # A body of text fails the message
  - camel:
      cli:
        verify:
          integration: "csv-serialize-action-route"
          logMessage: 'Rejected org.apache.camel.NoTypeConversionAvailableException: No type converter available to convert from type: java.lang.String to the required type: java.util.List'
