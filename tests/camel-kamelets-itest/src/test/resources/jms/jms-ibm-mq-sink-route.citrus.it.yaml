name: jms-ibm-mq-sink-route-test
description: 'jms-ibm-mq-sink sends a text message, with its headers as JMS properties, to a queue in IBM MQ'
actions:
  # Start IBM MQ
  - testcontainers:
      start:
        container:
          name: "ibmmq"
          image: "icr.io/ibm-messaging/mq:10.0.1.0-r1"
          autoRemove: true
          startUpTimeout: 300
          env:
            - name: "LICENSE"
              value: "accept"
            - name: "MQ_QMGR_NAME"
              value: "QM1"
            - name: "MQ_APP_PASSWORD"
              value: "passw0rd"
          exposedPorts:
            - 1414
          waitFor:
            logMessage: '.*AMQ5026I: The listener ''SYSTEM.LISTENER.TCP.1'' has started.*'

  # Create Camel JBang integration
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "jms/jms-ibm-mq-sink-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${http.server.port}"
                - name: "mq.host"
                  value: "${CITRUS_TESTCONTAINERS_IBMMQ_HOST}"
                - name: "mq.port"
                  value: "${CITRUS_TESTCONTAINERS_IBMMQ_PORT}"

  # The message goes on unchanged after the Kamelet
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "origin"
              value: 'citrus'
          body:
            data: 'Hello IBM MQ'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # The message is on the queue: persistent (delivery mode 2), with priority 4 and the header as a JMS property
  - camel:
      cli:
        verify:
          integration: "jms-ibm-mq-sink-route"
          logMessage: 'Received from the queue: Hello IBM MQ (origin=citrus, JMSPriority=4, JMSDeliveryMode=2)'
          maxAttempts: 30
          delayBetweenAttempts: 1000
