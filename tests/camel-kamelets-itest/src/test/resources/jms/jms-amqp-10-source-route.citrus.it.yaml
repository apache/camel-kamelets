name: jms-amqp-10-source-route-test
description: 'jms-amqp-10-source receives a text message, with its JMS properties and JMS headers as headers, from a queue in Artemis'
actions:
  # Start Artemis
  - testcontainers:
      start:
        container:
          name: "artemis"
          image: "apache/activemq-artemis:2.44.0"
          autoRemove: true
          startUpTimeout: 180
          exposedPorts:
            - 61616
          waitFor:
            logMessage: '.*AMQ221007: Server is now active.*'

  # Create Camel JBang integration
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "jms/jms-amqp-10-source-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${http.server.port}"
                - name: "amqp.remote.uri"
                  value: "amqp://${CITRUS_TESTCONTAINERS_ARTEMIS_HOST}:${CITRUS_TESTCONTAINERS_ARTEMIS_PORT}"

  # The source gives the text, the JMS property and the JMS headers
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "origin"
              value: 'citrus'
            - name: "JMSMessageID"
              value: '@notEmpty()@'
            - name: "JMSDestination"
              value: 'orders'
            - name: "JMSTimestamp"
              value: '@matches([0-9]+)@'
            - name: "JMSPriority"
              value: '4'
            - name: "JMSRedelivered"
              value: 'false'
          body:
            data: 'Hello AMQP'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
