name: jms-ibm-mq-source-route-test
description: 'jms-ibm-mq-source receives a text message, with its JMS properties and JMS headers as headers, from a queue in IBM MQ'
actions:
  # Start IBM MQ
  - testcontainers:
      start:
        container:
          name: "ibmmq"
          image: "icr.io/ibm-messaging/mq:10.0.1.0-r1"
          autoRemove: true
          startUpTimeout: 300
          env:
            - name: "LICENSE"
              value: "accept"
            - name: "MQ_QMGR_NAME"
              value: "QM1"
            - name: "MQ_APP_PASSWORD"
              value: "passw0rd"
          exposedPorts:
            - 1414
          waitFor:
            logMessage: '.*AMQ5026I: The listener ''SYSTEM.LISTENER.TCP.1'' has started.*'

  # Create Camel JBang integration
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "jms/jms-ibm-mq-source-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${http.server.port}"
                - name: "mq.host"
                  value: "${CITRUS_TESTCONTAINERS_IBMMQ_HOST}"
                - name: "mq.port"
                  value: "${CITRUS_TESTCONTAINERS_IBMMQ_PORT}"

  # The source gives the text, the JMS property and the JMS headers
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "origin"
              value: 'citrus'
            - name: "JMSMessageID"
              value: '@notEmpty()@'
            - name: "JMSDestination"
              value: 'queue:///DEV.QUEUE.1'
            - name: "JMSTimestamp"
              value: '@matches([0-9]+)@'
            - name: "JMSPriority"
              value: '4'
            - name: "JMSRedelivered"
              value: 'false'
            - name: "JMSXUserID"
              value: '@startsWith(''app'')@'
            - name: "JMS_IBM_Format"
              value: '@startsWith(''MQSTR'')@'
            - name: "JMS_IBM_PutDate"
              value: '@matches([0-9]{8})@'
          body:
            data: 'Hello IBM MQ'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
