# an application that sends requests and waits for the replies
- beans:
    - name: requester
      type: "org.apache.qpid.jms.JmsConnectionFactory"
      properties:
        remoteURI: '{{amqp.remote.uri}}'
        username: 'artemis'
        password: 'artemis'

- route:
    from:
      uri: "kamelet:jms-amqp-10-source"
      parameters:
        remoteURI: '{{amqp.remote.uri}}'
        destinationName: 'requests'
        username: 'artemis'
        password: 'artemis'
      steps:
        - setProperty:
            name: request
            simple: "${body}"
        - to:
            uri: "{{http.sink.url}}/request"
        # headers that name another queue: they must not change where the answer goes, nor make one
        - setHeader:
            name: JMSReplyTo
            constant: 'elsewhere'
        - setHeader:
            name: CamelJmsDestinationName
            constant: 'elsewhere'
        - setBody:
            simple: 'answer to ${exchangeProperty.request}'

# an application that sends requests: 1 and 3 wait for the answer on the queue replies, 2 expects none
- route:
    from:
      uri: "timer:send"
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            constant: 'request 1'
        - to:
            uri: "jms:queue:requests?connectionFactory=#requester&exchangePattern=InOut&replyTo=replies&requestTimeout=30000"
        - setHeader:
            name: X-Reply-To
            simple: "rt=${header.JMSReplyTo}"
        - to:
            uri: "{{http.sink.url}}/reply"
        - removeHeaders:
            pattern: '*'
        - setBody:
            constant: 'request 2'
        - to:
            uri: "jms:queue:requests?connectionFactory=#requester&exchangePattern=InOnly"
        - setBody:
            constant: 'request 3'
        - to:
            uri: "jms:queue:requests?connectionFactory=#requester&exchangePattern=InOut&replyTo=replies&requestTimeout=30000"
        - setHeader:
            name: X-Reply-To
            simple: "rt=${header.JMSReplyTo}"
        - to:
            uri: "{{http.sink.url}}/reply"
        # what reached the queue named by the headers of the flow
        - removeHeaders:
            pattern: '*'
        - setBody:
            constant: 'nothing'
        - pollEnrich:
            constant: "jms:queue:elsewhere?connectionFactory=#requester"
            timeout: 3000
        - setBody:
            simple: "${body} ?: 'nothing'"
        - to:
            uri: "{{http.sink.url}}/elsewhere"
