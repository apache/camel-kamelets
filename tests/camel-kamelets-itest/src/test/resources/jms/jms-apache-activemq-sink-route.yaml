- route:
    from:
      uri: "timer:send"
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            constant: 'Hello ActiveMQ'
        - setHeader:
            name: origin
            constant: 'citrus'
        # a header that would send the message to another queue: the Kamelet removes it
        - setHeader:
            name: CamelJmsDestinationName
            constant: 'elsewhere'
        - to:
            uri: "kamelet:jms-apache-activemq-sink"
            parameters:
              brokerURL: '{{classic.broker.url}}'
              destinationName: 'orders'
              username: 'amq'
              password: 'amqpass'
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - setHeader:
            name: X-Destination-Produced
            simple: "${header.CamelJMSDestinationProduced}"
        - to:
            uri: "{{http.sink.url}}/result"
        # the same message with a wrong password
        - removeHeaders:
            pattern: '*'
        - doTry:
            steps:
              - to:
                  uri: "kamelet:jms-apache-activemq-sink"
                  parameters:
                    brokerURL: '{{classic.broker.url}}'
                    destinationName: 'orders'
                    username: 'amq'
                    password: 'wrong'
            doCatch:
              - exception:
                  - java.lang.Exception
                steps:
                  - setBody:
                      simple: "${exception.message}"
                  - to:
                      uri: "{{http.sink.url}}/error"

# reads the message back from the queue, to show that it arrived
- route:
    from:
      uri: "kamelet:jms-apache-activemq-source"
      parameters:
        brokerURL: '{{classic.broker.url}}'
        destinationName: 'orders'
        username: 'amq'
        password: 'amqpass'
      steps:
        - log:
            message: 'Received from the queue: ${body} (origin=${header.origin}, JMSPriority=${header.JMSPriority}, JMSDeliveryMode=${header.JMSDeliveryMode}, JMSDestination=${header.JMSDestination})'
