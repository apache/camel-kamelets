name: jms-amqp-10-sink-route-test
description: 'jms-amqp-10-sink sends a text message, with its headers as JMS properties, to a queue in Artemis'
actions:
  # Start Artemis
  - testcontainers:
      start:
        container:
          name: "artemis"
          image: "apache/activemq-artemis:2.44.0"
          autoRemove: true
          startUpTimeout: 180
          exposedPorts:
            - 61616
          waitFor:
            logMessage: '.*AMQ221007: Server is now active.*'

  # Create Camel JBang integration
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "jms/jms-amqp-10-sink-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${http.server.port}"
                - name: "amqp.remote.uri"
                  value: "amqp://${CITRUS_TESTCONTAINERS_ARTEMIS_HOST}:${CITRUS_TESTCONTAINERS_ARTEMIS_PORT}"

  # The message goes on unchanged after the Kamelet
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "X-Destination-Produced"
              value: 'orders'
            - name: "origin"
              value: 'citrus'
          body:
            data: 'Hello AMQP'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # The message is on the queue: persistent (delivery mode 2), with priority 4 and the header as a JMS property
  - camel:
      cli:
        verify:
          integration: "jms-amqp-10-sink-route"
          logMessage: 'Received from the queue: Hello AMQP (origin=citrus, JMSPriority=4, JMSDeliveryMode=2)'
          maxAttempts: 30
          delayBetweenAttempts: 1000
