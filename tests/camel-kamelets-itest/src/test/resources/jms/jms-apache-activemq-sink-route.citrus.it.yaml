name: jms-apache-activemq-sink-route-test
description: 'jms-apache-activemq-sink sends a text message, with its headers as JMS properties, to a queue in ActiveMQ Classic, ignores a CamelJmsDestinationName header, and fails with a wrong password'
actions:
  # Start ActiveMQ Classic, with a login for the clients
  - testcontainers:
      start:
        container:
          name: "activemq"
          image: "apache/activemq-classic:6.2.0"
          autoRemove: true
          startUpTimeout: 180
          exposedPorts:
            - 61616
          env:
            - name: "ACTIVEMQ_CONNECTION_USER"
              value: "amq"
            - name: "ACTIVEMQ_CONNECTION_PASSWORD"
              value: "amqpass"
          waitFor:
            logMessage: '.*Apache ActiveMQ [0-9.]+ \(localhost, .*\) started.*'

  # Create Camel JBang integration
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "jms/jms-apache-activemq-sink-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${http.server.port}"
                - name: "classic.broker.url"
                  value: "tcp://${CITRUS_TESTCONTAINERS_ACTIVEMQ_HOST}:${CITRUS_TESTCONTAINERS_ACTIVEMQ_PORT}"

  # The message goes on unchanged after the Kamelet, to the queue of the Kamelet and not to the one in the header
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "X-Destination-Produced"
              value: 'orders'
            - name: "origin"
              value: 'citrus'
          body:
            data: 'Hello ActiveMQ'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # A wrong password makes the message fail
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/error"
          type: "plaintext"
          body:
            data: '@contains(User name [amq] or password is invalid)@'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # The message is on the queue: persistent (delivery mode 2), with priority 4 and the header as a JMS property
  - camel:
      cli:
        verify:
          integration: "jms-apache-activemq-sink-route"
          logMessage: 'Received from the queue: Hello ActiveMQ (origin=citrus, JMSPriority=4, JMSDeliveryMode=2, JMSDestination=queue://orders)'
          maxAttempts: 30
          delayBetweenAttempts: 1000
