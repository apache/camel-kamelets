name: jms-apache-activemq-source-transacted-route-test
description: 'jms-apache-activemq-source with transacted true receives a message again each time its flow fails, 7 times in all, and the broker then moves it to the dead letter queue ActiveMQ.DLQ'
actions:
  # Start ActiveMQ Classic, with a login for the clients
  - testcontainers:
      start:
        container:
          name: "activemq"
          image: "apache/activemq-classic:6.2.0"
          autoRemove: true
          startUpTimeout: 180
          exposedPorts:
            - 61616
          env:
            - name: "ACTIVEMQ_CONNECTION_USER"
              value: "amq"
            - name: "ACTIVEMQ_CONNECTION_PASSWORD"
              value: "amqpass"
          waitFor:
            logMessage: '.*Apache ActiveMQ [0-9.]+ \(localhost, .*\) started.*'

  # Create Camel JBang integration
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "jms/jms-apache-activemq-source-transacted-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${http.server.port}"
                - name: "classic.broker.url"
                  value: "tcp://${CITRUS_TESTCONTAINERS_ACTIVEMQ_HOST}:${CITRUS_TESTCONTAINERS_ACTIVEMQ_PORT}"

  # After the last attempt, the message is on the dead letter queue
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/dlq"
          type: "plaintext"
          headers:
            - name: "JMSDestination"
              value: 'queue://ActiveMQ.DLQ'
            - name: "dlqDeliveryFailureCause"
              value: '@contains(Delivery[7] exceeds redelivery policy limit)@'
          body:
            data: 'Hello ActiveMQ'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # The flow saw the message 7 times, the last 6 as a redelivery
  - camel:
      cli:
        verify:
          integration: "jms-apache-activemq-source-transacted-route"
          logMessage: 'Attempt 7: Hello ActiveMQ (JMSRedelivered=true)'
          maxAttempts: 30
          delayBetweenAttempts: 1000
