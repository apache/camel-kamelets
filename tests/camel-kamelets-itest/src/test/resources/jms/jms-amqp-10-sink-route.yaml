- route:
    from:
      uri: "timer:send"
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            constant: 'Hello AMQP'
        - setHeader:
            name: origin
            constant: 'citrus'
        - to:
            uri: "kamelet:jms-amqp-10-sink"
            parameters:
              remoteURI: '{{amqp.remote.uri}}'
              destinationName: 'orders'
              username: 'artemis'
              password: 'artemis'
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - setHeader:
            name: X-Destination-Produced
            simple: "${header.CamelJMSDestinationProduced}"
        - to:
            uri: "{{http.sink.url}}/result"

# reads the message back from the queue, to show that it arrived
- route:
    from:
      uri: "kamelet:jms-amqp-10-source"
      parameters:
        remoteURI: '{{amqp.remote.uri}}'
        destinationName: 'orders'
        username: 'artemis'
        password: 'artemis'
      steps:
        - log:
            message: 'Received from the queue: ${body} (origin=${header.origin}, JMSPriority=${header.JMSPriority}, JMSDeliveryMode=${header.JMSDeliveryMode})'
