name: jms-apache-activemq-topic-route-test
description: 'jms-apache-activemq-sink publishes a text message on a topic in ActiveMQ Classic, and jms-apache-activemq-source subscribed to the topic receives it'
actions:
  # Start ActiveMQ Classic, with a login for the clients
  - testcontainers:
      start:
        container:
          name: "activemq"
          image: "apache/activemq-classic:6.2.0"
          autoRemove: true
          startUpTimeout: 180
          exposedPorts:
            - 61616
          env:
            - name: "ACTIVEMQ_CONNECTION_USER"
              value: "amq"
            - name: "ACTIVEMQ_CONNECTION_PASSWORD"
              value: "amqpass"
          waitFor:
            logMessage: '.*Apache ActiveMQ [0-9.]+ \(localhost, .*\) started.*'

  # Create Camel JBang integration
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "jms/jms-apache-activemq-topic-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${http.server.port}"
                - name: "classic.broker.url"
                  value: "tcp://${CITRUS_TESTCONTAINERS_ACTIVEMQ_HOST}:${CITRUS_TESTCONTAINERS_ACTIVEMQ_PORT}"

  # The subscribed source gives the text, the header and the topic
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "origin"
              value: 'citrus'
            - name: "JMSDestination"
              value: 'topic://prices'
          body:
            data: 'Hello Topic'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

