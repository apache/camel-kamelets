name: jms-ibm-mq-source-reply-route-test
description: 'jms-ibm-mq-source sends the answer only to the JMSReplyTo of the incoming message, in IBM MQ: headers set in the flow neither send it to another queue nor make one for a message without JMSReplyTo'
actions:
  # Start IBM MQ
  - testcontainers:
      start:
        container:
          name: "ibmmq"
          image: "icr.io/ibm-messaging/mq:10.0.1.0-r1"
          autoRemove: true
          startUpTimeout: 300
          env:
            - name: "LICENSE"
              value: "accept"
            - name: "MQ_QMGR_NAME"
              value: "QM1"
            - name: "MQ_APP_PASSWORD"
              value: "passw0rd"
          exposedPorts:
            - 1414
          waitFor:
            logMessage: '.*AMQ5026I: The listener ''SYSTEM.LISTENER.TCP.1'' has started.*'

  # Create Camel JBang integration
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "jms/jms-ibm-mq-source-reply-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${http.server.port}"
                - name: "mq.host"
                  value: "${CITRUS_TESTCONTAINERS_IBMMQ_HOST}"
                - name: "mq.port"
                  value: "${CITRUS_TESTCONTAINERS_IBMMQ_PORT}"

  # Request 1 names a queue to reply to; the flow sets JMSReplyTo and CamelJmsDestinationName to another queue
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/request"
          type: "plaintext"
          body:
            data: 'request 1'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
  # The answer goes back to the JMSReplyTo of the request, with the JMSReplyTo of the request, not the one the flow set
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/reply"
          type: "plaintext"
          headers:
            - name: "X-Reply-To"
              value: '@contains(DEV.QUEUE.2)@'
          body:
            data: 'answer to request 1'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
  # Request 2 has no JMSReplyTo; the flow sets the same headers
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/request"
          type: "plaintext"
          body:
            data: 'request 2'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
  # Request 3 names a queue to reply to again, so request 2 is done
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/request"
          type: "plaintext"
          body:
            data: 'request 3'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
  # The answer to request 3
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/reply"
          type: "plaintext"
          headers:
            - name: "X-Reply-To"
              value: '@contains(DEV.QUEUE.2)@'
          body:
            data: 'answer to request 3'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
  # Nothing reached the queue named by the headers of the flow
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/elsewhere"
          type: "plaintext"
          body:
            data: 'nothing'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
