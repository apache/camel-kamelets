- route:
    from:
      uri: "kamelet:jms-apache-activemq-source"
      parameters:
        brokerURL: '{{classic.broker.url}}'
        destinationType: 'topic'
        destinationName: 'prices'
        username: 'amq'
        password: 'amqpass'
      steps:
        # a topic hands a message only to the receivers subscribed at that moment: the sender publishes until one arrives
        - to:
            uri: "controlbus:route"
            parameters:
              routeId: "publish"
              action: "stop"
              async: true
        - to:
            uri: "{{http.sink.url}}/result"

- route:
    id: publish
    from:
      uri: "timer:publish"
      parameters:
        period: 2000
      steps:
        - setBody:
            constant: 'Hello Topic'
        - setHeader:
            name: origin
            constant: 'citrus'
        - to:
            uri: "kamelet:jms-apache-activemq-sink"
            parameters:
              brokerURL: '{{classic.broker.url}}'
              destinationType: 'topic'
              destinationName: 'prices'
              username: 'amq'
              password: 'amqpass'
