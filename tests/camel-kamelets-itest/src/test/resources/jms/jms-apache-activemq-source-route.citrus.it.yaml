name: jms-apache-activemq-source-route-test
description: 'jms-apache-activemq-source receives a text message that matches its selector, with its JMS properties and JMS headers as headers, from a queue in ActiveMQ Classic'
actions:
  # Start ActiveMQ Classic, with a login for the clients
  - testcontainers:
      start:
        container:
          name: "activemq"
          image: "apache/activemq-classic:6.2.0"
          autoRemove: true
          startUpTimeout: 180
          exposedPorts:
            - 61616
          env:
            - name: "ACTIVEMQ_CONNECTION_USER"
              value: "amq"
            - name: "ACTIVEMQ_CONNECTION_PASSWORD"
              value: "amqpass"
          waitFor:
            logMessage: '.*Apache ActiveMQ [0-9.]+ \(localhost, .*\) started.*'

  # Create Camel JBang integration
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "jms/jms-apache-activemq-source-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${http.server.port}"
                - name: "classic.broker.url"
                  value: "tcp://${CITRUS_TESTCONTAINERS_ACTIVEMQ_HOST}:${CITRUS_TESTCONTAINERS_ACTIVEMQ_PORT}"

  # The source gives the text, the JMS property and the JMS headers, of the message that matches the selector only
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "region"
              value: 'EU'
            - name: "JMSMessageID"
              value: '@startsWith(ID:)@'
            - name: "JMSDestination"
              value: 'queue://orders'
            - name: "JMSTimestamp"
              value: '@matches([0-9]+)@'
            - name: "JMSPriority"
              value: '4'
            - name: "JMSRedelivered"
              value: 'false'
          body:
            data: 'Hello ActiveMQ'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

