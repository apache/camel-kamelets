name: snmp-source-route-test
description: 'snmp-source polls the OIDs of the oids option from an SNMP agent and gives their values as XML text'
actions:
  # an SNMP agent (Net-SNMP snmpd) that answers SNMP v1 and v2c with the community public, here over TCP,
  # as Testcontainers maps TCP ports only
  - testcontainers:
      start:
        container:
          name: "snmp"
          image: "polinux/snmpd:latest"
          command: "-Lo tcp:161 udp:161"
          startUpTimeout: 120
          exposedPorts:
            - 161
          waitFor:
            logMessage: '.*NET-SNMP version.*'

  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "snmp/snmp-source-route.yaml"
            systemProperties:
              properties:
                - name: "snmp.host"
                  value: "${CITRUS_TESTCONTAINERS_SNMP_HOST}"
                - name: "snmp.port"
                  value: "${CITRUS_TESTCONTAINERS_SNMP_PORT}"
                - name: "http.sink.url"
                  value: "http://localhost:${services.server.port}"

  # the values of sysLocation and sysContact, as the snmpd.conf of the image sets them, one entry per OID
  - http:
      server: "servicesServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Content-Type"
              value: 'ct='
          body:
            data: '<snmp><entry><oid>1.3.6.1.2.1.1.6.0</oid><value>Unknown (edit /etc/snmp/snmpd.conf)</value></entry><entry><oid>1.3.6.1.2.1.1.4.0</oid><value>Root &lt;root@localhost&gt; (configure /etc/snmp/snmp.local.conf)</value></entry></snmp>'
  - http:
      server: "servicesServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
