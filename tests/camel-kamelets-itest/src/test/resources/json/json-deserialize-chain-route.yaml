# json-deserialize-action leaves the message as application-x-struct (parsed JSON); the input type of the next
# Kamelet must still run, so value-to-key-action gives JSON text in bytes. Uses the Kamelet EIP.
- route:
    from:
      uri: "timer:tick"
      parameters:
        period: "1000"
        repeatCount: 1
      steps:
        - setBody:
            constant: '{"id":7,"customer":"acme","total":12}'
        - kamelet:
            name: "json-deserialize-action"
        - kamelet:
            name: "value-to-key-action?fields=id"
        # what the chain gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - setHeader:
            name: X-Kafka-Key
            simple: '${header.CamelKafkaKey}'
        - to:
            uri: "{{http.sink.url}}/result"
