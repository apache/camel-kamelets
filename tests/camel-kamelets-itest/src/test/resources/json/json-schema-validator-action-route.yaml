- route:
    from:
      uri: "timer:tick"
      parameters:
        period: "1000"
        repeatCount: 2
        includeMetadata: true
      steps:
        - choice:
            when:
              - simple: "${exchangeProperty.CamelTimerCounter} == 1"
                steps:
                  - setBody:
                      constant: '{"id":"ORD-1","qty":0}'
            otherwise:
              steps:
                - setBody:
                    constant: '{"id":"ORD-2","qty":2}'
        - to:
            uri: "kamelet:json-schema-validator-action"
            parameters:
              template: 'classpath:order-schema.json'
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - to:
            uri: "{{http.sink.url}}/result"
