name: json-serialize-action-route-test
actions:
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "json/json-serialize-action-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${http.server.port}"

  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          headers:
            - name: "X-Body-Type"
              value: '[B'
            - name: "X-Content-Type"
              value: 'ct=application/json'
          body:
            data: '{"name":"Ann","items":[{"price":2},{"price":3}]}'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # JSON text is kept as it is
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/json-text"
          type: "plaintext"
          body:
            data: '{"id":1}'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # Other text becomes one JSON string, in quotes
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/text"
          type: "plaintext"
          body:
            data: '"hello"'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
