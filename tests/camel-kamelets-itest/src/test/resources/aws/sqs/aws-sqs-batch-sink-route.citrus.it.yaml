name: aws-sqs-batch-sink-route-test
# The text is split at the separator, and each part becomes one SQS message
variables:
  - name: "aws.sqs.queueName"
    value: 'batch-queue'
actions:
  # Create AWS infrastructure (Floci container)
  - testcontainers:
      start:
        localstack:
          services:
            - "SQS"
          options:
            queues: "${aws.sqs.queueName}"
  - waitFor:
      http:
        url: "${CITRUS_TESTCONTAINERS_LOCALSTACK_SERVICE_URL}"

  - camel:
      cli:
        run:
          integration:
            file: "aws/sqs/aws-sqs-batch-sink-route.yaml"
            systemProperties:
              file: "aws/floci.properties"
              properties:
                - name: "aws.sqs.queueName"
                  value: "${aws.sqs.queueName}"

  # The body is the SendMessageBatchResponse
  - http:
      server: "awsSinkServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'software.amazon.awssdk.services.sqs.model.SendMessageBatchResponse'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "X-Successful"
              value: '3'
            - name: "X-Failed"
              value: '0'
          body:
            data: '3 sent'
  - http:
      server: "awsSinkServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          body:
            data: "OK"

  # The queue holds one message per part
  - http:
      client: "${CITRUS_TESTCONTAINERS_LOCALSTACK_SERVICE_URL}"
      sendRequest:
        POST:
          path: "/"
          contentType: "application/x-amz-json-1.0"
          headers:
            - name: "X-Amz-Target"
              value: "AmazonSQS.ReceiveMessage"
          body:
            data: '{"QueueUrl":"${CITRUS_TESTCONTAINERS_LOCALSTACK_SERVICE_URL}/000000000000/${aws.sqs.queueName}","MaxNumberOfMessages":10,"WaitTimeSeconds":5}'
  - http:
      client: "${CITRUS_TESTCONTAINERS_LOCALSTACK_SERVICE_URL}"
      receiveResponse:
        response:
          status: 200
        validate:
          - jsonPath:
              - expression: '$.Messages.length()'
                value: '3'
              - expression: '$.Messages[0].Body'
                value: 'one'
              - expression: '$.Messages[1].Body'
                value: 'two'
              - expression: '$.Messages[2].Body'
                value: 'three'
