name: aws-lambda-sink-async-route-test
# With invocationType Event, the function is called asynchronously: AWS Lambda queues the event and answers at
# once with status code 202 and no body. The Citrus HTTP server stands in for AWS Lambda.
actions:
  - camel:
      cli:
        run:
          integration:
            file: "aws/lambda/aws-lambda-sink-async-route.yaml"
            environment:
              variables:
                - name: "AWS_ENDPOINT_URL_LAMBDA"
                  value: "http://localhost:${aws.sink.server.port}"
            systemProperties:
              file: "aws/aws-stand-in.properties"

  # The call asks for an asynchronous invocation
  - http:
      server: "awsSinkServer"
      receiveRequest:
        POST:
          path: "/2015-03-31/functions/enrich-order/invocations"
          headers:
            - name: "X-Amz-Invocation-Type"
              value: "Event"
          body:
            data: '{"orderId":"A-1"}'
  - http:
      server: "awsSinkServer"
      sendResponse:
        response:
          status: 202
          reasonPhrase: "Accepted"
          version: "HTTP/1.1"

  # The status code is 202 and the body is empty
  - http:
      server: "awsSinkServer"
      receiveRequest:
        POST:
          path: "/result"
          headers:
            - name: "X-Status-Code"
              value: '202'
            - name: "X-Body"
              value: 'body='
  - http:
      server: "awsSinkServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          body:
            data: "OK"
