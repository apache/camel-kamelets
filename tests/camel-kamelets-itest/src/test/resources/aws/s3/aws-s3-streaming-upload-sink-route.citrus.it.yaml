name: aws-s3-streaming-upload-sink-route-test
# Two messages go into one file; the second one completes it
variables:
  - name: "aws.s3.bucketNameOrArn"
    value: 'streaming-bucket'
actions:
  # Create AWS infrastructure (Floci container)
  - testcontainers:
      start:
        localstack:
          services:
            - "S3"
          options:
            buckets: "${aws.s3.bucketNameOrArn}"
            s3ClientName: "s3StreamingClient"
  - waitFor:
      http:
        url: "${CITRUS_TESTCONTAINERS_LOCALSTACK_SERVICE_URL}"

  - camel:
      cli:
        run:
          integration:
            file: "aws/s3/aws-s3-streaming-upload-sink-route.yaml"
            systemProperties:
              file: "aws/floci.properties"
              properties:
                - name: "aws.s3.bucketNameOrArn"
                  value: "${aws.s3.bucketNameOrArn}"

  # The first message is added to the file, which is not uploaded yet
  - http:
      server: "awsSinkServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "X-ETag"
              value: 'etag='
            - name: "X-Response-Code"
              value: 'code='
          body:
            data: 'line 1;'
  - http:
      server: "awsSinkServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          body:
            data: "OK"

  # The second message completes the file, and gets its ETag
  - http:
      server: "awsSinkServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "X-ETag"
              value: '@matches(''etag=.+'')@'
            - name: "X-Response-Code"
              value: 'code=200'
          body:
            data: 'line 2;'
  - http:
      server: "awsSinkServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          body:
            data: "OK"

  # The file holds both messages
  - groovy:
      script:
        file: "aws/s3/verifyStreamingUpload.groovy"
