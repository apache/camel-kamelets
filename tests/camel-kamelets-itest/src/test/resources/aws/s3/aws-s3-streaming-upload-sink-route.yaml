- route:
    from:
      uri: "timer:tick"
      parameters:
        period: "1000"
        repeatCount: 2
        includeMetadata: true
      steps:
        - setBody:
            simple: 'line ${exchangeProperty.CamelTimerCounter};'
        - to:
            uri: "kamelet:aws-s3-streaming-upload-sink"
            parameters:
              bucketNameOrArn: "{{aws.s3.bucketNameOrArn}}"
              keyName: "logs/app.log"
              batchMessageNumber: "2"
              forcePathStyle: "true"
              accessKey: "{{aws.accessKey}}"
              secretKey: "{{aws.secretKey}}"
              region: "{{aws.region}}"
              overrideEndpoint: "true"
              uriEndpointOverride: "{{aws.uriEndpointOverride}}"
        # What the Kamelet leaves on the message
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - setHeader:
            name: X-ETag
            simple: 'etag=${header.CamelAwsS3ETag}'
        - to:
            uri: "{{http.sink.url}}/result"
