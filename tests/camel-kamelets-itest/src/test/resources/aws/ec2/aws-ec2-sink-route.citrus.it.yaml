name: aws-ec2-sink-route-test
# The status of the instance in the instanceIds header, and of no other instance
actions:
  # Create AWS infrastructure (Floci container)
  - testcontainers:
      start:
        localstack:
          services:
            - "EC2"
  - waitFor:
      http:
        url: "${CITRUS_TESTCONTAINERS_LOCALSTACK_SERVICE_URL}"

  # Two running instances
  - groovy:
      script:
        file: "aws/ec2/runInstances.groovy"

  - camel:
      cli:
        run:
          integration:
            file: "aws/ec2/aws-ec2-sink-route.yaml"
            systemProperties:
              file: "aws/floci.properties"
              properties:
                - name: "ec2.instanceId"
                  value: "${ec2.instanceId}"

  # The body is the DescribeInstanceStatusResponse of the one instance
  - http:
      server: "awsSinkServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'software.amazon.awssdk.services.ec2.model.DescribeInstanceStatusResponse'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "X-Count"
              value: '1'
            - name: "X-State"
              value: 'running'
            - name: "X-Instance-Status"
              value: 'ok'
          body:
            data: '${ec2.instanceId}'
  - http:
      server: "awsSinkServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          body:
            data: "OK"
