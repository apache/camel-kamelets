name: aws-ses-sink-route-test
# The body is sent as the text of an email to the address in the to header
actions:
  # Create AWS infrastructure (Floci container)
  - testcontainers:
      start:
        localstack:
          services:
            - "S3"
  - waitFor:
      http:
        url: "${CITRUS_TESTCONTAINERS_LOCALSTACK_SERVICE_URL}"

  # The sender must be verified
  - http:
      client: "${CITRUS_TESTCONTAINERS_LOCALSTACK_SERVICE_URL}"
      sendRequest:
        POST:
          path: "/"
          contentType: "application/x-www-form-urlencoded"
          body:
            data: 'Action=VerifyEmailIdentity&Version=2010-12-01&EmailAddress=shop@example.com'
  - http:
      client: "${CITRUS_TESTCONTAINERS_LOCALSTACK_SERVICE_URL}"
      receiveResponse:
        response:
          status: 200
          type: "plaintext"

  - camel:
      cli:
        run:
          integration:
            file: "aws/ses/aws-ses-sink-route.yaml"
            systemProperties:
              file: "aws/floci.properties"

  # The message is unchanged, with the ID of the email
  - http:
      server: "awsSinkServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "X-Message-Id"
              value: '@notEmpty()@'
          body:
            data: 'Your order ORD-1 has shipped'
  - http:
      server: "awsSinkServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          body:
            data: "OK"

  # The email that SES sent
  - http:
      client: "${CITRUS_TESTCONTAINERS_LOCALSTACK_SERVICE_URL}/_aws/ses"
      sendRequest:
        GET: {}
  - http:
      client: "${CITRUS_TESTCONTAINERS_LOCALSTACK_SERVICE_URL}/_aws/ses"
      receiveResponse:
        response:
          status: 200
        validate:
          - jsonPath:
              - expression: "$.messages.length()"
                value: "1"
              - expression: "$.messages[0].Source"
                value: "shop@example.com"
              - expression: "$.messages[0].Destination.ToAddresses[0]"
                value: "bob@example.com"
              - expression: "$.messages[0].Subject"
                value: "Order shipped"
              - expression: "$.messages[0].Body.text_part"
                value: "Your order ORD-1 has shipped"
