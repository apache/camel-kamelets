name: aws-polly-sink-route-test
# The text is turned into speech, and the audio becomes the body. Floci does not emulate Amazon Polly: the Citrus HTTP
# server stands in for it.
actions:
  - camel:
      cli:
        run:
          integration:
            file: "aws/polly/aws-polly-sink-route.yaml"
            systemProperties:
              file: "aws/aws-stand-in.properties"

  # Polly is asked to speak the body with the voice of the option
  - http:
      server: "awsSinkServer"
      receiveRequest:
        POST:
          path: "/v1/speech"
          body:
            data: '{"OutputFormat":"mp3","Text":"Your order has shipped","TextType":"text","VoiceId":"Joanna"}'

  - http:
      server: "awsSinkServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          headers:
            - name: "Content-Type"
              value: 'audio/mpeg'
            - name: "x-amzn-RequestCharacters"
              value: '22'
          body:
            data: 'ID3 audio of the text'

  # The body is the audio, as a stream
  - http:
      server: "awsSinkServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'org.apache.camel.converter.stream.InputStreamCache'
            - name: "X-Content-Type"
              value: 'ct=text/plain'
            - name: "X-Audio-Type"
              value: 'audio/mpeg'
            - name: "X-Request-Characters"
              value: '22'
          body:
            data: 'ID3 audio of the text'
  - http:
      server: "awsSinkServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          body:
            data: "OK"
