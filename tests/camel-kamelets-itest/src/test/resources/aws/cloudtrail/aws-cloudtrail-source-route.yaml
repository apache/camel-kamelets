- route:
    from:
      # The ID of the route of the Kamelet, so that the route can stop it
      uri: "kamelet:aws-cloudtrail-source/cloudtrail-events"
      parameters:
        eventSource: "secretsmanager.amazonaws.com"
        accessKey: "{{aws.accessKey}}"
        secretKey: "{{aws.secretKey}}"
        region: "{{aws.region}}"
        overrideEndpoint: "true"
        uriEndpointOverride: "{{aws.uriEndpointOverride}}"
      steps:
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - setHeader:
            name: X-Event-Id
            simple: '${header.CamelAwsCloudTrailEventId}'
        - setHeader:
            name: X-Event-Name
            simple: '${header.CamelAwsCloudTrailEventName}'
        - setHeader:
            name: X-Event-Source
            simple: '${header.CamelAwsCloudTrailEventSource}'
        - setHeader:
            name: X-Username
            simple: '${header.CamelAwsCloudTrailEventUsername}'
        - convertBodyTo:
            type: String
        - to:
            uri: "{{http.sink.url}}/result"
        # The Citrus HTTP server answers one lookup only: stop looking up events
        - to:
            uri: "controlbus:route"
            parameters:
              routeId: "cloudtrail-events"
              action: "stop"
              async: true
