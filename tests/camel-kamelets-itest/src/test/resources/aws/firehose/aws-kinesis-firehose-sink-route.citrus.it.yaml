name: aws-kinesis-firehose-sink-route-test
# The record goes through a delivery stream into an S3 bucket
actions:
  # Create AWS infrastructure (Floci container)
  - testcontainers:
      start:
        localstack:
          services:
            - "S3"
          options:
            buckets: "firehose-bucket"
            s3ClientName: "firehoseS3Client"
  - waitFor:
      http:
        url: "${CITRUS_TESTCONTAINERS_LOCALSTACK_SERVICE_URL}"

  # A delivery stream that writes to the bucket every second
  - http:
      client: "${CITRUS_TESTCONTAINERS_LOCALSTACK_SERVICE_URL}"
      sendRequest:
        POST:
          path: "/"
          contentType: "application/x-amz-json-1.1"
          headers:
            - name: "X-Amz-Target"
              value: "Firehose_20150804.CreateDeliveryStream"
          body:
            data: '{"DeliveryStreamName":"orders-stream","DeliveryStreamType":"DirectPut","ExtendedS3DestinationConfiguration":{"BucketARN":"arn:aws:s3:::firehose-bucket","RoleARN":"arn:aws:iam::000000000000:role/firehose","Prefix":"orders/","BufferingHints":{"IntervalInSeconds":1,"SizeInMBs":1}}}'
  - http:
      client: "${CITRUS_TESTCONTAINERS_LOCALSTACK_SERVICE_URL}"
      receiveResponse:
        response:
          status: 200

  - camel:
      cli:
        run:
          integration:
            file: "aws/firehose/aws-kinesis-firehose-sink-route.yaml"
            systemProperties:
              file: "aws/floci.properties"

  # The message is unchanged, with the ID of the record
  - http:
      server: "awsSinkServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "X-Record-Id"
              value: '@notEmpty()@'
          body:
            data: 'order ORD-1'
  - http:
      server: "awsSinkServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          body:
            data: "OK"

  # Firehose delivers the record to the bucket within a few seconds
  - repeatOnError:
      until: "i > 30"
      autoSleep: 1000
      actions:
        - groovy:
            script:
              file: "aws/firehose/verifyDelivery.groovy"
