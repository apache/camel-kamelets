name: aws-timestream-query-sink-route-test
# The query in the query header is run, and the answer becomes the body. Floci does not emulate Timestream queries:
# the Citrus HTTP server stands in for it.
actions:
  - camel:
      cli:
        run:
          integration:
            file: "aws/timestream/aws-timestream-query-sink-route.yaml"
            systemProperties:
              file: "aws/aws-stand-in.properties"

  # The query of the header is run
  - http:
      server: "awsSinkServer"
      receiveRequest:
        POST:
          path: "/"
          headers:
            - name: "X-Amz-Target"
              value: 'Timestream_20181101.Query'
        validate:
          - jsonPath:
              - expression: '$.QueryString'
                value: 'SELECT sensor, temperature FROM sensors.readings'

  - http:
      server: "awsSinkServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          headers:
            - name: "Content-Type"
              value: 'application/x-amz-json-1.0'
          body:
            data: '{"QueryId":"query-1","Rows":[{"Data":[{"ScalarValue":"sensor-1"},{"ScalarValue":"21.5"}]}],"ColumnInfo":[{"Name":"sensor","Type":{"ScalarType":"VARCHAR"}},{"Name":"temperature","Type":{"ScalarType":"DOUBLE"}}]}'

  # The body is the QueryResponse
  - http:
      server: "awsSinkServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'software.amazon.awssdk.services.timestreamquery.model.QueryResponse'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "X-Rows"
              value: '1'
            - name: "X-Column"
              value: 'temperature'
          body:
            data: '21.5'
  - http:
      server: "awsSinkServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          body:
            data: "OK"
