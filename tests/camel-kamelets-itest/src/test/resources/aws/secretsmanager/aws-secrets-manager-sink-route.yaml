- route:
    from:
      uri: "timer:tick"
      parameters:
        period: "1000"
        repeatCount: 1
      steps:
        - setHeader:
            name: secret-name
            constant: 'db-password'
        - setBody:
            constant: 's3cr3t'
        - to:
            uri: "kamelet:aws-secrets-manager-sink"
            parameters:
              accessKey: "{{aws.accessKey}}"
              secretKey: "{{aws.secretKey}}"
              region: "{{aws.region}}"
              overrideEndpoint: "true"
              uriEndpointOverride: "{{aws.uriEndpointOverride}}"
        # What the Kamelet leaves on the message
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - setHeader:
            name: X-Secret-Name
            simple: '${body.name()}'
        - setHeader:
            name: X-Secret-Arn
            simple: '${body.arn()}'
        - setBody:
            constant: 'created'
        - to:
            uri: "{{http.sink.url}}/result"
