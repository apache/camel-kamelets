name: aws-secrets-manager-sink-route-test
# The body becomes the value of a new secret, named by the secret-name header
actions:
  # Create AWS infrastructure (Floci container)
  - testcontainers:
      start:
        localstack:
          services:
            - "SECRETS_MANAGER"
  - waitFor:
      http:
        url: "${CITRUS_TESTCONTAINERS_LOCALSTACK_SERVICE_URL}"

  # The calls reach Floci through uriEndpointOverride
  - camel:
      cli:
        run:
          integration:
            file: "aws/secretsmanager/aws-secrets-manager-sink-route.yaml"
            systemProperties:
              file: "aws/floci.properties"

  # The body is the CreateSecretResponse
  - http:
      server: "awsSinkServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'software.amazon.awssdk.services.secretsmanager.model.CreateSecretResponse'
            - name: "X-Content-Type"
              value: 'ct=text/plain'
            - name: "X-Secret-Name"
              value: 'db-password'
            - name: "X-Secret-Arn"
              value: '@startsWith(''arn:aws:secretsmanager:'')@'
          body:
            data: 'created'
  - http:
      server: "awsSinkServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          body:
            data: "OK"

  # The secret has the body as its value
  - http:
      client: "${CITRUS_TESTCONTAINERS_LOCALSTACK_SERVICE_URL}"
      sendRequest:
        POST:
          path: "/"
          contentType: "application/x-amz-json-1.1"
          headers:
            - name: "X-Amz-Target"
              value: "secretsmanager.GetSecretValue"
          body:
            data: '{"SecretId":"db-password"}'
  - http:
      client: "${CITRUS_TESTCONTAINERS_LOCALSTACK_SERVICE_URL}"
      receiveResponse:
        response:
          status: 200
        validate:
          - jsonPath:
              - expression: '$.Name'
                value: 'db-password'
              - expression: '$.SecretString'
                value: 's3cr3t'
