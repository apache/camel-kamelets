name: aws-comprehend-sink-route-test
# The dominant language of the text, in the body and the headers
actions:
  # Create AWS infrastructure (Floci container)
  - testcontainers:
      start:
        localstack:
          services:
            - "S3"
  - waitFor:
      http:
        url: "${CITRUS_TESTCONTAINERS_LOCALSTACK_SERVICE_URL}"

  - camel:
      cli:
        run:
          integration:
            file: "aws/comprehend/aws-comprehend-sink-route.yaml"
            systemProperties:
              file: "aws/floci.properties"

  # The body is a List of DominantLanguage objects
  - http:
      server: "awsSinkServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'java.util.Collections$UnmodifiableRandomAccessList'
            - name: "X-Content-Type"
              value: 'ct=text/plain'
            - name: "X-Language"
              value: 'en'
            - name: "X-Score"
              value: '@notEmpty()@'
          body:
            data: 'en'
  - http:
      server: "awsSinkServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          body:
            data: "OK"
