name: aws-bedrock-agent-sink-route-test
# An ingestion job of the data source is started, and its ID becomes the body. Floci does not emulate Bedrock
# knowledge bases: the Citrus HTTP server stands in for them.
actions:
  - camel:
      cli:
        run:
          integration:
            file: "aws/bedrock/aws-bedrock-agent-sink-route.yaml"
            systemProperties:
              file: "aws/aws-stand-in.properties"

  # An ingestion job is started for the knowledge base and the data source of the options
  - http:
      server: "awsSinkServer"
      receiveRequest:
        PUT:
          path: "/knowledgebases/KB12345678/datasources/DS12345678/ingestionjobs/"
        validate:
          - jsonPath:
              - expression: '$.clientToken'
                value: '@notEmpty()@'

  - http:
      server: "awsSinkServer"
      sendResponse:
        response:
          status: 202
          reasonPhrase: "Accepted"
          version: "HTTP/1.1"
          headers:
            - name: "Content-Type"
              value: 'application/json'
          body:
            data: '{"ingestionJob":{"ingestionJobId":"JOB1234567","knowledgeBaseId":"KB12345678","dataSourceId":"DS12345678","status":"STARTING","startedAt":"2026-01-01T10:00:00Z","updatedAt":"2026-01-01T10:00:00Z"}}'

  # The body is the ID of the job
  - http:
      server: "awsSinkServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Content-Type"
              value: 'ct='
          body:
            data: 'JOB1234567'
  - http:
      server: "awsSinkServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          body:
            data: "OK"
