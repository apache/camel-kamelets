- route:
    from:
      uri: "timer:tick"
      parameters:
        period: "1000"
        repeatCount: 1
      steps:
        - setBody:
            constant: 'How long can I return an item?'
        - to:
            uri: "kamelet:aws-bedrock-agent-runtime-sink"
            parameters:
              knowledgeBaseId: "KB12345678"
              modelId: "arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-text-express-v1"
              accessKey: "{{aws.accessKey}}"
              secretKey: "{{aws.secretKey}}"
              region: "{{aws.region}}"
              overrideEndpoint: "true"
              uriEndpointOverride: "{{aws.uriEndpointOverride}}"
        # What the Kamelet leaves on the message
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - setHeader:
            name: X-Session-Id
            simple: '${header.CamelAwsBedrockAgentRuntimeSessionId}'
        - setHeader:
            name: X-Citation
            simple: '${header.CamelAwsBedrockAgentRuntimeCitations[0].retrievedReferences()[0].content().text()}'
        - to:
            uri: "{{http.sink.url}}/result"
