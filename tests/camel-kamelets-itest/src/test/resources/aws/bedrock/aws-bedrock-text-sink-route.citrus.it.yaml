name: aws-bedrock-text-sink-route-test
# The body is the request of the model, and the answer of the model becomes the body. The Citrus HTTP server stands in
# for Bedrock, to check the request: Floci gives the same stub answer for every model and request.
actions:
  - camel:
      cli:
        run:
          integration:
            file: "aws/bedrock/aws-bedrock-text-sink-route.yaml"
            systemProperties:
              file: "aws/aws-stand-in.properties"

  # The model of the option is called with the body, as JSON
  - http:
      server: "awsSinkServer"
      receiveRequest:
        POST:
          path: "/model/amazon.titan-text-express-v1/invoke"
          headers:
            - name: "Content-Type"
              value: '@startsWith(''application/json'')@'
            - name: "Accept"
              value: 'application/json'
          body:
            data: '{"inputText":"Summarize: the order ORD-1 has shipped","textGenerationConfig":{"maxTokenCount":50}}'

  - http:
      server: "awsSinkServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          headers:
            - name: "Content-Type"
              value: 'application/json'
          body:
            data: '{"inputTextTokenCount":9,"results":[{"tokenCount":5,"outputText":"Order ORD-1 shipped.","completionReason":"FINISH"}]}'

  # The body is the answer of the model, as JSON text
  - http:
      server: "awsSinkServer"
      receiveRequest:
        POST:
          path: "/result"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Content-Type"
              value: 'ct='
          body:
            data: '{"inputTextTokenCount":9,"results":[{"tokenCount":5,"outputText":"Order ORD-1 shipped.","completionReason":"FINISH"}]}'
  - http:
      server: "awsSinkServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          body:
            data: "OK"
