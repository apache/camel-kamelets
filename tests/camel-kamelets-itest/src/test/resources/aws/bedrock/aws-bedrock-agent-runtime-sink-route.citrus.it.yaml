name: aws-bedrock-agent-runtime-sink-route-test
# The question in the body is answered from the knowledge base. Floci does not emulate Bedrock knowledge bases: the
# Citrus HTTP server stands in for them.
actions:
  - camel:
      cli:
        run:
          integration:
            file: "aws/bedrock/aws-bedrock-agent-runtime-sink-route.yaml"
            systemProperties:
              file: "aws/aws-stand-in.properties"

  # The question is asked of the knowledge base, with the model of the options
  - http:
      server: "awsSinkServer"
      receiveRequest:
        POST:
          path: "/retrieveAndGenerate"
        validate:
          - jsonPath:
              - expression: '$.input.text'
                value: 'How long can I return an item?'
              - expression: '$.retrieveAndGenerateConfiguration.type'
                value: 'KNOWLEDGE_BASE'
              - expression: '$.retrieveAndGenerateConfiguration.knowledgeBaseConfiguration.knowledgeBaseId'
                value: 'KB12345678'
              - expression: '$.retrieveAndGenerateConfiguration.knowledgeBaseConfiguration.modelArn'
                value: 'arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-text-express-v1'

  - http:
      server: "awsSinkServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          headers:
            - name: "Content-Type"
              value: 'application/json'
          body:
            data: '{"output":{"text":"Items can be returned within 30 days."},"sessionId":"session-1","citations":[{"generatedResponsePart":{"textResponsePart":{"text":"Items can be returned within 30 days.","span":{"start":0,"end":36}}},"retrievedReferences":[{"content":{"text":"Returns are accepted within 30 days of delivery."},"location":{"type":"S3","s3Location":{"uri":"s3://docs/returns.pdf"}}}]}]}'

  # The body is the answer, with the session and the passages it is based on in headers
  - http:
      server: "awsSinkServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Content-Type"
              value: 'ct=text/plain'
            - name: "X-Session-Id"
              value: 'session-1'
            - name: "X-Citation"
              value: 'Returns are accepted within 30 days of delivery.'
          body:
            data: 'Items can be returned within 30 days.'
  - http:
      server: "awsSinkServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          body:
            data: "OK"
