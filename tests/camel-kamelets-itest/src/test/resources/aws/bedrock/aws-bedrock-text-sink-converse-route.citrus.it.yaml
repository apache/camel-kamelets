name: aws-bedrock-text-sink-converse-route-test
# With operation converse, the body is the prompt as text, sent as one user message with the Converse API, together
# with the guardrail; the answer of the model, as text, becomes the body. The Citrus HTTP server stands in for Bedrock.
actions:
  - camel:
      cli:
        run:
          integration:
            file: "aws/bedrock/aws-bedrock-text-sink-converse-route.yaml"
            systemProperties:
              file: "aws/aws-stand-in.properties"

  # The Converse API of the model is called with the prompt and the guardrail
  - http:
      server: "awsSinkServer"
      receiveRequest:
        POST:
          path: "/model/amazon.titan-text-express-v1/converse"
          body:
            data: '{"messages":[{"role":"user","content":[{"text":"Summarize: the order ORD-1 has shipped"}]}],"guardrailConfig":{"guardrailIdentifier":"gr-orders","guardrailVersion":"1","trace":"enabled"}}'

  - http:
      server: "awsSinkServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          headers:
            - name: "Content-Type"
              value: 'application/json'
          body:
            data: '{"output":{"message":{"role":"assistant","content":[{"text":"Order ORD-1 shipped."}]}},"stopReason":"end_turn","usage":{"inputTokens":9,"outputTokens":5,"totalTokens":14},"metrics":{"latencyMs":120}}'

  # The body is the answer of the model, as text
  - http:
      server: "awsSinkServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Stop-Reason"
              value: 'end_turn'
          body:
            data: 'Order ORD-1 shipped.'
  - http:
      server: "awsSinkServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          body:
            data: "OK"
