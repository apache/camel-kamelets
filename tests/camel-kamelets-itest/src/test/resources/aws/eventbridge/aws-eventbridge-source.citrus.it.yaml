name: aws-eventbridge-source-test
# aws-eventbridge-source receives the event that the rule matches, as the whole EventBridge event in JSON text,
# and not the event that the rule does not match, which was put on the bus first
variables:
  - name: "aws.eventbridge.eventbusName"
    value: "orders"
  - name: "aws.eventbridge.ruleName"
    value: "orders-shipped"
  - name: "aws.eventbridge.eventSource"
    value: "com.example.shop"
actions:
  # Create AWS infrastructure (Floci container)
  - testcontainers:
      start:
        localstack:
          services:
            - "SQS"
            - "EVENT_BRIDGE"

  - waitFor:
      http:
        url: "${CITRUS_TESTCONTAINERS_LOCALSTACK_SERVICE_URL}"

  # The event bus and the rule, which matches the events of type Order Shipped
  - groovy:
      script:
        file: "aws/eventbridge/setupEventBridgeRule.groovy"

  - camel:
      cli:
        run:
          integration:
            file: "aws/eventbridge/aws-eventbridge-source-route.yaml"
            systemProperties:
              properties:
                - name: "aws.eventbridge.eventbusName"
                  value: "${aws.eventbridge.eventbusName}"
                - name: "aws.eventbridge.ruleName"
                  value: "${aws.eventbridge.ruleName}"
                - name: "aws.eventbridge.eventSource"
                  value: "${aws.eventbridge.eventSource}"
              file: "aws/floci.properties"

  # The first event that arrives is the one the rule matches: the body is the whole event, as JSON text
  - http:
      server: "awsSinkServer"
      receiveRequest:
        POST:
          path: "/result"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "X-Message-Id"
              value: '@matches(''[0-9a-f-]{36}'')@'
            - name: "X-Receipt-Handle"
              value: '@matches(''.+'')@'
        validate:
          - jsonPath:
              - expression: '$.id'
                value: '@matches(''[0-9a-f-]{36}'')@'
              - expression: '$[''detail-type'']'
                value: 'Order Shipped'
              - expression: '$.source'
                value: '${aws.eventbridge.eventSource}'
              - expression: '$.resources[0]'
                value: 'arn:aws:s3:::orders'
              - expression: '$.detail.orderId'
                value: 'A-1'
  - http:
      server: "awsSinkServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          body:
            data: "OK"
