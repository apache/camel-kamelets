# Receives the events of the rule with aws-eventbridge-source and passes them on to the Citrus HTTP server.
# Two events are put on the bus with aws-eventbridge-sink: first one that the rule does not match
# (Order Cancelled), then one that it matches (Order Shipped).
- route:
    from:
      uri: "kamelet:aws-eventbridge-source"
      parameters:
        eventbusNameOrArn: "{{aws.eventbridge.eventbusName}}"
        ruleName: "{{aws.eventbridge.ruleName}}"
        overrideEndpoint: true
        uriEndpointOverride: "{{aws.uriEndpointOverride}}"
        accessKey: "{{aws.accessKey}}"
        secretKey: "{{aws.secretKey}}"
        region: "{{aws.region}}"
        waitTimeSeconds: 1
      steps:
        # What the Kamelet gives
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - setHeader:
            name: X-Message-Id
            simple: "${header.CamelAwsEventbridgeMessageId}"
        - setHeader:
            name: X-Receipt-Handle
            simple: "${header.CamelAwsEventbridgeReceiptHandle}"
        - to:
            uri: "{{http.sink.url}}/result"
- route:
    from:
      uri: "timer:not-matched"
      parameters:
        repeatCount: 1
        delay: 2000
      steps:
        - setBody:
            constant: '{"orderId": "A-0"}'
        - to:
            uri: "kamelet:aws-eventbridge-sink"
            parameters:
              eventbusNameOrArn: "{{aws.eventbridge.eventbusName}}"
              overrideEndpoint: true
              uriEndpointOverride: "{{aws.uriEndpointOverride}}"
              accessKey: "{{aws.accessKey}}"
              secretKey: "{{aws.secretKey}}"
              region: "{{aws.region}}"
              resourcesArn: "arn:aws:s3:::orders"
              eventSource: "{{aws.eventbridge.eventSource}}"
              detailType: "Order Cancelled"
- route:
    from:
      uri: "timer:matched"
      parameters:
        repeatCount: 1
        delay: 4000
      steps:
        - setBody:
            constant: '{"orderId": "A-1"}'
        - to:
            uri: "kamelet:aws-eventbridge-sink"
            parameters:
              eventbusNameOrArn: "{{aws.eventbridge.eventbusName}}"
              overrideEndpoint: true
              uriEndpointOverride: "{{aws.uriEndpointOverride}}"
              accessKey: "{{aws.accessKey}}"
              secretKey: "{{aws.secretKey}}"
              region: "{{aws.region}}"
              resourcesArn: "arn:aws:s3:::orders"
              eventSource: "{{aws.eventbridge.eventSource}}"
              detailType: "Order Shipped"
