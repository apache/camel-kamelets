name: aws-eventbridge-source-keep-test
# aws-eventbridge-source with deleteQueueOnShutdown false keeps its queue, and the queue stays a target of the rule,
# when it stops: the queue collects the event put on the bus while it does not run, and the next start reuses it
variables:
  - name: "aws.eventbridge.eventbusName"
    value: "orders"
  - name: "aws.eventbridge.ruleName"
    value: "orders-shipped"
  - name: "aws.eventbridge.eventSource"
    value: "com.example.shop"
actions:
  - testcontainers:
      start:
        localstack:
          services:
            - "SQS"
            - "EVENT_BRIDGE"

  - waitFor:
      http:
        url: "${CITRUS_TESTCONTAINERS_LOCALSTACK_SERVICE_URL}"

  - groovy:
      script:
        file: "aws/eventbridge/setupEventBridgeRule.groovy"

  # The first run creates the queue, then stops (the test stops it, so Citrus must not stop it at the end)
  - camel:
      cli:
        run:
          autoRemove: false
          integration:
            name: "eventbridge-keep-first"
            file: "aws/eventbridge/aws-eventbridge-source-keep-route.yaml"
            systemProperties:
              properties:
                - name: "run.name"
                  value: "first"
                - name: "aws.eventbridge.eventbusName"
                  value: "${aws.eventbridge.eventbusName}"
                - name: "aws.eventbridge.ruleName"
                  value: "${aws.eventbridge.ruleName}"
              file: "aws/floci.properties"
  - camel:
      cli:
        verify:
          integration: "eventbridge-keep-first"
          logMessage: "Auto-created SQS queue"
  - camel:
      cli:
        stop:
          integration: "eventbridge-keep-first"

  # The queue is still there, and still a target of the rule: an event put on the bus now goes into it
  - createVariables:
      variables:
        - name: "putEvent"
          value: "true"
  - groovy:
      script:
        file: "aws/eventbridge/keptQueue.groovy"

  # The second run reuses the queue, and gets the event put while no integration ran
  - camel:
      cli:
        run:
          integration:
            name: "eventbridge-keep-second"
            file: "aws/eventbridge/aws-eventbridge-source-keep-route.yaml"
            systemProperties:
              properties:
                - name: "run.name"
                  value: "second"
                - name: "aws.eventbridge.eventbusName"
                  value: "${aws.eventbridge.eventbusName}"
                - name: "aws.eventbridge.ruleName"
                  value: "${aws.eventbridge.ruleName}"
              file: "aws/floci.properties"
  - camel:
      cli:
        verify:
          integration: "eventbridge-keep-second"
          logMessage: "Auto-created SQS queue"
  - http:
      server: "awsSinkServer"
      receiveRequest:
        POST:
          path: "/kept"
          # the second run got it, not the first one while it stopped
          headers:
            - name: "X-Run"
              value: "second"
        validate:
          - jsonPath:
              - expression: '$[''detail-type'']'
                value: 'Order Shipped'
              - expression: '$.detail.orderId'
                value: 'A-2'
  - http:
      server: "awsSinkServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          body:
            data: "OK"
  - createVariables:
      variables:
        - name: "putEvent"
          value: "false"
  - groovy:
      script:
        file: "aws/eventbridge/keptQueue.groovy"
