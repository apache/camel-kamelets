name: azure-eventhubs-source-route-test
description: 'azure-eventhubs-source receives an event of the event hub, with its partition, sequence number and properties'
actions:
  # Start the Event Hubs emulator, with the event hub orders, and the Azurite storage emulator that it needs
  - groovy:
      script:
        file: "azure/eventhubs-emulator-start.groovy"

  # Create Camel JBang integration. The positions of the consumer are kept in memory, so the blob options are not used.
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "azure/azure-eventhubs-source-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${azure.server.port}"
                - name: "eventhubs.connectionString"
                  value: "${eventhubs.connectionString}"
          resources:
            - "AzureEventHubsCheckpointStore.java"

  # The body of the event, as bytes, from partition 0, with the property origin in CamelAzureEventHubsMetadata
  - http:
      server: "azureServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: '[B'
            - name: "X-Content-Type"
              value: 'ct=application/octet-stream'
            - name: "X-Partition-Id"
              value: '0'
            - name: "X-Sequence-Number"
              value: '0'
            - name: "X-Metadata"
              value: '{origin=citrus}'
          body:
            data: 'Hello Event Hubs'
  - http:
      server: "azureServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

finally:
  - groovy:
      script:
        file: "azure/eventhubs-emulator-stop.groovy"
