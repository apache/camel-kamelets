name: azure-cosmosdb-source-route-test
description: 'azure-cosmosdb-source reads the changes of the container from the beginning, as a JSON array of items'
actions:
  # Start the Cosmos DB emulator of Microsoft (the vNext one, on Linux). The Java SDK of Cosmos DB needs HTTPS: the
  # emulator has a self-signed certificate, which the client in AzureCosmosClient.java does not check. It does not
  # check the account key.
  - testcontainers:
      start:
        container:
          name: "cosmos"
          image: "mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-EN20261019"
          command: "--protocol https"
          autoRemove: true
          startUpTimeout: 180
          exposedPorts:
            - 8081
          waitFor:
            logMessage: '.*System is now fully ready to accept requests.*'

  # Create Camel JBang integration. The source starts once the container exists, which the first route creates.
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "azure/azure-cosmosdb-source-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${azure.server.port}"
                - name: "azure.cosmosUrl"
                  value: "https://${CITRUS_TESTCONTAINERS_COSMOS_HOST}:${CITRUS_TESTCONTAINERS_COSMOS_PORT}"
                - name: "azure.accessKey"
                  value: "a2FtZWxldHM="
          resources:
            - "AzureCosmosClient.java"

  # The changed item, in a JSON array, with the fields that Cosmos DB adds
  - http:
      server: "azureServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "json"
          headers:
            - name: "X-Body-Type"
              value: '[B'
            - name: "X-Content-Type"
              value: 'ct=application/json'
          body:
            data: '[{"id":"order-1","customer":"citrus","item":"book","_lsn":"@ignore@","_rid":"@ignore@","_etag":"@ignore@","_attachments":"@ignore@","_ts":"@ignore@"}]'
  - http:
      server: "azureServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
