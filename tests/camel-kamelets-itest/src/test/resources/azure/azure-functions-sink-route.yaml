- route:
    from:
      uri: "timer:send"
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            constant: '{"orderId":"ORD-1"}'
        - setHeader:
            name: Content-Type
            constant: 'application/json'
        - setHeader:
            name: origin
            constant: 'citrus'
        - to:
            uri: "kamelet:azure-functions-sink"
            parameters:
              url: 'http://localhost:{{azure.server.port}}/api/orders'
              key: 'my-function-key'
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - setHeader:
            name: X-Response-Code
            simple: "${header.CamelHttpResponseCode}"
        - setHeader:
            name: X-Key-Header
            simple: "key=${header.x-functions-key}"
        - to:
            uri: "{{http.sink.url}}/result"
