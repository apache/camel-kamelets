- route:
    from:
      uri: "timer:send"
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            constant: 'Hello Azure Data Lake'
        - setHeader:
            name: file
            constant: 'order-1.txt'
        - to:
            uri: "kamelet:azure-storage-datalake-sink"
            parameters:
              accountName: '{{azure.accountName}}'
              fileSystemName: 'lake'
              credentialType: 'SERVICE_CLIENT_INSTANCE'
              directoryName: 'in'
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - setHeader:
            name: X-File-Name
            simple: "${header.CamelAzureStorageDataLakeFileName}"
        # the body as text, for the HTTP call
        - convertBodyTo:
            type: "java.lang.String"
        - to:
            uri: "{{http.sink.url}}/result"
        # read the file back, to show what arrived
        - to:
            uri: "azure-storage-datalake:{{azure.accountName}}/lake"
            parameters:
              operation: getFile
              fileName: 'in/order-1.txt'
              credentialType: SERVICE_CLIENT_INSTANCE
        - convertBodyTo:
            type: "java.lang.String"
        - log:
            message: 'Read back in/order-1.txt: ${body}'
