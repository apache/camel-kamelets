- route:
    from:
      uri: "kamelet:azure-storage-blob-source"
      parameters:
        accountName: '{{azure.accountName}}'
        containerName: 'orders'
        accessKey: '{{azure.accessKey}}'
        deleteAfterRead: 'true'
      steps:
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - setHeader:
            name: X-Blob-Name
            simple: "${header.CamelAzureStorageBlobBlobName}"
        - setHeader:
            name: X-Blob-Content-Type
            simple: "${header.CamelAzureStorageBlobContentType}"
        - setHeader:
            name: X-Blob-Type
            simple: "${header.CamelAzureStorageBlobBlobType}"
        - setHeader:
            name: X-Container-Name
            simple: "${header.CamelAzureStorageBlobConsumedContainerName}"
        # the CloudEvent source, with the cloudevents output data type of the Kamelet
        - to:
            uri: "kamelet:data-type-action"
            parameters:
              scheme: "azure-storage-blob"
              format: "application-cloudevents"
        - setHeader:
            name: X-CloudEvent-Source
            simple: "${header.CamelCloudEventSource}"
        # the body as text, for the HTTP call: Citrus reads an application/octet-stream body as a byte array
        - removeHeader:
            name: Content-Type
        - convertBodyTo:
            type: "java.lang.String"
        - to:
            uri: "{{http.sink.url}}/result"
