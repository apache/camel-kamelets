name: azure-storage-queue-source-route-test
description: 'azure-storage-queue-source receives a message of the queue, with its ID and dequeue count'
actions:
  # Start the Floci Azure emulator, which serves Blob, Queue and Data Lake storage on one port. It does not check the
  # account key.
  - testcontainers:
      start:
        container:
          name: "azure"
          image: "floci/floci-az:0.17.0"
          autoRemove: true
          startUpTimeout: 120
          exposedPorts:
            - 4577
          waitFor:
            logMessage: '.*floci-az is ready.*'

  # The queue orders, with one message
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_AZURE_HOST}:${CITRUS_TESTCONTAINERS_AZURE_PORT}"
      sendRequest:
        PUT:
          path: "/devstoreaccount1-queue/orders"
          headers:
            - name: "x-ms-version"
              value: '2025-11-05'
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_AZURE_HOST}:${CITRUS_TESTCONTAINERS_AZURE_PORT}"
      receiveResponse:
        response:
          status: 201

  - http:
      client: "http://${CITRUS_TESTCONTAINERS_AZURE_HOST}:${CITRUS_TESTCONTAINERS_AZURE_PORT}"
      sendRequest:
        POST:
          path: "/devstoreaccount1-queue/orders/messages"
          contentType: "application/xml"
          headers:
            - name: "x-ms-version"
              value: '2025-11-05'
          body:
            data: '<QueueMessage><MessageText>Hello Azure Queue</MessageText></QueueMessage>'
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_AZURE_HOST}:${CITRUS_TESTCONTAINERS_AZURE_PORT}"
      receiveResponse:
        response:
          status: 201

  # Create Camel JBang integration
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "azure/azure-storage-queue-source-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${azure.server.port}"
                - name: "azure.url"
                  value: "http://${CITRUS_TESTCONTAINERS_AZURE_HOST}:${CITRUS_TESTCONTAINERS_AZURE_PORT}"
                - name: "azure.accountName"
                  value: "devstoreaccount1"
                - name: "azure.accessKey"
                  value: "a2FtZWxldHM="
          resources:
            - "AzureQueueClient.java"

  # The text of the message, as a stream, received for the first time
  - http:
      server: "azureServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Content-Type"
              value: 'ct=text/plain'
            - name: "X-Message-Id"
              value: '@matches([0-9a-f-]{36})@'
            - name: "X-Dequeue-Count"
              value: '1'
          body:
            data: 'Hello Azure Queue'
  - http:
      server: "azureServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
