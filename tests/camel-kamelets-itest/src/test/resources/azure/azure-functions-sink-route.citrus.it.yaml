name: azure-functions-sink-route-test
description: 'azure-functions-sink calls the function with the body, the Content-Type and the other headers, and the key in x-functions-key, but not the credentials of the message'
actions:
  # Create Camel JBang integration. The Citrus HTTP server takes the place of the function.
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "azure/azure-functions-sink-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${azure.server.port}"
                - name: "azure.server.port"
                  value: "${azure.server.port}"

  # The function gets the body, the Content-Type, the header origin and the key of the Kamelet (not the one of
  # the message), and answers with JSON
  - http:
      server: "azureServer"
      receiveRequest:
        POST:
          path: "/api/orders"
          headers:
            - name: "Content-Type"
              value: '@startsWith(application/json)@'
            - name: "x-functions-key"
              value: 'my-function-key'
            - name: "origin"
              value: 'citrus'
          body:
            data: '{"orderId":"ORD-1"}'

  # The Authorization and Proxy-Authorization headers of the message are not sent to the function. A header
  # validation cannot check that a header is missing, so a script checks the request that was received.
  - groovy:
      script:
        file: "azure/noCredentialHeaders.groovy"
  - http:
      server: "azureServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          headers:
            - name: "Content-Type"
              value: "application/json"
          body:
            data: '{"status":"accepted"}'

  # Afterwards the body is the answer of the function, CamelHttpResponseCode its status code, and the key header is gone
  - http:
      server: "azureServer"
      receiveRequest:
        POST:
          path: "/result"
          headers:
            - name: "X-Body-Type"
              value: '[B'
            - name: "X-Content-Type"
              value: 'ct=application/json'
            - name: "X-Response-Code"
              value: '200'
            - name: "X-Key-Header"
              value: 'key='
          body:
            data: '{"status":"accepted"}'
  - http:
      server: "azureServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
