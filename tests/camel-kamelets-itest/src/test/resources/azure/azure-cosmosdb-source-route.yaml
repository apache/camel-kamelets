- route:
    from:
      uri: "timer:send"
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            constant: '{"id":"order-1","customer":"citrus","item":"book"}'
        - unmarshal:
            json: {}
        # creates the database, the container and an item in it
        - setHeader:
            name: CamelAzureCosmosDbCreateDatabaseIfNotExist
            constant: true
        - setHeader:
            name: CamelAzureCosmosDbCreateContainerIfNotExist
            constant: true
        - to:
            uri: "azure-cosmosdb:shop/orders"
            parameters:
              databaseEndpoint: '{{azure.cosmosUrl}}'
              accountKey: '{{azure.accessKey}}'
              operation: createItem
              createDatabaseIfNotExists: true
              createContainerIfNotExists: true
              containerPartitionKeyPath: '/customer'
              itemPartitionKey: 'citrus'

- route:
    from:
      uri: "kamelet:azure-cosmosdb-source"
      parameters:
        databaseName: 'shop'
        containerName: 'orders'
        databaseEndpoint: '{{azure.cosmosUrl}}'
        accountKey: '{{azure.accessKey}}'
        createLeaseDatabaseIfNotExists: 'true'
        createLeaseContainerIfNotExists: 'true'
        startFromBeginning: 'true'
      steps:
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        # the body as text, for the HTTP call
        - convertBodyTo:
            type: "java.lang.String"
        - to:
            uri: "{{http.sink.url}}/result"
