name: azure-servicebus-source-route-test
description: 'azure-servicebus-source receives a message of the queue, with its ID and custom properties'
actions:
  # Start the Service Bus emulator, with the queues orders and blob-events, and the SQL Server that it needs
  - groovy:
      script:
        file: "azure/servicebus-emulator-start.groovy"

  # Create Camel JBang integration
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "azure/azure-servicebus-source-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${azure.server.port}"
                - name: "servicebus.connectionString"
                  value: "${servicebus.connectionString}"

  # The body of the message, as bytes, with its ID, delivery count and custom properties
  - http:
      server: "azureServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: '[B'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "X-Message-Id"
              value: '@matches([0-9a-f]{32})@'
            - name: "X-Delivery-Count"
              value: '0'
            - name: "X-Properties"
              value: '{origin=citrus}'
          body:
            data: 'Hello Service Bus'
  - http:
      server: "azureServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

finally:
  - groovy:
      script:
        file: "azure/servicebus-emulator-stop.groovy"
