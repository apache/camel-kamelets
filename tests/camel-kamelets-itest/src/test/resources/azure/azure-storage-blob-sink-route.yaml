- route:
    from:
      uri: "timer:send"
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            constant: 'Hello Azure Blob'
        - setHeader:
            name: file
            constant: 'orders/order-1.txt'
        - to:
            uri: "kamelet:azure-storage-blob-sink"
            parameters:
              accountName: '{{azure.accountName}}'
              containerName: 'orders'
              accessKey: '{{azure.accessKey}}'
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - setHeader:
            name: X-Blob-Name
            simple: "${header.CamelAzureStorageBlobBlobName}"
        - setHeader:
            name: X-ETag
            simple: "${header.CamelAzureStorageBlobETag}"
        # the body as text, for the HTTP call
        - convertBodyTo:
            type: "java.lang.String"
        - to:
            uri: "{{http.sink.url}}/result"
        # read the blob back, to show what arrived
        - to:
            uri: "azure-storage-blob://{{azure.accountName}}/orders"
            parameters:
              operation: getBlob
              blobName: 'orders/order-1.txt'
        - convertBodyTo:
            type: "java.lang.String"
        - log:
            message: 'Read back orders/order-1.txt: ${body}'
