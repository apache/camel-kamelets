- route:
    from:
      uri: "timer:send"
      parameters:
        repeatCount: 1
        # the consumer starts at the events that arrive after it has started
        delay: 5000
      steps:
        - setBody:
            constant: 'Hello Event Hubs'
        - setHeader:
            name: origin
            constant: 'citrus'
        # sends an event to the event hub
        - to:
            uri: "azure-eventhubs:"
            parameters:
              connectionString: 'RAW({{eventhubs.connectionString}})'

- route:
    from:
      uri: "kamelet:azure-eventhubs-source"
      parameters:
        connectionString: '{{eventhubs.connectionString}}'
        blobAccountName: 'unused'
        blobAccessKey: 'unused'
        blobContainerName: 'unused'
      steps:
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - setHeader:
            name: X-Partition-Id
            simple: "${header.CamelAzureEventHubsPartitionId}"
        - setHeader:
            name: X-Sequence-Number
            simple: "${header.CamelAzureEventHubsSequenceNumber}"
        - setHeader:
            name: X-Metadata
            simple: "${header.CamelAzureEventHubsMetadata}"
        # the body as text, for the HTTP call: Citrus reads an application/octet-stream body as a byte array
        - removeHeader:
            name: Content-Type
        - convertBodyTo:
            type: "java.lang.String"
        - to:
            uri: "{{http.sink.url}}/result"
