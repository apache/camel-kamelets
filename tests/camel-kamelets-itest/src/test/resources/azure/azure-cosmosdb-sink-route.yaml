- route:
    from:
      uri: "timer:send"
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            constant: '{"id":"order-1","customer":"citrus","item":"book"}'
        - setHeader:
            name: itemPartitionKey
            constant: 'citrus'
        - to:
            uri: "kamelet:azure-cosmosdb-sink"
            parameters:
              databaseName: 'shop'
              containerName: 'orders'
              databaseEndpoint: '{{azure.cosmosUrl}}'
              accountKey: '{{azure.accessKey}}'
              createDatabaseIfNotExists: 'true'
              createContainerIfNotExists: 'true'
              containerPartitionKeyPath: '/customer'
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - setHeader:
            name: X-Status-Code
            simple: "${header.CamelAzureCosmosDbStatusCode}"
        # the item as JSON, for the HTTP call
        - marshal:
            json: {}
        - to:
            uri: "{{http.sink.url}}/result"
        # read the item back, to show what arrived
        - to:
            uri: "azure-cosmosdb:shop/orders"
            parameters:
              databaseEndpoint: '{{azure.cosmosUrl}}'
              accountKey: '{{azure.accessKey}}'
              operation: readItem
              itemId: 'order-1'
              itemPartitionKey: 'citrus'
              containerPartitionKeyPath: '/customer'
        - log:
            message: 'Read back order-1: item=${body[item]}, customer=${body[customer]}'
