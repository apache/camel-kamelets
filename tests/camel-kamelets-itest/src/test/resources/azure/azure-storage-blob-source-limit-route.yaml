- route:
    from:
      uri: "kamelet:azure-storage-blob-source"
      parameters:
        accountName: '{{azure.accountName}}'
        containerName: 'orders'
        accessKey: '{{azure.accessKey}}'
        deleteAfterRead: 'true'
        maxMessagesPerPoll: 2
        delay: 2000
      steps:
        # the blob, and how many blobs the poll that read it has
        - setHeader:
            name: X-Blob-Name
            simple: "${header.CamelAzureStorageBlobBlobName}"
        - setHeader:
            name: X-Batch-Size
            simple: "${exchangeProperty.CamelBatchSize}"
        - removeHeader:
            name: Content-Type
        - convertBodyTo:
            type: "java.lang.String"
        - to:
            uri: "{{http.sink.url}}/result"
