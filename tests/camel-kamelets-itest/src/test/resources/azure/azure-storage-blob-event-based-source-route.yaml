- route:
    from:
      uri: "timer:send"
      parameters:
        repeatCount: 1
      steps:
        # the event that Event Grid sends to the queue when the blob orders/order-1.txt is created
        - setBody:
            constant: '{"topic":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/kamelets/providers/Microsoft.Storage/storageAccounts/devstoreaccount1","subject":"/blobServices/default/containers/orders/blobs/order-1.txt","eventType":"Microsoft.Storage.BlobCreated","id":"831e1650-001e-001b-66ab-eeb76e069631","data":{"api":"PutBlob","contentType":"text/plain","contentLength":22,"blobType":"BlockBlob","url":"https://devstoreaccount1.blob.core.windows.net/orders/order-1.txt"},"dataVersion":"","metadataVersion":"1","eventTime":"2026-11-19T10:00:00Z"}'
        - to:
            uri: "azure-servicebus:blob-events"
            parameters:
              connectionString: 'RAW({{servicebus.connectionString}})'

- route:
    from:
      uri: "kamelet:azure-storage-blob-event-based-source"
      parameters:
        topicOrQueueName: 'blob-events'
        connectionString: '{{servicebus.connectionString}}'
        accountName: '{{azure.accountName}}'
        containerName: 'orders'
        accessKey: '{{azure.accessKey}}'
        getBlob: 'true'
      steps:
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - setHeader:
            name: X-Blob-Content-Type
            simple: "${header.CamelAzureStorageBlobContentType}"
        # the body as text, for the HTTP call
        - convertBodyTo:
            type: "java.lang.String"
        - to:
            uri: "{{http.sink.url}}/result"
