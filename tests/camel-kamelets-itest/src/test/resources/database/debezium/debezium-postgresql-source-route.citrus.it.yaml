name: debezium-postgresql-source-route-test
variables:
  # a new file for each run, so that no saved position of an earlier run is used, in a folder that exists
  - name: "offsetFile"
    value: "citrus:concat(citrus:systemProperty('java.io.tmpdir'), '/debezium-offsets-', citrus:randomUUID(), '.dat')"
actions:
  # Start PostgreSQL with logical decoding, and a table of one row
  - testcontainers:
      start:
        container:
          name: "postgres"
          image: "postgres:17.12-alpine"
          command: "postgres -c wal_level=logical"
          autoRemove: true
          startUpTimeout: 120
          exposedPorts:
            - 5432
          env:
            - name: "POSTGRES_DB"
              value: "testdb"
            - name: "POSTGRES_USER"
              value: "test"
            - name: "POSTGRES_PASSWORD"
              value: "test"
          volumeMounts:
            - file: "database/debezium/init.sql"
              mountPath: "/docker-entrypoint-initdb.d/init.sql"
          # only the server started after the init scripts listens on TCP
          waitFor:
            logMessage: '.*listening on IPv4 address.*'

  # The first run sends the row already in the table (the snapshot), then the changes
  # the test stops this run itself, so Citrus must not stop it at the end
  - camel:
      cli:
        run:
          autoRemove: false
          waitForRunningState: false
          integration:
            name: "debezium-first"
            file: "database/debezium/debezium-postgresql-source-route.yaml"
            systemProperties:
              properties:
                - name: "db.serverName"
                  value: "${CITRUS_TESTCONTAINERS_POSTGRES_HOST}"
                - name: "db.serverPort"
                  value: "${CITRUS_TESTCONTAINERS_POSTGRES_PORT}"
                - name: "db.offsetFile"
                  value: "${offsetFile}"
                - name: "run.name"
                  value: "first"
                - name: "http.sink.url"
                  value: "http://localhost:${http.server.port}"
                # any other option of the connector, for all its Kamelets
                - name: "camel.component.debezium-postgres.columnExcludeList"
                  value: "public.products.note"

  # The snapshot: the row as it is, as JSON text in bytes; the note column is left out by columnExcludeList
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          headers:
            - name: "X-Run"
              value: 'first'
            - name: "X-Body-Type"
              value: '[B'
            - name: "X-Content-Type"
              value: 'ct=application/json'
            - name: "X-Operation"
              value: 'r'
            - name: "X-Table"
              value: 'public.products'
            - name: "X-Key"
              value: '{"id":1}'
            - name: "X-Component-Headers"
              value: 'op= key='
          body:
            data: '{"id":1,"name":"Tea","price":4.50,"added":20454}'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # An insert, an update and a delete
  - createVariables:
      variables:
        - name: "db.container"
          value: "postgres"
        - name: "db.sql"
          value: |-
            INSERT INTO products VALUES (2, 'Coffee', 3.20, '2026-03-01', 'not sent');
            UPDATE products SET price = 5.00 WHERE id = 1;
            DELETE FROM products WHERE id = 2;
  - groovy:
      script:
        file: "database/sql.groovy"
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          headers:
            - name: "X-Run"
              value: 'first'
            - name: "X-Body-Type"
              value: '[B'
            - name: "X-Content-Type"
              value: 'ct=application/json'
            - name: "X-Operation"
              value: 'c'
            - name: "X-Table"
              value: 'public.products'
            - name: "X-Key"
              value: '{"id":2}'
            - name: "X-Component-Headers"
              value: 'op= key='
          body:
            data: '{"id":2,"name":"Coffee","price":3.20,"added":20513}'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          headers:
            - name: "X-Run"
              value: 'first'
            - name: "X-Body-Type"
              value: '[B'
            - name: "X-Content-Type"
              value: 'ct=application/json'
            - name: "X-Operation"
              value: 'u'
            - name: "X-Table"
              value: 'public.products'
            - name: "X-Key"
              value: '{"id":1}'
            - name: "X-Component-Headers"
              value: 'op= key='
          body:
            data: '{"id":1,"name":"Tea","price":5.00,"added":20454}'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # A delete sends the row before it: without REPLICA IDENTITY FULL, PostgreSQL logs only its key
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          headers:
            - name: "X-Run"
              value: 'first'
            - name: "X-Body-Type"
              value: '[B'
            - name: "X-Content-Type"
              value: 'ct=application/json'
            - name: "X-Operation"
              value: 'd'
            - name: "X-Table"
              value: 'public.products'
            - name: "X-Key"
              value: '{"id":2}'
            - name: "X-Component-Headers"
              value: 'op= key='
          body:
            data: '{"id":2,"name":null,"price":null,"added":null}'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # Stop, change a row while no integration runs, and start again with the same position file
  - camel:
      cli:
        stop:
          integration: "debezium-first"
  - createVariables:
      variables:
        - name: "db.container"
          value: "postgres"
        - name: "db.sql"
          value: |-
            INSERT INTO notes VALUES (1, 'not in tableIncludeList, so not sent');
            INSERT INTO products VALUES (3, 'Juice', 2.10, '2026-01-01', 'not sent');
  - groovy:
      script:
        file: "database/sql.groovy"
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            name: "debezium-second"
            file: "database/debezium/debezium-postgresql-source-route.yaml"
            systemProperties:
              properties:
                - name: "db.serverName"
                  value: "${CITRUS_TESTCONTAINERS_POSTGRES_HOST}"
                - name: "db.serverPort"
                  value: "${CITRUS_TESTCONTAINERS_POSTGRES_PORT}"
                - name: "db.offsetFile"
                  value: "${offsetFile}"
                - name: "run.name"
                  value: "second"
                - name: "http.sink.url"
                  value: "http://localhost:${http.server.port}"
                # any other option of the connector, for all its Kamelets
                - name: "camel.component.debezium-postgres.columnExcludeList"
                  value: "public.products.note"

  # The second run sends only the change of products made while it was stopped, not the snapshot or the changes sent before
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          headers:
            - name: "X-Run"
              value: 'second'
            - name: "X-Body-Type"
              value: '[B'
            - name: "X-Content-Type"
              value: 'ct=application/json'
            - name: "X-Operation"
              value: 'c'
            - name: "X-Table"
              value: 'public.products'
            - name: "X-Key"
              value: '{"id":3}'
            - name: "X-Component-Headers"
              value: 'op= key='
          body:
            data: '{"id":3,"name":"Juice","price":2.10,"added":20454}'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
