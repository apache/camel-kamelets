name: debezium-sqlserver-source-route-test
variables:
  # new files for each run, so that no saved position of an earlier run is used: the position file in a folder that
  # exists, the schema history file in a folder that does not exist yet, which the Kamelet creates
  - name: "storageId"
    value: "citrus:randomUUID()"
  - name: "offsetFile"
    value: "citrus:concat(citrus:systemProperty('java.io.tmpdir'), '/debezium-sqlserver-offsets-', ${storageId}, '.dat')"
  - name: "historyFile"
    value: "citrus:concat(citrus:systemProperty('java.io.tmpdir'), '/debezium-sqlserver-history-', ${storageId}, '/history.dat')"
actions:
  # Start SQL Server with SQL Server Agent, whose jobs copy the changes into the change tables of CDC
  - testcontainers:
      start:
        container:
          name: "sqlserver"
          image: "mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04"
          autoRemove: true
          startUpTimeout: 180
          exposedPorts:
            - 1433
          env:
            - name: "ACCEPT_EULA"
              value: "Y"
            - name: "MSSQL_SA_PASSWORD"
              value: "Citrus-Test-1"
            - name: "MSSQL_AGENT_ENABLED"
              value: "true"
          waitFor:
            logMessage: '.*SQL Server is now ready for client connections.*'

  # A table of one row with CDC, a table without CDC, and a user in the db_owner role of the database
  - createVariables:
      variables:
        - name: "db.container"
          value: "sqlserver"
        - name: "db.sql"
          value: |-
            CREATE DATABASE testdb
            GO
            USE testdb
            CREATE TABLE products (id INT PRIMARY KEY, name VARCHAR(100), price DECIMAL(10,2), added DATE, note VARCHAR(100));
            INSERT INTO products VALUES (1, 'Tea', 4.50, '2026-01-01', 'not sent');
            CREATE TABLE notes (id INT PRIMARY KEY, text VARCHAR(100));
            CREATE LOGIN test WITH PASSWORD = 'Citrus-Test-2', CHECK_POLICY = OFF;
            CREATE USER test FOR LOGIN test;
            ALTER ROLE db_owner ADD MEMBER test;
            EXEC sys.sp_cdc_enable_db;
            EXEC sys.sp_cdc_enable_table @source_schema = 'dbo', @source_name = 'products', @role_name = NULL;
  - repeatOnError:
      until: "i > 30"
      autoSleep: 1000
      actions:
        - groovy:
            script:
              file: "database/sql.groovy"

  # The first run sends the row already in the table (the snapshot), then the changes
  # the test stops each run itself, so Citrus must not stop it at the end, after the container is removed
  - camel:
      cli:
        run:
          autoRemove: false
          waitForRunningState: false
          integration:
            name: "debezium-sqlserver-first"
            file: "database/debezium/debezium-sqlserver-source-route.yaml"
            systemProperties:
              properties:
                - name: "db.serverName"
                  value: "${CITRUS_TESTCONTAINERS_SQLSERVER_HOST}"
                - name: "db.serverPort"
                  value: "${CITRUS_TESTCONTAINERS_SQLSERVER_PORT}"
                - name: "db.offsetFile"
                  value: "${offsetFile}"
                - name: "db.historyFile"
                  value: "${historyFile}"
                - name: "run.name"
                  value: "first"
                - name: "http.sink.url"
                  value: "http://localhost:${http.server.port}"
                # any other option of the connector, for all its Kamelets
                - name: "camel.component.debezium-sqlserver.columnExcludeList"
                  value: "dbo.products.note"

  # The snapshot: the row as it is, as JSON text in bytes, with the columns in the order of the table; the note column
  # is left out by columnExcludeList
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Run"
              value: 'first'
            - name: "X-Body-Type"
              value: '[B'
            - name: "X-Content-Type"
              value: 'ct=application/json'
            - name: "X-Operation"
              value: 'r'
            - name: "X-Table"
              value: 'dbo.products'
            - name: "X-Key"
              value: '{"id":1}'
            - name: "X-Component-Headers"
              value: 'op= key='
          body:
            data: '{"id":1,"name":"Tea","price":4.50,"added":20454}'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # An insert, an update and a delete
  - createVariables:
      variables:
        - name: "db.container"
          value: "sqlserver"
        - name: "db.sql"
          value: |-
            USE testdb
            INSERT INTO products VALUES (2, 'Coffee', 3.20, '2026-03-01', 'not sent');
            UPDATE products SET price = 5.00 WHERE id = 1;
            DELETE FROM products WHERE id = 2;
  - groovy:
      script:
        file: "database/sql.groovy"
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Run"
              value: 'first'
            - name: "X-Body-Type"
              value: '[B'
            - name: "X-Content-Type"
              value: 'ct=application/json'
            - name: "X-Operation"
              value: 'c'
            - name: "X-Table"
              value: 'dbo.products'
            - name: "X-Key"
              value: '{"id":2}'
            - name: "X-Component-Headers"
              value: 'op= key='
          body:
            data: '{"id":2,"name":"Coffee","price":3.20,"added":20513}'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Run"
              value: 'first'
            - name: "X-Body-Type"
              value: '[B'
            - name: "X-Content-Type"
              value: 'ct=application/json'
            - name: "X-Operation"
              value: 'u'
            - name: "X-Table"
              value: 'dbo.products'
            - name: "X-Key"
              value: '{"id":1}'
            - name: "X-Component-Headers"
              value: 'op= key='
          body:
            data: '{"id":1,"name":"Tea","price":5.00,"added":20454}'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # A delete sends the row before it, with all its columns
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Run"
              value: 'first'
            - name: "X-Body-Type"
              value: '[B'
            - name: "X-Content-Type"
              value: 'ct=application/json'
            - name: "X-Operation"
              value: 'd'
            - name: "X-Table"
              value: 'dbo.products'
            - name: "X-Key"
              value: '{"id":2}'
            - name: "X-Component-Headers"
              value: 'op= key='
          body:
            data: '{"id":2,"name":"Coffee","price":3.20,"added":20513}'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # Stop, change rows while no integration runs, and start again with the same position and schema history files
  - camel:
      cli:
        stop:
          integration: "debezium-sqlserver-first"
  - createVariables:
      variables:
        - name: "db.container"
          value: "sqlserver"
        - name: "db.sql"
          value: |-
            USE testdb
            INSERT INTO notes VALUES (1, 'a table without CDC, so not sent');
            INSERT INTO products VALUES (3, 'Juice', 2.10, '2026-01-01', 'not sent');
  - groovy:
      script:
        file: "database/sql.groovy"
  - camel:
      cli:
        run:
          autoRemove: false
          waitForRunningState: false
          integration:
            name: "debezium-sqlserver-second"
            file: "database/debezium/debezium-sqlserver-source-route.yaml"
            systemProperties:
              properties:
                - name: "db.serverName"
                  value: "${CITRUS_TESTCONTAINERS_SQLSERVER_HOST}"
                - name: "db.serverPort"
                  value: "${CITRUS_TESTCONTAINERS_SQLSERVER_PORT}"
                - name: "db.offsetFile"
                  value: "${offsetFile}"
                - name: "db.historyFile"
                  value: "${historyFile}"
                - name: "run.name"
                  value: "second"
                - name: "http.sink.url"
                  value: "http://localhost:${http.server.port}"
                # any other option of the connector, for all its Kamelets
                - name: "camel.component.debezium-sqlserver.columnExcludeList"
                  value: "dbo.products.note"

  # The second run sends only the change of products made while it was stopped, not the snapshot or the changes sent before
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Run"
              value: 'second'
            - name: "X-Body-Type"
              value: '[B'
            - name: "X-Content-Type"
              value: 'ct=application/json'
            - name: "X-Operation"
              value: 'c'
            - name: "X-Table"
              value: 'dbo.products'
            - name: "X-Key"
              value: '{"id":3}'
            - name: "X-Component-Headers"
              value: 'op= key='
          body:
            data: '{"id":3,"name":"Juice","price":2.10,"added":20454}'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
  - camel:
      cli:
        stop:
          integration: "debezium-sqlserver-second"
