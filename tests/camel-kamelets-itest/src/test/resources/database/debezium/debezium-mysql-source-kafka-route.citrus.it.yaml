name: debezium-mysql-source-kafka-route-test
actions:
  # Start MySQL with the binlog in the ROW format with the whole row, and a table of one row; the init script gives
  # the user the privileges the Kamelet needs
  - testcontainers:
      start:
        container:
          name: "mysql"
          image: "mysql:8.4.7"
          command: "mysqld --binlog-format=ROW --binlog-row-image=FULL"
          autoRemove: true
          startUpTimeout: 120
          exposedPorts:
            - 3306
          env:
            - name: "MYSQL_DATABASE"
              value: "testdb"
            - name: "MYSQL_USER"
              value: "test"
            - name: "MYSQL_PASSWORD"
              value: "test"
            - name: "MYSQL_ROOT_PASSWORD"
              value: "root"
          volumeMounts:
            - file: "database/debezium/debezium-mysql-init.sql"
              mountPath: "/docker-entrypoint-initdb.d/init.sql"
          # only the server started after the init scripts listens on port 3306
          waitFor:
            logMessage: '.*ready for connections.*port: 3306 .*'

  # A Kafka to keep the position and the schema history in
  - testcontainers:
      start:
        kafka:
          implementation: "apache"
          version: "4.4.0"

  # The first run sends the row already in the table (the snapshot), and saves its position in Kafka when it stops
  # the test stops each run itself: Citrus removes the containers before the integrations it stops at the end, and
  # without Kafka the stop waits to save the position until `camel stop` times out
  - camel:
      cli:
        run:
          autoRemove: false
          waitForRunningState: false
          # the JDBC driver of MySQL is not in the Kamelet
          args:
            - "--dep=mvn:com.mysql:mysql-connector-j:26.10.0"
          integration:
            name: "debezium-mysql-kafka-first"
            file: "database/debezium/debezium-mysql-source-kafka-route.yaml"
            systemProperties:
              properties:
                - name: "db.serverName"
                  value: "${CITRUS_TESTCONTAINERS_MYSQL_HOST}"
                - name: "db.serverPort"
                  value: "${CITRUS_TESTCONTAINERS_MYSQL_PORT}"
                - name: "kafka.bootstrapServers"
                  value: "${CITRUS_TESTCONTAINERS_KAFKA_BOOTSTRAP_SERVERS}"
                - name: "run.name"
                  value: "first"
                - name: "http.sink.url"
                  value: "http://localhost:${http.server.port}"
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Run"
              value: 'first'
            - name: "X-Operation"
              value: 'r'
          body:
            data: '{"id":1,"name":"Tea","price":4.50,"added":20454,"note":"not sent"}'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
  - camel:
      cli:
        stop:
          integration: "debezium-mysql-kafka-first"

  # A row inserted while no integration runs
  - createVariables:
      variables:
        - name: "db.container"
          value: "mysql"
        - name: "db.sql"
          value: |-
            INSERT INTO products VALUES (2, 'Coffee', 3.20, '2026-03-01', 'x');
  - groovy:
      script:
        file: "database/sql.groovy"

  # The second run reads the position and the schema history from Kafka: it sends only the new row, not the snapshot again
  - camel:
      cli:
        run:
          autoRemove: false
          waitForRunningState: false
          # the JDBC driver of MySQL is not in the Kamelet
          args:
            - "--dep=mvn:com.mysql:mysql-connector-j:26.10.0"
          integration:
            name: "debezium-mysql-kafka-second"
            file: "database/debezium/debezium-mysql-source-kafka-route.yaml"
            systemProperties:
              properties:
                - name: "db.serverName"
                  value: "${CITRUS_TESTCONTAINERS_MYSQL_HOST}"
                - name: "db.serverPort"
                  value: "${CITRUS_TESTCONTAINERS_MYSQL_PORT}"
                - name: "kafka.bootstrapServers"
                  value: "${CITRUS_TESTCONTAINERS_KAFKA_BOOTSTRAP_SERVERS}"
                - name: "run.name"
                  value: "second"
                - name: "http.sink.url"
                  value: "http://localhost:${http.server.port}"
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Run"
              value: 'second'
            - name: "X-Operation"
              value: 'c'
          body:
            data: '{"id":2,"name":"Coffee","price":3.20,"added":20513,"note":"x"}'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
  - camel:
      cli:
        stop:
          integration: "debezium-mysql-kafka-second"
