- route:
    from:
      uri: "kamelet:debezium-postgresql-source"
      parameters:
        serverName: "{{db.serverName}}"
        serverPort: "{{db.serverPort}}"
        databaseName: "testdb"
        username: "test"
        password: "test"
        topicPrefix: "shop"
        tableIncludeList: "public.products"
        # the position is saved in a Kafka topic, not in a file
        offsetStorage: "org.apache.kafka.connect.storage.KafkaOffsetBackingStore"
        offsetStorageBootstrapServers: "{{kafka.bootstrapServers}}"
        offsetStorageTopic: "shop-offsets"
        offsetStoragePartitions: 1
        offsetStorageReplicationFactor: 1
      steps:
        - setHeader:
            name: X-Operation
            simple: "${header.debezium-operation}"
        - setHeader:
            name: X-Run
            simple: "{{run.name}}"
        - to:
            uri: "{{http.sink.url}}/result"
