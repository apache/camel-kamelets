name: sqlserver-sink-route-test
actions:
  # Start SQL Server with an empty table
  - testcontainers:
      start:
        container:
          name: "sqlserver"
          image: "mcr.microsoft.com/mssql/server:2022-latest"
          autoRemove: true
          startUpTimeout: 180
          exposedPorts:
            - 1433
          env:
            - name: "ACCEPT_EULA"
              value: "Y"
            - name: "MSSQL_SA_PASSWORD"
              value: "Citrus-Test-1"
          waitFor:
            logMessage: '.*SQL Server is now ready for client connections.*'

  # Create the table
  - createVariables:
      variables:
        - name: "db.container"
          value: "sqlserver"
        - name: "db.sql"
          value: |-
            CREATE DATABASE testdb
            GO
            USE testdb
            CREATE TABLE accounts (id INT PRIMARY KEY, username VARCHAR(100), city VARCHAR(100));
  - repeatOnError:
      until: "i > 30"
      autoSleep: 1000
      actions:
        - groovy:
            script:
              file: "database/sql.groovy"

  # Run the integration with the Kamelet
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "database/sqlserver/sqlserver-sink-route.yaml"
            systemProperties:
              properties:
                - name: "db.serverName"
                  value: "${CITRUS_TESTCONTAINERS_SQLSERVER_HOST}"
                - name: "db.serverPort"
                  value: "${CITRUS_TESTCONTAINERS_SQLSERVER_PORT}"
                - name: "http.sink.url"
                  value: "http://localhost:${http.server.port}"

  # The sink has run the INSERT: the body is the JSON object as a Map, and the update count is 1
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          headers:
            - name: "X-Body-Type"
              value: 'java.util.LinkedHashMap'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "X-Update-Count"
              value: '1'
          body:
            data: '{"id":99,"username":"sink-test","city":"Oslo"}'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # The row is in the table
  - createVariables:
      variables:
        - name: "db.container"
          value: "sqlserver"
        - name: "db.sql"
          value: |-
            USE testdb
            SELECT CONCAT(username, '|', city) FROM accounts WHERE id = 99;
        - name: "db.expected"
          value: 'sink-test|Oslo'
  - groovy:
      script:
        file: "database/sql.groovy"
