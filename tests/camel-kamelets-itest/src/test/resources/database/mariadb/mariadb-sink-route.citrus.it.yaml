name: mariadb-sink-route-test
actions:
  # Start MariaDB with an empty table
  - testcontainers:
      start:
        container:
          name: "mariadb"
          image: "mariadb:11.4"
          autoRemove: true
          startUpTimeout: 120
          exposedPorts:
            - 3306
          env:
            - name: "MARIADB_DATABASE"
              value: "testdb"
            - name: "MARIADB_USER"
              value: "test"
            - name: "MARIADB_PASSWORD"
              value: "test"
            - name: "MARIADB_ROOT_PASSWORD"
              value: "root"
          volumeMounts:
            - file: "database/mariadb/init-empty.sql"
              mountPath: "/docker-entrypoint-initdb.d/init.sql"
          waitFor:
            logMessage: '.*port: 3306 .*'

  # Run the integration with the Kamelet
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "database/mariadb/mariadb-sink-route.yaml"
            systemProperties:
              properties:
                - name: "db.serverName"
                  value: "${CITRUS_TESTCONTAINERS_MARIADB_HOST}"
                - name: "db.serverPort"
                  value: "${CITRUS_TESTCONTAINERS_MARIADB_PORT}"
                - name: "http.sink.url"
                  value: "http://localhost:${http.server.port}"

  # The sink has run the INSERT: the body is the JSON object as a Map, and the update count is 1
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          headers:
            - name: "X-Body-Type"
              value: 'java.util.LinkedHashMap'
            - name: "X-Content-Type"
              value: 'ct=application/json'
            - name: "X-Update-Count"
              value: '1'
          body:
            data: '{"id":99,"username":"sink-test","city":"Oslo"}'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # The row is in the table
  - createVariables:
      variables:
        - name: "db.container"
          value: "mariadb"
        - name: "db.sql"
          value: |-
            SELECT CONCAT(username, '|', city) FROM accounts WHERE id = 99;
        - name: "db.expected"
          value: 'sink-test|Oslo'
  - groovy:
      script:
        file: "database/sql.groovy"
