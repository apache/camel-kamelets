- route:
    from:
      uri: "kamelet:oracle-database-source"
      parameters:
        serverName: "{{db.serverName}}"
        serverPort: "{{db.serverPort}}"
        databaseName: "FREEPDB1"
        username: "test"
        password: "test"
        query: 'SELECT id, username, city FROM accounts'
        consumedQuery: 'DELETE FROM accounts WHERE id = :#id'
        delay: '1000'
      steps:
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - to:
            uri: "{{http.sink.url}}/result"
