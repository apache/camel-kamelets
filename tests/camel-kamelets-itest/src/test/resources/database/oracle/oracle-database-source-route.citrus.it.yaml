name: oracle-database-source-route-test
actions:
  # Start Oracle Database with a table of one row
  - testcontainers:
      start:
        container:
          name: "oracle"
          image: "gvenzl/oracle-free:23-slim"
          autoRemove: true
          startUpTimeout: 300
          exposedPorts:
            - 1521
          env:
            - name: "ORACLE_PASSWORD"
              value: "oracle"
            - name: "APP_USER"
              value: "test"
            - name: "APP_USER_PASSWORD"
              value: "test"
          waitFor:
            logMessage: '.*DATABASE IS READY TO USE.*'

  # Create the table with one row
  - createVariables:
      variables:
        - name: "db.container"
          value: "oracle"
        - name: "db.sql"
          value: |-
            CREATE TABLE accounts (id NUMBER PRIMARY KEY, username VARCHAR2(100), city VARCHAR2(100));
            INSERT INTO accounts (id, username, city) VALUES (1, 'oscerd', 'Rome');
            COMMIT;
  - groovy:
      script:
        file: "database/sql.groovy"

  # Run the integration with the Kamelet
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "database/oracle/oracle-database-source-route.yaml"
            systemProperties:
              properties:
                - name: "db.serverName"
                  value: "${CITRUS_TESTCONTAINERS_ORACLE_HOST}"
                - name: "db.serverPort"
                  value: "${CITRUS_TESTCONTAINERS_ORACLE_PORT}"
                - name: "http.sink.url"
                  value: "http://localhost:${http.server.port}"

  # The row comes out of the Kamelet as a JSON object, as JSON text in bytes (the json output data type)
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          headers:
            - name: "X-Body-Type"
              value: '[B'
            - name: "X-Content-Type"
              value: 'ct=application/json'
          body:
            data: '{"ID":1,"USERNAME":"oscerd","CITY":"Rome"}'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # consumedQuery deletes the row once it has been sent on
  - createVariables:
      variables:
        - name: "db.container"
          value: "oracle"
        - name: "db.sql"
          value: |-
            SELECT COUNT(*) FROM accounts;
        - name: "db.expected"
          value: '0'
  - repeatOnError:
      until: "i > 30"
      autoSleep: 1000
      actions:
        - groovy:
            script:
              file: "database/sql.groovy"
