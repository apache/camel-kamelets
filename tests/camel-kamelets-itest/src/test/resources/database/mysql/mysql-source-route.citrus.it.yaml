name: mysql-source-route-test
actions:
  # Start MySQL with a table of one row
  - testcontainers:
      start:
        container:
          name: "mysql"
          image: "mysql:8.4"
          autoRemove: true
          startUpTimeout: 120
          exposedPorts:
            - 3306
          env:
            - name: "MYSQL_DATABASE"
              value: "testdb"
            - name: "MYSQL_USER"
              value: "test"
            - name: "MYSQL_PASSWORD"
              value: "test"
            - name: "MYSQL_ROOT_PASSWORD"
              value: "root"
          volumeMounts:
            - file: "database/mysql/init.sql"
              mountPath: "/docker-entrypoint-initdb.d/init.sql"
          waitFor:
            logMessage: '.*ready for connections.*port: 3306 .*'

  # Run the integration with the Kamelet
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "database/mysql/mysql-source-route.yaml"
            systemProperties:
              properties:
                - name: "db.serverName"
                  value: "${CITRUS_TESTCONTAINERS_MYSQL_HOST}"
                - name: "db.serverPort"
                  value: "${CITRUS_TESTCONTAINERS_MYSQL_PORT}"
                - name: "http.sink.url"
                  value: "http://localhost:${http.server.port}"

  # The row comes out of the Kamelet as a JSON object, as JSON text in bytes (the json output data type)
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          headers:
            - name: "X-Body-Type"
              value: '[B'
            - name: "X-Content-Type"
              value: 'ct=application/json'
          body:
            data: '{"id":1,"username":"oscerd","city":"Rome"}'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # consumedQuery deletes the row once it has been sent on
  - createVariables:
      variables:
        - name: "db.container"
          value: "mysql"
        - name: "db.sql"
          value: |-
            SELECT COUNT(*) FROM accounts;
        - name: "db.expected"
          value: '0'
  - repeatOnError:
      until: "i > 30"
      autoSleep: 1000
      actions:
        - groovy:
            script:
              file: "database/sql.groovy"
