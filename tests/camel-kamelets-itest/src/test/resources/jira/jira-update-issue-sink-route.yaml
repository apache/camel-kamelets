- route:
    from:
      uri: "timer:tick"
      parameters:
        period: "1000"
        repeatCount: 1
      steps:
        - setBody:
            constant: '{{jira.issue.description}}'
        - setHeader:
            name: ce-issueKey
            constant: '{{jira.issue.key}}'
        - setHeader:
            name: ce-issueSummary
            constant: '{{jira.issue.summary}}'
        - setHeader:
            name: ce-issueTypeName
            constant: 'Bug'
        - setHeader:
            name: ce-issuePriorityName
            constant: 'High'
        - setHeader:
            name: ce-issueAssignee
            constant: 'superman'
        - setHeader:
            name: ce-issueComponents
            constant: 'core, yaml-dsl'
        # a header that must not reach the Jira component: the Kamelet removes it first, so the type is looked up by name
        - setHeader:
            name: CamelJiraIssueTypeId
            constant: '999'
        - to:
            uri: "kamelet:jira-update-issue-sink"
            parameters:
              jiraUrl: '{{jira.url}}'
              personal-token: '{{jira.personal.token}}'
        # what the Kamelet leaves: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - to:
            uri: "{{jira.url}}/result"
