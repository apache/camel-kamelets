- route:
    from:
      uri: "kamelet:timer-source"
      parameters:
        period: '{{timer.source.period}}'
        repeatCount: 1
        message: '{{jira.issue.description}}'
      steps:
        - to:
            uri: "kamelet:insert-header-action"
            parameters:
              name: ce-projectKey
              value: '{{jira.project.key}}'
        - to:
            uri: "kamelet:insert-header-action"
            parameters:
              name: ce-issueTypeName
              value: '{{jira.issue.type}}'
        - to:
            uri: "kamelet:insert-header-action"
            parameters:
              name: ce-issueSummary
              value: '{{jira.issue.summary}}'
        - to:
            uri: "kamelet:insert-header-action"
            parameters:
              name: ce-issueAssignee
              value: '{{jira.issue.assignee}}'
        - to:
            uri: "kamelet:log-action"
            parameters:
              showHeaders: true
        # the text as bytes: the Kamelet reads it as text
        - convertBodyTo:
            type: "byte[]"
        - to:
            uri: "kamelet:jira-add-issue-sink"
            parameters:
              jiraUrl: '{{jira.url}}'
              username: '{{jira.username}}'
              password: '{{jira.password}}'
        # what the Kamelet leaves: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        # the key of the created issue
        - setBody:
            simple: "${body.key}"
        - to:
            uri: "{{jira.url}}/result"
