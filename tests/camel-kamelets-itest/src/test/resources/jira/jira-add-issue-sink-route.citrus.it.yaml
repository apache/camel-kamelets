name: jira-add-issue-sink-route-test
variables:
  - name: "timer.source.period"
    value: "10000"
  - name: "jira.project.key"
    value: "CAMEL"
  - name: "jira.issue.assignee"
    value: "Superman"
  - name: "jira.issue.type"
    value: "Bug"
  - name: "jira.issue.description"
    value: "Sample bug"
  - name: "jira.project.id"
    value: "10001"
  - name: "jira.issue.id"
    value: "10001"
  - name: "jira.issue.key"
    value: "CAMEL-10001"
  - name: "jira.issue.summary"
    value: "New bug, citrus:randomString(10)"
  - name: "jira.username"
    value: "citrus  "
  - name: "jira.password"
    value: "secr3t"
actions:
  - createVariables:
      variables:
        - name: "jira.url"
          value: "http://localhost:${jira.server.port}"
  # Create Camel JBang integration
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "jira/jira-add-issue-sink-route.yaml"
            systemProperties:
              properties:
                - name: "timer.source.period"
                  value: "${timer.source.period}"
                - name: "jira.url"
                  value: "${jira.url}"
                - name: "jira.project.key"
                  value: "${jira.project.key}"
                - name: "jira.issue.key"
                  value: "${jira.issue.key}"
                - name: "jira.issue.type"
                  value: "${jira.issue.type}"
                - name: "jira.issue.assignee"
                  value: "${jira.issue.assignee}"
                - name: "jira.issue.summary"
                  value: "${jira.issue.summary}"
                - name: "jira.issue.description"
                  value: "${jira.issue.description}"
                - name: "jira.username"
                  value: "${jira.username}"
                - name: "jira.password"
                  value: "${jira.password}"

  # Verify issue type request
  - http:
      server: "jiraServer"
      receiveRequest:
        GET:
          path: "/rest/api/latest/issuetype"
          headers:
            - name: Authorization
              value: "Basic citrus:encodeBase64(${jira.username}:${jira.password})"

  - http:
      server: "jiraServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          contentType: "application/json"
          body:
            data: |
              [
                {
                  "self": "${jira.url}/rest/api/latest/issueType/1",
                  "id": "1",
                  "description": "A problem with the software.",
                  "iconUrl": "${jira.url}/images/icons/issuetypes/bug.png",
                  "name": "Bug",
                  "subtask": false,
                  "avatarId": 2
                },
                {
                  "self": "${jira.url}/rest/api/latest/issueType/3",
                  "id": "3",
                  "description": "A task that needs to be done.",
                  "iconUrl": "${jira.url}/images/icons/issuetypes/task.png",
                  "name": "Task",
                  "subtask": false,
                  "avatarId": 1
                }
              ]

  # Verify add issue request
  - http:
      server: "jiraServer"
      receiveRequest:
        POST:
          path: "/rest/api/latest/issue"
          headers:
            - name: Authorization
              value: "Basic citrus:encodeBase64(${jira.username}:${jira.password})"
          body:
            data: |
              {
                "fields": {
                  "project": {
                    "key": "${jira.project.key}"
                  },
                  "summary": "${jira.issue.summary}",
                  "description": "${jira.issue.description}",
                  "issuetype": {
                    "id": "1"
                  },
                  "assignee": {
                    "name": "${jira.issue.assignee}"
                  }
                },
                "properties": []
              }

  - http:
      server: "jiraServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          contentType: "application/json"
          body:
            data: |
              {
                "id": "${jira.issue.id}",
                "key": "${jira.issue.key}",
                "self": "${jira.url}/rest/api/latest/issue/${jira.issue.id}"
              }

  # the producer reads the created issue back
  - http:
      server: "jiraServer"
      receiveRequest:
        GET:
          path: "/rest/api/latest/issue/${jira.issue.key}"
          headers:
            - name: Authorization
              value: "Basic citrus:encodeBase64(${jira.username}:${jira.password})"

  - http:
      server: "jiraServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          contentType: "application/json"
          body:
            data: |
              {
                "expand": "schema,names",
                "id": "${jira.issue.id}",
                "key": "${jira.issue.key}",
                "self": "${jira.url}/rest/api/latest/issue/${jira.issue.key}",
                "names": {},
                "schema": {},
                "fields": {
                  "project": {
                    "self": "${jira.url}/rest/api/latest/project/${jira.project.id}",
                    "id": "${jira.project.id}",
                    "key": "${jira.project.key}"
                  },
                  "summary": "${jira.issue.summary}",
                  "description": "${jira.issue.description}",
                  "issuetype": {
                    "self": "${jira.url}/rest/api/latest/issuetype/1",
                    "id": "1",
                    "description": "A problem with the software.",
                    "iconUrl": "${jira.url}/images/icons/bug.gif",
                    "name": "${jira.issue.type}",
                    "subtask": false
                  },
                  "created": "2026-11-19T10:15:30.000+0000",
                  "updated": "2026-11-19T10:15:30.000+0000",
                  "status": {
                    "self": "${jira.url}/rest/api/latest/status/1",
                    "id": 1,
                    "description": "Open task.",
                    "iconUrl": "${jira.url}/images/icons/status_1.gif",
                    "name": "Open"
                  }
                }
              }

  # the body afterwards is the created issue (sent here as its key); the Content-Type is the text/plain of the body that went in
  - http:
      server: "jiraServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'com.atlassian.jira.rest.client.api.domain.Issue'
            - name: "X-Content-Type"
              value: 'ct=text/plain'
          body:
            data: '${jira.issue.key}'
  - http:
      server: "jiraServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # Verify JIRA source
  - camel:
      cli:
        verify:
          integration: "jira-add-issue-sink-route"
          logMessage: "${jira.issue.summary}"
