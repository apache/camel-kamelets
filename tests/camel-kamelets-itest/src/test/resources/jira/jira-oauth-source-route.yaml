- route:
    from:
      uri: "kamelet:jira-oauth-source"
      parameters:
        jiraUrl: '{{jira.url}}'
        accessToken: '{{jira.access.token}}'
        verificationCode: '{{jira.verification.code}}'
        consumerKey: '{{jira.consumer.key}}'
        privateKey: '{{jira.private.key}}'
        jql: '{{jira.jql}}'
      steps:
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - to:
            uri: "{{jira.url}}/result"
