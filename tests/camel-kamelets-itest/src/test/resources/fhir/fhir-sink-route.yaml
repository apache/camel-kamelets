- route:
    from:
      uri: "timer:tick"
      parameters:
        period: "1000"
        repeatCount: 1
      steps:
        - setBody:
            constant: '{"resourceType":"Patient","name":[{"family":"{{fhir.family}}","given":["Grace"]}],"gender":"female"}'
        - to:
            uri: "kamelet:fhir-sink"
            parameters:
              serverUrl: '{{fhir.url}}'
              apiName: CREATE
              methodName: resource
        # what the Kamelet leaves: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        # the outcome of the operation: whether it created the resource, and the id it got
        - setHeader:
            name: X-Created
            simple: "${body.getCreated()}"
        - setHeader:
            name: X-Resource-Type
            simple: "${body.getId().getResourceType()}"
        - setBody:
            simple: "${body.getId().getIdPart()}"
        - to:
            uri: "{{http.sink.url}}/result"
