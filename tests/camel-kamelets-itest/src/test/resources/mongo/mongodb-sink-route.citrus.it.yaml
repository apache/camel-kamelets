name: mongodb-sink-route-test
actions:
  # Create MongoDB infrastructure
  - testcontainers:
      start:
        mongodb: {}

  # Create Camel JBang integration (sink): insert, save and update the document "order-1".
  # The route waits for the answer of each HTTP request, so the stored document is checked before the answer.
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "mongo/mongodb-sink-route.yaml"
            systemProperties:
              file: "mongo/application.properties"
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${mongo.server.port}"

  # insert: the body afterwards is the document that was stored; the Kamelet sets no Content-Type
  - http:
      server: "mongoServer"
      receiveRequest:
        POST:
          path: "/insert"
          headers:
            - name: "X-Body-Type"
              value: 'org.bson.Document'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "X-Oid"
              value: 'order-1'
          body:
            data: '{"_id":"order-1","item":"book","qty":2}'
  - createVariables:
      variables:
        - name: "mongodb.expected"
          value: '{"_id":"order-1","item":"book","qty":2}'
  - groovy:
      script:
        file: "mongo/findOrder.groovy"
  - http:
      server: "mongoServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # save: the whole document is replaced; the body afterwards is the result of MongoDB
  - http:
      server: "mongoServer"
      receiveRequest:
        POST:
          path: "/save"
          headers:
            - name: "X-Body-Type"
              value: "@startsWith('com.mongodb.client.result.UpdateResult')@"
            - name: "X-Content-Type"
              value: 'ct='
            - name: "X-Oid"
              value: 'order-1'
  - createVariables:
      variables:
        - name: "mongodb.expected"
          value: '{"_id":"order-1","item":"book","qty":5}'
  - groovy:
      script:
        file: "mongo/findOrder.groovy"
  - http:
      server: "mongoServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # update: the filter matches the document, and $set adds the field status; the body afterwards is the result of MongoDB
  - http:
      server: "mongoServer"
      receiveRequest:
        POST:
          path: "/update"
          headers:
            - name: "X-Body-Type"
              value: "@startsWith('com.mongodb.client.result.UpdateResult')@"
            - name: "X-Content-Type"
              value: 'ct='
            - name: "X-Matched"
              value: '1'
            - name: "X-Affected"
              value: '1'
  - createVariables:
      variables:
        - name: "mongodb.expected"
          value: '{"_id":"order-1","item":"book","qty":5,"status":"shipped"}'
  - groovy:
      script:
        file: "mongo/findOrder.groovy"
  - http:
      server: "mongoServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
