name: mongodb-source-route-test
actions:
  # Create MongoDB infrastructure
  - testcontainers:
      start:
        mongodb: {}

  # Insert test document
  - groovy:
      script:
        file: "mongo/insertDocument.groovy"

  # Create Camel JBang integration (source)
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "mongo/mongodb-source-route.yaml"
            systemProperties:
              file: "mongo/application.properties"
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${mongo.server.port}"

  # The document comes out of the Kamelet as JSON text in bytes; its ObjectId _id is an object of its time
  - http:
      server: "mongoServer"
      receiveRequest:
        POST:
          path: "/result"
          headers:
            - name: "X-Body-Type"
              value: '[B'
            - name: "X-Content-Type"
              value: 'ct=application/json'
          body:
            data: '{"_id":"@ignore@","name":"source-test","value":"hello-from-mongo"}'
  - http:
      server: "mongoServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # The tailable cursor stays open, and MongoDB shows that it reads with the readPreference of the Kamelet. The cursor is
  # idle between two reads and in a running getMore while it waits for data, so the check is repeated until it sees it.
  - repeatOnError:
      until: "i > 10"
      autoSleep: 1000
      actions:
        - groovy:
            script:
              file: "mongo/readPreference.groovy"
