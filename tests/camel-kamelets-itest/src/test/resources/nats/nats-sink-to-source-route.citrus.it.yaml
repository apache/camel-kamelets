name: nats-sink-to-source-route-test
description: 'nats-sink publishes a text message with a header to a NATS subject, and nats-source receives it as bytes, with the header'
variables:
  - name: "nats.topic"
    value: "test-topic"
actions:
  - testcontainers:
      start:
        container:
          name: "nats"
          image: "nats:2.15.3-alpine"
          exposedPorts:
            - 4222
          waitFor:
            logMessage: '.*Server is ready.*'

  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "nats/nats-source-route.yaml"
            systemProperties:
              properties:
                - name: "nats.topic"
                  value: "${nats.topic}"
                - name: "nats.servers"
                  value: "nats://${CITRUS_TESTCONTAINERS_NATS_HOST}:${CITRUS_TESTCONTAINERS_NATS_PORT}"
                - name: "http.sink.url"
                  value: "http://localhost:${nats.server.port}"

  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "nats/nats-sink-route.yaml"
            systemProperties:
              properties:
                - name: "nats.topic"
                  value: "${nats.topic}"
                - name: "nats.servers"
                  value: "nats://${CITRUS_TESTCONTAINERS_NATS_HOST}:${CITRUS_TESTCONTAINERS_NATS_PORT}"

  # The source gives the payload as bytes, with the subject and the NATS header of the sink
  - http:
      server: "natsServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: '[B'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "X-Subject"
              value: 'test-topic'
            - name: "X-Origin"
              value: 'citrus'
          body:
            data: 'hello-nats'
  - http:
      server: "natsServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
