name: topic-name-matches-filter-action-route-test
actions:
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "kafkarouter/topic-name-matches-filter-action-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${http.server.port}"
  - camel:
      cli:
        verify:
          integration: "topic-name-matches-filter-action-route"
          logMessage: "topic-filter-test-data"

  # The body is unchanged
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Content-Type"
              value: 'ct='
          body:
            data: 'topic-filter-test-data'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
