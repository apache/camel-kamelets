name: log-sink-route-test
variables:
  - name: "log.message"
    value: "Hello from log-sink test!"
actions:
  # Create Camel JBang integration
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "log/log-sink-route.yaml"
            systemProperties:
              properties:
                - name: "message"
                  value: "${log.message}"
                - name: "http.sink.url"
                  value: "http://localhost:${http.server.port}"

  # Verify the log output contains the message
  - camel:
      cli:
        verify:
          integration: "log-sink-route"
          logMessage: "${log.message}"

  # The message after the sink is unchanged
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Content-Type"
              value: 'ct=text/plain'
          body:
            data: '${log.message}'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
