- route:
    from:
      uri: "kamelet:smpp-source"
      parameters:
        host: '{{smpp.host}}'
        port: '{{smpp.port}}'
        systemId: 'smppclient1'
        password: 'password'
      steps:
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - setHeader:
            name: X-Smpp-Source-Addr
            simple: "${header.CamelSmppSourceAddr}"
        - setHeader:
            name: X-Smpp-Dest-Addr
            simple: "${header.CamelSmppDestAddr}"
        - setHeader:
            name: X-Smpp-Message-Type
            simple: "${header.CamelSmppMessageType}"
        - to:
            uri: "{{http.sink.url}}/result"
