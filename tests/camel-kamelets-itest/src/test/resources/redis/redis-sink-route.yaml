- route:
    from:
      uri: "timer:tick"
      parameters:
        repeatCount: 1
      steps:
      - setBody:
          constant: "hello-redis"
      - setHeader:
          name: key
          constant: "test-key"
      - to:
          uri: "kamelet:redis-sink"
          parameters:
            redisHost: "{{redis.host}}"
            redisPort: "{{redis.port}}"
            command: "SET"
      # for SET the body stays as it was
      - setHeader:
          name: X-After-Set
          simple: "${body}"
      # read the value back with the Kamelet: for GET the body is the value
      - setBody:
          constant: ""
      - to:
          uri: "kamelet:redis-sink"
          parameters:
            redisHost: "{{redis.host}}"
            redisPort: "{{redis.port}}"
            command: "GET"
      - setHeader:
          name: X-Body-Type
          simple: "${body.getClass().getName()}"
      - to:
          uri: "{{http.sink.url}}/result"
