name: redis-source-route-test
variables:
  - name: "maxRetryAttempts"
    value: "30"
actions:
  - testcontainers:
      start:
        container:
          name: "redis"
          image: "redis:7.4.12-alpine"
          exposedPorts:
            - 6379

  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "redis/redis-source-route.yaml"
            systemProperties:
              properties:
                - name: "redis.host"
                  value: "${CITRUS_TESTCONTAINERS_REDIS_HOST}"
                - name: "redis.port"
                  value: "${CITRUS_TESTCONTAINERS_REDIS_PORT}"
                - name: "http.sink.url"
                  value: "http://localhost:${redis.server.port}"

  # publish until the Kamelet has subscribed and gets the message
  - repeatOnError:
      until: "i > ${maxRetryAttempts}"
      autoSleep: 1000
      actions:
        - groovy:
            script:
              file: "redis/publish.groovy"

  - http:
      server: "redisServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "X-Channel"
              value: 'orders'
            - name: "X-Pattern-Type"
              value: '[B'
            - name: "X-Pattern"
              value: 'orders'
          body:
            data: 'ORD-1 shipped'
  - http:
      server: "redisServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
