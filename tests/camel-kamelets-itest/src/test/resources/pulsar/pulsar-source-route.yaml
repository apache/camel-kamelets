- route:
    from:
      uri: "kamelet:pulsar-source"
      parameters:
        serviceUrl: '{{pulsar.service.url}}'
        topicType: 'persistent'
        tenant: 'public'
        namespaceName: 'default'
        topic: 'orders'
        subscriptionName: 'citrus'
        subscriptionInitialPosition: 'EARLIEST'
      steps:
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - setHeader:
            name: X-Origin
            simple: "${header.properties[origin]}"
        # the body is bytes: give the HTTP server text (Citrus reads an application/octet-stream body as bytes)
        - convertBodyTo:
            type: "java.lang.String"
        - setHeader:
            name: Content-Type
            constant: "text/plain"
        - to:
            uri: "{{http.sink.url}}/result"

# sends one message for the source to receive; the source reads from the earliest message, so the order does not matter
- route:
    from:
      uri: "timer:send"
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            constant: 'Hello Pulsar'
        - setHeader:
            name: key
            constant: 'order-1'
        - setHeader:
            name: CamelPulsarProducerMessageProperties
            groovy: "[origin: 'citrus']"
        - to:
            uri: "kamelet:pulsar-sink"
            parameters:
              serviceUrl: '{{pulsar.service.url}}'
              topicType: 'persistent'
              tenant: 'public'
              namespaceName: 'default'
              topic: 'orders'
