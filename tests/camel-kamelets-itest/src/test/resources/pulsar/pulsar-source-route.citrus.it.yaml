name: pulsar-source-route-test
description: 'pulsar-source receives a message from a topic in Pulsar, as bytes with the Content-Type application/octet-stream, and with the topic, key, properties and message ID as headers'
actions:
  # Start Pulsar
  - testcontainers:
      start:
        container:
          name: "pulsar"
          image: "apachepulsar/pulsar:5.0.1"
          command: "bin/pulsar standalone"
          autoRemove: true
          startUpTimeout: 300
          exposedPorts:
            - 6650
          waitFor:
            logMessage: '.*Created namespace .*namespace=public/default.*'

  # Create Camel JBang integration
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "pulsar/pulsar-source-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${http.server.port}"
                - name: "pulsar.service.url"
                  value: "pulsar://${CITRUS_TESTCONTAINERS_PULSAR_HOST}:${CITRUS_TESTCONTAINERS_PULSAR_PORT}"

  # The source gives the payload as bytes with the Content-Type application/octet-stream, and with the topic, key, properties, message ID, publish time and producer name
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: '[B'
            - name: "X-Content-Type"
              value: 'ct=application/octet-stream'
            - name: "topic_name"
              value: 'persistent://public/default/orders'
            - name: "key"
              value: 'order-1'
            - name: "X-Origin"
              value: 'citrus'
            - name: "message_id"
              value: '@notEmpty()@'
            - name: "publish_time"
              value: '@matches([0-9]+)@'
            - name: "producer_name"
              value: '@notEmpty()@'
          body:
            data: 'Hello Pulsar'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
