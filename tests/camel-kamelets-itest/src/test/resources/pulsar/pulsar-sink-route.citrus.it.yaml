name: pulsar-sink-route-test
description: 'pulsar-sink sends a text message, with a key from the key header and properties from a Map, to a topic in Pulsar'
actions:
  # Start Pulsar
  - testcontainers:
      start:
        container:
          name: "pulsar"
          image: "apachepulsar/pulsar:5.0.1"
          command: "bin/pulsar standalone"
          autoRemove: true
          startUpTimeout: 300
          exposedPorts:
            - 6650
          waitFor:
            logMessage: '.*Created namespace .*namespace=public/default.*'

  # Create Camel JBang integration
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "pulsar/pulsar-sink-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${http.server.port}"
                - name: "pulsar.service.url"
                  value: "pulsar://${CITRUS_TESTCONTAINERS_PULSAR_HOST}:${CITRUS_TESTCONTAINERS_PULSAR_PORT}"

  # The message goes on unchanged after the Kamelet
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "key"
              value: 'order-1'
          body:
            data: 'Hello Pulsar'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # The message is on the topic, with its key and properties
  - camel:
      cli:
        verify:
          integration: "pulsar-sink-route"
          logMessage: 'Received from the topic: Hello Pulsar (key=order-1, properties={origin=citrus})'
          maxAttempts: 30
          delayBetweenAttempts: 1000
