- route:
    from:
      uri: "timer:send"
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            constant: 'Hello Pulsar'
        - setHeader:
            name: key
            constant: 'order-1'
        - setHeader:
            name: CamelPulsarProducerMessageProperties
            groovy: "[origin: 'citrus']"
        - to:
            uri: "kamelet:pulsar-sink"
            parameters:
              serviceUrl: '{{pulsar.service.url}}'
              topicType: 'persistent'
              tenant: 'public'
              namespaceName: 'default'
              topic: 'orders'
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Body
            simple: "${bodyAs(String)}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - setHeader:
            name: X-Message-Id
            simple: "${header.CamelPulsarProducerMessageId}"
        - to:
            uri: "{{http.sink.url}}/result"

# reads the message back from the topic, to show that it arrived
- route:
    from:
      uri: "kamelet:pulsar-source"
      parameters:
        serviceUrl: '{{pulsar.service.url}}'
        topicType: 'persistent'
        tenant: 'public'
        namespaceName: 'default'
        topic: 'orders'
        subscriptionName: 'citrus'
        subscriptionInitialPosition: 'EARLIEST'
      steps:
        - log:
            message: 'Received from the topic: ${bodyAs(String)} (key=${header.key}, properties=${header.properties})'
