- route:
    from:
      uri: "kamelet:ssh-source"
      parameters:
        connectionHost: '{{ssh.host}}'
        connectionPort: '{{ssh.port}}'
        username: 'citrus'
        # a password with characters that have a meaning in an endpoint address
        password: 's3cr&t+pw'
        # several commands, one that writes to the standard error
        pollCommand: 'echo "disk ok"; echo "check done" 1>/dev/stderr'
        # run the command once in the test
        delay: 600000
      steps:
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        # Camel headers are not sent over HTTP: copy them
        - setHeader:
            name: X-Ssh-Exit-Value
            simple: "${header.CamelSshExitValue}"
        - setHeader:
            name: X-Ssh-Stderr-Type
            simple: "${header.CamelSshStderr.getClass().getName()}"
        - setHeader:
            name: X-Ssh-Stderr
            simple: "${headerAs(CamelSshStderr, String)}"
        - setHeader:
            name: X-Ssh-Stderr
            simple: "${header.X-Ssh-Stderr.trim()}"
        - to:
            uri: "{{http.sink.url}}/result"
