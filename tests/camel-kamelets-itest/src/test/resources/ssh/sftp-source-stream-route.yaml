- route:
    from:
      uri: "kamelet:sftp-source"
      parameters:
        connectionHost: '{{ssh.host}}'
        connectionPort: '{{ssh.port}}'
        username: 'citrus'
        # a password with characters that have a meaning in an endpoint address
        password: 's3cr&t+pw'
        directoryName: 'orders'
        # the file is read from the server while it is handed on, as a stream
        streamDownload: true
        # the key of the server is checked against this known_hosts file
        knownHostsUri: 'file://{{ssh.known.hosts}}'
      steps:
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        # Camel headers are not sent over HTTP: copy them
        - setHeader:
            name: X-File-Name
            simple: "${header.CamelFileName}"
        - setHeader:
            name: X-File-Length
            simple: "${header.CamelFileLength}"
        # the body is a stream: give the HTTP server text
        - convertBodyTo:
            type: "java.lang.String"
        - to:
            uri: "{{http.sink.url}}/result"
