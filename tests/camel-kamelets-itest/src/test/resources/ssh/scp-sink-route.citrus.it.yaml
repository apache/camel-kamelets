name: scp-sink-route-test
description: 'scp-sink copies the body as a file to the directory on the server, under the name in the CamelFileName header, checking the key of the server against the known_hosts file of knownHostsUri, and the message goes on unchanged'
variables:
  - name: "ssh.chmod"
    value: "640"
actions:
  # Start the OpenSSH server (port 2222), with the user citrus, whose password has characters that have a
  # meaning in an endpoint address
  - testcontainers:
      start:
        container:
          name: "ssh"
          image: "linuxserver/openssh-server:version-10.3_p1-r2"
          autoRemove: true
          startUpTimeout: 120
          env:
            - name: "USER_NAME"
              value: "citrus"
            - name: "USER_PASSWORD"
              value: "s3cr&t+pw"
            - name: "PASSWORD_ACCESS"
              value: "true"
            - name: "PUID"
              value: "1000"
            - name: "PGID"
              value: "1000"
          exposedPorts:
            - 2222
          waitFor:
            logMessage: '.*\[ls.io-init\] done.*'
  - groovy:
      script:
        file: "ssh/sshServer.groovy"

  # Create Camel JBang integration
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "ssh/scp-sink-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${file.http.server.port}"
                - name: "ssh.host"
                  value: "${CITRUS_TESTCONTAINERS_SSH_HOST}"
                - name: "ssh.port"
                  value: "${CITRUS_TESTCONTAINERS_SSH_PORT}"
                - name: "ssh.known.hosts"
                  value: "${ssh.known.hosts}"

  # The message goes on unchanged
  - http:
      server: "fileHttpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "X-File-Name"
              value: 'day 1.csv'
          body:
            data: |-
              id,item
              1,book
  - http:
      server: "fileHttpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # The server has the file, with the body as its content and the permissions of chmod
  - repeatOnError:
      until: "i = 10"
      autoSleep: 1000
      actions:
        - groovy:
            script:
              file: "ssh/verifyUpload.groovy"

finally:
  - groovy:
      script:
        file: "ssh/deleteKnownHosts.groovy"
