name: sftp-source-stream-route-test
description: 'sftp-source with streamDownload reads the file in the directory on the SFTP server as a stream, kept by stream caching, with its name in the file, ce-file and CamelFileName headers'
actions:
  # Start the OpenSSH server (port 2222), with the user citrus, whose password has characters that have a
  # meaning in an endpoint address
  - testcontainers:
      start:
        container:
          name: "ssh"
          image: "linuxserver/openssh-server:version-10.3_p1-r2"
          autoRemove: true
          startUpTimeout: 120
          env:
            - name: "USER_NAME"
              value: "citrus"
            - name: "USER_PASSWORD"
              value: "s3cr&t+pw"
            - name: "PASSWORD_ACCESS"
              value: "true"
            - name: "PUID"
              value: "1000"
            - name: "PGID"
              value: "1000"
          exposedPorts:
            - 2222
          waitFor:
            logMessage: '.*\[ls.io-init\] done.*'
  - groovy:
      script:
        file: "ssh/sshServer.groovy"

  # Create Camel JBang integration
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "ssh/sftp-source-stream-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${file.http.server.port}"
                - name: "ssh.host"
                  value: "${CITRUS_TESTCONTAINERS_SSH_HOST}"
                - name: "ssh.port"
                  value: "${CITRUS_TESTCONTAINERS_SSH_PORT}"
                - name: "ssh.known.hosts"
                  value: "${ssh.known.hosts}"

  # The source gives the content of the file as a stream, with its name, which has a space, and its size
  - http:
      server: "fileHttpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'org.apache.camel.converter.stream.InputStreamCache'
            - name: "X-Content-Type"
              value: 'ct=application/octet-stream'
            - name: "file"
              value: 'order 1.csv'
            - name: "ce-file"
              value: 'order 1.csv'
            - name: "X-File-Name"
              value: 'order 1.csv'
            - name: "X-File-Length"
              value: '15'
          body:
            data: |
              id,item
              1,book
  - http:
      server: "fileHttpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

finally:
  - groovy:
      script:
        file: "ssh/deleteKnownHosts.groovy"
