- route:
    from:
      uri: "timer:chat"
      parameters:
        repeatCount: 2
      steps:
        - setBody:
            constant: "What is Apache Camel?"
        - doTry:
            steps:
              - to:
                  uri: "kamelet:openai-chat-action"
                  parameters:
                    baseUrl: '{{chat.server.url}}/v1'
                    apiKey: '{{chat.api.token}}'
                    model: '{{chat.model}}'
              - setHeader:
                  name: X-Error-Type
                  constant: "none"
            doCatch:
              - exception:
                  - java.lang.Exception
                steps:
                  - setHeader:
                      name: X-Error-Type
                      simple: "${exception.class.name}"
                  - setBody:
                      simple: "${exception.message}"
        - to:
            uri: "{{chat.server.url}}/result"
