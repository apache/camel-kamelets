- route:
    from:
      uri: "timer:chat"
      parameters:
        repeatCount: 2
      steps:
        - setBody:
            constant: "I was charged twice for my order, please fix it today."
        # the server of the test checks no API key, but one must be set: any text will do
        - choice:
            when:
              - simple: "${exchangeProperty.CamelTimerCounter} == 1"
                steps:
                  # the schema as JSON text: in a route, two closing braces next to each other would be read as the
                  # end of a placeholder, so they are written with a space in between
                  - to:
                      uri: "kamelet:openai-chat-action"
                      parameters:
                        baseUrl: '{{chat.server.url}}/v1'
                        apiKey: 'none'
                        model: '{{chat.model}}'
                        jsonSchema: '{"type":"object","properties":{"topic":{"type":"string","enum":["billing","technical","other"]},"urgent":{"type":"boolean"} },"required":["topic","urgent"]}'
            otherwise:
              steps:
                # the schema from a file
                - to:
                    uri: "kamelet:openai-chat-action"
                    parameters:
                      baseUrl: '{{chat.server.url}}/v1'
                      apiKey: 'none'
                      model: '{{chat.model}}'
                      jsonSchema: 'resource:file:ticket-schema.json'
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - to:
            uri: "{{chat.server.url}}/result"
