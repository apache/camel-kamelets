- route:
    from:
      uri: "kamelet:infinispan-source"
      parameters:
        cacheName: 'kamelets'
        hosts: '{{infinispan.hosts}}'
        username: 'admin'
        password: 'password'
        saslMechanism: 'SCRAM-SHA-512'
        eventTypes: 'CLIENT_CACHE_ENTRY_CREATED'
      steps:
        # what the Kamelet gives: the Java type of the body (null when there is no body) and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${iif(${body} == null,null,${body.getClass().getName()})}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        # without a body, the HTTP component would send a GET
        - setHeader:
            name: CamelHttpMethod
            constant: 'POST'
        - to:
            uri: "{{http.sink.url}}/result"

# writes an entry, once the source above has started and listens to the cache
- route:
    from:
      uri: "timer:write"
      parameters:
        delay: "2000"
        repeatCount: 1
      steps:
        - setHeader:
            name: CamelInfinispanKey
            constant: 'order-1'
        - setHeader:
            name: CamelInfinispanValue
            constant: 'ORD-1 shipped'
        - to:
            uri: "infinispan:kamelets"
            parameters:
              hosts: '{{infinispan.hosts}}'
              secure: true
              username: 'admin'
              password: 'password'
              saslMechanism: 'SCRAM-SHA-512'
              operation: 'PUT'
