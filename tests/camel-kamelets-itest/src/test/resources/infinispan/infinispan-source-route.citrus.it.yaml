name: infinispan-source-route-test
actions:
  # Infinispan server with the user admin
  - testcontainers:
      start:
        container:
          name: "infinispan"
          image: "quay.io/infinispan/server:16.3"
          startUpTimeout: 180
          exposedPorts:
            - 11222
          env:
            - name: "USER"
              value: "admin"
            - name: "PASS"
              value: "password"
          waitFor:
            url: "http://localhost:11222/rest/v2/container/health/status"

  - groovy:
      script:
        file: "infinispan/createCache.groovy"

  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "infinispan/infinispan-source-route.yaml"
            systemProperties:
              properties:
                - name: "infinispan.hosts"
                  value: "${CITRUS_TESTCONTAINERS_INFINISPAN_HOST}:${CITRUS_TESTCONTAINERS_INFINISPAN_PORT}"
                - name: "http.sink.url"
                  value: "http://localhost:${infinispan.server.port}"

  # the event is in headers, and there is no body
  - http:
      server: "infinispanServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'null'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "infinispan-event-type"
              value: 'CLIENT_CACHE_ENTRY_CREATED'
            - name: "infinispan-key"
              value: 'order-1'
            - name: "infinispan-cache-name"
              value: 'kamelets'
            - name: "infinispan-entry-version"
              value: '@isNumber()@'
            - name: "ce-infinispaneventtype"
              value: 'CLIENT_CACHE_ENTRY_CREATED'
            - name: "ce-infinispankey"
              value: 'order-1'
            - name: "ce-infinispancachename"
              value: 'kamelets'
          body:
            data: ''
  - http:
      server: "infinispanServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
