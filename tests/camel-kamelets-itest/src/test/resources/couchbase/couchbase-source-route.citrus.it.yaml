name: couchbase-source-route-test
actions:
  # Create Couchbase infrastructure, on random host ports: initCluster.groovy
  # advertises them to the Couchbase SDK as the external addresses of the node
  - testcontainers:
      start:
        container:
          name: "couchbase"
          image: "couchbase/server:community-7.6.2"
          startUpTimeout: 300
          exposedPorts:
            - 8091
            - 8093
            - 11210
          waitFor:
            logMessage: ".*Starting Couchbase Server.*"

  # Initialise the cluster, create the bucket and seed one document
  - groovy:
      script:
        file: "couchbase/initCluster.groovy"

  # Create Camel JBang integration (source)
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "couchbase/couchbase-source-route.yaml"
            systemProperties:
              file: "couchbase/application.properties"
              properties:
                - name: "couchbase.hostname"
                  value: "${couchbase.host}"
                - name: "couchbase.connection.string"
                  value: "couchbase://${couchbase.host}:${couchbase.kv.port}"
                - name: "http.sink.url"
                  value: "http://localhost:${couchbase.server.port}"

  # The source gives each row of the query as JSON text, with the document ID
  - http:
      server: "couchbaseServer"
      receiveRequest:
        POST:
          path: "/result"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "X-Id"
              value: 'doc1'
          body:
            data: '{"_default":{"message":"hello-from-couchbase"},"__id":"doc1"}'
  - http:
      server: "couchbaseServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
