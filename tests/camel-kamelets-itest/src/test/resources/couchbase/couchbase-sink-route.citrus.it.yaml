name: couchbase-sink-route-test
actions:
  # Create Couchbase infrastructure, on random host ports: initCluster.groovy
  # advertises them to the Couchbase SDK as the external addresses of the node
  - testcontainers:
      start:
        container:
          name: "couchbase"
          image: "couchbase/server:community-7.6.2"
          startUpTimeout: 300
          exposedPorts:
            - 8091
            - 8093
            - 11210
          waitFor:
            logMessage: ".*Starting Couchbase Server.*"

  # Initialise the cluster, create the bucket (and seed one document, not used here)
  - groovy:
      script:
        file: "couchbase/initCluster.groovy"

  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "couchbase/couchbase-sink-route.yaml"
            systemProperties:
              file: "couchbase/application.properties"
              properties:
                - name: "couchbase.hostname"
                  value: "${couchbase.host}"
                - name: "couchbase.connection.string"
                  value: "couchbase://${couchbase.host}:${couchbase.kv.port}"
                - name: "http.sink.url"
                  value: "http://localhost:${couchbase.server.port}"

  # the body afterwards is true
  - http:
      server: "couchbaseServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.Boolean'
            - name: "X-Content-Type"
              value: 'ct='
          body:
            data: 'true'
  - http:
      server: "couchbaseServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # the document is stored as a JSON document, under the id of the CamelCouchbaseId header
  - http:
      client: "http://${couchbase.host}:${couchbase.query.port}"
      sendRequest:
        POST:
          path: "/query/service"
          contentType: "application/json"
          headers:
            - name: "Authorization"
              value: "Basic citrus:encodeBase64('Administrator:password')"
          body:
            data: '{"statement":"SELECT RAW k FROM `kamelets` k USE KEYS ''order-1''"}'
  - http:
      client: "http://${couchbase.host}:${couchbase.query.port}"
      receiveResponse:
        response:
          status: 200
        validate:
          - jsonPath:
              - expression: "$.results[0].order"
                value: "ORD-1"
              - expression: "$.results[0].status"
                value: "shipped"
