name: ftps-sink-route-test
description: 'ftps-sink uploads the body as a file to the directory on the FTPS server, under the name in the file header without its directory, and the message goes on unchanged (the server and the integration speak explicit TLS)'
variables:
  - name: "ftp.tls"
    value: "true"
actions:
  # Start the FTPS server
  - groovy:
      script:
        file: "ftp/ftpServer.groovy"

  # Create Camel JBang integration
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "ftp/ftps-sink-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${file.http.server.port}"
                - name: "ftp.port"
                  value: "${ftp.server.port}"
                - name: "ftp.truststore"
                  value: "${ftp.truststore}"

  # The message goes on unchanged, with the path of the file on the server
  - http:
      server: "fileHttpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "X-File-Name-Produced"
              value: 'upload/day 1.csv'
          body:
            data: |-
              id,item
              1,book
  - http:
      server: "fileHttpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # The server has the file, with the body as its content
  - repeatOnError:
      until: "i = 10"
      autoSleep: 1000
      actions:
        - groovy:
            script:
              file: "ftp/verifyUpload.groovy"

finally:
  - groovy:
      script:
        file: "ftp/ftpServerStop.groovy"
