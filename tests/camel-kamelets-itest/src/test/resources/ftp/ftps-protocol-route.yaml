# The FTPS server of this test speaks only TLS 1.3.

# Without securityProtocol, ftps-source offers TLS 1.3, and reads the file. Then ftps-sink with
# securityProtocol TLSv1.3 uploads it, and ftps-sink with TLSv1.2 fails the message.
- route:
    from:
      uri: "kamelet:ftps-source"
      parameters:
        connectionHost: 'localhost'
        connectionPort: '{{ftp.port}}'
        username: 'citrus'
        password: 's3cr&t+pw'
        directoryName: 'orders'
        trustStoreFile: '{{ftp.truststore}}'
        trustStorePassword: 'changeit'
      steps:
        - log:
            message: "ftps-source read ${header.CamelFileName}"
        - convertBodyTo:
            type: "java.lang.String"
        - removeHeader:
            name: Content-Type
        - to:
            uri: "kamelet:ftps-sink"
            parameters:
              connectionHost: 'localhost'
              connectionPort: '{{ftp.port}}'
              username: 'citrus'
              password: 's3cr&t+pw'
              directoryName: 'upload'
              trustStoreFile: '{{ftp.truststore}}'
              trustStorePassword: 'changeit'
              passiveMode: true
              securityProtocol: 'TLSv1.3'
        - setHeader:
            name: X-File-Name-Produced
            simple: "${header.CamelFileNameProduced}"
        - doTry:
            steps:
              - to:
                  uri: "kamelet:ftps-sink"
                  parameters:
                    connectionHost: 'localhost'
                    connectionPort: '{{ftp.port}}'
                    username: 'citrus'
                    password: 's3cr&t+pw'
                    directoryName: 'upload12'
                    trustStoreFile: '{{ftp.truststore}}'
                    trustStorePassword: 'changeit'
                    passiveMode: true
                    securityProtocol: 'TLSv1.2'
              - setHeader:
                  name: X-Error
                  constant: 'none'
            doCatch:
              - exception:
                  - "java.lang.Exception"
                steps:
                  - setHeader:
                      name: X-Error
                      simple: "${exception.class.name}: ${exception.message}"
        - to:
            uri: "{{http.sink.url}}/result"

# With securityProtocol TLSv1.2, ftps-source never offers TLS 1.3, so it cannot connect
- route:
    from:
      uri: "kamelet:ftps-source"
      parameters:
        connectionHost: 'localhost'
        connectionPort: '{{ftp.port}}'
        username: 'citrus'
        password: 's3cr&t+pw'
        directoryName: 'orders'
        trustStoreFile: '{{ftp.truststore}}'
        trustStorePassword: 'changeit'
        securityProtocol: 'TLSv1.2'
        delay: 1000
      steps:
        - log:
            message: "ftps-source with TLSv1.2 read ${header.CamelFileName}"
