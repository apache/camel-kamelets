name: ftps-source-route-test
description: 'ftps-source reads the file in the directory on the FTPS server, as a stream, with its name in the file, ce-file and CamelFileName headers (the server and the integration speak explicit TLS)'
variables:
  - name: "ftp.tls"
    value: "true"
actions:
  # Start the FTPS server, with a file for the source to read, whose name has a space
  - groovy:
      script:
        file: "ftp/ftpServer.groovy"
  - groovy:
      script:
        file: "ftp/putFile.groovy"

  # Create Camel JBang integration
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "ftp/ftps-source-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${file.http.server.port}"
                - name: "ftp.port"
                  value: "${ftp.server.port}"
                - name: "javax.net.ssl.trustStore"
                  value: "${ftp.truststore}"
                - name: "javax.net.ssl.trustStorePassword"
                  value: "changeit"
                - name: "javax.net.ssl.trustStoreType"
                  value: "PKCS12"

  # Wait until the source has read the file: when it does not, this step fails and shows the log of the
  # integration, such as an error of the FTPS connection
  - camel:
      cli:
        verify:
          integration: "ftps-source-route"
          logMessage: "ftps-source read order 1.csv"
          maxAttempts: 60

  # The source gives the content of the file as a stream, with its name and size
  - http:
      server: "fileHttpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'org.apache.camel.converter.stream.ByteArrayInputStreamCache'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "file"
              value: 'order 1.csv'
            - name: "ce-file"
              value: 'order 1.csv'
            - name: "X-File-Name"
              value: 'order 1.csv'
            - name: "X-File-Length"
              value: '15'
          body:
            data: |
              id,item
              1,book
  - http:
      server: "fileHttpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

finally:
  - groovy:
      script:
        file: "ftp/ftpServerStop.groovy"
