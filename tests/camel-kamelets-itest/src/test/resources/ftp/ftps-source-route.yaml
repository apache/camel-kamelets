- route:
    from:
      uri: "kamelet:ftps-source"
      parameters:
        connectionHost: 'localhost'
        connectionPort: '{{ftp.port}}'
        username: 'citrus'
        # a password with characters that have a meaning in an endpoint address
        password: 's3cr&t+pw'
        directoryName: 'orders'
        # the Kamelet trusts the certificate of the test server with its own trust store, not the one of the JVM
        trustStoreFile: '{{ftp.truststore}}'
        trustStorePassword: 'changeit'
        trustStoreType: 'PKCS12'
      steps:
        # a line for the test to wait for, so that a failure shows the log of the integration
        - log:
            message: "ftps-source read ${header.CamelFileName}"
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        # Camel headers are not sent over HTTP: copy them
        - setHeader:
            name: X-File-Name
            simple: "${header.CamelFileName}"
        - setHeader:
            name: X-File-Length
            simple: "${header.CamelFileLength}"
        # Citrus reads an application/octet-stream body as bytes: send text
        - removeHeader:
            name: Content-Type
        # the body is a stream: give the HTTP server text
        - convertBodyTo:
            type: "java.lang.String"
        - to:
            uri: "{{http.sink.url}}/result"
