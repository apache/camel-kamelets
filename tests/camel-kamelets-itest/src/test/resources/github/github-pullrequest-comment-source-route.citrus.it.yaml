name: github-pullrequest-comment-source-route-test
description: 'github-pullrequest-comment-source sends a comment written after the start as JSON text with the fields its description lists, with the number of its pull request in a header, and asks the GitHub API for nothing more than its polls'
variables:
  # the repository of the canned answers of this test, and the only requests the source may make for it
  - name: "github.api.repo"
    value: "citrus/comment-demo"
  - name: "github.api.expected"
    value: "user,repos/citrus/comment-demo,repos/citrus/comment-demo/pulls,repos/citrus/comment-demo/issues/7/comments"
actions:
  # The stand-in of the GitHub API answers with canned JSON for the repository citrus/comment-demo: pull request #7 has no comment when the source starts, then one
  - groovy:
      script:
        file: "github/resetApi.groovy"

  # Create Camel JBang integration
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "github/github-pullrequest-comment-source-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${cloud.http.server.port}"
                # the GitHub API is the stand-in of the test
                - name: "camel.component.github2.apiUrl"
                  value: "http://localhost:${github.api.port}"

  # The new comment
  - http:
      server: "cloudHttpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "json"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Content-Type"
              value: 'ct=application/json'
            - name: "X-Pull-Request"
              value: '7'
          body:
            data: |
              {
                "id": 701,
                "body": "/retest",
                "html_url": "https://github.com/citrus/comment-demo/pull/7#issuecomment-701",
                "user": { "login": "john" },
                "author_association": "OWNER",
                "created_at": "2026-11-04T10:00:00Z",
                "updated_at": "2026-11-04T10:00:00Z"
              }
  - http:
      server: "cloudHttpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # The source asked the GitHub API for nothing per message: no user, commit or pull request details
  - groovy:
      script:
        file: "github/onlyPolls.groovy"

  # and only for what it has canned answers for
  - groovy:
      script:
        file: "github/noUnknownRequests.groovy"
