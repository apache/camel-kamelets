name: github-event-source-route-test
description: 'github-event-source sends the events of the repository, oldest first, each with its type as a JSON string'
actions:
  # The stand-in of the GitHub API answers with canned JSON for the repository citrus/demo
  - groovy:
      script:
        file: "github/resetApi.groovy"

  # Create Camel JBang integration
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "github/github-event-source-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${cloud.http.server.port}"
                # the GitHub API is the stand-in of the test
                - name: "camel.component.github2.apiUrl"
                  value: "http://localhost:${github.api.port}"

  # The oldest event first
  - http:
      server: "cloudHttpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: '[B'
            - name: "X-Content-Type"
              value: 'ct=application/json'
          body:
            data: '"PUSH"'
  - http:
      server: "cloudHttpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # Then the newer one
  - http:
      server: "cloudHttpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: '[B'
            - name: "X-Content-Type"
              value: 'ct=application/json'
          body:
            data: '"ISSUES"'
  - http:
      server: "cloudHttpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # The source asked the GitHub API only for what it has canned answers for
  - groovy:
      script:
        file: "github/noUnknownRequests.groovy"
