- route:
    from:
      uri: "kamelet:github-commit-source"
      parameters:
        oauthToken: 'not-a-real-token'
        repoOwner: 'citrus'
        repoName: 'demo'
        delay: 1000
        branch: 'main'
        startingSha: 'beginning'
      steps:
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        # Camel headers are not sent over HTTP: copy them
        - setHeader:
            name: X-Commit-Sha
            simple: "${header.CamelGitHubCommitSha}"
        - setHeader:
            name: X-Commit-Url
            simple: "${header.CamelGitHubCommitUrl}"
        - setHeader:
            name: X-Commit-Author
            simple: "${header.CamelGitHubCommitAuthor}"
        - setHeader:
            name: X-Commit-Committer
            simple: "${header.CamelGitHubCommitCommitter}"
        - to:
            uri: "{{http.sink.url}}/result"
