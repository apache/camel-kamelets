name: github-commit-source-route-test
description: 'github-commit-source with startingSha beginning sends the commits already on the branch, oldest first, each with its message as a JSON string, its SHA, address, author and committer'
actions:
  # The stand-in of the GitHub API answers with canned JSON for the repository citrus/demo
  - groovy:
      script:
        file: "github/resetApi.groovy"

  # Create Camel JBang integration
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "github/github-commit-source-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${cloud.http.server.port}"
                # the GitHub API is the stand-in of the test
                - name: "camel.component.github2.apiUrl"
                  value: "http://localhost:${github.api.port}"

  # The oldest commit first
  - http:
      server: "cloudHttpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'org.apache.camel.converter.stream.InputStreamCache'
            - name: "X-Content-Type"
              value: 'ct=application/json'
            - name: "X-Commit-Sha"
              value: '1111111111111111111111111111111111111111'
            - name: "X-Commit-Url"
              value: 'https://github.com/citrus/demo/commit/1111111111111111111111111111111111111111'
            - name: "X-Commit-Author"
              value: 'John Smith'
            - name: "X-Commit-Committer"
              value: 'John Smith'
          body:
            data: '"Initial commit"'
  - http:
      server: "cloudHttpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # Then the newer one
  - http:
      server: "cloudHttpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'org.apache.camel.converter.stream.InputStreamCache'
            - name: "X-Content-Type"
              value: 'ct=application/json'
            - name: "X-Commit-Sha"
              value: '2222222222222222222222222222222222222222'
            - name: "X-Commit-Url"
              value: 'https://github.com/citrus/demo/commit/2222222222222222222222222222222222222222'
            - name: "X-Commit-Author"
              value: 'Jane Doe'
            - name: "X-Commit-Committer"
              value: 'John Smith'
          body:
            data: '"Fix the login page"'
  - http:
      server: "cloudHttpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # The source asked the GitHub API only for what it has canned answers for
  - groovy:
      script:
        file: "github/noUnknownRequests.groovy"
