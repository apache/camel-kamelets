- route:
    from:
      uri: "timer:tick"
      parameters:
        period: "1000"
        repeatCount: 1
      steps:
        - setHeader:
            name: x-tmp-one
            constant: 'a'
        - setHeader:
            name: x-tmp-keep
            constant: 'b'
        - setHeader:
            name: x-other
            constant: 'c'
        - setBody:
            constant: 'ORD-1'
        - to:
            uri: "kamelet:drop-headers-action"
            parameters:
              pattern: 'x-tmp-*'
              excludePattern: 'x-tmp-keep'
        # What the Kamelet leaves on the message
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - setHeader:
            name: X-Remaining
            simple: "x-tmp-one=${header.x-tmp-one} x-tmp-keep=${header.x-tmp-keep} x-other=${header.x-other}"
        - to:
            uri: "{{http.sink.url}}/result"
