name: smb-source-route-test
description: 'smb-source reads the file in the directory on the share, with its name in the file, ce-file and CamelFileName headers, its size and its UNC path, and moves it to the directory of move, with encryptData on a share that does not require it'
actions:
  # Start the Samba server (port 445) with the share files and the user citrus, whose password has characters
  # that have a meaning in an endpoint address
  - testcontainers:
      start:
        container:
          name: "smb"
          image: "dockurr/samba:4.23.10"
          autoRemove: true
          startUpTimeout: 120
          env:
            - name: "NAME"
              value: "files"
            - name: "USER"
              value: "citrus"
            - name: "PASS"
              value: "s3cr&t+pw"
          exposedPorts:
            - 445
  - groovy:
      script:
        file: "smb/smbServer.groovy"

  # Create Camel JBang integration
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "smb/smb-source-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${smb.http.server.port}"
                - name: "smb.host"
                  value: "${CITRUS_TESTCONTAINERS_SMB_HOST}"
                - name: "smb.port"
                  value: "${CITRUS_TESTCONTAINERS_SMB_PORT}"

  # The source gives the content of the file, with its name, which has a space, its size and its UNC path
  - http:
      server: "smbHttpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: '[B'
            - name: "X-Content-Type"
              value: 'ct=application/octet-stream'
            - name: "file"
              value: 'order 1.csv'
            - name: "ce-file"
              value: 'order 1.csv'
            - name: "X-File-Name"
              value: 'order 1.csv'
            - name: "X-File-Length"
              value: '15'
            - name: "X-Unc-Path"
              value: '\\${CITRUS_TESTCONTAINERS_SMB_HOST}\files\orders\order 1.csv'
          body:
            data: |
              id,item
              1,book
  - http:
      server: "smbHttpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # Once read, the file is moved to orders/.done
  - repeatOnError:
      until: "i = 10"
      autoSleep: 1000
      actions:
        - groovy:
            script:
              file: "smb/verifyMoved.groovy"
