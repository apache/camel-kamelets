- route:
    from:
      uri: "timer:send"
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            constant: "id,item\n1,book"
        # the directory in the file header is dropped
        - setHeader:
            name: file
            constant: 'reports/day 1.csv'
        # the file exists already: these headers would fail the message, or write it elsewhere, if they were used
        - setHeader:
            name: CamelSmbFileExists
            constant: 'Fail'
        - setHeader:
            name: CamelOverruleFileName
            constant: '../overruled.csv'
        - to:
            uri: "kamelet:smb-sink"
            parameters:
              connectionHost: '{{smb.host}}'
              connectionPort: '{{smb.port}}'
              shareName: 'files'
              directoryName: 'upload'
              username: 'citrus'
              # a password with characters that have a meaning in an endpoint address
              password: 's3cr&t+pw'
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        # Camel headers are not sent over HTTP: copy them
        - setHeader:
            name: X-File-Name-Produced
            simple: "${header.CamelFileNameProduced}"
        - to:
            uri: "{{http.sink.url}}/result"
        # then a file name that points outside the directory
        - removeHeaders:
            pattern: "*"
        - setHeader:
            name: CamelFileName
            constant: '../outside.csv'
        - doTry:
            steps:
              - to:
                  uri: "kamelet:smb-sink"
                  parameters:
                    connectionHost: '{{smb.host}}'
                    connectionPort: '{{smb.port}}'
                    shareName: 'files'
                    directoryName: 'upload'
                    username: 'citrus'
                    password: 's3cr&t+pw'
              - setBody:
                  constant: "written"
            doCatch:
              - exception:
                  - "java.lang.Exception"
                steps:
                  - setHeader:
                      name: X-Error
                      simple: "${exception.class.name}"
                  - setBody:
                      simple: "${exception.message}"
        - removeHeader:
            name: CamelFileName
        - to:
            uri: "{{http.sink.url}}/rejected"
        # then as a guest, with no password, to the top of the share (no directoryName)
        - removeHeaders:
            pattern: "*"
        - setBody:
            constant: "id,item\n2,pen"
        - setHeader:
            name: file
            constant: 'guest.csv'
        - to:
            uri: "kamelet:smb-sink"
            parameters:
              connectionHost: '{{smb.host}}'
              connectionPort: '{{smb.port}}'
              shareName: 'files'
              username: 'Guest'
        - setHeader:
            name: X-File-Name-Produced
            simple: "${header.CamelFileNameProduced}"
        - to:
            uri: "{{http.sink.url}}/guest"
