- route:
    from:
      uri: "kamelet:smb-source"
      parameters:
        connectionHost: '{{smb.host}}'
        connectionPort: '{{smb.port}}'
        shareName: 'files'
        # no directoryName: the files at the top of the share; a guest, with no password
        username: 'Guest'
        # the smallest first, then by name in reverse order, without case: 0.txt, B.txt, a.txt
        sortBy: 'file:length;reverse:ignoreCase:file:name'
        # one poll is enough: no poll runs while the test stops the server
        delay: 60000
      steps:
        # Camel headers are not sent over HTTP: copy them
        - setHeader:
            name: X-File-Name
            simple: "${header.CamelFileName}"
        - setHeader:
            name: X-Unc-Path
            simple: "${header.CamelSmbUncPath}"
        - removeHeader:
            name: Content-Type
        - convertBodyTo:
            type: "java.lang.String"
        - to:
            uri: "{{http.sink.url}}/root"
