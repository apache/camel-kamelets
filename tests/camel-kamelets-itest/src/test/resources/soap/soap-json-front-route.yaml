# A SOAP front with JSON in the middle: soap-source and soap-action with bodyFormat json
- route:
    id: "json-front"
    from:
      uri: "kamelet:soap-source"
      parameters:
        address: "http://0.0.0.0:{{soap.json.front.port}}/orders"
        wsdlURL: "classpath:orders.wsdl"
        bodyFormat: "json"
      steps:
        - log: "JSON front request: ${body}"
        - to:
            uri: "kamelet:soap-action"
            parameters:
              address: "http://localhost:{{soap.json.backend.port}}/orders"
              wsdlURL: "classpath:orders.wsdl"
              operation: "getOrder"
              bodyFormat: "json"
              faultAsBody: true
        - log: "JSON front got SoapFault=${header.SoapFault}: ${body}"
# A request with a field that the schema does not have: refused, or left out with ignoreUnknownFields
- route:
    from:
      uri: "timer:unknown"
      parameters:
        repeatCount: 1
        delay: 3000
      steps:
        - setBody:
            constant: '{"orderId": "9", "color": "red"}'
        - doTry:
            steps:
              - to:
                  uri: "kamelet:soap-action"
                  parameters:
                    address: "http://localhost:{{soap.json.backend.port}}/orders"
                    wsdlURL: "classpath:orders.wsdl"
                    operation: "getOrder"
                    bodyFormat: "json"
              - log: "Unknown field accepted: ${body}"
            doCatch:
              - exception:
                  - "java.lang.Exception"
                steps:
                  - log: "Unknown field refused: ${exception.class.name}: ${exception.message}"
        - setBody:
            constant: '{"orderId": "10", "color": "red"}'
        - to:
            uri: "kamelet:soap-action"
            parameters:
              address: "http://localhost:{{soap.json.backend.port}}/orders"
              wsdlURL: "classpath:orders.wsdl"
              operation: "getOrder"
              bodyFormat: "json"
              ignoreUnknownFields: true
        - log: "Unknown field ignored: ${body}"
