# The SOAP front: serves orders.wsdl with soap-source, works with the request as JSON, and calls the legacy service
# with soap-action. Its own getOrder answers with the status of the legacy service in lower case.
- route:
    id: "orders-front"
    from:
      uri: "kamelet:soap-source"
      parameters:
        path: "/orders"
        wsdlURL: "classpath:orders.wsdl"
        publishedEndpointUrl: "https://orders.example.com/orders"
      steps:
        - to:
            uri: "kamelet:xj-identity-action"
            parameters:
              direction: "XML2JSON"
        - log: "Front ${header.CamelCxfOperationName} as JSON: ${body}"
        - setVariable:
            name: "orderId"
            jq: ".orderId"
        - setBody:
            simple: '<getOrder xmlns="http://example.com/orders"><orderId>${escape(xml, ${variable.orderId})}</orderId></getOrder>'
        # headers that must not change what soap-action calls, or how
        - setHeader:
            name: "CamelDestinationOverrideUrl"
            constant: "http://localhost:1/elsewhere"
        - setHeader:
            name: "CamelCxfOperationName"
            constant: "placeOrder"
        - setHeader:
            name: "SOAPAction"
            constant: "http://example.com/orders/placeOrder"
        - setHeader:
            name: "Authorization"
            constant: "Basic dXNlcjpzZWNyZXQ="
        - choice:
            when:
              # no address: the address of the port in the WSDL, which the legacy service serves with its own address
              - simple: "${variable.orderId} == '8'"
                steps:
                  - to:
                      uri: "kamelet:soap-action"
                      parameters:
                        wsdlURL: "http://localhost:{{soap.backend.port}}/services/orders?wsdl"
                        operation: "getOrder"
                        faultAsBody: true
                        username: "front"
                        password: "s3cret"
            otherwise:
              steps:
                - to:
                    uri: "kamelet:soap-action"
                    parameters:
                      address: "http://localhost:{{soap.backend.port}}/services/orders"
                      wsdlURL: "classpath:orders.wsdl"
                      operation: "getOrder"
                      faultAsBody: true
                      username: "front"
                      password: "s3cret"
        - log: "Front got SoapFault=${header.SoapFault} SoapFaultCode=${header.SoapFaultCode}: ${body}"
        - choice:
            when:
              - simple: "${header.SoapFault} == null"
                steps:
                  - setBody:
                      simple: "${body.replace('<status>SHIPPED</status>', '<status>shipped</status>')}"
