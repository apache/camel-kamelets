name: soap-soap12-test
description: 'soap-source serves a WSDL with a SOAP 1.2 binding: a reply and a declared fault, both in SOAP 1.2'
actions:
  - camel:
      cli:
        run:
          resources:
            - "orders12.wsdl"
          integration:
            file: "soap/soap12-route.yaml"
            systemProperties:
              properties:
                - name: "soap.soap12.port"
                  value: "${soap.soap12.port}"

  - http:
      client: "http://localhost:${soap.soap12.port}"
      sendRequest:
        POST:
          path: "/orders"
          contentType: "application/soap+xml"
          body:
            data: '<env:Envelope xmlns:env="http://www.w3.org/2003/05/soap-envelope"><env:Body><o:getOrder xmlns:o="http://example.com/orders"><o:orderId>12</o:orderId></o:getOrder></env:Body></env:Envelope>'
  - http:
      client: "http://localhost:${soap.soap12.port}"
      receiveResponse:
        response:
          status: 200
          type: "plaintext"
          body:
            data: '<soap:Envelope xmlns:soap="http://www.w3.org/2003/05/soap-envelope"><soap:Body><getOrderResponse xmlns="http://example.com/orders"><order><orderId>12</orderId><customer>ACME</customer><status>NEW</status><item><sku>A-1</sku><quantity>1</quantity><price>1.00</price></item></order></getOrderResponse></soap:Body></soap:Envelope>'

  # SoapFaultCode Client is the SOAP 1.2 code Sender
  - http:
      client: "http://localhost:${soap.soap12.port}"
      sendRequest:
        POST:
          path: "/orders"
          contentType: "application/soap+xml"
          body:
            data: '<env:Envelope xmlns:env="http://www.w3.org/2003/05/soap-envelope"><env:Body><o:getOrder xmlns:o="http://example.com/orders"><o:orderId>404</o:orderId></o:getOrder></env:Body></env:Envelope>'
  - http:
      client: "http://localhost:${soap.soap12.port}"
      receiveResponse:
        response:
          status: 500
          type: "plaintext"
          body:
            data: '@contains(''env:Sender</soap:Value></soap:Code><soap:Reason><soap:Text xml:lang="en">Order 404 not found</soap:Text></soap:Reason><soap:Detail><orderNotFound xmlns="http://example.com/orders"><orderId>404</orderId></orderNotFound></soap:Detail>'')@'
