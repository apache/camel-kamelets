name: soap-wssec-test
description: 'soap-source requires a WS-Security UsernameToken of its user, and soap-action sends one: the right password as text and as a digest passes, a wrong password and a request without a token get a SOAP fault'
actions:
  # The options need the jar cxf-rt-ws-security of the CXF version of Camel
  - camel:
      cli:
        run:
          args:
            - "--dep=mvn:org.apache.cxf:cxf-rt-ws-security:4.2.4"
          resources:
            - "orders.wsdl"
          integration:
            file: "soap/soap-wssec-route.yaml"
            systemProperties:
              properties:
                - name: "soap.wssec.port"
                  value: "${soap.wssec.port}"

  - camel:
      cli:
        verify:
          integration: "soap-wssec-route"
          logMessage: "Text password: <getOrderResponse xmlns=\"http://example.com/orders\"><order><orderId>21</orderId>"
  - camel:
      cli:
        verify:
          integration: "soap-wssec-route"
          logMessage: "Service getOrder user=Subject:"
  - camel:
      cli:
        verify:
          integration: "soap-wssec-route"
          logMessage: "Digest password: <getOrderResponse xmlns=\"http://example.com/orders\"><order><orderId>22</orderId>"
  - camel:
      cli:
        verify:
          integration: "soap-wssec-route"
          logMessage: "Wrong password: SoapFault="

  # A request without a UsernameToken is refused before the route sees it
  - http:
      client: "http://localhost:${soap.wssec.port}"
      sendRequest:
        POST:
          path: "/orders"
          contentType: "text/xml"
          body:
            data: '<soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/"><soap:Body><o:getOrder xmlns:o="http://example.com/orders"><o:orderId>24</o:orderId></o:getOrder></soap:Body></soap:Envelope>'
  - http:
      client: "http://localhost:${soap.wssec.port}"
      receiveResponse:
        response:
          status: 500
          type: "plaintext"
          body:
            data: '@contains(''<soap:Fault>'')@'
