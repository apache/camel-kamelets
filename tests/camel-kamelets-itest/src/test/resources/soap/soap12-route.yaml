# The service of orders12.wsdl, with its SOAP 1.2 binding, served by soap-source
- route:
    id: "orders-soap12"
    from:
      uri: "kamelet:soap-source"
      parameters:
        address: "http://0.0.0.0:{{soap.soap12.port}}/orders"
        wsdlURL: "classpath:orders12.wsdl"
        serviceName: "{http://example.com/orders}OrderService"
        portName: "{http://example.com/orders}OrderPort"
      steps:
        - choice:
            when:
              - simple: "${body} contains '>404<'"
                steps:
                  - setHeader:
                      name: "SoapFault"
                      constant: "Order 404 not found"
                  - setHeader:
                      name: "SoapFaultCode"
                      constant: "Client"
                  - setBody:
                      constant: '<orderNotFound xmlns="http://example.com/orders"><orderId>404</orderId></orderNotFound>'
            otherwise:
              steps:
                - setBody:
                    constant: '<getOrderResponse xmlns="http://example.com/orders"><order><orderId>12</orderId><customer>ACME</customer><status>NEW</status><item><sku>A-1</sku><quantity>1</quantity><price>1.00</price></item></order></getOrderResponse>'
