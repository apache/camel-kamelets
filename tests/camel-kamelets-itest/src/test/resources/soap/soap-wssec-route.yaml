# The service of orders.wsdl, served by soap-source for the user alice only (a WS-Security UsernameToken), and calls
# of it with soap-action: the right password as text and as a digest, and a wrong password
- route:
    id: "orders-wssec"
    from:
      uri: "kamelet:soap-source"
      parameters:
        address: "http://0.0.0.0:{{soap.wssec.port}}/orders"
        wsdlURL: "classpath:orders.wsdl"
        wsSecurityUsername: "alice"
        wsSecurityPassword: "s3cr&t+pw"
      steps:
        - log: "Service ${header.CamelCxfOperationName} user=${header.CamelAuthentication}"
        - setBody:
            simple: '<getOrderResponse xmlns="http://example.com/orders"><order><orderId>${xpath(/*/*[local-name()=''orderId'']/text())}</orderId><customer>ACME</customer><status>NEW</status><item><sku>A-1</sku><quantity>1</quantity><price>1.00</price></item></order></getOrderResponse>'
- route:
    from:
      uri: "timer:wssec"
      parameters:
        repeatCount: 1
        delay: 2000
      steps:
        - setBody:
            constant: '<getOrder xmlns="http://example.com/orders"><orderId>21</orderId></getOrder>'
        - to:
            uri: "kamelet:soap-action"
            parameters:
              address: "http://localhost:{{soap.wssec.port}}/orders"
              wsdlURL: "classpath:orders.wsdl"
              operation: "getOrder"
              wsSecurityUsername: "alice"
              wsSecurityPassword: "s3cr&t+pw"
        - log: "Text password: ${body}"
        - setBody:
            constant: '<getOrder xmlns="http://example.com/orders"><orderId>22</orderId></getOrder>'
        - to:
            uri: "kamelet:soap-action"
            parameters:
              address: "http://localhost:{{soap.wssec.port}}/orders"
              wsdlURL: "classpath:orders.wsdl"
              operation: "getOrder"
              wsSecurityUsername: "alice"
              wsSecurityPassword: "s3cr&t+pw"
              wsSecurityPasswordType: "Digest"
        - log: "Digest password: ${body}"
        - setBody:
            constant: '<getOrder xmlns="http://example.com/orders"><orderId>23</orderId></getOrder>'
        - to:
            uri: "kamelet:soap-action"
            parameters:
              address: "http://localhost:{{soap.wssec.port}}/orders"
              wsdlURL: "classpath:orders.wsdl"
              operation: "getOrder"
              wsSecurityUsername: "alice"
              wsSecurityPassword: "wrong"
              faultAsBody: true
        - log: "Wrong password: SoapFault=${header.SoapFault} SoapFaultCode=${header.SoapFaultCode}"
