# The legacy SOAP service of orders.wsdl, served by soap-source with the XML of the WSDL
- route:
    id: "legacy-orders"
    from:
      uri: "kamelet:soap-source"
      parameters:
        address: "http://0.0.0.0:{{soap.backend.port}}/orders"
        wsdlURL: "classpath:orders.wsdl"
      steps:
        # what came with the call: the SOAPAction of the WSDL and no login, whatever the caller had in its headers
        - log: "Backend ${header.CamelCxfOperationName} SOAPAction=${header.SOAPAction} Authorization=${header.Authorization}: ${body}"
        - setVariable:
            name: "orderId"
            simple: "${xpath(/*/*[local-name()='orderId']/text())}"
        - choice:
            when:
              # the declared fault of getOrder
              - simple: "${variable.orderId} == '404'"
                steps:
                  - setHeader:
                      name: "SoapFault"
                      simple: "Order ${variable.orderId} not found"
                  - setHeader:
                      name: "SoapFaultCode"
                      constant: "Client"
                  - setBody:
                      simple: '<orderNotFound xmlns="http://example.com/orders"><orderId>${variable.orderId}</orderId></orderNotFound>'
              # the route builds the SOAP fault itself, as XML text, with no SoapFault header
              - simple: "${variable.orderId} == '409'"
                steps:
                  - setBody:
                      simple: '<soap:Fault xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/"><faultcode>soap:Client</faultcode><faultstring>Order ${variable.orderId} is locked</faultstring><detail><orderNotFound xmlns="http://example.com/orders"><orderId>${variable.orderId}</orderId></orderNotFound></detail></soap:Fault>'
              # a failure of the route: the client must not learn why
              - simple: "${variable.orderId} == '500'"
                steps:
                  - throwException:
                      exceptionType: "java.lang.IllegalStateException"
                      message: "Database password s3cret rejected"
            otherwise:
              steps:
                - setBody:
                    simple: '<getOrderResponse xmlns="http://example.com/orders"><order><orderId>${variable.orderId}</orderId><customer>ACME</customer><status>SHIPPED</status><item><sku>A-1</sku><quantity>2</quantity><price>9.95</price></item></order></getOrderResponse>'
