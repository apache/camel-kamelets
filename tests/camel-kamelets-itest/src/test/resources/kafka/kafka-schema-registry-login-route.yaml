# kafka-sink logs in to the schema registry with a username and password; the test server of KafkaIT stands in
# for the registry and checks the login
- route:
    from:
      uri: "timer:tick"
      parameters:
        period: "1000"
        repeatCount: 1
      steps:
        - setBody:
            constant: '{"id":1,"item":"camel"}'
        - setHeader:
            name: Content-Type
            constant: application/json
        - doTry:
            steps:
              - to:
                  uri: "kamelet:kafka-sink"
                  parameters:
                    bootstrapServers: '{{kafka.bootstrapServers}}'
                    saslAuthType: NONE
                    topic: '{{kafka.topic}}'
                    schemaRegistryVendor: confluent
                    schemaRegistryUrl: '{{kafka.schemaRegistryUrl}}'
                    schemaFormat: json
                    schemaRegistryUsername: 'registry-key'
                    # a secret with characters that have a meaning in an endpoint address
                    schemaRegistryPassword: 's3c&r+t=/x'
            doCatch:
              - exception:
                  - "java.lang.Exception"
                steps:
                  - log:
                      message: "Send failed: ${exception.message}"
