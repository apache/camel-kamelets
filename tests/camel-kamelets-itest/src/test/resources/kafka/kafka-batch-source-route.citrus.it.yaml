name: kafka-batch-source-route-test
variables:
  - name: "kafka.topic"
    value: "batch-topic"
actions:
  - testcontainers:
      start:
        redpanda: {}

  - createEndpoint:
      name: kafka-batch-source-route-producer
      type: "kafka"
      autoClose: true
      properties:
        topic: "${kafka.topic}"
        server: "${CITRUS_TESTCONTAINERS_REDPANDA_BOOTSTRAP_SERVERS}"

  - send:
      endpoint: kafka-batch-source-route-producer
      message:
        body:
          data: "record-1"

  - send:
      endpoint: kafka-batch-source-route-producer
      message:
        body:
          data: "record-2"

  - send:
      endpoint: kafka-batch-source-route-producer
      message:
        body:
          data: "record-3"

  - camel:
      cli:
        run:
          integration:
            file: "kafka/kafka-batch-source-route.yaml"
            systemProperties:
              properties:
                - name: "kafka.topic"
                  value: "${kafka.topic}"
                - name: "kafka.bootstrapServers"
                  value: "${CITRUS_TESTCONTAINERS_REDPANDA_BOOTSTRAP_SERVERS}"
                - name: "http.sink.url"
                  value: "http://localhost:${kafka.sink.server.port}"

  - camel:
      cli:
        verify:
          integration: "kafka-batch-source-route"
          logMessage: "Subscribed to topic(s): ${kafka.topic}"

  # one message for the three records, as a List of messages
  - http:
      server: "kafkaSinkServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Batch-Size"
              value: "3"
            - name: "X-Body-Type"
              value: "@startsWith('java.util.ImmutableCollections$List')@"
            - name: "X-Content-Type"
              value: "ct="
            - name: "X-Commit-Body-Type"
              value: "@startsWith('java.util.ImmutableCollections$List')@"
            - name: "X-Commit-Content-Type"
              value: "ct="
          body:
            data: "record-1|record-2|record-3"
  - http:
      server: "kafkaSinkServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
