# Without kafka-source in the integration, the Kamelet brings the Kafka component itself; without the commit header it
# does nothing
- route:
    from:
      uri: "timer:tick"
      parameters:
        period: "1000"
        repeatCount: 1
      steps:
        - setBody:
            constant: 'record-1'
        - to:
            uri: "kamelet:kafka-manual-commit-action"
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - to:
            uri: "{{http.sink.url}}/result"
