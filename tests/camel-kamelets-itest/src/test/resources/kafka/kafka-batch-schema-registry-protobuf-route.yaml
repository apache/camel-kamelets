# kafka-sink writes two Protobuf messages through the schema registry, with schemaFormat protobuf
- route:
    from:
      uri: "timer:records"
      parameters:
        period: "200"
        repeatCount: 2
        includeMetadata: true
      steps:
        - setBody:
            simple: '{"id":${exchangeProperty.CamelTimerCounter},"item":"camel"}'
        # A Protobuf message of the schema Order (id, item), built from the JSON text. The schema is made in code,
        # so that no Protobuf compiler or vendor class is needed
        - setBody:
            groovy: |
              import com.google.protobuf.DescriptorProtos.DescriptorProto
              import com.google.protobuf.DescriptorProtos.FieldDescriptorProto
              import com.google.protobuf.DescriptorProtos.FileDescriptorProto
              import com.google.protobuf.Descriptors.FileDescriptor
              import com.google.protobuf.DynamicMessage
              import com.google.protobuf.util.JsonFormat
              def field = { String name, int number, FieldDescriptorProto.Type type ->
                  FieldDescriptorProto.newBuilder().setName(name).setNumber(number).setType(type)
                          .setLabel(FieldDescriptorProto.Label.LABEL_OPTIONAL).build()
              }
              def file = FileDescriptorProto.newBuilder().setName("order.proto").setSyntax("proto3")
                      .addMessageType(DescriptorProto.newBuilder().setName("Order")
                              .addField(field("id", 1, FieldDescriptorProto.Type.TYPE_INT32))
                              .addField(field("item", 2, FieldDescriptorProto.Type.TYPE_STRING)))
                      .build()
              def order = DynamicMessage.newBuilder(
                      FileDescriptor.buildFrom(file, new FileDescriptor[0]).findMessageTypeByName("Order"))
              JsonFormat.parser().merge(body, order)
              order.build()
        - to:
            uri: "kamelet:kafka-sink"
            parameters:
              bootstrapServers: '{{kafka.bootstrapServers}}'
              saslAuthType: NONE
              topic: '{{kafka.topic}}'
              schemaRegistryVendor: confluent
              schemaRegistryUrl: '{{kafka.schemaRegistryUrl}}'
              schemaFormat: protobuf
# kafka-batch-source reads them as one batch, with their schema from the registry
- route:
    from:
      uri: "kamelet:kafka-batch-source"
      parameters:
        bootstrapServers: '{{kafka.bootstrapServers}}'
        saslAuthType: NONE
        topic: '{{kafka.topic}}'
        autoOffsetReset: earliest
        consumerGroup: 'batch-registry-protobuf'
        batchSize: 2
        batchingIntervalMs: 3000
        schemaRegistryVendor: confluent
        schemaRegistryUrl: '{{kafka.schemaRegistryUrl}}'
        schemaFormat: protobuf
      steps:
        - setHeader:
            name: X-Batch-Size
            simple: "${body.size()}"
        - setHeader:
            name: X-Entry-Type
            simple: "${body[0].getMessage().getBody().getClass().getName()}"
        - setBody:
            simple: "${body[0].getMessage().getBody()}|${body[1].getMessage().getBody()}"
        - to:
            uri: "{{http.sink.url}}"
