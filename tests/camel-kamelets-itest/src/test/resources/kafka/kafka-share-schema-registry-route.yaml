# kafka-sink writes a Protobuf message through the schema registry, with schemaFormat protobuf
- route:
    from:
      uri: "timer:records"
      parameters:
        period: "1000"
        repeatCount: 1
      steps:
        - setBody:
            constant: '{"id":1,"item":"camel"}'
        - to:
            uri: "kamelet:protobuf-message-action"
            parameters:
              schema: 'syntax = "proto3"; message Order { int32 id = 1; string item = 2; }'
        - to:
            uri: "kamelet:kafka-sink"
            parameters:
              bootstrapServers: '{{kafka.bootstrapServers}}'
              saslAuthType: NONE
              topic: '{{kafka.topic}}'
              schemaRegistryVendor: apicurio
              schemaRegistryUrl: '{{kafka.schemaRegistryUrl}}'
              schemaFormat: protobuf
# kafka-share-source reads it with its schema from the registry
- route:
    from:
      uri: "kamelet:kafka-share-source"
      parameters:
        bootstrapServers: '{{kafka.bootstrapServers}}'
        saslAuthType: NONE
        topic: '{{kafka.topic}}'
        shareGroup: '{{kafka.share.group}}'
        schemaRegistryVendor: apicurio
        schemaRegistryUrl: '{{kafka.schemaRegistryUrl}}'
        schemaFormat: protobuf
      steps:
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - to:
            uri: "{{http.sink.url}}"
