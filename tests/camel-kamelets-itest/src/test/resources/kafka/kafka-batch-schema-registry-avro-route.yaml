# kafka-sink writes two records through the schema registry, with schemaFormat avro
- route:
    from:
      uri: "timer:records"
      parameters:
        period: "200"
        repeatCount: 2
        includeMetadata: true
      steps:
        - setBody:
            simple: 'order-${exchangeProperty.CamelTimerCounter}'
        - setHeader:
            name: Content-Type
            constant: application/json
        - to:
            uri: "kamelet:kafka-sink"
            parameters:
              bootstrapServers: '{{kafka.bootstrapServers}}'
              saslAuthType: NONE
              topic: '{{kafka.topic}}'
              schemaRegistryVendor: confluent
              schemaRegistryUrl: '{{kafka.schemaRegistryUrl}}'
              schemaFormat: avro
# kafka-batch-source reads them as one batch, with their schema from the registry
- route:
    from:
      uri: "kamelet:kafka-batch-source"
      parameters:
        bootstrapServers: '{{kafka.bootstrapServers}}'
        saslAuthType: NONE
        topic: '{{kafka.topic}}'
        autoOffsetReset: earliest
        consumerGroup: 'batch-registry-avro'
        batchSize: 2
        batchingIntervalMs: 3000
        schemaRegistryVendor: confluent
        schemaRegistryUrl: '{{kafka.schemaRegistryUrl}}'
        schemaFormat: avro
      steps:
        - setHeader:
            name: X-Batch-Size
            simple: "${body.size()}"
        - setHeader:
            name: X-Entry-Type
            simple: "${body[0].getMessage().getBody().getClass().getName()}"
        - setBody:
            simple: "${body[0].getMessage().getBody()}|${body[1].getMessage().getBody()}"
        - to:
            uri: "{{http.sink.url}}"
