name: kafka-share-source-route-test
variables:
  - name: "kafka.topic"
    value: "share-topic"
  - name: "kafka.share.group"
    value: "share-group"
  - name: "kafka.source"
    value: "Kafka share Kamelet source"
  - name: "kafka.message.key"
    value: "citrus:randomNumber(4)"
  - name: "kafka.message"
    value: "Camel rocks!"
actions:
  # Apache Kafka 4, where share groups are on. A single broker must keep the state of the share groups
  # with a replication factor of 1, or the share groups get no records.
  - testcontainers:
      start:
        kafka:
          implementation: "apache"
          version: "4.4.0"
          topics:
            - "${kafka.topic}"
          env:
            - name: "KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR"
              value: "1"
            - name: "KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR"
              value: "1"

  - createVariables:
      variables:
        - name: "kafka.bootstrapServers"
          value: "${CITRUS_TESTCONTAINERS_KAFKA_BOOTSTRAP_SERVERS}"

  - camel:
      cli:
        run:
          integration:
            file: "kafka/kafka-share-source-route.yaml"
            systemProperties:
              properties:
                - name: "kafka.topic"
                  value: "${kafka.topic}"
                - name: "kafka.share.group"
                  value: "${kafka.share.group}"
                - name: "kafka.bootstrapServers"
                  value: "${kafka.bootstrapServers}"
                - name: "http.sink.url"
                  value: "http://localhost:${kafka.sink.server.port}/result"

  - createEndpoint:
      name: kafkaShareProducer
      type: "kafka"
      autoClose: true
      properties:
        topic: "${kafka.topic}"
        server: "${kafka.bootstrapServers}"

  # A record: its value, key and headers
  - send:
      endpoint: kafkaShareProducer
      message:
        headers:
          - name: "event-source"
            value: "${kafka.source}"
          - name: "citrus_kafka_messageKey"
            value: "${kafka.message.key}"
        body:
          data: "${kafka.message}"
  - http:
      server: "kafkaSinkServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "event-source"
              value: "${kafka.source}"
            - name: "X-Body-Type"
              value: "java.lang.String"
            - name: "kafka-topic"
              value: "${kafka.topic}"
            - name: "ce-kafkatopic"
              value: "${kafka.topic}"
            - name: "kafka-key"
              value: "${kafka.message.key}"
            - name: "ce-kafkakey"
              value: "${kafka.message.key}"
            - name: "kafka-partition"
              value: "0"
            - name: "kafka-offset"
              value: "0"
            - name: "kafka-timestamp"
              value: "@isNumber()@"
            - name: "kafka-delivery-count"
              value: "1"
            - name: "ce-kafkadeliverycount"
              value: "1"
          body:
            data: "${kafka.message}"
  - http:
      server: "kafkaSinkServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # A record whose handling fails is released and delivered again. Its record header
  # CamelKafkaShareAcknowledge is not used: with ACCEPT it would not be delivered again.
  - send:
      endpoint: kafkaShareProducer
      message:
        headers:
          - name: "CamelKafkaShareAcknowledge"
            value: "ACCEPT"
        body:
          data: "fail"
  - http:
      server: "kafkaSinkServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "kafka-offset"
              value: "1"
            - name: "kafka-delivery-count"
              value: "2"
          body:
            data: "fail"
  - http:
      server: "kafkaSinkServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # A record that the integration releases with the header CamelKafkaShareAcknowledge is delivered again
  - send:
      endpoint: kafkaShareProducer
      message:
        body:
          data: "release"
  - http:
      server: "kafkaSinkServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "kafka-offset"
              value: "2"
            - name: "kafka-delivery-count"
              value: "2"
          body:
            data: "release"
  - http:
      server: "kafkaSinkServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # Two consumers of one share group: the first consumer waits for the answer to its record, which is
  # not sent, so the next record goes to the second consumer. The answer to the last request is sent.
  - send:
      endpoint: kafkaShareProducer
      message:
        body:
          data: "one"
  - http:
      server: "kafkaSinkServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          body:
            data: "one"
        extract:
          header:
            - name: "X-Consumer"
              variable: "first.consumer"
  - send:
      endpoint: kafkaShareProducer
      message:
        body:
          data: "two"
  - http:
      server: "kafkaSinkServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          body:
            data: "two"
        extract:
          header:
            - name: "X-Consumer"
              variable: "second.consumer"
  - http:
      server: "kafkaSinkServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
  - groovy:
      script:
        value: |
          def first = context.getVariable('first.consumer')
          def second = context.getVariable('second.consumer')
          if (first == second) {
              throw new org.citrusframework.exceptions.ValidationException('Both records went to the consumer ' + first)
          }
