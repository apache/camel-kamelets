# Two consumers of one share group, on their own threads
- route:
    from:
      uri: "kamelet:kafka-share-source"
      parameters:
        bootstrapServers: '{{kafka.bootstrapServers}}'
        topic: '{{kafka.topic}}'
        shareGroup: '{{kafka.share.group}}'
        saslAuthType: 'NONE'
        consumersCount: 2
      steps:
        - setHeader:
            name: X-Consumer
            simple: "${threadName}"
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - choice:
            when:
              # the record "fail" fails the first time it is delivered, so it is released and delivered again
              - simple: "${body} == 'fail' && ${header.kafka-delivery-count} == 1"
                steps:
                  - throwException:
                      exceptionType: "java.lang.IllegalStateException"
                      message: "Failed on the first delivery"
              # the record "release" is released by the header the first time it is delivered
              - simple: "${body} == 'release' && ${header.kafka-delivery-count} == 1"
                steps:
                  - setHeader:
                      name: CamelKafkaShareAcknowledge
                      constant: RELEASE
                  - stop: {}
        - to:
            uri: "{{http.sink.url}}"
