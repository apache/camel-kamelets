name: kafka-schema-registry-login-route-test
variables:
  - name: "kafka.topic"
    value: "registry-login"
actions:
  - testcontainers:
      start:
        redpanda: {}

  # The Confluent serde jars are in the Confluent Maven repository
  - camel:
      cli:
        run:
          args:
            - "--repos=confluent"
          integration:
            file: "kafka/kafka-schema-registry-login-route.yaml"
            systemProperties:
              properties:
                - name: kafka.topic
                  value: "${kafka.topic}"
                - name: kafka.bootstrapServers
                  value: "${CITRUS_TESTCONTAINERS_REDPANDA_BOOTSTRAP_SERVERS}"
                - name: kafka.schemaRegistryUrl
                  value: "http://localhost:${kafka.sink.server.port}"

  # The registry gets the login: basic auth with the username and the whole password
  - http:
      server: "kafkaSinkServer"
      receiveRequest:
        GET:
          headers:
            - name: "Authorization"
              value: "Basic citrus:encodeBase64('registry-key:s3c&r+t=/x')"
  - http:
      server: "kafkaSinkServer"
      sendResponse:
        response:
          status: 401
          reasonPhrase: "Unauthorized"
          version: "HTTP/1.1"
          headers:
            - name: "Content-Type"
              value: "application/json"
          body:
            data: '{"error_code":40101,"message":"Unauthorized"}'
