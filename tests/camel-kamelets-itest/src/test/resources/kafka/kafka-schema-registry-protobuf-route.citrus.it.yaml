name: kafka-schema-registry-protobuf-route-test
variables:
  - name: "kafka.topic"
    value: "registry-protobuf"
actions:
  # Redpanda has a schema registry with the Confluent API
  - testcontainers:
      start:
        redpanda: {}

  # The Confluent serde jars are in the Confluent Maven repository
  - camel:
      cli:
        run:
          args:
            - "--repos=confluent"
          integration:
            file: "kafka/kafka-schema-registry-protobuf-route.yaml"
            systemProperties:
              properties:
                - name: kafka.topic
                  value: "${kafka.topic}"
                - name: kafka.bootstrapServers
                  value: "${CITRUS_TESTCONTAINERS_REDPANDA_BOOTSTRAP_SERVERS}"
                - name: kafka.schemaRegistryVendor
                  value: "confluent"
                - name: kafka.schemaRegistryUrl
                  value: "${CITRUS_TESTCONTAINERS_REDPANDA_SCHEMA_REGISTRY_ADDRESS}"
                - name: http.sink.url
                  value: "http://localhost:${kafka.sink.server.port}/result"

  # kafka-sink writes the Protobuf message, kafka-source reads it and gives it as JSON text
  - http:
      server: "kafkaSinkServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: "java.lang.String"
          body:
            data: '{"id":1,"item":"camel"}'
  - http:
      server: "kafkaSinkServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # The record was written with a Protobuf schema in the registry
  - http:
      client: "${CITRUS_TESTCONTAINERS_REDPANDA_SCHEMA_REGISTRY_ADDRESS}/subjects/${kafka.topic}-value/versions/latest"
      sendRequest:
        GET: {}
  - http:
      client: "${CITRUS_TESTCONTAINERS_REDPANDA_SCHEMA_REGISTRY_ADDRESS}/subjects/${kafka.topic}-value/versions/latest"
      receiveResponse:
        response:
          status: 200
          body:
            data: |
              {"subject":"${kafka.topic}-value","version":"@ignore@","id":"@ignore@","schemaType":"PROTOBUF","schema":"@contains('message Order')@"}
