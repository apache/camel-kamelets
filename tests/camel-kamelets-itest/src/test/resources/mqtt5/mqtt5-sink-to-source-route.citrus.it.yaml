name: mqtt5-sink-to-source-route-test
description: 'mqtt5-sink publishes a retained text message to EMQX, and mqtt5-source receives it as bytes'
variables:
  - name: "mqtt.topic"
    value: "test/topic"
actions:
  # EMQX allows anonymous clients by default
  - testcontainers:
      start:
        container:
          name: "mqtt"
          image: "emqx/emqx:5.8.9"
          startUpTimeout: 180
          exposedPorts:
            - 1883
          waitFor:
            logMessage: '.*is running now.*'

  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "mqtt5/mqtt5-sink-route.yaml"
            systemProperties:
              properties:
                - name: "mqtt.topic"
                  value: "${mqtt.topic}"
                - name: "mqtt.brokerUrl"
                  value: "tcp://${CITRUS_TESTCONTAINERS_MQTT_HOST}:${CITRUS_TESTCONTAINERS_MQTT_PORT}"
                - name: "http.sink.url"
                  value: "http://localhost:${mqtt5.sink.server.port}"

  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "mqtt5/mqtt5-source-route.yaml"
            systemProperties:
              properties:
                - name: "mqtt.topic"
                  value: "${mqtt.topic}"
                - name: "mqtt.brokerUrl"
                  value: "tcp://${CITRUS_TESTCONTAINERS_MQTT_HOST}:${CITRUS_TESTCONTAINERS_MQTT_PORT}"
                - name: "http.source.url"
                  value: "http://localhost:${mqtt5.source.server.port}"

  # After the sink, the body is the payload as bytes, as application/octet-stream
  - http:
      server: "mqtt5SinkServer"
      receiveRequest:
        POST:
          path: "/sink"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: '[B'
            - name: "X-Content-Type"
              value: 'ct=application/octet-stream'
          body:
            data: 'hello-mqtt5'
  - http:
      server: "mqtt5SinkServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # The source gives the payload as bytes, with the topic and the quality of service 2
  - http:
      server: "mqtt5SourceServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: '[B'
            - name: "X-Content-Type"
              value: 'ct=application/octet-stream'
            - name: "X-Topic"
              value: 'test/topic'
            - name: "X-QoS"
              value: '2'
          body:
            data: 'hello-mqtt5'
  - http:
      server: "mqtt5SourceServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
