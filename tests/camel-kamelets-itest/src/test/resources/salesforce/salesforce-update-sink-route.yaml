- route:
    from:
      uri: "timer:tick"
      parameters:
        period: "1000"
        repeatCount: 1
      steps:
        - setBody:
            constant: '{"sObjectName":"Contact","sObjectId":"003000000000001AAA","payload":{"Phone":"+45 1234 5678"}}'
        - to:
            uri: "kamelet:salesforce-update-sink"
            parameters:
              loginUrl: '{{salesforce.url}}'
              clientId: '{{salesforce.client.id}}'
              clientSecret: '{{salesforce.client.secret}}'
              userName: '{{salesforce.username}}'
              password: '{{salesforce.password}}'
        # what the Kamelet leaves: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - setBody:
            simple: "${bodyAs(String)}"
        - to:
            uri: "{{http.sink.url}}/result"
