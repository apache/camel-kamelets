name: salesforce-update-sink-route-test
description: 'salesforce-update-sink logs in, then changes the record of sObjectName and sObjectId with the fields of payload'
variables:
  - name: "salesforce.client.id"
    value: "citrus:randomString(20)"
  - name: "salesforce.client.secret"
    value: "citrus:randomString(20)"
  - name: "salesforce.username"
    value: "citrus@example.com"
  - name: "salesforce.password"
    value: "secr3t"
  - name: "salesforce.token"
    value: "00Dcitrus:randomString(20)"
actions:
  - createVariables:
      variables:
        - name: "salesforce.url"
          value: "http://localhost:${services.server.port}"
  # the Citrus HTTP server stands in for Salesforce, both for the login (loginUrl) and for the org (instance_url)
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "salesforce/salesforce-update-sink-route.yaml"
            systemProperties:
              properties:
                - name: "salesforce.url"
                  value: "${salesforce.url}"
                - name: "salesforce.client.id"
                  value: "${salesforce.client.id}"
                - name: "salesforce.client.secret"
                  value: "${salesforce.client.secret}"
                - name: "salesforce.username"
                  value: "${salesforce.username}"
                - name: "salesforce.password"
                  value: "${salesforce.password}"
                - name: "http.sink.url"
                  value: "http://localhost:${services.server.port}"

  # the OAuth login with the username and password flow
  - http:
      server: "servicesServer"
      receiveRequest:
        POST:
          path: "/services/oauth2/token"
          type: "plaintext"
          body:
            data: 'password=${salesforce.password}&grant_type=password&format=json&client_secret=${salesforce.client.secret}&client_id=${salesforce.client.id}&username=citrus%40example.com'
  - http:
      server: "servicesServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          contentType: "application/json"
          body:
            data: '{"access_token":"${salesforce.token}","instance_url":"${salesforce.url}","id":"${salesforce.url}/id/00D000000000001AAA/005000000000001AAA","token_type":"Bearer","issued_at":"1763550000000","signature":"c2lnbmF0dXJl"}'

  # only the fields of payload, for the record of sObjectName and sObjectId
  - http:
      server: "servicesServer"
      receiveRequest:
        PATCH:
          path: "/services/data/v56.0/sobjects/Contact/003000000000001AAA"
          headers:
            - name: Authorization
              value: "Bearer ${salesforce.token}"
          body:
            data: '{"Phone":"+45 1234 5678"}'
  - http:
      server: "servicesServer"
      sendResponse:
        response:
          status: 204
          reasonPhrase: "No Content"
          version: "HTTP/1.1"

  # the body afterwards: the payload as JSON text
  - http:
      server: "servicesServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'org.apache.camel.converter.stream.InputStreamCache'
            - name: "X-Content-Type"
              value: 'ct=application/json'
          body:
            data: '{"Phone":"+45 1234 5678"}'
  - http:
      server: "servicesServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
