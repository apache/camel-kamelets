name: minio-source-route-test
description: 'minio-source reads the file from the bucket, with its bucket, name, size, ETag and content type'
actions:
  # Create the S3 storage (Floci container), with the bucket
  - testcontainers:
      start:
        localstack:
          services:
            - "S3"
          options:
            buckets: 'minio-source-bucket'
            s3ClientName: "s3MinioSourceClient"
  - waitFor:
      http:
        url: "${CITRUS_TESTCONTAINERS_LOCALSTACK_SERVICE_URL}"

  # A file whose name has characters that have a meaning in an address
  - send:
      endpoint: camel:aws2-s3://minio-source-bucket?amazonS3Client=#s3MinioSourceClient
      message:
        headers:
          - name: CamelAwsS3Key
            value: "invoice 42+x=2.csv"
        body:
          data: "id,amount"

  # Create Camel JBang integration
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "minio/minio-source-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${cloud.http.server.port}"
                - name: "s3.url"
                  value: "${CITRUS_TESTCONTAINERS_LOCALSTACK_SERVICE_URL}"
                - name: "s3.accessKey"
                  value: "${CITRUS_TESTCONTAINERS_LOCALSTACK_ACCESS_KEY}"
                - name: "s3.secretKey"
                  value: "${CITRUS_TESTCONTAINERS_LOCALSTACK_SECRET_KEY}"
                - name: "s3.region"
                  value: "${CITRUS_TESTCONTAINERS_LOCALSTACK_REGION}"

  # The source gives the content of the file, with its bucket, name, size and ETag
  - http:
      server: "cloudHttpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: '[B'
            - name: "X-Content-Type"
              value: 'ct=application/octet-stream'
            - name: "X-Minio-Bucket-Name"
              value: 'minio-source-bucket'
            - name: "X-Minio-Object-Name"
              value: 'invoice 42+x=2.csv'
            - name: "X-Minio-Content-Length"
              value: '9'
            - name: "X-Minio-ETag"
              value: '@notEmpty()@'
            - name: "X-Minio-Content-Type"
              value: 'application/octet-stream'
          body:
            data: 'id,amount'
  - http:
      server: "cloudHttpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
