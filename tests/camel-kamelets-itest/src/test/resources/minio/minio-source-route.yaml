- route:
    from:
      uri: "kamelet:minio-source"
      parameters:
        endpoint: '{{s3.url}}'
        accessKey: '{{s3.accessKey}}'
        secretKey: '{{s3.secretKey}}'
        bucketName: 'minio-source-bucket'
      steps:
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        # Camel headers are not sent over HTTP: copy them
        - setHeader:
            name: X-Minio-Bucket-Name
            simple: "${header.CamelMinioBucketName}"
        - setHeader:
            name: X-Minio-Object-Name
            simple: "${header.CamelMinioObjectName}"
        - setHeader:
            name: X-Minio-Content-Length
            simple: "${header.CamelMinioContentLength}"
        - setHeader:
            name: X-Minio-ETag
            simple: "${header.CamelMinioETag}"
        - setHeader:
            name: X-Minio-Content-Type
            simple: "${header.CamelMinioContentType}"
        # give the HTTP server text
        - convertBodyTo:
            type: "java.lang.String"
        - to:
            uri: "{{http.sink.url}}/result"
