- route:
    from:
      uri: "timer:send"
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            constant: 'id,amount'
        # the name, with characters that have a meaning in an address
        - setHeader:
            name: file
            constant: 'invoice 42+x=2.csv'
        - to:
            uri: "kamelet:minio-sink"
            parameters:
              endpoint: '{{s3.url}}'
              accessKey: '{{s3.accessKey}}'
              secretKey: '{{s3.secretKey}}'
              bucketName: 'minio-sink-bucket'
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        # the HTTP server reads an application/octet-stream body as bytes: send the body as text
        - removeHeader:
            name: Content-Type
        - convertBodyTo:
            type: "java.lang.String"
        # Camel headers are not sent over HTTP: copy them
        - setHeader:
            name: X-Minio-Object-Name
            simple: "${header.CamelMinioObjectName}"
        - to:
            uri: "{{http.sink.url}}/result"
