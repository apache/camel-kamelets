name: xslt-action-test
actions:
  - camel:
      cli:
        run:
          resources:
            - "templates/order.xsl"
            - "templates/lookup.xsl"
            - "templates/currency.xml"
          integration:
            file: "xml/xslt-action-route.yaml"
  # An XSLT 3.0 stylesheet, with its parameter set by a header; the body is a String and no Content-Type is set
  - camel:
      cli:
        verify:
          integration: "xslt-action-route"
          logMessage: 'Param java.lang.String ct= channel=shop: <invoice channel="shop" items="2" total="6.5"><customer>ANN</customer></invoice>|'
  # Bytes in, and the parameter keeps its default; the CamelXslt headers are removed, so they do not replace the stylesheet
  - camel:
      cli:
        verify:
          integration: "xslt-action-route"
          logMessage: 'Bytes <invoice channel="web" items="1" total="1"><customer>BOB</customer></invoice>|'
  # document() reads XML from the classpath
  - camel:
      cli:
        verify:
          integration: "xslt-action-route"
          logMessage: 'Lookup Cid pays in EUR|'
  # The external entity is not read and the nested entities are not expanded: the DOCTYPE of the message is not used
  - camel:
      cli:
        verify:
          integration: "xslt-action-route"
          logMessage: 'Xxe <invoice channel="web" items="0" total="0"><customer/></invoice>|'
  - camel:
      cli:
        verify:
          integration: "xslt-action-route"
          logMessage: 'Bomb <invoice channel="web" items="0" total="0"><customer/></invoice>|'
  - camel:
      cli:
        verify:
          integration: "xslt-action-route"
          logMessage: 'Rejected net.sf.saxon.trans.XPathException: Error reported by XML parser: Content is not allowed in prolog.'
