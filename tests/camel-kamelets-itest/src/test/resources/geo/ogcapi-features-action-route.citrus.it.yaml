name: ogcapi-features-action-route-test
actions:
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "geo/ogcapi-features-action-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${http.server.port}"
                - name: "http.server.port"
                  value: "${http.server.port}"

  - http:
      server: "httpServer"
      receiveRequest:
        GET:
          path: "/collections/lakes/items"

  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          headers:
            - name: "Content-Type"
              value: "application/geo+json"
          body:
            data: '{"type":"FeatureCollection","features":[{"type":"Feature","id":"1","properties":{"name":"Lake Baikal"},"geometry":{"type":"Point","coordinates":[108.0,53.5]}}]}'

  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          headers:
            - name: "X-Body-Type"
              value: '[B'
            - name: "X-Content-Type"
              value: 'ct=application/geo+json'
          body:
            data: '{"type":"FeatureCollection","features":[{"type":"Feature","id":"1","properties":{"name":"Lake Baikal"},"geometry":{"type":"Point","coordinates":[108.0,53.5]}}]}'

  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          body:
            data: 'OK'
