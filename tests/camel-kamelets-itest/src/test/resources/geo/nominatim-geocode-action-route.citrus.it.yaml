name: nominatim-geocode-action-route-test
actions:
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "geo/nominatim-geocode-action-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${http.server.port}"
                - name: "http.server.port"
                  value: "${http.server.port}"

  - http:
      server: "httpServer"
      receiveRequest:
        GET:
          path: "/search"

  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          headers:
            - name: "Content-Type"
              value: "application/json"
          body:
            data: '[{"place_id":1,"lat":"52.5170365","lon":"13.3888599","display_name":"Berlin, Germany","type":"city","class":"boundary","importance":0.9,"address":{"city":"Berlin","country":"Germany","country_code":"de"}}]'

  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          headers:
            - name: "X-Body-Type"
              value: 'org.apache.camel.converter.stream.InputStreamCache'
            - name: "X-Content-Type"
              value: 'ct=application/json'
            - name: "X-Lat"
              value: '52.51703650'
            - name: "X-Lng"
              value: '@startsWith(''13.38885'')@'

  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          body:
            data: 'OK'
