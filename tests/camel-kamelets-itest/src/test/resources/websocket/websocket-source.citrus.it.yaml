name: websocket-source-test
actions:
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "websocket/websocket-source-route.yaml"
            systemProperties:
              properties:
                - name: "ws.server.port"
                  value: "${websocket.source.port}"
                - name: "result.server.url"
                  value: "http://localhost:${websocket.result.port}"

  # the greeting of the server when the source connects, a text message, with the query parameter of the URL
  - http:
      server: "websocketResultServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: "java.lang.String"
            - name: "X-Header-Count"
              value: "0"
          body:
            data: "Welcome Ann"
  - http:
      server: "websocketResultServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          headers:
            - name: "X-Restart"
              value: "true"

  # the server restarts and closes the connection: the source connects again, and gets the next greeting, as bytes
  - http:
      server: "websocketResultServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: "[B"
            - name: "X-Header-Count"
              value: "0"
          body:
            data: "Welcome back Ann"
  - http:
      server: "websocketResultServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
