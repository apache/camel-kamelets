# Joins the messages the source passes on with commas, in the order the source passes them on
- beans:
    - name: joinStrategy
      type: org.apache.camel.processor.aggregate.StringAggregationStrategy
      properties:
        delimiter: ","

# A WebSocket server that sends nothing until the client asks: it hands the request to the test, and then pushes
# the numbers 0 to 9, one message each, as fast as it can
- route:
    id: websocket-subscribe-server
    from:
      uri: "vertx-websocket:localhost:{{ws.server.port}}/feed"
      steps:
        - setHeader:
            name: Content-Type
            constant: "text/plain"
        - to: "{{result.server.url}}/subscribed"
        - loop:
            constant: 10
            steps:
              - setBody:
                  simple: "${exchangeProperty.CamelLoopIndex}"
              # to the client that asked, by the connection key the server set
              - to: "vertx-websocket:localhost:{{ws.server.port}}/feed"

- route:
    from:
      uri: "kamelet:websocket-source"
      parameters:
        url: "ws://localhost:{{ws.server.port}}/feed"
        reconnectInterval: 200
        connectMessage: '{"op": "subscribe", "args": ["a+b", "c&d", "100%"]}'
      steps:
        - convertBodyTo:
            type: "String"
        - aggregate:
            correlationExpression:
              constant: "all"
            aggregationStrategy: "joinStrategy"
            completionSize: 10
            steps:
              - setHeader:
                  name: Content-Type
                  constant: "text/plain"
              - to: "{{result.server.url}}/result"
              # the test answers the first 10 with X-Restart: the server stops, which closes the connection, and starts again
              - filter:
                  simple: "${header.X-Restart} == 'true'"
                  steps:
                    - to: "controlbus:route?routeId=websocket-subscribe-server&action=restart&async=true"
