name: websocket-sink-rejected-test
variables:
  - name: "ws.authorization"
    value: "citrus:concat('Bearer ', citrus:randomString(16), '+/=&%')"
actions:
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "websocket/websocket-sink-rejected-route.yaml"
            systemProperties:
              properties:
                - name: "handshake.server.port"
                  value: "${websocket.result.port}"
                - name: "ws.authorization"
                  value: "${ws.authorization}"

  # the opening handshake, with the login, the subprotocols and the query parameter of the URL
  - http:
      server: "websocketResultServer"
      receiveRequest:
        GET:
          path: "/ws"
          parameters:
            - name: "room"
              value: "blue"
          headers:
            - name: "Upgrade"
              value: "websocket"
            - name: "Authorization"
              value: "${ws.authorization}"
            - name: "Sec-WebSocket-Protocol"
              value: "chat.v2,chat.v1"
  - http:
      server: "websocketResultServer"
      sendResponse:
        response:
          status: 401
          reasonPhrase: "Unauthorized"
          version: "HTTP/1.1"

  # the message fails, with the status code of the answer
  - http:
      server: "websocketResultServer"
      receiveRequest:
        POST:
          path: "/error"
          type: "plaintext"
          body:
            data: "io.vertx.core.http.UpgradeRejectedException: WebSocket upgrade failure: 401"
  - http:
      server: "websocketResultServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
