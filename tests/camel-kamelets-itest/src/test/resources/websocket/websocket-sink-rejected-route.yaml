- route:
    from:
      uri: "timer:send"
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            constant: "Hello WebSocket"
        - doTry:
            steps:
              # the Citrus HTTP server stands in for the WebSocket server, and refuses the connection
              - to:
                  uri: "kamelet:websocket-sink"
                  parameters:
                    url: "ws://localhost:{{handshake.server.port}}/ws?room=blue"
                    # a token with & and %, as it is
                    authorization: "RAW({{ws.authorization}})"
                    subProtocols: "chat.v2,chat.v1"
              - setBody:
                  constant: "sent"
            doCatch:
              - exception:
                  - "java.lang.Exception"
                steps:
                  - setBody:
                      simple: "${exception.message}"
        - setHeader:
            name: Content-Type
            constant: "text/plain"
        - to: "http://localhost:{{handshake.server.port}}/error"
