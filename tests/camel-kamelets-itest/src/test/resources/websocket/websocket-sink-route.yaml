# A WebSocket server that hands each message it receives to the test
- route:
    from:
      uri: "vertx-websocket:localhost:{{ws.server.port}}/in"
      steps:
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        # the query parameter of the URL that the sink connected with
        - setHeader:
            name: X-Token
            simple: "${header.token}"
        - removeHeaders:
            pattern: "CamelVertxWebsocket*"
        - convertBodyTo:
            type: "String"
        - setHeader:
            name: Content-Type
            constant: "text/plain"
        - to: "{{result.server.url}}/received"

- route:
    from:
      uri: "timer:send"
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            constant: "Hello WebSocket"
        # headers that would send the message elsewhere: to the clients of the server of this integration, of which
        # there are none, so that the server would get nothing. The Kamelet removes them.
        - setHeader:
            name: CamelVertxWebsocket.sendToAll
            constant: "true"
        - setHeader:
            name: CamelVertxWebsocket.connectionKey
            constant: "someone-else"
        - to:
            uri: "kamelet:websocket-sink"
            parameters:
              url: "ws://localhost:{{ws.server.port}}/in?token=RAW(a+b&c%)"
        # the message after the Kamelet, and the go-ahead for the next one once the server got this one
        - setHeader:
            name: X-After
            simple: "${body}|${header.CamelVertxWebsocket.sendToAll}|${header.CamelVertxWebsocket.connectionKey}"
        - to: "{{control.server.url}}/next"
        - setBody:
            constant: "Hello bytes"
        - convertBodyTo:
            type: "byte[]"
        # the same URL, so the connection of the first message is used again
        - to:
            uri: "kamelet:websocket-sink"
            parameters:
              url: "ws://localhost:{{ws.server.port}}/in?token=RAW(a+b&c%)"
