name: websocket-sink-test
actions:
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "websocket/websocket-sink-route.yaml"
            systemProperties:
              properties:
                - name: "ws.server.port"
                  value: "${websocket.sink.port}"
                - name: "result.server.url"
                  value: "http://localhost:${websocket.result.port}"
                - name: "control.server.url"
                  value: "http://localhost:${websocket.control.port}"

  # a text body reaches the server as a text message, although its headers asked to send it to all the clients
  - http:
      server: "websocketResultServer"
      receiveRequest:
        POST:
          path: "/received"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: "java.lang.String"
          body:
            data: "Hello WebSocket"
  - http:
      server: "websocketResultServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # after the Kamelet, the body is the same, and the CamelVertxWebsocket headers are gone
  - http:
      server: "websocketControlServer"
      receiveRequest:
        POST:
          path: "/next"
          type: "plaintext"
          headers:
            - name: "X-After"
              value: "Hello WebSocket||"
  - http:
      server: "websocketControlServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # a bytes body reaches the server as a binary message
  - http:
      server: "websocketResultServer"
      receiveRequest:
        POST:
          path: "/received"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: "[B"
          body:
            data: "Hello bytes"
  - http:
      server: "websocketResultServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
