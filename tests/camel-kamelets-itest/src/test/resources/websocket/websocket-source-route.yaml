# A WebSocket server that greets each client when it connects: with text the first time, with bytes after that
- route:
    id: websocket-server
    from:
      uri: "vertx-websocket:localhost:{{ws.server.port}}/feed"
      parameters:
        fireWebSocketConnectionEvents: true
      steps:
        - filter:
            simple: "${header.CamelVertxWebsocket.event} == 'OPEN'"
            steps:
              - choice:
                  when:
                    - simple: "${variable.global:connected} == null"
                      steps:
                        - setVariable:
                            name: "global:connected"
                            constant: "true"
                        - setBody:
                            simple: "Welcome ${header.user}"
                  otherwise:
                    steps:
                      - setBody:
                          simple: "Welcome back ${header.user}"
                      - convertBodyTo:
                          type: "byte[]"
              # to the client that connected, by the connection key the server set
              - to: "vertx-websocket:localhost:{{ws.server.port}}/feed"

- route:
    from:
      uri: "kamelet:websocket-source"
      parameters:
        url: "ws://localhost:{{ws.server.port}}/feed?user=Ann"
        reconnectInterval: 200
      steps:
        - setHeader:
            name: X-Header-Count
            simple: "${headers.size()}"
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - convertBodyTo:
            type: "String"
        - setHeader:
            name: Content-Type
            constant: "text/plain"
        - to: "{{result.server.url}}/result"
        # the test answers the first message with X-Restart: the server stops, which closes the connection, and starts again
        - filter:
            simple: "${header.X-Restart} == 'true'"
            steps:
              - to: "controlbus:route?routeId=websocket-server&action=restart&async=true"
