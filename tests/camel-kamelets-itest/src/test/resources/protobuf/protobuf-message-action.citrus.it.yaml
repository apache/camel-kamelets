name: protobuf-message-action-test
actions:
  - camel:
      cli:
        run:
          integration:
            file: "protobuf/protobuf-message-action-route.yaml"
  # Every field of the schema is set, and the field that the schema does not have is left out
  - camel:
      cli:
        verify:
          integration: "protobuf-message-action-route"
          logMessage: "Order com.google.protobuf.DynamicMessage: order_id: 12345678901234 item_count: 3 status: SHIPPED line {   qty: 2 } at {   seconds: 1795255200 } |"
  - camel:
      cli:
        verify:
          integration: "protobuf-message-action-route"
          logMessage: "Line Order.Line: qty: 5 |"
  - camel:
      cli:
        verify:
          integration: "protobuf-message-action-route"
          logMessage: 'Rejected com.google.protobuf.InvalidProtocolBufferException: Not an int32 value: "abc"'
  # An unknown messageName fails when the Kamelet starts, so the integration stops by itself
  - camel:
      cli:
        run:
          waitForRunningState: false
          autoRemove: false
          integration:
            file: "protobuf/protobuf-message-action-unknown-route.yaml"
  - camel:
      cli:
        verify:
          integration: "protobuf-message-action-unknown-route"
          phase: "Stopped"
          logMessage: "The protobuf schema has no message type Invoice"
