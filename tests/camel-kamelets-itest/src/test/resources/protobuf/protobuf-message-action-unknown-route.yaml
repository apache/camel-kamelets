# messageName is not a message type of the schema: the Kamelet fails at startup
- route:
    from:
      uri: "timer:order"
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            constant: '{"id":1}'
        - to:
            uri: "kamelet:protobuf-message-action"
            parameters:
              messageName: "Invoice"
              schema: 'syntax = "proto3"; message Order { int32 id = 1; }'
