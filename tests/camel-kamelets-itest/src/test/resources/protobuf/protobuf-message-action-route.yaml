# JSON text in, a DynamicMessage of the schema out
- route:
    from:
      uri: "timer:order"
      parameters:
        repeatCount: 1
      steps:
        # orderId: a field by its lowerCamelCase name, a 64-bit number as text; item_count by its name in the schema;
        # status: an enum by its name; at: a well-known type in its JSON form; coupon: not in the schema
        - setBody:
            constant: '{"orderId":"12345678901234","item_count":3,"status":"SHIPPED","line":{"qty":2},"at":"2026-11-21T10:00:00Z","coupon":"X"}'
        - to:
            uri: "kamelet:protobuf-message-action"
            parameters:
              messageName: "shop.Order"
              schema: |
                syntax = "proto3";
                package shop;
                import "google/protobuf/timestamp.proto";
                message Order {
                  message Line { int32 qty = 1; }
                  enum Status { NEW = 0; SHIPPED = 1; }
                  int64 order_id = 1;
                  int32 item_count = 2;
                  Status status = 3;
                  Line line = 4;
                  google.protobuf.Timestamp at = 5;
                }
        - log: "Order ${body.getClass().getName()}: ${body.toString().replace('\n', ' ')}|"
# The nested message type, from the bytes of the JSON text
- route:
    from:
      uri: "timer:line"
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            constant: '{"qty":5}'
        - convertBodyTo:
            type: "byte[]"
        - to:
            uri: "kamelet:protobuf-message-action"
            parameters:
              messageName: "Order.Line"
              schema: 'message Order { message Line { optional int32 qty = 1; }}'
        - log: "Line ${body.getDescriptorForType().getFullName()}: ${body.toString().replace('\n', ' ')}|"
# A value of the wrong type fails the message
- route:
    from:
      uri: "timer:wrong"
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            constant: '{"id":"abc"}'
        - doTry:
            steps:
              - to:
                  uri: "kamelet:protobuf-message-action"
                  parameters:
                    schema: 'syntax = "proto3"; message Order { int32 id = 1; }'
              - log: "Accepted ${body}"
            doCatch:
              - exception:
                  - "java.lang.Exception"
                steps:
                  - log: "Rejected ${exception.getClass().getName()}: ${exception.message}"
