- route:
    from:
      uri: "kamelet:ceph-source"
      parameters:
        cephUrl: '{{s3.url}}'
        accessKey: '{{s3.accessKey}}'
        secretKey: '{{s3.secretKey}}'
        zoneGroup: '{{s3.region}}'
        bucketName: 'ceph-source-bucket'
        # the gateway has no wildcard DNS name for its buckets
        forcePathStyle: true
        # read only the files of the folder reports
        prefix: 'reports/'
      steps:
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        # Camel headers are not sent over HTTP: copy them
        - setHeader:
            name: X-S3-Bucket-Name
            simple: "${header.CamelAwsS3BucketName}"
        - setHeader:
            name: X-S3-Key
            simple: "${header.CamelAwsS3Key}"
        - setHeader:
            name: X-S3-Content-Length
            simple: "${header.CamelAwsS3ContentLength}"
        - setHeader:
            name: X-S3-ETag
            simple: "${header.CamelAwsS3ETag}"
        - setHeader:
            name: X-S3-Content-Type
            simple: "${header.CamelAwsS3ContentType}"
        # the body is bytes: give the HTTP server text
        - convertBodyTo:
            type: "java.lang.String"
        - to:
            uri: "{{http.sink.url}}/result"
