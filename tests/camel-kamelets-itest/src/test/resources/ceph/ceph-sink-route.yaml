- route:
    from:
      uri: "timer:send"
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            constant: 'id,item'
        # the key, with characters that have a meaning in an address
        - setHeader:
            name: file
            constant: 'reports/day 1+x=2.csv'
        # a header that would send the file to another bucket: the Kamelet removes it
        - setHeader:
            name: CamelAwsS3OverrideBucketName
            constant: 'other-bucket'
        - to:
            uri: "kamelet:ceph-sink"
            parameters:
              cephUrl: '{{s3.url}}'
              accessKey: '{{s3.accessKey}}'
              secretKey: '{{s3.secretKey}}'
              zoneGroup: '{{s3.region}}'
              bucketName: 'ceph-sink-bucket'
              # the gateway has no wildcard DNS name for its buckets
              forcePathStyle: true
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        # Camel headers are not sent over HTTP: copy them
        - setHeader:
            name: X-S3-Key
            simple: "${header.CamelAwsS3Key}"
        - setHeader:
            name: X-S3-ETag
            simple: "${header.CamelAwsS3ETag}"
        - to:
            uri: "{{http.sink.url}}/result"
