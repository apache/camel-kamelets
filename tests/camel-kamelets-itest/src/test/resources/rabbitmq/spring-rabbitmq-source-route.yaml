- route:
    from:
      uri: "kamelet:spring-rabbitmq-source"
      parameters:
        host: '{{rabbitmq.host}}'
        port: '{{rabbitmq.port}}'
        username: 'citrus'
        password: 'citrus'
        exchangeName: 'orders'
        queues: 'orders'
        routingKey: 'new-order'
        autoDeclare: 'true'
      steps:
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - setHeader:
            name: X-Exchange-Name
            simple: "${header.CamelSpringRabbitmqExchangeName}"
        - setHeader:
            name: X-Routing-Key
            simple: "${header.CamelSpringRabbitmqRoutingKey}"
        - setHeader:
            name: X-Rabbitmq-Content-Type
            simple: "${header.CamelSpringRabbitmqContentType}"
        - to:
            uri: "{{http.sink.url}}/result"

# publishes one message for the source to receive; it declares the queue too, so the message is not dropped when it comes before the source
- route:
    from:
      uri: "timer:send"
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            constant: 'Hello RabbitMQ'
        - setHeader:
            name: origin
            constant: 'citrus'
        - to:
            uri: "kamelet:spring-rabbitmq-sink"
            parameters:
              host: '{{rabbitmq.host}}'
              port: '{{rabbitmq.port}}'
              username: 'citrus'
              password: 'citrus'
              exchangeName: 'orders'
              queues: 'orders'
              routingKey: 'new-order'
              autoDeclareProducer: 'true'
