name: spring-rabbitmq-sink-route-test
description: 'spring-rabbitmq-sink publishes a text message, with its headers, to an exchange in RabbitMQ that routes it to a queue'
actions:
  # Start RabbitMQ
  - testcontainers:
      start:
        container:
          name: "rabbitmq"
          image: "rabbitmq:4.3.6"
          autoRemove: true
          startUpTimeout: 180
          env:
            - name: "RABBITMQ_DEFAULT_USER"
              value: "citrus"
            - name: "RABBITMQ_DEFAULT_PASS"
              value: "citrus"
          exposedPorts:
            - 5672
          waitFor:
            logMessage: '.*Server startup complete.*'

  # Create Camel JBang integration
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "rabbitmq/spring-rabbitmq-sink-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${http.server.port}"
                - name: "rabbitmq.host"
                  value: "${CITRUS_TESTCONTAINERS_RABBITMQ_HOST}"
                - name: "rabbitmq.port"
                  value: "${CITRUS_TESTCONTAINERS_RABBITMQ_PORT}"

  # The message goes on unchanged after the Kamelet
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "origin"
              value: 'citrus'
          body:
            data: 'Hello RabbitMQ'
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # The message is on the queue, as text/plain, with the header and the routing key
  - camel:
      cli:
        verify:
          integration: "spring-rabbitmq-sink-route"
          logMessage: 'Received from the queue: Hello RabbitMQ (origin=citrus, content type=text/plain, routing key=new-order)'
          maxAttempts: 30
          delayBetweenAttempts: 1000
