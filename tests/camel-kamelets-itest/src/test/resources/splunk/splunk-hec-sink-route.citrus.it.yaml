name: splunk-hec-sink-route-test
actions:
  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "splunk/splunk-hec-sink-route.yaml"
            systemProperties:
              properties:
                - name: "http.sink.url"
                  value: "http://localhost:${http.server.port}"
                - name: "http.server.port"
                  value: "${http.server.port}"

  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/services/collector/event"
          type: "plaintext"
          headers:
            - name: "Authorization"
              value: 'Splunk 12345678-1234-1234-1234-123456789012'
          body:
            data: '@contains(''order ORD-1'')@'

  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          headers:
            - name: "Content-Type"
              value: "application/json"
          body:
            data: '{"text":"Success","code":0}'

  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Content-Type"
              value: 'ct='
          body:
            data: 'order ORD-1'

  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          body:
            data: 'OK'
