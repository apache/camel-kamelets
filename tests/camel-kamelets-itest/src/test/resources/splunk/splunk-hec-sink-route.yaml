- route:
    from:
      uri: "timer:tick"
      parameters:
        period: "1000"
        repeatCount: 1
      steps:
        - setBody:
            constant: 'order ORD-1'
        - to:
            uri: "kamelet:splunk-hec-sink"
            parameters:
              splunkUrl: 'localhost:{{http.server.port}}'
              token: '12345678-1234-1234-1234-123456789012'
              https: 'false'
              index: 'orders'
              source: 'shop'
              sourceType: 'order'
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - to:
            uri: "{{http.sink.url}}/result"
