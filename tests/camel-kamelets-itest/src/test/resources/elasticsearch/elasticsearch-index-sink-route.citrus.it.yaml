name: elasticsearch-index-sink-route-test
actions:
  # Elasticsearch with one node and security on: a login is needed (user elastic), over plain HTTP
  - testcontainers:
      start:
        container:
          name: "elasticsearch"
          image: "elasticsearch:9.1.0"
          startUpTimeout: 180
          exposedPorts:
            - 9200
          env:
            - name: "discovery.type"
              value: "single-node"
            - name: "xpack.security.enabled"
              value: "true"
            - name: "xpack.security.http.ssl.enabled"
              value: "false"
            - name: "ELASTIC_PASSWORD"
              value: "kamelets-Test-1"
            - name: "cluster.routing.allocation.disk.threshold_enabled"
              value: "false"
            - name: "ES_JAVA_OPTS"
              value: "-Xms512m -Xmx512m"
          waitFor:
            logMessage: '.*"message":"started.*'

  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "elasticsearch/elasticsearch-index-sink-route.yaml"
            systemProperties:
              properties:
                - name: "elasticsearch.host"
                  value: "${CITRUS_TESTCONTAINERS_ELASTICSEARCH_HOST}"
                - name: "elasticsearch.port"
                  value: "${CITRUS_TESTCONTAINERS_ELASTICSEARCH_PORT}"
                - name: "http.sink.url"
                  value: "http://localhost:${search.server.port}"

  # the body afterwards is the id of the document
  - http:
      server: "searchServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Content-Type"
              value: 'ct=application/json'
          body:
            data: 'order-1'
  - http:
      server: "searchServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # the document is stored under its id, in the index of the header
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_ELASTICSEARCH_HOST}:${CITRUS_TESTCONTAINERS_ELASTICSEARCH_PORT}"
      sendRequest:
        GET:
          path: "/orders/_doc/order-1"
          headers:
            - name: "Authorization"
              value: "Basic citrus:encodeBase64('elastic:kamelets-Test-1')"
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_ELASTICSEARCH_HOST}:${CITRUS_TESTCONTAINERS_ELASTICSEARCH_PORT}"
      receiveResponse:
        response:
          status: 200
          body:
            data: '{"_index":"orders","_id":"order-1","_version":1,"_seq_no":"@ignore@","_primary_term":"@ignore@","found":true,"_source":{"order":"ORD-1","status":"shipped"}}'

  # an API key, created by the user elastic, and the Kamelet logs in with it instead of the user
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_ELASTICSEARCH_HOST}:${CITRUS_TESTCONTAINERS_ELASTICSEARCH_PORT}"
      sendRequest:
        POST:
          path: "/_security/api_key"
          contentType: "application/json"
          headers:
            - name: "Authorization"
              value: "Basic citrus:encodeBase64('elastic:kamelets-Test-1')"
          body:
            data: '{"name": "kamelets"}'
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_ELASTICSEARCH_HOST}:${CITRUS_TESTCONTAINERS_ELASTICSEARCH_PORT}"
      receiveResponse:
        response:
          status: 200
        extract:
          body:
            - path: "$.encoded"
              variable: "es.api.key"

  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "elasticsearch/elasticsearch-index-sink-apikey-route.yaml"
            systemProperties:
              properties:
                - name: "elasticsearch.host"
                  value: "${CITRUS_TESTCONTAINERS_ELASTICSEARCH_HOST}"
                - name: "elasticsearch.port"
                  value: "${CITRUS_TESTCONTAINERS_ELASTICSEARCH_PORT}"
                - name: "es.api.key"
                  value: "${es.api.key}"
                - name: "http.sink.url"
                  value: "http://localhost:${search.server.port}"

  - http:
      server: "searchServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          body:
            data: 'order-2'
  - http:
      server: "searchServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  - http:
      client: "http://${CITRUS_TESTCONTAINERS_ELASTICSEARCH_HOST}:${CITRUS_TESTCONTAINERS_ELASTICSEARCH_PORT}"
      sendRequest:
        GET:
          path: "/orders/_doc/order-2"
          headers:
            - name: "Authorization"
              value: "Basic citrus:encodeBase64('elastic:kamelets-Test-1')"
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_ELASTICSEARCH_HOST}:${CITRUS_TESTCONTAINERS_ELASTICSEARCH_PORT}"
      receiveResponse:
        response:
          status: 200
          body:
            data: '{"_index":"orders","_id":"order-2","_version":1,"_seq_no":"@ignore@","_primary_term":"@ignore@","found":true,"_source":{"order":"ORD-2","status":"shipped"}}'
