name: elasticsearch-search-action-route-test
actions:
  # Elasticsearch with one node and security off, so it is reached with plain HTTP
  - testcontainers:
      start:
        container:
          name: "elasticsearch"
          image: "elasticsearch:9.1.0"
          startUpTimeout: 180
          exposedPorts:
            - 9200
          env:
            - name: "discovery.type"
              value: "single-node"
            - name: "xpack.security.enabled"
              value: "false"
            - name: "cluster.routing.allocation.disk.threshold_enabled"
              value: "false"
            - name: "ES_JAVA_OPTS"
              value: "-Xms512m -Xmx512m"
          waitFor:
            url: "http://localhost:9200/"

  # two customers to search, and a third one in another index, that the Kamelet must not find
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_ELASTICSEARCH_HOST}:${CITRUS_TESTCONTAINERS_ELASTICSEARCH_PORT}"
      sendRequest:
        PUT:
          path: "/customers/_doc/1"
          contentType: "application/json"
          parameters:
            - name: "refresh"
              value: 'true'
          body:
            data: '{"name": "Alice Smith", "city": "Oslo"}'
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_ELASTICSEARCH_HOST}:${CITRUS_TESTCONTAINERS_ELASTICSEARCH_PORT}"
      receiveResponse:
        response:
          status: 201
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_ELASTICSEARCH_HOST}:${CITRUS_TESTCONTAINERS_ELASTICSEARCH_PORT}"
      sendRequest:
        PUT:
          path: "/customers/_doc/2"
          contentType: "application/json"
          parameters:
            - name: "refresh"
              value: 'true'
          body:
            data: '{"name": "Bob Jones", "city": "Rome"}'
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_ELASTICSEARCH_HOST}:${CITRUS_TESTCONTAINERS_ELASTICSEARCH_PORT}"
      receiveResponse:
        response:
          status: 201
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_ELASTICSEARCH_HOST}:${CITRUS_TESTCONTAINERS_ELASTICSEARCH_PORT}"
      sendRequest:
        PUT:
          path: "/other/_doc/3"
          contentType: "application/json"
          parameters:
            - name: "refresh"
              value: 'true'
          body:
            data: '{"name": "Carol White", "city": "Oslo"}'
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_ELASTICSEARCH_HOST}:${CITRUS_TESTCONTAINERS_ELASTICSEARCH_PORT}"
      receiveResponse:
        response:
          status: 201

  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "elasticsearch/elasticsearch-search-action-route.yaml"
            systemProperties:
              properties:
                - name: "elasticsearch.host"
                  value: "${CITRUS_TESTCONTAINERS_ELASTICSEARCH_HOST}"
                - name: "elasticsearch.port"
                  value: "${CITRUS_TESTCONTAINERS_ELASTICSEARCH_PORT}"
                - name: "http.sink.url"
                  value: "http://localhost:${search.server.port}"

  # a query in the Query DSL: the body is the JSON array of the documents found, only in the index of the option
  - http:
      server: "searchServer"
      receiveRequest:
        POST:
          path: "/json"
          type: "json"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Total-Hits"
              value: '1'
            - name: "X-Content-Type"
              value: 'ct=application/json'
          body:
            data: '[{"name": "Alice Smith", "city": "Oslo"}]'
  - http:
      server: "searchServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # plain text
  - http:
      server: "searchServer"
      receiveRequest:
        POST:
          path: "/text"
          type: "json"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Total-Hits"
              value: '1'
            - name: "X-Content-Type"
              value: 'ct=application/json'
          body:
            data: '[{"name": "Bob Jones", "city": "Rome"}]'
  - http:
      server: "searchServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # no match: an empty array
  - http:
      server: "searchServer"
      receiveRequest:
        POST:
          path: "/none"
          type: "json"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Total-Hits"
              value: '0'
            - name: "X-Content-Type"
              value: 'ct=application/json'
          body:
            data: '[]'
  - http:
      server: "searchServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
