- route:
    from:
      uri: "timer:tick"
      parameters:
        period: "1000"
        repeatCount: 1
      steps:
        - setHeader:
            name: indexId
            constant: 'order-1'
        # the header takes precedence over the indexName option
        - setHeader:
            name: indexName
            constant: 'orders'
        - setBody:
            constant: '{"order":"ORD-1","status":"shipped"}'
        - to:
            uri: "kamelet:elasticsearch-index-sink"
            parameters:
              hostAddresses: '{{elasticsearch.host}}:{{elasticsearch.port}}'
              clusterName: 'docker-cluster'
              user: 'elastic'
              password: 'kamelets-Test-1'
              indexName: 'other'
              enableSSL: false
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        - to:
            uri: "{{http.sink.url}}/result"
