name: opensearch-search-action-route-test
actions:
  # OpenSearch with one node and the security plugin off, so it is reached with plain HTTP
  - testcontainers:
      start:
        container:
          name: "opensearch"
          image: "opensearchproject/opensearch:3.9.0"
          startUpTimeout: 180
          exposedPorts:
            - 9200
          env:
            - name: "discovery.type"
              value: "single-node"
            - name: "DISABLE_SECURITY_PLUGIN"
              value: "true"
            - name: "DISABLE_INSTALL_DEMO_CONFIG"
              value: "true"
            - name: "cluster.routing.allocation.disk.threshold_enabled"
              value: "false"
            - name: "OPENSEARCH_JAVA_OPTS"
              value: "-Xms512m -Xmx512m"
          waitFor:
            url: "http://localhost:9200/"

  # two customers to search, and a third one in another index, that the Kamelet must not find
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_OPENSEARCH_HOST}:${CITRUS_TESTCONTAINERS_OPENSEARCH_PORT}"
      sendRequest:
        PUT:
          path: "/customers/_doc/1"
          contentType: "application/json"
          parameters:
            - name: "refresh"
              value: 'true'
          body:
            data: '{"name": "Alice Smith", "city": "Oslo"}'
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_OPENSEARCH_HOST}:${CITRUS_TESTCONTAINERS_OPENSEARCH_PORT}"
      receiveResponse:
        response:
          status: 201
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_OPENSEARCH_HOST}:${CITRUS_TESTCONTAINERS_OPENSEARCH_PORT}"
      sendRequest:
        PUT:
          path: "/customers/_doc/2"
          contentType: "application/json"
          parameters:
            - name: "refresh"
              value: 'true'
          body:
            data: '{"name": "Bob Jones", "city": "Rome"}'
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_OPENSEARCH_HOST}:${CITRUS_TESTCONTAINERS_OPENSEARCH_PORT}"
      receiveResponse:
        response:
          status: 201
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_OPENSEARCH_HOST}:${CITRUS_TESTCONTAINERS_OPENSEARCH_PORT}"
      sendRequest:
        PUT:
          path: "/other/_doc/3"
          contentType: "application/json"
          parameters:
            - name: "refresh"
              value: 'true'
          body:
            data: '{"name": "Carol White", "city": "Oslo"}'
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_OPENSEARCH_HOST}:${CITRUS_TESTCONTAINERS_OPENSEARCH_PORT}"
      receiveResponse:
        response:
          status: 201

  # an index of places with a vector of 3 numbers each, in a `knn_vector` field, in an index with `index.knn`, for a vector search
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_OPENSEARCH_HOST}:${CITRUS_TESTCONTAINERS_OPENSEARCH_PORT}"
      sendRequest:
        PUT:
          path: "/places"
          contentType: "application/json"
          body:
            data: '{"settings": {"index.knn": true}, "mappings": {"properties": {"name": {"type": "keyword"}, "embedding": {"type": "knn_vector", "dimension": 3, "space_type": "cosinesimil"}}}}'
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_OPENSEARCH_HOST}:${CITRUS_TESTCONTAINERS_OPENSEARCH_PORT}"
      receiveResponse:
        response:
          status: 200
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_OPENSEARCH_HOST}:${CITRUS_TESTCONTAINERS_OPENSEARCH_PORT}"
      sendRequest:
        PUT:
          path: "/places/_doc/n"
          contentType: "application/json"
          parameters:
            - name: "refresh"
              value: 'true'
          body:
            data: '{"name": "north", "embedding": [1.0, 0.0, 0.0]}'
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_OPENSEARCH_HOST}:${CITRUS_TESTCONTAINERS_OPENSEARCH_PORT}"
      receiveResponse:
        response:
          status: 201
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_OPENSEARCH_HOST}:${CITRUS_TESTCONTAINERS_OPENSEARCH_PORT}"
      sendRequest:
        PUT:
          path: "/places/_doc/e"
          contentType: "application/json"
          parameters:
            - name: "refresh"
              value: 'true'
          body:
            data: '{"name": "east", "embedding": [0.0, 1.0, 0.0]}'
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_OPENSEARCH_HOST}:${CITRUS_TESTCONTAINERS_OPENSEARCH_PORT}"
      receiveResponse:
        response:
          status: 201

  - camel:
      cli:
        run:
          waitForRunningState: false
          integration:
            file: "opensearch/opensearch-search-action-route.yaml"
            systemProperties:
              properties:
                - name: "opensearch.host"
                  value: "${CITRUS_TESTCONTAINERS_OPENSEARCH_HOST}"
                - name: "opensearch.port"
                  value: "${CITRUS_TESTCONTAINERS_OPENSEARCH_PORT}"
                - name: "http.sink.url"
                  value: "http://localhost:${search.server.port}"

  # a query in the Query DSL: the body is the JSON array of the documents found, only in the index of the option
  - http:
      server: "searchServer"
      receiveRequest:
        POST:
          path: "/json"
          type: "json"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Total-Hits"
              value: '1'
            - name: "X-Content-Type"
              value: 'ct=application/json'
          body:
            data: '[{"name": "Alice Smith", "city": "Oslo", "_id": "1"}]'
  - http:
      server: "searchServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # plain text
  - http:
      server: "searchServer"
      receiveRequest:
        POST:
          path: "/text"
          type: "json"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Total-Hits"
              value: '1'
            - name: "X-Content-Type"
              value: 'ct=application/json'
          body:
            data: '[{"name": "Bob Jones", "city": "Rome", "_id": "2"}]'
  - http:
      server: "searchServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # no match: an empty array
  - http:
      server: "searchServer"
      receiveRequest:
        POST:
          path: "/none"
          type: "json"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Total-Hits"
              value: '0'
            - name: "X-Content-Type"
              value: 'ct=application/json'
          body:
            data: '[]'
  - http:
      server: "searchServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # queryDsl=false: a Query DSL text is searched for as words, so match_all finds nothing
  - http:
      server: "searchServer"
      receiveRequest:
        POST:
          path: "/words"
          type: "json"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Total-Hits"
              value: '0'
            - name: "X-Content-Type"
              value: 'ct=application/json'
          body:
            data: '[]'
  - http:
      server: "searchServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # a vector search: the place whose vector is closest, with only the fields of _source; the total is not
  # checked, as OpenSearch gives k hits for each segment of the index, here 2
  - http:
      server: "searchServer"
      receiveRequest:
        POST:
          path: "/knn"
          type: "json"
          headers:
            - name: "X-Body-Type"
              value: 'java.lang.String'
            - name: "X-Total-Hits"
              value: '@ignore@'
            - name: "X-Content-Type"
              value: 'ct=application/json'
          body:
            data: '[{"name": "north", "_id": "n"}]'
  - http:
      server: "searchServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
