- route:
    from:
      uri: "timer:tick"
      parameters:
        period: "1000"
        repeatCount: 1
      steps:
        - setBody:
            constant: 'ORD-1,42'
        - setHeader:
            name: file
            constant: 'reports/2026-11-19.csv'
        - to:
            uri: "kamelet:ibm-cos-sink"
            parameters:
              bucketName: '{{s3.bucket}}'
              apiKey: 'not-used'
              serviceInstanceId: 'crn:v1:bluemix:public:cloud-object-storage:global:a/0:0::'
              endpointUrl: '{{s3.url}}'
        # what the Kamelet leaves: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        # the HTTP server reads an application/octet-stream body as bytes: send the body as text
        - removeHeader:
            name: Content-Type
        - convertBodyTo:
            type: "java.lang.String"
        - setHeader:
            name: X-ETag
            simple: "${header.CamelIBMCOSETag}"
        - to:
            uri: "{{http.sink.url}}/result"
