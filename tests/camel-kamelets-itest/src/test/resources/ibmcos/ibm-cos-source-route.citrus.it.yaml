name: ibm-cos-source-route-test
description: 'ibm-cos-source reads each file of the bucket, with the bucket, key, content type, size and ETag as headers, and deletes it'
variables:
  - name: "s3.bucket"
    value: "ibm-cos-source"
actions:
  # an S3 API (Floci) in place of IBM Cloud Object Storage, with the bucket
  - testcontainers:
      start:
        localstack:
          services:
            - "S3"
          options:
            buckets: '${s3.bucket}'
            s3ClientName: "ibmCosSourceS3Client"
  - waitFor:
      http:
        url: "${CITRUS_TESTCONTAINERS_LOCALSTACK_SERVICE_URL}"

  # one file in the bucket
  - send:
      endpoint: camel:aws2-s3://${s3.bucket}?amazonS3Client=#ibmCosSourceS3Client
      message:
        headers:
          - name: CamelAwsS3Key
            value: "inbox/orders.csv"
          - name: CamelAwsS3ContentType
            value: "text/csv"
        body:
          data: "ORD-1,42"

  - camel:
      cli:
        run:
          waitForRunningState: false
          args:
            - "--dep=camel:groovy"
            - "--dep=camel:ibm-cos"
          resources:
            - "cos-client.yaml"
          integration:
            file: "ibmcos/ibm-cos-source-route.yaml"
            systemProperties:
              properties:
                - name: "s3.bucket"
                  value: "${s3.bucket}"
                - name: "s3.url"
                  value: "${CITRUS_TESTCONTAINERS_LOCALSTACK_SERVICE_URL}"
                - name: "s3.access.key"
                  value: "${CITRUS_TESTCONTAINERS_LOCALSTACK_ACCESS_KEY}"
                - name: "s3.secret.key"
                  value: "${CITRUS_TESTCONTAINERS_LOCALSTACK_SECRET_KEY}"
                - name: "s3.region"
                  value: "${CITRUS_TESTCONTAINERS_LOCALSTACK_REGION}"
                - name: "http.sink.url"
                  value: "http://localhost:${services.server.port}"

  # the content of the file, with the headers that describe it
  - http:
      server: "servicesServer"
      receiveRequest:
        POST:
          path: "/result"
          type: "plaintext"
          headers:
            - name: "X-Body-Type"
              value: 'org.apache.camel.converter.stream.InputStreamCache'
            - name: "X-Content-Type"
              value: 'ct='
            - name: "X-Bucket"
              value: '${s3.bucket}'
            - name: "X-Key"
              value: 'inbox/orders.csv'
            - name: "X-Object-Content-Type"
              value: 'ct=text/csv'
            - name: "X-Object-Length"
              value: '8'
            - name: "X-ETag"
              value: '@notEmpty()@'
          body:
            data: 'ORD-1,42'
  - http:
      server: "servicesServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
