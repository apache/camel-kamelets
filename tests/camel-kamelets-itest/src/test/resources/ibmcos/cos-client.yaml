# The IBM COS client for the Kamelet, against the S3 API of the Floci container. IBM Cloud Object Storage
# logs in with an API key through IBM Cloud IAM, at an address that cannot be changed, so the test gives the
# component a client of its own with HMAC credentials instead: the cosClient option of the component is
# autowired, and then the apiKey and endpointUrl options of the Kamelet are not used.
- beans:
    - name: cosClient
      type: "com.ibm.cloud.objectstorage.services.s3.AmazonS3"
      scriptLanguage: groovy
      script: |
        com.ibm.cloud.objectstorage.services.s3.AmazonS3ClientBuilder.standard()
            .withCredentials(new com.ibm.cloud.objectstorage.auth.AWSStaticCredentialsProvider(
                new com.ibm.cloud.objectstorage.auth.BasicAWSCredentials('{{s3.access.key}}', '{{s3.secret.key}}')))
            .withPathStyleAccessEnabled(true)
            .withEndpointConfiguration(new com.ibm.cloud.objectstorage.client.builder.AwsClientBuilder.EndpointConfiguration(
                '{{s3.url}}', '{{s3.region}}'))
            .build()
