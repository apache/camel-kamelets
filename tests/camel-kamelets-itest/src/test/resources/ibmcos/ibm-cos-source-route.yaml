- route:
    from:
      uri: "kamelet:ibm-cos-source"
      parameters:
        bucketName: '{{s3.bucket}}'
        apiKey: 'not-used'
        serviceInstanceId: 'crn:v1:bluemix:public:cloud-object-storage:global:a/0:0::'
        endpointUrl: '{{s3.url}}'
        delay: 2000
      steps:
        # what the Kamelet gives: the Java type of the body and the Content-Type
        - setHeader:
            name: X-Body-Type
            simple: "${body.getClass().getName()}"
        - setHeader:
            name: X-Content-Type
            simple: "ct=${header.Content-Type}"
        # the documented headers, which are not sent over HTTP as they start with Camel
        - setHeader:
            name: X-Bucket
            simple: "${header.CamelIBMCOSBucketName}"
        - setHeader:
            name: X-Key
            simple: "${header.CamelIBMCOSKey}"
        - setHeader:
            name: X-Object-Content-Type
            simple: "ct=${header.CamelIBMCOSContentType}"
        - setHeader:
            name: X-Object-Length
            simple: "${header.CamelIBMCOSContentLength}"
        - setHeader:
            name: X-ETag
            simple: "${header.CamelIBMCOSETag}"
        - to:
            uri: "{{http.sink.url}}/result"
