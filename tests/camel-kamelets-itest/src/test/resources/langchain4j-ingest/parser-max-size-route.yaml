# maxDocumentSize on the parser actions: the cap is checked before the parse or conversion.
# One route feeds three documents in turn, each report waiting for the test's answer, so
# the order is fixed: a short text through Tika under the cap, an oversized payload through
# Docling (pointed at the test's HTTP server, so a payload leaking past the cap would show up
# there as a conversion request), and an oversized file through the file source and Tika.
- route:
    id: parser-max-size-route
    from:
      uri: "timer:size"
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            constant: "Short text."
        - setHeader:
            name: "CamelLangChain4jIngestDocumentId"
            constant: "short.txt"
        - doTry:
            steps:
              - to: "kamelet:tika-extract-text-action?maxDocumentSize=40"
              - setBody:
                  simple: "parsed: ${body}"
            doCatch:
              - exception:
                  - "java.lang.IllegalArgumentException"
                steps:
                  - setBody:
                      simple: "rejected: ${exception.message}"
        - to: "{{report.url}}"
        # 100 bytes, over the cap of 40
        - setBody:
            constant: "0123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789"
        - setHeader:
            name: "CamelLangChain4jIngestDocumentId"
            constant: "long.pdf"
        - doTry:
            steps:
              - to: "kamelet:docling-convert-action?maxDocumentSize=40&useDoclingServe=true&doclingServeUrl={{docling.serve.url}}"
              - setBody:
                  simple: "converted: ${body}"
            doCatch:
              - exception:
                  - "java.lang.IllegalArgumentException"
                steps:
                  - setBody:
                      simple: "rejected: ${exception.message}"
        - to: "{{report.url}}"
        - setBody:
            constant: "0123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789"
        - to: "file:{{ingest.dir}}?fileName=big.txt"
- route:
    id: parser-max-size-file-route
    from:
      uri: "kamelet:langchain4j-ingest-file-source?directory={{ingest.dir}}"
      steps:
        - doTry:
            steps:
              - to: "kamelet:tika-extract-text-action?maxDocumentSize=40"
              - setBody:
                  simple: "parsed: ${body}"
            doCatch:
              - exception:
                  - "java.lang.IllegalArgumentException"
                steps:
                  - setBody:
                      simple: "rejected: ${exception.message}"
        - to: "{{report.url}}"
