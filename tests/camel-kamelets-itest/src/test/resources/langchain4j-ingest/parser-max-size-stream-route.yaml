# maxDocumentSize with stream caching switched off, so a stream body reaches the action raw
# instead of cached. A raw stream under the cap must still be parsed whole - the measurement
# must not drain it - and one over the cap is rejected with its exact size.
- route:
    id: parser-max-size-stream-route
    from:
      uri: "timer:stream"
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            constant: "Short text."
        - setBody:
            simple: "${bodyAs(java.io.InputStream)}"
        - setHeader:
            name: "CamelLangChain4jIngestDocumentId"
            constant: "short.txt"
        - doTry:
            steps:
              - to: "kamelet:tika-extract-text-action?maxDocumentSize=40"
              - setBody:
                  simple: "parsed: ${body}"
            doCatch:
              - exception:
                  - "java.lang.IllegalArgumentException"
                steps:
                  - setBody:
                      simple: "rejected: ${exception.message}"
        - to: "{{report.url}}"
        # 100 bytes, over the cap of 40
        - setBody:
            constant: "0123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789"
        - setBody:
            simple: "${bodyAs(java.io.InputStream)}"
        - setHeader:
            name: "CamelLangChain4jIngestDocumentId"
            constant: "long.txt"
        - doTry:
            steps:
              - to: "kamelet:tika-extract-text-action?maxDocumentSize=40"
              - setBody:
                  simple: "parsed: ${body}"
            doCatch:
              - exception:
                  - "java.lang.IllegalArgumentException"
                steps:
                  - setBody:
                      simple: "rejected: ${exception.message}"
        - to: "{{report.url}}"
