# The file source: a seed route drops one file into the watched directory, the
# Kamelet picks it up, leaves it in place and stamps the document id into the
# CamelLangChain4jIngestDocumentId header - the contract the ingest sinks read.
- route:
    id: seed-file
    from:
      uri: "timer:seed"
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            constant: "Sphinx of black quartz, judge my vow"
        - to: "file:{{ingest.dir}}?fileName=doc.txt"
- route:
    id: langchain4j-ingest-file-source-route
    from:
      uri: "kamelet:langchain4j-ingest-file-source?directory={{ingest.dir}}&charset=UTF-8"
      steps:
        - convertBodyTo:
            type: "java.lang.String"
        - log: "FILE-SOURCE ${body} id=${header.CamelLangChain4jIngestDocumentId}"
        - setHeader:
            name: "docId"
            simple: "${header.CamelLangChain4jIngestDocumentId}"
        - to: "{{report.url}}"
