name: parser-max-size-route-test
actions:
  # drain any request a previous test may have left on the shared server
  - purge:
      endpoints:
        - name: "httpServer"
      timeout: 100
  - createVariables:
      variables:
        - name: "docling.serve.url"
          value: "http://localhost:${http.server.port}"
        - name: "report.url"
          value: "http://localhost:${http.server.port}/result/parser-size"
        # a fresh directory per test run, see the file-source test
        - name: "ingest.dir"
          value: "ingest-size-citrus:randomNumber(5)"

  - camel:
      cli:
        run:
          waitForRunningState: false
          args:
            - "--max-seconds=60"
          integration:
            file: "langchain4j-ingest/parser-max-size-route.yaml"
            systemProperties:
              properties:
                - name: "docling.serve.url"
                  value: "${docling.serve.url}"
                - name: "report.url"
                  value: "${report.url}"
                - name: "ingest.dir"
                  value: "${ingest.dir}"

  # under the cap: parsed as usual
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result/parser-size"
          type: "plaintext"
          body:
            data: "@contains('parsed: Short text.')@"
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # over the cap: rejected before the conversion; a conversion request instead would fail here
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result/parser-size"
          type: "plaintext"
          body:
            data: "@matches('rejected: Document .long.pdf. exceeds maxDocumentSize .100 > 40 bytes.')@"
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # a file over the cap: rejected before the parse
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result/parser-size"
          type: "plaintext"
          body:
            data: "@matches('rejected: Document .big.txt. exceeds maxDocumentSize .100 > 40 bytes.')@"
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
