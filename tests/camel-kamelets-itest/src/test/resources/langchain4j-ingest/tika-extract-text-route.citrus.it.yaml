name: tika-extract-text-route-test
actions:
  # drain any request a previous test may have left on the shared server
  - purge:
      endpoints:
        - name: "httpServer"
      timeout: 100
  - createVariables:
      variables:
        - name: "report.url"
          value: "http://localhost:${http.server.port}/result/tika"

  # Run a route feeding one HTML document through the tika-extract-text-action
  # into the sink Kamelet; the route reports the IngestResult back to the test's HTTP server
  - camel:
      cli:
        run:
          waitForRunningState: false
          args:
            - "--dep=camel:groovy,camel:langchain4j-ingest"
            - "--max-seconds=60"
          integration:
            file: "langchain4j-ingest/tika-extract-text-route.yaml"
            systemProperties:
              properties:
                - name: "report.url"
                  value: "${report.url}"

  # INGESTED (not EMPTY) proves Tika extracted text from the HTML before the split
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result/tika"
          type: "plaintext"
          body:
            data: "@contains('documentId=notice.html, segmentsWritten=1, outcome=INGESTED')@"

  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
