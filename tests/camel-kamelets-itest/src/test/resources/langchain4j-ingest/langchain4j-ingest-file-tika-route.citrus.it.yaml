name: langchain4j-ingest-file-tika-route-test
actions:
  # drain any request a previous test may have left on the shared server
  - purge:
      endpoints:
        - name: "httpServer"
      timeout: 100
  - createVariables:
      variables:
        - name: "report.url"
          value: "http://localhost:${http.server.port}/result/file-tika"

  # Run the file-source -> tika-action -> sink composition over a binary PDF; the
  # PDF parser module is not part of camel-tika, so it is added to the run - the
  # per-format module story the component docs describe. Its version tracks the
  # Tika of the Camel release (4.0.0 for Camel 4.23): bump the two together
  - camel:
      cli:
        run:
          waitForRunningState: false
          args:
            - "--dep=camel:groovy,camel:langchain4j-ingest,org.apache.tika:tika-parser-pdf-module:4.0.0"
            - "--max-seconds=60"
          integration:
            file: "langchain4j-ingest/langchain4j-ingest-file-tika-route.yaml"
            systemProperties:
              properties:
                - name: "report.url"
                  value: "${report.url}"

  # INGESTED (not EMPTY) proves the PDF bytes reached Tika uncorrupted - with a
  # charset conversion in the source this parse would find no text
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result/file-tika"
          type: "plaintext"
          body:
            data: "@contains('documentId=pump.pdf, segmentsWritten=1, outcome=INGESTED')@"

  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
