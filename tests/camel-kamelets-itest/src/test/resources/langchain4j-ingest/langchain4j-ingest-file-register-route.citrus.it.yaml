name: langchain4j-ingest-file-register-route-test
actions:
  # drain any request a previous test may have left on the shared server
  - purge:
      endpoints:
        - name: "httpServer"
      timeout: 100
  - createVariables:
      variables:
        - name: "report.url"
          value: "http://localhost:${http.server.port}/result/file-register"
        - name: "ingest.dir"
          value: "ingest-reg-citrus:randomNumber(5)"

  # Run the register-semantics scenario: v1 is seeded, then overwritten by v2
  - camel:
      cli:
        run:
          waitForRunningState: false
          args:
            - "--max-seconds=60"
          integration:
            file: "langchain4j-ingest/langchain4j-ingest-file-register-route.yaml"
            systemProperties:
              properties:
                - name: "report.url"
                  value: "${report.url}"
                - name: "ingest.dir"
                  value: "${ingest.dir}"

  # First delivery: the original file, consumed exactly once
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result/file-register"
          type: "plaintext"
          body:
            data: "@contains('version one of the document')@"

  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # Second delivery: the EDITED file is re-delivered (register key includes the
  # modification time); an unchanged-file re-delivery in between would arrive
  # here instead and fail the assertion
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result/file-register"
          type: "plaintext"
          body:
            data: "@contains('version two, edited in place')@"

  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
