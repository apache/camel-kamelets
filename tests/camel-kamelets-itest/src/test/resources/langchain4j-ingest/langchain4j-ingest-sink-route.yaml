# The plain sink: the payload is split, embedded and written to an in-memory
# store; the IngestResult reply is logged for the test to verify. The model is
# a deterministic in-process stub - the test asserts the pipeline mechanics,
# not embedding quality, and needs no ONNX model download.
- beans:
    - name: store
      type: dev.langchain4j.store.embedding.inmemory.InMemoryEmbeddingStore
    - name: model
      type: dev.langchain4j.model.embedding.EmbeddingModel
      scriptLanguage: groovy
      script: |
        def embed = { String text ->
            def random = new java.util.Random(text.hashCode())
            float[] vector = new float[8]
            for (int i = 0; i < 8; i++) {
                vector[i] = random.nextFloat()
            }
            return dev.langchain4j.data.embedding.Embedding.from(vector)
        }
        return [
            embedAll: { segments ->
                dev.langchain4j.model.output.Response.from(segments.collect { embed(it.text()) })
            }
        ] as dev.langchain4j.model.embedding.EmbeddingModel
- route:
    id: langchain4j-ingest-sink-route
    from:
      uri: "timer:ingest"
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            constant: "Camels are resilient desert animals. They store fat in their humps."
        - setHeader:
            name: "CamelLangChain4jIngestDocumentId"
            constant: "camels.txt"
        - to: "kamelet:langchain4j-ingest-sink?embeddingStore=#bean:store&embeddingModel=#bean:model"
        - log: "INGEST ${body}"
        - convertBodyTo:
            type: "java.lang.String"
        - to: "{{report.url}}"
