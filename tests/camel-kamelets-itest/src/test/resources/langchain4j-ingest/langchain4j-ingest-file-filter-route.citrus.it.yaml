name: langchain4j-ingest-file-filter-route-test
actions:
  # drain any request a previous test may have left on the shared server
  - purge:
      endpoints:
        - name: "httpServer"
      timeout: 100
  - createVariables:
      variables:
        - name: "report.url"
          value: "http://localhost:${http.server.port}/result/file-filter"
        # a fresh directory per test run: a still-terminating integration from a
        # previous local run must not re-consume this run's seed files
        - name: "ingest.dir"
          value: "ingest-filter-citrus:randomNumber(5)"

  # Run a route seeding three files; the source's include/exclude globs let
  # only keep.md through, and the aggregated id list is reported back
  - camel:
      cli:
        run:
          waitForRunningState: false
          args:
            - "--max-seconds=60"
          integration:
            file: "langchain4j-ingest/langchain4j-ingest-file-filter-route.yaml"
            systemProperties:
              properties:
                - name: "report.url"
                  value: "${report.url}"
                - name: "ingest.dir"
                  value: "${ingest.dir}"

  # Exactly one delivery: a leaked file changes the count, an over-filter times out
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result/file-filter"
          type: "plaintext"
          body:
            data: "1:keep.md"

  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
