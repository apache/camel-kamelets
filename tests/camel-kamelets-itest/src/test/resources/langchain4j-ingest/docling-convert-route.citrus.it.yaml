name: docling-convert-route-test
actions:
  # drain any request a previous test may have left on the shared server
  - purge:
      endpoints:
        - name: "httpServer"
      timeout: 100
  - createVariables:
      variables:
        - name: "docling.serve.url"
          value: "http://localhost:${http.server.port}"
        - name: "report.url"
          value: "http://localhost:${http.server.port}/result/docling"

  # Run a route feeding one document through the docling-convert-action into the
  # sink Kamelet, with the docling component pointed at the Citrus HTTP server; the
  # route reports the IngestResult back to the same server afterwards
  - camel:
      cli:
        run:
          waitForRunningState: false
          args:
            - "--dep=camel:groovy,camel:langchain4j-ingest"
            - "--max-seconds=60"
          integration:
            file: "langchain4j-ingest/docling-convert-route.yaml"
            systemProperties:
              properties:
                - name: "docling.serve.url"
                  value: "${docling.serve.url}"
                - name: "report.url"
                  value: "${report.url}"

  # The conversion request reaches the stub
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/v1/convert/source"

  # Answer the shape of a real docling-serve convert response
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
          headers:
            - name: "Content-Type"
              value: "application/json"
          body:
            data: |
              {"document":{"filename":"scan.pdf","md_content":"The EPSILON-2 valve seals at 80 bar.","json_content":null,"html_content":null,"text_content":null,"doctags_content":null},"status":"success","errors":[],"processing_time":0.01,"timings":{}}

  # The reported IngestResult proves the stubbed markdown was embedded and stored
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result/docling"
          type: "plaintext"
          body:
            data: "@contains('documentId=scan.pdf, segmentsWritten=1, outcome=INGESTED')@"

  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
