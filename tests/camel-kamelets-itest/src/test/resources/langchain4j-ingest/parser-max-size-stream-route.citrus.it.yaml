name: parser-max-size-stream-route-test
actions:
  # drain any request a previous test may have left on the shared server
  - purge:
      endpoints:
        - name: "httpServer"
      timeout: 100
  - createVariables:
      variables:
        - name: "report.url"
          value: "http://localhost:${http.server.port}/result/parser-size-stream"

  # stream caching off: the actions see raw streams, not cached ones
  - camel:
      cli:
        run:
          waitForRunningState: false
          args:
            - "--max-seconds=60"
          integration:
            file: "langchain4j-ingest/parser-max-size-stream-route.yaml"
            systemProperties:
              properties:
                - name: "report.url"
                  value: "${report.url}"
                - name: "camel.main.streamCachingEnabled"
                  value: "false"

  # under the cap: the whole stream reaches the parser
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result/parser-size-stream"
          type: "plaintext"
          body:
            data: "@contains('parsed: Short text.')@"
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # over the cap: rejected, the size measured once and reported right
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result/parser-size-stream"
          type: "plaintext"
          body:
            data: "@matches('rejected: Document .long.txt. exceeds maxDocumentSize .100 > 40 bytes.')@"
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
