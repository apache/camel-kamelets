name: langchain4j-ingest-sink-filter-route-test
actions:
  # drain any request a previous test may have left on the shared server
  - purge:
      endpoints:
        - name: "httpServer"
      timeout: 100
  - createVariables:
      variables:
        - name: "report.url"
          value: "http://localhost:${http.server.port}/result/sink-filter"

  # Run a route driving three documents through a sink with includeId and
  # minDocumentSize; each IngestResult is reported back in order
  - camel:
      cli:
        run:
          waitForRunningState: false
          args:
            - "--dep=camel:groovy,camel:langchain4j-ingest"
            - "--max-seconds=60"
          integration:
            file: "langchain4j-ingest/langchain4j-ingest-sink-filter-route.yaml"
            systemProperties:
              properties:
                - name: "report.url"
                  value: "${report.url}"

  # 1: the id misses the include patterns
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result/sink-filter"
          type: "plaintext"
          body:
            data: "@contains('documentId=notes.txt, segmentsWritten=0, outcome=FILTERED')@"
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # 2: the document is shorter than minDocumentSize
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result/sink-filter"
          type: "plaintext"
          body:
            data: "@contains('documentId=stub.md, segmentsWritten=0, outcome=FILTERED')@"
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"

  # 3: matching id, well-sized document
  - http:
      server: "httpServer"
      receiveRequest:
        POST:
          path: "/result/sink-filter"
          type: "plaintext"
          body:
            data: "@contains('documentId=camels.md, segmentsWritten=1, outcome=INGESTED')@"
  - http:
      server: "httpServer"
      sendResponse:
        response:
          status: 200
          reasonPhrase: "OK"
          version: "HTTP/1.1"
