# The tika action feeding the sink: an HTML document is parsed to plain text by
# Apache Tika in the action, then split and embedded by the sink. An INGESTED outcome (not EMPTY)
# proves the parse produced text; a failed parse would answer outcome=EMPTY.
- beans:
    - name: store
      type: dev.langchain4j.store.embedding.inmemory.InMemoryEmbeddingStore
    # a deterministic in-process stub model - the test asserts the parse and
    # pipeline mechanics, not embedding quality
    - name: model
      type: dev.langchain4j.model.embedding.EmbeddingModel
      scriptLanguage: groovy
      script: |
        def embed = { String text ->
            def random = new java.util.Random(text.hashCode())
            float[] vector = new float[8]
            for (int i = 0; i < 8; i++) {
                vector[i] = random.nextFloat()
            }
            return dev.langchain4j.data.embedding.Embedding.from(vector)
        }
        return [
            embedAll: { segments ->
                dev.langchain4j.model.output.Response.from(segments.collect { embed(it.text()) })
            }
        ] as dev.langchain4j.model.embedding.EmbeddingModel
- route:
    id: tika-extract-text-route
    from:
      uri: "timer:ingest"
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            constant: "<html><head><title>Secret</title></head><body><p>First paragraph about camels.</p></body></html>"
        - setHeader:
            name: "CamelLangChain4jIngestDocumentId"
            constant: "notice.html"
        - to: "kamelet:tika-extract-text-action"
        - to: "kamelet:langchain4j-ingest-sink?embeddingStore=#bean:store&embeddingModel=#bean:model"
        - log: "INGEST ${body}"
        - convertBodyTo:
            type: "java.lang.String"
        - to: "{{report.url}}"
