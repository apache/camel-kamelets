# The docling action feeding the sink, against the test's stubbed Docling Serve instance (the real
# image is a multi-gigabyte download): the action's own serve parameters point the
# Kamelet at the Citrus HTTP server, which answers markdown; an INGESTED
# outcome proves the converted markdown was split, embedded and stored.
- beans:
    - name: store
      type: dev.langchain4j.store.embedding.inmemory.InMemoryEmbeddingStore
    # a deterministic in-process stub model - the test asserts the conversion
    # and pipeline mechanics, not embedding quality
    - name: model
      type: dev.langchain4j.model.embedding.EmbeddingModel
      scriptLanguage: groovy
      script: |
        def embed = { String text ->
            def random = new java.util.Random(text.hashCode())
            float[] vector = new float[8]
            for (int i = 0; i < 8; i++) {
                vector[i] = random.nextFloat()
            }
            return dev.langchain4j.data.embedding.Embedding.from(vector)
        }
        return [
            embedAll: { segments ->
                dev.langchain4j.model.output.Response.from(segments.collect { embed(it.text()) })
            }
        ] as dev.langchain4j.model.embedding.EmbeddingModel
- route:
    id: docling-convert-route
    from:
      uri: "timer:ingest"
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            constant: "opaque binary payload, the stub answers regardless"
        - setHeader:
            name: "CamelLangChain4jIngestDocumentId"
            constant: "scan.pdf"
        - to: "kamelet:docling-convert-action?useDoclingServe=true&doclingServeUrl={{docling.serve.url}}"
        - to: "kamelet:langchain4j-ingest-sink?embeddingStore=#bean:store&embeddingModel=#bean:model"
        - log: "INGEST ${body}"
        - convertBodyTo:
            type: "java.lang.String"
        - to: "{{report.url}}"
