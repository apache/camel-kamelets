# The sink's filter passthrough: a non-matching id and a too-short document
# answer outcome=FILTERED, a matching well-sized one ingests. Three sequential
# sends give the test a deterministic report order.
- beans:
    - name: store
      type: dev.langchain4j.store.embedding.inmemory.InMemoryEmbeddingStore
    - name: model
      type: dev.langchain4j.model.embedding.EmbeddingModel
      scriptLanguage: groovy
      script: |
        def embed = { String text ->
            def random = new java.util.Random(text.hashCode())
            float[] vector = new float[8]
            for (int i = 0; i < 8; i++) {
                vector[i] = random.nextFloat()
            }
            return dev.langchain4j.data.embedding.Embedding.from(vector)
        }
        return [
            embedAll: { segments ->
                dev.langchain4j.model.output.Response.from(segments.collect { embed(it.text()) })
            }
        ] as dev.langchain4j.model.embedding.EmbeddingModel
- route:
    id: langchain4j-ingest-sink-filter-route
    from:
      uri: "timer:ingest"
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            constant: "A text file the id patterns must reject."
        - setHeader:
            name: "CamelLangChain4jIngestDocumentId"
            constant: "notes.txt"
        - to: "kamelet:langchain4j-ingest-sink?includeId=**/*.md,*.md&minDocumentSize=25&embeddingStore=#bean:store&embeddingModel=#bean:model"
        - log: "SINK-FILTER ${body}"
        - convertBodyTo:
            type: "java.lang.String"
        - to: "{{report.url}}"
        - setBody:
            constant: "stub"
        - setHeader:
            name: "CamelLangChain4jIngestDocumentId"
            constant: "stub.md"
        - to: "kamelet:langchain4j-ingest-sink?includeId=**/*.md,*.md&minDocumentSize=25&embeddingStore=#bean:store&embeddingModel=#bean:model"
        - log: "SINK-FILTER ${body}"
        - convertBodyTo:
            type: "java.lang.String"
        - to: "{{report.url}}"
        - setBody:
            constant: "Camels are resilient desert animals with two rows of eyelashes."
        - setHeader:
            name: "CamelLangChain4jIngestDocumentId"
            constant: "camels.md"
        - to: "kamelet:langchain4j-ingest-sink?includeId=**/*.md,*.md&minDocumentSize=25&embeddingStore=#bean:store&embeddingModel=#bean:model"
        - log: "SINK-FILTER ${body}"
        - convertBodyTo:
            type: "java.lang.String"
        - to: "{{report.url}}"
