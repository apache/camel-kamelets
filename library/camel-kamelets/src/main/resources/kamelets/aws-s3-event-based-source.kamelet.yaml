apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: aws-s3-event-based-source
  annotations:
    camel.apache.org/kamelet.support.level: Preview
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: >-
      data:image/svg+xml;base64,
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: AWS S3 Event-Based
    camel.apache.org/kamelet.namespace: "AWS"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "AWS S3 Event Based Source"
    description: |-
      Receives the events of an Amazon S3 bucket, such as a new or a deleted file, from the Amazon SQS queue that Amazon EventBridge sends them to, one message per event.

      Use it to react to new files in a bucket as soon as they arrive, without listing the bucket again and again, for example to process uploaded documents or imported data files. To read the files of a bucket by polling it, use `aws-s3-source`.

      Output: the body is the EventBridge event, as JSON text: `detail-type` says what happened (such as `Object Created` or `Object Deleted`), `detail.bucket.name` is the bucket and `detail.object.key` the key of the file. With `getObject` set to true, the event of a file uploaded with a simple upload (PutObject) carries the content of the file instead, as a stream, with the `CamelAwsS3ProducedBucketName` and `CamelAwsS3ProducedKey` headers; the other events then come as parsed JSON (a Jackson `JsonNode`).

      Good to know: it needs a setup in AWS. In the properties of the bucket, turn on sending events to Amazon EventBridge; then create an EventBridge rule for the events of source `aws.s3` and that bucket, with the queue as its target. Each event is deleted from the queue once it has been processed, unless `deleteAfterRead` is false; an event that fails stays in the queue and is received again when its visibility timeout (`visibilityTimeout`) ends. The files stay in the bucket. `getObject` skips files created by a multipart upload or a copy, and never connects through `uriEndpointOverride`. It logs in to the queue and, with `getObject`, to the bucket with `accessKey` and `secretKey`, or without keys, through the IAM role or the AWS profile of the environment, with `useDefaultCredentialsProvider` or `useProfileCredentialsProvider`. To reach AWS through an HTTP proxy, set `proxyHost` and `proxyPort`, and set `proxyProtocol` to `HTTP` for a proxy that takes plain HTTP, such as Squid.
    required:
      - queueNameOrArn
      - region
    type: object
    properties:
      queueNameOrArn:
        title: Queue Name
        description: The name of the SQS queue that the EventBridge rule sends the S3 events to, such as `s3-events`, or its ARN (Amazon Resource Name).
        example: s3-events
        type: string
      deleteAfterRead:
        title: Auto-delete Messages
        description: If true, each event is deleted from the queue once it has been processed. Set it to false to keep the events; they are then received again each time the visibility timeout of the queue ends.
        type: boolean
        default: true
      accessKey:
        title: Access Key
        description: The access key ID of an IAM user, which you create in the AWS console under IAM, Users, Security credentials. Use it together with `secretKey`. Leave both out when `useDefaultCredentialsProvider` or `useProfileCredentialsProvider` is true.
        type: string
        format: password
        x-descriptors:
          - 'urn:camel:group:credentials'
      secretKey:
        title: Secret Key
        description: The secret access key that belongs to `accessKey`. The AWS console shows it only once, when the access key is created.
        type: string
        format: password
        x-descriptors:
          - 'urn:camel:group:credentials'
      region:
        title: AWS Region
        description: The AWS region of the queue and the bucket, as a region code such as `eu-west-1` or `us-east-1`.
        example: eu-west-1
        type: string
        enum:
          - ap-south-1
          - eu-south-1
          - us-gov-east-1
          - me-central-1
          - ca-central-1
          - eu-central-1
          - us-iso-west-1
          - us-west-1
          - us-west-2
          - af-south-1
          - eu-north-1
          - eu-west-3
          - eu-west-2
          - eu-west-1
          - ap-northeast-3
          - ap-northeast-2
          - ap-northeast-1
          - me-south-1
          - sa-east-1
          - ap-east-1
          - cn-north-1
          - us-gov-west-1
          - ap-southeast-1
          - ap-southeast-2
          - us-iso-east-1
          - ap-southeast-3
          - us-east-1
          - us-east-2
          - cn-northwest-1
          - us-isob-east-1
          - aws-global
          - aws-cn-global
          - aws-us-gov-global
          - aws-iso-global
          - aws-iso-b-global
      autoCreateQueue:
        title: Autocreate Queue
        description: If true, the queue is created when it does not exist. A name that ends in `.fifo` creates a FIFO queue. The credentials need the permission to create queues.
        type: boolean
        default: false
      useDefaultCredentialsProvider:
        title: Default Credentials Provider
        description: "If true, the credentials are found in the environment instead of in `accessKey` and `secretKey`: the `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY` environment variables, the `~/.aws/credentials` file, or the IAM role of the EC2 instance, ECS task or Kubernetes pod the integration runs on."
        type: boolean
      useProfileCredentialsProvider:
        title: Profile Credentials Provider
        description: If true, the credentials are read from a named profile in the AWS credentials file (`~/.aws/credentials`), as the AWS CLI does. Name the profile in `profileCredentialsName`.
        type: boolean
      useSessionCredentials:
        title: Session Credentials
        description: "If true, it logs in with temporary credentials: `accessKey`, `secretKey` and `sessionToken`, such as the ones AWS STS gives when you assume an IAM role."
        type: boolean
      profileCredentialsName:
        title: Profile Credentials Name
        description: The name of the profile in the AWS credentials file. Only used when `useProfileCredentialsProvider` is true; when it is not set, the default profile is used.
        example: production
        type: string
        pattern: "^[A-Za-z0-9_.@-]+$"
      sessionToken:
        title: Session Token
        description: The session token of temporary credentials, which comes with their access key and secret key, for example from AWS STS when you assume an IAM role. Only used when `useSessionCredentials` is true.
        type: string
        format: password
        x-descriptors:
          - 'urn:camel:group:credentials'
      amazonAWSHost:
        title: AWS Host
        description: The host name of AWS. Leave it as `amazonaws.com` for AWS. Any other value is the address to connect to instead, as `host:port`, together with `protocol`; `uriEndpointOverride` does the same.
        type: string
        default: amazonaws.com
      protocol:
        title: Protocol
        description: "`https` or `http`. Only used when `amazonAWSHost` is not `amazonaws.com`."
        type: string
        example: http
        default: https
      queueURL:
        title: Queue URL
        description: The full address of the queue, as the SQS console shows it. When it is set, it is used as it is, and the queue is not looked up by name.
        example: https://sqs.eu-west-1.amazonaws.com/123456789012/s3-events
        type: string
      uriEndpointOverride:
        title: Overwrite Endpoint URI
        description: The address to connect to instead of AWS, as a URL such as `http://localhost:4566` for LocalStack. Only used when `overrideEndpoint` is true.
        example: http://localhost:4566
        type: string
      overrideEndpoint:
        title: Endpoint Overwrite
        description: If true, it connects to the address in `uriEndpointOverride` instead of to SQS. Use it for a local stand-in of AWS such as LocalStack.
        type: boolean
        default: false
      delay:
        title: Delay
        description: How long to wait between two polls of the queue, in milliseconds.
        type: integer
        default: 500
      greedy:
        title: Greedy Scheduler
        description: If true, it polls again right away when the last poll received messages, instead of waiting for `delay`.
        type: boolean
        default: false
      maxMessagesPerPoll:
        title: Max Messages Per Poll
        description: The most events to receive in one request to SQS, from 1 to 10. SQS may return fewer. When it is not set, it is 10.
        type: integer
        minimum: "1"
        maximum: "10"
        example: 5
      waitTimeSeconds:
        title: Wait Time
        description: How long one request waits for an event to arrive when the queue is empty, in seconds, from 0 to 20 (long polling). It saves requests, and so cost, on a queue that is often empty. When it is not set, the wait time of the queue is used.
        example: 20
        type: integer
        minimum: "0"
        maximum: "20"
      visibilityTimeout:
        title: Visibility Timeout
        description: How long a received event stays hidden from other readers, in seconds. If it is not deleted by then, it is received again. Set it longer than processing one event takes, such as fetching a large file with `getObject`. When it is not set, the visibility timeout of the queue is used (30 seconds for a new queue).
        example: 120
        type: integer
        minimum: "0"
      getObject:
        title: Get Object
        description: If true, for an event of a file uploaded with a simple upload (PutObject), it fetches the file and sends its content instead of the event. It connects to S3 with the same credentials as the queue and with `region`, not with `uriEndpointOverride`.
        type: boolean
        default: false
      proxyHost:
        title: Proxy Host
        description: The host name or IP address of an HTTP proxy to send the calls to AWS through, such as the proxy of a company network. Used only together with `proxyPort`. When it is not set, the calls go straight to AWS.
        type: string
        pattern: "^[A-Za-z0-9._-]+$"
        example: proxy.example.com
      proxyPort:
        title: Proxy Port
        description: The port of the proxy in `proxyHost`, such as `3128` for Squid. Used only together with `proxyHost`.
        type: integer
        example: 3128
      proxyProtocol:
        title: Proxy Protocol
        description: "How to talk to the proxy itself: `HTTP` or `HTTPS`. It is not the protocol of the calls to AWS, which stay encrypted, as the proxy only passes them on. When it is not set, it is `HTTPS`, which needs a proxy that takes TLS connections. Most company proxies, such as Squid, take plain HTTP: set `HTTP` for them. With the wrong one, every call fails, for example with `Unsupported or unrecognized SSL message`."
        type: string
        enum: ["HTTP", "HTTPS"]
        example: HTTP
  dataTypes:
    out:
      headers:
        CamelAwsSqsMessageId:
          title: SQS Message ID
          description: The ID of the SQS message that carried the event.
          type: string
        CamelAwsS3ProducedBucketName:
          title: Bucket Name
          description: The bucket of the file. Only set when `getObject` is true and the file was fetched.
          type: string
        CamelAwsS3ProducedKey:
          title: Key
          description: The key (the path in the bucket) of the file. Only set when `getObject` is true and the file was fetched.
          type: string
  dependencies:
    - 'camel:aws2-sqs'
    - 'camel:aws2-s3'
    - 'camel:jsonpath'
    - 'camel:kamelet'
    - 'camel:jackson3'
  template:
    from:
      uri: aws2-sqs
      parameters:
        queueNameOrArn: "{{queueNameOrArn}}"
        accessKey: "RAW({{?accessKey}})"
        amazonAWSHost: "{{?amazonAWSHost}}"
        autoCreateQueue: "{{autoCreateQueue}}"
        delay: "{{delay}}"
        deleteAfterRead: "{{deleteAfterRead}}"
        greedy: "{{greedy}}"
        overrideEndpoint: "{{overrideEndpoint}}"
        protocol: "{{?protocol}}"
        queueUrl: "{{?queueURL}}"
        region: "{{region}}"
        secretKey: "RAW({{?secretKey}})"
        uriEndpointOverride: "{{?uriEndpointOverride}}"
        useDefaultCredentialsProvider: "{{?useDefaultCredentialsProvider}}"
        useProfileCredentialsProvider: "{{?useProfileCredentialsProvider}}"
        profileCredentialsName: "{{?profileCredentialsName}}"
        useSessionCredentials: "{{?useSessionCredentials}}"
        sessionToken: "RAW({{?sessionToken}})"
        proxyHost: "{{?proxyHost}}"
        proxyPort: "{{?proxyPort}}"
        proxyProtocol: "{{?proxyProtocol}}"
        maxMessagesPerPoll: "{{?maxMessagesPerPoll}}"
        waitTimeSeconds: "{{?waitTimeSeconds}}"
        visibilityTimeout: "{{?visibilityTimeout}}"
      steps:
        - choice:
            precondition: true
            when:
              - expression:
                  simple:
                    expression: "${properties:getObject:false}"
                steps:
                  - unmarshal:
                      json:
                        unmarshalType: tools.jackson.databind.JsonNode
                  - setProperty:
                      name: s3-event-name
                      expression:
                        jsonpath:
                          expression: "$.detail.reason"
                  - choice:
                      when:
                        - expression:
                            simple:
                              expression: "${exchangeProperty.s3-event-name} == \"PutObject\""
                          steps:
                            - setProperty:
                                name: aws-s3-name
                                expression:
                                  jsonpath:
                                    expression: "$.detail.object.key"
                            - setProperty:
                                name: aws-s3-bucket
                                expression:
                                  jsonpath:
                                    expression: "$.detail.bucket.name"
                            - choice:
                                when:
                                  - expression:
                                      simple:
                                        expression: "${exchangeProperty.aws-s3-bucket} regex '[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]'"
                                    steps:
                                      # the S3 call takes the bucket and the key of the event, and no other header
                                      - removeHeaders:
                                          pattern: "CamelAwsS3*"
                                      - setHeader:
                                          name: CamelAwsS3Key
                                          expression:
                                            simple:
                                              expression: "${exchangeProperty.aws-s3-name}"
                                      - toD:
                                          uri: "aws2-s3:${exchangeProperty.aws-s3-bucket}?accessKey=RAW({{?accessKey}})&secretKey=RAW({{?secretKey}})&region={{region}}&operation=getObject&useDefaultCredentialsProvider={{?useDefaultCredentialsProvider}}&useProfileCredentialsProvider={{?useProfileCredentialsProvider}}&profileCredentialsName={{?profileCredentialsName}}&useSessionCredentials={{?useSessionCredentials}}&sessionToken=RAW({{?sessionToken}})&proxyHost={{?proxyHost}}&proxyPort={{?proxyPort}}&proxyProtocol={{?proxyProtocol}}"
                                      - removeHeader:
                                          name: CamelAwsS3Key
        - to:
            uri: kamelet:sink

