apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: earthquake-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Earthquake"
    camel.apache.org/kamelet.namespace: "Dataset"
  labels:
    camel.apache.org/kamelet.type: "source"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "Earthquake Source"
    description: |-
      Sends a message for each earthquake reported by the USGS (United States Geological Survey), checking for new reports at a regular interval.

      Use it to follow the earthquakes around the world, for example to alert on the strong ones, or as a stream of real, changing JSON data for a demo. No account is needed.

      Output: one message per earthquake. The body is a GeoJSON feature, as JSON text: `properties` has the magnitude (`mag`), the place, the time and a link to the USGS page, and `geometry` has the longitude, the latitude and the depth. The `Content-Type` header is `application/json`.

      Good to know: the first check sends the earthquakes whose report was updated in the last `lookAhead` minutes, and each later check those updated since the check before. An earthquake is sent again when USGS updates its report. The time of the last check is kept in memory only, so a restart begins again with the last `lookAhead` minutes. It calls `https://earthquake.usgs.gov` over the internet.
    type: object
    properties:
      period:
        title: Period
        description: "How long to wait between two checks for new reports, in milliseconds. For example, 300000 is five minutes."
        type: integer
        default: 60000
        example: 300000
      lookAhead:
        title: Minutes to Look Back
        description: "When the integration starts, how many minutes back to look for earthquake reports. For example, 1440 first sends the reports of the last day."
        type: integer
        default: 120
        example: 1440
  types:
    out:
      mediaType: application/json
  dependencies:
    - "camel:caffeine"
    - "camel:http"
    - "camel:kamelet"
    - "camel:jackson"
    - "camel:jsonpath"
    - "camel:timer"
  template:
    from:
      uri: timer
      parameters:
        timerName: earthquake
        period: "{{period}}"
      steps:
        - setHeader:
            name: CamelCaffeineAction
            expression:
              constant:
                expression: GET
        - toD:
            uri: caffeine-cache
            parameters:
              cacheName: "cache-${routeId}"
              key: lastUpdate
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header.CamelCaffeineActionHasResult}"
                steps:
                  - setProperty:
                      name: lastUpdate
                      expression:
                        simple:
                          expression: "${body}"
            otherwise:
              steps:
                - setProperty:
                    name: lastUpdate
                    expression:
                      simple:
                        expression: "${date-with-timezone:now-{{lookAhead}}m:UTC:yyyy-MM-dd'T'HH:mm:ss.SSS}"
        - setHeader:
            name: CamelHttpMethod
            expression:
              constant:
                expression: GET
        - toD:
            uri: https
            parameters:
              httpUri: earthquake.usgs.gov/fdsnws/event/1/query
              format: geojson
              orderby: time-asc
              updatedafter: "${exchangeProperty.lastUpdate}"
        - removeHeader:
            name: CamelHttpMethod
        - unmarshal:
            json: {}
        - setProperty:
            name: generated
            expression:
              simple:
                expression: "${body[metadata][generated]}"
        - setProperty:
            name: lastUpdate
            expression:
              simple:
                expression: "${date-with-timezone:exchangeProperty.generated:UTC:yyyy-MM-dd'T'HH:mm:ss.SSS}"
        - claimCheck:
            operation: Push
        - setBody:
            expression:
              exchangeProperty:
                expression: lastUpdate
        - setHeader:
            name: CamelCaffeineAction
            expression:
              constant:
                expression: PUT
        - toD:
            uri: caffeine-cache
            parameters:
              cacheName: "cache-${routeId}"
              key: lastUpdate
        - claimCheck:
            operation: Pop
        - split:
            expression:
              jsonpath:
                expression: "$.features[*]"
            steps:
              - marshal:
                  json: {}
              - to:
                  uri: kamelet:sink
