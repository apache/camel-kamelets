apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: aws-redshift-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "AWS Redshift"
    camel.apache.org/kamelet.namespace: "AWS"
  labels:
    camel.apache.org/kamelet.type: "sink"
spec:
  definition:
    title: "AWS Redshift Sink"
    description: |-
      Runs an SQL statement, such as an INSERT, on an Amazon Redshift database for each message, with the values taken from the JSON body.

      Use it to load events or records, such as orders or page views, into a table of a Redshift data warehouse, or to update rows when something changes. To read rows from Redshift, use `aws-redshift-source`.

      Input: the body is a JSON object, as JSON text, such as `{"username":"alice","city":"Rome"}`. Each `:#name` in `query` takes the value of the field with that name, else of the header with that name. The statement runs once per message.

      Output: when it is used inside a route, the body afterwards is the JSON object parsed as a Map, and the `CamelSqlUpdateCount` header holds the number of rows changed.

      Good to know: a body that is not a JSON object fails, and so does a body that lacks a field named in `query` when no header has that name either. It logs in with a database user and password, not with AWS keys, and connects with the Amazon Redshift JDBC driver, which uses TLS by default. Other settings of the driver go in `connectionProperties`.
    required:
      - serverName
      - username
      - password
      - query
      - databaseName
    type: object
    properties:
      serverName:
        title: Server Name
        description: "The host name of the Redshift cluster: its endpoint, as shown in the Redshift console, without the port and the database name."
        type: string
        example: my-cluster.abc123xyz789.eu-west-1.redshift.amazonaws.com
      serverPort:
        title: Server Port
        description: The port of the cluster. Redshift uses 5439 unless it was changed when the cluster was created.
        type: string
        default: 5439
      username:
        title: Username
        description: The database user to log in as, such as the admin user of the cluster. This is a user of the database, not an AWS access key.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      password:
        title: Password
        description: The password of `username`, set when the cluster or the user was created.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      query:
        title: Query
        description: The SQL statement to run for each message. Write `:#name` where the value of the field `name` of the body goes; the values are passed as parameters, never pasted into the SQL text.
        type: string
        example: 'INSERT INTO accounts (username,city) VALUES (:#username,:#city)'
      databaseName:
        title: Database Name
        description: The name of the database in the cluster, such as `dev`, the database a new cluster has.
        type: string
        example: dev
      connectionProperties:
        title: Connection Properties
        description: "Extra settings for the Amazon Redshift JDBC driver, as `name=value` pairs separated by `;`, such as `loginTimeout=30`. When it is not set, the driver connects with TLS, as it does by default. The value is not hidden like a password, and it can show in the log when the integration starts, so do not put a password in it."
        type: string
        example: loginTimeout=30
      maxTotal:
        title: Max Connections
        description: The most connections to the database that the Kamelet opens at the same time. When all of them are in use, the next message waits for one to be free, as long as `maxWaitMillis` allows. When it is not set, the limit is 8.
        type: integer
        example: 20
      maxIdle:
        title: Max Idle Connections
        description: The most unused connections to keep open for later. A connection that is given back when this many are unused already is closed. When it is not set, up to 8 are kept open.
        type: integer
        example: 2
      maxWaitMillis:
        title: Max Wait
        description: How long to wait for a free connection when `maxTotal` connections are in use, in milliseconds. After that, the message fails. When it is not set, it waits as long as it takes.
        type: integer
        example: 5000
  types:
    in:
      mediaType: application/json
  dataTypes:
    out:
      headers:
        CamelSqlUpdateCount:
          title: Update Count
          description: The number of rows the statement changed.
          type: integer
  dependencies:
  - "camel:jackson3"
  - "camel:kamelet"
  - "camel:sql"
  - "mvn:com.amazon.redshift:redshift-jdbc42:2.3.0"
  - "mvn:org.apache.commons:commons-dbcp2:2.14.0"
  template:
    beans:
      - name: local-sql-redshift-sink
        type: "#class:org.apache.camel.component.sql.SqlComponent"
        properties:
          autowiredEnabled: "false"
      - name: dsBean
        type: "#class:org.apache.commons.dbcp2.BasicDataSource"
        properties:
          username: "{{username}}"
          password: "{{password}}"
          url: "jdbc:redshift://{{serverName}}:{{serverPort}}/{{databaseName}}"
          driverClassName: com.amazon.redshift.jdbc.Driver
          connectionProperties: "{{?connectionProperties}}"
          maxTotal: "{{?maxTotal}}"
          maxIdle: "{{?maxIdle}}"
          maxWaitMillis: "{{?maxWaitMillis}}"
    from:
      uri: kamelet:source
      steps:
        - unmarshal:
            json: {}
        - removeHeader:
            name: CamelSqlQuery
        - removeHeader:
            name: CamelSqlParameters
        - to:
            uri: "{{local-sql-redshift-sink}}:{{query}}?dataSource=#bean:{{dsBean}}"
