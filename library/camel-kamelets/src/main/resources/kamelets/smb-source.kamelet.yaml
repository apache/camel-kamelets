apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: smb-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "SMB"
    camel.apache.org/kamelet.namespace: "File"
  labels:
    camel.apache.org/kamelet.type: "source"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "SMB Source"
    description: |-
      Reads the files in a directory of a Windows or Samba file share (SMB), one message per file, and by default leaves them on the share.

      Use it to collect the files that another system drops on a Windows file server or a NAS, such as orders, invoices or exports, from a share such as `\\fileserver\exports`. To write files to a share use `smb-sink`. For an FTP or SFTP server use `ftp-source` or `sftp-source`.

      Output: the body is the content of the file, as bytes, or as a stream when `streamDownload` is true. `Content-Type` is `application/octet-stream`. The `file` and `ce-file` headers hold the name of the file, with its path below `directoryName` when `recursive` is true, such as `2026/orders.csv`. `CamelFileName` holds the same name, `CamelFileLength` the size of the file in bytes, `CamelFileLastModified` the time the file was last changed, in milliseconds since 1970, and `CamelSmbUncPath` the full Windows path of the file, such as `\\fileserver\exports\orders\orders.csv`.

      Good to know: files are not deleted or moved after they are read, unless `delete` is true or `move` is set. A file is read only once while the integration runs (`idempotent`), but the files left on the share are all read again after a restart; to read each file only once, also across restarts, set `move` to a directory such as `.done`, set `delete` to true, or keep the list of the files read in a file with `idempotentRepository`. To read only some of the files, set `include`, `exclude` or `antInclude`. To leave a file alone while another program is still writing it, set `readLock`. Log in with `username` and `password`. When the server cannot be reached or the login fails, the poll is skipped with a warning in the log, and tried again at the next poll. The content of the files is not encrypted on the network, and a share that requires encryption refuses the connection.
    required:
      - connectionHost
      - shareName
      - directoryName
      - username
      - password
    type: object
    properties:
      connectionHost:
        title: Connection Host
        description: The host name or IP address of the SMB server, without `smb://`, without `\\` and without a port.
        type: string
        example: fileserver.example.com
      connectionPort:
        title: Connection Port
        description: The port of the SMB server, usually 445.
        type: integer
        default: 445
      shareName:
        title: Share Name
        description: The name of the share, as the server shares it, such as `exports` for `\\fileserver\exports`.
        type: string
        example: exports
      directoryName:
        title: Directory Name
        description: The directory within the share to read the files from, with `/` between its parts, such as `outgoing/orders`. Use `/` to read the files at the top of the share; the names in the file headers then start with `/`, such as `/orders.csv`.
        type: string
        example: outgoing/orders
      username:
        title: Username
        description: The user to log in to the SMB server as, without the domain, such as `jdoe`.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      password:
        title: Password
        description: The password of `username`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      domain:
        title: Domain
        description: The Windows domain of `username`, such as `CORP` for the account `CORP\jdoe`. Leave it unset for a user of the server itself.
        type: string
        example: CORP
      recursive:
        title: Recursive
        description: If true, the files in the subdirectories of `directoryName` are read too.
        type: boolean
        default: false
      idempotent:
        title: Skip Files Already Read
        description: If true, a file is read only once while the integration runs, even when it stays on the share. The list of the files read is kept in memory, so after a restart the files still on the share are read again, unless `move` or `delete` takes them away, or `idempotentRepository` keeps the list elsewhere. If false, and neither `delete` nor `move` is set, the same files are read again on every poll.
        type: boolean
        default: true
      idempotentRepository:
        title: Files Read Store
        description: The name of a bean that keeps the list of the files read, so that the files left on the share are not read again after a restart, such as a `FileIdempotentRepository` that keeps the list in a file. Declare the bean in the integration, for example under `beans` in YAML. Only used when `idempotent` is true. When it is not set, the list is kept in memory.
        type: string
        example: readFiles
      autoCreate:
        title: Autocreate Missing Directories
        description: If true, `directoryName` is created on the share when it does not exist.
        type: boolean
        default: true
      delete:
        title: Delete
        description: If true, each file is deleted from the share once it has been read and handed on successfully. Use it to read each file only once, also across restarts. To keep the files, set `move` instead.
        type: boolean
        default: false
      move:
        title: Move After Read
        description: Where to move each file on the share once it has been read and handed on successfully, so that it is not read again, also after a restart. A directory name, such as `.done`, is relative to the directory of the file. A path that ends with the name of the file, such as `done/$\{date:now:yyyyMMdd}/$\{file:name}`, is relative to `directoryName`, where `$\{file:name}` is the name of the file, with its path below `directoryName`, and `$\{date:now:yyyyMMdd}` today's date. A directory whose name starts with a dot is never read, which matters when `recursive` is true. Missing directories are created, so `username` must be allowed to create directories and to rename files. When it is not set, files stay where they are. When `delete` is true too, the file is deleted and `move` is not used.
        type: string
        example: ".done"
      moveFailed:
        title: Move Failed Files To
        description: Where to move a file on the share when it could not be handed on, for example because the next step failed, so that it is not read over and over. The same format as `move`, such as `.error`. When it is not set, a file that fails stays where it is and is read again at every poll. It can be set together with `delete` or `move`.
        type: string
        example: ".error"
      preMove:
        title: Move Before Read
        description: Where to move each file on the share before it is read, so that another reader of the same directory does not take it too. The same format as `move`, such as `.inprogress`, a directory next to the file. `move`, `moveFailed` and `delete` then act on the file in its new place, so with `move` set to `.done` the file ends up in `.inprogress/.done`. When it is not set, a file is read where it is.
        type: string
        example: ".inprogress"
      include:
        title: Include Files
        description: A regular expression that the name of a file must match to be read, such as `.*\.csv` for the CSV files. The whole name must match, upper and lower case count as the same, and only the name is matched, not its directory. The other files stay on the share. When it is not set, all the files are read.
        type: string
        example: '.*\.csv'
      exclude:
        title: Exclude Files
        description: A regular expression for the names of the files not to read, such as `.*\.(tmp|part)`. The whole name must match, upper and lower case count as the same, and only the name is matched, not its directory. A file it matches is not read, even when `include` or `antInclude` matches it too.
        type: string
        example: '.*\.(tmp|part)'
      antInclude:
        title: Include Files (Wildcards)
        description: Wildcard patterns, separated by commas, that the path of a file must match to be read, such as `*.csv,*.xml`. The path is relative to `directoryName`, such as `2026/orders.csv` when `recursive` is true. `*` matches any part of a name and `**` any number of directories, so `**/*.csv` matches the CSV files in `directoryName` and in its subdirectories. Upper and lower case differ. When it is not set, all the files are read.
        type: string
        example: '**/*.csv'
      readLock:
        title: Wait Until Written
        description: How to make sure that another program has finished writing a file before it is read. `changed` reads a file once its size and modification time have not changed between two checks 1 second apart, or, with `readLockMinAge`, once the file is that old. A file still changing after 10 seconds is skipped until the next poll, and while a file is checked the other files wait. `changed` never reads an empty file. `rename` reads a file once it can be renamed. `none` reads the files as they are. When it is not set, `none`.
        type: string
        enum: ["none", "changed", "rename"]
        example: changed
      readLockMinAge:
        title: Minimum File Age
        description: 'Only used when `readLock` is `changed`: how old a file must be, in milliseconds, before it is read, counted from its modification time on the share. For example, 60000 leaves a file alone until it has not been changed for one minute. A file that is not old enough is skipped until the next poll, after 10 seconds of checks. The clocks of the server and of the integration must agree.'
        type: integer
        example: 60000
      delay:
        title: Poll Interval
        description: How long to wait between two polls of the directory, in milliseconds. For example, 60000 polls once a minute. When it is not set, 500.
        type: integer
        example: 60000
      maxMessagesPerPoll:
        title: Max Files Per Poll
        description: The largest number of files to read in one poll, such as 100. The other files are read at the next polls. The poll takes the first files the server lists, and `sortBy` sorts only these. When it is not set, or 0, all the files found are read.
        type: integer
        example: 100
      sortBy:
        title: Sort By
        description: The order in which the files of a poll are read. `file:name` sorts them by name, `file:modified` by modification time and `file:length` by size, from the smallest. When it is not set, the files are read in the order the server lists them.
        type: string
        enum: ["file:name", "file:modified", "file:length"]
        example: file:modified
      streamDownload:
        title: Stream Download
        description: 'If true, each file is read from the share while it is handed on, instead of being read into memory first, and the body is a stream. Use it for files too large for memory. It saves memory only when the integration does not keep the stream in memory either: set `camel.main.streamCachingSpoolEnabled=true`, which writes large bodies to a temporary file, or turn stream caching off. When it is not set, false.'
        type: boolean
  dataTypes:
    out:
      default: binary
      headers:
        file:
          title: File Name
          description: The name of the file, with its path below `directoryName` when `recursive` is true, such as `2026/orders.csv`.
          type: string
        ce-file:
          title: File Name (CloudEvents)
          description: The same value as `file`.
          type: string
        CamelFileName:
          title: Camel File Name
          description: The same value as `file`.
          type: string
        CamelFileLength:
          title: File Size
          description: The size of the file, in bytes.
          type: integer
        CamelFileLastModified:
          title: Last Modified
          description: The time the file was last changed, in milliseconds since 1970-01-01 UTC.
          type: integer
        CamelSmbUncPath:
          title: UNC Path
          description: The full Windows path of the file, with the server and the share, such as `\\fileserver\exports\orders\orders.csv`.
          type: string
      types:
        binary:
          format: "application-octet-stream"
          description: The content of the file as it is, with `Content-Type` set to `application/octet-stream`. A stream stays a stream, so `streamDownload` still reads a large file without holding it in memory.
          mediaType: application/octet-stream
  dependencies:
    - "camel:smb"
    - "camel:kamelet"
  template:
    from:
      uri: smb
      parameters:
        hostname: "{{connectionHost}}"
        port: "{{connectionPort}}"
        shareName: "{{shareName}}"
        path: "{{directoryName}}"
        antInclude: "RAW({{?antInclude}})"
        autoCreate: "{{autoCreate}}"
        delay: "{{?delay}}"
        delete: "{{delete}}"
        domain: "RAW({{?domain}})"
        exclude: "RAW({{?exclude}})"
        idempotent: "{{idempotent}}"
        idempotentRepository: "#bean:{{?idempotentRepository}}"
        include: "RAW({{?include}})"
        maxMessagesPerPoll: "{{?maxMessagesPerPoll}}"
        move: "{{?move}}"
        moveFailed: "{{?moveFailed}}"
        password: "RAW({{?password}})"
        preMove: "{{?preMove}}"
        readLock: "{{?readLock}}"
        readLockMinAge: "{{?readLockMinAge}}"
        recursive: "{{recursive}}"
        sortBy: "RAW({{?sortBy}})"
        streamDownload: "{{?streamDownload}}"
        username: "RAW({{?username}})"
      steps:
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${body} is 'org.apache.camel.component.file.GenericFile'"
                steps:
                  - setBody:
                      expression:
                        simple:
                          expression: "${body.getBody()}"
        - setHeader:
            name: file
            expression:
              simple:
                expression: "${header[CamelFileName]}"
        - setHeader:
            name: ce-file
            expression:
              simple:
                expression: "${header[CamelFileName]}"
        - to:
            uri: kamelet:sink
