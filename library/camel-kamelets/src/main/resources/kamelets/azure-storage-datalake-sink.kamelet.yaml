apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: azure-storage-datalake-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Azure Storage Blob Data Lake"
    camel.apache.org/kamelet.namespace: "Azure"
  labels:
    camel.apache.org/kamelet.type: "sink"
spec:
  definition:
    title: "Azure Storage Blob Data Lake Sink"
    description: |-
      Uploads each message as a file to a file system in Azure Data Lake Storage Gen2, named after the `file` header.

      Use it to land data for analytics, such as exports, events or reports, in a data lake. For plain blob containers, use `azure-storage-blob-sink`.

      Input: the body is the content of the file: text, bytes or a stream. Text is turned into bytes before the upload, and the `Content-Type` header is set to `application/octet-stream`. A file is passed on as it is, and so is a stream, unless stream caching is turned off. A Map fails: turn it into JSON text first, for example with `json-serialize-action`. The optional `file` header (or `ce-file`) is the name of the file, such as `sales-2026-05.csv`. Without it, the file gets a generated unique name.

      Output: the body afterwards is `true`, and the `Content-Type` header is `application/octet-stream`.

      Good to know: the file is written at the top of the file system, or in `directoryName`. By default it logs in as an app registration, with `clientId`, `clientSecret` and `tenantId`, so that app needs a role on the account that allows writing, such as Storage Blob Data Contributor. Headers that start with `CamelAzureStorageDataLake` are removed from the message first, so they cannot change what the Kamelet does. It can log in with an account key (`accountKey`) or a SAS token (`sasSignature`) instead.
    required:
      - accountName
      - fileSystemName
    type: object
    properties:
      accountName:
        title: Account Name
        description: The name of the storage account, an Azure Data Lake Storage Gen2 account (a storage account with hierarchical namespace), as shown in the Azure portal under Storage accounts.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
        example: mydatalake
      clientId:
        title: Client ID
        description: The application (client) ID of an app registration (service principal) in Microsoft Entra ID that has access to the account, from the Overview page of the app registration in the Azure portal. Required when `credentialType` is `CLIENT_SECRET`, the default.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      clientSecret:
        title: Client Secret
        description: "A client secret of the app registration, from the Azure portal: the app registration, then Certificates & secrets. Required when `credentialType` is `CLIENT_SECRET`, the default."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      tenantId:
        title: Tenant ID
        description: The directory (tenant) ID of the app registration, from its Overview page in the Azure portal. Required when `credentialType` is `CLIENT_SECRET`, the default.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      fileSystemName:
        title: File System Name
        description: The name of the file system (the container) in the account to write the files to.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
        example: raw-data
      credentialType:
        title: Credential Type
        description: How to log in to the account. `CLIENT_SECRET`, the default, uses `clientId`, `clientSecret` and `tenantId`. `AZURE_IDENTITY` uses the Azure identity of the environment, such as the `AZURE_CLIENT_ID`, `AZURE_TENANT_ID` and `AZURE_CLIENT_SECRET` environment variables, a managed identity or the Azure CLI login. The other values need a credential object, such as a `DataLakeServiceClient` for `SERVICE_CLIENT_INSTANCE`, in the application.
        type: string
        default: "CLIENT_SECRET"
        enum: ["CLIENT_SECRET", "SHARED_KEY_CREDENTIAL", "AZURE_IDENTITY", "AZURE_SAS", "SERVICE_CLIENT_INSTANCE"]
      accountKey:
        title: Account Key
        description: "An access key of the storage account, from the Azure portal: the storage account, then Security + networking, then Access keys. Used when `credentialType` is `SHARED_KEY_CREDENTIAL`."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      sasSignature:
        title: SAS Token
        description: "A shared access signature (SAS) token that gives access to the account or the file system, such as `sv=2022-11-02&ss=b&srt=co&sp=rwc&se=2026-12-31T00:00:00Z&sig=...`, without a leading `?`. Create it in the Azure portal under Shared access signature of the storage account, or under Shared access tokens of the container. It must allow creating and writing. Used when `credentialType` is `AZURE_SAS`."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      directoryName:
        title: Directory Name
        description: The directory of the file system to write the files to, such as `exports/2026`, without a `/` at the start or the end. The name of each file is put after it, so the `file` header `sales.csv` is written as `exports/2026/sales.csv`, and `2026/q1.csv` as `exports/2026/2026/q1.csv`. When it is not set, the files are written at the top of the file system.
        type: string
        example: exports/2026
        pattern: "^[^/'$?#]([^'$?#]*[^/'$?#])?$"
  dataTypes:
    in:
      default: binary
      types:
        binary:
          format: "application-octet-stream"
          description: "The content of the file, as bytes. A file, and a stream while stream caching is on, are passed on as they are."
          mediaType: application/octet-stream
      headers:
        file:
          title: File Name
          description: "The name of the file, such as `sales-2026-05.csv`. Optional: without it (and without `ce-file`), the file gets a generated unique name."
          type: string
        ce-file:
          title: File Name
          description: The name of the file, as a CloudEvents extension. Used when `file` is not set.
          type: string
  dependencies:
    - "camel:azure-storage-datalake"
    - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: CamelAzureStorageDataLake*
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[file]}"
                steps:
                  - setHeader:
                      name: CamelAzureStorageDataLakeFileName
                      expression:
                        simple:
                          expression: "${header[file]}"
              - expression:
                  simple:
                    expression: "${header[ce-file]}"
                steps:
                  - setHeader:
                      name: CamelAzureStorageDataLakeFileName
                      expression:
                        simple:
                          expression: "${header[ce-file]}"
            otherwise:
              steps:
                - setHeader:
                    name: CamelAzureStorageDataLakeFileName
                    expression:
                      simple:
                        expression: "${exchangeId}"
        - choice:
            when:
              - expression:
                  simple:
                    expression: "'{{?directoryName}}' != ''"
                steps:
                  - setHeader:
                      name: CamelAzureStorageDataLakeFileName
                      expression:
                        simple:
                          expression: "{{?directoryName}}/${header[CamelAzureStorageDataLakeFileName]}"
        - to:
            uri: azure-storage-datalake
            parameters:
              accountName: "{{accountName}}"
              fileSystemName: "{{fileSystemName}}"
              clientId: "RAW({{?clientId}})"
              clientSecret: "RAW({{?clientSecret}})"
              credentialType: "{{credentialType}}"
              operation: upload
              tenantId: "RAW({{?tenantId}})"
              accountKey: "RAW({{?accountKey}})"
              sasSignature: "RAW({{?sasSignature}})"
