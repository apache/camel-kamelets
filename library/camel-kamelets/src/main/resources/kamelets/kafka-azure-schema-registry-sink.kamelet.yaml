apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: kafka-azure-schema-registry-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Kafka"
    camel.apache.org/kamelet.namespace: "Kafka"
  labels:
    camel.apache.org/kamelet.type: "sink"
spec:
  definition:
    title: "Azure Kafka through Eventhubs with Azure Schema Registry Sink"
    description: |-
      Sends each message as an Avro record to an event hub in Azure Event Hubs, through its Kafka interface, with the schema kept in Azure Schema Registry.

      Use it to publish Avro records to Azure Event Hubs for applications that read them with the schema of the registry. For event hubs without a schema use `azure-eventhubs-sink`; for Apicurio Registry use `kafka-apicurio-registry-not-secured-sink`.

      Input: the body must be an Avro object, such as an object of the class named in `specificAvroValueType`; it is written as Avro binary. The optional `key` header (or `ce-key`) becomes the key of the record, and the optional `partition-key` header (or `ce-partitionkey`) is the number of the partition to write to. The other headers of the message, except the Camel ones, are sent as record headers.

      Output: the message is unchanged.

      Good to know: it logs in to Event Hubs with the connection string in `password`, and to the schema registry with the Azure credentials of the environment the integration runs in, such as the `AZURE_CLIENT_ID`, `AZURE_TENANT_ID` and `AZURE_CLIENT_SECRET` environment variables of a service principal, or a managed identity. The schemas must be in a schema group named `avro`.
    required:
      - topic
      - bootstrapServers
      - azureRegistryUrl
      - password
    type: object
    properties:
      topic:
        title: Event Hub Name
        description: "The name of the event hub to write the records to, which Kafka calls the topic."
        type: string
        example: "orders"
      bootstrapServers:
        title: Bootstrap Servers
        description: "The Kafka address of the Event Hubs namespace, as `<namespace>.servicebus.windows.net:9093`."
        type: string
        example: "my-namespace.servicebus.windows.net:9093"
      securityProtocol:
        title: Security Protocol
        description: "How to connect to Event Hubs. Keep the default `SASL_SSL`, a login over TLS, which Event Hubs requires. The other values are `SASL_PLAINTEXT`, `PLAINTEXT` and `SSL`."
        type: string
        default: SASL_SSL
      saslMechanism:
        title: SASL Mechanism
        description: "The login method. Keep the default `PLAIN`, which the login with the connection string in `password` needs."
        type: string
        default: PLAIN
      password:
        title: Connection String
        description: "The connection string of the Event Hubs namespace, which starts with `Endpoint=sb://`. Find it in the Azure portal, under Shared access policies of the namespace."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      valueSerializer:
        title: Value Serializer
        description: "The Java class that turns the body into the value of the record. The default writes Avro with the schema from Azure Schema Registry."
        type: string
        default: "com.microsoft.azure.schemaregistry.kafka.avro.KafkaAvroSerializer"
      azureRegistryUrl:
        title: Azure Schema Registry URL
        description: "The URL of the Azure Schema Registry, which is the address of the Event Hubs namespace that holds it, as `https://<namespace>.servicebus.windows.net`."
        type: string
        example: "https://my-namespace.servicebus.windows.net"
      specificAvroValueType:
        title: Specific Avro Value Type
        description: "The full name of the Java class generated from the Avro schema of the records. The class must be part of the integration. The Kamelet does not start without this option, although it is not marked as required."
        type: string
        example: "com.example.Order"
  dataTypes:
    in:
      headers:
        key:
          title: Key
          description: "Optional. The key of the record. `ce-key` is used when it is not set."
          type: string
        ce-key:
          title: CloudEvents Key
          description: "Optional. The key of the record, when `key` is not set."
          type: string
        partition-key:
          title: Partition Key
          description: "Optional. The number of the partition to write the record to. `ce-partitionkey` is used when it is not set."
          type: integer
        ce-partitionkey:
          title: CloudEvents Partition Key
          description: "Optional. The number of the partition to write the record to, when `partition-key` is not set."
          type: integer
  dependencies:
    - "camel:kafka"
    - "camel:kamelet"
    - "camel:azure-schema-registry"
    - "mvn:com.microsoft.azure:azure-schemaregistry-kafka-avro:1.1.4"
    - "mvn:com.azure:azure-data-schemaregistry-apacheavro:1.1.30"
    - "mvn:com.azure:azure-identity:1.18.1"
  template:
    beans:
      - name: defaultAzureCredential
        type: "#class:org.apache.camel.component.azure.schema.registry.DefaultAzureCredentialWrapper"
    from:
      uri: kamelet:source
      steps:
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[key]}"
                steps:
                  - setHeader:
                      name: CamelKafkaKey
                      expression:
                        simple:
                          expression: "${header[key]}"
              - expression:
                  simple:
                    expression: "${header[ce-key]}"
                steps:
                  - setHeader:
                      name: CamelKafkaKey
                      expression:
                        simple:
                          expression: "${header[ce-key]}"
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[partition-key]}"
                steps:
                  - setHeader:
                      name: CamelKafkaPartitionKey
                      expression:
                        simple:
                          expression: "${header[partition-key]}"
              - expression:
                  simple:
                    expression: "${header[ce-partitionkey]}"
                steps:
                  - setHeader:
                      name: CamelKafkaPartitionKey
                      expression:
                        simple:
                          expression: "${header[ce-partitionkey]}"
        - to:
            uri: kafka
            parameters:
              topic: "{{topic}}"
              additionalProperties.schema.group: avro
              additionalProperties.schema.registry.credential: "#bean:defaultAzureCredential"
              additionalProperties.schema.registry.url: "{{azureRegistryUrl}}"
              additionalProperties.specific.avro.value.type: "#valueAs(java.lang.Class):{{specificAvroValueType}}"
              brokers: "{{bootstrapServers}}"
              saslJaasConfig: "RAW(org.apache.kafka.common.security.plain.PlainLoginModule required username=\"$ConnectionString\" password=\"{{password}}\";)"
              saslMechanism: "{{saslMechanism}}"
              securityProtocol: "{{securityProtocol}}"
              valueSerializer: "{{valueSerializer}}"
