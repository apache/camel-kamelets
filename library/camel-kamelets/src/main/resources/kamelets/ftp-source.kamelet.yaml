apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: ftp-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "FTP"
    camel.apache.org/kamelet.namespace: "File"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "FTP Source"
    description: |-
      Reads the files in a directory on an FTP server, one message per file, and by default leaves them on the server.

      Use it to collect the files that a partner or a legacy system drops on an FTP server, such as orders, invoices or exports. For an encrypted connection use `ftps-source`, and for a server you reach with SSH use `sftp-source`.

      Output: the body is the content of the file, as a stream. `Content-Type` is `application/octet-stream`. The `file` and `ce-file` headers hold the name of the file, with its path below `directoryName` when `recursive` is true, such as `2026/orders.csv`. `CamelFileName` holds the same name, and `CamelFileLength` the size of the file in bytes.

      Good to know: files are not deleted or moved after they are read, unless `delete` is true or `move` is set. A file is read only once while the integration runs (`idempotent`), but the files left on the server are all read again after a restart; to read each file only once, also across restarts, set `move` to a directory such as `.done`, set `delete` to true, or keep the list of the files read in a file with `idempotentRepository`. To read only some of the files, set `include`, `exclude` or `antInclude`. To leave a file alone while another program is still writing it, set `readLock`. The connection and the login are not encrypted. Files are transferred in ASCII (text) mode unless `binary` is true.
    required:
      - connectionHost
      - connectionPort
      - username
      - password
      - directoryName
    type: object
    properties:
      connectionHost:
        title: Connection Host
        description: The host name or IP address of the FTP server, without `ftp://` and without a port.
        type: string
        example: ftp.example.com
      connectionPort:
        title: Connection Port
        description: The port of the FTP server. FTP servers usually listen on port 21.
        type: string
        default: 21
      username:
        title: Username
        description: The user to log in to the FTP server as.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      password:
        title: Password
        description: The password of `username` on the FTP server.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      directoryName:
        title: Directory Name
        description: The directory on the server to read the files from. A path without a leading `/` is relative to the home directory of the user.
        type: string
        example: outgoing/orders
      passiveMode:
        title: Passive Mode
        description: If true, the transfers use passive mode, in which the integration opens all the connections to the server. Set it to true when the integration or the server is behind a firewall or NAT, where the default active mode often fails.
        type: boolean
        default: false
      recursive:
        title: Recursive
        description: If true, the files in the subdirectories of `directoryName` are read too.
        type: boolean
        default: false
      idempotent:
        title: Skip Files Already Read
        description: If true, a file is read only once while the integration runs, even when it stays on the server. The list of the files read is kept in memory, so after a restart the files still on the server are read again, unless `move` or `delete` takes them away, or `idempotentRepository` keeps the list elsewhere. If false, and neither `delete` nor `move` is set, the same files are read again on every poll.
        type: boolean
        default: true
      idempotentRepository:
        title: Files Read Store
        description: The name of a bean that keeps the list of the files read, so that the files left on the server are not read again after a restart, such as a `FileIdempotentRepository` that keeps the list in a file. Declare the bean in the integration, for example under `beans` in YAML. Only used when `idempotent` is true. When it is not set, the list is kept in memory.
        type: string
        example: readFiles
      binary:
        title: Binary Mode
        description: If true, files are transferred in binary mode, byte for byte. When false, they are transferred in ASCII mode, which is meant for text. Set it to true for files that are not text, such as images, archives or PDF files.
        type: boolean
        default: false
      autoCreate:
        title: Autocreate Missing Directories
        description: If true, `directoryName` is created on the server when it does not exist.
        type: boolean
        default: true
      delete:
        title: Delete
        description: If true, each file is deleted from the server once it has been read and handed on successfully. Use it to read each file only once, also across restarts. To keep the files, set `move` instead.
        type: boolean
        default: false
      move:
        title: Move After Read
        description: Where to move each file on the server once it has been read and handed on successfully, so that it is not read again, also after a restart. A directory name, such as `.done`, is relative to the directory of the file. A path that ends with the name of the file, such as `done/$\{date:now:yyyyMMdd}/$\{file:name}`, is relative to `directoryName`, where `$\{file:name}` is the name of the file and `$\{date:now:yyyyMMdd}` today's date. A directory whose name starts with a dot is never read, which matters when `recursive` is true. Missing directories are created, so `username` must be allowed to create directories and to rename files. When it is not set, files stay where they are. When `delete` is true too, the integration fails to start.
        type: string
        example: ".done"
      moveFailed:
        title: Move Failed Files To
        description: Where to move a file on the server when it could not be handed on, for example because the next step failed, so that it is not read over and over. The same format as `move`, such as `.error`. When it is not set, a file that fails stays where it is and is read again at every poll. It can be set together with `delete` or `move`.
        type: string
        example: ".error"
      include:
        title: Include Files
        description: A regular expression that the name of a file must match to be read, such as `.*\.csv` for the CSV files. The whole name must match, upper and lower case count as the same, and only the name is matched, not its directory. The other files stay on the server. When it is not set, all the files are read.
        type: string
        example: '.*\.csv'
      exclude:
        title: Exclude Files
        description: A regular expression for the names of the files not to read, such as `.*\.(tmp|part)`. The whole name must match, upper and lower case count as the same, and only the name is matched, not its directory. A file it matches is not read, even when `include` or `antInclude` matches it too.
        type: string
        example: '.*\.(tmp|part)'
      antInclude:
        title: Include Files (Wildcards)
        description: Wildcard patterns, separated by commas, that the path of a file must match to be read, such as `*.csv,*.xml`. The path is relative to `directoryName`, such as `2026/orders.csv` when `recursive` is true. `*` matches any part of a name and `**` any number of directories, so `*.csv` matches the CSV files in `directoryName` only, and `**/*.csv` those in the subdirectories too. Upper and lower case differ. When it is not set, all the files are read.
        type: string
        example: '**/*.csv'
      preMove:
        title: Move Before Read
        description: Where to move each file on the server before it is read, so that another reader of the same directory does not take it too. The same format as `move`, such as `.inprogress`, a directory next to the file. `move`, `moveFailed` and `delete` then act on the file in its new place, so with `move` set to `.done` the file ends up in `.inprogress/.done`. When it is not set, a file is read where it is.
        type: string
        example: ".inprogress"
      readLock:
        title: Wait Until Written
        description: How to make sure that another program has finished writing a file before it is read. `changed` reads a file once its size and modification time have not changed between two checks 5 seconds apart, or, with `readLockMinAge`, once the file is that old. A file still changing after 20 seconds is skipped until the next poll, and while a file is checked the other files wait. `changed` never reads an empty file. `rename` reads a file once it can be renamed. `none` reads the files as they are. When it is not set, `none`.
        type: string
        enum: ["none", "changed", "rename"]
        example: changed
      readLockMinAge:
        title: Minimum File Age
        description: 'Only used when `readLock` is `changed`: how old a file must be, in milliseconds, before it is read, counted from its modification time on the server. For example, 60000 leaves a file alone until it has not been changed for one minute. A file that is not old enough is skipped until the next poll, after 20 seconds of checks. The clocks of the server and of the integration must agree. FTP servers give the modification time only to the minute, and in their own time zone: when that is not the time zone of the integration, files look older or younger by the difference, so a server on UTC seen from an integration on Central European Time makes every file look one hour older, and it is read at once.'
        type: integer
        example: 60000
      delay:
        title: Poll Interval
        description: How long to wait between two polls of the directory, in milliseconds. For example, 60000 polls once a minute. When it is not set, 500.
        type: integer
        example: 60000
      maxMessagesPerPoll:
        title: Max Files Per Poll
        description: The largest number of files to read in one poll, such as 100. The other files are read at the next polls. The poll takes the first files the server lists, and `sortBy` sorts only these. When it is not set, or 0, all the files found are read.
        type: integer
        example: 100
      sortBy:
        title: Sort By
        description: The order in which the files of a poll are read. `file:name` sorts them by name, `file:modified` by modification time and `file:length` by size. Put `reverse:` before it for the reverse order, such as `reverse:file:modified` for the newest first. Separate several sorts with `;`, such as `file:modified;file:name`. FTP servers give the modification time only to the minute, so files changed in the same minute keep the order of the server. When it is not set, the files are read in the order the server lists them.
        type: string
        example: file:modified
      streamDownload:
        title: Stream Download
        description: 'If true, each file is read from the server while it is handed on, instead of being downloaded into memory first, and the body is a stream. Use it for files too large for memory. It saves memory only when the integration does not keep the stream in memory either: set `camel.main.streamCachingSpoolEnabled=true`, which writes large bodies to a temporary file, or turn stream caching off. It needs `stepwise` set to false, or every file fails. When it is not set, false.'
        type: boolean
      stepwise:
        title: Change Directory Stepwise
        description: If true, the integration changes into the directory of a file, one level at a time, to read it. If false, it uses the full path of the file instead, which some servers need. It must be false when `streamDownload` is true. When it is not set, true.
        type: boolean
      connectTimeout:
        title: Connect Timeout
        description: How long to wait for the connection to the FTP server, in milliseconds, and then for its first answer. A connection that fails is tried 3 times before the poll is skipped. When it is not set, 10000.
        type: integer
        example: 10000
      socketTimeout:
        title: Socket Timeout
        description: How long to wait for the answer of the server to a command, in milliseconds, before the poll fails. When it is not set, 300000 (5 minutes).
        type: integer
        example: 60000
      dataTimeout:
        title: Data Timeout
        description: How long to wait for data while a file or the list of the files is transferred, in milliseconds, before the poll fails. When it is not set, 30000.
        type: integer
        example: 30000
  dataTypes:
    out:
      default: binary
      headers:
        file:
          title: File Name
          description: The name of the file, with its path below `directoryName` when `recursive` is true, such as `2026/orders.csv`.
          type: string
        ce-file:
          title: File Name (CloudEvents)
          description: The same value as `file`.
          type: string
        CamelFileName:
          title: Camel File Name
          description: The same value as `file`.
          type: string
        CamelFileLength:
          title: File Size
          description: The size of the file, in bytes.
          type: integer
      types:
        binary:
          format: "application-octet-stream"
          description: The content of the file as it is, with `Content-Type` set to `application/octet-stream`. A stream stays a stream, so `streamDownload` still reads a large file without holding it in memory.
          mediaType: application/octet-stream
  dependencies:
    - "camel:ftp"
    - "camel:kamelet"
  template:
    from:
      uri: ftp
      parameters:
        host: "{{username}}@{{connectionHost}}"
        port: "{{connectionPort}}"
        directoryName: "{{directoryName}}"
        antInclude: "RAW({{?antInclude}})"
        autoCreate: "{{autoCreate}}"
        binary: "{{binary}}"
        connectTimeout: "{{?connectTimeout}}"
        delay: "{{?delay}}"
        delete: "{{delete}}"
        exclude: "RAW({{?exclude}})"
        idempotent: "{{idempotent}}"
        idempotentRepository: "#bean:{{?idempotentRepository}}"
        include: "RAW({{?include}})"
        maxMessagesPerPoll: "{{?maxMessagesPerPoll}}"
        move: "{{?move}}"
        moveFailed: "{{?moveFailed}}"
        passiveMode: "{{passiveMode}}"
        password: "RAW({{password}})"
        preMove: "{{?preMove}}"
        readLock: "{{?readLock}}"
        readLockMinAge: "{{?readLockMinAge}}"
        recursive: "{{recursive}}"
        sortBy: "RAW({{?sortBy}})"
        soTimeout: "{{?socketTimeout}}"
        stepwise: "{{?stepwise}}"
        streamDownload: "{{?streamDownload}}"
        timeout: "{{?dataTimeout}}"
      steps:
        - setHeader:
            name: file
            expression:
              simple:
                expression: "${header[CamelFileName]}"
        - setHeader:
            name: ce-file
            expression:
              simple:
                expression: "${header[CamelFileName]}"
        - convertBodyTo:
            type: java.io.InputStream
        - to:
            uri: kamelet:sink
