apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: azure-cosmosdb-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Azure CosmosDB"
    camel.apache.org/kamelet.namespace: "Azure"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "Azure CosmosDB Source"
    description: |-
      Receives the items created or changed in a container of Azure Cosmos DB, through its change feed, as a JSON array per batch.

      Use it to react to new or updated documents, for example to copy them to a search index, a cache or Kafka. To create items, use `azure-cosmosdb-sink`.

      Output: the body is a JSON array of the items of one batch, as bytes, each item with the fields that Cosmos DB adds, such as `_etag`.

      Good to know: it reads only the changes made after it first starts, and it does not see deleted items. It keeps its position in a lease container, `camel-lease` in the database `databaseName` unless set otherwise, which must exist unless `createLeaseContainerIfNotExists` is true.
    required:
      - databaseName
      - containerName
      - databaseEndpoint
    type: object
    properties:
      databaseName:
        title: Database Name
        description: The name of the database in the Azure Cosmos DB account.
        type: string
        example: shop
      containerName:
        title: Container Name
        description: The name of the container in the database to receive the changes of.
        type: string
        example: orders
      accountKey:
        title: Account Key
        description: "The primary or secondary key of the Azure Cosmos DB account, from the Azure portal: the account, then Settings, Keys. Used when `credentialType` is `SHARED_ACCOUNT_KEY`, the default."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      leaseDatabaseName:
        title: Lease Database Name
        description: The name of the database of the lease container. When it is not set, the lease container is in `databaseName`.
        type: string
        example: shop
      leaseContainerName:
        title: Lease Container Name
        description: The name of the container where the source keeps its leases, which record how far it has read the change feed. When it is not set, `camel-lease`.
        type: string
        example: camel-lease
      createLeaseDatabaseIfNotExists:
        title: Autocreate Lease Database
        description: If true, the lease database is created when it does not exist. If false, a missing lease database stops the source from starting.
        type: boolean
        default: false
      createLeaseContainerIfNotExists:
        title: Autocreate Lease Container
        description: If true, the lease container is created when it does not exist. If false, a missing lease container stops the source from starting.
        type: boolean
        default: false
      databaseEndpoint:
        title: Database Endpoint
        description: The address of the Azure Cosmos DB account, shown as URI on the Overview page of the account in the Azure portal.
        type: string
        example: https://my-account.documents.azure.com:443/
      credentialType:
        title: Credential Type
        description: How to log in to Azure Cosmos DB. `SHARED_ACCOUNT_KEY`, the default, uses `accountKey`. `AZURE_IDENTITY` uses the Azure identity of the environment, such as the `AZURE_CLIENT_ID`, `AZURE_TENANT_ID` and `AZURE_CLIENT_SECRET` environment variables, a managed identity or the Azure CLI login.
        type: string
        default: "SHARED_ACCOUNT_KEY"
        enum: ["SHARED_ACCOUNT_KEY", "AZURE_IDENTITY"]
  dataTypes:
    out:
      default: json
      headers:
      types:
        json:
          format: "application-json"
          description: Json mapping of Change Feed records
          mediaType: application/json
        cloudevents:
          format: "azure-cosmosdb:application-cloudevents"
          description: Data type transformer converts Azure CosmosDB Change Feed processor response to CloudEvent v1_0 data format. The data type sets Camel specific CloudEvent headers with values extracted from Azure CosmosDB Change Feed processor response.
          headers:
            CamelCloudEventID:
              title: CloudEvent ID
              description: The Camel exchange id set as event id
              type: string
            CamelCloudEventType:
              title: CloudEvent Type
              description: The event type
              default: "org.apache.camel.event.azure.cosmosdb.changes"
              type: string
            CamelCloudEventSource:
              title: CloudEvent Source
              description: The event source.
              type: string
              default: "org.apache.camel.event.azure.cosmosdb.changefeed"
            CamelCloudEventSubject:
              title: CloudEvent Subject
              description: The event subject. 
              type: string
              default: "org.apache.camel.event.azure.cosmosdb.changefeed"
            CamelCloudEventTime:
              title: CloudEvent Time
              description: The exchange creation timestamp as event time.
              type: string
  dependencies:
    - "camel:azure-cosmosdb"
    - "camel:kamelet"
    - "camel:jackson3"
  template:
    from:
      uri: azure-cosmosdb
      parameters:
        databaseName: "{{databaseName}}"
        containerName: "{{containerName}}"
        accountKey: "RAW({{?accountKey}})"
        createLeaseContainerIfNotExists: "{{createLeaseContainerIfNotExists}}"
        createLeaseDatabaseIfNotExists: "{{createLeaseDatabaseIfNotExists}}"
        credentialType: "{{credentialType}}"
        databaseEndpoint: "{{databaseEndpoint}}"
        leaseContainerName: "{{?leaseContainerName}}"
        leaseDatabaseName: "{{?leaseDatabaseName}}"
      steps:
        - marshal:
            json: {}
        - to:
            uri: kamelet:sink

