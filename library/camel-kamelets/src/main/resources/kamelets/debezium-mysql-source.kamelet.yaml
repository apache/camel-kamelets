apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: debezium-mysql-source
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Debezium"
    camel.apache.org/kamelet.namespace: "Database"
  labels:
    camel.apache.org/kamelet.type: "source"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "Debezium MySQL Source"
    description: |-
      Sends a message for each row inserted, updated or deleted in the tables of a MySQL database, as it happens (change data capture with Debezium).

      Use it to pass the changes of a database on to another system as they happen, for example to keep a search index or a cache up to date, or to copy new orders to a queue, without polling the tables. To read rows with a query again and again, use `mysql-source`.

      Output: the body is JSON text in bytes, an object with the column names as keys, such as `{"id":1,"name":"Tea","price":4.50}`: the row after the change, and for a delete the row before it. The columns are in the order of the table. A `DECIMAL` column is a JSON number with its decimals, such as `4.50`, and a `DATE` column the number of days since 1970-01-01, such as `20454` for 2026-01-01. The `debezium-operation` header says what happened: `c` (insert), `u` (update), `d` (delete) or `r` (a row read by the snapshot, see `snapshotMode`). `debezium-table` is the table, as `database.table` such as `shop.orders`, and `debezium-key` the primary key of the row as JSON text, such as `{"id":1}`. `Content-Type` is `application/json`.

      Good to know: the server must write its binary log (binlog) in the `ROW` format with the whole row (`binlog_format=ROW` and `binlog_row_image=FULL`, the defaults of MySQL 8), and the user needs the `SELECT`, `RELOAD`, `SHOW DATABASES`, `REPLICATION SLAVE` and `REPLICATION CLIENT` privileges. The Kamelet reads the binlog as a replica of the server does, under the id `serverId`. On the first start, it by default sends every row of the tables first (`snapshotMode`). It saves how far it got in the file `offsetStorageFileName`, or in a Kafka topic, when it stops and once a minute while it runs, and after a restart it goes on from there, so after a crash the changes of the last minute can be sent again. It also keeps the structure of the tables, as the binlog changed it, in a schema history: the file `schemaHistoryFileName`, or a Kafka topic. Keep both files on a disk that outlives the integration, such as a volume in Kubernetes: when the position is lost, everything is sent again as on the first start, and when only the schema history is lost, the Kamelet logs `The db history topic is missing` and reads no changes, until it is started once with `snapshotMode` set to `recovery`. When the server is not set up as needed, such as with `binlog_format=STATEMENT`, the Kamelet logs why and reads no changes, while the integration keeps running. The JDBC driver of MySQL is not included, as its license is not the Apache license: add `mvn:com.mysql:mysql-connector-j` to the dependencies of the integration, such as `camel run --dep=mvn:com.mysql:mysql-connector-j:26.10.0`. Any other option of the Debezium MySQL connector can be set for all the Kamelets of the integration as the `camel.component.debezium-mysql.` property of that option, such as `camel.component.debezium-mysql.columnExcludeList=shop.customers.ssn`.
    required:
      - serverName
      - username
      - password
      - serverId
      - topicPrefix
    type: object
    properties:
      serverName:
        title: Server Name
        description: The host name or IP address of the MySQL server, without the port.
        type: string
        example: db.example.com
      serverPort:
        title: Server Port
        description: The port the MySQL server listens on. MySQL uses 3306 unless it was set up otherwise.
        type: integer
        default: 3306
      username:
        title: Username
        description: The database user to log in as. It needs the `SELECT`, `RELOAD`, `SHOW DATABASES`, `REPLICATION SLAVE` and `REPLICATION CLIENT` privileges.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      password:
        title: Password
        description: The password of the database user `username`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      serverId:
        title: Server Id
        description: The number the Kamelet uses as a replica of the MySQL server to read the binlog, such as `5400`. It must differ from the `server_id` of every MySQL server and of every other client that reads the binlog of the same servers, the other Kamelets included.
        type: integer
        example: 5400
      topicPrefix:
        title: Logical Name
        description: A name for this source of changes, made of letters, digits, `.`, `_` and `-`. The saved position is stored under this name, so keep it the same across restarts, and give each Kamelet that reads another server its own name.
        type: string
        pattern: "^[a-zA-Z0-9._-]+$"
        example: shop
      tableIncludeList:
        title: Tables
        description: The tables whose changes to send, as regular expressions that match `database.table`, separated by commas, such as `shop.orders,shop.customers`. When it is not set, the changes of all tables of all databases are sent, except those of the system databases.
        type: string
        example: shop.orders,shop.customers
      snapshotMode:
        title: Snapshot Mode
        description: "Whether to send the rows that are already in the tables before the changes. `initial` (the default): on the first start, every row of the tables is sent with the operation `r`, then the changes; after a restart with a saved position, only the changes since. `no_data`: only the changes made from the first start on. `always`: every row on each start, then the changes. `initial_only`: every row on the first start, and no changes. `when_needed`: as `initial`, and every row again when the saved position can no longer be found in the binlog. `recovery`: for one start after the schema history is lost, to write it again from the tables as they are now, then go on from the saved position; only when the structure of the tables has not changed since the Kamelet stopped."
        type: string
        enum: ["initial", "no_data", "always", "initial_only", "when_needed", "recovery"]
        default: initial
      sslMode:
        title: TLS Mode
        description: "Whether the connection to MySQL uses TLS. `preferred` (the default): TLS when the server offers it, without checking its certificate. `required`: always TLS, without checking the certificate of the server. `disabled`: no TLS."
        type: string
        enum: ["disabled", "preferred", "required"]
        default: preferred
      offsetStorageFileName:
        title: Position File
        description: The file where the Kamelet saves how far it got, such as `/data/offsets.dat`, read again after a restart. It is created when it does not exist, but its folder must exist and be writable, or the Kamelet fails to start. A relative name is in the folder the integration runs in. When it is lost, the changes are sent again as on the first start. Not used when `offsetStorage` is the Kafka store.
        type: string
        default: debezium-mysql-offsets.dat
        example: /data/offsets.dat
      offsetStorage:
        title: Position Store
        description: "Where the Kamelet saves how far it got. `org.apache.kafka.connect.storage.FileOffsetBackingStore` (the default): in the file `offsetStorageFileName`. `org.apache.kafka.connect.storage.KafkaOffsetBackingStore`: in the Kafka topic `offsetStorageTopic`, on the Kafka of `offsetStorageBootstrapServers`, for an integration that has no lasting disk. Use the same kind of store for `schemaHistory`."
        type: string
        enum: ["org.apache.kafka.connect.storage.FileOffsetBackingStore", "org.apache.kafka.connect.storage.KafkaOffsetBackingStore"]
        default: org.apache.kafka.connect.storage.FileOffsetBackingStore
      offsetStorageBootstrapServers:
        title: Kafka Brokers
        description: The Kafka brokers of the Kafka stores of `offsetStorage` and `schemaHistory`, as `host:port` separated by commas. Needed with a Kafka store. The connection is made without TLS and without a login.
        type: string
        example: my-cluster-kafka-bootstrap:9092
      offsetStorageTopic:
        title: Position Topic
        description: The Kafka topic where the Kafka store saves how far the Kamelet got. It is created when it does not exist. Needed with the Kafka store.
        type: string
        example: shop-offsets
      offsetStoragePartitions:
        title: Position Topic Partitions
        description: The number of partitions of the topic `offsetStorageTopic` when the Kamelet creates it. Needed with the Kafka store.
        type: integer
        example: 1
      offsetStorageReplicationFactor:
        title: Position Topic Replicas
        description: The number of copies of the topic `offsetStorageTopic` on the Kafka brokers when the Kamelet creates it. Needed with the Kafka store.
        type: integer
        example: 3
      schemaHistoryFileName:
        title: Schema History File
        description: The file where the Kamelet keeps the structure of the tables, such as `/data/schema-history.dat`, read again after a restart. It is created when it does not exist, with its folders. A relative name is in the folder the integration runs in. Not used when `schemaHistory` is the Kafka store.
        type: string
        default: debezium-mysql-schema-history.dat
        example: /data/schema-history.dat
      schemaHistory:
        title: Schema History Store
        description: "Where the Kamelet keeps the structure of the tables. `io.debezium.storage.file.history.FileSchemaHistory` (the default): in the file `schemaHistoryFileName`. `io.debezium.storage.kafka.history.KafkaSchemaHistory`: in the Kafka topic `schemaHistoryTopic`, on the Kafka of `offsetStorageBootstrapServers`, for an integration that has no lasting disk."
        type: string
        enum: ["io.debezium.storage.file.history.FileSchemaHistory", "io.debezium.storage.kafka.history.KafkaSchemaHistory"]
        default: io.debezium.storage.file.history.FileSchemaHistory
      schemaHistoryTopic:
        title: Schema History Topic
        description: The Kafka topic where the Kafka store keeps the structure of the tables. It is created with one partition when it does not exist. Use a topic of its own, not `offsetStorageTopic`. Needed with the Kafka store.
        type: string
        example: shop-schema-history
  dataTypes:
    out:
      default: json
      types:
        json:
          format: "application-json"
          description: "The row after the change, or before it for a delete, as JSON text in bytes."
          mediaType: application/json
      headers:
        debezium-operation:
          title: Operation
          description: "What happened to the row: `c` (insert), `u` (update), `d` (delete) or `r` (read by the snapshot)."
          type: string
        debezium-table:
          title: Table
          description: The table of the row, as `database.table`, such as `shop.orders`.
          type: string
        debezium-key:
          title: Key
          description: The primary key of the row, as JSON text such as `{"id":1}`.
          type: string
        Content-Type:
          title: Content Type
          description: Always `application/json`, as the body is JSON text.
          type: string
  dependencies:
    - "camel:jackson3"
    - "camel:kamelet"
    - "camel:debezium-mysql"
  template:
    from:
      uri: debezium-mysql
      parameters:
        name: "{{topicPrefix}}"
        databaseHostname: "{{serverName}}"
        databasePort: "{{serverPort}}"
        databaseUser: "{{username}}"
        databasePassword: "RAW({{password}})"
        databaseServerId: "{{serverId}}"
        databaseSslMode: "{{sslMode}}"
        topicPrefix: "{{topicPrefix}}"
        tableIncludeList: "{{?tableIncludeList}}"
        snapshotMode: "{{snapshotMode}}"
        offsetStorage: "{{offsetStorage}}"
        offsetStorageFileName: "{{offsetStorageFileName}}"
        offsetStorageTopic: "{{?offsetStorageTopic}}"
        offsetStoragePartitions: "{{?offsetStoragePartitions}}"
        offsetStorageReplicationFactor: "{{?offsetStorageReplicationFactor}}"
        schemaHistoryInternal: "{{schemaHistory}}"
        schemaHistoryInternalFileFilename: "{{schemaHistoryFileName}}"
        additionalProperties.bootstrap.servers: "{{?offsetStorageBootstrapServers}}"
        additionalProperties.schema.history.internal.kafka.bootstrap.servers: "{{?offsetStorageBootstrapServers}}"
        additionalProperties.schema.history.internal.kafka.topic: "{{?schemaHistoryTopic}}"
      steps:
        # only the changes of rows: not the tombstones, heartbeats or schema changes, which have no row
        - filter:
            expression:
              simple:
                expression: "${header.CamelDebeziumOperation} in 'c,u,d,r'"
            steps:
              - setHeader:
                  name: debezium-operation
                  expression:
                    simple:
                      expression: "${header.CamelDebeziumOperation}"
              - setHeader:
                  name: debezium-table
                  expression:
                    simple:
                      expression: "${header.CamelDebeziumSourceMetadata[db]}.${header.CamelDebeziumSourceMetadata[table]}"
              # the key as JSON text
              - choice:
                  when:
                    - expression:
                        simple:
                          expression: "${header.CamelDebeziumKey} != null"
                      steps:
                        - setProperty:
                            name: debezium-row
                            expression:
                              simple:
                                expression: "${body}"
                        - setBody:
                            expression:
                              simple:
                                expression: "${header.CamelDebeziumKey}"
                        - convertBodyTo:
                            type: java.util.Map
                        - marshal:
                            json: {}
                        - setHeader:
                            name: debezium-key
                            expression:
                              simple:
                                expression: "${bodyAs(String)}"
                        - setBody:
                            expression:
                              simple:
                                expression: "${exchangeProperty.debezium-row}"
                        - removeProperty:
                            name: debezium-row
              # a delete has no row after it: send the row before it
              - choice:
                  when:
                    - expression:
                        simple:
                          expression: "${header.CamelDebeziumOperation} == 'd'"
                      steps:
                        - setBody:
                            expression:
                              simple:
                                expression: "${header.CamelDebeziumBefore}"
              - convertBodyTo:
                  type: java.util.Map
              - marshal:
                  json: {}
              # the Kafka Connect objects of the component, which other systems cannot read
              - removeHeaders:
                  pattern: CamelDebezium*
              - to:
                  uri: kamelet:sink
