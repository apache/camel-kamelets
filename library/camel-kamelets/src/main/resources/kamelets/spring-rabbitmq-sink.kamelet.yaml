apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: spring-rabbitmq-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "RabbitMQ"
    camel.apache.org/kamelet.namespace: "Messaging"
  labels:
    camel.apache.org/kamelet.type: "sink"
spec:
  definition:
    title: "RabbitMQ Sink"
    description: |-
      Publishes each message to an exchange in a RabbitMQ broker, which routes it to queues by its routing key.

      Use it to hand work or events to applications that read from RabbitMQ queues. Use `spring-rabbitmq-source` to read from them.

      Input: the body is the payload, as text or bytes. Text is sent with the content type `text/plain`, and bytes with `application/octet-stream`, unless `contentType` says otherwise. A Map fails: turn structured data into JSON text first, for example with `json-serialize-action`, and set `contentType` to `application/json`. A message with no body fails, unless `allowNullBody` is true. The headers of the message, except the Camel ones, are sent as headers of the RabbitMQ message.

      Output: the message is unchanged.

      Good to know: it does not create the exchange, unless `autoDeclareProducer` is true. A message sent to an exchange that does not exist is lost without an error, unless publisher confirms are on (`publisherConfirmType` and `confirm`), and RabbitMQ drops a message that no queue is bound to take. It connects with no TLS unless `protocol` is `amqps`. With `amqps`, the certificate of the broker must be trusted by Java, or by the trust store in `sslTruststoreLocation`, and must name the host in `host`; otherwise it cannot connect. It does not wait for a reply, even when the incoming message expects one, as one from `webhook-source` does. Headers that start with `CamelSpringRabbitmq` are removed from the message first, so they cannot change what the Kamelet does.
    required:
      - host
      - port
      - exchangeName
    type: object
    properties:
      host:
        title: "Server Address"
        description: "The host name or IP address of the RabbitMQ broker."
        type: string
        example: "localhost"
      port:
        title: "Server Port"
        description: "The port of the RabbitMQ broker: usually 5672, or 5671 for `amqps`."
        type: integer
        example: 5672
      routingKey:
        title: "Routing Key"
        description: "The routing key of each message, which the exchange uses to choose the queues that get it. With a `direct` exchange, a queue gets the message when it is bound with the same key."
        example: "new-order"
        type: string
      username:
        title: "Username"
        description: "The user name to log in to RabbitMQ with. When it is not set, `guest` is used."
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      password:
        title: "Password"
        description: "The password to log in to RabbitMQ with, for the user `username`."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      exchangeName:
        title: "Exchange Name"
        description: "The name of the exchange to publish the messages to."
        example: "orders"
        type: string
      queues:
        title: "Queue Name"
        description: "The queue to create and bind to the exchange with `routingKey` when `autoDeclareProducer` is true. Not used otherwise."
        example: "orders"
        type: string
      autoDeclareProducer:
        title: "Create Exchange and Queue"
        description: "If true, the sink creates the exchange (as a `direct` exchange) and the queue in `queues`, and binds them with `routingKey`, before it sends the first message."
        type: boolean
        default: false
      publisherConfirmType:
        title: "Publisher Confirm Type"
        description: "Whether RabbitMQ confirms each message it takes: `NONE` turns confirms off, `SIMPLE` or `CORRELATED` turns them on. Use it with `confirm`."
        type: string
        default: "NONE"
        enum: ["NONE", "SIMPLE", "CORRELATED"]
      confirm:
        title: "Confirm"
        description: "Whether the sink waits for RabbitMQ to confirm each message: `enabled` always waits, `disabled` never waits, and `auto` waits when `publisherConfirmType` turns confirms on. A message that is not confirmed fails, such as one sent to an exchange that does not exist."
        type: string
        default: "auto"
        enum: ["auto", "enabled", "disabled"]
      confirmTimeout:
        title: "Confirm Timeout"
        description: "How long to wait for RabbitMQ to confirm a message, in milliseconds. A negative value waits forever."
        type: string
        default: "5000"
      vhost:
        title: "Virtual Host"
        description: "The virtual host of the broker to connect to, which holds the exchanges and queues. RabbitMQ has the virtual host `/` from the start."
        type: string
        default: "/"
      protocol:
        title: "Protocol"
        description: "`amqp` for a plain connection, or `amqps` for a connection encrypted with TLS, which checks the certificate of the broker and its host name."
        type: string
        enum: ["amqp", "amqps"]
        default: "amqp"
      sslTruststoreLocation:
        title: "SSL Truststore Location"
        description: "The location of a trust store, in JKS or PKCS12 format, with the certificate of the authority that signed the certificate of the broker, such as `file:/etc/rabbitmq/truststore.p12`, or `classpath:truststore.p12` for one on the classpath. A path without `file:` is looked up on the classpath. Needed only with `amqps` when the broker uses a certificate that Java does not trust by default, such as one from a private or self-signed authority. Not used with `amqp`."
        type: string
        example: "file:/etc/rabbitmq/truststore.p12"
      sslTruststorePassword:
        title: "SSL Truststore Password"
        description: "The password of the trust store in `sslTruststoreLocation`."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      allowNullBody:
        title: "Allow Null Body"
        description: "If true, a message with no body is sent as an empty RabbitMQ message, with the content type `application/octet-stream`, or the one in `contentType`. When it is not set, a message with no body fails."
        type: boolean
      contentType:
        title: "Content Type"
        description: "The content type to send every message with, such as `application/json` or `application/json; charset=utf-8`, so that the applications that read it know its format. When it is not set, text is sent as `text/plain`, and bytes as `application/octet-stream`."
        type: string
        example: "application/json"
        pattern: "^[A-Za-z0-9!#$&^_.+-]+/[A-Za-z0-9!#$&^_.+-]+( *; *[A-Za-z0-9!#$&^_.+-]+=[A-Za-z0-9!#$&^_.+-]+)*$"
  dependencies:
    - "camel:spring-rabbitmq"
    - "camel:kamelet"
  template:
    beans:
      - name: rabbitConnectionFactory
        type: "#class:com.rabbitmq.client.ConnectionFactory"
        builderClass: org.springframework.amqp.rabbit.connection.RabbitConnectionFactoryBean
        builderMethod: getObject
        properties:
          singleton: false
          uri: "{{protocol}}://{{host}}:{{port}}"
          virtualHost: "{{vhost}}"
          username: "{{?username}}"
          password: "{{?password}}"
          trustStore: "{{?sslTruststoreLocation}}"
          trustStorePassphrase: "{{?sslTruststorePassword}}"
      - name: connectionFactory
        type: "#class:org.springframework.amqp.rabbit.connection.CachingConnectionFactory"
        constructors:
          0: "#bean:{{rabbitConnectionFactory}}"
        properties:
          publisherConfirmType: "{{publisherConfirmType}}"
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: CamelSpringRabbitmq*
        - choice:
            when:
              - expression:
                  simple:
                    expression: "'{{?contentType}}' != ''"
                steps:
                  - setHeader:
                      name: CamelSpringRabbitmqContentType
                      expression:
                        constant:
                          expression: "{{?contentType}}"
        - to:
            uri: "spring-rabbitmq://{{exchangeName}}?autoDeclareProducer={{autoDeclareProducer}}&confirm={{confirm}}&confirmTimeout={{confirmTimeout}}&connectionFactory=#bean:{{connectionFactory}}&queues={{?queues}}&routingKey={{?routingKey}}&allowNullBody={{?allowNullBody}}"
            pattern: InOnly
