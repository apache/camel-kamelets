apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: infinispan-source
  labels:
    camel.apache.org/kamelet.type: "source"
    camel.apache.org/kamelet.verified: "true"
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Infinispan"
    camel.apache.org/kamelet.namespace: "Cache"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
spec:
  definition:
    title: "Infinispan Source"
    description: |-
      Receives an event each time an entry of a cache on a remote Infinispan server, or Red Hat Data Grid, is created, changed, removed or expires, one message per event.

      Use it to react to changes in a shared cache, for example to update a search index or notify another service when a value changes. To write to a cache, use `infinispan-sink`.

      Output: the message has no body: the event is in headers. `infinispan-event-type` is the kind of event, such as `CLIENT_CACHE_ENTRY_CREATED`, `infinispan-key` the key of the entry, `infinispan-cache-name` the name of the cache and `infinispan-entry-version` the version of the entry. The same values are in `ce-infinispaneventtype`, `ce-infinispankey`, `ce-infinispancachename` and `ce-infinispanentryversion`. To read the value, look up the key in the cache.

      Good to know: only the changes made while the integration runs are received. The cache must already exist on the server. Recent Infinispan servers do not accept the default `saslMechanism` of `DIGEST-MD5`: set it to `SCRAM-SHA-512`. The connection has TLS only when `sslTruststoreLocation` is set, together with `sslSniHostName`.
    required:
      - cacheName
      - hosts
      - username
      - password
    type: object
    properties:
      cacheName:
        title: Cache Name
        description: The name of the cache to watch. It must exist on the server.
        type: string
        example: orders
      hosts:
        title: Hosts
        description: The address of the Infinispan server, as `host:port`. The Hot Rod port of Infinispan is 11222 by default.
        type: string
        example: "infinispan.example.com:11222"
      secure:
        title: Secure
        description: If true, it logs in with `username` and `password`. Set it to false only for a server that needs no login. It does not turn on TLS; `sslTruststoreLocation` does.
        type: boolean
        default: true
      username:
        title: Username
        description: The Infinispan user to log in as.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      password:
        title: Password
        description: The password of the Infinispan user in `username`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      saslMechanism:
        title: SASL Mechanism
        description: How the user and password are checked by the server. Recent Infinispan servers accept `SCRAM-SHA-512`, `SCRAM-SHA-256` or `DIGEST-SHA-512`, but not the default `DIGEST-MD5`.
        type: string
        default: "DIGEST-MD5"
        example: SCRAM-SHA-512
      securityRealm:
        title: Security Realm
        description: The security realm of the server that holds the user. Keep the default unless your Infinispan administrator set up another realm.
        type: string
        default: "default"
      securityServerName:
        title: Security Server Name
        description: The name of the server, used when logging in. Keep the default unless your Infinispan administrator changed it.
        type: string
        default: "infinispan"
      sslTruststoreLocation:
        title: Trust Store Location
        description: The path of a file with the certificate of the server, or of the authority that signed it, to connect with TLS. It is a trust store in PKCS12 or JKS format, which needs `sslTruststorePassword`, or a PEM file with the certificates, such as `ca.crt`, which needs no password. Setting it turns on TLS, and `sslSniHostName` is then required. The Infinispan client does not use the certificates that Java trusts by default, so a server with a certificate from a public authority needs this file too. When it is not set, the connection has no TLS.
        type: string
        example: "/etc/infinispan/truststore.p12"
        pattern: "^[^&?#]+$"
      sslTruststorePassword:
        title: Trust Store Password
        description: The password of the trust store file in `sslTruststoreLocation`. Not needed for a PEM file.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      sslSniHostName:
        title: TLS Server Name
        description: The host name of the server as its certificate names it, such as `infinispan.example.com`. Required with `sslTruststoreLocation`. It is sent to the server when the connection starts (SNI), and the certificate of the server must be for this name, or the connection fails. Setting it without `sslTruststoreLocation` fails at start.
        type: string
        example: "infinispan.example.com"
        pattern: "^[A-Za-z0-9.-]+$"
      eventTypes:
        title: Event Types
        description: The kinds of events to receive, separated by commas without spaces. `CLIENT_CACHE_ENTRY_CREATED`, `CLIENT_CACHE_ENTRY_MODIFIED`, `CLIENT_CACHE_ENTRY_REMOVED` and `CLIENT_CACHE_ENTRY_EXPIRED` are changes of an entry; `CLIENT_CACHE_FAILOVER` tells that the connection moved to another server of the cluster.
        type: string
        example: "CLIENT_CACHE_ENTRY_CREATED,CLIENT_CACHE_ENTRY_MODIFIED"
        default: "CLIENT_CACHE_ENTRY_CREATED,CLIENT_CACHE_ENTRY_MODIFIED,CLIENT_CACHE_ENTRY_REMOVED,CLIENT_CACHE_ENTRY_EXPIRED,CLIENT_CACHE_FAILOVER"
        enum: ["CLIENT_CACHE_ENTRY_CREATED", "CLIENT_CACHE_ENTRY_MODIFIED", "CLIENT_CACHE_ENTRY_REMOVED", "CLIENT_CACHE_ENTRY_EXPIRED", "CLIENT_CACHE_FAILOVER"]
  dataTypes:
    out:
      headers:
        infinispan-event-type:
          title: Event Type
          description: The kind of event, such as `CLIENT_CACHE_ENTRY_CREATED` or `CLIENT_CACHE_ENTRY_REMOVED`. Also in `ce-infinispaneventtype`.
          type: string
        infinispan-key:
          title: Key
          description: The key of the entry that changed. Also in `ce-infinispankey`.
          type: string
        infinispan-cache-name:
          title: Cache Name
          description: The name of the cache. Also in `ce-infinispancachename`.
          type: string
        infinispan-entry-version:
          title: Entry Version
          description: The version of the entry after the change. Also in `ce-infinispanentryversion`.
          type: integer
  dependencies:
    - "camel:kamelet"
    - "camel:infinispan"
  template:
    beans:
      - name: local-infinispan
        type: "#class:org.apache.camel.component.infinispan.remote.InfinispanRemoteComponent"
    from:
      uri: "{{local-infinispan}}:{{cacheName}}?hosts={{hosts}}&secure={{secure}}&username={{username}}&password=RAW({{password}})&saslMechanism={{saslMechanism}}&securityRealm={{securityRealm}}&securityServerName={{securityServerName}}&eventTypes={{eventTypes}}&configurationProperties[trust_store_file_name]={{?sslTruststoreLocation}}&configurationProperties[trust_store_password]=RAW({{?sslTruststorePassword}})&configurationProperties[sni_host_name]={{?sslSniHostName}}"
      steps:
        - setHeader:
            name: infinispan-cache-name
            expression:
              simple:
                expression: "${header[CamelInfinispanCacheName]}"
        - setHeader:
            name: ce-infinispancachename
            expression:
              simple:
                expression: "${header[CamelInfinispanCacheName]}"
        - setHeader:
            name: infinispan-entry-version
            expression:
              simple:
                expression: "${header[CamelInfinispanEntryVersion]}"
        - setHeader:
            name: ce-infinispanentryversion
            expression:
              simple:
                expression: "${header[CamelInfinispanEntryVersion]}"
        - setHeader:
            name: infinispan-event-type
            expression:
              simple:
                expression: "${header[CamelInfinispanEventType]}"
        - setHeader:
            name: ce-infinispaneventtype
            expression:
              simple:
                expression: "${header[CamelInfinispanEventType]}"
        - setHeader:
            name: infinispan-key
            expression:
              simple:
                expression: "${header[CamelInfinispanKey]}"
        - setHeader:
            name: ce-infinispankey
            expression:
              simple:
                expression: "${header[CamelInfinispanKey]}"
        - to:
            uri: kamelet:sink
