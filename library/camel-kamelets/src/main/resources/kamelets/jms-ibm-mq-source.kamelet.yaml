apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: jms-ibm-mq-source
  annotations:
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.group: "JMS"
    camel.apache.org/kamelet.namespace: "Messaging"
  labels:
    camel.apache.org/kamelet.type: "source"
    camel.apache.org/kamelet.verified: "true"
    camel.apache.org/requires.runtime: camel-k
spec:
  definition:
    title: "JMS - IBM MQ Source"
    description: |-
      Receives each message from a queue or a topic of an IBM MQ queue manager, through JMS.

      Use it to process work or events that other applications put on IBM MQ, such as an existing enterprise or mainframe system. Use `jms-ibm-mq-sink` to send to IBM MQ.

      Output: the body is text for a JMS text message, and bytes for a bytes message. The JMS properties of the message become headers, along with the JMS headers such as `JMSMessageID` and `JMSTimestamp`, and IBM MQ details such as `JMSXUserID`, `JMS_IBM_PutDate` and `JMS_IBM_Format`.

      Good to know: the IBM MQ client library is not included, as its licence is not the Apache one: add `mvn:com.ibm.mq:com.ibm.mq.jakarta.client` with a version to the dependencies of the integration (Camel JBang adds it by itself). From a queue, each message is removed when it is received, even when the rest of the flow then fails, unless `transacted` is true or `acknowledgementModeName` is `CLIENT_ACKNOWLEDGE`: then a message whose flow failed is delivered again. Several copies of this source share the messages of a queue, and `concurrentConsumers` processes several messages at the same time. From a topic (`destinationType` set to `topic`), it receives only the messages sent while it is connected, unless `subscriptionDurable` is true: then the queue manager keeps the messages sent while it is stopped, under `subscriptionName`. A durable subscription needs `clientId` unless it is shared (`subscriptionShared`, JMS 2.0), and only one connection may use a client ID at a time. With `selector`, it receives only the messages whose properties and headers match the selector. It connects with no TLS unless `sslCipherSuite` is set; the trust store and the key store for TLS are those of the Java runtime (`javax.net.ssl.trustStore`, `javax.net.ssl.keyStore`). For a multi-instance queue manager, list its instances in `connectionNameList`. When the queue manager cannot be reached, it starts anyway and tries again every 5 seconds.
    required:
      - serverName
      - serverPort
      - destinationName
      - queueManager
      - channel
      - username
      - password
    type: object
    properties:
      serverName:
        title: "Server Host"
        description: "The host name or IP address of the IBM MQ server that runs the queue manager."
        example: "mq.example.com"
        type: string
      serverPort:
        title: "Server Port"
        description: "The port of the listener of the queue manager on the server. The IBM MQ default is 1414."
        type: integer
        default: 1414
      destinationType:
        title: "Queue or Topic"
        description: "Whether `destinationName` is a queue (`queue`) or a topic (`topic`). A queue keeps each message until one receiver takes it; a topic hands each message to every receiver subscribed at that moment."
        type: string
        default: queue
      destinationName:
        title: "Queue or Topic Name"
        description: "The name of the queue or topic to receive the messages from, as defined in the queue manager."
        example: "DEV.QUEUE.1"
        type: string
      queueManager:
        title: "Queue Manager"
        description: "The name of the queue manager to connect to."
        example: "QM1"
        type: string
      channel:
        title: "Channel"
        description: "The name of the server-connection channel of the queue manager to connect through."
        example: "DEV.APP.SVRCONN"
        type: string
      clientId:
        title: "Client ID"
        description: "The JMS client ID of the connection, which names this application to the queue manager. A durable subscription that is not shared needs one: the queue manager keeps the subscription under the client ID and `subscriptionName`, so use the same client ID each time the source starts. Only one connection may use a client ID at a time: two running copies of this source need different client IDs. When it is not set, the connection has no client ID."
        example: "orders-service"
        type: string
      username:
        title: "Username"
        description: "The user name to log in to the queue manager with."
        type: string
      password:
        title: "Password"
        description: "The password to log in to the queue manager with, for the user `username`."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      connectionNameList:
        title: "Connection Name List"
        description: "The addresses of the instances of a multi-instance queue manager, as `host(port)` separated by commas, such as `mq1.example.com(1414),mq2.example.com(1414)`. The client tries them in order and connects to the first that answers. `serverName` and `serverPort` take the place of the first address of the list, so set them to the first instance too. When it is not set, the client connects only to `serverName` and `serverPort`."
        type: string
        pattern: '^[^,()\s]+(\(\d+\))?(\s*,\s*[^,()\s]+(\(\d+\))?)*$'
        example: "mq1.example.com(1414),mq2.example.com(1414)"
      sslCipherSuite:
        title: "TLS Cipher Suite"
        description: "The TLS cipher suite to connect with, which must match the cipher spec of the channel on the queue manager, such as `TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256` for `ANY_TLS12_OR_HIGHER`. When it is set, the connection uses TLS; when it is not set, it does not. The certificate of the queue manager is checked against the trust store of the Java runtime, and a channel that asks for a client certificate gets one from its key store: set them with the Java system properties `javax.net.ssl.trustStore` and `javax.net.ssl.keyStore`, with their passwords. Camel's own TLS settings (`camel.ssl`) do not apply to IBM MQ."
        example: "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"
        type: string
      subscriptionDurable:
        title: "Durable Subscription"
        description: "Whether the subscription to a topic is durable. When it is true, the queue manager keeps the messages sent to the topic while this source is stopped or disconnected, and delivers them when it connects again; the queue manager keeps the subscription, and collects messages for it, until it is removed in the queue manager. Set `subscriptionName` with it, and `clientId` unless `subscriptionShared` is true. When it is false, the messages sent while the source is not connected are lost. Only for a topic: true makes `destinationName` a topic, even with `destinationType` set to `queue`."
        type: boolean
        default: false
      subscriptionShared:
        title: "Shared Subscription"
        description: "Whether the subscription to a topic is shared: the copies of this source that use the same `subscriptionName` share the messages of the topic, each message going to one of them, instead of each copy receiving every message. A shared subscription needs no `clientId`. Combine it with `subscriptionDurable` for a durable subscription that several copies share. Needs IBM MQ 8 or later (JMS 2.0). Only for a topic: true makes `destinationName` a topic, even with `destinationType` set to `queue`."
        type: boolean
        default: false
      subscriptionName:
        title: "Subscription Name"
        description: "The name of the durable or shared subscription to a topic, under which the queue manager keeps the subscription. Use the same name each time the source starts, to receive the messages kept while it was stopped. Set it whenever `subscriptionDurable` or `subscriptionShared` is true: without it, every source takes the same default name, so two sources with the same client ID, or two shared sources, take over one another's subscription. Not used otherwise."
        example: "orders-audit"
        type: string
      selector:
        title: "Message Selector"
        description: "A JMS message selector: the source receives only the messages that match it. It is a condition, in a syntax like the WHERE clause of SQL, on the JMS properties and headers of the message, not on its body, such as `priority > 5` or `region = 'EU' AND JMSPriority >= 7`. From a queue, the messages that do not match stay on the queue. When it is not set, the source receives every message."
        example: "priority > 5"
        type: string
      concurrentConsumers:
        title: "Concurrent Consumers"
        description: "How many messages the source processes at the same time, each in a thread of its own. From a queue, more than one makes the source faster when each message takes a while, but the messages are then no longer processed in the order of the queue. On a topic, each consumer is a subscription of its own and receives every message, so each message is processed that many times, unless `subscriptionShared` is true; a durable subscription that is not shared takes only one consumer. When it is not set, one message at a time."
        type: integer
        example: 5
      transacted:
        title: "Transacted"
        description: "Whether each message is received in a JMS transaction, which is committed once the rest of the flow has processed the message. When the flow fails, the transaction is rolled back and the queue manager delivers the message again, with the header `JMSRedelivered` true. Once the message has been delivered as many times as the backout threshold of the queue (`BOTHRESH`), the client moves it to the backout queue of the queue (`BOQNAME`); the user needs the authority to put messages on that queue with their context (`put` and `passall`), or the source stops receiving from the queue. A queue without a backout threshold (`BOTHRESH(0)`, the default) delivers a message that always fails again and again. When it is not set, the message is removed from the queue when it is received, even when the flow then fails."
        type: boolean
      acknowledgementModeName:
        title: "Acknowledgement Mode"
        description: "When the source acknowledges each message to the queue manager, which then removes it from the queue. `AUTO_ACKNOWLEDGE`: as soon as the message is received. `CLIENT_ACKNOWLEDGE`: once the rest of the flow has processed it; when the flow fails, the queue manager delivers it again, and the backout threshold and backout queue of the queue apply, as with `transacted`. `DUPS_OK_ACKNOWLEDGE`: in batches, which is faster, but the messages processed since the last batch are delivered again when the source stops without closing its connection, such as in a crash. Not used when `transacted` is true. When it is not set, `AUTO_ACKNOWLEDGE`."
        type: string
        enum: ["AUTO_ACKNOWLEDGE", "CLIENT_ACKNOWLEDGE", "DUPS_OK_ACKNOWLEDGE"]
  dataTypes:
    out:
      headers:
        JMSMessageID:
          title: "Message ID"
          description: "The ID the broker gave the message."
          type: string
        JMSDestination:
          title: "Queue or Topic"
          description: "The queue or topic the message was received from."
          type: string
        JMSTimestamp:
          title: "Timestamp"
          description: "When the message was sent, in milliseconds since 1970-01-01 UTC."
          type: integer
        JMSRedelivered:
          title: "Redelivered"
          description: "True when the broker delivers the message again, after an earlier delivery was not acknowledged."
          type: boolean
  dependencies:
  - "camel:jms"
  - "camel:kamelet"
  template:
    beans:
      - name: wmqConnectionFactory
        type: "#class:com.ibm.mq.jakarta.jms.MQConnectionFactory"
        properties:
          XMSC_WMQ_HOST_NAME: "{{serverName}}"
          XMSC_WMQ_PORT: "{{serverPort}}"
          XMSC_WMQ_CHANNEL: "{{channel}}"
          XMSC_WMQ_QUEUE_MANAGER: "{{queueManager}}"
          XMSC_WMQ_CONNECTION_MODE: "1"
          XMSC_USERID: "{{username}}"
          XMSC_PASSWORD: "{{password}}"
          XMSC_CLIENT_ID: "{{?clientId}}"
          XMSC_WMQ_SSL_CIPHER_SUITE: "{{?sslCipherSuite}}"
          XMSC_WMQ_CONNECTION_NAME_LIST: "{{?connectionNameList}}"
    from:
      uri: jms
      parameters:
        destinationType: "{{destinationType}}"
        destinationName: "{{destinationName}}"
        subscriptionDurable: "{{subscriptionDurable}}"
        subscriptionShared: "{{subscriptionShared}}"
        subscriptionName: "{{?subscriptionName}}"
        selector: "{{?selector}}"
        concurrentConsumers: "{{?concurrentConsumers}}"
        transacted: "{{?transacted}}"
        acknowledgementModeName: "{{?acknowledgementModeName}}"
        connectionFactory: "#bean:{{wmqConnectionFactory}}"
      steps:
        - to:
            uri: kamelet:sink
