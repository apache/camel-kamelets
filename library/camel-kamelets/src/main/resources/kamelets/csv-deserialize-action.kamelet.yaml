apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: csv-deserialize-action
  labels:
    camel.apache.org/kamelet.type: "action"
    camel.apache.org/kamelet.verified: "true"
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Actions"
    camel.apache.org/kamelet.namespace: "Transformation"
spec:
  definition:
    title: "CSV Deserialize Action"
    description: |-
      Turns CSV text, such as a file of comma-separated values, into a List of rows: each row is a Map from the column name to the value, or a List of the values.

      Use it to work on the records of a CSV file that a source such as `ftp-source`, `sftp-source` or `aws-s3-source` reads, for example to filter them or to send them on as JSON with `json-serialize-action`. To write rows as CSV text, use `csv-serialize-action`.

      Input: CSV text, as text, bytes or a stream; bytes and a stream are read as UTF-8. The values of a line are separated by `delimiter`. A value that holds the delimiter, a quote or a line break is put in quotes, with each quote in it doubled, as in `"Oslo, Norway"` or `"Bob ""B"""`. Lines end with a line feed, or a carriage return and a line feed.

      Output: the body is a List with one row for each line. With `header` true (the default) or `columns` set, each row is a Map from the column name to the value, in the order of the columns, and the header line is not a row. Otherwise each row is a List of the values. All values are text. The `Content-Type` header is removed.

      Good to know: a line with fewer values than columns gives a Map without the missing columns. Empty lines are skipped, unless `skipEmptyLines` is false: an empty line is then a row with one empty value. Empty text, or only a header line, gives an empty List. A message without a body, or with a quoted value that is not closed, fails. The whole text is read into memory. The delimiter and the quote are one character each. For tab-separated values, set `delimiter` to a tab in the application properties, such as `camel.kamelet.csv-deserialize-action.delimiter=\t`: a tab cannot be given as a parameter of the Kamelet in a route.
    type: object
    properties:
      delimiter:
        title: Delimiter
        description: "The character that separates the values of a line, such as `,` or `;`. One character."
        type: string
        default: ","
        example: ";"
      header:
        title: Header Line
        description: "Whether the first line holds the column names. Each row is then a Map keyed by these names, or by `columns` when it is set. Set it to false for a file without a header line: each row is then a List of the values, unless `columns` is set."
        type: boolean
        default: true
      columns:
        title: Column Names
        description: "The column names, separated by commas without spaces, such as `id,name,city`. Each row is then a Map keyed by these names. When `header` is true, the header line of the file is skipped and these names are used instead; when `header` is false, every line is a row. A name cannot hold a comma or a single quote (')."
        type: string
        example: "id,name,city"
        pattern: "^[^']*$"
      quote:
        title: Quote Character
        description: "The character that encloses a value that holds the delimiter, a quote or a line break. One character."
        type: string
        default: '"'
      skipEmptyLines:
        title: Skip Empty Lines
        description: "Whether to skip empty lines. When false, an empty line is a row with one empty value."
        type: boolean
        default: true
      trim:
        title: Trim Values
        description: "Whether to remove the spaces before and after each value and each column name."
        type: boolean
        default: false
  dataTypes:
    in:
      default: text
      types:
        text:
          format: "text-plain"
          description: "The CSV text, as text, bytes or a stream; bytes and a stream are read as UTF-8."
          mediaType: text/plain
    # No 'default:' here on purpose: no transformer keeps a List of Maps or a List of Lists as it is. See #3117.
    out:
      headers: {}
  dependencies:
  - "camel:kamelet"
  - "camel:csv"
  template:
    from:
      uri: kamelet:source
      steps:
        - choice:
            when:
              - expression:
                  simple:
                    expression: "'{{header}}' == 'true' || '{{?columns}}' != ''"
                steps:
                  - unmarshal:
                      csv:
                        delimiter: "{{delimiter}}"
                        header: "{{?columns}}"
                        ignoreEmptyLines: "{{skipEmptyLines}}"
                        quote: "{{quote}}"
                        skipHeaderRecord: "{{header}}"
                        trim: "{{trim}}"
                        useOrderedMaps: true
            otherwise:
              steps:
                - unmarshal:
                    csv:
                      delimiter: "{{delimiter}}"
                      ignoreEmptyLines: "{{skipEmptyLines}}"
                      quote: "{{quote}}"
                      trim: "{{trim}}"
        - removeHeader:
            name: Content-Type
