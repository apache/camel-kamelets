apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: google-pubsub-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Google Pubsub"
    camel.apache.org/kamelet.namespace: "GCP"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "Google Pubsub Source"
    description: |-
      Receives the messages of a Google Cloud Pub/Sub subscription, one message per Pub/Sub message, and acknowledges each one once it has been processed.

      Use it to react to events that other applications publish to a Pub/Sub topic, such as orders, uploads or alerts. To publish messages, use `google-pubsub-sink`. To react to new files in a Cloud Storage bucket through Pub/Sub notifications, use `google-storage-event-based-source`.

      Output: the body is the data of the Pub/Sub message, as bytes. The `CamelGooglePubsubMessageId` and `CamelGooglePubsubPublishTime` headers give the ID and the publish time of the message, `CamelGooglePubsubAttributes` gives its attributes as a Map, and each attribute is also set as a header of its own.

      Good to know: the subscription must already exist; for one that does not, it logs an error and receives nothing. A message whose processing fails is not acknowledged, so Pub/Sub delivers it again. With `ackMode` `NONE`, the route acknowledges each message itself, through the `CamelGooglePubsubAcknowledge` header. On a subscription with a dead-letter topic, `maxDeliveryAttempts` stops a message that keeps failing from being processed again. Without `serviceAccountKey`, it logs in with the Application Default Credentials of the environment where it runs.
    required:
      - projectId
      - subscriptionName
    type: object
    properties:
      projectId:
        title: Project ID
        description: The ID of the Google Cloud project that holds the subscription, as shown in the Google Cloud console. It is the project ID, not the project name or number.
        type: string
        example: my-project-123
      subscriptionName:
        title: Subscription Name
        description: The name of the subscription to read from, without the `projects/.../subscriptions/` part. Create it on the topic first, in the Google Cloud console or with `gcloud pubsub subscriptions create`.
        type: string
        example: orders-sub
      serviceAccountKey:
        title: Service Account Key
        description: "The JSON key of a service account that may read the subscription, encoded in Base64: create the key in the Google Cloud console under IAM & Admin > Service Accounts > Keys, then encode the downloaded file, for example with `base64 -w0 key.json`. When it is not set, the Application Default Credentials are used: the key file named in the `GOOGLE_APPLICATION_CREDENTIALS` environment variable, or the service account of the Google Cloud machine it runs on."
        type: binary
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      synchronousPull:
        title: Synchronous Pull
        description: If true, it asks Pub/Sub for messages in batches of up to `maxMessagesPerPoll`, instead of keeping a stream open that Pub/Sub pushes the messages through.
        type: boolean
        default: false
      maxMessagesPerPoll:
        title: Max Messages Per Poll
        description: The most messages to ask Pub/Sub for at once. Only used when `synchronousPull` is true.
        type: integer
        default: 1
      concurrentConsumers:
        title: Concurrent Consumers
        description: How many messages to receive and process in parallel, each in its own stream from the subscription.
        type: integer
        default: 1
      ackMode:
        title: Acknowledge Mode
        description: "When a message is acknowledged. `AUTO`: once it has been processed; a message whose processing fails is given back (nack), so that Pub/Sub delivers it again. `NONE`: never by the Kamelet; the route acknowledges each message itself, for example with the Simple expression `${header.CamelGooglePubsubAcknowledge.ack($\\{exchange})}`, or gives it back with `nack`. A message that is not acknowledged is delivered again: with `synchronousPull`, once the acknowledgement deadline of the subscription has passed; otherwise once `maxAckExtensionPeriod` has passed. When it is not set, it is `AUTO`."
        type: string
        enum: ["AUTO", "NONE"]
      maxDeliveryAttempts:
        title: Max Delivery Attempts
        description: A message that Pub/Sub has delivered this many times is given back (nack) without being processed. Pub/Sub delivers it again until the maximum of delivery attempts of the subscription is reached, and then moves it to the dead-letter topic. Pub/Sub only counts the deliveries on a subscription with a dead-letter topic; on another subscription, this option does nothing. When it is not set, the maximum of the dead-letter policy of the subscription is read when the Kamelet starts, which needs the permission `pubsub.subscriptions.get`; when it cannot be read, a warning is logged and there is no limit. Set it to 0 for no limit.
        type: integer
        example: 5
      maxAckExtensionPeriod:
        title: Max Ack Extension Period
        description: How long, in seconds, a message that has not been acknowledged yet is kept, by extending its acknowledgement deadline. After that time, Pub/Sub delivers it again. Only used when `synchronousPull` is false. When it is not set, it is 3600, one hour.
        type: integer
        example: 600
  dataTypes:
    out:
      headers:
        CamelGooglePubsubMessageId:
          title: Message ID
          description: The ID that Pub/Sub gave the message.
          type: string
        CamelGooglePubsubPublishTime:
          title: Publish Time
          description: When the message was published to the topic.
          type: object
        CamelGooglePubsubAttributes:
          title: Attributes
          description: The attributes of the message, as a Map of names to text values. Each attribute is also set as a header of its own.
          type: object
        CamelGooglePubsubDeliveryAttempt:
          title: Delivery Attempt
          description: How many times Pub/Sub has delivered the message, 1 the first time. Only set on a subscription with a dead-letter topic.
          type: integer
        CamelGooglePubsubAcknowledge:
          title: Acknowledge
          description: Only with `ackMode` `NONE`. The object to acknowledge the message with, by calling its `ack(exchange)` method, or to give it back with `nack(exchange)`.
          type: object
  dependencies:
    - "camel:kamelet"
    - "camel:google-pubsub"
    - "camel:jackson3"
  template:
    from:
      uri: "google-pubsub://{{projectId}}:{{subscriptionName}}?ackMode={{?ackMode}}&concurrentConsumers={{concurrentConsumers}}&maxAckExtensionPeriod={{?maxAckExtensionPeriod}}&maxDeliveryAttempts={{?maxDeliveryAttempts}}&maxMessagesPerPoll={{maxMessagesPerPoll}}&serviceAccountKey=RAW(base64:{{?serviceAccountKey}})&synchronousPull={{synchronousPull}}"
      steps:
        - to:
            uri: kamelet:sink
