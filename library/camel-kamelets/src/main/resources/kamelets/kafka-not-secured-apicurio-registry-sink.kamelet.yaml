apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: kafka-not-secured-apicurio-registry-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Kafka"
    camel.apache.org/kamelet.namespace: "Kafka"
  labels:
    camel.apache.org/kamelet.type: "sink"
spec:
  definition:
    title: "Kafka Not Secured with Apicurio Registry secured with Keycloak Sink"
    description: |-
      Sends each message as an Avro record to a topic in Apache Kafka, with the schema kept in an Apicurio Registry secured with Keycloak.

      Use it to publish records that other applications read with the schema of the registry, when the registry needs a Keycloak login and Kafka needs none. When the registry needs no login use `kafka-apicurio-registry-not-secured-sink`; for records without a schema use `kafka-sink`.

      Input: the body must be an Avro object, such as an Avro `GenericRecord` or an object of a class generated from the schema; it is written as Avro binary. A body of text is written as an Avro string, and so fails unless the schema is a string. The optional `key` header (or `ce-key`) becomes the key of the record, and the optional `partition-key` header (or `ce-partitionkey`) is the number of the partition to write to. The other headers of the message, except the Camel ones, are sent as record headers.

      Output: the message is unchanged.

      Good to know: The schema must already be in the registry, as the artifact `<topic>-value` (such as `orders-value`) in the default group: the Kamelet does not register it, and a message whose schema is not found fails with `ArtifactNotFoundException`. Kafka is not secured: it connects to the brokers with no login and no TLS.
    required:
      - topic
      - bootstrapServers
      - apicurioRegistryUrl
      - apicurioAuthServiceUrl
      - apicurioAuthRealm
      - apicurioAuthClientId
      - apicurioAuthClientSecret
      - apicurioAuthUsername
      - apicurioAuthPassword
    type: object
    properties:
      topic:
        title: Topic Name
        description: "The name of the topic to write the records to."
        type: string
        example: "orders"
      bootstrapServers:
        title: Bootstrap Servers
        description: "The address of one or more Kafka brokers to connect to first, as `host:port`, separated by commas. The other brokers of the cluster are found from them."
        type: string
        example: "broker1:9092,broker2:9092"
      valueSerializer:
        title: Value Serializer
        description: "The Java class that turns the body into the value of the record. The default writes Avro with the schema from the registry. Change it only to use another serializer of the Apicurio Registry library."
        type: string
        default: "io.apicurio.registry.serde.avro.AvroKafkaSerializer"
      apicurioRegistryUrl:
        title: Apicurio Registry URL
        description: "The URL of the API of the Apicurio Registry that holds the schemas, such as `http://registry:8080/apis/registry/v2`."
        type: string
        example: "http://registry.example.com:8080/apis/registry/v2"
      avroDatumProvider:
        title: Avro Datum Provider
        description: "How the body is turned into Avro. The default `io.apicurio.registry.serde.avro.DefaultAvroDatumProvider` takes an Avro `GenericRecord` or an object of a class generated from the schema; `io.apicurio.registry.serde.avro.ReflectAvroDatumProvider` maps any Java object to Avro by reflection."
        type: string
        default: "io.apicurio.registry.serde.avro.DefaultAvroDatumProvider"
      apicurioAuthServiceUrl:
        title: Keycloak URL
        description: "The URL of the Keycloak server that secures the registry."
        type: string
        example: "https://keycloak.example.com"
      apicurioAuthRealm:
        title: Keycloak Realm
        description: "The Keycloak realm in which the client and the user of the registry are defined."
        type: string
        example: "registry"
      apicurioAuthClientId:
        title: Keycloak Client ID
        description: "The ID of the Keycloak client that has access to the registry."
        type: string
      apicurioAuthClientSecret:
        title: Keycloak Client Secret
        description: "The secret of the Keycloak client `apicurioAuthClientId`, from the Credentials tab of the client in the Keycloak admin console."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      apicurioAuthUsername:
        title: Registry Username
        description: "The user name to log in to the registry with, through Keycloak."
        type: string
      apicurioAuthPassword:
        title: Registry Password
        description: "The password of `apicurioAuthUsername`."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
  dataTypes:
    in:
      headers:
        key:
          title: Key
          description: "Optional. The key of the record. `ce-key` is used when it is not set."
          type: string
        ce-key:
          title: CloudEvents Key
          description: "Optional. The key of the record, when `key` is not set."
          type: string
        partition-key:
          title: Partition Key
          description: "Optional. The number of the partition to write the record to. `ce-partitionkey` is used when it is not set."
          type: integer
        ce-partitionkey:
          title: CloudEvents Partition Key
          description: "Optional. The number of the partition to write the record to, when `partition-key` is not set."
          type: integer
  dependencies:
    - "camel:kamelet"
    - "camel:kafka"
    - "mvn:io.apicurio:apicurio-registry-serdes-avro-serde:2.4.14.Final"
  template:
    from:
      uri: kamelet:source
      steps:
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[key]}"
                steps:
                  - setHeader:
                      name: CamelKafkaKey
                      expression:
                        simple:
                          expression: "${header[key]}"
              - expression:
                  simple:
                    expression: "${header[ce-key]}"
                steps:
                  - setHeader:
                      name: CamelKafkaKey
                      expression:
                        simple:
                          expression: "${header[ce-key]}"
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[partition-key]}"
                steps:
                  - setHeader:
                      name: CamelKafkaPartitionKey
                      expression:
                        simple:
                          expression: "${header[partition-key]}"
              - expression:
                  simple:
                    expression: "${header[ce-partitionkey]}"
                steps:
                  - setHeader:
                      name: CamelKafkaPartitionKey
                      expression:
                        simple:
                          expression: "${header[ce-partitionkey]}"
        - to:
            uri: kafka
            parameters:
              topic: "{{topic}}"
              additionalProperties.apicurio.auth.client.id: "{{apicurioAuthClientId}}"
              additionalProperties.apicurio.auth.client.secret: "{{apicurioAuthClientSecret}}"
              additionalProperties.apicurio.auth.password: "{{apicurioAuthPassword}}"
              additionalProperties.apicurio.auth.realm: "{{apicurioAuthRealm}}"
              additionalProperties.apicurio.auth.service.url: "{{apicurioAuthServiceUrl}}"
              additionalProperties.apicurio.auth.username: "{{apicurioAuthUsername}}"
              additionalProperties.apicurio.registry.avroDatumProvider: "{{avroDatumProvider}}"
              additionalProperties.apicurio.registry.url: "{{apicurioRegistryUrl}}"
              brokers: "{{bootstrapServers}}"
              valueSerializer: "{{valueSerializer}}"
