apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: aws-ddb-streams-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "AWS DynamoDB Streams"
    camel.apache.org/kamelet.namespace: "AWS"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "AWS DynamoDB Streams Source"
    description: |-
      Receives the changes made to the items of an Amazon DynamoDB table from its stream, one message per inserted, modified or removed item.

      Use it to react when data changes in a table, for example to copy new orders to another system, keep a search index or a cache up to date, or record an audit trail. To write items into a table, use `aws-ddb-sink`.

      Output: the body is a JSON object, as JSON text, that describes one change: `eventName` is `INSERT`, `MODIFY` or `REMOVE`, and `dynamodb` holds the key of the item (`keys`) and, depending on the view type of the stream, the item before (`oldImage`) and after (`newImage`) the change, with the type of each attribute. The headers give the ID and the name of the event.

      Good to know: DynamoDB Streams must be enabled on the table, with the view type that holds the images you need, such as new and old images. By default it reads only the changes made after it starts.
    required:
      - table
      - region
    type: object
    properties:
      table:
        title: Table Name
        description: The name of the DynamoDB table to receive the changes of. DynamoDB Streams must be enabled on the table.
        type: string
        example: orders
      accessKey:
        title: Access Key
        description: "The access key ID of an IAM user, which AWS gives when you create an access key for the user (in the AWS console: IAM, Users, Security credentials). Use it together with `secretKey`, or leave both empty and set `useDefaultCredentialsProvider` or `useProfileCredentialsProvider` instead."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      secretKey:
        title: Secret Key
        description: The secret access key that goes with `accessKey`. AWS shows it only once, when the access key is created.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      region:
        title: AWS Region
        description: The AWS region of the table, such as `eu-west-1`.
        type: string
        example: eu-west-1
        enum: ["ap-south-1", "eu-south-1", "us-gov-east-1", "me-central-1", "ca-central-1", "eu-central-1", "us-iso-west-1", "us-west-1", "us-west-2", "af-south-1", "eu-north-1", "eu-west-3", "eu-west-2", "eu-west-1", "ap-northeast-3", "ap-northeast-2", "ap-northeast-1", "me-south-1", "sa-east-1", "ap-east-1", "cn-north-1", "us-gov-west-1", "ap-southeast-1", "ap-southeast-2", "us-iso-east-1", "ap-southeast-3", "us-east-1", "us-east-2", "cn-northwest-1", "us-isob-east-1", "aws-global", "aws-cn-global", "aws-us-gov-global", "aws-iso-global", "aws-iso-b-global"]
      streamIteratorType:
        title: Stream Iterator Type
        description: "Where to start reading: `FROM_LATEST` receives only the changes made after the Kamelet starts; `FROM_START` first receives all the changes still kept in the stream, which can take a while before it catches up."
        type: string
        default: FROM_LATEST
        enum: ["FROM_LATEST", "FROM_START"]
      useDefaultCredentialsProvider:
        title: Default Credentials Provider
        description: "If true, the credentials are found the way the AWS SDK finds them: from the `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY` environment variables, the shared credentials file, or the IAM role of the machine, container or pod it runs on. Then `accessKey` and `secretKey` are not needed."
        type: boolean
        default: false
      useProfileCredentialsProvider:
        title: Profile Credentials Provider
        description: If true, the credentials are read from a profile of the AWS credentials file (`~/.aws/credentials`), the one named in `profileCredentialsName`.
        type: boolean
        default: false
      useSessionCredentials:
        title: Session Credentials
        description: "If true, it logs in with temporary credentials, such as those of an assumed IAM role: `accessKey`, `secretKey` and `sessionToken` together."
        type: boolean
        default: false
      profileCredentialsName:
        title: Profile Credentials Name
        description: The name of the profile to use from the AWS credentials file. Only used when `useProfileCredentialsProvider` is true.
        type: string
      sessionToken:
        title: Session Token
        description: The session token of temporary credentials, which AWS gives together with their access key and secret key. Only used when `useSessionCredentials` is true.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      uriEndpointOverride:
        title: Overwrite Endpoint URI
        description: The address to send the requests to instead of the usual AWS address, such as `http://localhost:4566` for LocalStack. Only used when `overrideEndpoint` is true.
        type: string
        example: http://localhost:4566
      overrideEndpoint:
        title: Endpoint Overwrite
        description: If true, the requests go to the address in `uriEndpointOverride` instead of AWS, for example to test against LocalStack.
        type: boolean
        default: false
      delay:
        title: Delay
        description: How long to wait between two reads of the stream, in milliseconds.
        type: integer
        default: 500
  dataTypes:
    out:
      default: json
      headers:
        CamelAwsDdbStreamEventSource:
          title: Event Source
          description: The AWS service the change comes from, `aws:dynamodb`.
          type: string
        CamelAwsDdbStreamEventId:
          title: Event ID
          description: A unique ID of the change.
          type: string
        CamelAwsDdbStreamEventName:
          title: Event Name
          description: The kind of change, `INSERT`, `MODIFY` or `REMOVE`.
          type: string
      types:
        json:
          format: "application-json"
          description: Default Json representation of a DDB Stream Event.
          mediaType: application/json
        cloudevents:
          format: "aws2-ddbstream:application-cloudevents"
          description: Data type transformer converts AWS Dynamo DB Streams get records response to CloudEvent v1_0 data format. The data type sets Camel specific CloudEvent headers with values extracted from AWS Dynamo DB Streams get records.
          headers:
            CamelCloudEventID:
              title: CloudEvent ID
              description: The Camel exchange id set as event id.
              type: string
            CamelCloudEventType:
              title: CloudEvent Type
              description: The event type.
              default: "org.apache.camel.event.aws.ddbstream.getRecords"
              type: string
            CamelCloudEventSource:
              title: CloudEvent Source
              description: The event source. By default, the DDB Stream Event source receipt handle with prefix "aws.ddbstream.".
              type: string
            CamelCloudEventSubject:
              title: CloudEvent Subject
              description: The event subject. The DDB Stream Event Id.
              type: string
            CamelCloudEventTime:
              title: CloudEvent Time
              description: The exchange creation timestamp as event time.
              type: string
  dependencies:
  - "camel:gson"
  - "camel:aws2-ddb"
  - "camel:kamelet"
  template:
    from:
      uri: aws2-ddbstream
      parameters:
        tableName: "{{table}}"
        accessKey: "RAW({{?accessKey}})"
        delay: "{{delay}}"
        overrideEndpoint: "{{overrideEndpoint}}"
        profileCredentialsName: "{{?profileCredentialsName}}"
        region: "{{region}}"
        secretKey: "RAW({{?secretKey}})"
        sessionToken: "RAW({{?sessionToken}})"
        streamIteratorType: "{{streamIteratorType}}"
        uriEndpointOverride: "{{?uriEndpointOverride}}"
        useDefaultCredentialsProvider: "{{useDefaultCredentialsProvider}}"
        useProfileCredentialsProvider: "{{useProfileCredentialsProvider}}"
        useSessionCredentials: "{{useSessionCredentials}}"
      steps:
        - transformDataType:
            toType: aws2-ddb:application-x-struct
        - to:
            uri: kamelet:sink
