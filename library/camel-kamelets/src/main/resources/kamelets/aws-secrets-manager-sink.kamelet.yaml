apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: aws-secrets-manager-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "AWS Secrets Manager"
    camel.apache.org/kamelet.namespace: "AWS"
  labels:
    camel.apache.org/kamelet.type: "sink"
spec:
  definition:
    title: "AWS Secrets Manager Sink"
    description: |-
      Creates a secret in AWS Secrets Manager for each message, with the body as its value, or changes or reads the value of an existing secret.

      Use it to store passwords, API keys or certificates that another system generates, so that your applications can read them from Secrets Manager, to rotate such a value, or to read one inside a route.

      Input: the body is the value of the secret, as text, for example a password, or several values as a JSON object in JSON text. With `operation` set to `getSecret`, the body is not used. For `createSecret`, the name of the new secret comes from the `secret-name` header, else from the `ce-secret-name` header; without either, the ID of the message is used as the name. `updateSecret` and `getSecret` work on the secret in `secretId`.

      Output: when it is used inside a route, the body afterwards is the answer of AWS, a `CreateSecretResponse` object of the AWS SDK for Java with the ARN, the name and the version ID of the new secret; for `updateSecret`, an `UpdateSecretResponse` with the ARN, the name and the new version ID. For `getSecret`, the body is the value of the secret, as text, or as bytes for a binary secret, and the `CamelAwsSecretsManagerSecretVersionId` header holds the ID of its version.

      Good to know: by default it only creates secrets, and a message for a name that already exists fails. Set `operation` to `updateSecret` to change the value of the existing secret in `secretId`, or to `getSecret` to read it; both fail when `secretId` is not set or the secret does not exist. A message without a name header creates a secret with a generated name, such as `4D678616B8AFAA1-0000000000000002`. With `binaryPayload`, the body is stored as the binary value of the secret instead of as text. To reach AWS through an HTTP proxy, set `proxyHost` and `proxyPort`, and set `proxyProtocol` to `HTTP` for a proxy that takes plain HTTP, such as Squid. Headers that start with `CamelAwsSecretsManager` are removed from the message first, so they cannot change what the Kamelet does.
    required:
      - region
    type: object
    properties:
      accessKey:
        title: Access Key
        description: "The access key ID of an IAM user, which AWS gives when you create an access key for the user (in the AWS console: IAM, Users, Security credentials). Use it together with `secretKey`, or leave both empty and set `useDefaultCredentialsProvider` or `useProfileCredentialsProvider` instead."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      secretKey:
        title: Secret Key
        description: The secret access key that goes with `accessKey`. AWS shows it only once, when the access key is created.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      region:
        title: AWS Region
        description: The AWS region to create the secrets in, such as `eu-west-1`.
        type: string
        example: eu-west-1
        enum: ["ap-south-1", "eu-south-1", "us-gov-east-1", "me-central-1", "ca-central-1", "eu-central-1", "us-iso-west-1", "us-west-1", "us-west-2", "af-south-1", "eu-north-1", "eu-west-3", "eu-west-2", "eu-west-1", "ap-northeast-3", "ap-northeast-2", "ap-northeast-1", "me-south-1", "sa-east-1", "ap-east-1", "cn-north-1", "us-gov-west-1", "ap-southeast-1", "ap-southeast-2", "us-iso-east-1", "ap-southeast-3", "us-east-1", "us-east-2", "cn-northwest-1", "us-isob-east-1", "aws-global", "aws-cn-global", "aws-us-gov-global", "aws-iso-global", "aws-iso-b-global"]
      useDefaultCredentialsProvider:
        title: Default Credentials Provider
        description: "If true, the credentials are found the way the AWS SDK finds them: from the `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY` environment variables, the shared credentials file, or the IAM role of the machine, container or pod it runs on. Then `accessKey` and `secretKey` are not needed."
        type: boolean
        default: false
      useProfileCredentialsProvider:
        title: Profile Credentials Provider
        description: If true, the credentials are read from a profile of the AWS credentials file (`~/.aws/credentials`), the one named in `profileCredentialsName`.
        type: boolean
        default: false
      useSessionCredentials:
        title: Session Credentials
        description: "If true, it logs in with temporary credentials, such as those of an assumed IAM role: `accessKey`, `secretKey` and `sessionToken` together."
        type: boolean
        default: false
      profileCredentialsName:
        title: Profile Credentials Name
        description: The name of the profile to use from the AWS credentials file. Only used when `useProfileCredentialsProvider` is true.
        type: string
      sessionToken:
        title: Session Token
        description: The session token of temporary credentials, which AWS gives together with their access key and secret key. Only used when `useSessionCredentials` is true.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      uriEndpointOverride:
        title: Overwrite Endpoint URI
        description: The address to connect to instead of AWS, as a URL such as `http://localhost:4566` for LocalStack. Only used when `overrideEndpoint` is true.
        example: http://localhost:4566
        type: string
      overrideEndpoint:
        title: Endpoint Overwrite
        description: If true, it connects to the address in `uriEndpointOverride` instead of to AWS. Use it for a local stand-in of AWS such as LocalStack.
        type: boolean
        default: false
      proxyHost:
        title: Proxy Host
        description: The host name or IP address of an HTTP proxy to send the calls to AWS through, such as the proxy of a company network. Used only together with `proxyPort`. When it is not set, the calls go straight to AWS.
        type: string
        pattern: "^[A-Za-z0-9._-]+$"
        example: proxy.example.com
      proxyPort:
        title: Proxy Port
        description: The port of the proxy in `proxyHost`, such as `3128` for Squid. Used only together with `proxyHost`.
        type: integer
        example: 3128
      proxyProtocol:
        title: Proxy Protocol
        description: "How to talk to the proxy itself: `HTTP` or `HTTPS`. It is not the protocol of the calls to AWS, which stay encrypted, as the proxy only passes them on. When it is not set, it is `HTTPS`, which needs a proxy that takes TLS connections. Most company proxies, such as Squid, take plain HTTP: set `HTTP` for them. With the wrong one, every call fails, for example with `Unsupported or unrecognized SSL message`."
        type: string
        enum: ["HTTP", "HTTPS"]
        example: HTTP
      operation:
        title: Operation
        description: "What to do with each message: `createSecret` creates a new secret with the body as its value; `updateSecret` stores the body as the new value of an existing secret, as a new version; `getSecret` reads the current value of an existing secret into the body. `createSecret` names the new secret from the `secret-name` header; `updateSecret` and `getSecret` work on the secret in `secretId`, which they need."
        type: string
        default: createSecret
        example: updateSecret
        enum: ["createSecret", "updateSecret", "getSecret"]
      secretId:
        title: Secret ID
        description: "The name or the ARN of the secret that `updateSecret` and `getSecret` work on, such as `prod/db-password`. Required for these two operations: without it, each of their messages fails with `The secretId option must be set`. Not used by `createSecret`."
        type: string
        pattern: "^[A-Za-z0-9/_+=.@:-]+$"
        example: prod/db-password
      binaryPayload:
        title: Binary Payload
        description: If true, `createSecret` and `updateSecret` store the bytes of the body as the binary value of the secret (`SecretBinary`), for example a keystore file, instead of as text (`SecretString`). `getSecret` gives the bytes of a binary secret whatever this option says. When it is not set, the value is stored as text.
        type: boolean
        example: true
  dataTypes:
    in:
      headers:
        secret-name:
          title: Secret Name
          description: The name of the secret to create, such as `prod/db-password`. When it is not set, `ce-secret-name` is used, and without either the ID of the message.
          type: string
        ce-secret-name:
          title: Secret Name (CloudEvents)
          description: The name of the secret to create, when the message is a CloudEvent. Used only when `secret-name` is not set.
          type: string
    out:
      headers:
        CamelAwsSecretsManagerSecretVersionId:
          title: Secret Version ID
          description: Set by `getSecret`; the ID of the version of the secret that was read.
          type: string
  dependencies:
    - "camel:aws-secrets-manager"
    - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: CamelAwsSecretsManager*
        - choice:
            when:
              - expression:
                  simple:
                    expression: "'{{operation}}' == 'createSecret'"
                steps:
                  - choice:
                      when:
                        - expression:
                            simple:
                              expression: "${header[secret-name]}"
                          steps:
                            - setHeader:
                                name: CamelAwsSecretsManagerSecretName
                                expression:
                                  simple:
                                    expression: "${header[secret-name]}"
                        - expression:
                            simple:
                              expression: "${header[ce-secret-name]}"
                          steps:
                            - setHeader:
                                name: CamelAwsSecretsManagerSecretName
                                expression:
                                  simple:
                                    expression: "${header[ce-secret-name]}"
                      otherwise:
                        steps:
                          - setHeader:
                              name: CamelAwsSecretsManagerSecretName
                              expression:
                                simple:
                                  expression: "${exchangeId}"
            otherwise:
              steps:
                - choice:
                    when:
                      - expression:
                          simple:
                            expression: "'{{?secretId}}' == ''"
                        steps:
                          - throwException:
                              exceptionType: java.lang.IllegalArgumentException
                              message: "The secretId option must be set for the {{operation}} operation"
                    otherwise:
                      steps:
                        - setHeader:
                            name: CamelAwsSecretsManagerSecretId
                            expression:
                              constant:
                                expression: "{{?secretId}}"
        - to:
            uri: aws-secrets-manager
            parameters:
              label: kamelet
              accessKey: "RAW({{?accessKey}})"
              operation: "{{operation}}"
              profileCredentialsName: "{{?profileCredentialsName}}"
              region: "{{region}}"
              secretKey: "RAW({{?secretKey}})"
              sessionToken: "RAW({{?sessionToken}})"
              overrideEndpoint: "{{overrideEndpoint}}"
              uriEndpointOverride: "{{?uriEndpointOverride}}"
              useDefaultCredentialsProvider: "{{useDefaultCredentialsProvider}}"
              useProfileCredentialsProvider: "{{useProfileCredentialsProvider}}"
              useSessionCredentials: "{{useSessionCredentials}}"
              proxyHost: "{{?proxyHost}}"
              proxyPort: "{{?proxyPort}}"
              proxyProtocol: "{{?proxyProtocol}}"
              binaryPayload: "{{?binaryPayload}}"
