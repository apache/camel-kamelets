apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: smpp-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "SMPP"
    camel.apache.org/kamelet.namespace: "Messaging"
  labels:
    camel.apache.org/kamelet.type: "sink"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "SMPP Sink"
    description: |-
      Sends each message as an SMS text message to a mobile phone, through an SMS center (SMSC) that speaks the SMPP protocol.

      Use it to send alerts, one-time codes or notifications by SMS, through an SMS provider or operator that offers SMPP access. Use `smpp-source` to receive SMS replies and delivery receipts.

      Input: the body is the text of the SMS. The phone number to send it to comes from the `CamelSmppDestAddr` header when it is set, and from `destAddr` otherwise. A text longer than one SMS (160 characters, or 70 with `alphabet` `8`) is split, cut or refused, as `splittingPolicy` says.

      Output: the message is unchanged, with the IDs that the SMSC gave the SMS in the `CamelSmppId` header (a List), and how many SMS were sent in `CamelSmppSentMessageCount`.

      Good to know: the defaults of `sourceAddr` (1616) and `destAddr` (1717) are test numbers: set them, or set `CamelSmppDestAddr` on each message. It asks the SMSC for a delivery receipt of each SMS, which `smpp-source` receives: set `registeredDelivery` to `0` to not ask for them. The text is encoded with `encoding`, so characters it cannot hold, such as Cyrillic or emoji in ISO-8859-1, are sent as `?`: for text in any language, set `alphabet` and `dataCoding` to `8`. It logs in to the SMSC when the integration starts, and the integration fails to start when the SMSC cannot be reached. It connects with no TLS unless `usingSSL` is true. Headers that start with `CamelSmpp`, except `CamelSmppDestAddr`, are removed from the message first, so they cannot change what the Kamelet does.
    required:
    - host
    type: object
    properties:
      host:
        title: "Host"
        description: "The host name or IP address of the SMSC (the SMS center of your SMS provider or operator)."
        type: string
        example: "smsc.example.com"
      port:
        title: "Port"
        description: "The port of the SMSC. 2775 is the usual SMPP port."
        type: integer
        default: 2775
      systemId:
        title: "System ID"
        description: "The user name, called system ID in SMPP, to log in to the SMSC with. Your SMS provider gives it."
        type: string
        default: smppclient
        x-descriptors:
        - urn:camel:group:credentials
      password:
        title: "Password"
        description: "The password to log in to the SMSC with. Your SMS provider gives it."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      systemType:
        title: "System Type"
        description: "A short label of at most 13 characters that some SMSCs ask for when logging in. Leave it empty unless your SMS provider gives one."
        type: string
        example: "cp"
      sourceAddr:
        title: "Sender Address"
        description: "The sender of the SMS, as the recipient sees it: a phone number, a short code or, when the SMSC allows it, a name. The default, 1616, is a test value."
        example: "4512345678"
        type: string
        default: "1616"
      destAddr:
        title: "Recipient Address"
        description: "The phone number to send the SMS to, used when the message has no `CamelSmppDestAddr` header. The default, 1717, is a test value."
        example: "4598765432"
        type: string
        default: "1717"
      encoding:
        title: "Encoding"
        description: "The character set of the text of the SMS, such as `ISO-8859-1` or `UTF-8`."
        type: string
        default: "ISO-8859-1"
      splittingPolicy:
        title: "Splitting Policy"
        description: "What to do with a text longer than one SMS (160 characters, or 70 with `alphabet` `8`): `ALLOW` splits it into several SMS, `TRUNCATE` cuts it to fit in one SMS, and `REJECT` fails the message."
        type: string
        default: ALLOW
        enum: ["ALLOW", "TRUNCATE", "REJECT"]
      usingSSL:
        title: "Use TLS"
        description: "Whether to secure the connection to the SMSC with TLS (the smpps protocol). The SMSC must support it, usually on another port."
        type: boolean
        default: false
      registeredDelivery:
        title: "Delivery Receipt"
        description: "Which delivery receipts to ask the SMSC for: `1` for a receipt whether the SMS reached the phone or not, `2` only when it failed, and `0` for none. When it is not set, it is `1`. The SMSC sends the receipts to a receiver logged in to it, such as `smpp-source`: this Kamelet does not get them."
        type: integer
        enum: [0, 1, 2]
        example: 0
      sourceAddrTon:
        title: "Sender Type Of Number"
        description: "The type of number (TON) of `sourceAddr`: `0` unknown, `1` international, `2` national, `3` network specific, `4` subscriber number, `5` alphanumeric (a name instead of a number), `6` abbreviated. When it is not set, it is `0`. Use `5` to send from a name, such as `MyShop`, and `1`, with `1` in `sourceAddrNpi`, for a number with its country code."
        type: integer
        enum: [0, 1, 2, 3, 4, 5, 6]
        example: 5
      sourceAddrNpi:
        title: "Sender Numbering Plan"
        description: "The numbering plan indicator (NPI) of `sourceAddr`: `0` unknown, `1` ISDN (E.164, the plan of phone numbers), `3` data (X.121), `4` telex, `6` land mobile (E.212), `8` national, `9` private, `10` ERMES, `14` internet (IP), `18` WAP client ID. When it is not set, it is `0`."
        type: integer
        enum: [0, 1, 3, 4, 6, 8, 9, 10, 14, 18]
        example: 1
      destAddrTon:
        title: "Recipient Type Of Number"
        description: "The type of number (TON) of the recipient address, from `destAddr` or `CamelSmppDestAddr`: `0` unknown, `1` international, `2` national, `3` network specific, `4` subscriber number, `5` alphanumeric, `6` abbreviated. When it is not set, it is `0`. Use `1`, with `1` in `destAddrNpi`, for a phone number with its country code, such as `4598765432`."
        type: integer
        enum: [0, 1, 2, 3, 4, 5, 6]
        example: 1
      destAddrNpi:
        title: "Recipient Numbering Plan"
        description: "The numbering plan indicator (NPI) of the recipient address: `0` unknown, `1` ISDN (E.164, the plan of phone numbers), `3` data (X.121), `4` telex, `6` land mobile (E.212), `8` national, `9` private, `10` ERMES, `14` internet (IP), `18` WAP client ID. When it is not set, it is `0`."
        type: integer
        enum: [0, 1, 3, 4, 6, 8, 9, 10, 14, 18]
        example: 1
      dataCoding:
        title: "Data Coding"
        description: "The data coding the SMS is marked with, from 0 to 127, which tells the phone how to read its bytes, as in section 5.2.19 of the SMPP 3.4 specification: `0` the default alphabet of the SMSC, `3` Latin-1, `4` 8-bit binary, `8` UCS-2 (Unicode). When it is not set, it is `0`. It does not change how the text is encoded into bytes, which `alphabet` and `encoding` do: for text in any language, such as Cyrillic or emoji, set both `alphabet` and `dataCoding` to `8`."
        type: integer
        minimum: 0
        maximum: 127
        example: 8
      alphabet:
        title: "Alphabet"
        description: "How to turn the body into the bytes of the SMS: `0` encodes the text with `encoding`, `4` sends a body of bytes as it is (8-bit binary data) and encodes text with `encoding`, and `8` encodes the text as UCS-2 (UTF-16), which can hold text in any language. When it is not set, it is `0`, and characters that `encoding` cannot hold, such as Cyrillic in ISO-8859-1, are sent as `?`. It does not change the data coding the SMS is marked with: set `dataCoding` to the same value."
        type: integer
        enum: [0, 4, 8]
        example: 8
      enquireLinkTimer:
        title: "Enquire Link Interval"
        description: "How often to check that the connection to the SMSC is alive with an enquire_link, in milliseconds. When it is not set, it is 60000, which is one minute. A lower value finds a lost connection sooner."
        type: integer
        minimum: 1
        example: 30000
  dataTypes:
    in:
      headers:
        CamelSmppDestAddr:
          title: "Recipient Address"
          description: "Optional. The phone number to send this SMS to, instead of `destAddr`."
          type: string
  dependencies:
    - "camel:smpp"
    - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: CamelSmpp*
            excludePattern: CamelSmppDestAddr
        - to:
            uri: smpp
            parameters:
              host: "{{host}}"
              port: "{{port}}"
              destAddr: "{{destAddr}}"
              encoding: "{{encoding}}"
              password: "RAW({{?password}})"
              sourceAddr: "{{sourceAddr}}"
              splittingPolicy: "{{splittingPolicy}}"
              systemId: "RAW({{systemId}})"
              systemType: "{{?systemType}}"
              usingSSL: "{{usingSSL}}"
              registeredDelivery: "{{?registeredDelivery}}"
              sourceAddrTon: "{{?sourceAddrTon}}"
              sourceAddrNpi: "{{?sourceAddrNpi}}"
              destAddrTon: "{{?destAddrTon}}"
              destAddrNpi: "{{?destAddrNpi}}"
              dataCoding: "{{?dataCoding}}"
              alphabet: "{{?alphabet}}"
              enquireLinkTimer: "{{?enquireLinkTimer}}"
