apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: debezium-postgresql-source
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Debezium"
    camel.apache.org/kamelet.namespace: "Database"
  labels:
    camel.apache.org/kamelet.type: "source"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "Debezium PostgreSQL Source"
    description: |-
      Sends a message for each row inserted, updated or deleted in the tables of a PostgreSQL database, as it happens (change data capture with Debezium).

      Use it to pass the changes of a database on to another system as they happen, for example to keep a search index or a cache up to date, or to copy new orders to a queue, without polling the tables. To read rows with a query again and again, use `postgresql-source`.

      Output: the body is JSON text in bytes, an object with the column names as keys, such as `{"id":1,"name":"Tea","price":4.50}`: the row after the change, and for a delete the row before it. The columns can come in any order. A `NUMERIC` column is a JSON number with its decimals, such as `4.50`, and a `DATE` column the number of days since 1970-01-01, such as `20454` for 2026-01-01. The `debezium-operation` header says what happened: `c` (insert), `u` (update), `d` (delete) or `r` (a row read by the snapshot, see `snapshotMode`). `debezium-table` is the table, as `schema.table` such as `public.orders`, and `debezium-key` the primary key of the row as JSON text, such as `{"id":1}`. `Content-Type` is `application/json`.

      Good to know: the server must run with `wal_level=logical`, and the user needs the `REPLICATION` attribute and the right to read the tables. On the first start, the Kamelet creates a replication slot named `slotName` and a publication named `publicationName` in the database, and by default sends every row of the tables first (`snapshotMode`). It saves how far it got in the file `offsetStorageFileName`, or in a Kafka topic, when it stops and once a minute while it runs, and after a restart it goes on from there, so after a crash the changes of the last minute can be sent again. Keep the file on a disk that outlives the integration, such as a volume in Kubernetes, and make sure its folder exists: otherwise nothing is saved, and after a restart everything is sent again as on the first start. The slot keeps the changes in the database until the Kamelet has read them, so a slot that is no longer read lets the disk of the server fill up: drop it with `SELECT pg_drop_replication_slot('debezium')`. For a delete, PostgreSQL logs only the primary key of the row unless the table has `REPLICA IDENTITY FULL`, so by default a deleted row has only its key columns set, and the others are `null`. Any other option of the Debezium PostgreSQL connector can be set for all the Kamelets of the integration as the `camel.component.debezium-postgres.` property of that option, such as `camel.component.debezium-postgres.columnExcludeList=public.customers.ssn`.
    required:
      - serverName
      - username
      - password
      - databaseName
      - topicPrefix
    type: object
    properties:
      serverName:
        title: Server Name
        description: The host name or IP address of the PostgreSQL server, without the port. It must be the primary server, not a read replica.
        type: string
        example: db.example.com
      serverPort:
        title: Server Port
        description: The port the PostgreSQL server listens on. PostgreSQL uses 5432 unless it was set up otherwise.
        type: integer
        default: 5432
      username:
        title: Username
        description: The database user to log in as. It needs the `REPLICATION` attribute, the right to read the tables and, unless the publication already exists, the right to create it (to create a publication for all tables, the user must be a superuser).
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      password:
        title: Password
        description: The password of the database user `username`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      databaseName:
        title: Database Name
        description: The name of the database whose changes to send.
        type: string
        example: shop
      topicPrefix:
        title: Logical Name
        description: A name for this source of changes, made of letters, digits, `.`, `_` and `-`. The saved position is stored under this name, so keep it the same across restarts, and give each Kamelet that reads another database its own name.
        type: string
        pattern: "^[a-zA-Z0-9._-]+$"
        example: shop
      tableIncludeList:
        title: Tables
        description: The tables whose changes to send, as regular expressions that match `schema.table`, separated by commas, such as `public.orders,public.customers`. When it is not set, the changes of all tables are sent.
        type: string
        example: public.orders,public.customers
      snapshotMode:
        title: Snapshot Mode
        description: "Whether to send the rows that are already in the tables before the changes. `initial` (the default): on the first start, every row of the tables is sent with the operation `r`, then the changes; after a restart with a saved position, only the changes since. `no_data`: only the changes made from the first start on. `always`: every row on each start, then the changes. `initial_only`: every row on the first start, and no changes. `when_needed`: as `initial`, and every row again when the saved position can no longer be found in the database."
        type: string
        enum: ["initial", "no_data", "always", "initial_only", "when_needed"]
        default: initial
      slotName:
        title: Replication Slot
        description: The name of the PostgreSQL replication slot that keeps the changes until the Kamelet has read them, made of lowercase letters, digits and `_`. It is created when it does not exist. Each Kamelet that reads the same database needs its own slot.
        type: string
        pattern: "^[a-z0-9_]+$"
        default: debezium
      publicationName:
        title: Publication
        description: The name of the PostgreSQL publication that says which tables are logged for the Kamelet, made of letters, digits and `_`. See `publicationAutocreateMode` for whether it is created.
        type: string
        pattern: "^[a-zA-Z0-9_]+$"
        default: dbz_publication
      publicationAutocreateMode:
        title: Create Publication
        description: "Whether the Kamelet creates the publication when it does not exist. `all_tables` (the default): for all tables, which needs a superuser. `filtered`: for the tables of `tableIncludeList` only, which needs only to own them. `disabled`: never; the Kamelet fails to start when the publication does not exist. `no_tables`: for no table, so that the tables can be added to it later. An existing publication is used as it is."
        type: string
        enum: ["all_tables", "filtered", "disabled", "no_tables"]
        default: all_tables
      pluginName:
        title: Decoding Plugin
        description: "The PostgreSQL plugin that decodes the changes. `pgoutput` is built into PostgreSQL 10 and newer. `decoderbufs` must be installed on the server."
        type: string
        enum: ["pgoutput", "decoderbufs"]
        default: pgoutput
      offsetStorageFileName:
        title: Position File
        description: The file where the Kamelet saves how far it got, such as `/data/offsets.dat`, read again after a restart. It is created when it does not exist, but its folder must exist, or nothing is saved. A relative name is in the folder the integration runs in. When it is lost, the changes are sent again as on the first start. Not used when `offsetStorage` is the Kafka store.
        type: string
        default: debezium-postgresql-offsets.dat
        example: /data/offsets.dat
      offsetStorage:
        title: Position Store
        description: "Where the Kamelet saves how far it got. `org.apache.kafka.connect.storage.FileOffsetBackingStore` (the default): in the file `offsetStorageFileName`. `org.apache.kafka.connect.storage.KafkaOffsetBackingStore`: in the Kafka topic `offsetStorageTopic`, on the Kafka of `offsetStorageBootstrapServers`, for an integration that has no lasting disk."
        type: string
        enum: ["org.apache.kafka.connect.storage.FileOffsetBackingStore", "org.apache.kafka.connect.storage.KafkaOffsetBackingStore"]
        default: org.apache.kafka.connect.storage.FileOffsetBackingStore
      offsetStorageBootstrapServers:
        title: Position Kafka Brokers
        description: The Kafka brokers of the Kafka store, as `host:port` separated by commas. Needed with the Kafka store. The connection is made without TLS and without a login.
        type: string
        example: my-cluster-kafka-bootstrap:9092
      offsetStorageTopic:
        title: Position Topic
        description: The Kafka topic where the Kafka store saves how far the Kamelet got. It is created when it does not exist. Needed with the Kafka store.
        type: string
        example: shop-offsets
      offsetStoragePartitions:
        title: Position Topic Partitions
        description: The number of partitions of the topic `offsetStorageTopic` when the Kamelet creates it. Needed with the Kafka store.
        type: integer
        example: 1
      offsetStorageReplicationFactor:
        title: Position Topic Replicas
        description: The number of copies of the topic `offsetStorageTopic` on the Kafka brokers when the Kamelet creates it. Needed with the Kafka store.
        type: integer
        example: 3
  dataTypes:
    out:
      default: json
      types:
        json:
          format: "application-json"
          description: "The row after the change, or before it for a delete, as JSON text in bytes."
          mediaType: application/json
      headers:
        debezium-operation:
          title: Operation
          description: "What happened to the row: `c` (insert), `u` (update), `d` (delete) or `r` (read by the snapshot)."
          type: string
        debezium-table:
          title: Table
          description: The table of the row, as `schema.table`, such as `public.orders`.
          type: string
        debezium-key:
          title: Key
          description: The primary key of the row, as JSON text such as `{"id":1}`.
          type: string
        Content-Type:
          title: Content Type
          description: Always `application/json`, as the body is JSON text.
          type: string
  dependencies:
    - "camel:jackson3"
    - "camel:kamelet"
    - "camel:debezium-postgres"
  template:
    from:
      uri: debezium-postgres
      parameters:
        name: "{{topicPrefix}}"
        databaseHostname: "{{serverName}}"
        databasePort: "{{serverPort}}"
        databaseUser: "{{username}}"
        databasePassword: "RAW({{password}})"
        databaseDbname: "{{databaseName}}"
        topicPrefix: "{{topicPrefix}}"
        tableIncludeList: "{{?tableIncludeList}}"
        snapshotMode: "{{snapshotMode}}"
        slotName: "{{slotName}}"
        publicationName: "{{publicationName}}"
        publicationAutocreateMode: "{{publicationAutocreateMode}}"
        pluginName: "{{pluginName}}"
        offsetStorage: "{{offsetStorage}}"
        offsetStorageFileName: "{{offsetStorageFileName}}"
        offsetStorageTopic: "{{?offsetStorageTopic}}"
        offsetStoragePartitions: "{{?offsetStoragePartitions}}"
        offsetStorageReplicationFactor: "{{?offsetStorageReplicationFactor}}"
        additionalProperties.bootstrap.servers: "{{?offsetStorageBootstrapServers}}"
      steps:
        # only the changes of rows: not the tombstones, heartbeats or logical decoding messages, which have no row
        - filter:
            expression:
              simple:
                expression: "${header.CamelDebeziumOperation} in 'c,u,d,r'"
            steps:
              - setHeader:
                  name: debezium-operation
                  expression:
                    simple:
                      expression: "${header.CamelDebeziumOperation}"
              - setHeader:
                  name: debezium-table
                  expression:
                    simple:
                      expression: "${header.CamelDebeziumSourceMetadata[schema]}.${header.CamelDebeziumSourceMetadata[table]}"
              # the key as JSON text
              - choice:
                  when:
                    - expression:
                        simple:
                          expression: "${header.CamelDebeziumKey} != null"
                      steps:
                        - setProperty:
                            name: debezium-row
                            expression:
                              simple:
                                expression: "${body}"
                        - setBody:
                            expression:
                              simple:
                                expression: "${header.CamelDebeziumKey}"
                        - convertBodyTo:
                            type: java.util.Map
                        - marshal:
                            json: {}
                        - setHeader:
                            name: debezium-key
                            expression:
                              simple:
                                expression: "${bodyAs(String)}"
                        - setBody:
                            expression:
                              simple:
                                expression: "${exchangeProperty.debezium-row}"
                        - removeProperty:
                            name: debezium-row
              # a delete has no row after it: send the row before it
              - choice:
                  when:
                    - expression:
                        simple:
                          expression: "${header.CamelDebeziumOperation} == 'd'"
                      steps:
                        - setBody:
                            expression:
                              simple:
                                expression: "${header.CamelDebeziumBefore}"
              - convertBodyTo:
                  type: java.util.Map
              - marshal:
                  json: {}
              # the Kafka Connect objects of the component, which other systems cannot read
              - removeHeaders:
                  pattern: CamelDebezium*
              - to:
                  uri: kamelet:sink
