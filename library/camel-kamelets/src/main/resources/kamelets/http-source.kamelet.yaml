apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: http-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "HTTP"
    camel.apache.org/kamelet.namespace: "HTTP"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "HTTP Source"
    description: |-
      Fetches a web address with an HTTP GET request at a regular interval, and sends each response as a message.

      Use it to poll a REST API, a feed or a status page for its current data, for example fetch the state of the orders every minute. To receive the requests that other systems send instead, use `webhook-source`.

      Output: the body is the body of the response, as bytes. The headers of the response, such as `Content-Type`, are copied to the message, and `CamelHttpResponseCode` holds the status code.

      Good to know: it fetches the address every `period` and sends a message for each response, even when the data has not changed. A response with a status code outside `okStatusCodeRange`, which is `200-299` when it is not set, sends no message: the error is logged, and the address is fetched again at the next period. Log in either with `authUsername` and `authPassword`, with a static token in `authBearerToken`, or with `oauth2ClientId`, `oauth2ClientSecret` and `oauth2TokenEndpoint`: the Kamelet then gets a token from that URL and sends it as a Bearer token. The certificate of an `https://` service is checked against the certificate authorities that Java trusts. To trust a private one with Camel JBang or Camel Main, set the application properties `camel.ssl.enabled=true`, `camel.ssl.trustStore`, `camel.ssl.trustStorePassword` and `camel.component.https.useGlobalSslContextParameters=true`: that trust store then replaces the one of Java for every `https://` call of the application.
    required:
    - url
    type: object
    properties:
      period:
        title: Period between Updates
        description: How long to wait between two requests, in milliseconds. The default, 10000, is ten seconds.
        type: integer
        default: 10000
        example: 60000
      contentType:
        title: Content Type
        description: The value of the `Accept` header of the request, which tells the service the kind of response you want, such as `application/json` or `text/csv`.
        type: string
        default: "application/json"
        example: text/csv
      url:
        title: URL
        description: The address to fetch, with the path and any query parameters. It must start with `http://` or `https://`.
        type: string
        example: "https://api.example.com/v1/orders/status"
        pattern: "^(http|https)://.*"
      okStatusCodeRange:
        title: OK Status Codes
        description: The status codes of a response that is sent as a message, as ranges such as `200-299` and single codes, separated by commas without spaces. When it is not set, it is `200-299`. List the 2xx codes too, for example `200-299,404` to also send the 404 responses.
        type: string
        example: "200-299,404"
        pattern: "^[0-9]{3}(-[0-9]{3})?(,[0-9]{3}(-[0-9]{3})?)*$"
      authMethod:
        title: Authentication Method
        description: The login method, `Basic`, `Digest`, `NTLM`, or `Bearer` to send `authBearerToken`. Basic and Digest login with `authUsername` and `authPassword` work without it.
        type: string
        example: Basic
      authenticationPreemptive:
        title: Authentication Preemptive
        description: If true, `authUsername` and `authPassword` are sent with Basic login, or `authBearerToken` as a Bearer token, on the first request. If false, they are sent only after the service answers 401 and asks for them, which takes a second request.
        type: boolean
        default: false
      authUsername:
        title: Authentication Username
        description: The user to log in as, together with `authPassword`.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      authPassword:
        title: Authentication Password
        description: The password of `authUsername`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      authBearerToken:
        title: Bearer Token
        description: A static token, such as an API key, sent in the `Authorization` header as `Bearer` followed by the token. Set `authMethod` to `Bearer` with it. Also set `authenticationPreemptive` to true, unless the service first answers 401 with a `WWW-Authenticate` header that asks for a Bearer token.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      oauth2ClientId:
        title: OAuth2 Client ID
        description: The client ID of the application, as registered with the OAuth 2.0 provider. With `oauth2ClientSecret`, it is used to get a token from `oauth2TokenEndpoint` (client credentials grant).
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      oauth2ClientSecret:
        title: OAuth2 Client Secret
        description: The client secret of the application, as given by the OAuth 2.0 provider.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      oauth2TokenEndpoint:
        title: OAuth2 Token URL
        description: The URL to get the tokens from, as given by the OAuth 2.0 provider. The Kamelet logs in to it with `oauth2ClientId` and `oauth2ClientSecret`.
        type: string
        example: https://login.example.com/oauth2/token
        x-descriptors:
        - urn:camel:group:credentials
      oauth2Scope:
        title: OAuth2 Scope
        description: The scope to ask for in the token request, when the OAuth 2.0 provider needs one.
        type: string
        example: orders.write
        x-descriptors:
        - urn:camel:group:credentials
  dataTypes:
    out:
      headers:
        CamelHttpResponseCode:
          title: Status Code
          description: The HTTP status code of the response, such as 200.
          type: integer
        Content-Type:
          title: Content Type
          description: The content type of the response, as sent by the service, such as `application/json`.
          type: string
  dependencies:
    - "camel:http"
    - "camel:kamelet"
    - "camel:timer"
  template:
    from:
      uri: timer
      parameters:
        timerName: fetch
        period: "{{period}}"
      steps:
        - setHeader:
            name: Accept
            expression:
              constant:
                expression: "{{contentType}}"
        - to:
            uri: "{{url}}"
            parameters:
              authMethod: "{{?authMethod}}"
              authUsername: "{{?authUsername}}"
              authPassword: "RAW({{?authPassword}})"
              authBearerToken: "RAW({{?authBearerToken}})"
              oauth2ClientId: "RAW({{?oauth2ClientId}})"
              oauth2ClientSecret: "RAW({{?oauth2ClientSecret}})"
              oauth2Scope: "{{?oauth2Scope}}"
              oauth2TokenEndpoint: "{{?oauth2TokenEndpoint}}"
              authenticationPreemptive: "{{authenticationPreemptive}}"
              okStatusCodeRange: "{{?okStatusCodeRange}}"
        - to:
            uri: kamelet:sink
