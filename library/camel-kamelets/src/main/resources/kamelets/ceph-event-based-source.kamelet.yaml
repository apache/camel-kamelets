apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: ceph-event-based-source
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Ceph"
    camel.apache.org/kamelet.namespace: "Cloud"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "Ceph Event Based Source"
    description: |-
      Receives the bucket notifications that a Ceph Object Gateway sends to a Kafka topic, one message per event, such as a file added to or deleted from a bucket.

      Use it to react as soon as a file is uploaded to or removed from a Ceph bucket, without reading the bucket over and over. Set `getObject` to true to receive the content of each new file. To read and remove the files of a bucket instead, use `ceph-source`.

      Output: the body is the notification as JSON text, unchanged: a `Records` array that gives the event name (such as `ObjectCreated:Put`), the bucket name and the key of the file. The headers `ceph-event-id`, `ceph-opaque-data`, `ceph-object-metadata` and `ceph-object-tags` give the fields Ceph adds to the event; metadata and tags are a List of entries with a `key` and a `val`. Each header is also set with a `ce-` name, such as `ce-cepheventid`. With `getObject` true, the body of an `ObjectCreated` event is the content of the file instead, as a stream, with its content type in `CamelAwsS3ContentType`, and the other events come out as parsed JSON (a Jackson `JsonNode`), not as text.

      Good to know: the notification and its Kafka topic are set up on the Ceph side; this Kamelet only reads the topic. A record that is not a Ceph notification (without a `Records` array) fails. `saslAuthType` has no default and must be set; `NONE` connects to Kafka with no login and no TLS. Without `consumerGroup`, each start uses a new group, so with the default `autoOffsetReset` of `latest` the events sent while it was stopped are not read.
    required:
      - topic
      - bootstrapServers
      - saslAuthType
    type: object
    properties:
      topic:
        title: Topic Name
        description: The Kafka topic that the Ceph Object Gateway sends the bucket notifications to, as set in the push endpoint of the Ceph topic.
        type: string
        example: "ceph-bucket-notifications"
      bootstrapServers:
        title: Bootstrap Servers
        description: The address of one or more Kafka brokers to connect to first, as `host:port`, separated by commas.
        type: string
        example: "broker1:9092,broker2:9092"
      consumerGroup:
        title: Consumer Group
        description: The name of the Kafka consumer group. Kafka remembers how far the group has read, so a restart continues where it stopped. When it is not set, a new group is used at each start.
        type: string
        example: "my-group-id"
      autoOffsetReset:
        title: Auto Offset Reset
        description: Where to start when the consumer group has not read the topic before. `latest` reads only the events sent from now on, `earliest` reads the topic from its start, and `none` fails.
        type: string
        default: "latest"
        enum: ["latest", "earliest", "none"]
      saslAuthType:
        title: Authentication Type
        description: How to log in to Kafka. It has no default and must be set. `NONE` connects with no login and no TLS, as a local Kafka expects; `PLAIN`, `SCRAM_SHA_256` and `SCRAM_SHA_512` log in with `saslUsername` and `saslPassword`.
        type: string
        enum: ["NONE", "PLAIN", "SCRAM_SHA_256", "SCRAM_SHA_512", "SSL", "OAUTH", "AWS_MSK_IAM", "KERBEROS"]
      saslUsername:
        title: Username
        description: The user to log in to Kafka as. Required when `saslAuthType` is `PLAIN`, `SCRAM_SHA_256` or `SCRAM_SHA_512`.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      saslPassword:
        title: Password
        description: The password of `saslUsername`. Required when `saslAuthType` is `PLAIN`, `SCRAM_SHA_256` or `SCRAM_SHA_512`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      getObject:
        title: Get Object
        description: If true, for each `ObjectCreated` event the file is read from Ceph and becomes the body, instead of the notification. It needs `cephUrl`, `accessKey`, `secretKey` and `zoneGroup`.
        type: boolean
        default: false
      cephUrl:
        title: Ceph URL
        description: The address of the Ceph Object Gateway (RGW) to read the files from, as a URL with the scheme and the port. Required when `getObject` is true.
        type: string
        example: "http://ceph-rgw:8080"
      accessKey:
        title: Access Key
        description: The S3 access key of a Ceph Object Gateway user that can read the bucket. Required when `getObject` is true.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      secretKey:
        title: Secret Key
        description: The S3 secret key that goes with `accessKey`. Required when `getObject` is true.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      zoneGroup:
        title: Ceph Zone Group
        description: The name of the zone group of the Ceph Object Gateway, used as the region of the requests. Required when `getObject` is true.
        type: string
        example: "zonegroup1"
  dataTypes:
    out:
      headers:
        ceph-event-id:
          title: Event ID
          description: The ID of the event, unique for each event, to spot duplicates. Also set as `ce-cepheventid`.
          type: string
        ceph-opaque-data:
          title: Opaque Data
          description: The free-form text attached to the Ceph topic by whoever set it up, empty when none. Also set as `ce-cephopaquedata`.
          type: string
        ceph-object-metadata:
          title: Object Metadata
          description: The user metadata of the file (the `x-amz-meta-` attributes), as a List of entries with a `key` and a `val`. Also set as `ce-cephobjectmetadata`.
          type: array
        ceph-object-tags:
          title: Object Tags
          description: The tags of the file, as a List of entries with a `key` and a `val`. Also set as `ce-cephobjecttags`.
          type: array
  dependencies:
    - "camel:kafka"
    - "camel:jsonpath"
    - "camel:jackson3"
    - "camel:kamelet"
    - "camel:aws2-s3"
  template:
    from:
      uri: kafka
      parameters:
        topic: "{{topic}}"
        autoOffsetReset: "{{autoOffsetReset}}"
        brokers: "{{bootstrapServers}}"
        groupId: "{{?consumerGroup}}"
        saslAuthType: "{{saslAuthType}}"
        saslPassword: "RAW({{?saslPassword}})"
        saslUsername: "{{?saslUsername}}"
      steps:
        # Ceph extension fields, surfaced as headers so a consumer does not have
        # to re-parse the body for them. Named the way the catalog names source
        # output headers -- a plain form plus a CloudEvents one, as
        # infinispan-source and ftp-source do. s3.bucket.id is deliberately not
        # surfaced: it is an internal Ceph id useful only for debugging.
        - setHeader:
            name: ceph-event-id
            expression:
              jsonpath:
                expression: "$.Records[0].eventId"
        - setHeader:
            name: ce-cepheventid
            expression:
              simple:
                expression: "${header[ceph-event-id]}"
        - setHeader:
            name: ceph-opaque-data
            expression:
              jsonpath:
                expression: "$.Records[0].opaqueData"
        - setHeader:
            name: ce-cephopaquedata
            expression:
              simple:
                expression: "${header[ceph-opaque-data]}"
        - setHeader:
            name: ceph-object-metadata
            expression:
              jsonpath:
                expression: "$.Records[0].s3.object.metadata"
        - setHeader:
            name: ce-cephobjectmetadata
            expression:
              simple:
                expression: "${header[ceph-object-metadata]}"
        - setHeader:
            name: ceph-object-tags
            expression:
              jsonpath:
                expression: "$.Records[0].s3.object.tags"
        - setHeader:
            name: ce-cephobjecttags
            expression:
              simple:
                expression: "${header[ceph-object-tags]}"
        # Ceph emits the classic S3 notification envelope -- a Records array --
        # not the EventBridge shape that aws-s3-event-based-source parses, so the
        # paths below are Records based on purpose.
        - choice:
            precondition: true
            when:
              - expression:
                  simple:
                    expression: "${properties:getObject:false}"
                steps:
                  - unmarshal:
                      json:
                        unmarshalType: tools.jackson.databind.JsonNode
                  - setProperty:
                      name: ceph-event-name
                      expression:
                        jsonpath:
                          expression: "$.Records[0].eventName"
                  - choice:
                      when:
                        - expression:
                            simple:
                              expression: "${exchangeProperty.ceph-event-name} startsWith \"ObjectCreated\""
                          steps:
                            - setProperty:
                                name: ceph-object-key
                                expression:
                                  jsonpath:
                                    expression: "$.Records[0].s3.object.key"
                            - setProperty:
                                name: ceph-bucket-name
                                expression:
                                  jsonpath:
                                    expression: "$.Records[0].s3.bucket.name"
                            - toD:
                                uri: "aws2-s3:${exchangeProperty.ceph-bucket-name}?accessKey=RAW({{accessKey}})&secretKey=RAW({{secretKey}})&region={{zoneGroup}}&operation=getObject&keyName=${exchangeProperty.ceph-object-key}&uriEndpointOverride={{cephUrl}}&overrideEndpoint=true"
        - to:
            uri: kamelet:sink
