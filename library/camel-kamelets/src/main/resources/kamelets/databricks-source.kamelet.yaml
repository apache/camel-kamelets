apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: databricks-source
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "SQL"
    camel.apache.org/kamelet.namespace: "Database"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "Databricks Source"
    description: |-
      Runs an SQL query on a Databricks SQL warehouse or cluster again and again, and sends each row it returns as a message, as a JSON object.

      Use it to pick up the rows that another application adds to a table, such as new orders or events, and pass them on to another system. To write rows, use `databricks-sink`.

      Output: the body is one row as JSON text, an object with the column names as keys, such as `{"id":1,"username":"oscerd","city":"Rome"}`. The `Content-Type` header is `application/json`.

      Good to know: the query runs again `delay` milliseconds after the previous run, so the same rows are sent again and again, unless `consumedQuery` marks or deletes each row once it is sent and `query` leaves such rows out: for example `SELECT * FROM accounts WHERE processed = false` with `UPDATE accounts SET processed = true WHERE id = :#id`. When the next step fails for a row, `consumedQuery` is not run for it, and the row is read again. A query that finds no rows sends nothing. `query` cannot contain `?`, and `consumedQuery` cannot contain `&` or `+`. The format of date and time columns in the JSON depends on the Camel version.
    required:
      - serverHostname
      - httpPath
      - accessToken
      - query
    type: object
    properties:
      serverHostname:
        title: Server Hostname
        description: The host name of your Databricks workspace, without `https://`. Find it as Server hostname in the Connection details of the SQL warehouse or cluster.
        type: string
        example: adb-1234567890123456.7.azuredatabricks.net
      serverPort:
        title: Server Port
        description: The port to connect to. Databricks uses 443 (HTTPS).
        type: string
        default: 443
      httpPath:
        title: HTTP Path
        description: The path of the SQL warehouse or cluster to run the queries on. Find it as HTTP path in the Connection details of the SQL warehouse or cluster.
        type: string
        example: /sql/1.0/warehouses/abc123def456
      accessToken:
        title: Access Token
        description: A Databricks personal access token, created in the Developer part of the settings of your Databricks user. The Kamelet runs the queries as the user who created it.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      query:
        title: Query
        description: The SQL query to run on each poll, usually a SELECT. Each row it returns becomes a message.
        type: string
        example: SELECT * FROM accounts WHERE processed = false
      extraOptions:
        title: Extra Options
        description: More settings of the Databricks JDBC driver, added to the end of the connection string as they are. Start with `;` and separate the settings with `;`, such as `;ConnCatalog=main;ConnSchema=default` to choose the catalog and schema of Unity Catalog that `query` uses.
        type: string
        example: ;ConnCatalog=main;ConnSchema=default
        default: ''
      consumedQuery:
        title: Consumed Query
        description: An SQL statement to run after each row has been sent on, to mark the row as read or to delete it, so that `query` does not return it again. Write `:#column` where the value of a column of that row goes, such as `:#id`. When it is not set, nothing is changed, and the same rows are read on every poll.
        type: string
        example: UPDATE accounts SET processed = true WHERE id = :#id
      delay:
        title: Delay
        description: How long to wait after one run of `query` before the next, in milliseconds.
        type: integer
        default: 500
  types:
    out:
      mediaType: application/json
  dataTypes:
    out:
      headers:
        Content-Type:
          title: Content Type
          description: Always `application/json`, as the body is a JSON object.
          type: string
  dependencies:
  - "camel:jackson"
  - "camel:kamelet"
  - "camel:sql"
  - "mvn:com.databricks:databricks-jdbc:3.4.5"
  - "mvn:org.apache.commons:commons-dbcp2:2.14.0"
  template:
    beans:
      - name: local-sql-databricks-source
        type: "#class:org.apache.camel.component.sql.SqlComponent"
        properties:
          autowiredEnabled: "false"
      - name: dsBean
        type: "#class:org.apache.commons.dbcp2.BasicDataSource"
        properties:
          username: token
          password: "{{accessToken}}"
          url: "jdbc:databricks://{{serverHostname}}:{{serverPort}};httpPath={{httpPath}};AuthMech=3;transportMode=http;ssl=1{{extraOptions}}"
          driverClassName: com.databricks.client.jdbc.Driver
    from:
      uri: "{{local-sql-databricks-source}}:{{query}}?dataSource=#bean:{{dsBean}}&onConsume=RAW({{?consumedQuery}})&delay={{delay}}"
      steps:
        - marshal:
            json: {}
        - to:
            uri: kamelet:sink
