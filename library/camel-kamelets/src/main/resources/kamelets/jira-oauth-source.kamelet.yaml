apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: jira-oauth-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "JIRA"
    camel.apache.org/kamelet.namespace: "JIRA"
  labels:
    camel.apache.org/kamelet.type: "source"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "Jira oauth Source"
    description: |-
      Receives each new Jira issue that matches a JQL query, such as every new bug of a project, by asking Jira at a regular interval, and logs in with OAuth 1.0a.

      Use it to react to new tickets of a Jira Server or Data Center where an administrator has set up an application link with OAuth for your integration, for example to tell a team chat about a new bug. To log in with a user and an API token or a personal access token, which is simpler, use `jira-source`.

      Output: the body is the issue as JSON text in bytes, with fields such as `key`, `summary`, `description`, `status`, `issueType`, `project`, `reporter`, `assignee` and `priority`. The `Content-Type` header is `application/json`.

      Good to know: only the issues created after the Kamelet starts are sent; the issues that already exist are not, and neither are changes to an issue. It checks every 6 seconds. The four OAuth values come from the OAuth 1.0a authorization of the application link, see each option.
    required:
      - jiraUrl
      - accessToken
      - verificationCode
      - consumerKey
      - privateKey
      - jql
    type: object
    properties:
      jiraUrl:
        title: Jira URL
        description: The address of your Jira, as you open it in a browser, without a path.
        type: string
        example: https://jira.mycompany.com
      accessToken:
        title: Access Token
        description: The OAuth access token that Jira gives at the end of the OAuth 1.0a authorization, when the user has allowed the access.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      verificationCode:
        title: Verification Code
        description: The verification code (verifier) that Jira shows when the user allows the access, in the middle of the OAuth 1.0a authorization.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      consumerKey:
        title: Consumer Key
        description: The consumer key of the application link, as an administrator entered it in Jira under Application Links, for incoming authentication.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      privateKey:
        title: Private Key
        description: The RSA private key whose public key is set in the application link, in PKCS8 format and Base64 encoded, on one line, without the `-----BEGIN PRIVATE KEY-----` and `-----END PRIVATE KEY-----` lines.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      jql:
        title: JQL
        description: The JQL query that selects the issues to send, as in the advanced issue search of Jira, without `ORDER BY`.
        type: string
        example: project = SHOP AND issuetype = Bug
  types:
    out:
      mediaType: application/json
  dataTypes:
    out:
      default: json
      types:
        json:
          format: "application-json"
          description: "The issue, as JSON text in bytes."
          mediaType: application/json
  dependencies:
  - "camel:jackson3"
  - "camel:jira"
  - "camel:kamelet"
  - "mvn:tools.jackson.datatype:jackson-datatype-joda:3.2.4"
  template:
    from:
      uri: jira
      parameters:
        type: newIssues
        accessToken: "RAW({{accessToken}})"
        consumerKey: "RAW({{consumerKey}})"
        jiraUrl: "{{jiraUrl}}"
        jql: "{{jql}}"
        privateKey: "RAW({{privateKey}})"
        verificationCode: "RAW({{verificationCode}})"
      steps:
        - marshal:
            json:
              moduleClassNames: tools.jackson.datatype.joda.JodaModule
        - to:
            uri: kamelet:sink
