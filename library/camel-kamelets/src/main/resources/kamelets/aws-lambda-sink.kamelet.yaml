apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: aws-lambda-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "AWS Lambda"
    camel.apache.org/kamelet.namespace: "AWS"
  labels:
    camel.apache.org/kamelet.type: "sink"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "AWS Lambda Sink"
    description: |-
      Calls an AWS Lambda function for each message, with the body as the event of the function, and waits for its result.

      Use it to run your own serverless code on each message, such as enriching an order, checking a document or calling another API, without running a server for it.

      Input: the body is the event given to the function, as JSON text, such as `{"orderId":"A-1"}`, or as a Map or a List, which is written as JSON. Other text is sent as a JSON string: `hello` becomes `"hello"`. A number fails: send it as text.

      Output: when it is used inside a route, the body afterwards is what the function returned, as text (JSON text for most functions). The `CamelAwsLambdaStatusCode` header holds the status code of the call, and the `Content-Type` header is `application/json`.

      Good to know: an error raised inside the function does not fail the message: the body is then the error that the function reported, and the `CamelAwsLambdaFunctionError` header is set, for example to `Unhandled`. A function that does not exist fails the message. Each call waits until the function ends, unless `invocationType` is `Event`: the function is then called asynchronously, and the call answers at once with status code 202 and an empty body. With `DryRun`, the function is not run; the call only checks that it can be (status code 204). With `logType` set to `Tail`, the `CamelAwsLambdaLogResult` header holds the last 4 KB of the log of the call, base64-encoded. Set `operation` to read the settings, versions or aliases of the function instead of calling it, or to publish a new version; the body afterwards is then the answer of AWS, an object of the AWS SDK for Java, such as a `GetFunctionConfigurationResponse` (not JSON text). To reach AWS through an HTTP proxy, set `proxyHost` and `proxyPort`, and set `proxyProtocol` to `HTTP` for a proxy that takes plain HTTP, such as Squid. Headers that start with `CamelAwsLambda` are removed from the message first, so they cannot change what the Kamelet does.
    required:
      - function
      - region
    type: object
    properties:
      function:
        title: Function Name
        description: The name of the Lambda function to call, as shown in the Lambda console. The ARN of the function also works.
        type: string
        example: my-function
      accessKey:
        title: Access Key
        description: "The access key ID of an IAM user, which AWS gives when you create an access key for the user (in the AWS console: IAM, Users, Security credentials). Use it together with `secretKey`, or leave both empty and set `useDefaultCredentialsProvider` or `useProfileCredentialsProvider` instead."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      secretKey:
        title: Secret Key
        description: The secret access key that goes with `accessKey`. AWS shows it only once, when the access key is created.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      region:
        title: AWS Region
        description: The AWS region of the function, such as `eu-west-1`.
        type: string
        example: eu-west-1
        enum: ["ap-south-1", "eu-south-1", "us-gov-east-1", "me-central-1", "ca-central-1", "eu-central-1", "us-iso-west-1", "us-west-1", "us-west-2", "af-south-1", "eu-north-1", "eu-west-3", "eu-west-2", "eu-west-1", "ap-northeast-3", "ap-northeast-2", "ap-northeast-1", "me-south-1", "sa-east-1", "ap-east-1", "cn-north-1", "us-gov-west-1", "ap-southeast-1", "ap-southeast-2", "us-iso-east-1", "ap-southeast-3", "us-east-1", "us-east-2", "cn-northwest-1", "us-isob-east-1", "aws-global", "aws-cn-global", "aws-us-gov-global", "aws-iso-global", "aws-iso-b-global"]
      useDefaultCredentialsProvider:
        title: Default Credentials Provider
        description: "If true, the credentials are found the way the AWS SDK finds them: from the `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY` environment variables, the shared credentials file, or the IAM role of the machine, container or pod it runs on. Then `accessKey` and `secretKey` are not needed."
        type: boolean
        default: false
      useProfileCredentialsProvider:
        title: Profile Credentials Provider
        description: If true, the credentials are read from a profile of the AWS credentials file (`~/.aws/credentials`), the one named in `profileCredentialsName`.
        type: boolean
        default: false
      useSessionCredentials:
        title: Session Credentials
        description: "If true, it logs in with temporary credentials, such as those of an assumed IAM role: `accessKey`, `secretKey` and `sessionToken` together."
        type: boolean
        default: false
      profileCredentialsName:
        title: Profile Credentials Name
        description: The name of the profile to use from the AWS credentials file. Only used when `useProfileCredentialsProvider` is true.
        type: string
      sessionToken:
        title: Session Token
        description: The session token of temporary credentials, which AWS gives together with their access key and secret key. Only used when `useSessionCredentials` is true.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      uriEndpointOverride:
        title: Overwrite Endpoint URI
        description: The address to connect to instead of AWS, as a URL such as `http://localhost:4566` for LocalStack. Only used when `overrideEndpoint` is true.
        example: http://localhost:4566
        type: string
      overrideEndpoint:
        title: Endpoint Overwrite
        description: If true, it connects to the address in `uriEndpointOverride` instead of to AWS. Use it for a local stand-in of AWS such as LocalStack.
        type: boolean
        default: false
      proxyHost:
        title: Proxy Host
        description: The host name or IP address of an HTTP proxy to send the calls to AWS through, such as the proxy of a company network. Used only together with `proxyPort`. When it is not set, the calls go straight to AWS.
        type: string
        pattern: "^[A-Za-z0-9._-]+$"
        example: proxy.example.com
      proxyPort:
        title: Proxy Port
        description: The port of the proxy in `proxyHost`, such as `3128` for Squid. Used only together with `proxyHost`.
        type: integer
        example: 3128
      proxyProtocol:
        title: Proxy Protocol
        description: "How to talk to the proxy itself: `HTTP` or `HTTPS`. It is not the protocol of the calls to AWS, which stay encrypted, as the proxy only passes them on. When it is not set, it is `HTTPS`, which needs a proxy that takes TLS connections. Most company proxies, such as Squid, take plain HTTP: set `HTTP` for them. With the wrong one, every call fails, for example with `Unsupported or unrecognized SSL message`."
        type: string
        enum: ["HTTP", "HTTPS"]
        example: HTTP
      operation:
        title: Operation
        description: "What to do with each message: `invokeFunction` calls the function; `getFunction` and `getFunctionConfiguration` read the settings of the function, such as its runtime, memory and timeout (`getFunction` adds the location of its code and its tags); `listVersions` and `listAliases` list its published versions and aliases; `publishVersion` publishes the current code and settings as a new version; `listFunctions` lists all the functions of the region. Only `invokeFunction` uses the body. When it is not set, the function is called."
        type: string
        example: getFunctionConfiguration
        enum: ["invokeFunction", "getFunction", "getFunctionConfiguration", "listVersions", "listAliases", "publishVersion", "listFunctions"]
      invocationType:
        title: Invocation Type
        description: "How the function is called: `RequestResponse` waits until the function ends and gives its result; `Event` calls it asynchronously and answers at once with status code 202 and an empty body; `DryRun` only checks that the function can be called (status code 204). When not set, `RequestResponse`."
        type: string
        enum: ["RequestResponse", "Event", "DryRun"]
      logType:
        title: Log Type
        description: "Set to `Tail` to get the last 4 KB of the log of a `RequestResponse` call in the `CamelAwsLambdaLogResult` header, base64-encoded."
        type: string
        enum: ["None", "Tail"]
  dataTypes:
    in:
      default: json
      types:
        json:
          format: "application-json"
          description: "The event given to the function, as JSON text in bytes."
          mediaType: application/json
    out:
      headers:
        CamelAwsLambdaStatusCode:
          title: Status Code
          description: The HTTP status code of the call, such as `200`.
          type: integer
        CamelAwsLambdaFunctionError:
          title: Function Error
          description: Set when the function raised an error, for example to `Unhandled`; then the body is the error.
          type: string
  dependencies:
    - "camel:jackson3"
    - "camel:aws2-lambda"
    - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: CamelAwsLambda*
        - to:
            uri: aws2-lambda
            parameters:
              function: "{{function}}"
              accessKey: "RAW({{?accessKey}})"
              profileCredentialsName: "{{?profileCredentialsName}}"
              region: "{{region}}"
              secretKey: "RAW({{?secretKey}})"
              sessionToken: "RAW({{?sessionToken}})"
              overrideEndpoint: "{{overrideEndpoint}}"
              uriEndpointOverride: "{{?uriEndpointOverride}}"
              useDefaultCredentialsProvider: "{{useDefaultCredentialsProvider}}"
              useProfileCredentialsProvider: "{{useProfileCredentialsProvider}}"
              useSessionCredentials: "{{useSessionCredentials}}"
              proxyHost: "{{?proxyHost}}"
              proxyPort: "{{?proxyPort}}"
              proxyProtocol: "{{?proxyProtocol}}"
              operation: "{{?operation}}"
              invocationType: "{{?invocationType}}"
              logType: "{{?logType}}"
