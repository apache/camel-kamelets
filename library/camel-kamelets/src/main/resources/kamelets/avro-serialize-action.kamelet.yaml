apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: avro-serialize-action
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Actions"
    camel.apache.org/kamelet.namespace: "Transformation"
  labels:
    camel.apache.org/kamelet.type: "action"
spec:
  definition:
    title: "Avro Serialize Action"
    description: |-
      Turns each message, a JSON object, into Avro binary data that follows the Avro schema you give.

      Use it to send records in Avro, a compact binary format described by a schema, to a system that expects it, such as a Kafka topic whose readers decode Avro. To turn Avro back into JSON, use `avro-deserialize-action`; for Protobuf, use `protobuf-serialize-action`.

      Input: parsed JSON (a Map or a Jackson `JsonNode`) whose fields match the schema. JSON text fails: put `json-deserialize-action` before this action to parse it.

      Output: the body is the Avro binary data, as bytes, and the `Content-Type` header is set to `application/avro`.

      Good to know: the schema is not written into the data, so whoever reads it needs the same schema. A message fails when it lacks a field of the schema, has a field the schema does not know, or has a value of the wrong type. When `schema` is not set, the schema found by an earlier `resolve-pojo-schema-action` is used.
    type: object
    properties:
      schema:
        title: Schema
        description: "The Avro schema of the records, as JSON text: a record with a name and a list of fields, each with a name and a type. When it is not set, the schema found by an earlier `resolve-pojo-schema-action` is used."
        type: string
        example: '{"type": "record", "namespace": "com.example", "name": "FullName", "fields": [{"name": "first", "type": "string"},{"name": "last", "type": "string"}]}'
      validate:
        title: Validate
        description: "Meant to turn the check of the content against the schema on or off. It has no effect: a message that does not match the schema always fails."
        type: boolean
        default: true
  dataTypes:
    out:
      headers:
        Content-Type:
          title: Content Type
          description: Always `application/avro`.
          type: string
  dependencies:
  - "camel:kamelet"
  - "camel:jackson3-avro"
  template:
    beans:
      - name: schemaResolver
        type: "#class:org.apache.camel.component.jackson3.avro.transform.AvroSchemaResolver"
        properties:
          validate: "{{validate}}"
          schema: "{{schema:}}"
    from:
      uri: kamelet:source
      steps:
        - marshal:
            avro:
              unmarshalType: tools.jackson.databind.JsonNode
              library: Jackson
              schemaResolver: "#bean:{{schemaResolver}}"
        - setHeader:
            name: Content-Type
            expression:
              constant:
                expression: application/avro
