apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: google-vertexai-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Google Vertex AI"
    camel.apache.org/kamelet.namespace: "GCP"
  labels:
    camel.apache.org/kamelet.type: "sink"
spec:
  definition:
    title: "Google Vertex AI Sink"
    description: |-
      Sends each message as a prompt to a generative AI model in Google Vertex AI, such as Gemini, and replaces the body with the answer of the model.

      Use it to summarize, classify, translate or answer questions about text as it flows, for example to summarize support tickets or extract the topic of an email. To call a partner model of the Model Garden instead, such as Claude of Anthropic, set `operation` to `rawPredict` and `publisher`.

      Input: the body is the prompt, as text; bytes and streams are read as text. The optional `CamelGoogleVertexAIPrompt` header gives the prompt instead of the body. With `rawPredict`, the header is not used: the body is the prompt as text, or a JSON request in the format of the publisher, such as the Messages API of Anthropic, which is sent as it is, with `anthropic_version` added for Anthropic.

      Output: when it is used inside a route, the body afterwards is the answer of the model, as text, for the default `generateText` operation; with `jsonMode` set to true, it is JSON text. The `CamelGoogleVertexAIFinishReason` header says why the model stopped, and the token counts are in the `CamelGoogleVertexAIPromptTokenCount`, `CamelGoogleVertexAICandidatesTokenCount` and `CamelGoogleVertexAITotalTokenCount` headers. With `rawPredict` and the publisher `anthropic`, the body afterwards is the text of the answer, and the `CamelGoogleVertexAIRawResponse` header has the whole answer as JSON text; with another publisher, the body is the answer of the model as JSON text.

      Good to know: with a prompt as text and the publisher `anthropic`, `rawPredict` also sends `temperature`, `topP` and `topK`, as 0.7, 0.95 and 40 when they are not set, and `maxOutputTokens` as `max_tokens`, 1024 when it is not set. Send a JSON request as the body to choose the fields of the request yourself. Headers that start with `CamelGoogleVertexAI`, except `CamelGoogleVertexAIPrompt`, are removed from the message first, so they cannot change what the Kamelet does.
    required:
      - projectId
      - region
      - modelId
    type: object
    properties:
      projectId:
        title: Google Cloud Project ID
        description: The ID of the Google Cloud project where Vertex AI is enabled, as shown in the Google Cloud console. It is the project ID, not the project name or number.
        type: string
        example: my-project-123
      region:
        title: Google Cloud Region
        description: The Google Cloud region to call the model in, where the model is available. Vertex AI calls it the location.
        type: string
        example: us-central1
      modelId:
        title: Model ID
        description: The ID of the model to use, as listed in the Model Garden of the Vertex AI console.
        type: string
        example: gemini-2.5-flash
      serviceAccountKey:
        title: Service Account Key
        description: "Where to read the JSON key of a service account that may call Vertex AI, such as one with the Vertex AI User role: `file:` followed by the path of the key file, or `base64:` followed by the Base64 encoding of its content. Create the key in the Google Cloud console under IAM & Admin > Service Accounts > Keys. When it is not set, the Application Default Credentials are used: the key file named in the `GOOGLE_APPLICATION_CREDENTIALS` environment variable, or the service account of the Google Cloud machine it runs on."
        type: binary
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      operation:
        title: Operation
        description: What to ask the model for. `generateText` (the default), `generateChat` and `generateCode` answer the prompt with text, `generateImage` gives a List of images, `generateEmbeddings` gives one vector of numbers per text, and `generateMultimodal` sends media together with the prompt. `rawPredict` sends the body to a partner model of `publisher`, such as Claude.
        type: string
        default: generateText
        enum: ["generateText", "generateChat", "generateImage", "generateEmbeddings", "generateCode", "generateMultimodal", "rawPredict"]
      temperature:
        title: Temperature
        description: How random the answer is, a number from 0.0 to 1.0, such as `0.2`. Lower values give more predictable answers. When it is not set, 0.7 is used.
        type: string
        example: "0.2"
      maxOutputTokens:
        title: Max Output Tokens
        description: The most tokens (pieces of words) the answer may have, a whole number. When it is not set, 1024 is used.
        type: string
        example: "2048"
      topP:
        title: Top P
        description: Only choose each next word among the most likely ones whose probabilities add up to this number, from 0.0 to 1.0. When it is not set, 0.95 is used.
        type: string
        example: "0.95"
      topK:
        title: Top K
        description: Only choose each next word among this many most likely ones, a whole number. When it is not set, 40 is used.
        type: string
        example: "40"
      publisher:
        title: Model Publisher
        description: The publisher of a partner model of the Model Garden, for the `rawPredict` operation, such as `anthropic` for Claude, `meta` for Llama or `mistralai` for Mistral. The model of `modelId` is then called as `projects/<projectId>/locations/<region>/publishers/<publisher>/models/<modelId>`. Only used with `rawPredict`, which fails without it.
        type: string
        pattern: "^[a-z0-9-]+$"
        example: anthropic
      anthropicVersion:
        title: Anthropic Version
        description: The version of the Anthropic API to ask Claude for, sent as `anthropic_version` in each request, unless the JSON request of the body has one. When it is not set, `vertex-2023-10-16` is used. Only used with `rawPredict` and the publisher `anthropic`.
        type: string
        pattern: "^[A-Za-z0-9._-]+$"
        example: vertex-2023-10-16
      jsonMode:
        title: JSON Mode
        description: If true, the model is asked to answer with JSON (the response type `application/json`), so the body afterwards is JSON text. Say in the prompt which fields you want. Only used with `generateText`, `generateChat`, `generateCode` and `generateMultimodal`. When it is not set, it is false.
        type: boolean
  dataTypes:
    in:
      headers:
        CamelGoogleVertexAIPrompt:
          title: Prompt
          description: The prompt to send. When it is set, it is used instead of the body.
          type: string
    out:
      headers:
        CamelGoogleVertexAIFinishReason:
          title: Finish Reason
          description: Why the model stopped answering, such as `STOP` or `MAX_TOKENS`.
          type: string
        CamelGoogleVertexAIPromptTokenCount:
          title: Prompt Token Count
          description: The number of tokens of the prompt.
          type: integer
        CamelGoogleVertexAICandidatesTokenCount:
          title: Answer Token Count
          description: The number of tokens of the answer.
          type: integer
        CamelGoogleVertexAITotalTokenCount:
          title: Total Token Count
          description: The number of tokens of the prompt and the answer together.
          type: integer
        CamelGoogleVertexAIRawResponse:
          title: Raw Response
          description: With `rawPredict` and the publisher `anthropic`, the whole answer of the model, as JSON text.
          type: string
  dependencies:
    - "camel:kamelet"
    - "camel:google-vertexai"
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: CamelGoogleVertexAI*
            excludePattern: CamelGoogleVertexAIPrompt
        - to:
            uri: google-vertexai
            parameters:
              projectId: "{{projectId}}"
              location: "{{region}}"
              modelId: "{{modelId}}"
              anthropicVersion: "{{?anthropicVersion}}"
              jsonMode: "{{?jsonMode}}"
              maxOutputTokens: "{{?maxOutputTokens}}"
              operation: "{{operation}}"
              publisher: "{{?publisher}}"
              serviceAccountKey: "RAW({{?serviceAccountKey}})"
              temperature: "{{?temperature}}"
              topK: "{{?topK}}"
              topP: "{{?topP}}"
