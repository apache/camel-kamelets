apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: snowflake-source
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "SQL"
    camel.apache.org/kamelet.namespace: "Database"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "Snowflake Source"
    description: |-
      Runs an SQL query in a Snowflake database again and again, and sends each row it returns as a message, as a JSON object.

      Use it to pick up the rows that another application adds to a table, such as new orders or events, and pass them on to another system. To write rows, use `snowflake-sink`.

      Output: the body is one row as JSON text in bytes, an object with the column names as keys, such as `{"id":1,"username":"oscerd","city":"Rome"}`. The `Content-Type` header is `application/json`.

      Good to know: the query runs again `delay` milliseconds after the previous run, so the same rows are sent again and again, unless `consumedQuery` marks or deletes each row once it is sent and `query` leaves such rows out: for example `SELECT * FROM accounts WHERE processed = false` with `UPDATE accounts SET processed = true WHERE id = :#id`. When the next step fails for a row, `consumedQuery` is not run for it, and the row is read again. A query that finds no rows sends nothing. `query` cannot contain `?`. The format of date and time columns in the JSON depends on the Camel version. Log in with `password`, or with a key pair in `privateKey` or `privateKeyFile`: a Snowflake user of type SERVICE, meant for applications, cannot log in with a password. When a key is set, the password is not used. `warehouse`, `schema` and `role` choose what the session uses; when they are not set, the defaults of the user apply, and a user with no default warehouse cannot run a query that needs one. Each poll logs in to Snowflake anew, as the Kamelet keeps no connection open between polls.
    required:
      - instanceUrl
      - username
      - query
    type: object
    properties:
      instanceUrl:
        title: Account Host Name
        description: 'The host name of your Snowflake account, without `https://`: your account identifier followed by `.snowflakecomputing.com`, as in the address you open Snowflake at.'
        type: string
        example: myorg-myaccount.snowflakecomputing.com
      username:
        title: Username
        description: The Snowflake user to log in as. It needs the rights to run the queries of this Kamelet on their tables.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      password:
        title: Password
        description: The password of the Snowflake user `username`. Leave it empty to log in with a key pair instead, set in `privateKey` or `privateKeyFile`; when a key is set, the password is not used. A Snowflake user of type SERVICE cannot log in with a password, and Snowflake is phasing out sign-in with a password alone for the other users too. With neither a password nor a key, every connection fails with `Missing password`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      privateKey:
        title: Private Key
        description: 'The private key to log in with instead of a password: the key file in PEM format, encoded in base64 on a single line, such as the output of `base64 -w0 rsa_key.p8`. The PEM text itself, which starts with `-----BEGIN`, is not accepted. The matching public key must be set on the user with `ALTER USER ... SET RSA_PUBLIC_KEY`. Set this or `privateKeyFile`, not both: with both, every connection fails.'
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      privateKeyFile:
        title: Private Key File
        description: 'The path of the private key file to log in with instead of a password, in PEM format, such as `rsa_key.p8` made as the Snowflake guide to key-pair authentication shows. In Kubernetes, mount the Secret that holds the key as a file. The matching public key must be set on the user with `ALTER USER ... SET RSA_PUBLIC_KEY`. A path that does not exist makes every connection fail with `Invalid parameter value null`.'
        type: string
        example: /etc/snowflake/rsa_key.p8
      privateKeyPassphrase:
        title: Private Key Passphrase
        description: 'The passphrase of the key in `privateKey` or `privateKeyFile`, when the key is encrypted: its PEM text then starts with `-----BEGIN ENCRYPTED PRIVATE KEY-----`. Without it, or with a wrong one, every connection fails.'
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      query:
        title: Query
        description: The SQL query to run on each poll, usually a SELECT. Each row it returns becomes a message.
        type: string
        example: SELECT * FROM accounts WHERE processed = false
      databaseName:
        title: Database Name
        description: The Snowflake database that holds the tables `query` names.
        type: string
        example: SHOP
      schema:
        title: Schema
        description: The schema of `databaseName` that holds the tables `query` names, such as `PUBLIC`. When it is not set, the default of the user applies. A table of another schema can still be named in full in `query`, as `SCHEMA.TABLE`.
        type: string
        example: SALES
      warehouse:
        title: Warehouse
        description: The Snowflake virtual warehouse that runs the queries. When it is not set, the default warehouse of the user `username` is used, as set with `ALTER USER ... SET DEFAULT_WAREHOUSE`. With neither, a query that needs a warehouse fails.
        type: string
        example: COMPUTE_WH
      role:
        title: Role
        description: The Snowflake role to run the queries as, which must be granted to the user `username`. When it is not set, the default role of the user is used, as set with `ALTER USER ... SET DEFAULT_ROLE`.
        type: string
        example: READER
      consumedQuery:
        title: Consumed Query
        description: An SQL statement to run after each row has been sent on, to mark the row as read or to delete it, so that `query` does not return it again. Write `:#column` where the value of a column of that row goes, such as `:#id`. When it is not set, nothing is changed, and the same rows are read on every poll.
        type: string
        example: UPDATE accounts SET processed = true WHERE id = :#id
      delay:
        title: Delay
        description: How long to wait after one run of `query` before the next, in milliseconds.
        type: integer
        default: 500
  types:
    out:
      mediaType: application/json
  dataTypes:
    out:
      default: json
      headers:
        Content-Type:
          title: Content Type
          description: Always `application/json`, as the body is a JSON object.
          type: string
      types:
        json:
          format: "application-json"
          description: "One row as a JSON object, as JSON text in bytes."
          mediaType: application/json
  dependencies:
  - "camel:jackson3"
  - "camel:kamelet"
  - "camel:sql"
  - "mvn:net.snowflake:snowflake-jdbc:4.3.4"
  - "mvn:org.apache.commons:commons-dbcp2:2.14.0"
  template:
    beans:
      - name: local-sql-snowflake-source
        type: "#class:org.apache.camel.component.sql.SqlComponent"
        properties:
          autowiredEnabled: "false"
      - name: dsBean
        type: "#class:net.snowflake.client.api.datasource.SnowflakeDataSourceFactory"
        factoryMethod: createDataSource
        properties:
          user: "{{username}}"
          password: "{{password:}}"
          url: "jdbc:snowflake://{{instanceUrl}}"
          databaseName: "{{?databaseName}}"
          schema: "{{?schema}}"
          warehouse: "{{?warehouse}}"
          role: "{{?role}}"
          properties[private_key_base64]: "{{?privateKey}}"
          properties[private_key_file]: "{{?privateKeyFile}}"
          properties[private_key_pwd]: "{{?privateKeyPassphrase}}"
    from:
      uri: "{{local-sql-snowflake-source}}:{{query}}?dataSource=#bean:{{dsBean}}&onConsume=RAW({{?consumedQuery}})&delay={{delay}}"
      steps:
        - marshal:
            json: {}
        - to:
            uri: kamelet:sink
