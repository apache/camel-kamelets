apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: mongodb-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "MongoDB"
    camel.apache.org/kamelet.namespace: "Nosql"
  labels:
    camel.apache.org/kamelet.type: "sink"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "MongoDB Sink"
    description: |-
      Writes each message to a collection of a MongoDB database: inserts it as a new document, or, with `operation`, replaces or updates a stored document.

      Use it to store events, orders or other records as documents in MongoDB, for example each message that arrives on a Kafka topic, to keep a copy of records by their ID (`save`), or to change fields of a document, such as the stock of a product (`update`). To read documents, use `mongodb-source` or `mongodb-changes-stream-source`.

      Input: with `insert` (the default) and `save`, the body is one document, as a JSON object in text, such as `{"item":"book","qty":2}`. When it has no `_id` field, MongoDB gives the document a new ObjectId. With `update`, the body is a JSON array in text of two objects: the filter that selects the document and the changes, such as `[{"sku":"A1"},{"$set":{"qty":3}}]`. An ObjectId is written as `{"$oid":"..."}`. Text that is not JSON fails.

      Output: with `insert`, the body afterwards is the document that was stored, as a Map with its `_id`. With `save` and `update`, it is the result that MongoDB returns. With `insert` and `save`, the `CamelMongoOid` header holds the `_id` of the document. With `update`, the `CamelMongoDbRecordsMatched` and `CamelMongoDbRecordsAffected` headers say how many documents matched the filter and how many were changed.

      Good to know: with `insert`, a document whose `_id` is already in the collection fails; `save` replaces it instead. `save` replaces the whole document, so fields that are not in the body are removed. `update` changes only the first document that matches, and nothing when none matches, unless `upsert` is true. The `db-upsert` and `ce-dbupsert` headers are not used. With `createCollection` false, the default, the Kamelet fails to start when the collection does not exist yet. Set either `hosts` or `connectionString`. With `hosts`, it connects with TLS by default; set `ssl` to false for a MongoDB without TLS, such as a local one. With `connectionString`, such as the `mongodb+srv://` string of MongoDB Atlas, it connects only as that string says, and `hosts`, `username`, `password`, `ssl` and `sslValidationEnabled` are not used. For a user defined in a database other than `admin`, use `connectionString` with `authSource`. Headers that start with `CamelMongo` are removed from the message first, so they cannot change what the Kamelet does.
    required:
      - collection
      - database
    type: object
    properties:
      hosts:
        title: MongoDB Hosts
        description: The address of one or more MongoDB servers, as `host:port`, separated by commas. MongoDB uses port 27017 unless it was set up otherwise. For a replica set, list its members. Set either `hosts` or `connectionString`. When neither is set, the Kamelet fails to start with the error `The connection string contains an empty host`.
        type: string
        example: mongo1.example.com:27017,mongo2.example.com:27017
      connectionString:
        title: Connection String
        description: "The MongoDB connection string, which starts with `mongodb://` or `mongodb+srv://`, such as the one MongoDB Atlas shows under Connect. Use it instead of `hosts` for MongoDB Atlas, for a user defined in a database other than `admin` (add `authSource`, such as `?authSource=shop`), or for settings such as `replicaSet` or `tls`. When it is set, `hosts`, `username`, `password`, `ssl` and `sslValidationEnabled` are not used. TLS is used as the string says: always with `mongodb+srv://`, and with `mongodb://` only when it has `tls=true`. Write `@`, `/`, `:` and `%` in the user name or the password as `%40`, `%2F`, `%3A` and `%25`."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
        example: "mongodb+srv://myuser:mypassword@cluster0.abcde.mongodb.net/?retryWrites=true&w=majority"
      collection:
        title: MongoDB Collection
        description: The name of the collection to write the documents to.
        type: string
        example: orders
      password:
        title: MongoDB Password
        description: The password of the MongoDB user `username`. Write `@`, `/`, `:` and `%` in it as `%40`, `%2F`, `%3A` and `%25`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      username:
        title: MongoDB Username
        description: The MongoDB user to log in as, defined in the `admin` database. For a user defined in another database, use `connectionString` with `authSource` instead. Leave it empty for a MongoDB that does not ask for a login.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      ssl:
        title: Use TLS
        description: Whether to connect with TLS (SSL). Set it to false for a MongoDB that does not offer TLS. Not used with `connectionString`.
        type: boolean
        default: true
      sslValidationEnabled:
        title: Check TLS Certificate
        description: Whether to check the certificate and the host name of the server when `ssl` is true. Set it to false only for tests, as the connection can then be intercepted. Not used with `connectionString`.
        type: boolean
        default: true
      database:
        title: MongoDB Database
        description: The name of the database that holds the collection.
        type: string
        example: shop
      writeConcern:
        title: Write Concern
        description: How many MongoDB servers must confirm a write before it counts as done, such as `MAJORITY` for most members of a replica set. When it is not set, MongoDB acknowledges each write (`ACKNOWLEDGED`).
        type: string
        enum: ["ACKNOWLEDGED", "W1", "W2", "W3", "UNACKNOWLEDGED", "JOURNALED", "MAJORITY"]
      createCollection:
        title: Create Collection
        description: If true, the collection is created when the Kamelet starts, if it does not exist. If false, the Kamelet fails to start when the collection does not exist.
        type: boolean
        default: false
      operation:
        title: Operation
        description: "What to do with each message. `insert` adds the body as a new document, and fails when its `_id` is already in the collection. `save` replaces the document that has the `_id` of the body as a whole, or adds the body when there is none or the body has no `_id`. `update` changes the first document that matches a filter: the body is the filter and the changes, such as `[{\"sku\":\"A1\"},{\"$set\":{\"qty\":3}}]`, and the changes must use update operators such as `$set`, `$inc` or `$unset`."
        type: string
        enum: ["insert", "save", "update"]
        default: insert
      upsert:
        title: Insert When Missing
        description: Only used when `operation` is `update`. If true, a filter that matches no document inserts a new one, made of the fields of the filter and the changes, such as `{"sku":"A1","qty":3}`, and the next message with the same filter updates it. If false or not set, a filter that matches no document changes nothing.
        type: boolean
  types:
    in:
      mediaType: application/json
  dataTypes:
    # No 'default:' here on purpose. A default input type of json would run on
    # every message and turn a Map or a MongoDB Document body into JSON first:
    # an ObjectId would be stored as an object of its time and a date as text,
    # a silent change of the stored data. It would give the body type validator
    # nothing either, as only a binary input type does. See #3117.
    out:
      headers:
        CamelMongoOid:
          title: Document ID
          description: The `_id` of the document that was inserted or saved, an ObjectId when MongoDB made it. Only set by `insert` and `save`.
          type: string
        CamelMongoDbRecordsMatched:
          title: Documents Matched
          description: How many documents matched the filter of an `update`, 0 or 1. Only set by `update`.
          type: integer
        CamelMongoDbRecordsAffected:
          title: Documents Changed
          description: How many documents an `update` changed, 0 or 1. It is 0 when the document already had the values, and when `upsert` inserted a new one. Only set by `update`.
          type: integer
    in:
      headers: {}
  dependencies:
    - "camel:kamelet"
    - "camel:mongodb"
    - "camel:jackson3"
  template:
    beans:
      - name: mongo-client
        type: "#class:org.apache.camel.component.mongodb.SslAwareMongoClient"
        properties:
          password: "{{?password}}"
          username: "{{?username}}"
          hosts: "{{hosts:}}"
          ssl: "{{ssl}}"
          sslValidationEnabled: "{{sslValidationEnabled}}"
      - name: local-mongodb
        type: "#class:org.apache.camel.component.mongodb.MongoDbComponent"
        properties:
          mongoConnection: "#{{mongo-client}}"
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: CamelMongo*
        - choice:
            when:
              - expression:
                  simple:
                    expression: "'{{operation}}' == 'update' && ${body} !is 'java.util.List'"
                steps:
                  - convertBodyTo:
                      type: java.lang.String
        - choice:
            when:
              - expression:
                  simple:
                    expression: "'{{operation}}' == 'update' && '{{?upsert}}' != ''"
                steps:
                  - setHeader:
                      name: CamelMongoDbUpsert
                      expression:
                        constant:
                          expression: "{{?upsert}}"
        - to:
            uri: "{{local-mongodb}}:test?createCollection={{?createCollection}}&writeConcern={{?writeConcern}}&collection={{collection}}&database={{database}}&operation={{operation}}&connectionUriString=RAW({{?connectionString}})"
