apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: ogcapi-features-action
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Geospatial"
    camel.apache.org/kamelet.namespace: "Geo"
  labels:
    camel.apache.org/kamelet.type: "action"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "OGC Api Feature Get Item Action"
    description: |-
      Fetches the features of one collection, such as the lakes or the buildings of an area, from a server that implements the OGC API Features standard, and gives them as GeoJSON.

      Use it to bring map data from a geographic data service into a flow, for example to load the features of an area into a database or to check them against a list of places.

      Input: the body, when it is not empty, is added to the query of the request, as text such as `name=Lake Baikal`, so each message can ask for other features. An empty body asks only with the options.

      Output: the body is a GeoJSON feature collection, as JSON text in bytes, with at most `limit` features. The headers of the HTTP response, such as `Content-Type`, are set as headers.

      Good to know: `split` gives each feature as a message of its own, as JSON text in bytes with the `Content-Type` `application/json`, only when the Kamelet is called with the `kamelet` EIP. Called with `to`, as in a Pipe, the next step still gets the whole collection, once per message, as text. An HTTP error from the server, such as an unknown collection, fails the message. Headers that start with `CamelHttp` or `CamelRestHttp` are removed from the message first, so they cannot change what the Kamelet does. The login comes only from the options: an `Authorization` or `Proxy-Authorization` header on the message is removed, so a credential that came with the message is not sent on. Log in either with `authUsername` and `authPassword`, with a static token in `authBearerToken`, or with `oauth2ClientId`, `oauth2ClientSecret` and `oauth2TokenEndpoint`: the Kamelet then gets a token from that URL and sends it as a Bearer token. Without `authenticationPreemptive`, the user and password, or the static token, are sent only after the service asks for them with a 401 response. A service that cannot be reached within `connectTimeout`, or does not answer within `responseTimeout`, fails the message; when they are not set, it waits up to 3 minutes.
    required:
      - url
      - collection
    type: object
    properties:
      url:
        title: URL
        description: The address of the OGC API Features service, the part before `/collections`. It must start with `http://` or `https://`.
        type: string
        example: "https://demo.pygeoapi.io/master"
        pattern: "^(http|https)://.*"
      collection:
        title: "Collection"
        description: "The id of the collection to read the features from, as listed by the service at `<url>/collections`."
        type: string
        example: lakes
      bbox:
        title: "Bounding Box"
        description: "The area to read the features from, as four numbers separated by commas: the west longitude, the south latitude, the east longitude and the north latitude, in degrees. The default is the whole world."
        example: "160.6,-55.95,-170,-25.89"
        default: "-180,-90,180,90"
        type: string
      limit:
        title: "Limit"
        description: "The largest number of features to read for each message, between 1 and 10000."
        type: integer
        default: 10
      split:
        title: "Split by Feature"
        description: "Gives each feature as a message of its own when the Kamelet is called with the `kamelet` EIP. Called with `to`, as in a Pipe, it does not change what the next step receives: the whole feature collection."
        type: boolean
        default: false
      query:
        title: "Query"
        description: "More query parameters for every request, in the form `name=value`, separated by `&`, such as filters on the properties of the features that the service supports."
        example: "property1=1&property2=dos"
        default: ""
        type: string
      connectTimeout:
        title: Connect Timeout
        description: How long to wait for the connection to the service to be set up, in milliseconds. When it is not set, it waits up to 3 minutes, or less when the operating system gives up first. A service that cannot be reached in time fails the message.
        type: integer
        example: 5000
      responseTimeout:
        title: Response Timeout
        description: How long to wait for the answer of the service once the request is sent, in milliseconds. When it is not set, it is 180000 (3 minutes). A service that does not answer in time fails the message.
        type: integer
        example: 30000
      authMethod:
        title: Authentication Method
        description: The login method, `Basic`, `Digest`, `NTLM`, or `Bearer` to send `authBearerToken`. Basic and Digest login with `authUsername` and `authPassword` work without it.
        type: string
        example: Basic
      authenticationPreemptive:
        title: Authentication Preemptive
        description: If true, `authUsername` and `authPassword` are sent with Basic login, or `authBearerToken` as a Bearer token, on the first request. If false, they are sent only after the service answers 401 and asks for them, which takes a second request.
        type: boolean
        default: false
      authUsername:
        title: Authentication Username
        description: The user to log in as, together with `authPassword`.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      authPassword:
        title: Authentication Password
        description: The password of `authUsername`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      authBearerToken:
        title: Bearer Token
        description: A static token, such as an API key, sent in the `Authorization` header as `Bearer` followed by the token. Set `authMethod` to `Bearer` with it. Also set `authenticationPreemptive` to true, unless the service first answers 401 with a `WWW-Authenticate` header that asks for a Bearer token.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      oauth2ClientId:
        title: OAuth2 Client ID
        description: The client ID of the application, as registered with the OAuth 2.0 provider. With `oauth2ClientSecret`, it is used to get a token from `oauth2TokenEndpoint` (client credentials grant).
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      oauth2ClientSecret:
        title: OAuth2 Client Secret
        description: The client secret of the application, as given by the OAuth 2.0 provider.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      oauth2TokenEndpoint:
        title: OAuth2 Token URL
        description: The URL to get the tokens from, as given by the OAuth 2.0 provider. The Kamelet logs in to it with `oauth2ClientId` and `oauth2ClientSecret`.
        type: string
        example: https://login.example.com/oauth2/token
        x-descriptors:
        - urn:camel:group:credentials
      oauth2Scope:
        title: OAuth2 Scope
        description: The scope to ask for in the token request, when the OAuth 2.0 provider needs one.
        type: string
        example: orders.write
        x-descriptors:
        - urn:camel:group:credentials
  dataTypes:
    in:
      default: text
      types:
        text:
          format: "text-plain"
          description: "More query parameters, such as `name=Lake Baikal`, or an empty body."
          mediaType: text/plain
    out:
      default: json
      types:
        json:
          format: "application-json"
          description: "The GeoJSON feature collection, as JSON text in bytes, with the `Content-Type` of the response, such as `application/geo+json`."
          mediaType: application/geo+json
  types:
    in:
      mediaType: text/plain
    out:
      mediaType: application/json
  dependencies:
    - "camel:http"
    - "camel:kamelet"
    - "camel:jsonpath"
    - "camel:jackson3"
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: "Camel(Rest)?Http.*"
        - removeHeader:
            name: Authorization
        - removeHeader:
            name: Proxy-Authorization
        - setHeader:
            name: Accept
            expression:
              constant:
                expression: application/geo+json
        - setHeader:
            name: CamelHttpQuery
            expression:
              simple:
                expression: "limit={{limit}}&bbox={{bbox}}&{{?query}}&${body}"
        - setBody:
            expression:
              simple: {}
        - to:
            uri: "{{url}}/collections/{{collection}}/items"
            parameters:
              connectTimeout: "{{?connectTimeout}}"
              responseTimeout: "{{?responseTimeout}}"
              authMethod: "{{?authMethod}}"
              authUsername: "{{?authUsername}}"
              authPassword: "RAW({{?authPassword}})"
              authBearerToken: "RAW({{?authBearerToken}})"
              authenticationPreemptive: "{{authenticationPreemptive}}"
              oauth2ClientId: "RAW({{?oauth2ClientId}})"
              oauth2ClientSecret: "RAW({{?oauth2ClientSecret}})"
              oauth2TokenEndpoint: "{{?oauth2TokenEndpoint}}"
              oauth2Scope: "{{?oauth2Scope}}"
        - removeHeader:
            name: Accept
        - removeHeader:
            name: CamelHttpQuery
        - convertBodyTo:
            type: java.lang.String
        - choice:
            when:
              - expression:
                  simple:
                    expression: "{{split}}"
                steps:
                  - split:
                      expression:
                        jsonpath:
                          expression: "$.features[*]"
                      steps:
                        - marshal:
                            json: {}
                        - to:
                            uri: kamelet:sink
            otherwise:
              steps:
                - to:
                    uri: kamelet:sink



