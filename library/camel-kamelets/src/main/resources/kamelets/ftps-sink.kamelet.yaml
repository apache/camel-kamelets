apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: ftps-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "FTP"
    camel.apache.org/kamelet.namespace: "File"
  labels:
    camel.apache.org/kamelet.type: "sink"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "FTPS Sink"
    description: |-
      Uploads each message as a file to a directory on an FTPS server, which is FTP with TLS encryption.

      Use it to deliver exports, reports or data files to a partner or a legacy system that receives files over FTPS. For a server without TLS use `ftp-sink`, and for a server you reach with SSH use `sftp-sink`.

      Input: the body is the content of the file, as text, bytes or a stream. The name of the file comes from the `file` header, or from `ce-file` when `file` is not set; any directory in it is dropped, so `reports/data.csv` is written as `data.csv`. Without these headers, `CamelFileName` is used as it is, subdirectories included, and without any of them a unique name is generated.

      Output: the message is unchanged. The `CamelFileNameProduced` header is set to the path of the file on the server.

      Good to know: a file with the same name is replaced, unless `fileExist` says otherwise. A file is uploaded under its real name from the start, so a reader that polls the directory can pick it up half-written. To prevent that, set `tempPrefix` to upload it under a temporary name and rename it once it is complete, or `doneFileName` to write an empty done file next to it once it is complete. By default it uses explicit TLS: it connects to the normal FTP port, usually 21, and then switches to TLS. For a server that uses implicit TLS, usually on port 990, set `implicit` to true. To keep the connection on TLS 1.2, set `securityProtocol` to `TLSv1.2`. The certificate of the server must be signed by a certificate authority (CA) that Java trusts. For a server with a self-signed certificate, or one signed by a private CA, set `trustStoreFile` and `trustStorePassword`: the Kamelet then trusts the certificates in that trust store, for this connection only. Do not use the `javax.net.ssl.trustStore` system property for this: it replaces the trust of the whole integration, so its other HTTPS connections, such as the downloads of its dependencies, then fail when the trust store does not hold their CAs too. A file name that points outside `directoryName` fails the message. Files are sent in ASCII (text) mode unless `binary` is true. Headers that start with `CamelFile` or `CamelOverruleFile`, except `CamelFileName`, are removed from the message first, so they cannot change what the Kamelet does.
    required:
      - connectionHost
      - connectionPort
      - username
      - password
      - directoryName
    type: object
    properties:
      connectionHost:
        title: Connection Host
        description: The host name or IP address of the FTPS server, without `ftps://` and without a port.
        type: string
        example: ftps.example.com
      connectionPort:
        title: Connection Port
        description: The port of the FTPS server, usually 21, or 990 when `implicit` is true.
        type: string
        default: 21
      username:
        title: Username
        description: The user to log in to the FTPS server as.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      password:
        title: Password
        description: The password of `username` on the FTPS server.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      directoryName:
        title: Directory Name
        description: The directory on the server to write the files to. A path without a leading `/` is relative to the home directory of the user. It is created when it does not exist, unless `autoCreate` is false.
        type: string
        example: upload/orders
      passiveMode:
        title: Passive Mode
        description: If true, the transfers use passive mode, in which the integration opens all the connections to the server. Set it to true when the integration or the server is behind a firewall or NAT, where the default active mode often fails.
        type: boolean
        default: false
      fileExist:
        title: If File Exists
        description: What to do when a file with the same name is already in the directory. `Override` replaces it, `Append` adds the new content at its end, `Fail` fails the message, and `Ignore` keeps the old file and drops the new content without an error.
        type: string
        default: Override
        enum: ["Override", "Append", "Fail", "Ignore"]
      binary:
        title: Binary Mode
        description: If true, files are transferred in binary mode, byte for byte. When false, they are transferred in ASCII mode, which is meant for text. Set it to true for files that are not text, such as images, archives or PDF files.
        type: boolean
        default: false
      autoCreate:
        title: Autocreate Missing Directories
        description: If true, `directoryName`, and any subdirectory in the `CamelFileName` header, is created on the server when it does not exist.
        type: boolean
        default: true
      tempPrefix:
        title: Temporary Name Prefix
        description: A prefix for the name a file is uploaded under. Once the upload is complete, the file is renamed to its real name, so a reader that skips the names with this prefix never picks up a half-written file. `ftps-source`, like other readers built with Camel, skips the names that start with a dot, so a prefix such as `.tmp-`, which uploads `orders.csv` as `.tmp-orders.csv`, works with it as it is. A prefix that ends with `/`, such as `.inprogress/`, uploads the file into that subdirectory first, and the subdirectory is created when it does not exist, unless `autoCreate` is false. When it is not set, a file is uploaded under its real name from the start. With `fileExist` `Override`, a file of the same name is deleted when the upload starts, not when it ends. It cannot be combined with `fileExist` `Append`, and every message fails when both are set. `username` must be allowed to rename files.
        type: string
        example: ".tmp-"
      doneFileName:
        title: Done File Name
        description: The name of an empty file to write next to each file once the file is complete, so that a reader knows the file can be read. `$\{file:name}` stands for the name of the file and `$\{file:name.noext}` for the name without its extension, so `$\{file:name}.done` writes `orders.csv.done`, and `$\{file:name.noext}.ready` writes `orders.ready`. A fixed name, such as `ready`, is written again after each file. No other `$\{...}` is allowed, and with one the file is uploaded but then the message fails. With `tempPrefix`, the done file is written after the file has its real name. When it is not set, no done file is written.
        type: string
        example: "${file:name}.done"
      implicit:
        title: Implicit TLS
        description: 'If true, the connection uses implicit TLS: it is encrypted from the start, usually on port 990. If false, it uses explicit TLS: it connects to the normal FTP port, usually 21, and then switches to TLS. Use the mode the server expects; the other one fails to connect. When it is not set, false.'
        type: boolean
      securityProtocol:
        title: TLS Version
        description: The newest TLS version that the connection offers, such as `TLSv1.3` or `TLSv1.2`. With `TLSv1.3`, a server that speaks only TLS 1.2 is reached too. With `TLSv1.2`, the connection never uses TLS 1.3. Set it for a server whose TLS 1.3 connections fail or hang. A server that speaks only TLS 1.3 then refuses the connection, with `protocol_version` in the error. When it is not set, `TLSv1.3`.
        type: string
        example: TLSv1.2
      trustStoreFile:
        title: Trust Store File
        description: The path of a trust store file that holds the certificate of the FTPS server, or of the certificate authority (CA) that signed it, such as a PKCS12 or JKS file made with `keytool`. Set it for a server with a self-signed certificate, or one signed by a private CA. Set `trustStorePassword` with it, or every message fails. Only the certificates in this file are trusted for the server, not those that Java trusts, and only for this connection, so the rest of the integration keeps the trust of Java. When it is not set, the certificate of the server is checked against the certificate authorities that Java trusts.
        type: string
        example: /etc/ftps/truststore.p12
      trustStorePassword:
        title: Trust Store Password
        description: The password of the trust store in `trustStoreFile`. It is needed with `trustStoreFile`; set without `trustStoreFile`, every message fails.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      trustStoreType:
        title: Trust Store Type
        description: The type of the trust store in `trustStoreFile`, such as `PKCS12` or `JKS`. Current Java versions read both PKCS12 and JKS files with either of these types, so it is needed only for other types. Set without `trustStoreFile`, every message fails. When it is not set, the default type of Java, `PKCS12` on current versions.
        type: string
        example: PKCS12
  dataTypes:
    # No 'default: binary' here on purpose: with stream caching turned off, it would read a
    # stream into memory (a byte[]) before the upload, such as a large file from ftp-source or
    # sftp-source with streamDownload, while the client otherwise sends it as it reads it (#3117).
    in:
      headers:
        file:
          title: File Name
          description: The name of the file to write, such as `orders.csv`. Any directory in it is dropped.
          type: string
        ce-file:
          title: File Name (CloudEvents)
          description: The name of the file to write, used when `file` is not set. Any directory in it is dropped.
          type: string
        CamelFileName:
          title: Camel File Name
          description: The name of the file to write, used as it is, subdirectories included, when neither `file` nor `ce-file` is set.
          type: string
    out:
      headers:
        CamelFileNameProduced:
          title: File Written
          description: The path of the file that was written on the server, such as `upload/orders/orders.csv`.
          type: string
  dependencies:
    - "camel:ftp"
    - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: "Camel(File|OverruleFile).*"
            excludePattern: CamelFileName
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[file]}"
                steps:
                  - setHeader:
                      name: CamelFileName
                      expression:
                        simple:
                          expression: "${header[file]}"
                  - setHeader:
                      name: CamelFileName
                      expression:
                        simple:
                          expression: "${file:onlyname}"
              - expression:
                  simple:
                    expression: "${header[ce-file]}"
                steps:
                  - setHeader:
                      name: CamelFileName
                      expression:
                        simple:
                          expression: "${header[ce-file]}"
                  - setHeader:
                      name: CamelFileName
                      expression:
                        simple:
                          expression: "${file:onlyname}"
        - to:
            uri: ftps
            parameters:
              host: "{{username}}@{{connectionHost}}"
              port: "{{connectionPort}}"
              directoryName: "{{directoryName}}"
              doneFileName: "RAW({{?doneFileName}})"
              autoCreate: "{{autoCreate}}"
              binary: "{{binary}}"
              fileExist: "{{fileExist}}"
              ftpClient.trustStore.file: "{{?trustStoreFile}}"
              ftpClient.trustStore.password: "RAW({{?trustStorePassword}})"
              ftpClient.trustStore.type: "{{?trustStoreType}}"
              implicit: "{{?implicit}}"
              passiveMode: "{{passiveMode}}"
              password: "RAW({{password}})"
              securityProtocol: "{{?securityProtocol}}"
              tempPrefix: "RAW({{?tempPrefix}})"
