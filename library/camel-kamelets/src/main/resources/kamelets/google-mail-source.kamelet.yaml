apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: google-mail-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Google Mail"
    camel.apache.org/kamelet.namespace: "GCP"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "Google Mail Source"
    description: |-
      Receives the emails of a Gmail mailbox that match a search, by default the unread ones, one message per email, and marks each email as read once it has been processed.

      Use it to act on incoming email, for example to open a ticket for each email sent to a support address, or to collect orders or invoices that arrive by mail.

      Output: the body is the text of the email (its first part with content, such as the plain text part) as JSON text, that is the text in double quotes with JSON escapes. The headers give the subject (`CamelGoogleMailStreamSubject`), the sender (`CamelGoogleMailStreamFrom`), the recipients (`CamelGoogleMailStreamTo`, `CamelGoogleMailStreamCc`, `CamelGoogleMailStreamBcc`) and the Gmail ID of the email (`CamelGoogleMailId`).

      Good to know: it reads the emails that match `query`, by default the unread ones. With `markAsRead` set to false and the default query, the same emails are read again on every poll. An email whose processing fails is marked as unread again. It logs in to Google with OAuth: an OAuth client of a Google Cloud project, and an access token and a refresh token of the Gmail account.
    required:
      - index
      - clientId
      - accessToken
      - refreshToken
      - clientSecret
      - applicationName
    type: object
    properties:
      index:
        title: Index
        description: Any name for this reader of the mailbox, such as `support`. It is not sent to Google.
        type: string
        example: support
      clientId:
        title: Client ID
        description: The client ID of an OAuth client, created in the Google Cloud console under APIs & Services > Credentials, in a project where the Gmail API is enabled.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      clientSecret:
        title: Client Secret
        description: The client secret of the OAuth client of `clientId`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      accessToken:
        title: Access Token
        description: An OAuth 2 access token of the Gmail account, with access to read and change its emails. It expires after about an hour; the Kamelet then gets a new one with `refreshToken`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      refreshToken:
        title: Refresh Token
        description: An OAuth 2 refresh token of the Gmail account, which the Kamelet uses to get a new access token when the current one expires. You get it together with the access token, for example from the Google OAuth 2.0 Playground.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      delay:
        title: Delay
        description: How long to wait between two polls of the mailbox, in milliseconds. For example, 60000 is one minute.
        type: integer
        default: 500
        example: 60000
      applicationName:
        title: Application Name
        description: A name for your application, sent to Google with each call, such as `my-company-mail/1.0`.
        type: string
        example: my-company-mail/1.0
      markAsRead:
        title: Mark as Read
        description: If true, each email is marked as read once it has been processed, so that the default query `is:unread` does not read it again.
        type: boolean
        default: true
      labels:
        title: Gmail Labels
        description: The names of the Gmail labels to read the emails of, separated by commas, such as `INBOX` or a label of your own. When it is not set, the emails are not filtered by label.
        type: string
        example: "INBOX"
      query:
        title: Gmail Query
        description: A Gmail search, written as in the search box of Gmail, that selects the emails to read.
        type: string
        example: "is:unread -category:(promotions OR social)"
        default: "is:unread"
  dataTypes:
    out:
      default: json
      headers:
        CamelGoogleMailId:
          title: Email ID
          description: The Gmail ID of the email.
          type: string
        CamelGoogleMailStreamTo:
          title: To
          description: The `To` header of the email, the recipients.
          type: string
        CamelGoogleMailStreamFrom:
          title: From
          description: The `From` header of the email, the sender.
          type: string
        CamelGoogleMailStreamCc:
          title: Cc
          description: The `Cc` header of the email, the recipients in copy.
          type: string
        CamelGoogleMailStreamBcc:
          title: Bcc
          description: The `Bcc` header of the email, the hidden recipients.
          type: string
        CamelGoogleMailStreamSubject:
          title: Subject
          description: The subject of the email.
          type: string
      types:
        json:
          format: "application-json"
          description: Json representation of a Google Mail event object.
          mediaType: application/json
        cloudevents:
          format: "google-mail-stream:application-cloudevents"
          description: Output data type represents Google Mail Streams response as CloudEvent V1. The data type sets Camel specific CloudEvent headers on the exchange with respective data from the Mail and its derived object.
          headers:
            CamelCloudEventID:
              title: CloudEvent ID
              description: The Camel exchange id set as event id
              type: string
            CamelCloudEventType:
              title: CloudEvent Type
              description: The event type
              default: "org.apache.camel.event.google.mail.stream.consume"
              type: string
            CamelCloudEventSource:
              title: CloudEvent Source
              description: The event source. By default, the Mail From with prefix "google.mail.stream.".
              type: string
            CamelCloudEventSubject:
              title: CloudEvent Subject
              description: The event subject. The Calendar event type.
              type: string
            CamelCloudEventTime:
              title: CloudEvent Time
              description: The exchange creation timestamp as event time.
              type: string
  dependencies:
  - "camel:jackson3"
  - "camel:kamelet"
  - "camel:google-mail"
  template:
    from:
      uri: "google-mail-stream://{{index}}?accessToken=RAW({{accessToken}})&applicationName={{applicationName}}&clientId=RAW({{clientId}})&clientSecret=RAW({{clientSecret}})&delay={{delay}}&labels={{?labels}}&markAsRead={{markAsRead}}&query={{query}}&refreshToken=RAW({{refreshToken}})"
      steps:
        - marshal:
            json: {}
        - to:
            uri: kamelet:sink
