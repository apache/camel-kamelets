apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: google-calendar-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Google Calendar"
    camel.apache.org/kamelet.namespace: "GCP"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "Google Calendar Source"
    description: |-
      Receives the events of a Google Calendar, such as meetings and appointments, one message per event, by asking the calendar for events at a regular interval.

      Use it to act on calendar entries, for example to send a reminder before a meeting, copy new appointments into another system, or notify a team when a booking is made.

      Output: the body is the event as JSON text, with the fields of the Google Calendar API such as `id`, `summary`, `start` and `attendees`. The `CamelGoogleCalendarEventId` header gives the ID of the event.

      Good to know: by default it only receives the events that have not ended yet at the time of the poll (`consumeFromNow`). With `syncFlow` set to true, each poll after the first asks only for the events that are new or changed since the previous one. It logs in to Google with OAuth: an OAuth client of a Google Cloud project, and an access token and a refresh token of a Google account that may read the calendar.
    required:
      - index
      - calendarId
      - clientId
      - accessToken
      - refreshToken
      - clientSecret
      - applicationName
    type: object
    properties:
      index:
        title: Index
        description: Any name for this reader of the calendar, such as `events`. It is not sent to Google.
        type: string
        example: events
      calendarId:
        title: Calendar ID
        description: The ID of the calendar to read, `primary` for the main calendar of the Google account, or the ID shown in the settings of the calendar under Integrate calendar, which looks like an email address.
        type: string
        example: primary
      clientId:
        title: Client ID
        description: The client ID of an OAuth client, created in the Google Cloud console under APIs & Services > Credentials, in a project where the Google Calendar API is enabled.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      clientSecret:
        title: Client Secret
        description: The client secret of the OAuth client of `clientId`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      accessToken:
        title: Access Token
        description: An OAuth 2 access token of the Google account, with access to Google Calendar. It expires after about an hour; the Kamelet then gets a new one with `refreshToken`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      refreshToken:
        title: Refresh Token
        description: An OAuth 2 refresh token of the Google account, which the Kamelet uses to get a new access token when the current one expires. You get it together with the access token, for example from the Google OAuth 2.0 Playground.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      delay:
        title: Delay
        description: How long to wait between two polls of the calendar, in milliseconds. For example, 60000 is one minute.
        type: integer
        default: 500
        example: 60000
      applicationName:
        title: Application Name
        description: A name for your application, sent to Google with each call, such as `my-company-calendar/1.0`.
        type: string
        example: my-company-calendar/1.0
      syncFlow:
        title: Sync Flow
        description: If true, each poll after the first asks Google only for the events that were created, changed or cancelled since the previous poll.
        type: boolean
        default: false
      consumeFromNow:
        title: Consume from Now
        description: If true, only the events that have not ended yet at the time of each poll are read. If false, past events are read too.
        type: boolean
        default: true
  dataTypes:
    out:
      default: json
      headers:
        CamelGoogleCalendarEventId:
          title: Event ID
          description: The ID of the calendar event.
          type: string
      types:
        json:
          format: "application-json"
          description: Json representation of a Google Calendar event object.
          mediaType: application/json
        cloudevents:
          format: "google-calendar-stream:application-cloudevents"
          description: Output data type represents Google Calendar Stream response as CloudEvent V1. The data type sets Camel specific CloudEvent headers on the exchange with respective data from the Calendar Events and its derived object.
          headers:
            CamelCloudEventID:
              title: CloudEvent ID
              description: The Camel exchange id set as event id
              type: string
            CamelCloudEventType:
              title: CloudEvent Type
              description: The event type
              default: "org.apache.camel.event.google.calendar.stream.consume"
              type: string
            CamelCloudEventSource:
              title: CloudEvent Source
              description: The event source. By default, the Calendar Event Id with prefix "google.calendar.stream.".
              type: string
            CamelCloudEventSubject:
              title: CloudEvent Subject
              description: The event subject. The Calendar event type.
              type: string
            CamelCloudEventTime:
              title: CloudEvent Time
              description: The exchange creation timestamp as event time.
              type: string
  dependencies:
  - "camel:jackson3"
  - "camel:google-calendar"
  - "camel:kamelet"
  template:
    from:
      uri: "google-calendar-stream://{{index}}?accessToken=RAW({{accessToken}})&applicationName={{applicationName}}&calendarId={{calendarId}}&clientId=RAW({{clientId}})&clientSecret=RAW({{clientSecret}})&consumeFromNow={{consumeFromNow}}&delay={{delay}}&refreshToken=RAW({{refreshToken}})&syncFlow={{syncFlow}}"
      steps:
        - marshal:
            json: {}
        - to:
            uri: kamelet:sink
