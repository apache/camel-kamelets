apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: data-type-action
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Actions"
    camel.apache.org/kamelet.namespace: "Transformation"
  labels:
    camel.apache.org/kamelet.type: "action"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "Data Type Action"
    description: |-
      Converts the body of each message into the data type you name, such as plain text, bytes, JSON, Avro or Protobuf, and sets the `Content-Type` header to match.

      Use it to give the next step the kind of body it needs, such as bytes for a sink that writes files, or to turn JSON into Avro binary data after `resolve-pojo-schema-action` has found the schema. A data type is a name for a kind of body together with the conversion into it; `camel catalog transformer` lists the names.

      Input: `text-plain` and `application-octet-stream` take any text; `application-json` and `application-x-struct` take JSON text; `avro-binary` and `protobuf-binary` take a JSON object, as JSON text or a Jackson `JsonNode` but not a Map; `avro-x-struct` and `protobuf-x-struct` take Avro or Protobuf binary data.

      Output: `text-plain` gives text (`Content-Type` `text/plain`); `application-octet-stream` bytes (`application/octet-stream`); `application-json` JSON text as bytes (`application/json`); the `x-struct` ones parsed JSON, a Jackson `JsonNode` (`application/x-struct`); `avro-binary` and `protobuf-binary` binary data (`avro/binary`, `protobuf/binary`). `application-cloudevents+json` wraps the body, under `data`, in a CloudEvents JSON envelope.

      Good to know: a name that does not exist makes every message fail, and so do the Avro and Protobuf data types without a schema from an earlier `resolve-pojo-schema-action`. With `text-plain`, a Map becomes text such as `{id=1, name=Ann}`, not JSON.
    required:
      - format
    type: object
    properties:
      scheme:
        title: Component Scheme
        description: The name of a system, as Camel names it, such as `aws2-s3`, to use the data type made for that system instead of the general one. With `aws2-s3` and the format `application-cloudevents`, the data type `aws2-s3:application-cloudevents` is used. Leave it empty for the general data types.
        type: string
        example: aws2-s3
      format:
        title: Data Type Format
        description: The name of the data type to convert the body into, such as `text-plain`, `application-octet-stream`, `application-json`, `application-x-struct`, `avro-binary`, `avro-x-struct`, `protobuf-binary`, `protobuf-x-struct` or `application-cloudevents+json`. `camel catalog transformer` lists them all; for the names written `scheme:format`, such as `aws2-s3:application-cloudevents`, put the part before the colon in `scheme`.
        type: string
        example: application-json
  dataTypes:
    # No 'default:' here on purpose: the `format` option picks the data type of the output, and the
    # input it takes depends on it. See #3117.
    out:
      headers:
        Content-Type:
          title: Content Type
          description: The kind of body the data type gives, such as `text/plain`, `application/json` or `avro/binary`.
          type: string
    in:
      headers: {}
  dependencies:
    - "camel:kamelet"
  template:
    beans:
      - name: dataTypeProcessor
        type: "#class:org.apache.camel.processor.transformer.DelegatingDataTypeProcessor"
    from:
      uri: kamelet:source
      steps:
        - choice:
            when:
              - expression:
                  simple:
                    expression: "'{{?scheme}}' != ''"
                steps:
                  - setProperty:
                      name: CamelDataType
                      expression:
                        simple:
                          expression: "{{?scheme}}:{{format}}"
            otherwise:
              steps:
                - setProperty:
                    name: CamelDataType
                    expression:
                      simple:
                        expression: "{{format}}"
        - process:
            ref: dataTypeProcessor
