apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: http-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "HTTP"
    camel.apache.org/kamelet.namespace: "HTTP"
  labels:
    camel.apache.org/kamelet.type: "sink"
spec:
  definition:
    title: "HTTP Sink"
    description: |-
      Sends each message to a web service or REST API as an HTTP or HTTPS request, for example a POST of JSON to a webhook.

      Use it to push data to any service that accepts HTTP calls, such as a webhook, a REST API or a serverless function.

      Input: the body is sent as the request body, as text, bytes or a stream. Turn structured data such as a Map into JSON text first, for example with `json-serialize-action`. The `Content-Type` header is sent as the content type of the request, and the other headers of the message, except the Camel ones, are sent as HTTP headers.

      Output: when it is used inside a route, the body afterwards is the response of the service.

      Good to know: a response with a status code outside `okStatusCodeRange`, which is `200-299` when it is not set, fails the message. The address and the method come only from the options; headers on the message cannot change where it is sent. Log in either with `authUsername` and `authPassword`, with a static token in `authBearerToken`, or with `oauth2ClientId`, `oauth2ClientSecret` and `oauth2TokenEndpoint`: the Kamelet then gets a token from that URL and sends it as a Bearer token. Without `authenticationPreemptive`, the user and password, or the static token, are sent only after the service asks for them with a 401 response. The certificate of an `https://` service is checked against the certificate authorities that Java trusts. To trust a private one with Camel JBang or Camel Main, set the application properties `camel.ssl.enabled=true`, `camel.ssl.trustStore`, `camel.ssl.trustStorePassword` and `camel.component.https.useGlobalSslContextParameters=true`: that trust store then replaces the one of Java for every `https://` call of the application.
    required:
    - url
    type: object
    properties:
      url:
        title: URL
        description: The address to send each message to, with the path and any query parameters. It must start with `http://` or `https://`.
        type: string
        example: "https://my-service/path"
        pattern: "^(http|https)://.*"
      method:
        title: Method
        description: The HTTP method of the request. Most APIs expect `POST` to create something and `PUT` to replace it.
        type: string
        default: POST
        enum: ["GET", "POST", "PUT", "DELETE", "HEAD", "OPTIONS", "TRACE", "PATCH"]
      okStatusCodeRange:
        title: OK Status Codes
        description: The status codes of a response that do not fail the message, as ranges such as `200-299` and single codes, separated by commas without spaces. When it is not set, it is `200-299`. List the 2xx codes too, for example `200-299,404` to also accept 404.
        type: string
        example: "200-299,404"
        pattern: "^[0-9]{3}(-[0-9]{3})?(,[0-9]{3}(-[0-9]{3})?)*$"
      authMethod:
        title: Authentication Method
        description: The login method, `Basic`, `Digest`, `NTLM`, or `Bearer` to send `authBearerToken`. Basic and Digest login with `authUsername` and `authPassword` work without it.
        type: string
        example: Basic
      authenticationPreemptive:
        title: Authentication Preemptive
        description: If true, `authUsername` and `authPassword` are sent with Basic login, or `authBearerToken` as a Bearer token, on the first request. If false, they are sent only after the service answers 401 and asks for them, which takes a second request.
        type: boolean
        default: false
      authUsername:
        title: Authentication Username
        description: The user to log in as, together with `authPassword`.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      authPassword:
        title: Authentication Password
        description: The password of `authUsername`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      authBearerToken:
        title: Bearer Token
        description: A static token, such as an API key, sent in the `Authorization` header as `Bearer` followed by the token. Set `authMethod` to `Bearer` with it. Also set `authenticationPreemptive` to true, unless the service first answers 401 with a `WWW-Authenticate` header that asks for a Bearer token.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      oauth2ClientId:
        title: OAuth2 Client ID
        description: The client ID of the application, as registered with the OAuth 2.0 provider. With `oauth2ClientSecret`, it is used to get a token from `oauth2TokenEndpoint` (client credentials grant).
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      oauth2ClientSecret:
        title: OAuth2 Client Secret
        description: The client secret of the application, as given by the OAuth 2.0 provider.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      oauth2TokenEndpoint:
        title: OAuth2 Token URL
        description: The URL to get the tokens from, as given by the OAuth 2.0 provider. The Kamelet logs in to it with `oauth2ClientId` and `oauth2ClientSecret`.
        type: string
        example: https://login.example.com/oauth2/token
        x-descriptors:
        - urn:camel:group:credentials
      oauth2Scope:
        title: OAuth2 Scope
        description: The scope to ask for in the token request, when the OAuth 2.0 provider needs one.
        type: string
        example: orders.write
        x-descriptors:
        - urn:camel:group:credentials
  dependencies:
  - "camel:http"
  - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeader:
            name: CamelHttpUri
        - removeHeader:
            name: CamelHttpPath
        - removeHeader:
            name: CamelHttpQuery
        - removeHeader:
            name: CamelHttpRawQuery
        - removeHeader:
            name: CamelRestHttpUri
        - removeHeader:
            name: CamelRestHttpQuery
        - setHeader:
            name: CamelHttpMethod
            expression:
              constant:
                expression: "{{method}}"
        - to:
            uri: "{{url}}"
            parameters:
              authMethod: "{{?authMethod}}"
              authUsername: "{{?authUsername}}"
              authPassword: "RAW({{?authPassword}})"
              authBearerToken: "RAW({{?authBearerToken}})"
              oauth2ClientId: "RAW({{?oauth2ClientId}})"
              oauth2ClientSecret: "RAW({{?oauth2ClientSecret}})"
              oauth2Scope: "{{?oauth2Scope}}"
              oauth2TokenEndpoint: "{{?oauth2TokenEndpoint}}"
              authenticationPreemptive: "{{authenticationPreemptive}}"
              okStatusCodeRange: "{{?okStatusCodeRange}}"
