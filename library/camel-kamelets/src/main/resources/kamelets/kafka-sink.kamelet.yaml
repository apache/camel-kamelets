apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: kafka-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Kafka"
    camel.apache.org/kamelet.namespace: "Kafka"
  labels:
    camel.apache.org/kamelet.type: "sink"
spec:
  definition:
    title: "Kafka Sink"
    description: |-
      Sends each message as a record to a topic in Apache Kafka, or in a Kafka-compatible service such as Amazon MSK, Confluent Cloud or Redpanda.

      Use it to publish events or data for other applications to read, such as orders, sensor readings or changes from a database. To write the records with a schema kept in a schema registry, such as Confluent Schema Registry, Redpanda or Apicurio Registry, set `schemaRegistryVendor`.

      Input: the body becomes the value of the record, as text. Turn structured data such as a Map into JSON text first, for example with `json-serialize-action`. With `schemaRegistryVendor` and `schemaFormat` `json`, the body must be JSON text (or a Map), and the record is written with a JSON Schema; with `avro`, `confluent` and `apicurio` write a text body as an Avro string, while `aws-glue` needs an Avro record. With `azure`, set `schemaGroup`. The optional `key` header (or `kafka-key`, `ce-key`, `ce-kafkakey`) becomes the key of the record, and the optional `partition-key` header (or `ce-partitionkey`) is the number of the partition to write to. The other headers of the message, except the Camel ones, are sent as record headers.

      Output: the message is unchanged.

      Good to know: `saslAuthType` has no default and must be set; `NONE` connects with no login and no TLS, as a local Kafka expects. A managed Kafka service needs one of the other types. With `schemaRegistryVendor`, the integration needs the serde jars of the vendor, which Camel JBang downloads by itself; for `confluent` add the Confluent Maven repository, as in `camel run --repos=confluent`. With `aws-glue` and `azure`, the serde logs in with the credentials of the environment the integration runs in: the AWS default credentials chain, or the Azure `DefaultAzureCredential` (such as the `AZURE_CLIENT_ID`, `AZURE_TENANT_ID` and `AZURE_CLIENT_SECRET` variables). A `confluent` or `apicurio` registry that requires a login is not supported yet. The sink registers a schema made from the message, which with `json` accepts any JSON object; it does not check the message against a schema that is already registered for the topic.
    required:
      - topic
      - bootstrapServers
      - saslAuthType
    type: object
    properties:
      topic:
        title: Topic Name
        description: The name of the topic to write the records to.
        type: string
        example: orders
      bootstrapServers:
        title: Bootstrap Servers
        description: The address of one or more Kafka brokers to connect to first, as `host:port`, separated by commas. The other brokers of the cluster are found from them.
        type: string
        example: "broker1:9092,broker2:9092"
      saslAuthType:
        title: Authentication Type
        description: "How to log in to Kafka. It has no default and must be set. `NONE` connects with no login and no TLS, as a local Kafka expects; `PLAIN`, `SCRAM_SHA_256` and `SCRAM_SHA_512` log in with `saslUsername` and `saslPassword`; `SSL` connects over TLS and logs in with the client certificate in `sslKeystoreLocation`, when set; `OAUTH` logs in with the `oauth` options; `AWS_MSK_IAM` (Amazon MSK) and `KERBEROS` take their credentials from the environment the integration runs in. All types except `NONE` connect over TLS."
        type: string
        enum: ["NONE", "PLAIN", "SCRAM_SHA_256", "SCRAM_SHA_512", "SSL", "OAUTH", "AWS_MSK_IAM", "KERBEROS"]
      saslUsername:
        title: Username
        description: Username for SASL authentication. Required when saslAuthType is PLAIN, SCRAM_SHA_256, or SCRAM_SHA_512.
        type: string
        x-descriptors:
          - urn:camel:group:credentials
      saslPassword:
        title: Password
        description: Password for SASL authentication. Required when saslAuthType is PLAIN, SCRAM_SHA_256, or SCRAM_SHA_512.
        type: string
        format: password
        x-descriptors:
          - urn:camel:group:credentials
      oauthClientId:
        title: OAuth Client ID
        description: OAuth client ID. Required when saslAuthType is OAUTH.
        type: string
      oauthClientSecret:
        title: OAuth Client Secret
        description: OAuth client secret. Required when saslAuthType is OAUTH.
        type: string
        format: password
        x-descriptors:
          - urn:camel:group:credentials
      oauthTokenEndpointUri:
        title: OAuth Token Endpoint
        description: OAuth token endpoint URI. Required when saslAuthType is OAUTH.
        type: string
      oauthScope:
        title: OAuth Scope
        description: OAuth scope. Optional when saslAuthType is OAUTH.
        type: string
      sslTruststoreLocation:
        title: SSL Truststore Location
        description: The location of the trust store file.
        type: string
      sslTruststorePassword:
        title: SSL Truststore Password
        description: The password for the trust store file.
        type: string
        format: password
        x-descriptors:
          - urn:camel:group:credentials
      sslKeystoreLocation:
        title: SSL Keystore Location
        description: The location of the key store file. Used for mTLS authentication.
        type: string
      sslKeystorePassword:
        title: SSL Keystore Password
        description: The password for the key store file.
        type: string
        format: password
        x-descriptors:
          - urn:camel:group:credentials
      sslKeyPassword:
        title: SSL Key Password
        description: The password of the private key in the key store file.
        type: string
        format: password
        x-descriptors:
          - urn:camel:group:credentials
      schemaRegistryVendor:
        title: Schema Registry Vendor
        description: "The schema registry that holds the schemas of the record values: `confluent`, also for registries with the Confluent API such as Redpanda and Karapace; `apicurio` (Apicurio Registry 3.x); `aws-glue` (AWS Glue Schema Registry); or `azure` (Azure Schema Registry of Event Hubs). It sets the value serializer and the registry properties, and its jars must be added to the integration (see below). Leave it unset when the records do not use a schema registry."
        type: string
        enum: ["confluent", "apicurio", "aws-glue", "azure"]
      schemaRegistryUrl:
        title: Schema Registry URL
        description: "The URL of the schema registry: for `confluent` such as `http://localhost:8081`; for `apicurio` the URL of the registry API, such as `http://localhost:8080/apis/registry/v3`; for `azure` the fully qualified name of the Event Hubs namespace, such as `my-namespace.servicebus.windows.net`. Required when `schemaRegistryVendor` is set, except for `aws-glue`, where it can override the endpoint of the Glue service."
        type: string
        pattern: "^(https?://)?[^\\s]+$"
      schemaRegistryRegion:
        title: Schema Registry Region
        description: "The AWS region of the AWS Glue Schema Registry, such as `eu-west-1`. When not set, the region is taken from the environment, such as the `AWS_REGION` variable. Only used when `schemaRegistryVendor` is `aws-glue`."
        type: string
      schemaRegistryName:
        title: Schema Registry Name
        description: "The name of the registry in AWS Glue. When not set, it is `default-registry`. Only used when `schemaRegistryVendor` is `aws-glue`."
        type: string
      schemaGroup:
        title: Schema Group
        description: "The schema group in the Azure Schema Registry that the schemas of the records are registered in. Required when `schemaRegistryVendor` is `azure`."
        type: string
      schemaFormat:
        title: Schema Format
        description: "The format of the record values in the schema registry: `avro` or `json` (JSON Schema). With `apicurio` and `azure`, use `avro`. Only used when `schemaRegistryVendor` is set."
        type: string
        enum: ["avro", "json"]
        default: avro
  dependencies:
    - "camel:jackson3"
    - "camel:kafka"
    - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[key]}"
                steps:
                  - setHeader:
                      name: CamelKafkaKey
                      expression:
                        simple:
                          expression: "${header[key]}"
              - expression:
                  simple:
                    expression: "${header[kafka-key]}"
                steps:
                  - setHeader:
                      name: CamelKafkaKey
                      expression:
                        simple:
                          expression: "${header[kafka-key]}"
              - expression:
                  simple:
                    expression: "${header[ce-key]}"
                steps:
                  - setHeader:
                      name: CamelKafkaKey
                      expression:
                        simple:
                          expression: "${header[ce-key]}"
              - expression:
                  simple:
                    expression: "${header[ce-kafkakey]}"
                steps:
                  - setHeader:
                      name: CamelKafkaKey
                      expression:
                        simple:
                          expression: "${header[ce-kafkakey]}"
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[partition-key]}"
                steps:
                  - setHeader:
                      name: CamelKafkaPartitionKey
                      expression:
                        simple:
                          expression: "${header[partition-key]}"
              - expression:
                  simple:
                    expression: "${header[ce-partitionkey]}"
                steps:
                  - setHeader:
                      name: CamelKafkaPartitionKey
                      expression:
                        simple:
                          expression: "${header[ce-partitionkey]}"
        - choice:
            when:
              - expression:
                  simple:
                    expression: "'{{?schemaRegistryVendor}}' != '' && '{{schemaFormat}}' == 'json' && ${body} != null && ${body} !is 'java.util.Map' && ${body} !is 'java.util.List'"
                steps:
                  - unmarshal:
                      json:
                        library: Jackson
        - to:
            uri: kafka
            parameters:
              topic: "{{topic}}"
              additionalProperties.region: "{{?schemaRegistryRegion}}"
              additionalProperties.registry.name: "{{?schemaRegistryName}}"
              additionalProperties.schema.group: "{{?schemaGroup}}"
              brokers: "{{bootstrapServers}}"
              oauthClientId: "{{?oauthClientId}}"
              oauthClientSecret: "RAW({{?oauthClientSecret}})"
              oauthScope: "{{?oauthScope}}"
              oauthTokenEndpointUri: "{{?oauthTokenEndpointUri}}"
              saslAuthType: "{{saslAuthType}}"
              saslPassword: "RAW({{?saslPassword}})"
              saslUsername: "{{?saslUsername}}"
              schemaFormat: "{{schemaFormat}}"
              schemaRegistryURL: "{{?schemaRegistryUrl}}"
              schemaRegistryVendor: "{{?schemaRegistryVendor}}"
              sslKeyPassword: "RAW({{?sslKeyPassword}})"
              sslKeystoreLocation: "{{?sslKeystoreLocation}}"
              sslKeystorePassword: "RAW({{?sslKeystorePassword}})"
              sslTruststoreLocation: "{{?sslTruststoreLocation}}"
              sslTruststorePassword: "RAW({{?sslTruststorePassword}})"
