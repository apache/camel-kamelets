apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: timer-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: data:image/svg+xml;base64,
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Timer"
    camel.apache.org/kamelet.namespace: "Scheduling"
  labels:
    camel.apache.org/kamelet.type: "source"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "Timer Source"
    description: |-
      Sends the same fixed message again and again at a regular interval, such as once every second.

      Use it to try out a sink or an action without a real system behind it, to trigger a flow on a schedule (for example, call an HTTP service every minute), or to send a heartbeat. For a calendar schedule such as "every weekday at 9:00" use `cron-source` instead, and for a message that counts up use `counter-source`.

      Output: the body is the `message` option as text, the same on every message. The `Content-Type` header is set to the `contentType` option.

      Good to know: it keeps sending until the integration is stopped, unless `repeatCount` is set.
    required:
      - message
    type: object
    properties:
      period:
        title: Period
        description: "How long to wait between two messages, in milliseconds. For example, 60000 is one minute."
        type: integer
        default: 1000
        example: 60000
      message:
        title: Message
        description: "The body of every message, sent as text exactly as written. To send JSON, write the JSON here and set `contentType` to `application/json`."
        type: string
        example: hello world
      contentType:
        title: Content Type
        description: The value of the `Content-Type` header on every message, which tells the next step what kind of text the body is.
        type: string
        default: text/plain
        example: application/json
      repeatCount:
        title: Repeat Count
        description: How many messages to send in total. When it is not set, a message is sent every `period` until the integration is stopped.
        type: integer
        example: 10
  dataTypes:
    # No 'default:' here on purpose: the Content-Type header is the `contentType` option, and a text
    # default would replace it with text/plain. See #3117.
    out:
      headers:
        Content-Type:
          title: Content Type
          description: The `contentType` option, the same on every message.
          type: string
          default: text/plain
  dependencies:
    - "camel:timer"
    - "camel:kamelet"
  template:
    from:
      uri: timer
      parameters:
        timerName: tick
        period: "{{period}}"
        repeatCount: "{{?repeatCount}}"
      steps:
        - setBody:
            expression:
              constant:
                expression: "{{message}}"
        - setHeader:
            name: Content-Type
            expression:
              constant:
                expression: "{{contentType}}"
        - to:
            uri: kamelet:sink
