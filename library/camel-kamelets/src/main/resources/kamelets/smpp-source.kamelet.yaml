apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: smpp-source
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "SMPP"
    camel.apache.org/kamelet.namespace: "Messaging"
  labels:
    camel.apache.org/kamelet.type: "source"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "SMPP Source"
    description: |-
      Receives each SMS sent to your numbers, and the delivery receipts of the SMS you sent, from an SMS center (SMSC) that speaks the SMPP protocol.

      Use it to process SMS replies from customers, such as a STOP or a YES, or to follow whether the SMS sent with `smpp-sink` reached the phone.

      Output: the body is the text of the SMS, or bytes when the SMS was sent as binary data (data coding 4, given in the `CamelSmppDataCoding` header). The `CamelSmppSourceAddr` header is the phone number of the sender, `CamelSmppDestAddr` the number it was sent to, and `CamelSmppMessageType` is `DeliverSm` for an SMS and `DeliveryReceipt` for a delivery receipt, whose body is the text of the receipt and whose fields are in other `CamelSmpp` headers. An alert notification of the SMSC, that a phone can be reached again, has no body and the `CamelSmppMessageType` `AlertNotification`.

      Good to know: it logs in to the SMSC as a receiver when the integration starts, and the integration fails to start when the SMSC cannot be reached. The SMSC sends a delivery receipt for each SMS that `smpp-sink` sent with `registeredDelivery` `1` (its default), or `2` when the SMS failed: the `CamelSmppId` header of the receipt is the ID that `smpp-sink` got for the SMS, and `CamelSmppStatus` its final state, such as `DELIVRD`. The SMSC decides which messages it gets, from `systemId` and `addressRange`. It connects with no TLS unless `usingSSL` is true.
    required:
    - host
    type: object
    properties:
      host:
        title: "Host"
        description: "The host name or IP address of the SMSC (the SMS center of your SMS provider or operator)."
        type: string
        example: "smsc.example.com"
      port:
        title: "Port"
        description: "The port of the SMSC. 2775 is the usual SMPP port."
        type: integer
        default: 2775
      systemId:
        title: "System ID"
        description: "The user name, called system ID in SMPP, to log in to the SMSC with. Your SMS provider gives it."
        type: string
        default: smppclient
        x-descriptors:
        - urn:camel:group:credentials
      password:
        title: "Password"
        description: "The password to log in to the SMSC with. Your SMS provider gives it."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      systemType:
        title: "System Type"
        description: "A short label of at most 13 characters that some SMSCs ask for when logging in. Leave it empty unless your SMS provider gives one."
        type: string
        example: "cp"
      addressRange:
        title: "Address Range"
        description: "The phone numbers this receiver wants the SMSC to send it messages for, as a regular expression, as defined in section 5.2.7 of the SMPP 3.4 specification. Most SMSCs decide this from `systemId` alone: leave it empty unless your SMS provider asks for it."
        example: "^4512.*"
        type: string
      encoding:
        title: "Encoding"
        description: "The character set of the text of the SMS, such as `ISO-8859-1` or `UTF-8`."
        type: string
        default: "ISO-8859-1"
      usingSSL:
        title: "Use TLS"
        description: "Whether to secure the connection to the SMSC with TLS (the smpps protocol). The SMSC must support it, usually on another port."
        type: boolean
        default: false
      enquireLinkTimer:
        title: "Enquire Link Interval"
        description: "How often to check that the connection to the SMSC is alive with an enquire_link, in milliseconds. When it is not set, it is 60000, which is one minute. A lower value finds a lost connection sooner."
        type: integer
        minimum: 1
        example: 30000
  dataTypes:
    out:
      headers:
        CamelSmppSourceAddr:
          title: "Sender Address"
          description: "The phone number that sent the SMS."
          type: string
        CamelSmppDestAddr:
          title: "Recipient Address"
          description: "The phone number the SMS was sent to."
          type: string
        CamelSmppMessageType:
          title: "Message Type"
          description: "`DeliverSm` for an SMS, `DeliveryReceipt` for a delivery receipt, `AlertNotification` for an alert notification."
          type: string
  dependencies:
    - "camel:smpp"
    - "camel:kamelet"
  template:
    from:
      uri: smpp
      parameters:
        host: "{{host}}"
        port: "{{port}}"
        addressRange: "{{?addressRange}}"
        encoding: "{{encoding}}"
        password: "RAW({{?password}})"
        systemId: "RAW({{systemId}})"
        systemType: "{{?systemType}}"
        usingSSL: "{{usingSSL}}"
        enquireLinkTimer: "{{?enquireLinkTimer}}"
      steps:
        - to:
            uri: kamelet:sink
