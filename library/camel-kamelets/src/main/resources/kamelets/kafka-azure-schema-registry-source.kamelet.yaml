apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: kafka-azure-schema-registry-source
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Kafka"
    camel.apache.org/kamelet.namespace: "Kafka"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "Azure Kafka through Eventhubs with Azure Schema Registry Source"
    description: |-
      Receives each Avro record from event hubs in Azure Event Hubs, through its Kafka interface, with the schema kept in Azure Schema Registry.

      Use it to read Avro records that other applications write to Azure Event Hubs with the schema of the registry. For many records in one message use `kafka-batch-azure-schema-registry-source`; for event hubs without a schema use `azure-eventhubs-source`.

      Output: the body is the value of the record as an object of the `specificAvroValueType` class. The `kafka-topic`, `kafka-key`, `kafka-partition`, `kafka-offset` and `kafka-timestamp` (in milliseconds since 1970) headers say where the record came from. They are also set as `ce-kafkatopic`, `ce-kafkakey` and so on, and as the `CamelKafka*` headers that the Kafka actions read. The record headers become message headers, as text unless `deserializeHeaders` is false.

      Good to know: it logs in to Event Hubs with the connection string in `password`, and to the schema registry with the Azure credentials of the environment the integration runs in, such as the `AZURE_CLIENT_ID`, `AZURE_TENANT_ID` and `AZURE_CLIENT_SECRET` environment variables of a service principal, or a managed identity. The schemas must be in a schema group named `avro`. A new consumer group starts at the newest records, unless `autoOffsetReset` is `earliest`. Without `consumerGroup`, every start uses a new group, so the records sent while the integration was stopped are skipped.
    required:
      - topic
      - bootstrapServers
      - azureRegistryUrl
      - password
    type: object
    properties:
      topic:
        title: Event Hub Names
        description: "The event hubs to read from, which Kafka calls topics, separated by commas. When `topicIsPattern` is true, a regular expression that their names must match instead."
        type: string
        example: "orders"
      bootstrapServers:
        title: Bootstrap Servers
        description: "The Kafka address of the Event Hubs namespace, as `<namespace>.servicebus.windows.net:9093`."
        type: string
        example: "my-namespace.servicebus.windows.net:9093"
      securityProtocol:
        title: Security Protocol
        description: "How to connect to Event Hubs. Keep the default `SASL_SSL`, a login over TLS, which Event Hubs requires. The other values are `SASL_PLAINTEXT`, `PLAINTEXT` and `SSL`."
        type: string
        default: SASL_SSL
      saslMechanism:
        title: SASL Mechanism
        description: "The login method. Keep the default `PLAIN`, which the login with the connection string in `password` needs."
        type: string
        default: PLAIN
      password:
        title: Connection String
        description: "The connection string of the Event Hubs namespace, which starts with `Endpoint=sb://`. Find it in the Azure portal, under Shared access policies of the namespace."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      autoCommitEnable:
        title: Auto Commit
        description: "If true, the position reached in each partition (the offset) is saved in Kafka automatically every 5 seconds, so that a restarted integration goes on from there. Set it to false together with `allowManualCommit` true to save the position yourself with `kafka-manual-commit-action`."
        type: boolean
        default: true
      allowManualCommit:
        title: Allow Manual Commit
        description: "If true, each message carries what `kafka-manual-commit-action` needs to save the position of its record in Kafka. Set `autoCommitEnable` to false too, or the position is also saved automatically."
        type: boolean
        default: false
      pollOnError:
        title: Poll On Error Behavior
        description: "What to do when reading from Kafka fails: `ERROR_HANDLER` logs the error and goes on with the next records, `DISCARD` skips the records that failed, `RECONNECT` connects again and retries, `RETRY` reads the same records again, and `STOP` stops reading until the integration is restarted."
        type: string
        default: "ERROR_HANDLER"
        enum: ["DISCARD", "ERROR_HANDLER", "RECONNECT", "RETRY", "STOP"]
      autoOffsetReset:
        title: Auto Offset Reset
        description: "Where to start when the consumer group has no saved position yet: `latest` reads only the records sent from now on, `earliest` reads all the records still in the topic, and `none` fails."
        type: string
        default: "latest"
        example: "earliest"
      consumerGroup:
        title: Consumer Group
        description: "The name of the consumer group. Integrations with the same group share the records of the topics between them, and the group remembers the position reached, so that a restarted integration goes on where it stopped. When it is not set, a new random group is used on every start."
        type: string
        example: "my-group-id"
      deserializeHeaders:
        title: Automatically Deserialize Headers
        description: "If true, the values of the record headers are turned into text. If false, they stay bytes."
        type: boolean
        default: true
      valueDeserializer:
        title: Value Deserializer
        description: "The Java class that turns the value of the record into the body. The default reads Avro with the schema from Azure Schema Registry."
        type: string
        default: "com.microsoft.azure.schemaregistry.kafka.avro.KafkaAvroDeserializer"
      azureRegistryUrl:
        title: Azure Schema Registry URL
        description: "The URL of the Azure Schema Registry, which is the address of the Event Hubs namespace that holds it, as `https://<namespace>.servicebus.windows.net`."
        type: string
        example: "https://my-namespace.servicebus.windows.net"
      specificAvroValueType:
        title: Specific Avro Value Type
        description: "The full name of the Java class generated from the Avro schema of the records, into which each record is read. The class must be part of the integration. The Kamelet does not start without this option, although it is not marked as required."
        type: string
        example: "com.example.Order"
      topicIsPattern:
        title: Topic Is Pattern
        description: "If true, `topic` is a regular expression, such as `orders-.*`, and the Kamelet reads from every topic whose name matches it."
        type: boolean
        default: false
  dataTypes:
    out:
      headers:
        kafka-topic:
          title: Kafka Topic
          description: "The topic the record was read from."
          type: string
        kafka-key:
          title: Kafka Key
          description: "The key of the record. Not set when the record has no key."
          type: string
        kafka-partition:
          title: Kafka Partition
          description: "The number of the partition the record was read from."
          type: integer
        kafka-offset:
          title: Kafka Offset
          description: "The position of the record in its partition."
          type: integer
        kafka-timestamp:
          title: Kafka Timestamp
          description: "The time of the record, in milliseconds since 1970-01-01 UTC."
          type: integer
        ce-kafkatopic:
          title: CloudEvents Kafka Topic
          description: "The same as `kafka-topic`."
          type: string
        ce-kafkakey:
          title: CloudEvents Kafka Key
          description: "The same as `kafka-key`."
          type: string
        ce-kafkapartition:
          title: CloudEvents Kafka Partition
          description: "The same as `kafka-partition`."
          type: integer
        ce-kafkaoffset:
          title: CloudEvents Kafka Offset
          description: "The same as `kafka-offset`."
          type: integer
        ce-kafkatimestamp:
          title: CloudEvents Kafka Timestamp
          description: "The same as `kafka-timestamp`."
          type: integer
  dependencies:
    - "camel:kafka"
    - "camel:kamelet"
    - "camel:azure-schema-registry"
    - "mvn:com.microsoft.azure:azure-schemaregistry-kafka-avro:1.1.4"
    - "mvn:com.azure:azure-data-schemaregistry-apacheavro:1.1.30"
    - "mvn:com.azure:azure-identity:1.18.1"
  template:
    beans:
      - name: defaultAzureCredential
        type: "#class:org.apache.camel.component.azure.schema.registry.DefaultAzureCredentialWrapper"
      - name: kafkaHeaderDeserializer
        type: "#class:org.apache.camel.component.kafka.KafkaHeaderDeserializer"
        properties:
          enabled: "{{deserializeHeaders}}"
    from:
      uri: kafka
      parameters:
        topic: "{{topic}}"
        additionalProperties.schema.group: avro
        additionalProperties.schema.registry.credential: "#bean:defaultAzureCredential"
        additionalProperties.schema.registry.url: "{{azureRegistryUrl}}"
        additionalProperties.specific.avro.reader: "#valueAs(boolean):true"
        additionalProperties.specific.avro.value.type: "#valueAs(java.lang.Class):{{specificAvroValueType}}"
        allowManualCommit: "{{allowManualCommit}}"
        autoCommitEnable: "{{autoCommitEnable}}"
        autoOffsetReset: "{{autoOffsetReset}}"
        brokers: "{{bootstrapServers}}"
        groupId: "{{?consumerGroup}}"
        pollOnError: "{{pollOnError}}"
        saslJaasConfig: "RAW(org.apache.kafka.common.security.plain.PlainLoginModule required username=\"$ConnectionString\" password=\"{{password}}\";)"
        saslMechanism: "{{saslMechanism}}"
        securityProtocol: "{{securityProtocol}}"
        topicIsPattern: "{{topicIsPattern}}"
        valueDeserializer: "{{valueDeserializer}}"
      steps:
        - process:
            ref: "{{kafkaHeaderDeserializer}}"
        # Kafka record metadata, surfaced under names that are not Camel
        # internals, so a downstream consumer does not have to depend on the
        # CamelKafka* headers. Plain form plus a CloudEvents one, as
        # infinispan-source and ftp-source do. The CamelKafka* headers are left
        # in place, so existing consumers are unaffected.
        - setHeader:
            name: kafka-topic
            expression:
              simple:
                expression: "${header[CamelKafkaTopic]}"
        - setHeader:
            name: ce-kafkatopic
            expression:
              simple:
                expression: "${header[CamelKafkaTopic]}"
        - setHeader:
            name: kafka-key
            expression:
              simple:
                expression: "${header[CamelKafkaKey]}"
        - setHeader:
            name: ce-kafkakey
            expression:
              simple:
                expression: "${header[CamelKafkaKey]}"
        - setHeader:
            name: kafka-partition
            expression:
              simple:
                expression: "${header[CamelKafkaPartition]}"
        - setHeader:
            name: ce-kafkapartition
            expression:
              simple:
                expression: "${header[CamelKafkaPartition]}"
        - setHeader:
            name: kafka-offset
            expression:
              simple:
                expression: "${header[CamelKafkaOffset]}"
        - setHeader:
            name: ce-kafkaoffset
            expression:
              simple:
                expression: "${header[CamelKafkaOffset]}"
        - setHeader:
            name: kafka-timestamp
            expression:
              simple:
                expression: "${header[CamelKafkaTimestamp]}"
        - setHeader:
            name: ce-kafkatimestamp
            expression:
              simple:
                expression: "${header[CamelKafkaTimestamp]}"
        - to:
            uri: kamelet:sink
