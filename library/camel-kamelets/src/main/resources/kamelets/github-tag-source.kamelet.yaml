apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: github-tag-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "GitHub"
    camel.apache.org/kamelet.namespace: "Cloud"
  labels:
    camel.apache.org/kamelet.type: "source"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "GitHub Tag Source"
    description: |-
      Receives each new tag created in a GitHub repository, one message per tag, by asking the GitHub API for the tags of the repository.

      Use it to react to a new version, for example to announce a release, update a changelog or start a deployment. To receive every commit instead, use `github-commit-source`.

      Output: the body is the tag as JSON text in bytes, an object with its `name`, such as `v1.0.0`, and `commit.sha`, the SHA of the commit it points to. The `Content-Type` header is `application/json`.

      Good to know: only the tags created after the start are sent; the tags that exist when it starts are skipped. GitHub lists a tag without its date or the message of an annotated tag, so they are not in the body. It works with github.com, not with GitHub Enterprise Server. It asks GitHub for the tags once a minute by default (`delay`), and every request counts against the API rate limit of the token.
    required:
      - repoName
      - repoOwner
      - oauthToken
    type: object
    properties:
      repoName:
        title: Repository Name
        description: The name of the repository, such as `camel` in `https://github.com/apache/camel`.
        type: string
        example: camel
      repoOwner:
        title: Repository Owner
        description: The user or organization that owns the repository, such as `apache` in `https://github.com/apache/camel`.
        type: string
        example: apache
      oauthToken:
        title: OAuth Token
        description: A GitHub personal access token, created on GitHub under Settings, Developer settings, Personal access tokens. It needs read access to the repository.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      delay:
        title: Delay
        description: How long to wait between two polls of GitHub, in milliseconds. For example, 60000 is one minute.
        type: integer
        default: 60000
  dataTypes:
    out:
      default: json
      types:
        json:
          format: "application-json"
          description: "The tag, as JSON text in bytes."
          mediaType: application/json
  types:
    out:
      mediaType: application/json
  dependencies:
  - "camel:github2"
  - "camel:jq"
  - "camel:kamelet"
  template:
    beans:
      # writes the object from its fields, as the GitHub library reads it: unlike its getters, this asks GitHub
      # for nothing more
      - name: gitHubJson
        type: "#class:org.kohsuke.github.GitHub"
        factoryMethod: getMappingObjectWriter
    from:
      uri: "github2://tag?oauthToken=RAW({{oauthToken}})&repoName={{repoName}}&repoOwner={{repoOwner}}&delay={{delay}}"
      steps:
        - bean:
            ref: "{{gitHubJson}}"
            method: writeValueAsString
        # keep the fields the description lists
        - transform:
            expression:
              jq:
                resultType: java.lang.String
                expression: "{name: .name, commit: {sha: .commit.sha}}"
        - setHeader:
            name: Content-Type
            expression:
              constant:
                expression: application/json
        - to:
            uri: kamelet:sink
