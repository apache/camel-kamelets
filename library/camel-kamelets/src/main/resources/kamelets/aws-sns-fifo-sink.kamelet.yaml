apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: aws-sns-fifo-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "AWS SNS"
    camel.apache.org/kamelet.namespace: "AWS"
  labels:
    camel.apache.org/kamelet.type: "sink"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "AWS SNS FIFO Sink"
    description: |-
      Publishes each message to an Amazon SNS FIFO topic, which delivers the messages of a group in order, and without duplicates, to the SQS FIFO queues subscribed to it.

      Use it to fan out ordered updates, such as the changes of one order or one account, to several FIFO queues at once. For a standard topic use `aws-sns-sink`.

      Input: the body becomes the text of the notification, as text. The optional `group` header (or `ce-group`) is the message group ID, such as a customer ID: the messages of one group are delivered in order. Without it, each message is a group of its own. The optional `subject` header (or `ce-subject`) is the subject; it takes precedence over the `subject` option. The other headers of the message, except the Camel ones, are sent as SNS message attributes.

      Output: the message is unchanged. The `CamelAwsSnsMessageId` header gives the ID of the published message.

      Good to know: the name of the topic ends in `.fifo`. With `contentBasedDeduplication` false, the default, each message gets a unique deduplication ID, so SNS drops only a message sent twice by a retry; set it to true to drop messages with the same body, which the topic must allow. With `messageStructure` set to `json`, the body is a JSON object with a text for each kind of subscriber. `serverSideEncryptionEnabled` and `kmsMasterKeyId` apply only to a topic that `autoCreateTopic` creates. To reach AWS through an HTTP proxy, set `proxyHost` and `proxyPort`, and set `proxyProtocol` to `HTTP` for a proxy that takes plain HTTP, such as Squid. Headers that start with `CamelAwsSns` are removed from the message first, so they cannot change what the Kamelet does.
    required:
      - topicNameOrArn
      - region
    type: object
    properties:
      topicNameOrArn:
        title: Topic Name
        description: The name of the FIFO topic, which ends in `.fifo`, such as `order-events.fifo`, or its ARN (Amazon Resource Name).
        example: order-events.fifo
        type: string
      accessKey:
        title: Access Key
        description: The access key ID of an IAM user, which you create in the AWS console under IAM, Users, Security credentials. Use it together with `secretKey`. Leave both out when `useDefaultCredentialsProvider` or `useProfileCredentialsProvider` is true.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      secretKey:
        title: Secret Key
        description: The secret access key that belongs to `accessKey`. The AWS console shows it only once, when the access key is created.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      region:
        title: AWS Region
        description: The AWS region of the topic, as a region code such as `eu-west-1` or `us-east-1`.
        example: eu-west-1
        type: string
        enum: ["ap-south-1", "eu-south-1", "us-gov-east-1", "me-central-1", "ca-central-1", "eu-central-1", "us-iso-west-1", "us-west-1", "us-west-2", "af-south-1", "eu-north-1", "eu-west-3", "eu-west-2", "eu-west-1", "ap-northeast-3", "ap-northeast-2", "ap-northeast-1", "me-south-1", "sa-east-1", "ap-east-1", "cn-north-1", "us-gov-west-1", "ap-southeast-1", "ap-southeast-2", "us-iso-east-1", "ap-southeast-3", "us-east-1", "us-east-2", "cn-northwest-1", "us-isob-east-1", "aws-global", "aws-cn-global", "aws-us-gov-global", "aws-iso-global", "aws-iso-b-global"]
      contentBasedDeduplication:
        title: Content-Based Deduplication
        description: "If true, SNS finds duplicates by the content of the body: a message with the same body as one published in the last 5 minutes is dropped. The topic must have content-based deduplication turned on. If false, each message gets a unique deduplication ID, so only a message that is sent again by a retry is dropped."
        type: boolean
        default: false
      autoCreateTopic:
        title: Autocreate Topic
        description: If true, the topic is created when it does not exist. The credentials need the permission to create topics.
        type: boolean
        default: false
      useDefaultCredentialsProvider:
        title: Default Credentials Provider
        description: "If true, the credentials are found in the environment instead of in `accessKey` and `secretKey`: the `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY` environment variables, the `~/.aws/credentials` file, or the IAM role of the EC2 instance, ECS task or Kubernetes pod the integration runs on."
        type: boolean
        default: false
      useProfileCredentialsProvider:
        title: Profile Credentials Provider
        description: If true, the credentials are read from a named profile in the AWS credentials file (`~/.aws/credentials`), as the AWS CLI does. Name the profile in `profileCredentialsName`.
        type: boolean
        default: false
      useSessionCredentials:
        title: Session Credentials
        description: "If true, it logs in with temporary credentials: `accessKey`, `secretKey` and `sessionToken`, such as the ones AWS STS gives when you assume an IAM role."
        type: boolean
        default: false
      profileCredentialsName:
        title: Profile Credentials Name
        description: The name of the profile in the AWS credentials file. Only used when `useProfileCredentialsProvider` is true; when it is not set, the default profile is used.
        example: production
        type: string
      sessionToken:
        title: Session Token
        description: The session token of temporary credentials, which comes with their access key and secret key, for example from AWS STS when you assume an IAM role. Only used when `useSessionCredentials` is true.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      uriEndpointOverride:
        title: Overwrite Endpoint URI
        description: The address to connect to instead of AWS, as a URL such as `http://localhost:4566` for LocalStack. Only used when `overrideEndpoint` is true.
        example: http://localhost:4566
        type: string
      overrideEndpoint:
        title: Endpoint Overwrite
        description: If true, it connects to the address in `uriEndpointOverride` instead of to AWS. Use it for a local stand-in of AWS such as LocalStack.
        type: boolean
        default: false
      proxyHost:
        title: Proxy Host
        description: The host name or IP address of an HTTP proxy to send the calls to AWS through, such as the proxy of a company network. Used only together with `proxyPort`. When it is not set, the calls go straight to AWS.
        type: string
        pattern: "^[A-Za-z0-9._-]+$"
        example: proxy.example.com
      proxyPort:
        title: Proxy Port
        description: The port of the proxy in `proxyHost`, such as `3128` for Squid. Used only together with `proxyHost`.
        type: integer
        example: 3128
      proxyProtocol:
        title: Proxy Protocol
        description: "How to talk to the proxy itself: `HTTP` or `HTTPS`. It is not the protocol of the calls to AWS, which stay encrypted, as the proxy only passes them on. When it is not set, it is `HTTPS`, which needs a proxy that takes TLS connections. Most company proxies, such as Squid, take plain HTTP: set `HTTP` for them. With the wrong one, every call fails, for example with `Unsupported or unrecognized SSL message`."
        type: string
        enum: ["HTTP", "HTTPS"]
        example: HTTP
      subject:
        title: Subject
        description: The subject of every notification, which email subscribers see as the subject line, and an SQS queue subscribed to the topic gets in the `Subject` field of the notification. A `subject` or `ce-subject` header on the message takes precedence. It is ASCII text without line breaks; a subject longer than 100 characters is cut to 100. When it is not set, only the messages with a header have a subject.
        example: Order received
        type: string
        pattern: "^[ -~]+$"
      messageStructure:
        title: Message Structure
        description: "Set it to `json` to send a different text to each kind of subscriber. The body is then a JSON object with a `default` text for all subscribers and, optionally, a text for each protocol, such as `{\"default\": \"Order 42 received\", \"email\": \"Your order 42 was received.\"}`; SNS rejects a body without `default`. When it is not set, the body is the text for all subscribers."
        type: string
        enum: ["json"]
      serverSideEncryptionEnabled:
        title: Server-Side Encryption
        description: If true, a topic that `autoCreateTopic` creates is created to encrypt its messages with the key of AWS KMS in `kmsMasterKeyId`, which is then required. It does not change a topic that exists already.
        type: boolean
      kmsMasterKeyId:
        title: KMS Key ID
        description: The key of AWS KMS for a new topic to encrypt its messages with, as its key ID, such as `1234abcd-12ab-34cd-56ef-1234567890ab`, an alias, such as `alias/aws/sns`, or its ARN. Only used when `serverSideEncryptionEnabled` and `autoCreateTopic` are true and the topic does not exist yet.
        example: alias/aws/sns
        type: string
        pattern: "^[A-Za-z0-9:/_-]+$"
  dataTypes:
    in:
      headers:
        group:
          title: Message Group ID
          description: "The message group ID: the messages of one group are delivered in order. `ce-group` works too. Without it, each message is a group of its own."
          type: string
        subject:
          title: Subject
          description: The subject of the notification. `ce-subject` works too. It takes precedence over the `subject` option.
          type: string
  dependencies:
  - "camel:aws2-sns"
  - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: CamelAwsSns*
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[subject]}"
                steps:
                  - setHeader:
                      name: CamelAwsSnsSubject
                      expression:
                        simple:
                          expression: "${header[subject]}"
              - expression:
                  simple:
                    expression: "${header[ce-subject]}"
                steps:
                  - setHeader:
                      name: CamelAwsSnsSubject
                      expression:
                        simple:
                          expression: "${header[ce-subject]}"
        - setProperty:
            name: contentBasedDeduplication
            expression:
              constant:
                expression: "{{contentBasedDeduplication}}"
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[group]}"
                steps:
                  - setProperty:
                      name: CamelAwsSnsMessageGroupId
                      expression:
                        simple:
                          expression: "${header[group]}"
              - expression:
                  simple:
                    expression: "${header[ce-group]}"
                steps:
                  - setProperty:
                      name: CamelAwsSnsMessageGroupId
                      expression:
                        simple:
                          expression: "${header[ce-group]}"
            otherwise:
              steps:
                - setProperty:
                    name: CamelAwsSnsMessageGroupId
                    expression:
                      simple:
                        expression: "${exchangeId}"
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${exchangeProperty.contentBasedDeduplication} == 'true'"
                steps:
                  - to:
                      uri: aws2-sns
                      parameters:
                        topicNameOrArn: "{{topicNameOrArn}}"
                        accessKey: "RAW({{?accessKey}})"
                        autoCreateTopic: "{{autoCreateTopic}}"
                        messageDeduplicationIdStrategy: useContentBasedDeduplication
                        messageGroupIdStrategy: usePropertyValue
                        overrideEndpoint: "{{overrideEndpoint}}"
                        profileCredentialsName: "{{?profileCredentialsName}}"
                        region: "{{region}}"
                        secretKey: "RAW({{?secretKey}})"
                        sessionToken: "RAW({{?sessionToken}})"
                        uriEndpointOverride: "{{?uriEndpointOverride}}"
                        useDefaultCredentialsProvider: "{{useDefaultCredentialsProvider}}"
                        useProfileCredentialsProvider: "{{useProfileCredentialsProvider}}"
                        useSessionCredentials: "{{useSessionCredentials}}"
                        proxyHost: "{{?proxyHost}}"
                        proxyPort: "{{?proxyPort}}"
                        proxyProtocol: "{{?proxyProtocol}}"
                        subject: "RAW({{?subject}})"
                        messageStructure: "{{?messageStructure}}"
                        serverSideEncryptionEnabled: "{{?serverSideEncryptionEnabled}}"
                        kmsMasterKeyId: "{{?kmsMasterKeyId}}"
            otherwise:
              steps:
                - to:
                    uri: aws2-sns
                    parameters:
                      topicNameOrArn: "{{topicNameOrArn}}"
                      accessKey: "RAW({{?accessKey}})"
                      autoCreateTopic: "{{autoCreateTopic}}"
                      messageDeduplicationIdStrategy: useExchangeId
                      messageGroupIdStrategy: usePropertyValue
                      overrideEndpoint: "{{overrideEndpoint}}"
                      profileCredentialsName: "{{?profileCredentialsName}}"
                      region: "{{region}}"
                      secretKey: "RAW({{?secretKey}})"
                      sessionToken: "RAW({{?sessionToken}})"
                      uriEndpointOverride: "{{?uriEndpointOverride}}"
                      useDefaultCredentialsProvider: "{{useDefaultCredentialsProvider}}"
                      useProfileCredentialsProvider: "{{useProfileCredentialsProvider}}"
                      useSessionCredentials: "{{useSessionCredentials}}"
                      proxyHost: "{{?proxyHost}}"
                      proxyPort: "{{?proxyPort}}"
                      proxyProtocol: "{{?proxyProtocol}}"
                      subject: "RAW({{?subject}})"
                      messageStructure: "{{?messageStructure}}"
                      serverSideEncryptionEnabled: "{{?serverSideEncryptionEnabled}}"
                      kmsMasterKeyId: "{{?kmsMasterKeyId}}"
