apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: azure-storage-queue-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Azure Storage Queue"
    camel.apache.org/kamelet.namespace: "Azure"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "Azure Storage Queue Source"
    description: |-
      Receives the messages of a queue in Azure Queue Storage, one message each, and deletes each message from the queue once it has been processed.

      Use it to process work that other applications put in a storage queue, such as orders or jobs. For Service Bus queues and topics, use `azure-servicebus-source`.

      Output: the body is the text of the queue message, as text, and the `Content-Type` header is `text/plain`. The headers give its ID (`CamelAzureStorageQueueMessageId`), the times it was inserted and expires, its pop receipt, and how many times it has been received (`CamelAzureStorageQueueDequeueCount`).

      Good to know: a received message is hidden from other readers while it is processed. When the processing fails, it stays in the queue and is received again once that time is over, 30 seconds by default (`visibilityTimeout`), with a higher dequeue count. The queue is checked for new messages every 500 milliseconds, unless `delay` says otherwise.
    required:
      - accountName
      - queueName
      - accessKey
    type: object
    properties:
      accountName:
        title: Account Name
        description: The name of the storage account, as shown in the Azure portal under Storage accounts. It is the first part of the address of the account, `https://<accountName>.queue.core.windows.net`.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
        example: mystorageaccount
      queueName:
        title: Queue Name
        description: The name of the queue in the storage account to receive the messages from.
        type: string
        example: orders
      accessKey:
        title: Access Key
        description: "An access key of the storage account, from the Azure portal: the storage account, then Security + networking, then Access keys. Used when `credentialType` is `SHARED_ACCOUNT_KEY`, the default."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      maxMessages:
        title: Maximum Messages
        description: The most messages to receive at each poll, from 1 to 32. When the queue holds fewer, all of them are received.
        type: integer
        default: 1
      credentialType:
        title: Credential Type
        description: How to log in to the storage account. `SHARED_ACCOUNT_KEY`, the default, and `SHARED_KEY_CREDENTIAL` use `accessKey`. `AZURE_IDENTITY` uses the Azure identity of the environment, such as the `AZURE_CLIENT_ID`, `AZURE_TENANT_ID` and `AZURE_CLIENT_SECRET` environment variables, a managed identity or the Azure CLI login; `accessKey` must still be given, but is not used.
        type: string
        default: "SHARED_ACCOUNT_KEY"
        enum: ["SHARED_ACCOUNT_KEY", "SHARED_KEY_CREDENTIAL", "AZURE_IDENTITY"]
      visibilityTimeout:
        title: Visibility Timeout
        description: How long a received message stays hidden from other readers of the queue, as an ISO-8601 duration such as `PT5M` (five minutes), from 1 second to 7 days. Once processed, the message is deleted. When the processing fails, the message is received again after this time. Set it longer than the processing of a message takes, as a message still being processed after this time can be received again, by another copy of the integration or, when a step waits without holding up the source, by this one, and is then processed twice. A plain number is read as milliseconds, not seconds. When it is not set, 30 seconds.
        type: string
        example: PT5M
        pattern: "^P(\\d+D)?(T(\\d+H)?(\\d+M)?(\\d+(\\.\\d+)?S)?)?$"
      delay:
        title: Delay
        description: How long to wait between two checks of the queue for new messages, in milliseconds. When it is not set, 500.
        type: integer
        example: 5000
  dataTypes:
    out:
      default: text
      headers:
        CamelAzureStorageQueueMessageId:
          title: Azure Storage Queue Message Id
          description: The id of the message.
          type: string
        CamelAzureStorageQueueInsertionTime:
          title: Azure Storage Queue Message Insertion Time
          description: The time the Message was inserted into the Queue.
          type: OffsetDateTime
        CamelAzureStorageQueueExpirationTime:
          title: Azure Storage Queue Message Expiration Time
          description: The time that the Message will expire and be automatically deleted.
          type: OffsetDateTime
        CamelAzureStorageQueuePopReceipt:
          title: Pop Receipt
          description: Unique identifier that must match for the message to be deleted or updated. If deletion fails using this pop receipt then the message has been dequeued by another client.
          type: string
        CamelAzureStorageQueueTimeNextVisible:
          title: Azure Storage Queue Message Time Next Visible
          description: The time that the message will again become visible in the Queue.
          type: OffsetDateTime
        CamelAzureStorageQueueDequeueCount:
          title: Dequeue Count
          description: The number of times the message has been dequeued.
          type: long
      types:
        text:
          format: "text-plain"
          description: Default text representation of the Message dequeued from the queue.
          mediaType: text/plain
        cloudevents:
          format: "azure-storage-queue:application-cloudevents"
          description: Output data type represents Azure Storage Queue receive messages operation as CloudEvent V1. The data type sets Camel specific CloudEvent headers on the exchange.
          headers:
            CamelCloudEventID:
              title: CloudEvent ID
              description: The Camel exchange id set as event id.
              type: string
            CamelCloudEventType:
              title: CloudEvent Type
              description: The event type.
              default: "org.apache.camel.event.azure.storage.queue.receiveMessages"
              type: string
            CamelCloudEventSource:
              title: CloudEvent Source
              description: The event source. By default, the Message Id of the message received with prefix "azure.storage.queue.".
              type: string
            CamelCloudEventSubject:
              title: CloudEvent Subject
              description: The event subject. Usually the Pop receipt of the message dequeued.
              type: string
            CamelCloudEventTime:
              title: CloudEvent Time
              description: The exchange creation timestamp as event time.
              type: string
  dependencies:
    - "camel:azure-storage-queue"
    - "camel:kamelet"
  template:
    from:
      uri: "azure-storage-queue://{{accountName}}/{{queueName}}?accessKey=RAW({{accessKey}})&credentialType={{credentialType}}&maxMessages={{maxMessages}}&visibilityTimeout={{?visibilityTimeout}}&delay={{?delay}}"
      steps:
        - to:
            uri: kamelet:sink
