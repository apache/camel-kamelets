apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: tika-extract-text-action
  labels:
    camel.apache.org/kamelet.type: "action"
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.22.1-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Actions"
    camel.apache.org/kamelet.namespace: "AI"
spec:
  definition:
    title: "Tika Extract Text Action"
    description: |-
      Extract plain text from PDF, office and similar documents in-process with Apache Tika.

      Before the parse, the value of the `documentIdHeader` header is captured into the
      `CamelLangChain4jIngestDocumentId` exchange property - Tika copies document metadata
      over the headers, so a crafted document could otherwise forge its own identity in steps
      that read it later (the langchain4j-ingest sink does). The extracted text is decoded at
      a pinned UTF-8 (a document-injected charset header is swept before the conversion), and
      after the parse all non-Camel headers are removed: past this action, parsed document
      metadata is indistinguishable from caller headers, so it must not travel further. Each
      format needs its Tika parser module on the classpath; camel-tika ships the HTML and
      text modules, PDF needs org.apache.tika:tika-parser-pdf-module.
    type: object
    properties:
      documentIdHeader:
        title: Document Id Header
        description: Name of the header carrying the stable document id, captured into the
          CamelLangChain4jIngestDocumentId exchange property before the parse.
        type: string
        default: CamelLangChain4jIngestDocumentId
  dependencies:
    - "camel:core"
    - "camel:tika"
    - "camel:kamelet"
  template:
    from:
      uri: "kamelet:source"
      steps:
        # captured before the parse: Tika copies document metadata over the headers, so a
        # crafted document could otherwise forge its own identity
        - setProperty:
            name: "CamelLangChain4jIngestDocumentId"
            simple: "${header[{{documentIdHeader}}]}"
        # tika answers plain text (body only, blocks newline-separated) at the pinned encoding
        - to: "tika:parse?tikaParseOutputFormat=text&tikaParseOutputEncoding=UTF-8"
        # a message- or document-supplied charset header outranks the charset the conversion
        # below sets, so it is swept before the bytes are decoded at the pinned UTF-8.
        # These three steps are the declarative twin of the camel-langchain4j-ingest
        # component's TikaTextDecode processor, reimplemented here on purpose so a generic
        # parse action does not depend on that component - keep the two in step
        - removeHeaders:
            pattern: "CamelCharsetName"
        - convertBodyTo:
            type: "byte[]"
        - convertBodyTo:
            type: "java.lang.String"
            charset: "UTF-8"
        # past the parse, non-Camel headers are parsed document metadata (Content-Type,
        # dc:* and friends) - Camel-namespace names were already filtered by camel-tika,
        # the rest must not leak into later steps as if the caller had set them
        - removeHeaders:
            pattern: "*"
            excludePattern: "Camel*"
