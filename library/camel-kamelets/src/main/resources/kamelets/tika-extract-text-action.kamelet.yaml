apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: tika-extract-text-action
  labels:
    camel.apache.org/kamelet.type: "action"
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Actions"
    camel.apache.org/kamelet.namespace: "AI"
spec:
  definition:
    title: "Tika Extract Text Action"
    description: |-
      Turns each document, such as an HTML page, a text file or a PDF, into its plain text, or into XHTML, with Apache Tika, inside the integration.

      Use it to get the text of documents before searching, indexing or summarising them, for example in front of `langchain4j-ingest-sink` to load documents into a vector store for an AI assistant. For a richer conversion to Markdown that keeps headings and tables, use `docling-convert-action`, which needs a Docling server.

      Input: the document, as bytes, a stream, a file or text. The header named in `documentIdHeader` (by default `CamelLangChain4jIngestDocumentId`) is the id of the document, if any; it is kept for `langchain4j-ingest-sink` further on.

      Output: the body is the plain text of the document, as text in UTF-8, with its blocks on separate lines; with `outputFormat` set to `html` or `xml`, it is the document as XHTML text instead. All the headers of the message are removed, except the Camel ones, such as the file name headers of `langchain4j-ingest-file-source`.

      Good to know: only HTML and plain text are read out of the box. For PDF, add the Tika PDF parser module (`org.apache.tika:tika-parser-pdf-module`, in the Tika version of your Camel) to the integration, and add the other Tika parser modules for other formats; without the module, a PDF gives an empty text, and does not fail. With `maxDocumentSize`, a larger document fails the message without being read.
    type: object
    properties:
      documentIdHeader:
        title: Document ID Header
        description: The name of the header that holds the id of the document, such as its file name. The id is kept for `langchain4j-ingest-sink`, which writes it on every piece of the document in the store, and takes precedence over the headers it reads. Change it when the id comes in another header.
        type: string
        default: CamelLangChain4jIngestDocumentId
        example: CamelFileName
      outputFormat:
        title: Output Format
        description: What the body becomes. `text`, the default, is the plain text of the document. `html` is the document as an XHTML page, with its paragraphs, and for some formats its headings, lists and tables, as HTML elements, and with the metadata Tika found, such as the title, as `meta` elements in the `head`. `xml` is the same page with an XML declaration on top. With `html` and `xml`, a document whose metadata holds a character that XML does not allow, such as the NUL character that some PDF writers put in it, fails the message; `text` reads it.
        type: string
        enum: ["text", "html", "xml"]
        default: text
      maxDocumentSize:
        title: Max Document Size
        description: The largest document to read, in bytes. A larger document fails the message without being read. 0, the default, means no limit.
        type: integer
        default: 0
        example: 10485760
  dataTypes:
    in:
      headers:
        CamelLangChain4jIngestDocumentId:
          title: Document ID
          description: The id of the document, such as its file name, kept for `langchain4j-ingest-sink`. Read from this header unless `documentIdHeader` names another one.
          type: string
  dependencies:
    - "camel:tika"
    - "camel:kamelet"
    - "camel:bean"
  template:
    from:
      uri: kamelet:source
      steps:
        # captured before the parse: Tika copies document metadata over the headers, so a
        # crafted document could otherwise forge its own identity
        - setProperty:
            name: CamelLangChain4jIngestDocumentId
            expression:
              simple:
                expression: "${header[{{documentIdHeader}}]}"
        # the size cap, present only when maxDocumentSize is set: the parse materializes the
        # document, so an oversized one is rejected first. The precondition is evaluated once,
        # when the Kamelet is instantiated - only then does ${properties:maxDocumentSize:0} see
        # the parameter, at runtime it resolves to 0 - so the check must stay a precondition,
        # and the comparisons below use {{maxDocumentSize}}
        - choice:
            precondition: true
            when:
              - expression:
                  simple:
                    expression: "${properties:maxDocumentSize:0} > 0"
                steps:
                  # length() would read a stream to its end, so one that stream caching (on by
                  # default) left uncached is read at most one byte past the cap, within the int
                  # readNBytes takes, and closed: that byte rejects it below, else the bytes are
                  # the document. The stream is held in a property: a variable is stream-cached,
                  # which fails on an exchange that turned caching off for itself
                  - choice:
                      when:
                        - expression:
                            simple:
                              expression: "${body} is 'java.io.InputStream' && ${body} !is 'org.apache.camel.StreamCache'"
                          steps:
                            - setProperty:
                                name: documentStream
                                expression:
                                  simple:
                                    expression: "${body}"
                            - setBody:
                                expression:
                                  simple:
                                    expression: "${body.readNBytes(${min({{maxDocumentSize}},2147483646)}++)}"
                            - script:
                                expression:
                                  simple:
                                    expression: "${exchangeProperty.documentStream.close()}"
                            - removeProperty:
                                name: documentStream
                  # a file is sized by the CamelFileLength header its consumer set, without a read;
                  # the header is believed only next to that file, elsewhere it may be stale or
                  # caller-supplied. A plain java.io.File, and a cache spooled to disk, the only one
                  # past an int, are sized by their long length(). Other bodies are measured; a
                  # capped stream's size is unknown
                  - choice:
                      when:
                        - expression:
                            simple:
                              expression: "${body} is 'org.apache.camel.WrappedFile' && ${header.CamelFileLength} != null"
                          steps:
                            - choice:
                                when:
                                  - expression:
                                      simple:
                                        expression: "${header.CamelFileLength} > {{maxDocumentSize}}"
                                    steps:
                                      - throwException:
                                          exceptionType: java.lang.IllegalArgumentException
                                          message: "Document '${exchangeProperty.CamelLangChain4jIngestDocumentId}' exceeds maxDocumentSize (${header.CamelFileLength} > {{maxDocumentSize}} bytes)"
                        - expression:
                            simple:
                              expression: "${body} is 'java.io.File' || ${body} is 'org.apache.camel.converter.stream.FileInputStreamCache'"
                          steps:
                            - choice:
                                when:
                                  - expression:
                                      simple:
                                        expression: "${body.length()} > {{maxDocumentSize}}"
                                    steps:
                                      - throwException:
                                          exceptionType: java.lang.IllegalArgumentException
                                          message: "Document '${exchangeProperty.CamelLangChain4jIngestDocumentId}' exceeds maxDocumentSize (${body.length()} > {{maxDocumentSize}} bytes)"
                        - expression:
                            simple:
                              expression: "${length()} > {{maxDocumentSize}}"
                          steps:
                            - throwException:
                                exceptionType: java.lang.IllegalArgumentException
                                message: "Document '${exchangeProperty.CamelLangChain4jIngestDocumentId}' exceeds maxDocumentSize (more than {{maxDocumentSize}} bytes)"
        # tika answers plain text (body only, blocks newline-separated), or XHTML, at the pinned encoding
        - to:
            uri: tika
            parameters:
              operation: parse
              tikaParseOutputEncoding: UTF-8
              tikaParseOutputFormat: "{{outputFormat}}"
        # a message- or document-supplied charset header outranks the charset the conversion
        # below sets, so it is swept before the bytes are decoded at the pinned UTF-8.
        # These three steps are the declarative twin of the camel-langchain4j-ingest
        # component's TikaTextDecode processor, reimplemented here on purpose so a generic
        # parse action does not depend on that component - keep the two in step
        - removeHeaders:
            pattern: CamelCharsetName
        - convertBodyTo:
            type: byte[]
        - convertBodyTo:
            type: java.lang.String
            charset: UTF-8
        # past the parse, non-Camel headers are parsed document metadata (Content-Type,
        # dc:* and friends) - Camel-namespace names were already filtered by camel-tika,
        # the rest must not leak into later steps as if the caller had set them
        - removeHeaders:
            pattern: "*"
            excludePattern: Camel*
