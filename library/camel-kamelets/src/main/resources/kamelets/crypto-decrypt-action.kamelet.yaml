apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: crypto-decrypt-action
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Actions"
    camel.apache.org/kamelet.namespace: "Transformation"
  labels:
    camel.apache.org/kamelet.type: "action"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "Crypto Decrypt Action"
    description: |-
      Decrypts the body of each message that `crypto-encrypt-action` encrypted, with the same algorithm and secret key.

      Use it to get back the original data that was encrypted with `crypto-encrypt-action`, for example after reading it from storage or receiving it from another system.

      Input: the encrypted data exactly as `crypto-encrypt-action` produced it, as bytes or a stream. If it was encoded on the way, for example in Base64, decode it first.

      Output: the body is the original data, as bytes (a stream), and the `Content-Type` header is `application/octet-stream`. The other headers are kept.

      Good to know: set the `Content-Type` header again to the type of the original data when the next step needs it, for example with `insert-header-action`. Data that was changed, or a different `algorithm`, `mode` or `key` than when encrypting, fails the message with "Message authentication failed". The key is a secret; keep it in a vault or a secret, not in plain configuration. The algorithm, the mode and the key come only from the options: the `CamelCrypto*` headers of the incoming message, such as `CamelCryptoInitVector`, are removed first.
    required:
      - algorithm
      - key
    type: object
    properties:
      algorithm:
        title: Algorithm
        description: "The name of the encryption algorithm the data was encrypted with, such as `AES`, or `DESede` for Triple DES. Give the name alone: a full form such as `AES/CBC/PKCS5Padding` fails each message; the mode is set with `mode`."
        type: string
        example: "AES"
      mode:
        title: Mode
        description: "The block cipher mode, only `CBC`: each message is then encrypted with a new random initialization vector, which is put in front of the encrypted data, so the same text gives different bytes each time. When it is not set, `AES` and `DESede` use ECB mode, in which the same text with the same key always gives the same bytes, so repeats in the data can be seen. Use the same value in `crypto-encrypt-action`."
        type: string
        enum: ["CBC"]
        example: "CBC"
      key:
        title: Secret Key
        description: "The secret key the data was encrypted with, as text. Its length must fit the algorithm: for `AES`, 16, 24 or 32 characters (plain ASCII characters count as one byte each), and for `DESede`, 24."
        type: string
        format: password
        x-descriptors:
          - urn:camel:group:credentials
  dataTypes:
    in:
      default: binary
      types:
        binary:
          format: "application-octet-stream"
          description: "The encrypted data, as bytes or a stream."
          mediaType: application/octet-stream
    out:
      default: binary
      types:
        binary:
          format: "application-octet-stream"
          description: "The original data, as bytes or a stream."
          mediaType: application/octet-stream
  dependencies:
    - "camel:kamelet"
    - "camel:crypto"
  template:
    beans:
      - name: cryptoKey
        type: javax.crypto.spec.SecretKeySpec
        constructors:
          0: "{{key}}"
          1: "{{algorithm}}"
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: "CamelCrypto*"
        - choice:
            precondition: true
            when:
              - expression:
                  simple:
                    expression: "${propertiesExist:mode}"
                steps:
                  - unmarshal:
                      crypto:
                        algorithm: "{{algorithm}}/{{mode}}/PKCS5Padding"
                        key: "{{cryptoKey}}"
                        inline: true
            otherwise:
              steps:
                - unmarshal:
                    crypto:
                      algorithm: "{{algorithm}}"
                      key: "{{cryptoKey}}"
