apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: docling-convert-action
  labels:
    camel.apache.org/kamelet.type: "action"
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.22.1-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Actions"
    camel.apache.org/kamelet.namespace: "AI"
spec:
  definition:
    title: "Docling Convert Action"
    description: |-
      Convert PDF, office and similar documents to structure-preserving markdown with
      Docling, OCR included.

      Before the conversion, the value of the `documentIdHeader` header is captured into the
      `CamelLangChain4jIngestDocumentId` exchange property, so a converted document cannot
      forge its own identity in steps that read it later (the langchain4j-ingest sink does);
      the body is pinned to bytes and the `CamelDocling*` control headers are swept, because
      none of them may be decided by a consumer-delivered payload. By default the `docling`
      component executes a local docling CLI; set `doclingServeUrl` to use a Docling Serve
      instance instead - the natural fit for self-contained Pipes.
    type: object
    properties:
      documentIdHeader:
        title: Document Id Header
        description: Name of the header carrying the stable document id, captured into the
          CamelLangChain4jIngestDocumentId exchange property before the conversion.
        type: string
        default: CamelLangChain4jIngestDocumentId
      doclingServeUrl:
        title: Docling Serve URL
        description: Address of a Docling Serve instance to convert through, such as
          http://docling-serve:5001; when unset, the docling component's own configuration
          applies (a local docling CLI by default).
        type: string
      useDoclingServe:
        title: Use Docling Serve
        description: Whether to convert through a Docling Serve instance instead of a local
          docling CLI; set together with doclingServeUrl.
        type: boolean
  dependencies:
    - "camel:core"
    - "camel:docling"
    - "camel:kamelet"
  template:
    from:
      uri: "kamelet:source"
      steps:
        # captured before the conversion, so a document cannot forge its own identity
        - setProperty:
            name: "CamelLangChain4jIngestDocumentId"
            simple: "${header[{{documentIdHeader}}]}"
        - convertBodyTo:
            type: "byte[]"
        - removeHeaders:
            pattern: "CamelDocling*"
        - to:
            uri: "docling:convert"
            parameters:
              operation: "CONVERT_TO_MARKDOWN"
              contentInBody: "true"
              useDoclingServe: "{{?useDoclingServe}}"
              doclingServeUrl: "{{?doclingServeUrl}}"
