apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: kafka-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Kafka"
    camel.apache.org/kamelet.namespace: "Kafka"
  labels:
    camel.apache.org/kamelet.type: "source"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "Kafka Source"
    description: |-
      Receives each record from one or more topics in Apache Kafka, or in a Kafka-compatible service such as Amazon MSK, Confluent Cloud or Redpanda.

      Use it to react to events or data that other applications publish, such as orders, sensor readings or changes from a database. To get many records in one message use `kafka-batch-source`. When the records are written with a schema kept in a schema registry, such as Confluent Schema Registry, Redpanda or Apicurio Registry, set `schemaRegistryVendor`.

      Output: the body is the value of the record, as text. With `schemaRegistryVendor`, the value is read with its schema from the registry and the body is JSON text, such as `{"id": 7, "item": "camel"}` for an Avro record. A Protobuf record is turned into JSON by the Protobuf JSON mapping, such as `{"id":7,"item":"camel"}`: the names of the fields are in lowerCamelCase (`orderNo` for `order_no`), 64-bit numbers are text, and the fields that have their default value, such as 0 or empty text, are left out. A record without a value (a tombstone) gives a message with no body. The `kafka-topic`, `kafka-key`, `kafka-partition`, `kafka-offset` and `kafka-timestamp` (in milliseconds since 1970) headers say where the record came from. They are also set as `ce-kafkatopic`, `ce-kafkakey` and so on, and as the `CamelKafka*` headers that the Kafka actions read. The record headers become message headers, as text unless `deserializeHeaders` is false.

      Good to know: `saslAuthType` has no default and must be set; `NONE` connects with no login and no TLS. A new consumer group starts at the newest records, unless `autoOffsetReset` is `earliest`. Without `consumerGroup`, every start uses a new group, so the records sent while the integration was stopped are skipped. With `schemaRegistryVendor`, the integration needs the serde jars of the vendor, which Camel JBang downloads by itself; for `confluent` add the Confluent Maven repository, as in `camel run --repos=confluent`. With `aws-glue` and `azure`, the serde logs in with the credentials of the environment the integration runs in: the AWS default credentials chain, or the Azure `DefaultAzureCredential` (such as the `AZURE_CLIENT_ID`, `AZURE_TENANT_ID` and `AZURE_CLIENT_SECRET` variables). To log in to a `confluent` or `apicurio` registry, set `schemaRegistryUsername` and `schemaRegistryPassword` (for Confluent Cloud, the API key and secret of the Schema Registry), or the OAuth2 client credentials `schemaRegistryOauthClientId`, `schemaRegistryOauthClientSecret` and `schemaRegistryOauthTokenEndpoint`, such as of a Keycloak client; these options are not used with `aws-glue` and `azure`, and setting one fails at startup. Kafka only calls an OAuth2 token endpoint that is listed in the JVM system property `org.apache.kafka.sasl.oauthbearer.allowed.urls`, such as with `camel run --jvm-args=-Dorg.apache.kafka.sasl.oauthbearer.allowed.urls=https://idp.example.com/oauth2/token`; without it, the integration fails to start with `The URL cannot be accessed due to restrictions`. This applies to `schemaRegistryOauthTokenEndpoint` and to the `oauthTokenEndpointUri` of `saslAuthType` `OAUTH`.
    required:
      - topic
      - bootstrapServers
      - saslAuthType
    type: object
    properties:
      topic:
        title: Topic Names
        description: "The topics to read from, separated by commas. When `topicIsPattern` is true, a regular expression that the names of the topics must match instead."
        type: string
        example: "orders"
      bootstrapServers:
        title: Bootstrap Servers
        description: "The address of one or more Kafka brokers to connect to first, as `host:port`, separated by commas. The other brokers of the cluster are found from them."
        type: string
        example: "broker1:9092,broker2:9092"
      saslAuthType:
        title: Authentication Type
        description: "How to log in to Kafka. It has no default and must be set. `NONE` connects with no login and no TLS, as a local Kafka expects; `PLAIN`, `SCRAM_SHA_256` and `SCRAM_SHA_512` log in with `saslUsername` and `saslPassword`; `SSL` connects over TLS and logs in with the client certificate in `sslKeystoreLocation`, when set; `OAUTH` logs in with the `oauth` options; `AWS_MSK_IAM` (Amazon MSK) and `KERBEROS` take their credentials from the environment the integration runs in. All types except `NONE` connect over TLS."
        type: string
        enum: ["NONE", "PLAIN", "SCRAM_SHA_256", "SCRAM_SHA_512", "SSL", "OAUTH", "AWS_MSK_IAM", "KERBEROS"]
      saslUsername:
        title: Username
        description: "The user name to log in to Kafka with. Required when `saslAuthType` is `PLAIN`, `SCRAM_SHA_256` or `SCRAM_SHA_512`."
        type: string
        x-descriptors:
          - urn:camel:group:credentials
      saslPassword:
        title: Password
        description: "The password of `saslUsername`. Required when `saslAuthType` is `PLAIN`, `SCRAM_SHA_256` or `SCRAM_SHA_512`."
        type: string
        format: password
        x-descriptors:
          - urn:camel:group:credentials
      oauthClientId:
        title: OAuth Client ID
        description: "The ID of the client registered with the OAuth 2.0 provider. Required when `saslAuthType` is `OAUTH`."
        type: string
      oauthClientSecret:
        title: OAuth Client Secret
        description: "The secret of the OAuth client `oauthClientId`, from the OAuth 2.0 provider. Required when `saslAuthType` is `OAUTH`."
        type: string
        format: password
        x-descriptors:
          - urn:camel:group:credentials
      oauthTokenEndpointUri:
        title: OAuth Token URL
        description: "The URL of the OAuth 2.0 provider where the Kamelet gets its access token. Required when `saslAuthType` is `OAUTH`. The URL must also be listed in the JVM system property `org.apache.kafka.sasl.oauthbearer.allowed.urls`, or the integration fails to start."
        type: string
        example: "https://auth.example.com/oauth2/token"
      oauthScope:
        title: OAuth Scope
        description: "The scope to ask the OAuth 2.0 provider for, when it requires one. Only used when `saslAuthType` is `OAUTH`."
        type: string
        example: "kafka"
      sslTruststoreLocation:
        title: SSL Truststore Location
        description: "The path of a trust store file, in JKS format, with the certificates to trust the brokers by. Needed only when the brokers use a certificate that Java does not trust by default, such as a self-signed one."
        type: string
        example: "/etc/kafka/truststore.jks"
      sslTruststorePassword:
        title: SSL Truststore Password
        description: "The password of the trust store file in `sslTruststoreLocation`."
        type: string
        format: password
        x-descriptors:
          - urn:camel:group:credentials
      sslKeystoreLocation:
        title: SSL Keystore Location
        description: "The path of a key store file, in JKS format, with the certificate and private key of the client. Needed only to log in with a client certificate (mutual TLS), usually with `saslAuthType` `SSL`."
        type: string
        example: "/etc/kafka/keystore.jks"
      sslKeystorePassword:
        title: SSL Keystore Password
        description: "The password of the key store file in `sslKeystoreLocation`."
        type: string
        format: password
        x-descriptors:
          - urn:camel:group:credentials
      sslKeyPassword:
        title: SSL Key Password
        description: "The password of the private key in the key store file in `sslKeystoreLocation`."
        type: string
        format: password
        x-descriptors:
          - urn:camel:group:credentials
      autoCommitEnable:
        title: Auto Commit
        description: "If true, the position reached in each partition (the offset) is saved in Kafka automatically every 5 seconds, so that a restarted integration goes on from there. Set it to false together with `allowManualCommit` true to save the position yourself with `kafka-manual-commit-action`."
        type: boolean
        default: true
      allowManualCommit:
        title: Allow Manual Commit
        description: "If true, each message carries what `kafka-manual-commit-action` needs to save the position of its record in Kafka. Set `autoCommitEnable` to false too, or the position is also saved automatically."
        type: boolean
        default: false
      pollOnError:
        title: Poll On Error Behavior
        description: "What to do when reading from Kafka fails: `ERROR_HANDLER` logs the error and goes on with the next records, `DISCARD` skips the records that failed, `RECONNECT` connects again and retries, `RETRY` reads the same records again, and `STOP` stops reading until the integration is restarted."
        type: string
        default: "ERROR_HANDLER"
        enum: ["DISCARD", "ERROR_HANDLER", "RECONNECT", "RETRY", "STOP"]
      autoOffsetReset:
        title: Auto Offset Reset
        description: "Where to start when the consumer group has no saved position yet: `latest` reads only the records sent from now on, `earliest` reads all the records still in the topic, and `none` fails."
        type: string
        default: "latest"
        example: "earliest"
      consumerGroup:
        title: Consumer Group
        description: "The name of the consumer group. Integrations with the same group share the records of the topics between them, and the group remembers the position reached, so that a restarted integration goes on where it stopped. When it is not set, a new random group is used on every start."
        type: string
        example: "my-group-id"
      deserializeHeaders:
        title: Automatically Deserialize Headers
        description: "If true, the values of the record headers are turned into text. If false, they stay bytes."
        type: boolean
        default: true
      topicIsPattern:
        title: Topic Is Pattern
        description: "If true, `topic` is a regular expression, such as `orders-.*`, and the Kamelet reads from every topic whose name matches it."
        type: boolean
        default: false
      schemaRegistryVendor:
        title: Schema Registry Vendor
        description: "The schema registry that holds the schemas of the record values: `confluent`, also for registries with the Confluent API such as Redpanda and Karapace; `apicurio` (Apicurio Registry 3.x); `aws-glue` (AWS Glue Schema Registry); or `azure` (Azure Schema Registry of Event Hubs). It sets the value deserializer and the registry properties, and its jars must be added to the integration (see below). Leave it unset when the records do not use a schema registry."
        type: string
        enum: ["confluent", "apicurio", "aws-glue", "azure"]
      schemaRegistryUrl:
        title: Schema Registry URL
        description: "The URL of the schema registry: for `confluent` such as `http://localhost:8081`; for `apicurio` the URL of the registry API, such as `http://localhost:8080/apis/registry/v3`; for `azure` the fully qualified name of the Event Hubs namespace, such as `my-namespace.servicebus.windows.net`. Required when `schemaRegistryVendor` is set, except for `aws-glue`, where it can override the endpoint of the Glue service."
        type: string
        pattern: "^(https?://)?[^\\s]+$"
      schemaRegistryRegion:
        title: Schema Registry Region
        description: "The AWS region of the AWS Glue Schema Registry, such as `eu-west-1`. When not set, the region is taken from the environment, such as the `AWS_REGION` variable. Only used when `schemaRegistryVendor` is `aws-glue`."
        type: string
      schemaRegistryName:
        title: Schema Registry Name
        description: "The name of the registry in AWS Glue. When not set, it is `default-registry`. Only used when `schemaRegistryVendor` is `aws-glue`."
        type: string
      schemaFormat:
        title: Schema Format
        description: "The format of the record values in the schema registry: `avro`, `json` (JSON Schema) or `protobuf` (Protocol Buffers). With `apicurio`, use `avro` or `protobuf`; with `azure`, use `avro`. Only used when `schemaRegistryVendor` is set."
        type: string
        enum: ["avro", "json", "protobuf"]
        default: avro
      schemaRegistryUsername:
        title: Schema Registry Username
        description: "The username to log in to a `confluent` or `apicurio` schema registry, with `schemaRegistryPassword`. For Confluent Cloud, the API key of the Schema Registry."
        type: string
        x-descriptors:
          - urn:camel:group:credentials
      schemaRegistryPassword:
        title: Schema Registry Password
        description: "The password of `schemaRegistryUsername`. For Confluent Cloud, the API secret of the Schema Registry."
        type: string
        format: password
        x-descriptors:
          - urn:camel:group:credentials
      schemaRegistryOauthTokenEndpoint:
        title: Schema Registry OAuth Token Endpoint
        description: "The token endpoint of the OAuth2 server, to log in to a `confluent` or `apicurio` schema registry with client credentials, such as the token endpoint of a Keycloak realm. The URL must also be listed in the JVM system property `org.apache.kafka.sasl.oauthbearer.allowed.urls`, or the integration fails to start."
        type: string
        example: "http://keycloak:8080/realms/registry/protocol/openid-connect/token"
      schemaRegistryOauthClientId:
        title: Schema Registry OAuth Client ID
        description: "The OAuth2 client id, to log in to a `confluent` or `apicurio` schema registry with client credentials."
        type: string
        x-descriptors:
          - urn:camel:group:credentials
      schemaRegistryOauthClientSecret:
        title: Schema Registry OAuth Client Secret
        description: "The OAuth2 client secret of `schemaRegistryOauthClientId`."
        type: string
        format: password
        x-descriptors:
          - urn:camel:group:credentials
      schemaRegistryOauthScope:
        title: Schema Registry OAuth Scope
        description: "The OAuth2 scope to ask for when logging in to the schema registry with client credentials (optional)."
        type: string
  dataTypes:
    # No 'default:' here on purpose: the body is text, or JSON text with `schemaRegistryVendor`, or no
    # body for a tombstone, and a text default would mark the JSON as text/plain too. See #3117.
    out:
      headers:
        kafka-topic:
          title: Kafka Topic
          description: "The topic the record was read from."
          type: string
        kafka-key:
          title: Kafka Key
          description: "The key of the record. Not set when the record has no key."
          type: string
        kafka-partition:
          title: Kafka Partition
          description: "The number of the partition the record was read from."
          type: integer
        kafka-offset:
          title: Kafka Offset
          description: "The position of the record in its partition."
          type: integer
        kafka-timestamp:
          title: Kafka Timestamp
          description: "The time of the record, in milliseconds since 1970-01-01 UTC."
          type: integer
        ce-kafkatopic:
          title: CloudEvents Kafka Topic
          description: "The same as `kafka-topic`."
          type: string
        ce-kafkakey:
          title: CloudEvents Kafka Key
          description: "The same as `kafka-key`."
          type: string
        ce-kafkapartition:
          title: CloudEvents Kafka Partition
          description: "The same as `kafka-partition`."
          type: integer
        ce-kafkaoffset:
          title: CloudEvents Kafka Offset
          description: "The same as `kafka-offset`."
          type: integer
        ce-kafkatimestamp:
          title: CloudEvents Kafka Timestamp
          description: "The same as `kafka-timestamp`."
          type: integer
  dependencies:
    - "camel:jackson3"
    - "camel:kafka"
    - "camel:kamelet"
  template:
    beans:
      - name: kafkaHeaderDeserializer
        type: "#class:org.apache.camel.component.kafka.KafkaHeaderDeserializer"
        properties:
          enabled: "{{deserializeHeaders}}"
    from:
      uri: kafka
      parameters:
        topic: "{{topic}}"
        additionalProperties.region: "{{?schemaRegistryRegion}}"
        additionalProperties.registry.name: "{{?schemaRegistryName}}"
        allowManualCommit: "{{allowManualCommit}}"
        autoCommitEnable: "{{autoCommitEnable}}"
        autoOffsetReset: "{{autoOffsetReset}}"
        brokers: "{{bootstrapServers}}"
        groupId: "{{?consumerGroup}}"
        oauthClientId: "{{?oauthClientId}}"
        oauthClientSecret: "RAW({{?oauthClientSecret}})"
        oauthScope: "{{?oauthScope}}"
        oauthTokenEndpointUri: "{{?oauthTokenEndpointUri}}"
        pollOnError: "{{pollOnError}}"
        saslAuthType: "{{saslAuthType}}"
        saslPassword: "RAW({{?saslPassword}})"
        saslUsername: "{{?saslUsername}}"
        schemaFormat: "{{schemaFormat}}"
        schemaRegistryURL: "{{?schemaRegistryUrl}}"
        schemaRegistryVendor: "{{?schemaRegistryVendor}}"
        schemaRegistryUsername: "{{?schemaRegistryUsername}}"
        schemaRegistryPassword: "RAW({{?schemaRegistryPassword}})"
        schemaRegistryOauthTokenEndpoint: "{{?schemaRegistryOauthTokenEndpoint}}"
        schemaRegistryOauthClientId: "{{?schemaRegistryOauthClientId}}"
        schemaRegistryOauthClientSecret: "RAW({{?schemaRegistryOauthClientSecret}})"
        schemaRegistryOauthScope: "{{?schemaRegistryOauthScope}}"
        sslKeyPassword: "RAW({{?sslKeyPassword}})"
        sslKeystoreLocation: "{{?sslKeystoreLocation}}"
        sslKeystorePassword: "RAW({{?sslKeystorePassword}})"
        sslTruststoreLocation: "{{?sslTruststoreLocation}}"
        sslTruststorePassword: "RAW({{?sslTruststorePassword}})"
        topicIsPattern: "{{topicIsPattern}}"
      steps:
        - process:
            ref: "{{kafkaHeaderDeserializer}}"
        # Kafka record metadata, surfaced under names that are not Camel
        # internals, so a downstream consumer does not have to depend on the
        # CamelKafka* headers. Plain form plus a CloudEvents one, as
        # infinispan-source and ftp-source do. The CamelKafka* headers are left
        # in place, so existing consumers are unaffected.
        - setHeader:
            name: kafka-topic
            expression:
              simple:
                expression: "${header[CamelKafkaTopic]}"
        - setHeader:
            name: ce-kafkatopic
            expression:
              simple:
                expression: "${header[CamelKafkaTopic]}"
        - setHeader:
            name: kafka-key
            expression:
              simple:
                expression: "${header[CamelKafkaKey]}"
        - setHeader:
            name: ce-kafkakey
            expression:
              simple:
                expression: "${header[CamelKafkaKey]}"
        - setHeader:
            name: kafka-partition
            expression:
              simple:
                expression: "${header[CamelKafkaPartition]}"
        - setHeader:
            name: ce-kafkapartition
            expression:
              simple:
                expression: "${header[CamelKafkaPartition]}"
        - setHeader:
            name: kafka-offset
            expression:
              simple:
                expression: "${header[CamelKafkaOffset]}"
        - setHeader:
            name: ce-kafkaoffset
            expression:
              simple:
                expression: "${header[CamelKafkaOffset]}"
        - setHeader:
            name: kafka-timestamp
            expression:
              simple:
                expression: "${header[CamelKafkaTimestamp]}"
        - setHeader:
            name: ce-kafkatimestamp
            expression:
              simple:
                expression: "${header[CamelKafkaTimestamp]}"
        - choice:
            when:
              - expression:
                  simple:
                    expression: "'{{?schemaRegistryVendor}}' != '' && '{{schemaFormat}}' == 'json' && ${body} != null && ${body} !is 'java.lang.String'"
                steps:
                  - marshal:
                      json:
                        library: Jackson
                  - convertBodyTo:
                      type: java.lang.String
              # A Protobuf message (a DynamicMessage, or a generated class) becomes the JSON of the Protobuf JSON
              # mapping, as its toString() is the Protobuf text format, which is not JSON. JsonFormat is in
              # protobuf-java-util, which the Protobuf serdes of Confluent and Apicurio bring; it is looked up only
              # when a record is read, so that no other version of Protobuf is put on the classpath first.
              - expression:
                  simple:
                    expression: "'{{?schemaRegistryVendor}}' != '' && '{{schemaFormat}}' == 'protobuf' && ${body} != null && ${body} !is 'java.lang.String'"
                steps:
                  - setBody:
                      expression:
                        simple:
                          expression: "${bean:type:com.google.protobuf.util.JsonFormat?method=printer().omittingInsignificantWhitespace().print(${body})}"
              - expression:
                  simple:
                    expression: "'{{?schemaRegistryVendor}}' != '' && ${body} != null && ${body} !is 'java.lang.String'"
                steps:
                  - setBody:
                      expression:
                        simple:
                          expression: "${body.toString()}"
        - to:
            uri: kamelet:sink
