apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: aws-redshift-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "AWS Redshift"
    camel.apache.org/kamelet.namespace: "AWS"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "AWS Redshift Source"
    description: |-
      Runs an SQL query on an Amazon Redshift database at regular intervals, and sends each row of the result as a message.

      Use it to pick up records from a Redshift data warehouse, such as new orders or daily figures, and pass them on to another system. To write to Redshift, use `aws-redshift-sink`.

      Output: one message per row. The body is the row as a JSON object, in JSON text, with the column names as field names, such as `{"id":1,"username":"alice","city":"Rome"}`. The `Content-Type` header is `application/json`.

      Good to know: the query runs again every `delay` milliseconds, and returns the same rows each time unless they change; set `consumedQuery` to mark or delete each row once it has been sent. It logs in with a database user and password, not with AWS keys, and connects with the Amazon Redshift JDBC driver, which uses TLS by default. Other settings of the driver go in `connectionProperties`.
    required:
      - serverName
      - username
      - password
      - query
      - databaseName
    type: object
    properties:
      serverName:
        title: Server Name
        description: "The host name of the Redshift cluster: its endpoint, as shown in the Redshift console, without the port and the database name."
        type: string
        example: my-cluster.abc123xyz789.eu-west-1.redshift.amazonaws.com
      serverPort:
        title: Server Port
        description: The port of the cluster. Redshift uses 5439 unless it was changed when the cluster was created.
        type: string
        default: 5439
      username:
        title: Username
        description: The database user to log in as, such as the admin user of the cluster. This is a user of the database, not an AWS access key.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      password:
        title: Password
        description: The password of `username`, set when the cluster or the user was created.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      query:
        title: Query
        description: The SQL query to run at each poll. Each row of the result becomes a message.
        type: string
        example: SELECT * FROM orders WHERE exported = false
      databaseName:
        title: Database Name
        description: The name of the database in the cluster, such as `dev`, the database a new cluster has.
        type: string
        example: dev
      consumedQuery:
        title: Consumed Query
        description: An SQL statement to run after each row has been sent, to mark it as done or delete it, so that it is not read again. Write `:#name` where the value of the column `name` of the row goes.
        type: string
        example: UPDATE orders SET exported = true WHERE id = :#id
      delay:
        title: Delay
        description: How long to wait between two runs of the query, in milliseconds.
        type: integer
        default: 500
      connectionProperties:
        title: Connection Properties
        description: "Extra settings for the Amazon Redshift JDBC driver, as `name=value` pairs separated by `;`, such as `loginTimeout=30`. When it is not set, the driver connects with TLS, as it does by default. The value is not hidden like a password, and it can show in the log when the integration starts, so do not put a password in it."
        type: string
        example: loginTimeout=30
  types:
    out:
      mediaType: application/json
  dependencies:
  - "camel:jackson"
  - "camel:kamelet"
  - "camel:sql"
  - "mvn:com.amazon.redshift:redshift-jdbc42:2.3.0"
  - "mvn:org.apache.commons:commons-dbcp2:2.14.0"
  template:
    beans:
      - name: local-sql-redshift-source
        type: "#class:org.apache.camel.component.sql.SqlComponent"
        properties:
          autowiredEnabled: "false"
      - name: dsBean
        type: "#class:org.apache.commons.dbcp2.BasicDataSource"
        properties:
          username: "{{username}}"
          password: "{{password}}"
          url: "jdbc:redshift://{{serverName}}:{{serverPort}}/{{databaseName}}"
          driverClassName: com.amazon.redshift.jdbc.Driver
          connectionProperties: "{{?connectionProperties}}"
    from:
      uri: "{{local-sql-redshift-source}}:{{query}}?dataSource=#bean:{{dsBean}}&onConsume=RAW({{?consumedQuery}})&delay={{delay}}"
      steps:
        - marshal:
            json: {}
        - to:
            uri: kamelet:sink
