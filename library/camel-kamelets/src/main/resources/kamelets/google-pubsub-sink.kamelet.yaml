apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: google-pubsub-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Google Pubsub"
    camel.apache.org/kamelet.namespace: "GCP"
  labels:
    camel.apache.org/kamelet.type: "sink"
spec:
  definition:
    title: "Google Pubsub Sink"
    description: |-
      Publishes each message to a topic in Google Cloud Pub/Sub.

      Use it to send events or data to other applications that read the topic through a subscription, such as orders, sensor readings or notifications. To read messages from a subscription, use `google-pubsub-source`.

      Input: the body becomes the data of the Pub/Sub message, as text (sent as UTF-8) or bytes. Turn structured data such as a Map into JSON text first, for example with `json-serialize-action`. The headers of the message, except the Camel ones, are sent as attributes of the Pub/Sub message.

      Output: the message is unchanged, with the ID that Pub/Sub gave the published message in the `CamelGooglePubsubMessageId` header.

      Good to know: the topic must exist; a message sent to a topic that does not exist fails. Without `serviceAccountKey`, it logs in with the Application Default Credentials of the environment where it runs. Pub/Sub delivers the messages in any order. To have the messages with the same `CamelGooglePubsubOrderingKey` header delivered in the order they were published, set `messageOrderingEnabled` to true and `pubsubEndpoint` to a regional endpoint, and enable message ordering on the subscription. A message with that header fails when `messageOrderingEnabled` is not true.
    required:
      - projectId
      - destinationName
    type: object
    properties:
      projectId:
        title: Project ID
        description: The ID of the Google Cloud project that holds the topic, as shown in the Google Cloud console. It is the project ID, not the project name or number.
        type: string
        example: my-project-123
      destinationName:
        title: Topic Name
        description: The name of the topic to publish to, without the `projects/.../topics/` part.
        type: string
        example: orders
      serviceAccountKey:
        title: Service Account Key
        description: "The JSON key of a service account that may publish to the topic, encoded in Base64: create the key in the Google Cloud console under IAM & Admin > Service Accounts > Keys, then encode the downloaded file, for example with `base64 -w0 key.json`. When it is not set, the Application Default Credentials are used: the key file named in the `GOOGLE_APPLICATION_CREDENTIALS` environment variable, or the service account of the Google Cloud machine it runs on."
        type: binary
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      messageOrderingEnabled:
        title: Message Ordering Enabled
        description: If true, the messages with the same `CamelGooglePubsubOrderingKey` header are published in the order they come in, so that a subscription with message ordering enabled delivers them in that order. When it is not set, it is false, and a message with that header fails. Set `pubsubEndpoint` too, as the order is only kept for messages published to the same region; without it, a warning is logged.
        type: boolean
      pubsubEndpoint:
        title: Pub/Sub Endpoint
        description: The Pub/Sub service to publish to, as host and port, such as the regional endpoint `europe-west1-pubsub.googleapis.com:443`. When it is not set, it is the global endpoint `pubsub.googleapis.com:443`, which may route the messages to different regions.
        type: string
        example: europe-west1-pubsub.googleapis.com:443
        pattern: "^[A-Za-z0-9.-]+:[0-9]+$"
  dataTypes:
    in:
      headers:
        CamelGooglePubsubOrderingKey:
          title: Ordering Key
          description: The messages with the same ordering key, such as a customer ID, are delivered in the order they were published, when `messageOrderingEnabled` is true and the subscription has message ordering enabled. A message with this header fails when `messageOrderingEnabled` is not true.
          type: string
    out:
      headers:
        CamelGooglePubsubMessageId:
          title: Message ID
          description: The ID that Pub/Sub gave the published message.
          type: string
  dependencies:
    - "camel:kamelet"
    - "camel:google-pubsub"
    - "camel:jackson3"
  template:
    from:
      uri: kamelet:source
      steps:
        - to:
            uri: "google-pubsub://{{projectId}}:{{destinationName}}?messageOrderingEnabled={{?messageOrderingEnabled}}&pubsubEndpoint={{?pubsubEndpoint}}&serviceAccountKey=base64:{{?serviceAccountKey}}"
