apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: aws-ec2-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "AWS EC2"
    camel.apache.org/kamelet.namespace: "AWS"
  labels:
    camel.apache.org/kamelet.type: "sink"
spec:
  definition:
    title: "AWS EC2 Sink"
    description: |-
      Asks Amazon EC2 for the status of virtual machines (instances), such as whether they run and pass their health checks, each time a message arrives, or starts, stops or reboots them.

      Use it to check regularly that your EC2 instances are running and healthy, for example every few minutes from `timer-source`, and raise an alert when a check fails, or to start and stop test machines on a schedule.

      Input: the body is not used. The `instanceIds` header (or `ce-instanceids`) is a comma-separated list of the IDs of the instances, such as `i-0abc123,i-0def456`. For the status, it is optional; without it, the status of all the running instances of the region is returned. To start, stop or reboot, it is required.

      Output: the body is the answer of AWS, an object of the AWS SDK for Java (not JSON text). By default, a `DescribeInstanceStatusResponse`, with for each instance its ID, availability zone, state (such as `running`) and the results of the instance and system status checks. When there are more results than fit, the `CamelAwsEC2NextToken` header holds the token of the next page. `describeInstances` gives a `DescribeInstancesResponse`, and `startInstances` and `stopInstances` a `StartInstancesResponse` or `StopInstancesResponse` with the previous and the new state of each instance, such as `stopped` and `pending`. `rebootInstances` leaves the body as it was.

      Good to know: by default it only reads, and never starts, stops or changes an instance; `operation` chooses another action. It cannot create or terminate instances. With Camel 4.23, the `instanceIds` header is ignored: the status of all the instances is returned, and start, stop and reboot reach no instance. To reach AWS through an HTTP proxy, set `proxyHost` and `proxyPort`, and set `proxyProtocol` to `HTTP` for a proxy that takes plain HTTP, such as Squid.
    required:
      - region
    type: object
    properties:
      accessKey:
        title: Access Key
        description: "The access key ID of an IAM user, which AWS gives when you create an access key for the user (in the AWS console: IAM, Users, Security credentials). Use it together with `secretKey`, or leave both empty and set `useDefaultCredentialsProvider` or `useProfileCredentialsProvider` instead."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      secretKey:
        title: Secret Key
        description: The secret access key that goes with `accessKey`. AWS shows it only once, when the access key is created.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      region:
        title: AWS Region
        description: The AWS region of the instances, such as `eu-west-1`.
        type: string
        example: eu-west-1
        enum: ["ap-south-1", "eu-south-1", "us-gov-east-1", "me-central-1", "ca-central-1", "eu-central-1", "us-iso-west-1", "us-west-1", "us-west-2", "af-south-1", "eu-north-1", "eu-west-3", "eu-west-2", "eu-west-1", "ap-northeast-3", "ap-northeast-2", "ap-northeast-1", "me-south-1", "sa-east-1", "ap-east-1", "cn-north-1", "us-gov-west-1", "ap-southeast-1", "ap-southeast-2", "us-iso-east-1", "ap-southeast-3", "us-east-1", "us-east-2", "cn-northwest-1", "us-isob-east-1", "aws-global", "aws-cn-global", "aws-us-gov-global", "aws-iso-global", "aws-iso-b-global"]
      useDefaultCredentialsProvider:
        title: Default Credentials Provider
        description: "If true, the credentials are found the way the AWS SDK finds them: from the `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY` environment variables, the shared credentials file, or the IAM role of the machine, container or pod it runs on. Then `accessKey` and `secretKey` are not needed."
        type: boolean
        default: false
      useProfileCredentialsProvider:
        title: Profile Credentials Provider
        description: If true, the credentials are read from a profile of the AWS credentials file (`~/.aws/credentials`), the one named in `profileCredentialsName`.
        type: boolean
        default: false
      useSessionCredentials:
        title: Session Credentials
        description: "If true, it logs in with temporary credentials, such as those of an assumed IAM role: `accessKey`, `secretKey` and `sessionToken` together."
        type: boolean
        default: false
      profileCredentialsName:
        title: Profile Credentials Name
        description: The name of the profile to use from the AWS credentials file. Only used when `useProfileCredentialsProvider` is true.
        type: string
      sessionToken:
        title: Session Token
        description: The session token of temporary credentials, which AWS gives together with their access key and secret key. Only used when `useSessionCredentials` is true.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      uriEndpointOverride:
        title: Overwrite Endpoint URI
        description: The address to send the requests to instead of the usual AWS address, such as `http://localhost:4566` for LocalStack. Only used when `overrideEndpoint` is true.
        type: string
        example: http://localhost:4566
      overrideEndpoint:
        title: Endpoint Overwrite
        description: If true, the requests go to the address in `uriEndpointOverride` instead of AWS, for example to test against LocalStack.
        type: boolean
        default: false
      proxyHost:
        title: Proxy Host
        description: The host name or IP address of an HTTP proxy to send the calls to AWS through, such as the proxy of a company network. Used only together with `proxyPort`. When it is not set, the calls go straight to AWS.
        type: string
        pattern: "^[A-Za-z0-9._-]+$"
        example: proxy.example.com
      proxyPort:
        title: Proxy Port
        description: The port of the proxy in `proxyHost`, such as `3128` for Squid. Used only together with `proxyHost`.
        type: integer
        example: 3128
      proxyProtocol:
        title: Proxy Protocol
        description: "How to talk to the proxy itself: `HTTP` or `HTTPS`. It is not the protocol of the calls to AWS, which stay encrypted, as the proxy only passes them on. When it is not set, it is `HTTPS`, which needs a proxy that takes TLS connections. Most company proxies, such as Squid, take plain HTTP: set `HTTP` for them. With the wrong one, every call fails, for example with `Unsupported or unrecognized SSL message`."
        type: string
        enum: ["HTTP", "HTTPS"]
        example: HTTP
      operation:
        title: Operation
        description: "What to do with each message: `describeInstancesStatus` gives the status of the instances and the results of their status checks; `describeInstances` gives their full details, such as type, image, IP addresses and tags; `startInstances`, `stopInstances` and `rebootInstances` start, stop or reboot the instances in the `instanceIds` header, which is then required."
        type: string
        default: describeInstancesStatus
        example: stopInstances
        enum: ["describeInstancesStatus", "describeInstances", "startInstances", "stopInstances", "rebootInstances"]
  dataTypes:
    in:
      headers:
        instanceIds:
          title: Instance IDs
          description: A comma-separated list of the IDs of the instances, such as `i-0abc123,i-0def456`. When it is not set, `ce-instanceids` is used. For the status, without either the status of all the running instances is returned; to start, stop or reboot, one of them is required.
          type: string
        ce-instanceids:
          title: Instance IDs (CloudEvents)
          description: The IDs of the instances, when the message is a CloudEvent. Used only when `instanceIds` is not set.
          type: string
    out:
      headers:
        CamelAwsEC2NextToken:
          title: Next Token
          description: Set when there are more results than fit; the token of the next page.
          type: string
  dependencies:
    - "camel:aws2-ec2"
    - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        # Strip the whole camel-aws2-ec2 header family up-front, before this
        # Kamelet applies its own contract below: the operation comes only from
        # the operation option (by default the read-only describeInstancesStatus)
        # and instanceIds / ce-instanceids is the only interface the definition
        # advertises. Using a pattern also covers CamelAwsEC2* keys the component
        # may add in the future. The pagination headers that
        # describeInstancesStatus and describeInstances read are kept.
        - removeHeaders:
            pattern: CamelAwsEC2*
            excludePattern: CamelAwsEC2(NextToken|MaxResults)
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[instanceIds]}"
                steps:
                  - setHeader:
                      name: CamelAwsEC2InstancesIds
                      expression:
                        simple:
                          expression: "${header[instanceIds]}"
              - expression:
                  simple:
                    expression: "${header[ce-instanceids]}"
                steps:
                  - setHeader:
                      name: CamelAwsEC2InstancesIds
                      expression:
                        simple:
                          expression: "${header[ce-instanceids]}"
        - to:
            uri: aws2-ec2
            parameters:
              label: ec2-route
              accessKey: "RAW({{?accessKey}})"
              operation: "{{operation}}"
              overrideEndpoint: "{{overrideEndpoint}}"
              profileCredentialsName: "{{?profileCredentialsName}}"
              region: "{{region}}"
              secretKey: "RAW({{?secretKey}})"
              sessionToken: "RAW({{?sessionToken}})"
              uriEndpointOverride: "{{?uriEndpointOverride}}"
              useDefaultCredentialsProvider: "{{useDefaultCredentialsProvider}}"
              useProfileCredentialsProvider: "{{useProfileCredentialsProvider}}"
              useSessionCredentials: "{{useSessionCredentials}}"
              proxyHost: "{{?proxyHost}}"
              proxyPort: "{{?proxyPort}}"
              proxyProtocol: "{{?proxyProtocol}}"
