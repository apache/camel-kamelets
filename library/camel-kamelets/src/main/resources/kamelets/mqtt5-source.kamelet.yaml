apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: mqtt5-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "MQTT 5"
    camel.apache.org/kamelet.namespace: "Messaging"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "MQTT 5 Source"
    description: |-
      Receives each message published to a topic on an MQTT broker, such as Eclipse Mosquitto or HiveMQ, with MQTT 5.

      Use it to collect readings and events from IoT devices and other MQTT clients, when the broker or the clients use MQTT 5. A topic with wildcards, such as `sensors/#`, receives from many topics at once. The broker must support MQTT 5.

      Output: the body is the payload, as bytes. The `CamelMqttTopic` header is the topic the message was published to, `CamelMqttQoS` its quality of service, and `CamelPahoMqtt5MsgProperties` holds the MQTT 5 properties of the message, such as its user properties.

      Good to know: it receives only the messages published while it is connected, plus, when it subscribes, the last retained message of each matching topic. It subscribes with quality of service 2 (exactly once) unless `qos` is set. Each running copy needs its own `clientId`: two clients with the same ID keep pushing each other off the broker and lose messages. When it is not set, a unique one is generated. It connects with no TLS unless `brokerUrl` starts with `ssl://`. With TLS it checks the certificate and the host name of the broker, and trusts the certificate authorities that Java trusts by default, or instead the ones in `sslTruststoreLocation`. The integration fails to start when the broker cannot be reached or fails these checks.
    required:
    - topic
    - brokerUrl
    type: object
    properties:
      topic:
        title: "Topic"
        description: "The topic to subscribe to. `+` matches one level of the topic and `#` all the levels below, as in `sensors/+/temperature` or `sensors/#`."
        type: string
        example: "sensors/#"
      brokerUrl:
        title: "Broker URL"
        description: "The address of the MQTT broker, as `tcp://host:port` (usually port 1883), or `ssl://host:port` for TLS (usually port 8883). For a broker with a certificate from a private or self-signed authority, also set `sslTruststoreLocation`."
        type: string
        example: "tcp://mosquitto:1883"
      clientId:
        title: "Client ID"
        description: "The client ID that names this connection to the broker. It must be unique on the broker: a second client with the same ID pushes the first one off. When it is not set, a unique ID is generated."
        example: "sensor-reader-1"
        type: string
      username:
        title: "Username"
        description: "The user name to log in to the broker with. Leave it empty for a broker that accepts clients without a login."
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      password:
        title: "Password"
        description: "The password to log in to the broker with, for the user `username`."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      qos:
        title: "Quality of Service"
        description: "The highest quality of service to receive messages with: 0 (at most once, with no confirmation), 1 (at least once, a message can arrive twice) or 2 (exactly once). The broker sends each message with the lower of this and the quality of service it was published with, which the `CamelMqttQoS` header tells. When it is not set, 2 is used."
        type: integer
        enum: [0, 1, 2]
        example: 1
      sslTruststoreLocation:
        title: "SSL Truststore Location"
        description: "The path of a trust store file, in JKS or PKCS12 format, with the certificate of the authority that signed the certificate of the broker. Needed only with an `ssl://` address when the broker uses a certificate that Java does not trust by default, such as one from a private or self-signed authority. Not used with `tcp://`."
        type: string
        example: "/etc/mqtt/truststore.jks"
      sslTruststorePassword:
        title: "SSL Truststore Password"
        description: "The password of the trust store file in `sslTruststoreLocation`."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
  dataTypes:
    out:
      headers:
        CamelMqttTopic:
          title: "Topic"
          description: "The topic the message was published to. With a wildcard in `topic`, it tells which topic matched."
          type: string
        CamelMqttQoS:
          title: "Quality of Service"
          description: "The quality of service of the message as received: 0, 1 or 2."
          type: integer
        CamelPahoMqtt5MsgProperties:
          title: "MQTT 5 Properties"
          description: "The MQTT 5 properties of the message, such as its user properties and content type, as an object of the Eclipse Paho client."
          type: object
  dependencies:
    - "camel:paho-mqtt5"
    - "camel:kamelet"
  template:
    from:
      uri: paho-mqtt5
      parameters:
        topic: "{{topic}}"
        brokerUrl: "{{brokerUrl}}"
        clientId: "{{?clientId}}"
        password: "RAW({{?password}})"
        userName: "RAW({{?username}})"
        qos: "{{?qos}}"
        "sslClientProps[com.ibm.ssl.trustStore]": "{{?sslTruststoreLocation}}"
        "sslClientProps[com.ibm.ssl.trustStorePassword]": "RAW({{?sslTruststorePassword}})"
      steps:
        - to:
            uri: kamelet:sink
