apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: github-pullrequest-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "GitHub"
    camel.apache.org/kamelet.namespace: "Cloud"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "GitHub Pull Request Source"
    description: |-
      Receives each new pull request opened in a GitHub repository, one message per pull request, by asking the GitHub API for new open pull requests.

      Use it to react when someone proposes a change, for example to announce the pull request in a chat channel, open a review ticket or start a check. To receive the comments on pull requests, use `github-pullrequest-comment-source`.

      Output: the body is the pull request as JSON text. The `CamelGitHubPullRequest` header gives its number, and `CamelGitHubPullRequestHeadCommitSha` the SHA of its latest commit.

      Good to know: only the pull requests opened after the start are sent, once each; updates, merges and closes are not. It works with github.com, not with GitHub Enterprise Server. It asks GitHub for new pull requests once a minute by default (`delay`), and every request counts against the API rate limit of the token.
    required:
      - repoName
      - repoOwner
      - oauthToken
    type: object
    properties:
      repoName:
        title: Repository Name
        description: The name of the repository, such as `camel` in `https://github.com/apache/camel`.
        type: string
        example: camel
      repoOwner:
        title: Repository Owner
        description: The user or organization that owns the repository, such as `apache` in `https://github.com/apache/camel`.
        type: string
        example: apache
      oauthToken:
        title: OAuth Token
        description: A GitHub personal access token, created on GitHub under Settings, Developer settings, Personal access tokens. It needs read access to the repository and its pull requests.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      delay:
        title: Delay
        description: How long to wait between two polls of GitHub, in milliseconds. For example, 60000 is one minute.
        type: integer
        default: 60000
  dataTypes:
    out:
      headers:
        CamelGitHubPullRequest:
          title: Pull Request Number
          description: The number of the pull request, as in `https://github.com/apache/camel/pull/42`.
          type: integer
        CamelGitHubPullRequestHeadCommitSha:
          title: Head Commit SHA
          description: The SHA of the latest commit of the pull request.
          type: string
  types:
    out:
      mediaType: application/json
  dependencies:
  - "camel:jackson3"
  - "camel:github2"
  - "camel:kamelet"
  template:
    from:
      uri: "github2://pullRequest?oauthToken=RAW({{oauthToken}})&repoName={{repoName}}&repoOwner={{repoOwner}}&delay={{delay}}"
      steps:
        - marshal:
            json: {}
        - to:
            uri: kamelet:sink
