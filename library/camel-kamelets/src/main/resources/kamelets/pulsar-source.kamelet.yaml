apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: pulsar-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Pulsar"
    camel.apache.org/kamelet.namespace: "Messaging"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  dataTypes:
    out:
      headers:
        topic_name:
          title: "Topic Name"
          description: "The full name of the topic the message came from, such as `persistent://public/default/orders`."
          type: string
        key:
          title: "Message Key"
          description: "The key of the message, when it has one."
          type: string
        properties:
          title: "Properties"
          description: "The Pulsar properties of the message, as a Map."
          type: object
        message_id:
          title: "Message ID"
          description: "The ID Pulsar gave the message."
          type: string
        publish_time:
          title: "Publish Time"
          description: "When the message was published, in milliseconds since 1970-01-01 UTC."
          type: integer
  dependencies:
    - "camel:pulsar"
    - "camel:kamelet"
  definition:
    title: "Pulsar Source"
    description: |-
      Receives each message from a topic in Apache Pulsar, or from every topic whose name matches a pattern, through a named subscription.

      Use it to process events or data that other applications publish to Pulsar. Several copies can share the work with a `SHARED` or `KEY_SHARED` subscription.

      Output: the body is the payload, as bytes. The headers give the topic (`topic_name`), the key (`key`), the Pulsar properties as a Map (`properties`), the `message_id`, the `publish_time` and the `producer_name`.

      Good to know: the subscription (`subscriptionName`, `subs` by default) remembers what was read, so messages sent while the source is stopped are read when it starts again. A new subscription starts at the newest message, unless `subscriptionInitialPosition` is `EARLIEST`. A message whose processing fails is delivered again after one minute, again and again, unless `maxRedeliverCount` is set with a `SHARED` or `KEY_SHARED` subscription. A message whose processing takes longer than `ackTimeoutMillis` (10 seconds when not set) is delivered again, and so processed twice. It connects with no TLS and no login, unless `serviceUrl` starts with `pulsar+ssl://` and `authenticationClass` is set. Over TLS, the certificate of Pulsar must be signed by an authority that the Java trust store of the integration trusts; for a private one, point `javax.net.ssl.trustStore` at a trust store with it, as the Kamelet has no trust store option.
    required:
      - topicType
      - topic
      - namespaceName
      - tenant
      - serviceUrl
    properties:
      topic:
        title: "Topic Name"
        description: "The name of the topic within the namespace to receive the messages from. When `topicsPattern` is true, a regular expression for the names of the topics instead, such as `orders-.*`."
        example: "orders"
        type: string
      tenant:
        title: "Tenant Name"
        description: "The Pulsar tenant that the namespace belongs to. A new Pulsar has the tenant `public`."
        example: "public"
        type: string
      topicType:
        title: "Topic Type"
        description: "Whether the topic is `persistent`, which stores the messages until they are read, or `non-persistent`, which stores nothing and drops the messages that no one is subscribed to."
        type: string
        enum: ["persistent", "non-persistent"]
      namespaceName:
        title: "Namespace Name"
        description: "The namespace within the tenant that holds the topic. A new Pulsar has the namespace `default` in the tenant `public`."
        example: "default"
        type: string
      serviceUrl:
        title: "Service URL"
        description: "The address of the Pulsar broker, as `pulsar://host:port` (the usual port is 6650), or `pulsar+ssl://host:port` for TLS (usually 6651)."
        example: "pulsar://localhost:6650"
        type: string        
      ackTimeoutMillis:
        title: "Acknowledgement Timeout"
        description: "How long the processing of a message may take, in milliseconds. A message that is not done by then is delivered again, and so processed twice. When it is not set, 10000 (10 seconds). 0 turns this off; a value from 1 to 999 makes the integration fail to start."
        type: integer
      authenticationClass:
        title: "Authentication Class"
        description: "The Java class of the Pulsar authentication plugin to log in with, such as `org.apache.pulsar.client.impl.auth.AuthenticationToken` for a token. Leave it empty for a Pulsar without login."
        example: "org.apache.pulsar.client.impl.auth.AuthenticationToken"
        type: string
      authenticationParams:
        title: "Authentication Params"
        description: "The settings of the plugin in `authenticationClass`, in the form that plugin expects: for `AuthenticationToken`, `token:` followed by the token."
        type: string
      consumerNamePrefix:
        title: "Consumer Name Prefix"
        description: "The start of the name of each receiver of a `SHARED` or `FAILOVER` subscription; a number is added to it."
        type: string
        default: cons
      consumerQueueSize:
        title: "Consumer Queue Size"
        description: "How many messages each receiver fetches from Pulsar ahead of time."
        type: integer
        default: 10
      deadLetterTopic:
        title: "Dead Letter Topic"
        description: "The topic that gets the messages that failed `maxRedeliverCount` times. A short name, such as `orders-dlq`, is a topic in `public/default`; for another namespace, give the full name, such as `persistent://my-tenant/my-namespace/orders-dlq`. When it is not set, it is the topic name followed by `-`, the subscription name and `-DLQ`, in the namespace of the topic. Only used when `maxRedeliverCount` is set."
        type: string
      maxRedeliverCount:
        title: "Maximum Redelivery Count"
        description: "How many times a message whose processing fails is delivered again before it goes to `deadLetterTopic`. Only works with a `SHARED` or `KEY_SHARED` `subscriptionType`: with `EXCLUSIVE` or `FAILOVER`, it is ignored. When it is not set, a failing message is delivered again forever."
        type: integer
      negativeAckRedeliveryDelayMicros:
        title: "Redelivery Delay"
        description: "How long to wait before a message whose processing failed is delivered again, in microseconds. For example, 60000000 is one minute."
        type: integer
        default: 60000000
      messageListener:
        title: "Message Listener"
        description: "If true, Pulsar hands each message to the source as it arrives. If false, `numberOfConsumerThreads` threads fetch the messages."
        type: boolean
        default: true
      numberOfConsumers:
        title: "Number of Consumers"
        description: "How many receivers to open on the subscription. More than one only helps with a `SHARED`, `KEY_SHARED` or `FAILOVER` `subscriptionType`."
        type: integer
        default: 1        
      numberOfConsumerThreads:
        title: "Number of Consumer Threads"
        description: "How many threads fetch and handle the messages when `messageListener` is false."
        type: integer
        default: 1
      readCompacted:
        title: "Read Compacted"
        description: "If true, reads the compacted topic, which keeps only the newest message for each key. Only for a persistent topic with an `EXCLUSIVE` or `FAILOVER` subscription."
        type: boolean
        default: false
      subscriptionInitialPosition:
        title: "Subscription Initial Position"
        description: "Where a new subscription starts reading: `LATEST` reads only the messages sent from then on, `EARLIEST` also reads the messages already in the topic. An existing subscription goes on where it stopped."
        type: string
        default: LATEST
        enum: ["EARLIEST", "LATEST"]
      subscriptionName:
        title: "Subscription Name"
        description: "The name of the subscription. Pulsar remembers for each subscription which messages were read, so keep the name across restarts. Two sources with different names each get every message."
        type: string
        default: subs
      subscriptionTopicsMode:
        title: "Subscription Topics Mode"
        description: "Which topics a pattern subscription covers: persistent ones, non-persistent ones, or both. Only used when `topicsPattern` is true."
        type: string
        default: PersistentOnly
        enum: ["PersistentOnly", "NonPersistentOnly", "AllTopics"]
      subscriptionType:
        title: "Subscription Type"
        description: "How the receivers of the subscription share the messages: `EXCLUSIVE` allows one receiver only, `SHARED` spreads the messages over all receivers, `FAILOVER` sends them all to one receiver and moves to another when it goes away, and `KEY_SHARED` spreads them while keeping the messages with the same key on one receiver."
        type: string
        default: EXCLUSIVE
        enum: ["EXCLUSIVE", "SHARED", "FAILOVER", "KEY_SHARED"]
      topicsPattern:
        title: "Topic Pattern"
        description: "If true, `topic` is a regular expression, and the source subscribes to every topic of the namespace whose name matches it."
        type: boolean
        default: false
    type: object
  template:
    from:
      uri: "pulsar:{{topicType}}/{{tenant}}/{{namespaceName}}/{{topic}}?ackTimeoutMillis={{?ackTimeoutMillis}}&authenticationClass={{?authenticationClass}}&authenticationParams={{?authenticationParams}}&consumerNamePrefix={{?consumerNamePrefix}}&consumerQueueSize={{?consumerQueueSize}}&deadLetterTopic={{?deadLetterTopic}}&maxRedeliverCount={{?maxRedeliverCount}}&messageListener={{?messageListener}}&negativeAckRedeliveryDelayMicros={{?negativeAckRedeliveryDelayMicros}}&numberOfConsumerThreads={{?numberOfConsumerThreads}}&numberOfConsumers={{?numberOfConsumers}}&readCompacted={{?readCompacted}}&serviceUrl=RAW({{serviceUrl}})&subscriptionInitialPosition={{?subscriptionInitialPosition}}&subscriptionName={{?subscriptionName}}&subscriptionTopicsMode={{?subscriptionTopicsMode}}&subscriptionType={{?subscriptionType}}&topicsPattern={{?topicsPattern}}"
      steps:
        - to:
            uri: kamelet:sink
