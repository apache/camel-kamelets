apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: azure-eventhubs-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Azure Eventhubs"
    camel.apache.org/kamelet.namespace: "Azure"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "Azure Eventhubs Source"
    description: |-
      Receives the events of an event hub in Azure Event Hubs, one message per event, and saves how far it has read in an Azure Storage blob container.

      Use it to process event streams, such as telemetry or changes, that other applications send to Event Hubs. To send events, use `azure-eventhubs-sink`.

      Output: the body is the body of the event, as bytes. The headers give its partition (`CamelAzureEventHubsPartitionId`), offset, sequence number and the time it was enqueued, and `CamelAzureEventHubsMetadata` holds the custom properties of the event.

      Good to know: when no position has been saved yet, it starts with the events that arrive after it starts, not the older ones. It reads as the `$Default` consumer group, or as the one in `consumerGroupName`, and each consumer group has its own saved position. It saves its position (a checkpoint) in `blobContainerName` every 500 events or every 5 seconds, so after a restart some events can be read again.
    required:
      - namespaceName
      - eventhubName
      - blobAccountName
      - blobAccessKey
      - blobContainerName
    type: object
    properties:
      namespaceName:
        title: Event Hubs Namespace
        description: The name of the Event Hubs namespace, the first part of its address `<namespaceName>.servicebus.windows.net`.
        type: string
        example: my-namespace
      eventhubName:
        title: Event Hub Name
        description: The name of the event hub in the namespace to receive the events from.
        type: string
        example: orders
      consumerGroupName:
        title: Consumer Group
        description: "The consumer group to read as. Each consumer group receives every event of the event hub and has its own saved position, so two integrations that read the same event hub with different consumer groups both receive every event. The consumer group must exist: create it in the Azure portal, under the event hub, then Entities, Consumer groups. With a consumer group that does not exist, the integration starts but receives nothing, and logs a warning that the messaging entity could not be found. When not set, it reads as `$Default`, the consumer group every event hub has."
        type: string
        example: billing
      sharedAccessName:
        title: Shared Access Name
        description: "The name of a shared access policy of the namespace or of the event hub, such as `RootManageSharedAccessKey`, from the Azure portal: the namespace or the event hub, then Settings, Shared access policies. Used when `credentialType` is `CONNECTION_STRING`, the default."
        type: string
        x-descriptors:
        - urn:camel:group:credentials
        example: RootManageSharedAccessKey
      sharedAccessKey:
        title: Shared Access Key
        description: The primary or secondary key of the shared access policy named in `sharedAccessName`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      blobAccountName:
        title: Checkpoint Storage Account
        description: The name of the storage account where the source saves how far it has read each partition (its checkpoints).
        type: string
        example: mystorageaccount
      blobContainerName:
        title: Checkpoint Container Name
        description: The name of the blob container, in `blobAccountName`, for the checkpoints.
        type: string
        example: eventhub-checkpoints
      blobAccessKey:
        title: Checkpoint Access Key
        description: "An access key of the storage account `blobAccountName`, from the Azure portal: the storage account, then Security + networking, then Access keys."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      credentialType:
        title: Credential Type
        description: How to log in to Event Hubs. `CONNECTION_STRING`, the default, uses `sharedAccessName` and `sharedAccessKey`. `AZURE_IDENTITY` uses the Azure identity of the environment, such as the `AZURE_CLIENT_ID`, `AZURE_TENANT_ID` and `AZURE_CLIENT_SECRET` environment variables, a managed identity or the Azure CLI login.
        type: string
        default: "CONNECTION_STRING"
        enum: ["CONNECTION_STRING", "AZURE_IDENTITY"]
  dataTypes:
    out:
      default: binary
      headers:
        CamelAzureEventHubsPartitionId:
          title: Azure Storage Event Hubs Partiton Id
          description: It sets the partition id of the Event Hub.
          type: string
        CamelAzureEventHubsOffset :
          title: Azure Storage Event Hubs Event Offset
          description: It sets the offset of the event when it was received from the associated Event Hub partition. This is only present on a received EventData.
          type: string
        CamelAzureEventHubsEnqueuedTime:
          title: Azure Event Hubs Event Enqueued Time
          description: It sets the instant, in UTC, of when the event was enqueued in the Event Hub partition. This is only present on a received EventData.
          type: java.time.Instant
        CamelAzureEventHubsSequenceNumber:
          title: Azure Event Hubs Event Sequence Number
          description: It sets the sequence number assigned to the event when it was enqueued in the associated Event Hub partition. This is unique for every message received in the Event Hub partition. This is only present on a received EventData.
          type: long
        CamelAzureEventHubsMetadata:
          title: Azure Event Hubs Event Metadata
          description: The set of free-form event properties which may be used for passing metadata associated with the event with the event body during Event Hubs operations.
          type: object
        CamelMessageTimestamp:
          title: Azure Event Hubs Message Timestamp
          description: The timestamp of the message.
          type: long
        CamelAzureEventHubsCheckpointUpdatedBy:
          title: Azure Event Hubs Checkpoint Updated By
          description: It sets the reason for the checkpoint to have been updated. This is only present on a received EventData.
          type: string
      types:
        binary:
          format: "application-octet-stream"
          description: Default binary representation of the Azure Event Hubs Event retrieved.
          mediaType: application/octet-stream
        cloudevents:
          format: "azure-eventhubs:application-cloudevents"
          description: Data type transformer converts Azure Eventhubs consumer response to CloudEvent v1_0 data format. The data type sets
          headers:
            CamelCloudEventID:
              title: CloudEvent ID
              description: The Camel exchange id set as event id
              type: string
            CamelCloudEventType:
              title: CloudEvent Type
              description: The event type
              default: "org.apache.camel.event.azure.eventhubs.consume"
              type: string
            CamelCloudEventSource:
              title: CloudEvent Source
              description: The event source. By default, the Partition Id with prefix "azure.eventhubs.".
              type: string
            CamelCloudEventSubject:
              title: CloudEvent Subject
              description: The event subject. The Azure Event Hubs Event Sequence Number.
              type: string
            CamelCloudEventTime:
              title: CloudEvent Time
              description: The exchange creation timestamp as event time.
              type: string
  dependencies:
  - "camel:azure-eventhubs"
  - "camel:kamelet"
  - "camel:jackson3"
  template:
    from:
      uri: "azure-eventhubs://{{namespaceName}}/{{eventhubName}}?blobAccessKey=RAW({{blobAccessKey}})&blobAccountName={{blobAccountName}}&blobContainerName={{blobContainerName}}&credentialType={{credentialType}}&consumerGroupName={{?consumerGroupName}}&sharedAccessKey=RAW({{?sharedAccessKey}})&sharedAccessName={{?sharedAccessName}}"
      steps:
        - to:
            uri: kamelet:sink
