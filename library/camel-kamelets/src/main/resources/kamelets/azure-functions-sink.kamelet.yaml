apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: azure-functions-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Azure Functions"
    camel.apache.org/kamelet.namespace: "Azure"
  labels:
    camel.apache.org/kamelet.type: "sink"
spec:
  definition:
    title: "Azure Function Sink"
    description: |-
      Calls a function in Azure Functions over HTTP for each message, with the message as the body of the request.

      Use it to run your own serverless code on each message, such as an enrichment, a notification or a calculation. For any other web service, use `http-sink`.

      Input: the body is sent as the request body, as text, bytes or a stream. Turn structured data such as a Map into JSON text first, for example with `json-serialize-action`. The `Content-Type` header is sent as the content type of the request, and the other headers of the message, except the Camel ones, are sent as HTTP headers.

      Output: when it is used inside a route, the body afterwards is the response of the function, and the `CamelHttpResponseCode` header its status code.

      Good to know: a response with a status code outside 200 to 299 fails the message. The `key` is sent as the `code` query parameter of the request, or, when `keyInHeader` is true, in the `x-functions-key` header, which keeps it out of the address of the request that error messages show.
    required:
      - url
    type: object
    properties:
      url:
        title: URL
        description: "The address of the function, which starts with `https://`, from the Azure portal: the function, then Get function URL. Leave out the `?code=` part: put the key in `key`."
        type: string
        pattern: ^(https)://.*
        example: https://azure-function-demo-12234.azurewebsites.net/api/httpexample
      method:
        title: Method
        description: The HTTP method of the request, which must be one that the function accepts.
        type: string
        default: "POST"
        enum: ["GET", "POST", "PUT", "DELETE", "HEAD", "OPTIONS", "TRACE", "PATCH"]
      key:
        title: Key
        description: "A function key, or the master key, from the Azure portal: the function, then Function Keys. Needed when the authorization level of the function is `function` or `admin`; leave it empty for `anonymous`. It is sent as the `code` query parameter, or in the `x-functions-key` header when `keyInHeader` is true."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      keyInHeader:
        title: Key in Header
        description: If true, the `key` is sent in the `x-functions-key` HTTP header instead of the `code` query parameter. Azure Functions accepts either. The address of the request, which error messages show, then does not hold the key, and the header is removed from the message after a successful call. Requires `key`. When not set, or false, the key is sent as `code`.
        type: boolean
  dependencies:
  - "camel:vertx-http"
  - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeader:
            name: CamelHttpUri
        - setHeader:
            name: CamelHttpMethod
            expression:
              constant:
                expression: "{{method}}"
        - choice:
            precondition: true
            when:
              - expression:
                  simple:
                    expression: "{{keyInHeader:false}} == true"
                steps:
                  - setHeader:
                      name: x-functions-key
                      expression:
                        constant:
                          expression: "{{key}}"
                  - to:
                      uri: vertx-http
                      parameters:
                        httpUri: "{{url}}"
                  - removeHeader:
                      name: x-functions-key
            otherwise:
              steps:
                - to:
                    uri: vertx-http
                    parameters:
                      httpUri: "{{url}}"
                      code: "RAW({{?key}})"
