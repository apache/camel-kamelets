apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: databricks-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "SQL"
    camel.apache.org/kamelet.namespace: "Database"
  labels:
    camel.apache.org/kamelet.type: "sink"
spec:
  definition:
    title: "Databricks Sink"
    description: |-
      Runs an SQL statement, such as an INSERT, on a Databricks SQL warehouse or cluster for each message, with values taken from the fields of the JSON object in the body.

      Use it to store records from another system as rows of a table, such as each order that arrives on a Kafka topic, or to update or delete rows. To read rows, use `databricks-source`.

      Input: the body is one JSON object, as text, such as `{"username":"oscerd","city":"Rome"}`. In `query`, write `:#username` where the value of the field `username` goes. When the object has no field of that name, the header of that name is used instead. Fields that `query` does not name are ignored.

      Output: the body afterwards is the JSON object as a Map, and the `CamelSqlUpdateCount` header holds the number of rows the statement changed. When `query` is a SELECT, the body is instead a List of the rows found, each a Map, and the `CamelSqlRowCount` header holds their number.

      Good to know: a message fails when its body is not a JSON object (a JSON array or plain text, for example), or when it has no value for a parameter of `query`. The values are sent to the database apart from the SQL text, so the content of a message cannot change the statement. Do not write `?` in `query`, not even in a quoted string: the Kamelet then fails to start.
    required:
      - serverHostname
      - httpPath
      - accessToken
      - query
    type: object
    properties:
      serverHostname:
        title: Server Hostname
        description: The host name of your Databricks workspace, without `https://`. Find it as Server hostname in the Connection details of the SQL warehouse or cluster.
        type: string
        example: adb-1234567890123456.7.azuredatabricks.net
      serverPort:
        title: Server Port
        description: The port to connect to. Databricks uses 443 (HTTPS).
        type: string
        default: 443
      httpPath:
        title: HTTP Path
        description: The path of the SQL warehouse or cluster to run the queries on. Find it as HTTP path in the Connection details of the SQL warehouse or cluster.
        type: string
        example: /sql/1.0/warehouses/abc123def456
      accessToken:
        title: Access Token
        description: A Databricks personal access token, created in the Developer part of the settings of your Databricks user. The Kamelet runs the queries as the user who created it.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      query:
        title: Query
        description: The SQL statement to run for each message, such as an INSERT, UPDATE or DELETE. Write `:#name` where the value of the field `name` of the JSON body goes.
        type: string
        example: 'INSERT INTO accounts (username,city) VALUES (:#username,:#city)'
      extraOptions:
        title: Extra Options
        description: More settings of the Databricks JDBC driver, added to the end of the connection string as they are. Start with `;` and separate the settings with `;`, such as `;ConnCatalog=main;ConnSchema=default` to choose the catalog and schema of Unity Catalog that `query` uses.
        type: string
        example: ;ConnCatalog=main;ConnSchema=default
        default: ''
  types:
    in:
      mediaType: application/json
  dataTypes:
    out:
      headers:
        CamelSqlUpdateCount:
          title: Update Count
          description: The number of rows the statement inserted, updated or deleted.
          type: integer
        CamelSqlRowCount:
          title: Row Count
          description: The number of rows a SELECT returned. Only set when `query` is a SELECT.
          type: integer
  dependencies:
  - "camel:jackson3"
  - "camel:kamelet"
  - "camel:sql"
  - "mvn:com.databricks:databricks-jdbc:3.4.5"
  - "mvn:org.apache.commons:commons-dbcp2:2.14.0"
  template:
    beans:
      - name: local-sql-databricks-sink
        type: "#class:org.apache.camel.component.sql.SqlComponent"
        properties:
          autowiredEnabled: "false"
      - name: dsBean
        type: "#class:org.apache.commons.dbcp2.BasicDataSource"
        properties:
          username: token
          password: "{{accessToken}}"
          url: "jdbc:databricks://{{serverHostname}}:{{serverPort}};httpPath={{httpPath}};AuthMech=3;transportMode=http;ssl=1{{extraOptions}}"
          driverClassName: com.databricks.client.jdbc.Driver
    from:
      uri: kamelet:source
      steps:
        - unmarshal:
            json: {}
        - removeHeader:
            name: CamelSqlQuery
        - removeHeader:
            name: CamelSqlParameters
        - to:
            uri: "{{local-sql-databricks-sink}}:{{query}}?dataSource=#bean:{{dsBean}}"
