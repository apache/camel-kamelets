apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: smb-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "SMB"
    camel.apache.org/kamelet.namespace: "File"
  labels:
    camel.apache.org/kamelet.type: "sink"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "SMB Sink"
    description: |-
      Writes each message as a file to a directory of a Windows or Samba file share (SMB).

      Use it to deliver exports, reports or data files to a Windows file server or a NAS, on a share such as `\\fileserver\imports`. To read files from a share use `smb-source`. For an FTP or SFTP server use `ftp-sink` or `sftp-sink`.

      Input: the body is the content of the file, as text, bytes or a stream. The name of the file comes from the `file` header, or from `ce-file` when `file` is not set; any directory in it is dropped, so `reports/data.csv` and `reports\data.csv` are written as `data.csv`. Without these headers, `CamelFileName` is used as it is, subdirectories included, and without any of them a unique name is generated.

      Output: the message is unchanged. The `CamelFileNameProduced` header is set to the path of the file within the share.

      Good to know: a file with the same name is replaced, unless `fileExist` says otherwise. A file is written under its real name from the start, so a reader that polls the directory can pick it up half-written. To prevent that, set `tempPrefix` to write it under a temporary name and rename it once it is complete, or `doneFileName` to write an empty done file next to it once it is complete. Log in with `username` and `password`, or, on a share that allows guest access, with `username` set to `Guest` and no `password`. A message fails when the server cannot be reached or the login fails. The content of the files is not encrypted on the network unless `encryptData` is true, and a share that requires encryption refuses the connection without it. When the application has a bean of the type `com.hierynomus.smbj.SmbConfig`, Camel uses it for the connection, and the Kamelet then fails to start when `encryptData` is true, or `connectTimeout` or `writeTimeout` is set: set them on that bean instead. A file name that points outside `directoryName`, such as `../orders.csv`, fails the message. Headers that start with `CamelFile`, `CamelOverruleFile` or `CamelSmb`, except `CamelFileName`, are removed from the message first, so they cannot change what the Kamelet does.
    required:
      - connectionHost
      - shareName
      - username
    type: object
    properties:
      connectionHost:
        title: Connection Host
        description: The host name or IP address of the SMB server, without `smb://`, without `\\` and without a port.
        type: string
        example: fileserver.example.com
      connectionPort:
        title: Connection Port
        description: The port of the SMB server, usually 445.
        type: integer
        default: 445
      shareName:
        title: Share Name
        description: The name of the share, as the server shares it, such as `imports` for `\\fileserver\imports`.
        type: string
        example: imports
      directoryName:
        title: Directory Name
        description: The directory within the share to write the files to, with `/` between its parts, such as `incoming/orders`. When it is not set, the files are written at the top of the share. It is created when it does not exist, unless `autoCreate` is false.
        type: string
        example: incoming/orders
      username:
        title: Username
        description: The user to log in to the SMB server as, without the domain, such as `jdoe`.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      password:
        title: Password
        description: The password of `username`. When it is not set, the Kamelet logs in with an empty password, which with `username` set to `Guest` is a guest login, on a share that allows guest access.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      encryptData:
        title: Encrypt Data
        description: If true, everything sent to and from the server, the content of the files included, is encrypted (SMB 3 encryption), also on a share that does not require it. A share that requires encryption, such as one with `smb encrypt = required` on Samba, refuses the connection unless it is true. The server must support SMB 3.
        type: boolean
        default: false
      connectTimeout:
        title: Connect Timeout
        description: How long to wait for the connection to the server, in milliseconds. When it is not set, 5000 (5 seconds).
        type: integer
        example: 10000
      writeTimeout:
        title: Write Timeout
        description: How long to wait for the server to answer a write of the content of a file, in milliseconds. When it is not set, 60000 (1 minute).
        type: integer
        example: 120000
      domain:
        title: Domain
        description: The Windows domain of `username`, such as `CORP` for the account `CORP\jdoe`. Leave it unset for a user of the server itself.
        type: string
        example: CORP
      fileExist:
        title: If File Exists
        description: What to do when a file with the same name is already in the directory. `Override` replaces it, `Append` adds the new content at its end, `Fail` fails the message, and `Ignore` keeps the old file and drops the new content without an error.
        type: string
        default: Override
        enum: ["Override", "Append", "Fail", "Ignore"]
      autoCreate:
        title: Autocreate Missing Directories
        description: If true, `directoryName`, and any subdirectory in the `CamelFileName` header, is created on the share when it does not exist. If false, a message for a directory that does not exist fails.
        type: boolean
        default: true
      tempPrefix:
        title: Temporary Name Prefix
        description: A prefix for the name a file is written under. Once the file is complete, it is renamed to its real name, so a reader that skips the names with this prefix never picks up a half-written file. `smb-source`, like other readers built with Camel, skips the names that start with a dot, so a prefix such as `.tmp-`, which writes `orders.csv` as `.tmp-orders.csv`, works with it as it is. A prefix that ends with `/`, such as `.inprogress/`, writes the file into that subdirectory first, and the subdirectory is created when it does not exist. When it is not set, a file is written under its real name from the start. Do not combine it with `fileExist` `Append`, as a message for a file that already exists then fails and leaves the temporary file behind. `username` must be allowed to rename files.
        type: string
        example: ".tmp-"
      doneFileName:
        title: Done File Name
        description: The name of an empty file to write next to each file once the file is complete, so that a reader knows the file can be read. `$\{file:name}` stands for the name of the file and `$\{file:name.noext}` for the name without its extension, so `$\{file:name}.done` writes `orders.csv.done`, and `$\{file:name.noext}.ready` writes `orders.ready`. A fixed name, such as `ready`, is written again after each file. No other `$\{...}` is allowed, and with one the file is written but then the message fails. With `tempPrefix`, the done file is written after the file has its real name. When it is not set, no done file is written.
        type: string
        example: "${file:name}.done"
  dataTypes:
    # No 'default: binary' here on purpose, as in sftp-sink: with stream caching turned off, it would read a
    # stream into memory (a byte[]) before the file is written, such as a large file from smb-source with
    # streamDownload (#3117).
    in:
      headers:
        file:
          title: File Name
          description: The name of the file to write, such as `orders.csv`. Any directory in it is dropped.
          type: string
        ce-file:
          title: File Name (CloudEvents)
          description: The name of the file to write, used when `file` is not set. Any directory in it is dropped.
          type: string
        CamelFileName:
          title: Camel File Name
          description: The name of the file to write, used as it is, subdirectories included, when neither `file` nor `ce-file` is set.
          type: string
    out:
      headers:
        CamelFileNameProduced:
          title: File Written
          description: The path of the file that was written, within the share, such as `incoming/orders/orders.csv`.
          type: string
  dependencies:
    - "camel:smb"
    - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: "Camel(File|OverruleFile|Smb).*"
            excludePattern: CamelFileName
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[file]}"
                steps:
                  - setHeader:
                      name: CamelFileName
                      expression:
                        simple:
                          expression: "${header[file]}"
                  - setHeader:
                      name: CamelFileName
                      expression:
                        simple:
                          expression: "${file:onlyname}"
              - expression:
                  simple:
                    expression: "${header[ce-file]}"
                steps:
                  - setHeader:
                      name: CamelFileName
                      expression:
                        simple:
                          expression: "${header[ce-file]}"
                  - setHeader:
                      name: CamelFileName
                      expression:
                        simple:
                          expression: "${file:onlyname}"
        - to:
            uri: smb
            parameters:
              hostname: "{{connectionHost}}"
              port: "{{connectionPort}}"
              shareName: "{{shareName}}"
              path: "{{?directoryName}}"
              autoCreate: "{{autoCreate}}"
              connectTimeout: "{{?connectTimeout}}"
              doneFileName: "RAW({{?doneFileName}})"
              domain: "RAW({{?domain}})"
              encryptData: "{{encryptData}}"
              fileExist: "{{fileExist}}"
              password: "RAW({{?password}})"
              tempPrefix: "RAW({{?tempPrefix}})"
              username: "RAW({{?username}})"
              writeTimeout: "{{?writeTimeout}}"
