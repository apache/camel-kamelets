apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: langchain4j-ingest-file-source
  labels:
    camel.apache.org/kamelet.type: "source"
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/kamelet.group: "LangChain4j Ingest"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.namespace: "AI"
spec:
  definition:
    title: "LangChain4j Ingest File Source"
    description: |-
      Reads the documents in a directory and its subdirectories, one message per file, leaves them in place, and reads a file again when it changes.

      Use it to feed a knowledge base for an AI assistant: put it in front of `langchain4j-ingest-sink`, with `tika-extract-text-action` or `docling-convert-action` in between for PDF or office documents.

      Output: the body is the file, read as bytes unless `charset` is set. The `CamelLangChain4jIngestDocumentId` header is the path of the file relative to `directory`, such as `manuals/pump.pdf`, which `langchain4j-ingest-sink` uses as the document id. The usual file headers, such as `CamelFileName`, are set too.

      Good to know: the files are never deleted or moved. A file is read again when its modification time or size changes, and `langchain4j-ingest-sink` then adds the new version next to the old one, unless it has an `idempotentRepository`, which skips it. The files already read are remembered in memory only, by default the last 1000, so after a restart every file is read again; set `idempotentRepository` to keep them. A file that is still being copied in is read only once it stops changing; for a slow copy, which can pause for more than a second, set `readLockMinAge`.
    required:
      - directory
    type: object
    properties:
      directory:
        title: Directory
        description: The path of the directory to read the documents from, on the machine where the integration runs.
        type: string
        pattern: "[^?#]+"
        example: /data/knowledge-base
      recursive:
        title: Recursive
        description: If true, the files in the subdirectories are read too.
        type: boolean
        default: true
      include:
        title: Include
        description: Ant-style patterns of the files to read, separated by commas, matched on the path relative to `directory`. `**/*.pdf` matches the PDF files in any subdirectory. When it is not set, every file is read.
        type: string
        example: "**/*.pdf,**/*.md"
      exclude:
        title: Exclude
        description: Ant-style patterns of the files to leave out, separated by commas, in the same form as `include`. It wins over `include`.
        type: string
        example: "**/draft-*"
      delay:
        title: Delay
        description: How long to wait between two looks at the directory, in milliseconds. When it is not set, the directory is looked at every 500 milliseconds; a longer delay, such as one minute, is usually enough for a knowledge base.
        type: integer
        example: 60000
      initialDelay:
        title: Initial Delay
        description: How long to wait after the integration starts before the first look at the directory, in milliseconds. When it is not set, 1000 (one second) is used.
        type: integer
        example: 30000
      maxMessagesPerPoll:
        title: Max Messages Per Poll
        description: The largest number of files to read in one look at the directory; the others are read in the next looks, one `delay` later. Use it to spread out the first load of a large directory. Which files come first is not defined. When it is not set, there is no limit.
        type: integer
        example: 100
      readLockMinAge:
        title: Read Lock Min Age
        description: How long ago a file must have last changed before it is read, in milliseconds, such as 60000 for a file copied in slowly. It replaces the usual check, which reads each file only once its size and modification time have not changed for one second, so that an older file is read at once, and a newer one once it is old enough.
        type: integer
        example: 60000
      charset:
        title: Charset
        description: The character set to read text files with, such as `UTF-8`; the body is then text. Leave it unset when a `tika-extract-text-action`, a `docling-convert-action` or a `langchain4j-ingest-sink` with `modality` set to `media` comes next, because they need the bytes of the file, and a conversion breaks a binary file such as a PDF.
        type: string
        example: UTF-8
      idempotentRepository:
        title: Idempotent Repository
        description: A Camel `IdempotentRepository` defined in the application, as `#bean:` followed by its name, that remembers the files already read, by path, modification time and size. Use a persistent one, so that the files are not read again after a restart. When it is not set, the last 1000 files are remembered in memory.
        type: string
        example: "#bean:readFiles"
  dataTypes:
    out:
      headers:
        CamelLangChain4jIngestDocumentId:
          title: Document ID
          description: The path of the file relative to `directory`, such as `manuals/pump.pdf`, used as the document id by `langchain4j-ingest-sink`.
          type: string
        CamelFileName:
          title: File Name
          description: The path of the file relative to `directory`.
          type: string
  dependencies:
    - "camel:file"
    - "camel:kamelet"
  template:
    from:
      uri: file
      parameters:
        directoryName: "{{directory}}"
        antExclude: "{{?exclude}}"
        antInclude: "{{?include}}"
        charset: "{{?charset}}"
        delay: "{{?delay}}"
        idempotent: true
        # an edited file gets a new key and re-ingests
        idempotentKey: "${file:absolute.path}:${file:modified}:${file:size}"
        idempotentRepository: "{{?idempotentRepository}}"
        initialDelay: "{{?initialDelay}}"
        maxMessagesPerPoll: "{{?maxMessagesPerPoll}}"
        noop: true
        readLock: changed
        readLockMinAge: "{{?readLockMinAge}}"
        recursive: "{{recursive}}"
      steps:
        - setHeader:
            name: CamelLangChain4jIngestDocumentId
            expression:
              simple:
                expression: "${header.CamelFileName}"
        - to:
            uri: kamelet:sink
