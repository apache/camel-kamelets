apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: ssh-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "SSH"
    camel.apache.org/kamelet.namespace: "File"
  labels:
    camel.apache.org/kamelet.type: "sink"
spec:
  definition:
    title: "SSH Sink"
    description: |-
      Runs the text of each message as a command on a remote server over SSH, and returns what the command prints.

      Use it to run a script or a maintenance command on a server when something happens, for example restart a service after a deployment or clear a cache when data changes. To run a fixed command on a schedule and read its output, use `ssh-source`; to run a command on the machine of the integration, use `exec-sink`.

      Input: the body is the command to run, as text, such as `systemctl restart myapp`. It runs in the shell of `username`, so it can hold several commands separated by `;`.

      Output: the body afterwards is what the command printed on its standard output, as a stream. The `CamelSshExitValue` header holds the exit code of the command, and `CamelSshStderr` what it printed on its standard error, as a stream.

      Good to know: it runs whatever command it receives, with the rights of `username`. Never send it messages from an untrusted source, and log in with an account that may do only what is needed. A command that ends with an exit code other than 0 does not fail the message: check `CamelSshExitValue`. The key of the server is checked only when `knownHostsResource` is set; without it, any server is accepted.
    required:
      - connectionHost
      - connectionPort
      - username
      - password
    type: object
    properties:
      connectionHost:
        title: Connection Host
        description: The host name or IP address of the SSH server, without a port.
        type: string
        example: server.example.com
      connectionPort:
        title: Connection Port
        description: The port of the SSH server, usually 22.
        type: string
        default: 22
      username:
        title: Username
        description: The user to log in as. The commands run with the rights of this user.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      password:
        title: Password
        description: The password of `username` on the SSH server.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      knownHostsResource:
        title: Known Hosts Resource
        description: A known_hosts file that holds the key of the server, starting with `file:`, `classpath:`, `http:` or `https:`. Its lines can be made with `ssh-keyscan`. A server whose key does not match is refused. When it is not set, the key of the server is not checked, so any server is accepted.
        type: string
        pattern: "^(http|https|file|classpath|ref|bean):.*"
        example: file:/etc/ssh/known_hosts
  types:
    in:
      mediaType: text/plain
    out:
      mediaType: text/plain
  dataTypes:
    out:
      headers:
        CamelSshExitValue:
          title: Exit Code
          description: The exit code of the command, such as 0 when it succeeded.
          type: integer
        CamelSshStderr:
          title: Standard Error
          description: What the command printed on its standard error, as a stream.
          type: object
  dependencies:
    - "camel:ssh"
    - "camel:gson"
    - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - to:
            uri: "ssh://{{connectionHost}}:{{connectionPort}}?knownHostsResource={{?knownHostsResource}}&password=RAW({{password}})&username=RAW({{username}})"
