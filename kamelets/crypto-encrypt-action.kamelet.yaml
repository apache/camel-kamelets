apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: crypto-encrypt-action
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Actions"
    camel.apache.org/kamelet.namespace: "Transformation"
  labels:
    camel.apache.org/kamelet.type: "action"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "Crypto Encrypt Action"
    description: |-
      Encrypts the body of each message with a secret key, such as an AES key, for `crypto-decrypt-action` to decrypt later with the same key.

      Use it to protect sensitive data, such as personal or payment details, before it is stored or sent through a system you do not fully trust, and decrypt it later with `crypto-decrypt-action` and the same `algorithm` and `key`.

      Input: text or bytes.

      Output: the body is the encrypted data, as bytes, a little longer than the input, and the `Content-Type` header is set to `application/octet-stream`. It is not text: to send it where only text fits, encode it, for example in Base64. The other headers are kept.

      Good to know: the key is a secret; anyone who has it can decrypt the data, so keep it in a vault or a secret, not in plain configuration. The algorithm, the mode and the key come only from the options: the `CamelCrypto*` headers of the incoming message, such as `CamelCryptoInitVector`, are removed first. The encrypted data carries a check value, so `crypto-decrypt-action` fails on data that was changed or decrypted with another key. A key of the wrong length fails each message, not the start. Set `mode` to `CBC`: without it, AES encrypts in ECB mode, where equal parts of the data give equal encrypted bytes. Data encrypted without `mode` is decrypted only without `mode`, so set it on both actions at the same time.
    required:
      - algorithm
      - key
    type: object
    properties:
      algorithm:
        title: Algorithm
        description: "The name of the encryption algorithm, such as `AES`, or `DESede` for Triple DES. Give the name alone: a full form such as `AES/CBC/PKCS5Padding` fails each message; choose the mode with `mode`. Use the same value in `crypto-decrypt-action`."
        type: string
        example: "AES"
      mode:
        title: Mode
        description: "The block cipher mode, only `CBC`: each message is then encrypted with a new random initialization vector, which is put in front of the encrypted data, so the same text gives different bytes each time. When it is not set, `AES` and `DESede` use ECB mode, in which the same text with the same key always gives the same bytes, so repeats in the data can be seen. Use the same value in `crypto-decrypt-action`."
        type: string
        enum: ["CBC"]
        example: "CBC"
      key:
        title: Secret Key
        description: "The secret key, as text. Its length must fit the algorithm: for `AES`, 16, 24 or 32 characters (plain ASCII characters count as one byte each), and for `DESede`, 24. Use the same key in `crypto-decrypt-action`."
        type: string
        format: password
        x-descriptors:
          - urn:camel:group:credentials
  dataTypes:
    in:
      default: binary
      types:
        binary:
          format: "application-octet-stream"
          description: "The data to encrypt, as bytes or a stream."
          mediaType: application/octet-stream
    out:
      default: binary
      types:
        binary:
          format: "application-octet-stream"
          description: "The encrypted data, as bytes."
          mediaType: application/octet-stream
  dependencies:
    - "camel:kamelet"
    - "camel:crypto"
  template:
    beans:
      - name: cryptoKey
        type: javax.crypto.spec.SecretKeySpec
        constructors:
          0: "{{key}}"
          1: "{{algorithm}}"
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: "CamelCrypto*"
        - choice:
            precondition: true
            when:
              - expression:
                  simple:
                    expression: "${propertiesExist:mode}"
                steps:
                  - marshal:
                      crypto:
                        algorithm: "{{algorithm}}/{{mode}}/PKCS5Padding"
                        key: "{{cryptoKey}}"
                        inline: true
            otherwise:
              steps:
                - marshal:
                    crypto:
                      algorithm: "{{algorithm}}"
                      key: "{{cryptoKey}}"
