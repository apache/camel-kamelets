apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: message-timestamp-router-action
  labels:
    camel.apache.org/kamelet.type: "action"
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Actions"
    camel.apache.org/kamelet.namespace: "Kafka"
spec:
  definition:
    title: "Message Timestamp Router Action"
    description: |-
      Changes the topic that `kafka-sink` writes a record to, to a name made of the original topic name and a date read from a field of the JSON body.

      Use it to spread the records over one topic per day or per month by a date in the data, such as the date of an order, in a flow from `kafka-source` to `kafka-sink`. To use the time the record was written to Kafka instead use `timestamp-router-action`.

      Input: a JSON object as JSON text, with the `Content-Type` header set to `application/json`. The name of the topic is read from the `CamelKafkaTopic` header, which `kafka-source` sets.

      Output: the same JSON object, as JSON text in a stream, with `Content-Type` set to `application/json`. When one of the `timestampKeys` fields is found, the `CamelKafkaOverrideTopic` header is set to the new name, and `kafka-sink` writes the record to that topic instead of its own `topic`.

      Good to know: a field value that cannot be read as a date with `timestampKeyFormat` makes the message fail. The default `topicFormat` of `topic-$[timestamp]` gives names such as `topic-20240703`, without the original name: set it to `$[topic]-$[timestamp]` to keep it. The date is in UTC.
    required:
      - timestampKeys
    properties:
      topicFormat:
        title: Topic Format
        description: "The name of the new topic. `$[topic]` is replaced by the name of the original topic, and `$[timestamp]` by the time, written with `timestampFormat`. The default writes to topics named `topic-` and the date, without the original name."
        type: string
        default: "topic-$[timestamp]"
        example: "$[topic]-$[timestamp]"
      timestampFormat:
        title: Timestamp Format
        description: "How to write the time in the topic name, as a Java `SimpleDateFormat` pattern, in UTC: `yyyyMMdd` gives `20240703`, and `yyyy-MM` gives `2024-07`."
        type: string
        default: "yyyyMMdd"
        example: "yyyy-MM-dd"
      timestampKeys:
        title: Timestamp Keys
        description: "The names of the top-level fields of the JSON body that may hold the date, separated by commas. The first one present is used; when none is, the topic is not changed."
        type: string
        example: "orderDate,createdAt"
      timestampKeyFormat:
        title: Timestamp Keys Format
        description: "How the date is written in the field: `timestamp` for a number of milliseconds since 1970, or a Java `SimpleDateFormat` pattern, read in UTC."
        type: string
        default: "timestamp"
        example: "yyyy-MM-dd"
    type: object
  dataTypes:
    in:
      headers:
        CamelKafkaTopic:
          title: Kafka Topic
          description: "The topic the record was read from, as `kafka-source` sets it."
          type: string
        Content-Type:
          title: Content Type
          description: "Must be `application/json`."
          type: string
    out:
      headers:
        CamelKafkaOverrideTopic:
          title: Kafka Override Topic
          description: "The new topic, which `kafka-sink` writes the record to instead of its own `topic`."
          type: string
        Content-Type:
          title: Content Type
          description: "Always `application/json`."
          type: string
  dependencies:
  - "camel:jackson3"
  - "camel:kamelet"
  - "camel:kafka"
  template:
    from:
      uri: kamelet:source
      steps:
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[Content-Type]} == 'application/json'"
                steps:
                  - unmarshal:
                      json:
                        unmarshalType: tools.jackson.databind.JsonNode
        - setProperty:
            name: topicFormat
            expression:
              constant:
                expression: "{{topicFormat}}"
        - setProperty:
            name: timestampFormat
            expression:
              constant:
                expression: "{{timestampFormat}}"
        - setProperty:
            name: timestampKeys
            expression:
              constant:
                expression: "{{timestampKeys}}"
        - setProperty:
            name: timestampKeyFormat
            expression:
              constant:
                expression: "{{timestampKeyFormat}}"
        - bean:
            ref: org.apache.camel.component.kafka.transform.MessageTimestampRouter
        - marshal:
            json:
              unmarshalType: tools.jackson.databind.JsonNode
        - setHeader:
            name: Content-Type
            expression:
              constant:
                expression: application/json
