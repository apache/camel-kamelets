apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: aws-bedrock-text-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "AWS Bedrock"
    camel.apache.org/kamelet.namespace: "AWS"
  labels:
    camel.apache.org/kamelet.type: "sink"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "AWS Bedrock Text Sink"
    description: |-
      Sends a prompt to a text model in Amazon Bedrock, such as Amazon Titan or Anthropic Claude, for each message, and gives the answer of the model.

      Use it to summarize, classify, translate or write text with a large language model, for example to summarize support tickets or draft replies. To answer questions from your own documents in a Bedrock knowledge base, use `aws-bedrock-agent-runtime-sink`.

      Input: the body is the request of the model, as JSON text in the format of the chosen model, not the bare prompt. For Amazon Titan, for example `{"inputText":"Summarize: ...","textGenerationConfig":{"maxTokenCount":500}}`. For Claude 3, the Messages format, for example `{"anthropic_version":"bedrock-2023-05-31","max_tokens":500,"messages":[{"role":"user","content":"Summarize: ..."}]}`. With `operation` set to `converse`, the body is the prompt itself, as text, such as `Summarize: ...`, whatever the model.

      Output: when it is used inside a route, the body afterwards is the answer, in a form that depends on the model: for Titan the response as JSON text, with the generated text in `results`; for Claude 3 the response as parsed JSON, with the generated text in `content`; for the older Claude models only the generated text, as text. With `converse`, the generated text, as text, and the `CamelAwsBedrockConverseStopReason` header says why the model stopped, such as `end_turn`, or `guardrail_intervened` when the guardrail blocked the prompt or the answer: the body is then the message that the guardrail is configured to give.

      Good to know: with `invokeTextModel`, the request and response formats are those of the model provider, described for each model in the Amazon Bedrock documentation; a body in another format fails. A guardrail (`guardrailIdentifier`) works only with `converse`. Each message is one call of the model. To reach AWS through an HTTP proxy, set `proxyHost` and `proxyPort`, and set `proxyProtocol` to `HTTP` for a proxy that takes plain HTTP, such as Squid. Headers that start with `CamelAwsBedrock` are removed from the message first, so they cannot change what the Kamelet does.
    required:
      - modelId
      - region
    type: object
    properties:
      modelId:
        title: Model ID
        description: "The ID of the Bedrock text model to call. The body must be a request in the format of this model: Amazon Titan (`amazon.titan-text-*`), AI21 Labs Jurassic (`ai21.j2-*`) or Anthropic Claude (`anthropic.claude-*`)."
        type: string
        enum: ["amazon.titan-text-express-v1", "amazon.titan-text-lite-v1", "ai21.j2-ultra-v1", "ai21.j2-mid-v1", "anthropic.claude-instant-v1", "anthropic.claude-v2", "anthropic.claude-v2:1", "anthropic.claude-3-sonnet-20240229-v1:0"]
      operation:
        title: Operation
        description: "How the model is called. `invokeTextModel` sends the body as the request of the model, in the format of its provider. `converse` sends the body as the prompt, as plain text, with the Converse API of Bedrock, which works the same way for every model, and gives the answer as text. When it is not set, it is `invokeTextModel`."
        type: string
        enum: ["invokeTextModel", "converse"]
        default: invokeTextModel
      guardrailIdentifier:
        title: Guardrail Identifier
        description: "The ID or ARN of an Amazon Bedrock guardrail that checks the prompt and the answer, for example to block a topic or to hide personal data. Only used when `operation` is `converse`."
        type: string
        example: gr-abc123xyz
      guardrailVersion:
        title: Guardrail Version
        description: "The version of the guardrail in `guardrailIdentifier`, such as `1`. When it is not set, it is `DRAFT`, the working draft of the guardrail."
        type: string
        example: "1"
      guardrailTrace:
        title: Guardrail Trace
        description: "If true, Bedrock reports what the guardrail found, in the `CamelAwsBedrockGuardrailTrace` header. When it is not set, it is false."
        type: boolean
      accessKey:
        title: Access Key
        description: "The access key ID of an IAM user, which AWS gives when you create an access key for the user (in the AWS console: IAM, Users, Security credentials). Use it together with `secretKey`, or leave both empty and set `useDefaultCredentialsProvider` or `useProfileCredentialsProvider` instead."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      secretKey:
        title: Secret Key
        description: The secret access key that goes with `accessKey`. AWS shows it only once, when the access key is created.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      region:
        title: AWS Region
        description: The AWS region of Amazon Bedrock to use, such as `us-east-1`. The model must be available in it.
        type: string
        example: us-east-1
        enum: ["us-east-1", "us-west-1", "ap-southeast-1", "ap-northeast-1", "eu-central-1"]
      useDefaultCredentialsProvider:
        title: Default Credentials Provider
        description: "If true, the credentials are found the way the AWS SDK finds them: from the `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY` environment variables, the shared credentials file, or the IAM role of the machine, container or pod it runs on. Then `accessKey` and `secretKey` are not needed."
        type: boolean
        default: false
      useProfileCredentialsProvider:
        title: Profile Credentials Provider
        description: If true, the credentials are read from a profile of the AWS credentials file (`~/.aws/credentials`), the one named in `profileCredentialsName`.
        type: boolean
        default: false
      useSessionCredentials:
        title: Session Credentials
        description: "If true, it logs in with temporary credentials, such as those of an assumed IAM role: `accessKey`, `secretKey` and `sessionToken` together."
        type: boolean
        default: false
      profileCredentialsName:
        title: Profile Credentials Name
        description: The name of the profile to use from the AWS credentials file. Only used when `useProfileCredentialsProvider` is true.
        type: string
      sessionToken:
        title: Session Token
        description: The session token of temporary credentials, which AWS gives together with their access key and secret key. Only used when `useSessionCredentials` is true.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      uriEndpointOverride:
        title: Overwrite Endpoint URI
        description: The address to send the requests to instead of the usual AWS address, such as `http://localhost:4566` for LocalStack. Only used when `overrideEndpoint` is true.
        type: string
        example: http://localhost:4566
      overrideEndpoint:
        title: Endpoint Overwrite
        description: If true, the requests go to the address in `uriEndpointOverride` instead of AWS, for example to test against LocalStack.
        type: boolean
        default: false
      proxyHost:
        title: Proxy Host
        description: The host name or IP address of an HTTP proxy to send the calls to AWS through, such as the proxy of a company network. Used only together with `proxyPort`. When it is not set, the calls go straight to AWS.
        type: string
        pattern: "^[A-Za-z0-9._-]+$"
        example: proxy.example.com
      proxyPort:
        title: Proxy Port
        description: The port of the proxy in `proxyHost`, such as `3128` for Squid. Used only together with `proxyHost`.
        type: integer
        example: 3128
      proxyProtocol:
        title: Proxy Protocol
        description: "How to talk to the proxy itself: `HTTP` or `HTTPS`. It is not the protocol of the calls to AWS, which stay encrypted, as the proxy only passes them on. When it is not set, it is `HTTPS`, which needs a proxy that takes TLS connections. Most company proxies, such as Squid, take plain HTTP: set `HTTP` for them. With the wrong one, every call fails, for example with `Unsupported or unrecognized SSL message`."
        type: string
        enum: ["HTTP", "HTTPS"]
        example: HTTP
  dependencies:
    - "camel:aws-bedrock"
    - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: CamelAwsBedrock*
        - setHeader:
            name: CamelAwsBedrockContentType
            expression:
              constant:
                expression: application/json
        - setHeader:
            name: CamelAwsBedrockAcceptContentType
            expression:
              constant:
                expression: application/json
        - to:
            uri: aws-bedrock
            parameters:
              label: bedrock-text
              accessKey: "RAW({{?accessKey}})"
              guardrailIdentifier: "{{?guardrailIdentifier}}"
              guardrailTrace: "{{?guardrailTrace}}"
              guardrailVersion: "{{?guardrailVersion}}"
              modelId: "{{modelId}}"
              operation: "{{operation}}"
              overrideEndpoint: "{{overrideEndpoint}}"
              profileCredentialsName: "{{?profileCredentialsName}}"
              region: "{{region}}"
              secretKey: "RAW({{?secretKey}})"
              sessionToken: "RAW({{?sessionToken}})"
              uriEndpointOverride: "{{?uriEndpointOverride}}"
              useDefaultCredentialsProvider: "{{useDefaultCredentialsProvider}}"
              useProfileCredentialsProvider: "{{useProfileCredentialsProvider}}"
              useSessionCredentials: "{{useSessionCredentials}}"
              proxyHost: "{{?proxyHost}}"
              proxyPort: "{{?proxyPort}}"
              proxyProtocol: "{{?proxyProtocol}}"
