apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: sap-netweaver-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "SAP NetWeaver"
    camel.apache.org/kamelet.namespace: "API"
  labels:
    camel.apache.org/kamelet.type: "sink"
spec:
  definition:
    title: "SAP NetWeaver Sink"
    description: |-
      Reads data from an SAP NetWeaver Gateway with an OData GET request, the same request for each message, and gives the answer as a Map or as JSON text.

      Use it to fetch business data from SAP, such as flights, orders or materials, for example on a schedule with `timer-source`, and pass it on to another system.

      Input: any body; it is not sent. The request is always the `command` option, added to `url`; headers on the message cannot change it.

      Output: when it is used inside a route, the body afterwards is the answer of the gateway. By default it is a Map, and the outer `d` entry of the OData answer is removed, so the body holds the `results` list or the fields of the entity. With `jsonAsMap` set to false it is JSON text, and with `json` set to false it is XML text in the Atom format.

      Good to know: the body is never sent, so this Kamelet cannot create or change data in SAP. A response that is not JSON fails the message while `json` and `jsonAsMap` are true.
    required:
      - url
      - username
      - password
      - command
    type: object
    properties:
      url:
        title: URL
        description: The address of the OData service on the SAP NetWeaver Gateway, up to the name of the service, starting with `https://`.
        type: string
        example: "https://gateway.example.com/sap/opu/odata/sap/ZDEMO_SRV"
      command:
        title: Command
        description: The OData request to run, added to `url` as the rest of the path, such as an entity set (`FlightCollection`), one entity by its key, and OData query options.
        type: string
        example: "FlightCollection(carrid='AA',connid='0017',fldate=datetime'2024-01-01T00%3A00%3A00')"
      username:
        title: Username
        description: The SAP user to log in to the gateway as, with Basic authentication.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      password:
        title: Password
        description: The password of the SAP user in `username`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      json:
        title: JSON
        description: If true, the answer is asked for in JSON. If false, the gateway answers in XML, in the Atom format, and the body is that XML as text.
        type: boolean
        default: true
      jsonAsMap:
        title: JSON As Map
        description: If true, the JSON answer is read into a Map. If false, the body is the JSON text. Only used when `json` is true.
        type: boolean
        default: true
      flatternMap:
        title: Flatten Map
        description: If true, and the Map has only one entry, such as the `d` entry of an OData answer, the body is the value of that entry. Only used when `jsonAsMap` is true.
        type: boolean
        default: true
  dependencies:
    - "camel:sap-netweaver"
    - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        # The component reads the command from CamelNetWeaverCommand as a mandatory
        # header and turns it into the request path, so it is set here from the
        # pinned property. Setting it also overwrites any inbound value, which is
        # what keeps a caller from choosing the request path.
        - setHeader:
            name: CamelNetWeaverCommand
            expression:
              constant:
                expression: "{{command}}"
        - to:
            uri: sap-netweaver
            parameters:
              url: "{{url}}"
              flatternMap: "{{flatternMap}}"
              json: "{{json}}"
              jsonAsMap: "{{jsonAsMap}}"
              password: "RAW({{password}})"
              username: "RAW({{username}})"
