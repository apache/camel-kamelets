apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: resolve-pojo-schema-action
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Actions"
    camel.apache.org/kamelet.namespace: "Transformation"
  labels:
    camel.apache.org/kamelet.type: "action"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "Resolve Schema Action"
    description: |-
      Attaches an Avro, Protobuf or JSON schema to each message, for the later steps that need one, and leaves the body unchanged.

      Use it to give the schema once, before `data-type-action` with a format such as `avro-binary` or `protobuf-binary`, which takes its schema only from here. `avro-serialize-action`, `avro-deserialize-action`, `protobuf-serialize-action` and `protobuf-deserialize-action` use it too when their own `schema` is not set.

      Input: any body. The schema comes from `schema`, or else from the Java class named by `contentClass`.

      Output: the body and the headers are unchanged. The schema is kept with the message in the properties `X-Content-Schema` and `X-Content-Schema-Type` (`avsc`, `proto` or `json`), which are not headers and are not sent to other systems.

      Good to know: with the default `mimeType`, `application/json`, and no `schema` or `contentClass`, it does nothing. A `mimeType` it does not know makes every message fail with "Unsupported type".
    type: object
    properties:
      mimeType:
        title: MIME Type
        description: "Which kind of schema `schema` holds and later steps need: `avro/binary`, `application/avro` or `avro/x-struct` for Avro; `protobuf/binary`, `application/protobuf` or `protobuf/x-struct` for Protobuf; `application/json` or `application/x-struct` for JSON Schema. With `application/x-java-object`, the kind is taken from `targetMimeType`."
        type: string
        default: "application/json"
        example: "avro/binary"
      schema:
        title: Schema
        description: "The schema itself: for Avro, JSON text such as the example; for Protobuf, a `message` in the `.proto` language; for JSON, a JSON Schema as JSON text. When it is not set, the schema is made from `contentClass`."
        type: string
        example: '{"type": "record", "namespace": "com.example", "name": "FullName", "fields": [{"name": "first", "type": "string"},{"name": "last", "type": "string"}]}'
      contentClass:
        title: Content Class
        description: The full name of a Java class in the application whose fields define the schema. Only used when `schema` is not set.
        type: string
        example: "com.example.Order"
      targetMimeType:
        title: Target MIME Type
        description: The kind of schema to find, as in `mimeType`, such as `avro/binary`. Only used when `mimeType` is `application/x-java-object`.
        type: string
        example: "avro/binary"
  dependencies:
    - "camel:kamelet"
    - "camel:jackson3-avro"
    - "camel:jackson3-protobuf"
  template:
    beans:
      - name: schemaResolver
        type: "#class:org.apache.camel.component.kamelet.utils.format.schema.DelegatingSchemaResolver"
        properties:
          mimeType: "{{mimeType}}"
          schema: "{{schema:}}"
          contentClass: "{{contentClass:}}"
          targetMimeType: "{{targetMimeType:}}"
    from:
      uri: kamelet:source
      steps:
        - process:
            ref: "{{schemaResolver}}"
