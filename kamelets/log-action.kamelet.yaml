apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: log-action
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Logging"
    camel.apache.org/kamelet.namespace: "Logging"
  labels:
    camel.apache.org/kamelet.type: "action"
spec:
  definition:
    title: "Log Action"
    description: |-
      Writes each message to the log, with its body and optionally its headers, and passes it on unchanged.

      Use it to see what flows between two steps while you build or debug an integration, for example what a source really sends before a sink fails on it. To log at the end of a flow instead, use `log-sink`.

      Input: any message.

      Output: the message is unchanged.

      Good to know: by default the log line shows the body and its Java type, but not the headers. The body is logged as it is, secrets included, unless `logMask` is true.
    type: object
    properties:
      loggerName:
        title: Logger Name
        description: "The name of the logger, shown on each log line. Use it to tell these log lines apart from others, or to set their level in the logging configuration."
        type: string
        default: "log-action"
        example: "orders-debug"
      level:
        title: Log Level
        description: "The level to log at. Lines at a level below the one the logging is set to, such as `DEBUG` when the logging shows `INFO`, are not shown. `OFF` logs nothing."
        type: string
        default: "INFO"
        enum: ["TRACE", "DEBUG", "INFO", "WARN", "ERROR", "OFF"]
      logMask:
        title: Log Mask
        description: "If true, values that look like secrets, such as what follows `password=` or a header named `token`, are replaced by `xxxxx` in the log."
        type: boolean
        default: false
      marker:
        title: Marker
        description: "A logging marker to add to each log line, for logging setups that filter or send log lines by marker. When it is not set, no marker is added."
        type: string
        example: "AUDIT"
      multiline:
        title: Multiline
        description: "If true, each part of the log line, such as the headers, the body type and the body, is written on a line of its own, which is easier to read for large messages."
        type: boolean
        default: false
      showAllProperties:
        title: Show All Properties
        description: "If true, also logs all the properties Camel keeps with the message, including its internal ones. Mostly useful to Camel developers."
        type: boolean
        default: false
      showBody:
        title: Show Body
        description: "If true, the body is logged. Set it to false for large bodies, or bodies that must not appear in the log."
        type: boolean
        default: true
      showBodyType:
        title: Show Body Type
        description: "If true, the Java type of the body is logged, such as `String`, `byte[]` or `java.util.LinkedHashMap`, which shows what kind of body the next step receives."
        type: boolean
        default: true
      showExchangePattern:
        title: Show Exchange Pattern
        description: "If true, the message pattern is logged: `InOnly` for a one-way message, `InOut` when a reply is expected."
        type: boolean
        default: true
      showHeaders:
        title: Show Headers
        description: "If true, the headers of the message are logged too."
        type: boolean
        default: false
      showProperties:
        title: Show Properties
        description: "If true, also logs the properties that the steps of the integration set on the message, but not Camel's internal ones. Use `showAllProperties` to see those too."
        type: boolean
        default: false
      showStreams:
        title: Show Streams
        description: "If true, a body that is a stream not cached by Camel is logged too. Logging reads such a stream, so the next step may then get an empty body."
        type: boolean
        default: false
      showCachedStreams:
        title: Show Cached Streams
        description: "If true, a body that is a stream cached by Camel, which can be read again, is logged. Camel caches stream bodies by default, so this is the usual case."
        type: boolean
        default: true
  dependencies:
  - "camel:kamelet"
  - "camel:log"
  template:
    from:
      uri: kamelet:source
      steps:
        - to:
            uri: log
            parameters:
              loggerName: "{{loggerName}}"
              level: "{{?level}}"
              logMask: "{{?logMask}}"
              marker: "{{?marker}}"
              multiline: "{{?multiline}}"
              showAllProperties: "{{?showAllProperties}}"
              showBody: "{{?showBody}}"
              showBodyType: "{{?showBodyType}}"
              showCachedStreams: "{{?showCachedStreams}}"
              showExchangePattern: "{{?showExchangePattern}}"
              showHeaders: "{{?showHeaders}}"
              showProperties: "{{?showProperties}}"
              showStreams: "{{?showStreams}}"
