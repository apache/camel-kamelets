apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: azure-cosmosdb-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Azure CosmosDB"
    camel.apache.org/kamelet.namespace: "Azure"
  labels:
    camel.apache.org/kamelet.type: "sink"
spec:
  definition:
    title: "Azure CosmosDB Sink"
    description: |-
      Creates or replaces an item (a JSON document) in a container of Azure Cosmos DB for each message, from the JSON object in the body.

      Use it to store orders, events or profiles as JSON documents in Cosmos DB. To receive the changes made to a container, use `azure-cosmosdb-source`.

      Input: the body is one item as JSON text: a JSON object with an `id` field, such as `{"id": "1001", "region": "EU"}`. A Map fails: turn it into JSON text first, for example with `json-serialize-action`. The partition key value of the item comes from the `itemPartitionKey` option or, when the option is not set, from the `itemPartitionKey` header (or `ce-itemPartitionKey`) of each message.

      Output: the body afterwards is the item as it was created, as a Map, with the fields that Cosmos DB adds.

      Good to know: a message without a partition key value fails. With `operation` `createItem`, the default, an item whose `id` already exists in the same partition fails; with `upsertItem`, it replaces the existing item. The database and the container must exist, unless `createDatabaseIfNotExists` and `createContainerIfNotExists` are true; a new container needs `containerPartitionKeyPath`. Headers that start with `CamelAzureCosmosDb` are removed from the message first, so they cannot change what the Kamelet does.
    required:
      - databaseName
      - containerName
      - databaseEndpoint
    type: object
    properties:
      databaseName:
        title: Database Name
        description: The name of the database in the Azure Cosmos DB account.
        type: string
        example: shop
      containerName:
        title: Container Name
        description: The name of the container in the database to create the items in.
        type: string
        example: orders
      operation:
        title: Operation
        description: What to do with each item. `createItem` creates the item, and fails when an item with the same `id` already exists in the same partition. `upsertItem` creates the item, or replaces the existing item with the same `id` in the same partition with it, as a whole.
        type: string
        default: createItem
        enum: ["createItem", "upsertItem"]
      createDatabaseIfNotExists:
        title: Autocreate Database
        description: If true, the database `databaseName` is created when it does not exist. When not set, or false, a missing database fails each message.
        type: boolean
      createContainerIfNotExists:
        title: Autocreate Container
        description: If true, the container `containerName` is created when it does not exist, with `containerPartitionKeyPath` as its partition key; then `containerPartitionKeyPath` is required. When not set, or false, a missing container fails each message.
        type: boolean
      containerPartitionKeyPath:
        title: Container Partition Key Path
        description: The partition key of the container to create when `createContainerIfNotExists` is true, as the path of a field of the items, such as `/region`. Not used for a container that exists.
        type: string
        pattern: ^/\S+$
        example: /region
      accountKey:
        title: Account Key
        description: "The primary or secondary key of the Azure Cosmos DB account, from the Azure portal: the account, then Settings, Keys. Used when `credentialType` is `SHARED_ACCOUNT_KEY`, the default."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      databaseEndpoint:
        title: Database Endpoint
        description: The address of the Azure Cosmos DB account, shown as URI on the Overview page of the account in the Azure portal.
        type: string
        example: https://my-account.documents.azure.com:443/
      itemPartitionKey:
        title: Item Partition Key
        description: The value of the partition key of the items, the same for every item, such as `EU` when the partition key of the container is `/region`. When it is not set, the value comes from the `itemPartitionKey` header of each message.
        type: string
        example: EU
      credentialType:
        title: Credential Type
        description: How to log in to Azure Cosmos DB. `SHARED_ACCOUNT_KEY`, the default, uses `accountKey`. `AZURE_IDENTITY` uses the Azure identity of the environment, such as the `AZURE_CLIENT_ID`, `AZURE_TENANT_ID` and `AZURE_CLIENT_SECRET` environment variables, a managed identity or the Azure CLI login.
        type: string
        default: "SHARED_ACCOUNT_KEY"
        enum: ["SHARED_ACCOUNT_KEY", "AZURE_IDENTITY"]
  types:
    in:
      mediaType: application/json
  dataTypes:
    in:
      headers:
        itemPartitionKey:
          title: Item Partition Key
          description: The value of the partition key of the item, such as `EU`. Used only when the `itemPartitionKey` option is not set; then it, or `ce-itemPartitionKey`, is required.
          type: string
        ce-itemPartitionKey:
          title: Item Partition Key
          description: The value of the partition key of the item, as a CloudEvents extension. Used when `itemPartitionKey` is not set.
          type: string
  dependencies:
    - "camel:azure-cosmosdb"
    - "camel:kamelet"
    - "camel:jackson3"
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: CamelAzureCosmosDb*
        - choice:
            precondition: true
            when:
              - expression:
                  simple:
                    expression: "${propertiesExist:!itemPartitionKey}"
                steps:
                  - choice:
                      when:
                        - expression:
                            simple:
                              expression: "${header[itemPartitionKey]}"
                          steps:
                            - setHeader:
                                name: CamelAzureCosmosDbItemPartitionKey
                                expression:
                                  simple:
                                    expression: "${header[itemPartitionKey]}"
                        - expression:
                            simple:
                              expression: "${header[ce-itemPartitionKey]}"
                          steps:
                            - setHeader:
                                name: CamelAzureCosmosDbItemPartitionKey
                                expression:
                                  simple:
                                    expression: "${header[ce-itemPartitionKey]}"
        - choice:
            precondition: true
            when:
              - expression:
                  simple:
                    expression: "${propertiesExist:createDatabaseIfNotExists}"
                steps:
                  - setHeader:
                      name: CamelAzureCosmosDbCreateDatabaseIfNotExist
                      expression:
                        constant:
                          expression: "{{createDatabaseIfNotExists}}"
        - choice:
            precondition: true
            when:
              - expression:
                  simple:
                    expression: "${propertiesExist:createContainerIfNotExists}"
                steps:
                  - setHeader:
                      name: CamelAzureCosmosDbCreateContainerIfNotExist
                      expression:
                        constant:
                          expression: "{{createContainerIfNotExists}}"
        - unmarshal:
            json: {}
        - to:
            uri: azure-cosmosdb
            parameters:
              databaseName: "{{databaseName}}"
              containerName: "{{containerName}}"
              accountKey: "RAW({{?accountKey}})"
              credentialType: "{{credentialType}}"
              databaseEndpoint: "{{databaseEndpoint}}"
              itemPartitionKey: "{{?itemPartitionKey}}"
              operation: "{{operation}}"
              createDatabaseIfNotExists: "{{?createDatabaseIfNotExists}}"
              createContainerIfNotExists: "{{?createContainerIfNotExists}}"
              containerPartitionKeyPath: "{{?containerPartitionKeyPath}}"

