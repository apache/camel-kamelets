apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: ceph-event-based-source
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.23.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Ceph"
    camel.apache.org/kamelet.namespace: "Cloud"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "Ceph Event Based Source"
    description: Receive Ceph RGW bucket notifications from a Kafka topic, and optionally fetch the object each notification refers to.
    required:
      - topic
      - bootstrapServers
    type: object
    properties:
      topic:
        title: Topic Name
        description: The Kafka topic Ceph pushes the bucket notifications to.
        type: string
        example: "ceph-bucket-notifications"
      bootstrapServers:
        title: Bootstrap Servers
        description: A comma separated list of Kafka brokers to connect to.
        type: string
      consumerGroup:
        title: Consumer Group
        description: A string that uniquely identifies the group of consumers this source belongs to.
        type: string
        example: "my-group-id"
      autoOffsetReset:
        title: Auto Offset Reset
        description: What to do when there is no initial offset. There are 3 enums and the value can be latest, earliest or none.
        type: string
        default: "latest"
        enum: ["latest", "earliest", "none"]
      saslAuthType:
        title: Authentication Type
        description: Authentication type to use. Use NONE for no authentication, PLAIN or SCRAM_SHA_256/SCRAM_SHA_512 for username/password, SSL for certificate-based, OAUTH for OAuth 2.0, AWS_MSK_IAM for MSK, or KERBEROS for Kerberos.
        type: string
        default: NONE
        enum: ["NONE", "PLAIN", "SCRAM_SHA_256", "SCRAM_SHA_512", "SSL", "OAUTH", "AWS_MSK_IAM", "KERBEROS"]
      saslUsername:
        title: Username
        description: Username for SASL authentication. Required when saslAuthType is PLAIN, SCRAM_SHA_256, or SCRAM_SHA_512.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      saslPassword:
        title: Password
        description: Password for SASL authentication. Required when saslAuthType is PLAIN, SCRAM_SHA_256, or SCRAM_SHA_512.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      getObject:
        title: Get Object
        description: Fetch the object body from Ceph for ObjectCreated events, instead of emitting only the notification.
        type: boolean
        default: false
      cephUrl:
        title: Ceph URL
        description: The URL of the Ceph RGW endpoint to fetch objects from. Required when getObject is true.
        type: string
        example: "http://ceph-rgw:8080"
      accessKey:
        title: Access Key
        description: The access key to read objects from Ceph. Required when getObject is true.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      secretKey:
        title: Secret Key
        description: The secret key to read objects from Ceph. Required when getObject is true.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      zoneGroup:
        title: Ceph Zone Group
        description: The zone group the bucket belongs to, passed to the S3 client as its region.
        type: string
        example: "zonegroup1"
  dependencies:
    - "camel:kafka"
    - "camel:core"
    - "camel:jsonpath"
    - "camel:jackson"
    - "camel:kamelet"
    - "camel:aws2-s3"
  template:
    from:
      uri: "kafka:{{topic}}"
      parameters:
        brokers: "{{bootstrapServers}}"
        groupId: "{{?consumerGroup}}"
        autoOffsetReset: "{{autoOffsetReset}}"
        saslAuthType: "{{saslAuthType}}"
        saslUsername: "{{?saslUsername}}"
        saslPassword: "{{?saslPassword}}"
      steps:
        # Ceph extension fields, surfaced as headers so a consumer does not have
        # to re-parse the body for them. Named the way the catalog names source
        # output headers -- a plain form plus a CloudEvents one, as
        # infinispan-source and ftp-source do. s3.bucket.id is deliberately not
        # surfaced: it is an internal Ceph id useful only for debugging.
        - setHeader:
            name: ceph-event-id
            jsonpath: $.Records[0].eventId
        - setHeader:
            name: ce-cepheventid
            simple: "${header[ceph-event-id]}"
        - setHeader:
            name: ceph-opaque-data
            jsonpath: $.Records[0].opaqueData
        - setHeader:
            name: ce-cephopaquedata
            simple: "${header[ceph-opaque-data]}"
        - setHeader:
            name: ceph-object-metadata
            jsonpath: $.Records[0].s3.object.metadata
        - setHeader:
            name: ce-cephobjectmetadata
            simple: "${header[ceph-object-metadata]}"
        - setHeader:
            name: ceph-object-tags
            jsonpath: $.Records[0].s3.object.tags
        - setHeader:
            name: ce-cephobjecttags
            simple: "${header[ceph-object-tags]}"
        # Ceph emits the classic S3 notification envelope -- a Records array --
        # not the EventBridge shape that aws-s3-event-based-source parses, so the
        # paths below are Records based on purpose.
        - choice:
            precondition: true
            when:
              - simple: '${properties:getObject:false}'
                steps:
                  - unmarshal:
                      json:
                        library: Jackson
                        unmarshalType: com.fasterxml.jackson.databind.JsonNode
                  - setProperty:
                      name: ceph-event-name
                      jsonpath: $.Records[0].eventName
                  - choice:
                      when:
                        - simple: '${exchangeProperty.ceph-event-name} startsWith "ObjectCreated"'
                          steps:
                            - setProperty:
                                name: ceph-object-key
                                jsonpath: $.Records[0].s3.object.key
                            - setProperty:
                                name: ceph-bucket-name
                                jsonpath: $.Records[0].s3.bucket.name
                            - toD: >-
                                aws2-s3:${exchangeProperty.ceph-bucket-name}?accessKey={{accessKey}}&secretKey={{secretKey}}&region={{zoneGroup}}&operation=getObject&keyName=${exchangeProperty.ceph-object-key}&uriEndpointOverride={{cephUrl}}&overrideEndpoint=true
        - to: "kamelet:sink"
