apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: snmp-source
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "SNMP"
    camel.apache.org/kamelet.namespace: "Monitoring"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "SNMP Source"
    description: |-
      Reads values, such as uptime or interface counters, from a network device over SNMP at a regular interval, or receives the SNMP traps that devices send, one message per reading or trap.

      Use it to monitor routers, switches, printers or servers that speak SNMP, for example to store their counters over time, or to forward their alarms (traps) to a ticketing or chat system.

      Output: the body is XML text with one `entry` per value, each with its `oid` (the identifier of the value, such as `1.3.6.1.2.1.1.3.0` for the uptime) and its `value`, inside an `snmp` element. For a trap, the `peerAddress` header is the address of the device that sent it.

      Good to know: with `type` set to `TRAP`, `host` and `port` are the address to listen on, not a device; traps are usually sent to port 162, but `port` is 161 by default, and a port below 1024 needs administrator rights on most systems. A device that does not answer a poll gives no message. SNMP v1 and v2c send the community string in clear text; prefer v3 when the device supports it.
    required:
    - host
    type: object
    properties:
      host:
        title: Host
        description: The host name or IP address of the device to poll. With `type` set to `TRAP`, the local address to listen on for traps, such as `0.0.0.0` for all addresses.
        type: string
        example: "192.168.1.1"
      port:
        title: Port
        description: The UDP or TCP port of the device to poll, usually 161. With `type` set to `TRAP`, the port to listen on, usually 162.
        type: integer
        default: 161
      type:
        title: Type
        description: What to do. `POLL` reads the values of the OIDs in `oids` every `delay`; `GET_NEXT` reads the values that come after them, to walk a part of the tree of the device; `TRAP` listens for traps sent by devices.
        type: string
        default: POLL
        enum: ["POLL", "GET_NEXT", "TRAP"]
      oids:
        title: OIDs
        description: The identifiers (OIDs) of the values to read, separated by commas. Required for `POLL` and `GET_NEXT`, not used for `TRAP`.
        type: string
        example: "1.3.6.1.2.1.1.3.0,1.3.6.1.2.1.25.3.2.1.5.1"
      protocol:
        title: Protocol
        description: The network protocol to use. Most devices use `udp`.
        type: string
        default: udp
        enum: ["udp", "tcp"]
      delay:
        title: Delay
        description: How long to wait between two polls, in milliseconds. For example, 60000 is one minute. Not used for `TRAP`.
        type: integer
        default: 60000
      snmpVersion:
        title: SNMP Version
        description: The version of SNMP to use. 0 is v1, 1 is v2c and 3 is v3. It must match the version the device or the trap sender uses.
        type: integer
        default: 0
        enum: [0, 1, 3]
      snmpCommunity:
        title: SNMP Community
        description: The community string of SNMP v1 and v2c, which works as a password and is set on the device. It is sent in clear text, so treat it as a secret.
        type: string
        default: public
        x-descriptors:
        - urn:camel:group:credentials
      treeList:
        title: Tree List
        description: If true, the values found by `GET_NEXT` are returned as one list. Only used with `GET_NEXT`.
        type: boolean
        default: false
      securityName:
        title: Security Name
        description: The SNMP v3 user name, as set on the device. Only used with `snmpVersion` 3.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      securityLevel:
        title: Security Level
        description: The SNMP v3 security level. 1 is no login and no encryption (noAuthNoPriv), 2 is login without encryption (authNoPriv), and 3 is login with encryption (authPriv). Only used with `snmpVersion` 3.
        type: integer
        default: 3
        enum: [1, 2, 3]
      authenticationProtocol:
        title: Authentication Protocol
        description: The SNMP v3 hash used to check the login, as set for the user on the device. Used with `securityLevel` 2 or 3.
        type: string
        enum: ["MD5", "SHA1"]
      authenticationPassphrase:
        title: Authentication Passphrase
        description: The SNMP v3 password of the user, as set on the device. Used with `securityLevel` 2 or 3.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      privacyProtocol:
        title: Privacy Protocol
        description: The SNMP v3 encryption, such as `DES` or `AES128`, as set for the user on the device. Used with `securityLevel` 3.
        type: string
        example: AES128
        x-descriptors:
        - urn:camel:group:credentials
      privacyPassphrase:
        title: Privacy Passphrase
        description: The SNMP v3 encryption password of the user, as set on the device. Used with `securityLevel` 3.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
  dataTypes:
    out:
      headers:
        peerAddress:
          title: Peer Address
          description: For a trap, the address and port of the device that sent it, such as `192.168.1.10/51097`.
          type: string
  dependencies:
    - "camel:snmp"
    - "camel:kamelet"
  template:
    from:
      uri: snmp
      parameters:
        host: "{{host}}"
        port: "{{port}}"
        authenticationPassphrase: "RAW({{?authenticationPassphrase}})"
        authenticationProtocol: "{{?authenticationProtocol}}"
        delay: "{{delay}}"
        oids: "{{?oids}}"
        privacyPassphrase: "RAW({{?privacyPassphrase}})"
        privacyProtocol: "RAW({{?privacyProtocol}})"
        protocol: "{{protocol}}"
        securityLevel: "{{securityLevel}}"
        securityName: "RAW({{?securityName}})"
        snmpCommunity: "{{snmpCommunity}}"
        snmpVersion: "{{snmpVersion}}"
        treeList: "{{treeList}}"
        type: "{{type}}"
      steps:
        - to:
            uri: kamelet:sink
