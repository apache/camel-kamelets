apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: langchain4j-ingest-file-source
  labels:
    camel.apache.org/kamelet.type: "source"
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.22.1-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/kamelet.group: "LangChain4j Ingest"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.namespace: "AI"
spec:
  definition:
    title: "LangChain4j Ingest File Source"
    description: |-
      Watch a directory as the source of an ingestion pipeline, with the defaults a knowledge
      base needs: documents are left in place (noop), unchanged files are remembered in a
      duplicate register keyed on path, modification time and size, a file still being copied
      in is waited for (readLock=changed), and the file name is exposed as the document id in
      the CamelLangChain4jIngestDocumentId header.

      Mind the two dedup layers when composing: this source re-delivers an edited file (its
      register key changes with the modification time), but a langchain4j-ingest-sink with an
      idempotentRepository is first-write-wins by document id - the re-delivered edit would
      be skipped. Use a version-aware id, or no sink repository, when documents change.
    required:
      - directory
    type: object
    properties:
      directory:
        title: Directory
        description: The directory to ingest documents from.
        type: string
        pattern: "[^?#]+"
      recursive:
        title: Recursive
        description: Whether subdirectories are ingested too.
        type: boolean
        default: true
      delay:
        title: Delay
        description: Milliseconds between directory polls; the file endpoint's default is
          500ms, which is aggressive for a knowledge-base directory.
        type: integer
      charset:
        title: Charset
        description: Character set for reading text documents, for example UTF-8. Leave
          unset when the source feeds a parser action (tika-extract-text-action or
          docling-convert-action), which must receive the raw bytes - a charset
          conversion would corrupt a binary document such as a PDF.
        type: string
      idempotentRepository:
        title: Idempotent Repository
        description: An IdempotentRepository bean remembering already consumed files, as a
          `#bean:name` reference; the register is keyed on path, modification time and
          size, so an edited file is consumed again. When unset, the file endpoint's
          default in-memory register (1000 entries) applies - eviction on a large directory
          re-ingests files, so supply a sized or persistent repository for a real knowledge
          base.
        type: string
  dependencies:
    - "camel:core"
    - "camel:file"
    - "camel:kamelet"
  template:
    from:
      uri: "file:{{directory}}"
      parameters:
        noop: "true"
        idempotent: "true"
        # an edited file gets a new key and re-ingests
        idempotentKey: "${file:absolute.path}:${file:modified}:${file:size}"
        recursive: "{{recursive}}"
        readLock: "changed"
        delay: "{{?delay}}"
        charset: "{{?charset}}"
        idempotentRepository: "{{?idempotentRepository}}"
      steps:
        - setHeader:
            name: "CamelLangChain4jIngestDocumentId"
            simple: "${header.CamelFileName}"
        - to: "kamelet:sink"
