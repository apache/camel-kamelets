apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: aws-eventbridge-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "AWS Eventbridge"
    camel.apache.org/kamelet.namespace: "AWS"
  labels:
    camel.apache.org/kamelet.type: "sink"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "AWS Eventbridge Sink"
    description: |-
      Sends each message as an event to an Amazon EventBridge event bus, where rules route it to targets such as Lambda functions, SQS queues or Step Functions.

      Use it to publish business events, such as `Order Shipped`, for other applications and AWS services to react to through EventBridge rules.

      Input: the body is the detail of the event, as JSON text that holds a JSON object, such as `{"orderId": "A-1"}`. The `detail-type` header (or `ce-detail-type`) is the detail type, such as `Order Shipped`; the `event-source` header (or `ce-event-source`, or `ce-source`) is the source, such as `com.example.shop`; and the `resources-arn` header (or `ce-resources-arn`) is the ARN (Amazon Resource Name) of the resource the event is about, or several separated by commas. Each header falls back on its option: `detailType`, `eventSource` and `resourcesArn`.

      Output: when it is used inside a route, the body afterwards is the response of EventBridge, and the `CamelAwsEventbridgeFailedEntryCount` header is 1 when EventBridge rejected the event, 0 otherwise.

      Good to know: a message fails when it has no detail type, no source or no resource ARN, from a header or an option. `eventSourcePrefix` is put before every source. An event that EventBridge rejects, such as one whose body is not a JSON object, is not delivered; depending on the Camel version the message then fails, or it only sets `CamelAwsEventbridgeFailedEntryCount` to 1.
    required:
      - eventbusNameOrArn
      - region
    type: object
    properties:
      eventbusNameOrArn:
        title: Event Bus Name
        description: The name of the event bus, such as `default` or `orders`, or its ARN (Amazon Resource Name).
        example: orders
        type: string
      resourcesArn:
        title: Resource ARNs
        description: The ARNs (Amazon Resource Names) of the resources the event is about, separated by commas. Used when the message has no `resources-arn` header. Each event needs at least one.
        example: arn:aws:s3:::my-bucket
        type: string
      eventSourcePrefix:
        title: Event Source Prefix
        description: Text put before the source of every event, from the `event-source` header or the `eventSource` option. For example, with `com.example.` a source of `shop` becomes `com.example.shop`.
        example: com.example.
        type: string
        default: ""
      eventSource:
        title: Event Source
        description: The source of the events, which says what sent them and which rules use to match, such as `com.example.shop`. Used when the message has no `event-source` header. Each event needs one.
        example: com.example.shop
        type: string
      detailType:
        title: Event Detail Type
        description: The detail type of the events, a short name of what happened that rules use to match, such as `Order Shipped`. Used when the message has no `detail-type` header. Each event needs one.
        example: Order Shipped
        type: string
      accessKey:
        title: Access Key
        description: The access key ID of an IAM user, which you create in the AWS console under IAM, Users, Security credentials. Use it together with `secretKey`. Leave both out when `useDefaultCredentialsProvider` or `useProfileCredentialsProvider` is true.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      secretKey:
        title: Secret Key
        description: The secret access key that belongs to `accessKey`. The AWS console shows it only once, when the access key is created.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      region:
        title: AWS Region
        description: The AWS region of the event bus, as a region code such as `eu-west-1` or `us-east-1`.
        example: eu-west-1
        type: string
        enum: ["ap-south-1", "eu-south-1", "us-gov-east-1", "me-central-1", "ca-central-1", "eu-central-1", "us-iso-west-1", "us-west-1", "us-west-2", "af-south-1", "eu-north-1", "eu-west-3", "eu-west-2", "eu-west-1", "ap-northeast-3", "ap-northeast-2", "ap-northeast-1", "me-south-1", "sa-east-1", "ap-east-1", "cn-north-1", "us-gov-west-1", "ap-southeast-1", "ap-southeast-2", "us-iso-east-1", "ap-southeast-3", "us-east-1", "us-east-2", "cn-northwest-1", "us-isob-east-1", "aws-global", "aws-cn-global", "aws-us-gov-global", "aws-iso-global", "aws-iso-b-global"]
      useDefaultCredentialsProvider:
        title: Default Credentials Provider
        description: "If true, the credentials are found in the environment instead of in `accessKey` and `secretKey`: the `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY` environment variables, the `~/.aws/credentials` file, or the IAM role of the EC2 instance, ECS task or Kubernetes pod the integration runs on."
        type: boolean
        default: false
      useProfileCredentialsProvider:
        title: Profile Credentials Provider
        description: If true, the credentials are read from a named profile in the AWS credentials file (`~/.aws/credentials`), as the AWS CLI does. Name the profile in `profileCredentialsName`.
        type: boolean
        default: false
      useSessionCredentials:
        title: Session Credentials
        description: "If true, it logs in with temporary credentials: `accessKey`, `secretKey` and `sessionToken`, such as the ones AWS STS gives when you assume an IAM role."
        type: boolean
        default: false
      profileCredentialsName:
        title: Profile Credentials Name
        description: The name of the profile in the AWS credentials file. Only used when `useProfileCredentialsProvider` is true; when it is not set, the default profile is used.
        example: production
        type: string
      sessionToken:
        title: Session Token
        description: The session token of temporary credentials, which comes with their access key and secret key, for example from AWS STS when you assume an IAM role. Only used when `useSessionCredentials` is true.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      uriEndpointOverride:
        title: Overwrite Endpoint URI
        description: The address to connect to instead of AWS, as a URL such as `http://localhost:4566` for LocalStack. Only used when `overrideEndpoint` is true.
        example: http://localhost:4566
        type: string
      overrideEndpoint:
        title: Endpoint Overwrite
        description: If true, it connects to the address in `uriEndpointOverride` instead of to AWS. Use it for a local stand-in of AWS such as LocalStack.
        type: boolean
        default: false
  dataTypes:
    in:
      headers:
        detail-type:
          title: Detail Type
          description: The detail type of the event, such as `Order Shipped`. `ce-detail-type` works too. Without it, the `detailType` option is used; one of them is required.
          type: string
        event-source:
          title: Event Source
          description: The source of the event, such as `com.example.shop`, after `eventSourcePrefix`. `ce-event-source` and `ce-source` work too. Without it, the `eventSource` option is used; one of them is required.
          type: string
        resources-arn:
          title: Resource ARNs
          description: The ARNs of the resources the event is about, separated by commas. `ce-resources-arn` works too. Without it, the `resourcesArn` option is used; one of them is required.
          type: string
  dependencies:
    - "camel:aws2-eventbridge"
    - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[resources-arn]}"
                steps:
                  - setHeader:
                      name: CamelAwsEventbridgeResourcesArn
                      expression:
                        simple:
                          expression: "${header[resources-arn]}"
              - expression:
                  simple:
                    expression: "${header[ce-resources-arn]}"
                steps:
                  - setHeader:
                      name: CamelAwsEventbridgeResourcesArn
                      expression:
                        simple:
                          expression: "${header[ce-resources-arn]}"
            otherwise:
              steps:
                - setHeader:
                    name: CamelAwsEventbridgeResourcesArn
                    expression:
                      simple:
                        expression: "{{?resourcesArn}}"
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[detail-type]}"
                steps:
                  - setHeader:
                      name: CamelAwsEventbridgeDetailType
                      expression:
                        simple:
                          expression: "${header[detail-type]}"
              - expression:
                  simple:
                    expression: "${header[ce-detail-type]}"
                steps:
                  - setHeader:
                      name: CamelAwsEventbridgeDetailType
                      expression:
                        simple:
                          expression: "${header[ce-detail-type]}"
            otherwise:
              steps:
                - setHeader:
                    name: CamelAwsEventbridgeDetailType
                    expression:
                      simple:
                        expression: "{{?detailType}}"
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[event-source]}"
                steps:
                  - setHeader:
                      name: CamelAwsEventbridgeSource
                      expression:
                        simple:
                          expression: "{{?eventSourcePrefix}}${header[event-source]}"
              - expression:
                  simple:
                    expression: "${header[ce-event-source]}"
                steps:
                  - setHeader:
                      name: CamelAwsEventbridgeSource
                      expression:
                        simple:
                          expression: "{{?eventSourcePrefix}}${header[ce-event-source]}"
              - expression:
                  simple:
                    expression: "${header[ce-source]}"
                steps:
                  - setHeader:
                      name: CamelAwsEventbridgeSource
                      expression:
                        simple:
                          expression: "{{?eventSourcePrefix}}${header[ce-source]}"
            otherwise:
              steps:
                - setHeader:
                    name: CamelAwsEventbridgeSource
                    expression:
                      simple:
                        expression: "{{?eventSourcePrefix}}{{?eventSource}}"
        - to:
            uri: "aws2-eventbridge:{{eventbusNameOrArn}}?accessKey=RAW({{?accessKey}})&operation=putEvent&overrideEndpoint={{overrideEndpoint}}&profileCredentialsName={{?profileCredentialsName}}&region={{region}}&secretKey=RAW({{?secretKey}})&sessionToken=RAW({{?sessionToken}})&uriEndpointOverride={{?uriEndpointOverride}}&useDefaultCredentialsProvider={{useDefaultCredentialsProvider}}&useProfileCredentialsProvider={{useProfileCredentialsProvider}}&useSessionCredentials={{useSessionCredentials}}"
