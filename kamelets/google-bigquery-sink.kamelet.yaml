apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: google-bigquery-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Google Big Query"
    camel.apache.org/kamelet.namespace: "GCP"
  labels:
    camel.apache.org/kamelet.type: "sink"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "Google Big Query Sink"
    description: |-
      Inserts each message as one or more rows into a table in Google BigQuery.

      Use it to load events or records into BigQuery for analytics and reports, such as orders, page views or sensor readings, as they happen.

      Input: the body is JSON text: a JSON object for one row, or a JSON array of objects for several rows. The names of the fields are the names of the columns of the table, such as `{"id": 1, "item": "book"}`.

      Output: when it is used inside a route, the body afterwards is the parsed JSON: a Map for one row, or a List of Maps.

      Good to know: the table must exist with its columns. A message with a field that is not a column of the table, or with a body that is not JSON, fails, and none of its rows are inserted. Headers that start with `CamelGoogleBigQuery` are removed from the message first, so they cannot change what the Kamelet does. A message that is sent again, for example after a failure, adds its rows again, unless `useAsInsertId` names a field that identifies each row.
    required:
      - projectId
      - dataset
      - table
      - serviceAccountKey
    type: object
    properties:
      projectId:
        title: Google Cloud Project ID
        description: The ID of the Google Cloud project that holds the dataset, as shown in the Google Cloud console. It is the project ID, not the project name or number.
        type: string
        example: my-project-123
      dataset:
        title: BigQuery Dataset ID
        description: The ID of the dataset that holds the table, as shown in the BigQuery console.
        type: string
        example: shop
      table:
        title: BigQuery Table ID
        description: The ID of the table to insert the rows into, without the project and dataset.
        type: string
        example: orders
      serviceAccountKey:
        title: Service Account Key
        description: "The JSON key of a service account that may insert rows into the table, such as one with the BigQuery Data Editor role, encoded in Base64: create the key in the Google Cloud console under IAM & Admin > Service Accounts > Keys, then encode the downloaded file, for example with `base64 -w0 key.json`."
        type: binary
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      useAsInsertId:
        title: Insert ID Field
        description: The name of a field of each row whose value is sent as the insert ID of the row, such as `orderId`. BigQuery uses the insert ID to drop, on a best-effort basis, a row that it received with the same insert ID shortly before, such as a message sent again after a failed attempt. The field must hold text, such as `"o-1001"`; a message with a row whose field holds a number fails, and none of its rows are inserted. A row without the field is sent without an insert ID. When it is not set, no row has an insert ID, and a row sent twice is added twice.
        type: string
        example: orderId
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
  types:
    in:
      mediaType: application/json
  dependencies:
    - "camel:kamelet"
    - "camel:google-bigquery"
    - "camel:jackson3"
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: CamelGoogleBigQuery*
        - unmarshal:
            json: {}
        - to:
            uri: google-bigquery
            parameters:
              projectId: "{{projectId}}"
              datasetId: "{{dataset}}"
              tableId: "{{table}}"
              serviceAccountKey: "RAW(base64:{{serviceAccountKey}})"
              useAsInsertId: "{{?useAsInsertId}}"
