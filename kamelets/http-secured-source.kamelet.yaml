apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: http-secured-source
  annotations:
    camel.apache.org/kamelet.support.level: "Deprecated"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "HTTP"
    camel.apache.org/kamelet.namespace: "HTTP"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "HTTP Secured Source"
    description: |-
      Deprecated, use `http-source` instead, which has the same login options: fetches a web address at a regular interval with a login, one message per response.

      Use it to poll a protected REST API or feed for its current data, for example fetch the state of the orders every minute. This Kamelet will be removed in a later release: `http-source` now takes the same options, so change only the name of the Kamelet. To receive the requests that other systems send instead, use `webhook-source`.

      Output: the body is the body of the response, as bytes. The headers of the response, such as `Content-Type`, are copied to the message, and `CamelHttpResponseCode` holds the status code.

      Good to know: it fetches the address every `period` and sends a message for each response, even when the data has not changed. A response with a status code of 300 or higher sends no message: the error is logged, and the address is fetched again at the next period. Log in either with `authUsername` and `authPassword`, or with `oauth2ClientId`, `oauth2ClientSecret` and `oauth2TokenEndpoint`: the Kamelet then gets a token from that URL and sends it as a Bearer token.
    required:
    - url
    type: object
    properties:
      period:
        title: Period between Updates
        description: How long to wait between two requests, in milliseconds. The default, 10000, is ten seconds.
        type: integer
        default: 10000
        example: 60000
      contentType:
        title: Content Type
        description: The value of the `Accept` header of the request, which tells the service the kind of response you want, such as `application/json` or `text/csv`.
        type: string
        default: "application/json"
        example: text/csv
      url:
        title: URL
        description: The address to fetch, with the path and any query parameters. It must start with `http://` or `https://`.
        type: string
        example: "https://api.example.com/v1/orders/status"
        pattern: "^(http|https)://.*"
      authMethod:
        title: Authentication Method
        description: The login methods to allow when the service asks for a login, as a comma-separated list of `Basic`, `Digest` and `NTLM`. Basic login with `authUsername` and `authPassword` works without it.
        type: string
        example: Basic
      authenticationPreemptive:
        title: Authentication Preemptive
        description: If true, `authUsername` and `authPassword` are sent with Basic login on the first request. If false, they are sent only after the service answers 401 and asks for them, which takes a second request.
        type: boolean
        default: false
      authUsername:
        title: Authentication Username
        description: The user to log in as, together with `authPassword`.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      authPassword:
        title: Authentication Password
        description: The password of `authUsername`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      oauth2ClientId:
        title: OAuth2 Client ID
        description: The client ID of the application, as registered with the OAuth 2.0 provider. With `oauth2ClientSecret`, it is used to get a token from `oauth2TokenEndpoint` (client credentials grant).
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      oauth2ClientSecret:
        title: OAuth2 Client Secret
        description: The client secret of the application, as given by the OAuth 2.0 provider.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      oauth2TokenEndpoint:
        title: OAuth2 Token URL
        description: The URL to get the tokens from, as given by the OAuth 2.0 provider. The Kamelet logs in to it with `oauth2ClientId` and `oauth2ClientSecret`.
        type: string
        example: https://login.example.com/oauth2/token
        x-descriptors:
        - urn:camel:group:credentials
      oauth2Scope:
        title: OAuth2 Scope
        description: The scope to ask for in the token request, when the OAuth 2.0 provider needs one.
        type: string
        example: orders.write
        x-descriptors:
        - urn:camel:group:credentials
  dataTypes:
    out:
      headers:
        CamelHttpResponseCode:
          title: Status Code
          description: The HTTP status code of the response, such as 200.
          type: integer
        Content-Type:
          title: Content Type
          description: The content type of the response, as sent by the service, such as `application/json`.
          type: string
  dependencies:
    - "camel:http"
    - "camel:kamelet"
    - "camel:timer"
  template:
    from:
      uri: timer
      parameters:
        timerName: fetch
        period: "{{period}}"
      steps:
        - setHeader:
            name: Accept
            expression:
              constant:
                expression: "{{contentType}}"
        - to:
            uri: "{{url}}"
            parameters:
              authMethod: "{{?authMethod}}"
              authUsername: "{{?authUsername}}"
              authPassword: "{{?authPassword}}"
              oauth2ClientId: "{{?oauth2ClientId}}"
              oauth2ClientSecret: "{{?oauth2ClientSecret}}"
              oauth2Scope: "{{?oauth2Scope}}"
              oauth2TokenEndpoint: "{{?oauth2TokenEndpoint}}"
              authenticationPreemptive: "{{authenticationPreemptive}}"
        - to:
            uri: kamelet:sink
