apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: aws-ses-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "AWS SES"
    camel.apache.org/kamelet.namespace: "AWS"
  labels:
    camel.apache.org/kamelet.type: "sink"
spec:
  definition:
    title: "AWS SES Sink"
    description: |-
      Sends each message as a plain-text email through Amazon SES (Simple Email Service), to the addresses in the `to` header or the `to` option.

      Use it to send notifications, alerts or confirmations by email from an integration, such as an order confirmation or an alert when a job fails.

      Input: the body is the text of the email, as plain text. The `to` header (or `ce-to`) gives one or more recipient addresses, separated by commas; it is required unless the `to` option is set. The optional `subject` header (or `ce-subject`) is the subject; without it and without the `subject` option, the subject is a generated ID. The optional `reply-to-addresses` header (or `ce-reply-to-addresses`) is a comma-separated list of addresses that replies go to. Each of these headers takes precedence over the option of the same purpose.

      Output: the body afterwards is the text of the email, as text, and the `Content-Type` header is `text/plain`. The `CamelAwsSesMessageId` header gives the ID that SES gave the email.

      Good to know: a message without a `to` header fails, unless the `to` option is set. The `cc`, `bcc`, `returnPath` and `configurationSet` options apply to every email. The `from` address, and `returnPath` when it is set, must be verified in SES, and while the SES account is in the sandbox, the recipients must be verified too. A `configurationSet` that does not exist in SES makes every email fail. To reach a local stand-in of AWS, use `overrideEndpoint` and `uriEndpointOverride`. To reach AWS through an HTTP proxy, set `proxyHost` and `proxyPort`, and set `proxyProtocol` to `HTTP` for a proxy that takes plain HTTP, such as Squid. Headers that start with `CamelAwsSes` are removed from the message first, so they cannot change what the Kamelet does.
    required:
      - from
      - region
    type: object
    properties:
      from:
        title: From
        description: The sender address of the emails. It must be an address, or belong to a domain, that is verified in Amazon SES.
        type: string
        example: noreply@example.com
      accessKey:
        title: Access Key
        description: The access key ID of an IAM user, which you create in the AWS console under IAM, Users, Security credentials. Use it together with `secretKey`. Leave both out when `useDefaultCredentialsProvider` or `useProfileCredentialsProvider` is true.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      secretKey:
        title: Secret Key
        description: The secret access key that belongs to `accessKey`. The AWS console shows it only once, when the access key is created.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      region:
        title: AWS Region
        description: The AWS region of Amazon SES to send through, where the `from` address is verified, as a region code such as `eu-west-1`.
        example: eu-west-1
        type: string
        enum: ["ap-south-1", "eu-south-1", "us-gov-east-1", "me-central-1", "ca-central-1", "eu-central-1", "us-iso-west-1", "us-west-1", "us-west-2", "af-south-1", "eu-north-1", "eu-west-3", "eu-west-2", "eu-west-1", "ap-northeast-3", "ap-northeast-2", "ap-northeast-1", "me-south-1", "sa-east-1", "ap-east-1", "cn-north-1", "us-gov-west-1", "ap-southeast-1", "ap-southeast-2", "us-iso-east-1", "ap-southeast-3", "us-east-1", "us-east-2", "cn-northwest-1", "us-isob-east-1", "aws-global", "aws-cn-global", "aws-us-gov-global", "aws-iso-global", "aws-iso-b-global"]
      useDefaultCredentialsProvider:
        title: Default Credentials Provider
        description: "If true, the credentials are found in the environment instead of in `accessKey` and `secretKey`: the `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY` environment variables, the `~/.aws/credentials` file, or the IAM role of the EC2 instance, ECS task or Kubernetes pod the integration runs on."
        type: boolean
        default: false
      useProfileCredentialsProvider:
        title: Profile Credentials Provider
        description: If true, the credentials are read from a named profile in the AWS credentials file (`~/.aws/credentials`), as the AWS CLI does. Name the profile in `profileCredentialsName`.
        type: boolean
        default: false
      useSessionCredentials:
        title: Session Credentials
        description: "If true, it logs in with temporary credentials: `accessKey`, `secretKey` and `sessionToken`, such as the ones AWS STS gives when you assume an IAM role."
        type: boolean
        default: false
      profileCredentialsName:
        title: Profile Credentials Name
        description: The name of the profile in the AWS credentials file. Only used when `useProfileCredentialsProvider` is true; when it is not set, the default profile is used.
        example: production
        type: string
      sessionToken:
        title: Session Token
        description: The session token of temporary credentials, which comes with their access key and secret key, for example from AWS STS when you assume an IAM role. Only used when `useSessionCredentials` is true.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      proxyHost:
        title: Proxy Host
        description: The host name or IP address of an HTTP proxy to send the calls to AWS through, such as the proxy of a company network. Used only together with `proxyPort`. When it is not set, the calls go straight to AWS.
        type: string
        pattern: "^[A-Za-z0-9._-]+$"
        example: proxy.example.com
      proxyPort:
        title: Proxy Port
        description: The port of the proxy in `proxyHost`, such as `3128` for Squid. Used only together with `proxyHost`.
        type: integer
        example: 3128
      proxyProtocol:
        title: Proxy Protocol
        description: "How to talk to the proxy itself: `HTTP` or `HTTPS`. It is not the protocol of the calls to AWS, which stay encrypted, as the proxy only passes them on. When it is not set, it is `HTTPS`, which needs a proxy that takes TLS connections. Most company proxies, such as Squid, take plain HTTP: set `HTTP` for them. With the wrong one, every call fails, for example with `Unsupported or unrecognized SSL message`."
        type: string
        enum: ["HTTP", "HTTPS"]
        example: HTTP
      to:
        title: To
        description: The addresses to send every email to, separated by commas, such as `ops@example.com,oncall@example.com`. A `to` header on the message takes precedence. When it is not set, the `to` header is required.
        example: ops@example.com
        type: string
        pattern: "^[^ ,@]+@[^ ,@]+( *, *[^ ,@]+@[^ ,@]+)*$"
      cc:
        title: Cc
        description: The addresses to send a copy of every email to (Cc), separated by commas. The recipients see them.
        example: team@example.com
        type: string
        pattern: "^[^ ,@]+@[^ ,@]+( *, *[^ ,@]+@[^ ,@]+)*$"
      bcc:
        title: Bcc
        description: The addresses to send a blind copy of every email to (Bcc), separated by commas. The other recipients do not see them.
        example: archive@example.com
        type: string
        pattern: "^[^ ,@]+@[^ ,@]+( *, *[^ ,@]+@[^ ,@]+)*$"
      subject:
        title: Subject
        description: The subject of every email. A `subject` header on the message takes precedence. When it is not set, and there is no `subject` header, the subject is a generated ID.
        example: Order confirmation
        type: string
      replyToAddresses:
        title: Reply-To Addresses
        description: The addresses that replies go to, separated by commas, such as `support@example.com`. A `reply-to-addresses` header on the message takes precedence. When it is not set, the emails have no Reply-To, and replies go to `from`.
        example: support@example.com
        type: string
        pattern: "^[^ ,@]+@[^ ,@]+( *, *[^ ,@]+@[^ ,@]+)*$"
      returnPath:
        title: Return Path
        description: The address that bounces and complaints are sent to, such as `bounces@example.com`. It must be verified in SES, as `from` is. When it is not set, they go to the `from` address.
        example: bounces@example.com
        type: string
        pattern: "^[^ ,@]+@[^ ,@]+$"
      configurationSet:
        title: Configuration Set
        description: The name of an SES configuration set to send the emails with, such as `my-configuration-set`, for example to publish their delivery, bounce, open and click events to CloudWatch, SNS or Firehose. It must exist in SES in the region, or every email fails with `ConfigurationSetDoesNotExist`.
        example: my-configuration-set
        type: string
        pattern: "^[A-Za-z0-9_-]+$"
      overrideEndpoint:
        title: Endpoint Overwrite
        description: If true, it connects to the address in `uriEndpointOverride` instead of to SES. Use it for a local stand-in of AWS such as LocalStack or Floci, or for a VPC endpoint of SES.
        type: boolean
      uriEndpointOverride:
        title: Overwrite Endpoint URI
        description: The address to connect to instead of AWS, as a URL such as `http://localhost:4566` for LocalStack. Only used when `overrideEndpoint` is true.
        example: http://localhost:4566
        type: string
  dataTypes:
    in:
      default: text
      types:
        text:
          format: "text-plain"
          description: "The text of the email."
          mediaType: text/plain
      headers:
        to:
          title: To
          description: The addresses to send the email to, separated by commas. `ce-to` works too. Required unless the `to` option is set, which it takes precedence over.
          type: string
        subject:
          title: Subject
          description: The subject of the email. `ce-subject` works too. It takes precedence over the `subject` option. Without both, the subject is a generated ID.
          type: string
        reply-to-addresses:
          title: Reply-To Addresses
          description: The addresses that replies go to, separated by commas. `ce-reply-to-addresses` works too. It takes precedence over the `replyToAddresses` option.
          type: string
  dependencies:
    - "camel:aws2-ses"
    - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: CamelAwsSes*
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[subject]}"
                steps:
                  - setHeader:
                      name: CamelAwsSesSubject
                      expression:
                        simple:
                          expression: "${header[subject]}"
              - expression:
                  simple:
                    expression: "${header[ce-subject]}"
                steps:
                  - setHeader:
                      name: CamelAwsSesSubject
                      expression:
                        simple:
                          expression: "${header[ce-subject]}"
            otherwise:
              steps:
                - choice:
                    precondition: true
                    when:
                      - expression:
                          simple:
                            expression: "${propertiesExist:!subject}"
                        steps:
                          - setHeader:
                              name: CamelAwsSesSubject
                              expression:
                                simple:
                                  expression: "${exchangeId}"
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[to]}"
                steps:
                  - setHeader:
                      name: CamelAwsSesTo
                      expression:
                        simple:
                          expression: "${header[to]}"
              - expression:
                  simple:
                    expression: "${header[ce-to]}"
                steps:
                  - setHeader:
                      name: CamelAwsSesTo
                      expression:
                        simple:
                          expression: "${header[ce-to]}"
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[reply-to-addresses]}"
                steps:
                  - setHeader:
                      name: CamelAwsSesReplyToAddresses
                      expression:
                        simple:
                          expression: "${header[reply-to-addresses]}"
              - expression:
                  simple:
                    expression: "${header[ce-reply-to-addresses]}"
                steps:
                  - setHeader:
                      name: CamelAwsSesReplyToAddresses
                      expression:
                        simple:
                          expression: "${header[ce-reply-to-addresses]}"
        - to:
            uri: "aws2-ses://{{from}}?accessKey=RAW({{?accessKey}})&profileCredentialsName={{?profileCredentialsName}}&region={{region}}&secretKey=RAW({{?secretKey}})&sessionToken=RAW({{?sessionToken}})&useDefaultCredentialsProvider={{useDefaultCredentialsProvider}}&useProfileCredentialsProvider={{useProfileCredentialsProvider}}&useSessionCredentials={{useSessionCredentials}}&proxyHost={{?proxyHost}}&proxyPort={{?proxyPort}}&proxyProtocol={{?proxyProtocol}}&to=RAW({{?to}})&cc=RAW({{?cc}})&bcc=RAW({{?bcc}})&subject=RAW({{?subject}})&replyToAddresses=RAW({{?replyToAddresses}})&returnPath=RAW({{?returnPath}})&configurationSet={{?configurationSet}}&overrideEndpoint={{?overrideEndpoint}}&uriEndpointOverride={{?uriEndpointOverride}}"
