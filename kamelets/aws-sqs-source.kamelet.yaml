apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: aws-sqs-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "AWS SQS"
    camel.apache.org/kamelet.namespace: "AWS"
  labels:
    camel.apache.org/kamelet.type: "source"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "AWS SQS Source"
    description: |-
      Receives the messages of an Amazon SQS queue, one message each, and by default deletes each message from the queue once it has been processed.

      Use it to process work that other systems put in a queue, such as orders, jobs or notifications, or the events that SNS, S3 or EventBridge send to a queue. For the events of an S3 bucket, `aws-s3-event-based-source` can also fetch the files.

      Output: the body is the body of the SQS message, as text. The headers give the message ID (`CamelAwsSqsMessageId`), the receipt handle and the MD5 checksum of the body. The message attributes, which the sender sets on a message, are read only when `messageAttributeNames` names them, and the system attributes of SQS, such as `SentTimestamp`, only when `attributeNames` names them. Each attribute that is read becomes a header of the same name, except a message attribute whose name starts with `Camel`.

      Good to know: a message is deleted only after it has been processed without error; a message that fails stays in the queue and is received again when its visibility timeout ends. With `deleteAfterRead` set to false, the messages stay in the queue and are received again and again. A message that takes longer to process than the visibility timeout is received a second time, by this or another reader: set `extendMessageVisibility` to keep it hidden for as long as it is processed. By default one message is processed at a time; `concurrentConsumers` processes several in parallel. Without `queueURL`, `queueOwnerAWSAccountId` or an ARN in `queueNameOrArn`, the queue is looked up by listing the queues, which needs the `sqs:ListQueues` permission. To reach AWS through an HTTP proxy, set `proxyHost` and `proxyPort`, and set `proxyProtocol` to `HTTP` for a proxy that takes plain HTTP, such as Squid.
    required:
      - queueNameOrArn
      - region
    type: object
    properties:
      queueNameOrArn:
        title: Queue Name
        description: The name of the queue, such as `orders`, or its ARN (Amazon Resource Name), such as `arn:aws:sqs:eu-west-1:123456789012:orders`.
        example: orders
        type: string
      deleteAfterRead:
        title: Auto-delete Messages
        description: If true, each message is deleted from the queue once it has been processed. Set it to false to keep the messages; they are then received again each time the visibility timeout ends.
        type: boolean
        default: true
      accessKey:
        title: Access Key
        description: The access key ID of an IAM user, which you create in the AWS console under IAM, Users, Security credentials. Use it together with `secretKey`. Leave both out when `useDefaultCredentialsProvider` or `useProfileCredentialsProvider` is true.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      secretKey:
        title: Secret Key
        description: The secret access key that belongs to `accessKey`. The AWS console shows it only once, when the access key is created.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      region:
        title: AWS Region
        description: The AWS region of the queue, as a region code such as `eu-west-1` or `us-east-1`.
        example: eu-west-1
        type: string
        enum: ["ap-south-1", "eu-south-1", "us-gov-east-1", "me-central-1", "ca-central-1", "eu-central-1", "us-iso-west-1", "us-west-1", "us-west-2", "af-south-1", "eu-north-1", "eu-west-3", "eu-west-2", "eu-west-1", "ap-northeast-3", "ap-northeast-2", "ap-northeast-1", "me-south-1", "sa-east-1", "ap-east-1", "cn-north-1", "us-gov-west-1", "ap-southeast-1", "ap-southeast-2", "us-iso-east-1", "ap-southeast-3", "us-east-1", "us-east-2", "cn-northwest-1", "us-isob-east-1", "aws-global", "aws-cn-global", "aws-us-gov-global", "aws-iso-global", "aws-iso-b-global"]
      autoCreateQueue:
        title: Autocreate Queue
        description: If true, the queue is created when it does not exist. A name that ends in `.fifo` creates a FIFO queue. The credentials need the permission to create queues.
        type: boolean
        default: false
      amazonAWSHost:
        title: AWS Host
        description: The host name of AWS. Leave it as `amazonaws.com` for AWS. Any other value is the address to connect to instead, as `host:port`, together with `protocol`; `uriEndpointOverride` does the same.
        type: string
        default: amazonaws.com
      protocol:
        title: Protocol
        description: "`https` or `http`. Only used when `amazonAWSHost` is not `amazonaws.com`."
        type: string
        example: http
        default: https
      queueURL:
        title: Queue URL
        description: The full address of the queue, as the SQS console shows it. When it is set, it is used as it is, and the queue is not looked up by name, which needs the permission to list the queues.
        example: https://sqs.eu-west-1.amazonaws.com/123456789012/orders
        type: string
      useDefaultCredentialsProvider:
        title: Default Credentials Provider
        description: "If true, the credentials are found in the environment instead of in `accessKey` and `secretKey`: the `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY` environment variables, the `~/.aws/credentials` file, or the IAM role of the EC2 instance, ECS task or Kubernetes pod the integration runs on."
        type: boolean
        default: false
      useProfileCredentialsProvider:
        title: Profile Credentials Provider
        description: If true, the credentials are read from a named profile in the AWS credentials file (`~/.aws/credentials`), as the AWS CLI does. Name the profile in `profileCredentialsName`.
        type: boolean
        default: false
      useSessionCredentials:
        title: Session Credentials
        description: "If true, it logs in with temporary credentials: `accessKey`, `secretKey` and `sessionToken`, such as the ones AWS STS gives when you assume an IAM role."
        type: boolean
        default: false
      profileCredentialsName:
        title: Profile Credentials Name
        description: The name of the profile in the AWS credentials file. Only used when `useProfileCredentialsProvider` is true; when it is not set, the default profile is used.
        example: production
        type: string
      sessionToken:
        title: Session Token
        description: The session token of temporary credentials, which comes with their access key and secret key, for example from AWS STS when you assume an IAM role. Only used when `useSessionCredentials` is true.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      uriEndpointOverride:
        title: Overwrite Endpoint URI
        description: The address to connect to instead of AWS, as a URL such as `http://localhost:4566` for LocalStack. Only used when `overrideEndpoint` is true.
        example: http://localhost:4566
        type: string
      overrideEndpoint:
        title: Endpoint Overwrite
        description: If true, it connects to the address in `uriEndpointOverride` instead of to AWS. Use it for a local stand-in of AWS such as LocalStack.
        type: boolean
        default: false
      delay:
        title: Delay
        description: How long to wait between two polls of the queue, in milliseconds.
        type: integer
        default: 500
      greedy:
        title: Greedy Scheduler
        description: If true, it polls again right away when the last poll received messages, instead of waiting for `delay`.
        type: boolean
        default: false
      maxMessagesPerPoll:
        title: Max Messages Per Poll
        description: The most messages to receive in one request to SQS, from 1 to 10. SQS may return fewer.
        type: integer
        minimum: "1"
        maximum: "10"
        default: 1
      waitTimeSeconds:
        title: Wait Time
        description: How long one request waits for a message to arrive when the queue is empty, in seconds, from 0 to 20 (long polling). When it is not set, the wait time of the queue is used.
        example: 20
        type: integer
        minimum: "0"
      visibilityTimeout:
        title: Visibility Timeout
        description: How long a received message stays hidden from other readers, in seconds. If it is not deleted by then, it is received again. When it is not set, the visibility timeout of the queue is used (30 seconds for a new queue).
        example: 30
        type: integer
        minimum: "0"
      messageAttributeNames:
        title: Message Attribute Names
        description: "The message attributes to read: `All`, or a comma-separated list of names, such as `customer,priority`. A name that ends in `.*`, such as `trace.*`, reads the attributes whose names start with `trace.`. Each attribute that is read becomes a header of the same name: a String attribute as text, a Number attribute as text, or as a number when its type has a label such as `Number.int`, and a Binary attribute as bytes (an AWS SDK `SdkBytes`). A message attribute whose name starts with `Camel` is not made a header. When it is not set, no message attribute is read."
        example: All
        type: string
      attributeNames:
        title: System Attribute Names
        description: "Which of the system attributes that SQS keeps for each message to read: `All`, or a comma-separated list of names from `SenderId`, `SentTimestamp`, `ApproximateReceiveCount`, `ApproximateFirstReceiveTimestamp`, `SequenceNumber`, `MessageDeduplicationId`, `MessageGroupId`, `AWSTraceHeader` and `DeadLetterQueueSourceArn`. A name that is not one of these is ignored, with a warning in the log. Each attribute that is read becomes a header of the same name, as text; the timestamps are in milliseconds since 1970. When it is not set, no system attribute is read."
        example: SentTimestamp,ApproximateReceiveCount
        type: string
      concurrentConsumers:
        title: Concurrent Consumers
        description: How many threads poll the queue and process its messages at the same time. When it is not set, one thread does, and the messages are processed one after the other. With more, they are processed in parallel, in no particular order.
        example: 5
        type: integer
        minimum: "1"
      extendMessageVisibility:
        title: Extend Message Visibility
        description: If true, a message is kept hidden from other readers for as long as it is processed, so a message that takes longer than the visibility timeout is not received a second time. It needs `visibilityTimeout`, without which the integration does not start. Every half of `visibilityTimeout`, the visibility timeout of the messages being processed is extended by `visibilityTimeout` seconds; the credentials need the `sqs:ChangeMessageVisibility` permission.
        type: boolean
      queueOwnerAWSAccountId:
        title: Queue Owner AWS Account ID
        description: The 12-digit ID of the AWS account that owns the queue, such as `123456789012`. When it is set, the address of the queue is built from the account, `region` and the queue name, and the queue is not looked up by listing the queues. Use it for a queue of another AWS account, or when the credentials may not list the queues. An ARN in `queueNameOrArn` gives the account too.
        example: "123456789012"
        type: string
        pattern: "^[0-9]{12}$"
      proxyHost:
        title: Proxy Host
        description: The host name or IP address of an HTTP proxy to send the calls to AWS through, such as the proxy of a company network. Used only together with `proxyPort`. When it is not set, the calls go straight to AWS.
        type: string
        pattern: "^[A-Za-z0-9._-]+$"
        example: proxy.example.com
      proxyPort:
        title: Proxy Port
        description: The port of the proxy in `proxyHost`, such as `3128` for Squid. Used only together with `proxyHost`.
        type: integer
        example: 3128
      proxyProtocol:
        title: Proxy Protocol
        description: "How to talk to the proxy itself: `HTTP` or `HTTPS`. It is not the protocol of the calls to AWS, which stay encrypted, as the proxy only passes them on. When it is not set, it is `HTTPS`, which needs a proxy that takes TLS connections. Most company proxies, such as Squid, take plain HTTP: set `HTTP` for them. With the wrong one, every call fails, for example with `Unsupported or unrecognized SSL message`."
        type: string
        enum: ["HTTP", "HTTPS"]
        example: HTTP
  dataTypes:
    out:
      default: text
      headers:
        CamelAwsSqsMessageId:
          title: Message ID
          description: The ID that SQS gave the message.
          type: string
        CamelAwsSqsReceiptHandle:
          title: Receipt Handle
          description: The receipt handle of this receipt of the message, which SQS needs to delete the message or change its visibility timeout.
          type: string
        CamelAwsSqsMD5OfBody:
          title: Body MD5 Checksum
          description: The MD5 checksum of the body of the message, in hex.
          default: application/octet-stream
          type: string
        CamelAwsSqsAttributes:
          title: System Attributes
          description: A Map of the system attributes that `attributeNames` asks for, such as `SentTimestamp`, with their values as text. Its keys are AWS SDK `MessageSystemAttributeName` values, not text, so read one attribute from its own header instead. Empty when `attributeNames` is not set.
          type: object
        CamelAwsSqsMessageAttributes:
          title: Message Attributes
          description: A Map of the message attributes that `messageAttributeNames` asks for, from the name of each attribute to an AWS SDK `MessageAttributeValue`, which holds its data type and its value. It also holds the attributes whose names start with `Camel`. Empty when `messageAttributeNames` is not set.
          type: object
      types:
        text:
          format: "text-plain"
          description: Default String representation of the SQS message received from the queue.
          mediaType: text/plain
        cloudevents:
          format: "aws2-sqs:application-cloudevents"
          description: Output data type represents AWS SQS receive message response as CloudEvent V1. The data type sets Camel specific CloudEvent headers on the exchange with respective data from the SQS message and its derived object.
          headers:
            CamelCloudEventID:
              title: CloudEvent ID
              description: The Camel exchange id set as event id.
              type: string
            CamelCloudEventType:
              title: CloudEvent Type
              description: The event type.
              default: "org.apache.camel.event.aws.sqs.receiveMessage"
              type: string
            CamelCloudEventSource:
              title: CloudEvent Source
              description: The event source. By default, the name of the SQS queue with the prefix `aws.sqs.queue.`, such as `aws.sqs.queue.orders`.
              type: string
            CamelCloudEventSubject:
              title: CloudEvent Subject
              description: The event subject. The SQS message ID.
              type: string
            CamelCloudEventTime:
              title: CloudEvent Time
              description: The exchange creation timestamp as event time.
              type: string
  dependencies:
    - "camel:aws2-sqs"
    - "camel:kamelet"
  template:
    from:
      uri: aws2-sqs
      parameters:
        queueNameOrArn: "{{queueNameOrArn}}"
        accessKey: "RAW({{?accessKey}})"
        amazonAWSHost: "{{?amazonAWSHost}}"
        attributeNames: "{{?attributeNames}}"
        autoCreateQueue: "{{autoCreateQueue}}"
        delay: "{{delay}}"
        deleteAfterRead: "{{deleteAfterRead}}"
        greedy: "{{greedy}}"
        maxMessagesPerPoll: "{{maxMessagesPerPoll}}"
        messageAttributeNames: "{{?messageAttributeNames}}"
        overrideEndpoint: "{{overrideEndpoint}}"
        profileCredentialsName: "{{?profileCredentialsName}}"
        protocol: "{{?protocol}}"
        queueUrl: "{{?queueURL}}"
        region: "{{region}}"
        secretKey: "RAW({{?secretKey}})"
        sessionToken: "RAW({{?sessionToken}})"
        uriEndpointOverride: "{{?uriEndpointOverride}}"
        useDefaultCredentialsProvider: "{{useDefaultCredentialsProvider}}"
        useProfileCredentialsProvider: "{{useProfileCredentialsProvider}}"
        useSessionCredentials: "{{useSessionCredentials}}"
        visibilityTimeout: "{{?visibilityTimeout}}"
        waitTimeSeconds: "{{?waitTimeSeconds}}"
        proxyHost: "{{?proxyHost}}"
        proxyPort: "{{?proxyPort}}"
        proxyProtocol: "{{?proxyProtocol}}"
        concurrentConsumers: "{{?concurrentConsumers}}"
        extendMessageVisibility: "{{?extendMessageVisibility}}"
        queueOwnerAWSAccountId: "{{?queueOwnerAWSAccountId}}"
      steps:
        - to:
            uri: kamelet:sink
