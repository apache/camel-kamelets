apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: counter-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: data:image/svg+xml;base64,
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Timer"
    camel.apache.org/kamelet.namespace: "Scheduling"
  labels:
    camel.apache.org/kamelet.type: "source"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "Counter Source"
    description: |-
      Sends a message with a number that counts up by one, such as 1, 2, 3, at a regular interval.

      Use it to try out a sink or an action with messages that are each different and easy to follow, or to make ordered test data. For the same fixed message every time use `timer-source`, and for a calendar schedule such as "every weekday at 9:00" use `cron-source`.

      Output: the body is the number, as an Integer (a whole number, not text). The `Content-Type` header is `text/plain`.

      Good to know: it keeps sending until the integration is stopped, unless `numbers` is set. The count starts again from `start` when the integration restarts.
    type: object
    properties:
      period:
        title: Period
        description: "How long to wait between two messages, in milliseconds. For example, 60000 is one minute."
        type: integer
        default: 1000
        example: 60000
      start:
        title: Start
        description: "The number in the first message. Each next message has a number one higher."
        type: integer
        default: 1
        example: 100
      numbers:
        title: Number of Messages
        description: "How many messages to send in total. When it is not set, a message is sent every `period` until the integration is stopped."
        type: integer
        example: 10
  dataTypes:
    out:
      headers:
        Content-Type:
          title: Content Type
          description: "Always `text/plain`."
          type: string
  dependencies:
    - "camel:timer"
    - "camel:kamelet"
  template:
    from:
      uri: timer
      parameters:
        timerName: counter
        period: "{{period}}"
        repeatCount: "{{?numbers}}"
      steps:
        # The counter is held in a route scoped variable rather than an
        # AtomicInteger bean. A template bean is registered under a generated
        # name, which resolves through {{counter}} inside the template but is not
        # addressable from a programmatically built registry, so the bean form
        # could not be used outside Camel K and JBang. See #2771.
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${variable.route:counter} == null"
                steps:
                  - setVariable:
                      name: route:counter
                      expression:
                        simple:
                          resultType: java.lang.Integer
                          expression: "{{start}}"
            otherwise:
              steps:
                - setVariable:
                    name: route:counter
                    expression:
                      simple:
                        resultType: java.lang.Integer
                        expression: "${variable.route:counter}++"
        - setBody:
            expression:
              simple:
                expression: "${variable.route:counter}"
        - setHeader:
            name: Content-Type
            expression:
              constant:
                expression: text/plain
        - to:
            uri: kamelet:sink
