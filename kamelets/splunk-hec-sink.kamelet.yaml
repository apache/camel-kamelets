apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: splunk-hec-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "SPLUNK"
    camel.apache.org/kamelet.namespace: "Monitoring"
  labels:
    camel.apache.org/kamelet.type: "sink"
spec:
  definition:
    title: "Splunk HEC Sink"
    description: |-
      Sends each message as an event to Splunk through its HTTP Event Collector (HEC), for searching, dashboards and alerts in Splunk.

      Use it to send application logs, audit records, metrics or business events from any flow into a Splunk index.

      Input: the body is the event, as text or as structured data such as a Map, which is sent as a JSON object. By default the event sent to Splunk is a JSON object with the headers of the message under `headers` and the body under `body`; `bodyOnly` sends the body alone, and `headersOnly` the headers alone.

      Output: the message is unchanged.

      Good to know: when `index`, `source` and `sourceType` are not set, the events go to the index `camel` with the source and source type `camel`, so set them for your Splunk. The `host` field of the event is the IP address of the machine that runs the integration, unless `hostPayload` is set. It connects with HTTPS and checks the certificate of the server, unless `https` or `skipTlsVerify` say otherwise. Headers that start with `CamelSplunkHEC` are removed from the message first, so they cannot change what the Kamelet does. It sends to the event endpoint `/services/collector/event`; with `splunkEndpoint` set to `/services/collector/raw`, Splunk stores the whole JSON object as raw text instead, and `index`, `source` and `sourceType` no longer apply. A response other than 200, such as a wrong path, fails the message.
    required:
      - splunkUrl
      - token
    type: object
    properties:
      splunkUrl:
        title: Splunk URL
        description: The host and port of the HTTP Event Collector of your Splunk, as `host:port`, without `https://`. The port of HEC is 8088 unless your Splunk administrator changed it.
        type: string
        example: my_server.splunkcloud.com:8088
      token:
        title: Token
        description: The token of an HTTP Event Collector input, from Settings, Data Inputs, HTTP Event Collector in Splunk. It is a GUID such as `12345678-1234-1234-1234-123456789012`, not the token of a user; a value in another form makes the integration fail to start.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      splunkEndpoint:
        title: Splunk Endpoint
        description: The path of the HTTP Event Collector endpoint to send to, starting with `/`, optionally followed by query parameters. When it is not set, it is `/services/collector/event`. With `/services/collector/raw`, Splunk stores the whole JSON object that the Kamelet sends as the text of the event, and takes the index, source and source type from the token and from query parameters, not from `index`, `source` and `sourceType`, such as `/services/collector/raw?index=main&sourcetype=_json`.
        type: string
        example: /services/collector/raw
        pattern: "^/[^\\s]*$"
      hostPayload:
        title: Host of the Event
        description: The value of the `host` field of every event, such as the name of the machine or application that the events are about. It is not the address of Splunk. When it is not set, the IP address of the machine that runs the integration is used.
        type: string
        example: web-1
      bodyOnly:
        title: Body Only
        description: If true, the event is the body alone, without the headers of the message.
        type: boolean
        default: false
      headersOnly:
        title: Headers Only
        description: If true, the event is the headers of the message alone, as a JSON object, without the body.
        type: boolean
        default: false
      index:
        title: Index
        description: The Splunk index to write the events to. The token must be allowed to write to it. When it is not set, the index `camel` is used.
        type: string
        example: main
      source:
        title: Source
        description: The value of the `source` field of every event, which tells where the events come from. When it is not set, `camel` is used.
        type: string
        example: shop-orders
      sourceType:
        title: Source Type
        description: The value of the `sourcetype` field of every event, which tells Splunk how to read the events, such as `_json`. When it is not set, `camel` is used.
        type: string
        example: _json
      skipTlsVerify:
        title: Skip TLS Verification
        description: If true, the certificate of the Splunk server is not checked. Use it only for tests with a self-signed certificate.
        type: boolean
        default: false
      https:
        title: Secure
        description: If true, it connects with HTTPS. Set it to false only for an HTTP Event Collector without TLS.
        type: boolean
        default: true
      time:
        title: Time
        description: The time of every event, as the number of seconds since 1 January 1970 (UTC). When it is not set, Splunk uses the time the event arrives.
        type: string
        example: "1700000000"
  types:
    in:
      mediaType: application/json
  dependencies:
  - "camel:splunk-hec"
  - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: CamelSplunkHEC*
        - to:
            uri: splunk-hec
            parameters:
              splunkURL: "{{splunkUrl}}"
              splunkEndpoint: "RAW({{?splunkEndpoint}})"
              bodyOnly: "{{?bodyOnly}}"
              headersOnly: "{{?headersOnly}}"
              host: "{{?hostPayload}}"
              https: "{{?https}}"
              index: "{{?index}}"
              skipTlsVerify: "{{?skipTlsVerify}}"
              source: "{{?source}}"
              sourceType: "{{?sourceType}}"
              time: "{{?time}}"
              token: "RAW({{token}})"
