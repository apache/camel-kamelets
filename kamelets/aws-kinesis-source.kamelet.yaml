apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: aws-kinesis-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "AWS Kinesis"
    camel.apache.org/kamelet.namespace: "AWS"
  labels:
    camel.apache.org/kamelet.type: "source"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "AWS Kinesis Source"
    description: |-
      Reads the records of an Amazon Kinesis data stream, one message per record.

      Use it to process a stream of events that other applications write to Kinesis, such as clicks, logs or readings from devices, for example with `aws-kinesis-sink`.

      Output: the body is the data of the record, as bytes, and the `Content-Type` header is `application/octet-stream`. The headers give the partition key, the sequence number, the shard ID and the arrival time of the record.

      Good to know: by default it reads the stream from its oldest record, and again from the oldest record each time the integration starts: it does not remember where it stopped, so records are read again after a restart. Set `iteratorType` to `LATEST` to read only the records written after it started; the records written while it was stopped are then not read. `iteratorType` can also start at a sequence number or at a time, again on each start. Records are not removed: Kinesis keeps them for the retention period of the stream. It reads all the shards of the stream, up to 1000 records from each in one poll: set `shardId` to read one shard only, and `maxResultsPerRequest` to read fewer records in one poll. When the stream is resharded, it goes on with the new shards; with `shardClosed` set to `fail`, every poll also fails with an error in the log, but the records are still read. With `useKclConsumers` it reads through the Kinesis Client Library instead, which keeps where it stopped in a DynamoDB table named after `applicationName`, or after the stream, and does not use `iteratorType`, `shardId`, `maxResultsPerRequest` or `shardClosed`. To reach AWS through an HTTP proxy, set `proxyHost` and `proxyPort`, and set `proxyProtocol` to `HTTP` for a proxy that takes plain HTTP, such as Squid. With `useKclConsumers`, the calls of the KCL to DynamoDB and CloudWatch go straight to AWS, without the proxy and without `uriEndpointOverride`.
    required:
      - stream
      - region
    type: object
    properties:
      stream:
        title: Stream Name
        description: The name of the Kinesis data stream, such as `clickstream`. The stream must exist.
        example: clickstream
        type: string
      accessKey:
        title: Access Key
        description: The access key ID of an IAM user, which you create in the AWS console under IAM, Users, Security credentials. Use it together with `secretKey`. Leave both out when `useDefaultCredentialsProvider` or `useProfileCredentialsProvider` is true.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      secretKey:
        title: Secret Key
        description: The secret access key that belongs to `accessKey`. The AWS console shows it only once, when the access key is created.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      region:
        title: AWS Region
        description: The AWS region of the stream, as a region code such as `eu-west-1` or `us-east-1`.
        example: eu-west-1
        type: string
        enum: ["ap-south-1", "eu-south-1", "us-gov-east-1", "me-central-1", "ca-central-1", "eu-central-1", "us-iso-west-1", "us-west-1", "us-west-2", "af-south-1", "eu-north-1", "eu-west-3", "eu-west-2", "eu-west-1", "ap-northeast-3", "ap-northeast-2", "ap-northeast-1", "me-south-1", "sa-east-1", "ap-east-1", "cn-north-1", "us-gov-west-1", "ap-southeast-1", "ap-southeast-2", "us-iso-east-1", "ap-southeast-3", "us-east-1", "us-east-2", "cn-northwest-1", "us-isob-east-1", "aws-global", "aws-cn-global", "aws-us-gov-global", "aws-iso-global", "aws-iso-b-global"]
      useDefaultCredentialsProvider:
        title: Default Credentials Provider
        description: "If true, the credentials are found in the environment instead of in `accessKey` and `secretKey`: the `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY` environment variables, the `~/.aws/credentials` file, or the IAM role of the EC2 instance, ECS task or Kubernetes pod the integration runs on."
        type: boolean
        default: false
      useProfileCredentialsProvider:
        title: Profile Credentials Provider
        description: If true, the credentials are read from a named profile in the AWS credentials file (`~/.aws/credentials`), as the AWS CLI does. Name the profile in `profileCredentialsName`.
        type: boolean
        default: false
      useSessionCredentials:
        title: Session Credentials
        description: "If true, it logs in with temporary credentials: `accessKey`, `secretKey` and `sessionToken`, such as the ones AWS STS gives when you assume an IAM role."
        type: boolean
        default: false
      profileCredentialsName:
        title: Profile Credentials Name
        description: The name of the profile in the AWS credentials file. Only used when `useProfileCredentialsProvider` is true; when it is not set, the default profile is used.
        example: production
        type: string
      sessionToken:
        title: Session Token
        description: The session token of temporary credentials, which comes with their access key and secret key, for example from AWS STS when you assume an IAM role. Only used when `useSessionCredentials` is true.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      uriEndpointOverride:
        title: Overwrite Endpoint URI
        description: The address to connect to instead of AWS, as a URL such as `http://localhost:4566` for LocalStack. Only used when `overrideEndpoint` is true.
        example: http://localhost:4566
        type: string
      overrideEndpoint:
        title: Endpoint Overwrite
        description: If true, it connects to the address in `uriEndpointOverride` instead of to AWS. Use it for a local stand-in of AWS such as LocalStack.
        type: boolean
        default: false
      iteratorType:
        title: Start Position
        description: "Where in the stream it starts reading each time the integration starts. `TRIM_HORIZON` starts at the oldest record the stream still keeps, so the records are read again after each restart. `LATEST` reads only the records written after it started. `AT_SEQUENCE_NUMBER` and `AFTER_SEQUENCE_NUMBER` start at, or just after, the record whose sequence number is in `sequenceNumber`. `AT_TIMESTAMP` starts at the first record that arrived at or after the time in `messageTimestamp`. Not used when `useKclConsumers` is true."
        type: string
        enum: ["TRIM_HORIZON", "LATEST", "AT_SEQUENCE_NUMBER", "AFTER_SEQUENCE_NUMBER", "AT_TIMESTAMP"]
        default: TRIM_HORIZON
      sequenceNumber:
        title: Sequence Number
        description: The sequence number of the record to start at, as Kinesis gives it, such as the value of the `CamelAwsKinesisSequenceNumber` header of a record read earlier. Required, and only used, when `iteratorType` is `AT_SEQUENCE_NUMBER` or `AFTER_SEQUENCE_NUMBER`.
        example: "49655467183424123548936502291338416434578112145614569474"
        type: string
      messageTimestamp:
        title: Start Time
        description: The time to start reading at, either as an ISO 8601 date and time in UTC, such as `2026-11-17T08:00:00Z`, or as milliseconds since 1970-01-01 UTC, such as `1794902400000`. It starts at the first record that arrived in the stream at or after this time. Required, and only used, when `iteratorType` is `AT_TIMESTAMP`.
        example: "2026-11-17T08:00:00Z"
        type: string
      delay:
        title: Delay
        description: How long to wait between two polls of the stream, in milliseconds.
        type: integer
        default: 500
      maxResultsPerRequest:
        title: Max Records Per Poll
        description: The most records it reads from each shard in one poll, from 1 to 10000. When it is not set, it is 1000. Not used when `useKclConsumers` is true.
        type: integer
        example: 100
      shardId:
        title: Shard ID
        description: The ID of the one shard to read, such as `shardId-000000000000`, as the AWS console or `aws kinesis list-shards` shows it. When it is not set, it reads all the shards of the stream. Not used when `useKclConsumers` is true.
        type: string
        pattern: "^shardId-[0-9]+$"
        example: shardId-000000000000
      shardClosed:
        title: Closed Shard
        description: "What to do when it has read the last record of a closed shard. A shard is closed when the stream is resharded, for example when the number of shards is changed, and new shards take its place. `ignore` logs a warning once and goes on with the other shards, and so does `silent`, without the warning. With `fail`, each later poll fails with an error and a stack trace in the log, for as long as the closed shard is listed, which is 24 hours by default; the records of the other shards are still read. When it is not set, it is `ignore`. Not used when `useKclConsumers` is true."
        type: string
        enum: ["ignore", "silent", "fail"]
        example: ignore
      asyncClient:
        title: Async Client
        description: If true, it uses the asynchronous Kinesis client of the AWS SDK. `useKclConsumers` needs it.
        type: boolean
        default: false
      useKclConsumers:
        title: KCL Consumer
        description: If true, it reads the stream with the Kinesis Client Library (KCL), which shares the shards between the running copies of the integration. The KCL also uses DynamoDB and CloudWatch in the same account, so the credentials need access to them. Set `asyncClient` to true too. The calls of the KCL to DynamoDB and CloudWatch always go straight to AWS, without the proxy and without `uriEndpointOverride`.
        type: boolean
        default: false
      kclDisableCloudwatchMetricsExport:
        title: KCL Disable CloudWatch Metrics
        description: If true, the Kinesis Client Library does not send its metrics to CloudWatch. Only used when `useKclConsumers` is true.
        type: boolean
        default: false
      applicationName:
        title: KCL Application Name
        description: "The name of the application for the Kinesis Client Library. The KCL keeps where it stopped, and which copy of the integration reads which shard, in a DynamoDB table of this name, which it creates. Copies of the integration with the same name share the shards of the stream; give another integration that reads the same stream its own name, so that it reads all the records too. When it is not set, it is the name of the stream. Only used when `useKclConsumers` is true."
        type: string
        pattern: "^[A-Za-z0-9_.-]{3,255}$"
        example: orders-processor
      proxyHost:
        title: Proxy Host
        description: The host name or IP address of an HTTP proxy to send the calls to AWS through, such as the proxy of a company network. Used only together with `proxyPort`. When it is not set, the calls go straight to AWS.
        type: string
        pattern: "^[A-Za-z0-9._-]+$"
        example: proxy.example.com
      proxyPort:
        title: Proxy Port
        description: The port of the proxy in `proxyHost`, such as `3128` for Squid. Used only together with `proxyHost`.
        type: integer
        example: 3128
      proxyProtocol:
        title: Proxy Protocol
        description: "How to talk to the proxy itself: `HTTP` or `HTTPS`. It is not the protocol of the calls to AWS, which stay encrypted, as the proxy only passes them on. When it is not set, it is `HTTPS`, which needs a proxy that takes TLS connections. Most company proxies, such as Squid, take plain HTTP: set `HTTP` for them. With the wrong one, every call fails, for example with `Unsupported or unrecognized SSL message`."
        type: string
        enum: ["HTTP", "HTTPS"]
        example: HTTP
  types:
    out:
      mediaType: application/octet-stream
  dataTypes:
    out:
      default: binary
      types:
        binary:
          format: "application-octet-stream"
          description: "The data of the record, as bytes."
          mediaType: application/octet-stream
      headers:
        CamelAwsKinesisPartitionKey:
          title: Partition Key
          description: The partition key of the record.
          type: string
        CamelAwsKinesisStreamName:
          title: Stream Name
          description: The name of the stream the record was read from, as set in `stream`.
          type: string
        CamelAwsKinesisSequenceNumber:
          title: Sequence Number
          description: The sequence number of the record in its shard.
          type: string
        CamelAwsKinesisShardId:
          title: Shard ID
          description: The ID of the shard the record was read from, such as `shardId-000000000000`.
          type: string
        CamelAwsKinesisApproximateArrivalTimestamp:
          title: Arrival Time
          description: When the record arrived in the stream, about.
          type: string
  dependencies:
    - "camel:aws2-kinesis"
    - "camel:kamelet"
  template:
    from:
      uri: aws2-kinesis
      parameters:
        streamName: "{{stream}}"
        accessKey: "RAW({{?accessKey}})"
        asyncClient: "{{asyncClient}}"
        delay: "{{delay}}"
        iteratorType: "{{iteratorType}}"
        sequenceNumber: "{{?sequenceNumber}}"
        messageTimestamp: "{{?messageTimestamp}}"
        kclDisableCloudwatchMetricsExport: "{{kclDisableCloudwatchMetricsExport}}"
        overrideEndpoint: "{{overrideEndpoint}}"
        profileCredentialsName: "{{?profileCredentialsName}}"
        region: "{{region}}"
        secretKey: "RAW({{?secretKey}})"
        sessionToken: "RAW({{?sessionToken}})"
        uriEndpointOverride: "{{?uriEndpointOverride}}"
        useDefaultCredentialsProvider: "{{useDefaultCredentialsProvider}}"
        useKclConsumers: "{{useKclConsumers}}"
        useProfileCredentialsProvider: "{{useProfileCredentialsProvider}}"
        useSessionCredentials: "{{useSessionCredentials}}"
        proxyHost: "{{?proxyHost}}"
        proxyPort: "{{?proxyPort}}"
        proxyProtocol: "{{?proxyProtocol}}"
        maxResultsPerRequest: "{{?maxResultsPerRequest}}"
        shardId: "{{?shardId}}"
        shardClosed: "{{?shardClosed}}"
        applicationName: "{{?applicationName}}"
      steps:
        - to:
            uri: kamelet:sink
