apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: google-mail-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Google Mail"
    camel.apache.org/kamelet.namespace: "GCP"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "Google Mail Source"
    description: |-
      Receives the emails of a Gmail mailbox that match a search, by default the unread ones, one message per email, and marks each email as read once it has been processed.

      Use it to act on incoming email, for example to open a ticket for each email sent to a support address, or to collect orders or invoices that arrive by mail.

      Output: the body is the text of the email (its first part with content, such as the plain text part) as JSON text, that is the text in double quotes with JSON escapes. The headers give the subject (`CamelGoogleMailStreamSubject`), the sender (`CamelGoogleMailStreamFrom`), the recipients (`CamelGoogleMailStreamTo`, `CamelGoogleMailStreamCc`, `CamelGoogleMailStreamBcc`) and the Gmail ID of the email (`CamelGoogleMailId`). With `raw` set to true, the body is the whole email instead, with its attachments, encoded in base64url, as JSON text, and only the Gmail ID is set as a header.

      Good to know: it reads the emails that match `query`, by default the unread ones. With `markAsRead` set to false and the default query, the same emails are read again on every poll. An email whose processing fails is marked as unread again. Each poll reads up to `maxResults` emails, 10 by default. It logs in to Google either with OAuth (an OAuth client of a Google Cloud project, and an access token and a refresh token of the Gmail account), or with the key of a service account in `serviceAccountKey` together with `scopes`, which reads the mailbox of the user in `delegate`.
    required:
      - index
      - applicationName
    type: object
    properties:
      index:
        title: Index
        description: Any name for this reader of the mailbox, such as `support`. It is not sent to Google.
        type: string
        example: support
      clientId:
        title: Client ID
        description: The client ID of an OAuth client, created in the Google Cloud console under APIs & Services > Credentials, in a project where the Gmail API is enabled. Not needed when logging in with `serviceAccountKey`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      clientSecret:
        title: Client Secret
        description: The client secret of the OAuth client of `clientId`. Not needed when logging in with `serviceAccountKey`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      accessToken:
        title: Access Token
        description: An OAuth 2 access token of the Gmail account, with access to read and change its emails. It expires after about an hour; the Kamelet then gets a new one with `refreshToken`. Not needed when logging in with `serviceAccountKey`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      refreshToken:
        title: Refresh Token
        description: An OAuth 2 refresh token of the Gmail account, which the Kamelet uses to get a new access token when the current one expires. You get it together with the access token, for example from the Google OAuth 2.0 Playground. Not needed when logging in with `serviceAccountKey`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      serviceAccountKey:
        title: Service Account Key
        description: "The JSON key of a Google service account, to log in with instead of OAuth: `file:` followed by the path of the key file, `classpath:` followed by a resource of the application, or `base64:` followed by the Base64 encoding of the key. Create the key in the Google Cloud console under IAM & Admin > Service Accounts > Keys. It reads the mailbox of the user in `delegate`, and needs `scopes`. Only used when `clientSecret` is not set."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
        pattern: "^(file|classpath|base64):.+"
        example: file:/etc/google/service-account.json
      delegate:
        title: Delegate User
        description: The email address of the user of your Google Workspace whose mailbox the service account of `serviceAccountKey` reads on their behalf. A Workspace administrator must first allow the client ID of the service account, with the scopes of `scopes`, under Security > Access and data control > API controls > Domain-wide delegation. Only used with `serviceAccountKey`.
        type: string
        pattern: "^[^@\\s]+@[^@\\s]+$"
        example: support@example.com
      scopes:
        title: Scopes
        description: "The permissions to ask Google for, as URLs separated by commas. Needed with `serviceAccountKey`: without them, the login asks Google for no permission at all. Use `https://www.googleapis.com/auth/gmail.modify`, which marking the emails as read needs, or `https://www.googleapis.com/auth/gmail.readonly` with `markAsRead` set to false. Leave it unset with `clientId` and `clientSecret`; with them, setting it makes the Kamelet fail."
        type: string
        pattern: "^https://[^,\\s]+(,https://[^,\\s]+)*$"
        example: https://www.googleapis.com/auth/gmail.modify
      delay:
        title: Delay
        description: How long to wait between two polls of the mailbox, in milliseconds. For example, 60000 is one minute.
        type: integer
        default: 500
        example: 60000
      applicationName:
        title: Application Name
        description: A name for your application, sent to Google with each call, such as `my-company-mail/1.0`.
        type: string
        example: my-company-mail/1.0
      markAsRead:
        title: Mark as Read
        description: If true, each email is marked as read once it has been processed, so that the default query `is:unread` does not read it again.
        type: boolean
        default: true
      labels:
        title: Gmail Labels
        description: The names of the Gmail labels to read the emails of, separated by commas, such as `INBOX` or a label of your own. When it is not set, the emails are not filtered by label.
        type: string
        example: "INBOX"
      query:
        title: Gmail Query
        description: A Gmail search, written as in the search box of Gmail, that selects the emails to read.
        type: string
        example: "is:unread -category:(promotions OR social)"
        default: "is:unread"
      maxResults:
        title: Max Results
        description: The most emails to read at each poll. When it is not set, 10 is used.
        type: integer
        example: 50
      raw:
        title: Raw Email
        description: If true, the body is the whole email, with its headers and all its parts, such as attachments, in the format of an `.eml` file (RFC 2822), encoded in base64url, as JSON text, that is in double quotes. Remove the quotes and decode it to get the email. The subject, sender and recipients are then not set as headers. When it is not set, it is false, and the body is the text of the email, without its attachments.
        type: boolean
  dataTypes:
    out:
      default: json
      headers:
        CamelGoogleMailId:
          title: Email ID
          description: The Gmail ID of the email.
          type: string
        CamelGoogleMailStreamTo:
          title: To
          description: The `To` header of the email, the recipients.
          type: string
        CamelGoogleMailStreamFrom:
          title: From
          description: The `From` header of the email, the sender.
          type: string
        CamelGoogleMailStreamCc:
          title: Cc
          description: The `Cc` header of the email, the recipients in copy.
          type: string
        CamelGoogleMailStreamBcc:
          title: Bcc
          description: The `Bcc` header of the email, the hidden recipients.
          type: string
        CamelGoogleMailStreamSubject:
          title: Subject
          description: The subject of the email.
          type: string
      types:
        json:
          format: "application-json"
          description: Json representation of a Google Mail event object.
          mediaType: application/json
        cloudevents:
          format: "google-mail-stream:application-cloudevents"
          description: Output data type represents Google Mail Streams response as CloudEvent V1. The data type sets Camel specific CloudEvent headers on the exchange with respective data from the Mail and its derived object.
          headers:
            CamelCloudEventID:
              title: CloudEvent ID
              description: The Camel exchange id set as event id
              type: string
            CamelCloudEventType:
              title: CloudEvent Type
              description: The event type
              default: "org.apache.camel.event.google.mail.stream.consume"
              type: string
            CamelCloudEventSource:
              title: CloudEvent Source
              description: The event source. By default, the Mail From with prefix "google.mail.stream.".
              type: string
            CamelCloudEventSubject:
              title: CloudEvent Subject
              description: The event subject. The Calendar event type.
              type: string
            CamelCloudEventTime:
              title: CloudEvent Time
              description: The exchange creation timestamp as event time.
              type: string
  dependencies:
  - "camel:jackson3"
  - "camel:kamelet"
  - "camel:google-mail"
  template:
    from:
      uri: "google-mail-stream://{{index}}?accessToken=RAW({{?accessToken}})&applicationName={{applicationName}}&clientId=RAW({{?clientId}})&clientSecret=RAW({{?clientSecret}})&delay={{delay}}&delegate=RAW({{?delegate}})&labels={{?labels}}&markAsRead={{markAsRead}}&maxResults={{?maxResults}}&query={{query}}&raw={{?raw}}&refreshToken=RAW({{?refreshToken}})&scopes={{?scopes}}&serviceAccountKey=RAW({{?serviceAccountKey}})"
      steps:
        - to:
            uri: kamelet:sink
