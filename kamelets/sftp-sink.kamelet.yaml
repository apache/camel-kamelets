apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: sftp-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "FTP"
    camel.apache.org/kamelet.namespace: "File"
  labels:
    camel.apache.org/kamelet.type: "sink"
spec:
  definition:
    title: "SFTP Sink"
    description: |-
      Uploads each message as a file to a directory on an SFTP server, which transfers files over an encrypted SSH connection.

      Use it to deliver exports, reports or data files to a server you reach with SSH, such as the SFTP drop box of a partner. For an FTP server use `ftp-sink` or `ftps-sink`.

      Input: the body is the content of the file, as text, bytes or a stream. The name of the file comes from the `file` header, or from `ce-file` when `file` is not set; any directory in it is dropped, so `reports/data.csv` is written as `data.csv`. Without these headers, `CamelFileName` is used as it is, subdirectories included, and without any of them a unique name is generated.

      Output: the message is unchanged. The `CamelFileNameProduced` header is set to the path of the file on the server.

      Good to know: a file with the same name is replaced, unless `fileExist` says otherwise. A file is uploaded under its real name from the start, so a reader that polls the directory can pick it up half-written. To prevent that, set `tempPrefix` to upload it under a temporary name and rename it once it is complete, or `doneFileName` to write an empty done file next to it once it is complete. Log in with `username` and either `password` or a private key. The key of the server must be in a known_hosts file, `knownHostsUri` or else `~/.ssh/known_hosts` of the user that runs the integration, or the connection fails. A file name that points outside `directoryName` fails the message.
    required:
      - connectionHost
      - connectionPort
      - directoryName
    type: object
    properties:
      connectionHost:
        title: Connection Host
        description: The host name or IP address of the SFTP server, without `sftp://` and without a port.
        type: string
        example: sftp.example.com
      connectionPort:
        title: Connection Port
        description: The port of the SFTP server, which is its SSH port, usually 22.
        type: string
        default: 22
      username:
        title: Username
        description: The user to log in to the SFTP server as.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      password:
        title: Password
        description: The password of `username`. Leave it empty to log in with a private key instead, set in `privateKeyFile` or `privateKeyUri`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      directoryName:
        title: Directory Name
        description: The directory on the server to write the files to. A path without a leading `/` is relative to the home directory of the user. It is created when it does not exist, unless `autoCreate` is false.
        type: string
        example: upload/orders
      passiveMode:
        title: Passive Mode
        description: A setting of FTP that has no effect on SFTP. Leave it unset.
        type: boolean
        default: false
      fileExist:
        title: If File Exists
        description: What to do when a file with the same name is already in the directory. `Override` replaces it, `Append` adds the new content at its end, `Fail` fails the message, and `Ignore` keeps the old file and drops the new content without an error.
        type: string
        default: Override
        enum: ["Override", "Append", "Fail", "Ignore"]
      binary:
        title: Binary Mode
        description: A setting of FTP that has no effect on SFTP, which always transfers files byte for byte. Leave it unset.
        type: boolean
        default: false
      privateKeyFile:
        title: Private Key File
        description: The path of a private key file on the machine that runs the integration, to log in with instead of a password. The matching public key must be in the `authorized_keys` of `username` on the server.
        type: string
        example: /etc/sftp/keys/id_rsa
      privateKeyPassphrase:
        title: Private Key Passphrase
        description: The passphrase of the private key, when the key is protected with one.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      privateKeyUri:
        title: Private Key URI
        description: Where to load the private key from, instead of `privateKeyFile`. It starts with `file://` for a file, `classpath://` for a resource in the application, or `http://` or `https://`.
        type: string
        pattern: "^(http|https|file|classpath|ref|bean)://.*"
        example: file:///etc/sftp/keys/id_rsa
      strictHostKeyChecking:
        title: Strict Host Checking
        description: Whether the key of the server must be found in a known_hosts file. With `yes`, a server that is not in it is refused. With `no`, any server is accepted without checking its key, so someone in between could read the files and the password. `ask` is meant for interactive use.
        type: string
        enum: ["yes", "no", "ask"]
        default: "yes"
      knownHostsUri:
        title: Known Hosts URI
        description: The known_hosts file that holds the key of the server, starting with `file://`, `classpath://`, `http://` or `https://`. Its lines can be made with `ssh-keyscan`. When it is not set, `~/.ssh/known_hosts` of the user that runs the integration is used, unless `useUserKnownHostsFile` is false; set it when that file does not exist, for example in a container.
        type: string
        pattern: "^(http|https|file|classpath|ref|bean)://.*"
        example: file:///etc/sftp/known_hosts
      useUserKnownHostsFile:
        title: Use User Known Hosts File
        description: If true and `knownHostsUri` is not set, the key of the server is looked up in `~/.ssh/known_hosts` of the user that runs the integration.
        type: boolean
        default: true
      autoCreate:
        title: Autocreate Missing Directories
        description: If true, `directoryName`, and any subdirectory in the `CamelFileName` header, is created on the server when it does not exist.
        type: boolean
        default: true
      tempPrefix:
        title: Temporary Name Prefix
        description: A prefix for the name a file is uploaded under. Once the upload is complete, the file is renamed to its real name, so a reader that skips the names with this prefix never picks up a half-written file. `sftp-source`, like other readers built with Camel, skips the names that start with a dot, so a prefix such as `.tmp-`, which uploads `orders.csv` as `.tmp-orders.csv`, works with it as it is. A prefix that ends with `/`, such as `.inprogress/`, uploads the file into that subdirectory first, and the subdirectory is created when it does not exist, unless `autoCreate` is false. When it is not set, a file is uploaded under its real name from the start. With `fileExist` `Override`, a file of the same name is deleted when the upload starts, not when it ends. It cannot be combined with `fileExist` `Append`, and every message fails when both are set. `username` must be allowed to rename files.
        type: string
        example: ".tmp-"
      doneFileName:
        title: Done File Name
        description: The name of an empty file to write next to each file once the file is complete, so that a reader knows the file can be read. `$\{file:name}` stands for the name of the file and `$\{file:name.noext}` for the name without its extension, so `$\{file:name}.done` writes `orders.csv.done`, and `$\{file:name.noext}.ready` writes `orders.ready`. A fixed name, such as `ready`, is written again after each file. No other `$\{...}` is allowed, and with one the file is uploaded but then the message fails. With `tempPrefix`, the done file is written after the file has its real name. When it is not set, no done file is written.
        type: string
        example: "${file:name}.done"
      chmod:
        title: File Permissions
        description: The permissions to give each file once it is written, as three octal digits, such as `640` for read and write by the owner and read by the group. They are set on a file that already existed too. When it is not set, a new file gets the permissions the server gives it, usually `644`, and a file that already existed keeps its own.
        type: string
        pattern: "^[0-7]{3}$"
        example: "640"
      serverAliveInterval:
        title: Server Alive Interval
        description: How often to check, in milliseconds, that the server still answers while no data comes from it. When the server misses a check, the connection is closed, and the next message makes a new one. Use it to notice a lost connection soon, for example behind a firewall that drops idle connections. When it is not set, no checks are made.
        type: integer
        example: 30000
  dataTypes:
    in:
      headers:
        file:
          title: File Name
          description: The name of the file to write, such as `orders.csv`. Any directory in it is dropped.
          type: string
        ce-file:
          title: File Name (CloudEvents)
          description: The name of the file to write, used when `file` is not set. Any directory in it is dropped.
          type: string
        CamelFileName:
          title: Camel File Name
          description: The name of the file to write, used as it is, subdirectories included, when neither `file` nor `ce-file` is set.
          type: string
    out:
      headers:
        CamelFileNameProduced:
          title: File Written
          description: The path of the file that was written on the server, such as `upload/orders/orders.csv`.
          type: string
  dependencies:
    - "camel:ftp"
    - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[file]}"
                steps:
                  - setHeader:
                      name: CamelFileName
                      expression:
                        simple:
                          expression: "${header[file]}"
                  - setHeader:
                      name: CamelFileName
                      expression:
                        simple:
                          expression: "${file:onlyname}"
              - expression:
                  simple:
                    expression: "${header[ce-file]}"
                steps:
                  - setHeader:
                      name: CamelFileName
                      expression:
                        simple:
                          expression: "${header[ce-file]}"
                  - setHeader:
                      name: CamelFileName
                      expression:
                        simple:
                          expression: "${file:onlyname}"
        - to:
            uri: sftp
            parameters:
              host: "{{connectionHost}}"
              port: "{{connectionPort}}"
              directoryName: "{{directoryName}}"
              chmod: "{{?chmod}}"
              doneFileName: "RAW({{?doneFileName}})"
              autoCreate: "{{autoCreate}}"
              binary: "{{binary}}"
              fileExist: "{{fileExist}}"
              knownHostsUri: "RAW({{?knownHostsUri}})"
              passiveMode: "{{passiveMode}}"
              password: "RAW({{?password}})"
              privateKeyFile: "RAW({{?privateKeyFile}})"
              privateKeyPassphrase: "RAW({{?privateKeyPassphrase}})"
              privateKeyUri: "RAW({{?privateKeyUri}})"
              serverAliveInterval: "{{?serverAliveInterval}}"
              strictHostKeyChecking: "{{?strictHostKeyChecking}}"
              tempPrefix: "RAW({{?tempPrefix}})"
              useUserKnownHostsFile: "{{?useUserKnownHostsFile}}"
              username: "RAW({{?username}})"
