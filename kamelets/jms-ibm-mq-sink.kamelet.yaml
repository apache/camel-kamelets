apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: jms-ibm-mq-sink
  annotations:
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.group: "JMS"
    camel.apache.org/kamelet.namespace: "Messaging"
  labels:
    camel.apache.org/kamelet.type: "sink"
    camel.apache.org/kamelet.verified: "true"
    camel.apache.org/requires.runtime: camel-k
spec:
  definition:
    title: "JMS - IBM MQ Sink"
    description: |-
      Sends each message to a queue or a topic of an IBM MQ queue manager, through JMS.

      Use it to hand work or events to applications that read from IBM MQ, such as an existing enterprise or mainframe system. Use `jms-ibm-mq-source` to read from IBM MQ.

      Input: text is sent as a JMS text message, and bytes as a JMS bytes message; `jmsMessageType` sends text or bytes as the other kind. The headers of the message, except the Camel ones, are sent along as JMS properties of the message.

      Output: the message is unchanged, with the name of the queue or topic it was sent to in the `CamelJMSDestinationProduced` header.

      Good to know: the IBM MQ client library is not included, as its licence is not the Apache one: add `mvn:com.ibm.mq:com.ibm.mq.jakarta.client` with a version to the dependencies of the integration (Camel JBang adds it by itself). It connects as a client over the network, with no TLS unless `sslCipherSuite` is set; the trust store and the key store for TLS are those of the Java runtime (`javax.net.ssl.trustStore`, `javax.net.ssl.keyStore`). For a multi-instance queue manager, list its instances in `connectionNameList`. Messages go to a queue unless `destinationType` is `topic`, and a message sent to a topic reaches only the receivers subscribed at that moment. Messages are persistent, with priority 4, and never expire, unless `deliveryPersistent`, `priority` and `timeToLive` say otherwise. It does not wait for a reply, even when the incoming message expects one, as one from `webhook-source` does. Headers that start with `CamelJms` are removed from the message first, so they cannot change what the Kamelet does.
    required:
      - serverName
      - serverPort
      - destinationName
      - queueManager
      - channel
      - username
      - password
    type: object
    properties:
      serverName:
        title: "Server Host"
        description: "The host name or IP address of the IBM MQ server that runs the queue manager."
        example: "mq.example.com"
        type: string
      serverPort:
        title: "Server Port"
        description: "The port of the listener of the queue manager on the server. The IBM MQ default is 1414."
        type: integer
        default: 1414
      destinationType:
        title: "Queue or Topic"
        description: "Whether `destinationName` is a queue (`queue`) or a topic (`topic`). A queue keeps each message until one receiver takes it; a topic hands each message to every receiver subscribed at that moment."
        type: string
        default: queue
      destinationName:
        title: "Queue or Topic Name"
        description: "The name of the queue or topic to send the messages to, as defined in the queue manager."
        example: "DEV.QUEUE.1"
        type: string
      queueManager:
        title: "Queue Manager"
        description: "The name of the queue manager to connect to."
        example: "QM1"
        type: string
      channel:
        title: "Channel"
        description: "The name of the server-connection channel of the queue manager to connect through."
        example: "DEV.APP.SVRCONN"
        type: string
      clientId:
        title: "Client ID"
        description: "An optional JMS client ID for the connection, which names this application to the queue manager. Leave it empty unless your IBM MQ administrator asks for one."
        type: string
      username:
        title: "Username"
        description: "The user name to log in to the queue manager with."
        type: string
      password:
        title: "Password"
        description: "The password to log in to the queue manager with, for the user `username`."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      connectionNameList:
        title: "Connection Name List"
        description: "The addresses of the instances of a multi-instance queue manager, as `host(port)` separated by commas, such as `mq1.example.com(1414),mq2.example.com(1414)`. The client tries them in order and connects to the first that answers. `serverName` and `serverPort` take the place of the first address of the list, so set them to the first instance too. When it is not set, the client connects only to `serverName` and `serverPort`."
        type: string
        pattern: '^[^,()\s]+(\(\d+\))?(\s*,\s*[^,()\s]+(\(\d+\))?)*$'
        example: "mq1.example.com(1414),mq2.example.com(1414)"
      sslCipherSuite:
        title: "TLS Cipher Suite"
        description: "The TLS cipher suite to connect with, which must match the cipher spec of the channel on the queue manager, such as `TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256` for `ANY_TLS12_OR_HIGHER`. When it is set, the connection uses TLS; when it is not set, it does not. The certificate of the queue manager is checked against the trust store of the Java runtime, and a channel that asks for a client certificate gets one from its key store: set them with the Java system properties `javax.net.ssl.trustStore` and `javax.net.ssl.keyStore`, with their passwords. Camel's own TLS settings (`camel.ssl`) do not apply to IBM MQ."
        example: "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"
        type: string
      deliveryPersistent:
        title: "Persistent Delivery"
        description: "Whether the queue manager stores each message on disk, so that it survives a restart of the queue manager. False sends non-persistent messages, which are faster but lost when the queue manager stops. When it is not set, the messages are persistent."
        type: boolean
      timeToLive:
        title: "Time to Live"
        description: "How long each message may wait to be received, in milliseconds, such as 60000 for one minute. A message still waiting after that time expires: the queue manager does not deliver it, and removes it. When it is not set, the messages never expire."
        type: integer
        example: 60000
      priority:
        title: "Priority"
        description: "The JMS priority of each message, from 0 (lowest) to 9 (highest). Of the messages waiting on a queue, the queue manager delivers those with the highest priority first. When it is not set, 4."
        type: integer
        minimum: 0
        maximum: 9
        example: 7
      jmsMessageType:
        title: "JMS Message Type"
        description: "The kind of JMS message to send, whatever the body: `Text` sends a text message, and `Bytes` a bytes message, for a receiver that expects one kind. When it is not set, the kind follows the body: text is sent as a text message, and bytes as a bytes message."
        type: string
        enum: ["Text", "Bytes"]
  dataTypes:
    # No 'default:' here on purpose: the kind of the body picks the kind of JMS message (text or
    # bytes), and a default would send every message as one kind. See #3117.
    in:
      headers: {}
  dependencies:
  - "camel:jms"
  - "camel:kamelet"
  template:
    beans:
      - name: wmqConnectionFactory
        type: "#class:com.ibm.mq.jakarta.jms.MQConnectionFactory"
        properties:
          XMSC_WMQ_HOST_NAME: "{{serverName}}"
          XMSC_WMQ_PORT: "{{serverPort}}"
          XMSC_WMQ_CHANNEL: "{{channel}}"
          XMSC_WMQ_QUEUE_MANAGER: "{{queueManager}}"
          XMSC_WMQ_CONNECTION_MODE: "1"
          XMSC_USERID: "{{username}}"
          XMSC_PASSWORD: "{{password}}"
          XMSC_CLIENT_ID: "{{?clientId}}"
          XMSC_WMQ_SSL_CIPHER_SUITE: "{{?sslCipherSuite}}"
          XMSC_WMQ_CONNECTION_NAME_LIST: "{{?connectionNameList}}"
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: CamelJms*
        - to:
            uri: jms
            pattern: InOnly
            parameters:
              destinationType: "{{destinationType}}"
              destinationName: "{{destinationName}}"
              deliveryPersistent: "{{?deliveryPersistent}}"
              timeToLive: "{{?timeToLive}}"
              priority: "{{?priority}}"
              jmsMessageType: "{{?jmsMessageType}}"
              connectionFactory: "#bean:{{wmqConnectionFactory}}"
