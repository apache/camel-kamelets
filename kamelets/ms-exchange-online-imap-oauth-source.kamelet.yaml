apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: ms-exchange-online-imap-oauth-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Mail"
    camel.apache.org/kamelet.namespace: "Mail"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "Microsoft Exchange IMAP OAuth2 Source"
    description: |-
      Reads the unread emails in a folder of a Microsoft 365 (Exchange Online) mailbox over IMAP, by default the inbox, logging in with OAuth 2.0, and marks each email as read.

      Use it to process the email that arrives in a Microsoft 365 mailbox where login with a password is turned off, for example orders, invoices or support requests sent to a shared address. For other mail servers, use `mail-imap-source`.

      Output: the body is the text of the email. For an email with several parts, such as text and HTML or attachments, it is the content of the parts, which the next step reads as the text of the first part. The headers of the email, such as `Subject`, `From`, `To` and `Date`, are copied to the message.

      Good to know: it logs in as an application, not as a person: register an application in Microsoft Entra ID (formerly Azure Active Directory) with a client secret, and allow it to read the mailbox over IMAP. It gets a token when it starts, so with wrong credentials, such as an unknown tenant ID, the integration does not start. By default it reads the `INBOX` folder, emails stay in the folder, marked as read, and emails that are already read are skipped. Set `delete` or `moveTo` to remove the emails once they are processed, `unseen` to false to read the emails that are already read too, and the search options, such as `searchFrom` or `searchSubject`, to read only some emails; an email must match every search option that is set. An email whose processing fails stays unread and is read again at the next check. An email that cannot be read at all, such as one with a broken format, fails every check of the mailbox until it is removed, unless `skipFailedMessage` is true. It connects over TLS, and checks for new email once a minute by default (`delay`).
    required:
      - tenantId
      - clientId
      - clientSecret
      - username
    type: object
    properties:
      connectionHost:
        title: Connection Host
        description: The host name of the IMAP server. The default is the IMAP server of Microsoft 365.
        type: string
        default: outlook.office365.com
      connectionPort:
        title: Connection Port
        description: The port of the IMAP server for TLS connections (IMAPS).
        type: string
        default: 993
      tenantId:
        title: Tenant ID
        description: The ID of your Microsoft Entra ID tenant (directory), a GUID shown as Directory (tenant) ID on the overview page of the app registration in the Azure portal.
        type: string
        example: 11111111-2222-3333-4444-555555555555
      clientId:
        title: Client ID
        description: The Application (client) ID of the app registration, a GUID shown on its overview page in the Azure portal.
        type: string
        x-descriptors:
          - urn:camel:group:credentials
      clientSecret:
        title: Client Secret
        description: A client secret of the app registration, made under Certificates and secrets in the Azure portal. Use the value of the secret, not its ID.
        type: string
        format: password
        x-descriptors:
          - urn:camel:group:credentials
      username:
        title: Username
        description: The email address of the mailbox to read.
        type: string
        example: orders@example.com
        x-descriptors:
          - urn:camel:group:credentials
      fetchSize:
        title: Fetch Size
        description: The most emails to read at each check of the mailbox. Use -1 for no limit.
        type: integer
        default: 10
      delay:
        title: Delay
        description: How long to wait between two checks of the mailbox, in milliseconds. The default, 60000, is one minute.
        type: integer
        default: 60000
      folderName:
        title: Folder Name
        description: The folder to read the emails from. When it is not set, the Kamelet reads the `INBOX` folder. A subfolder is written with the separator of the server, usually `/` or `.`, such as `INBOX/Orders`. When the folder does not exist, each check of the mailbox fails with a warning in the log.
        type: string
        example: INBOX/Orders
        pattern: "^[^\\r\\n%*]+$"
      unseen:
        title: Unread Only
        description: Whether to read only the emails that are not marked as read. When it is not set, only unread emails are read. When false, the emails that are already read are read too; without `delete` or `moveTo`, every email in the folder is then read again at each check.
        type: boolean
      delete:
        title: Delete
        description: Whether to delete each email from the folder once it is processed. When it is not set, emails stay in the folder, marked as read. An email whose processing fails is not deleted.
        type: boolean
      moveTo:
        title: Move To
        description: The folder to move each email to once it is processed, such as `Processed`. The folder is created when it does not exist. The email is then no longer in the folder that is read. An email whose processing fails is not moved.
        type: string
        example: Processed
        pattern: "^[^\\r\\n%*]+$"
      copyTo:
        title: Copy To
        description: The folder to copy each email to once it is processed, such as `Archive`. The folder is created when it does not exist. The email also stays in the folder that is read, and the copy is not marked as read. An email whose processing fails is not copied.
        type: string
        example: Archive
        pattern: "^[^\\r\\n%*]+$"
      peek:
        title: Peek
        description: Whether to keep an email unread while it is processed, so that an email whose processing fails stays unread and is read again at the next check. When it is not set, this is on. When false, an email is marked as read as soon as it is read, and an email whose processing fails is not read again.
        type: boolean
      skipFailedMessage:
        title: Skip Failed Email
        description: Whether to skip an email that cannot be read at all, such as one with a broken format, and go on with the other emails. When it is not set, such an email fails the whole check of the mailbox, again at each check, and no email is read until it is removed from the folder. A skipped email stays in the folder, unread, and no error is logged.
        type: boolean
      searchFrom:
        title: Search From
        description: Read only the emails whose sender contains this text, such as `billing@supplier.example`. Upper and lower case are the same. The mail server does the search, and some servers match only a whole address, so give the whole address to be safe.
        type: string
        example: billing@supplier.example
        pattern: "^[^\\r\\n]+$"
      searchTo:
        title: Search To
        description: Read only the emails whose `To` recipients contain this text, such as an address. The copy recipients (`Cc`) are not searched. Upper and lower case are the same. The mail server does the search, and some servers match only a whole address, so give the whole address to be safe.
        type: string
        example: orders@example.com
        pattern: "^[^\\r\\n]+$"
      searchSubject:
        title: Search Subject
        description: Read only the emails whose subject contains this text, such as `invoice`. Upper and lower case are the same.
        type: string
        example: invoice
        pattern: "^[^\\r\\n]+$"
      searchSubjectOrBody:
        title: Search Subject or Body
        description: Read only the emails whose subject or text contains this text, such as `refund`. Upper and lower case are the same.
        type: string
        example: refund
        pattern: "^[^\\r\\n]+$"
  dataTypes:
    out:
      headers:
        Subject:
          title: Subject
          description: The subject of the email.
          type: string
        From:
          title: From
          description: The sender of the email.
          type: string
        To:
          title: To
          description: The recipients of the email, separated by commas.
          type: string
  dependencies:
    - "camel:kamelet"
    - "camel:mail-microsoft-oauth"
    - "camel:mail"
  template:
    beans:
      - name: exchangeAuthenticator
        type: "#class:org.apache.camel.component.mail.microsoft.authenticator.MicrosoftExchangeOnlineOAuth2MailAuthenticator({{tenantId}}, {{clientId}}, {{clientSecret}}, {{username}})"
    from:
      uri: imaps
      parameters:
        host: "{{connectionHost}}"
        port: "{{connectionPort}}"
        authenticator: "#bean:{{exchangeAuthenticator}}"
        delay: "{{delay}}"
        fetchSize: "{{fetchSize}}"
        mail.imaps.auth.mechanisms: XOAUTH2
        username: "RAW({{username}})"
        folderName: "RAW({{?folderName}})"
        unseen: "{{?unseen}}"
        delete: "{{?delete}}"
        moveTo: "RAW({{?moveTo}})"
        copyTo: "RAW({{?copyTo}})"
        peek: "{{?peek}}"
        skipFailedMessage: "{{?skipFailedMessage}}"
        # With a search, the component takes unseen from the search, so
        # pass it there too.
        searchTerm.unseen: "{{?unseen}}"
        searchTerm.from: "RAW({{?searchFrom}})"
        searchTerm.to: "RAW({{?searchTo}})"
        searchTerm.subject: "RAW({{?searchSubject}})"
        searchTerm.subjectOrBody: "RAW({{?searchSubjectOrBody}})"
      steps:
        - to:
            uri: kamelet:sink
