apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: google-storage-event-based-source
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Google Storage Event-based"
    camel.apache.org/kamelet.namespace: "GCP"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "Google Storage Event-based Source"
    description: |-
      Receives the change notifications of a Google Cloud Storage bucket from a Pub/Sub subscription, one message per change, and can download each new file.

      Use it to react as soon as a file is uploaded to, changed in or deleted from a bucket, without reading the whole bucket over and over. It needs a Pub/Sub notification on the bucket, created for example with `gcloud storage buckets notifications create gs://my-bucket --topic=my-topic`, and a subscription on that topic. To read and delete the files of a bucket instead, use `google-storage-source`.

      Output: by default, the body is the notification as JSON text (bytes): the metadata of the file, such as its name, size and content type. The `eventType` header says what happened (`OBJECT_FINALIZE` for a new or replaced file, `OBJECT_DELETE` for a deleted one), and the `objectId` and `bucketId` headers give the name of the file and of its bucket. With `getObject` set to true, the body of a new file in `bucketNameOrArn` is the content of the file, as bytes, with the `CamelGoogleCloudStorage...` headers of the file.

      Good to know: every notification of the subscription comes out, also for other events and other buckets; `bucketNameOrArn` is only used to choose which new files to download. Downloading does not delete the file. A notification whose processing fails is not acknowledged, so Pub/Sub delivers it again. With `ackMode` `NONE`, the route acknowledges each notification itself, through the `CamelGooglePubsubAcknowledge` header. On a subscription with a dead-letter topic, `maxDeliveryAttempts` stops a notification that keeps failing from being processed again.
    required:
      - projectId
      - subscriptionName
      - serviceAccountKey
      - bucketNameOrArn
    type: object
    properties:
      projectId:
        title: Project ID
        description: The ID of the Google Cloud project that holds the subscription, as shown in the Google Cloud console. It is the project ID, not the project name or number.
        type: string
        example: my-project-123
      subscriptionName:
        title: Subscription Name
        description: The name of the Pub/Sub subscription that receives the notifications of the bucket, without the `projects/.../subscriptions/` part.
        type: string
        example: bucket-events-sub
      serviceAccountKey:
        title: Service Account Key
        description: "The JSON key of a service account that may read the subscription (and, with `getObject`, the files of the bucket), encoded in Base64: create the key in the Google Cloud console under IAM & Admin > Service Accounts > Keys, then encode the downloaded file, for example with `base64 -w0 key.json`."
        type: binary
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      synchronousPull:
        title: Synchronous Pull
        description: If true, it asks Pub/Sub for notifications in batches of up to `maxMessagesPerPoll`, instead of keeping a stream open that Pub/Sub pushes them through.
        type: boolean
        default: false
      maxMessagesPerPoll:
        title: Max Messages Per Poll
        description: The most notifications to ask Pub/Sub for at once. Only used when `synchronousPull` is true.
        type: integer
        default: 1
      concurrentConsumers:
        title: Concurrent Consumers
        description: How many notifications to receive and process in parallel, each in its own stream from the subscription.
        type: integer
        default: 1
      bucketNameOrArn:
        title: Bucket Name
        description: The name of the bucket whose new files are downloaded when `getObject` is true, without `gs://`. Notifications of other buckets come out unchanged.
        type: string
        example: my-bucket
      getObject:
        title: Get Object in Bucket
        description: If true, the body of a notification for a new or replaced file (`OBJECT_FINALIZE`) in `bucketNameOrArn` is replaced by the content of the file. If false, the body is the notification itself.
        type: boolean
        default: false
      ackMode:
        title: Acknowledge Mode
        description: "When a notification is acknowledged. `AUTO`: once it has been processed; a notification whose processing fails is given back (nack), so that Pub/Sub delivers it again. `NONE`: never by the Kamelet; the route acknowledges each notification itself, for example with the Simple expression `${header.CamelGooglePubsubAcknowledge.ack($\\{exchange})}`, or gives it back with `nack`. A notification that is not acknowledged is delivered again: with `synchronousPull`, once the acknowledgement deadline of the subscription has passed; otherwise only after an hour, for which its deadline is extended. When it is not set, it is `AUTO`."
        type: string
        enum: ["AUTO", "NONE"]
      maxDeliveryAttempts:
        title: Max Delivery Attempts
        description: A notification that Pub/Sub has delivered this many times is given back (nack) without being processed. Pub/Sub delivers it again until the maximum of delivery attempts of the subscription is reached, and then moves it to the dead-letter topic. Pub/Sub only counts the deliveries on a subscription with a dead-letter topic; on another subscription, this option does nothing. When it is not set, the maximum of the dead-letter policy of the subscription is read when the Kamelet starts, which needs the permission `pubsub.subscriptions.get`; when it cannot be read, a warning is logged and there is no limit. Set it to 0 for no limit.
        type: integer
        example: 5
  dataTypes:
    out:
      headers:
        eventType:
          title: Event Type
          description: What happened to the file, such as `OBJECT_FINALIZE` for a new or replaced file, `OBJECT_DELETE` for a deleted one, or `OBJECT_METADATA_UPDATE`.
          type: string
        objectId:
          title: Object Name
          description: The name of the file in the bucket, with its folders, such as `inbox/orders.csv`.
          type: string
        bucketId:
          title: Bucket Name
          description: The name of the bucket of the file.
          type: string
        CamelGooglePubsubAttributes:
          title: Attributes
          description: All the attributes of the notification, as a Map, such as `eventType`, `objectId`, `bucketId` and `objectGeneration`.
          type: object
        CamelGooglePubsubMessageId:
          title: Message ID
          description: The ID of the Pub/Sub message of the notification.
          type: string
        CamelGooglePubsubDeliveryAttempt:
          title: Delivery Attempt
          description: How many times Pub/Sub has delivered the notification, 1 the first time. Only set on a subscription with a dead-letter topic.
          type: integer
        CamelGooglePubsubAcknowledge:
          title: Acknowledge
          description: Only with `ackMode` `NONE`. The object to acknowledge the notification with, by calling its `ack(exchange)` method, or to give it back with `nack(exchange)`.
          type: object
  dependencies:
    - "camel:kamelet"
    - "camel:google-pubsub"
    - "camel:google-storage"
    - "camel:jackson3"
  template:
    from:
      uri: "google-pubsub://{{projectId}}:{{subscriptionName}}?ackMode={{?ackMode}}&concurrentConsumers={{concurrentConsumers}}&maxDeliveryAttempts={{?maxDeliveryAttempts}}&maxMessagesPerPoll={{maxMessagesPerPoll}}&serviceAccountKey=base64:{{serviceAccountKey}}&synchronousPull={{synchronousPull}}"
      steps:
        - choice:
            precondition: true
            when:
              - expression:
                  simple:
                    expression: "${properties:getObject:false}"
                steps:
                  - setProperty:
                      name: google-storage-event-type
                      expression:
                        simple:
                          expression: "${headers.CamelGooglePubsubAttributes[eventType]}"
                  - setProperty:
                      name: google-storage-object-id
                      expression:
                        simple:
                          expression: "${headers.CamelGooglePubsubAttributes[objectId]}"
                  - setProperty:
                      name: google-storage-bucket-id
                      expression:
                        simple:
                          expression: "${headers.CamelGooglePubsubAttributes[bucketId]}"
                  - choice:
                      when:
                        - expression:
                            simple:
                              expression: "${exchangeProperty.google-storage-event-type} == \"OBJECT_FINALIZE\" && ${exchangeProperty.google-storage-bucket-id} == \"{{bucketNameOrArn}}\""
                          steps:
                            - toD:
                                uri: google-storage
                                parameters:
                                  bucketName: "{{bucketNameOrArn}}"
                                  objectName: "${exchangeProperty.google-storage-object-id}"
                                  operation: getObject
                                  serviceAccountKey: "base64:{{serviceAccountKey}}"
        - to:
            uri: kamelet:sink
