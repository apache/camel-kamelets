apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: fhir-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "FHIR"
    camel.apache.org/kamelet.namespace: "API"
  labels:
    camel.apache.org/kamelet.type: "sink"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "FHIR Sink"
    description: |-
      Sends each message, a FHIR resource such as a Patient or an Observation, to a FHIR server of healthcare data, to create, update, delete or validate it there.

      Use it to write healthcare records into a FHIR server, for example to create a Patient for each new admission, or to update an Observation that a device measured. To read resources from a FHIR server, use `fhir-source`.

      Input: the body is the FHIR resource, as JSON text, or as XML text with `encoding` set to `XML`, such as `{"resourceType": "Patient", "name": [{"family": "Doe"}]}`. It is sent with the operation set by `apiName` and `methodName`, which must be one that takes a resource: `CREATE` with `resource`, `UPDATE` with `resource`, `DELETE` with `resource`, or `VALIDATE` with `resource`.

      Output: when it is used inside a route, the body afterwards is the outcome of the operation, as a Java object of the HAPI FHIR library, with the id of the resource; it is not JSON.

      Good to know: a body that is not a valid FHIR resource of the chosen `fhirVersion` fails the message. Operations that do not take a resource, such as `READ` or `SEARCH`, fail. Headers that start with `CamelFhir` are removed from the message first, so they cannot change what the Kamelet does. Before the first message, it reads the capability statement of the server at `/metadata`, unless `validationMode` is `NEVER`. A server that does not answer within `connectionTimeout` and `socketTimeout`, 10 seconds each when they are not set, fails the message.
    required:
    - serverUrl
    - apiName
    - methodName
    type: object
    properties:
      apiName:
        title: API Name
        description: "The kind of operation, such as `CREATE` to add a new resource or `UPDATE` to change an existing one. Use one that takes a resource as input: `CREATE`, `UPDATE`, `DELETE` or `VALIDATE`."
        type: string
        enum:  ["CAPABILITIES", "CREATE", "DELETE", "HISTORY", "LOAD_PAGE", "META", "OPERATION", "PATCH", "READ", "SEARCH", "TRANSACTION", "UPDATE", "VALIDATE"]
      methodName:
        title: Method Name
        description: "The variant of the operation in `apiName`. Use `resource`, which takes the resource in the body."
        type: string
        example: resource
      encoding:
        title: Encoding
        description: "How the resources are written: `JSON` or `XML`. The body must be in this format."
        type: string
        default: "JSON"
        example: XML
      fhirVersion:
        title: FHIR Version
        description: "The version of the FHIR standard that the server and the resources use. Most servers today use `R4`."
        type: string
        enum:  ["DSTU2", "DSTU2_HL7ORG", "DSTU2_1", "DSTU3", "R4", "R5"]
        default: "R4"
      log:
        title: Log
        description: "If true, every request to the server and every response is written to the log, for troubleshooting."
        type: boolean
        default: false
      prettyPrint:
        title: Pretty Print
        description: "If true, the resources sent to the server are indented, which is easier to read in logs."
        type: boolean
        default: false
      serverUrl:
        title: Server URL
        description: The base address of the FHIR API of the server, the part before the resource type, starting with `http://` or `https://`.
        type: string
        example: "https://fhir.example.com/fhir"
      lazyStart:
        title: Lazy Start
        description: "If true, the connection to the server is set up at the first message instead of when the integration starts, so that the integration can start while the server is not reachable. The first message then takes a little longer."
        type: boolean
        default: false
      connectionTimeout:
        title: Connection Timeout
        description: How long to wait for the connection to the server to be set up, in milliseconds. When it is not set, it is 10000 (10 seconds). A server that cannot be reached in time fails the message.
        type: integer
        example: 5000
      socketTimeout:
        title: Socket Timeout
        description: How long to wait for the answer of the server to a request, in milliseconds. When it is not set, it is 10000 (10 seconds). A server that does not answer in time fails the message, so raise it for a slow server.
        type: integer
        example: 60000
      compress:
        title: Compress
        description: If true, the resource sent to the server is compressed with GZIP, with the header `Content-Encoding` set to `gzip`, which saves bandwidth for large resources. The server must accept GZIP requests.
        type: boolean
        example: true
      summary:
        title: Summary
        description: Asks the server to answer with a short form of the resource, with the FHIR `_summary` parameter on every request, such as `TRUE` for the summary elements only, or `DATA` for all but the text. The server still stores the whole resource; only the answer, the body afterwards, is shorter. When it is not set, the server answers in full.
        type: string
        enum: ["COUNT", "TEXT", "DATA", "TRUE", "FALSE"]
      validationMode:
        title: Validation Mode
        description: Whether the capability statement of the server, at `/metadata`, is read before the first message. With `ONCE`, a server that does not answer it fails the message; `NEVER` does not read it, for a server without `/metadata`. When it is not set, it is `ONCE`.
        type: string
        enum: ["NEVER", "ONCE"]
      proxyHost:
        title: Proxy Host
        description: The host name of an HTTP proxy to reach the server through. Use it with `proxyPort`.
        type: string
        example: proxy.example.com
      proxyPassword:
        title: Proxy Password
        description: The password of `proxyUser` for the HTTP proxy.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      proxyPort:
        title: Proxy Port
        description: The port of the HTTP proxy in `proxyHost`.
        type: integer
        example: 3128
      proxyUser:
        title: Proxy User
        description: The user to log in to the HTTP proxy as, when the proxy needs a login.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      accessToken:
        title: Access Token
        description: An OAuth access token, sent as a Bearer token, for a server that uses OAuth, such as SMART on FHIR. Use it instead of `username` and `password`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      username:
        title: Username
        description: The user to log in to the server as, with Basic authentication. Leave it out for a server without login.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      password:
        title: Password
        description: The password of `username`, for Basic authentication.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
  dataTypes:
    # No 'default:' here on purpose: `encoding` decides whether the resource is JSON or XML text. See
    # #3117.
    in:
      headers: {}
  dependencies:
  - "camel:fhir"
  - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: CamelFhir*
        - choice:
            precondition: true
            when:
              - expression:
                  simple:
                    expression: "${properties:encoding} =~ 'JSON'"
                steps:
                  - unmarshal:
                      fhirJson:
                        prettyPrint: "{{prettyPrint}}"
                        fhirVersion: "{{fhirVersion}}"
              - expression:
                  simple:
                    expression: "${properties:encoding} =~ 'XML'"
                steps:
                  - unmarshal:
                      fhirXml:
                        prettyPrint: "{{prettyPrint}}"
                        fhirVersion: "{{fhirVersion}}"
        - to:
            uri: "fhir://{{apiName}}/{{methodName}}?accessToken=RAW({{?accessToken}})&compress={{?compress}}&connectionTimeout={{?connectionTimeout}}&encoding={{encoding}}&fhirVersion={{fhirVersion}}&inBody=resource&lazyStartProducer={{lazyStart}}&log={{log}}&password=RAW({{?password}})&prettyPrint={{prettyPrint}}&proxyHost={{?proxyHost}}&proxyPassword=RAW({{?proxyPassword}})&proxyPort={{?proxyPort}}&proxyUser=RAW({{?proxyUser}})&serverUrl={{serverUrl}}&socketTimeout={{?socketTimeout}}&summary={{?summary}}&username=RAW({{?username}})&validationMode={{?validationMode}}"
