apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: timestamp-router-action
  labels:
    camel.apache.org/kamelet.type: "action"
    camel.apache.org/kamelet.verified: "true"
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Actions"
    camel.apache.org/kamelet.namespace: "Kafka"
spec:
  definition:
    title: "Timestamp Router Action"
    description: |-
      Changes the topic that `kafka-sink` writes a record to, to a name made of the original topic name and the date of the record, such as `orders-20240703`.

      Use it to spread the records over one topic per day or per month, in a flow from `kafka-source` to `kafka-sink`, for example to keep or delete them by period. To take the date from a field of a JSON body instead use `message-timestamp-router-action`.

      Input: a message from `kafka-source`, with the name of the topic in the `CamelKafkaTopic` header and the time of the record, in milliseconds since 1970, in the `CamelKafkaTimestamp` header. `topicHeaderName` and `timestampHeaderName` choose other headers.

      Output: the same body. The `CamelKafkaOverrideTopic` header is set to the new name, and `kafka-sink` writes the record to that topic instead of its own `topic`.

      Good to know: the default `topicFormat` of `topic-$[timestamp]` gives names such as `topic-20240703`, without the original name: set it to `$[topic]-$[timestamp]` to keep it. The date is in UTC. Without a time header, nothing changes.
    properties:
      topicFormat:
        title: Topic Format
        description: "The name of the new topic. `$[topic]` is replaced by the name of the original topic, and `$[timestamp]` by the time, written with `timestampFormat`. The default writes to topics named `topic-` and the date, without the original name."
        type: string
        default: "topic-$[timestamp]"
        example: "$[topic]-$[timestamp]"
      timestampFormat:
        title: Timestamp Format
        description: "How to write the time in the topic name, as a Java `SimpleDateFormat` pattern, in UTC: `yyyyMMdd` gives `20240703`, and `yyyy-MM` gives `2024-07`."
        type: string
        default: "yyyyMMdd"
        example: "yyyy-MM-dd"
      timestampHeaderName:
        title: Timestamp Header Name
        description: "The header that holds the time of the record, in milliseconds since 1970, as a number or as text. `kafka-source` sets `CamelKafkaTimestamp`."
        type: string
        default: "CamelKafkaTimestamp"
        example: "kafka-timestamp"
      topicHeaderName:
        title: Topic Header Name
        description: "The header that holds the name of the original topic. When it is not set, `CamelKafkaTopic`, which `kafka-source` sets, is used."
        type: string
        example: "kafka-topic"
    type: object
  dataTypes:
    in:
      headers:
        CamelKafkaTopic:
          title: Kafka Topic
          description: "The topic the record was read from, as `kafka-source` sets it."
          type: string
        CamelKafkaTimestamp:
          title: Kafka Timestamp
          description: "The time of the record, in milliseconds since 1970, as `kafka-source` sets it. Without it, nothing changes."
          type: integer
    out:
      headers:
        CamelKafkaOverrideTopic:
          title: Kafka Override Topic
          description: "The new topic, which `kafka-sink` writes the record to instead of its own `topic`."
          type: string
  dependencies:
  - "camel:kamelet"
  - "camel:kafka"
  template:
    from:
      uri: kamelet:source
      steps:
        - setProperty:
            name: topicFormat
            expression:
              constant:
                expression: "{{topicFormat}}"
        - setProperty:
            name: timestampFormat
            expression:
              constant:
                expression: "{{timestampFormat}}"
        - setProperty:
            name: timestampHeaderName
            expression:
              constant:
                expression: "{{timestampHeaderName}}"
        - setProperty:
            name: topicHeaderName
            expression:
              constant:
                expression: "{{?topicHeaderName}}"
        - bean:
            ref: org.apache.camel.component.kafka.transform.TimestampRouter
