apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: google-storage-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Google Storage"
    camel.apache.org/kamelet.namespace: "GCP"
  labels:
    camel.apache.org/kamelet.type: "sink"
spec:
  definition:
    title: "Google Storage Sink"
    description: |-
      Uploads each message as a file (object) to a Google Cloud Storage bucket.

      Use it to store data for later use or for other systems, such as exported reports, archived events or files received from another system. To read the files of a bucket, use `google-storage-source`.

      Input: the body is the content of the file, as text, bytes, a stream or a file. Text is turned into bytes before the upload, and the `Content-Type` header is set to `application/octet-stream`. A file is passed on as it is, and so is a stream, unless stream caching is turned off. Turn structured data such as a Map into JSON text first, for example with `json-serialize-action`. The optional `file` header (or `ce-file`) is the name of the file in the bucket, with its folders, such as `reports/2024-06-01.csv`; without it, the file gets a generated unique name.

      Output: when it is used inside a route, the body afterwards describes the uploaded file (its bucket, name, size and generation), not its content, the `Content-Type` header is `application/octet-stream`, and the `CamelGoogleCloudStorageObjectName` header holds the name of the file.

      Good to know: a file with the same name is overwritten. With `objectName`, every message overwrites the same file. The bucket must exist, unless `autoCreateBucket` is true; a bucket it creates is in `storageLocation`, `US-EAST1` when that is not set. Without `serviceAccountKey`, it logs in with the Application Default Credentials of the environment where it runs, or with Workload Identity Federation when `useWorkloadIdentityFederation` is true. Headers that start with `CamelGoogleCloudStorage` are removed from the message first, so they cannot change what the Kamelet does.
    required:
      - bucketNameOrArn
    type: object
    properties:
      bucketNameOrArn:
        title: Bucket Name
        description: The name of the bucket to upload the files to, without `gs://`.
        type: string
        example: my-bucket
      serviceAccountKey:
        title: Service Account Key
        description: "The JSON key of a service account that may write to the bucket, encoded in Base64: create the key in the Google Cloud console under IAM & Admin > Service Accounts > Keys, then encode the downloaded file, for example with `base64 -w0 key.json`. When it is not set, the Application Default Credentials are used: the key file named in the `GOOGLE_APPLICATION_CREDENTIALS` environment variable, or the service account of the Google Cloud machine it runs on."
        type: binary
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      autoCreateBucket:
        title: Autocreate Bucket
        description: If true, the bucket is created when it does not exist yet. The service account then needs the permission to create buckets in the project.
        type: boolean
        default: false
      objectName:
        title: Object Name
        description: The name of the file in the bucket, with its folders, such as `status/latest.json`. When it is set, every message is written to that file, whatever the `file` and `ce-file` headers say.
        type: string
        example: status/latest.json
        pattern: "^[^\\r\\n]+$"
      storageLocation:
        title: Storage Location
        description: The location of the bucket that `autoCreateBucket` creates, such as a region (`europe-west1`) or a multi-region (`EU`). Only used when the bucket is created. When it is not set, it is `US-EAST1`.
        type: string
        example: EU
        pattern: "^[A-Za-z0-9-]+$"
      useWorkloadIdentityFederation:
        title: Use Workload Identity Federation
        description: If true, it logs in with Workload Identity Federation instead of `serviceAccountKey`, which is then ignored. It uses the credential configuration file in `workloadIdentityConfig` or, when that is not set, the Application Default Credentials. When it is not set, it is false.
        type: boolean
      workloadIdentityConfig:
        title: Workload Identity Configuration
        description: "Where to load the Workload Identity Federation credential configuration file from: the JSON file of type `external_account` that `gcloud iam workload-identity-pools create-cred-config` creates, which tells how to exchange a token of another identity provider, such as AWS, Azure or Kubernetes, for Google credentials. Prefix the path with `file:`, `classpath:`, `http:` or `https:`. Only used when `useWorkloadIdentityFederation` is true."
        type: string
        example: "file:/var/run/secrets/gcp/credential-config.json"
        pattern: "^(file|classpath|http|https):.+$"
      impersonatedServiceAccount:
        title: Impersonated Service Account
        description: The email of a service account to act as, with the credentials of Workload Identity Federation, so that the Kamelet gets the permissions of that service account. The federated identity needs the Service Account Token Creator role on it. Only used when `useWorkloadIdentityFederation` is true.
        type: string
        example: storage-writer@my-project-123.iam.gserviceaccount.com
        pattern: "^[^@\\s]+@[^@\\s]+$"
  dataTypes:
    in:
      default: binary
      types:
        binary:
          format: "application-octet-stream"
          description: "The content of the file, as bytes. A file, and a stream while stream caching is on, are passed on as they are."
          mediaType: application/octet-stream
      headers:
        file:
          title: File Name
          description: The name of the file in the bucket, with its folders, such as `reports/2024-06-01.csv`. When neither it nor `ce-file` is set, the file gets a generated unique name.
          type: string
        ce-file:
          title: File Name
          description: The name of the file in the bucket, as a CloudEvents extension. Used when `file` is not set.
          type: string
    out:
      headers:
        CamelGoogleCloudStorageObjectName:
          title: Object Name
          description: The name the file was uploaded with.
          type: string
  dependencies:
    - "camel:kamelet"
    - "camel:google-storage"
    - "camel:jackson3"
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: CamelGoogleCloudStorage*
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[file]}"
                steps:
                  - setHeader:
                      name: CamelGoogleCloudStorageObjectName
                      expression:
                        simple:
                          expression: "${header[file]}"
              - expression:
                  simple:
                    expression: "${header[ce-file]}"
                steps:
                  - setHeader:
                      name: CamelGoogleCloudStorageObjectName
                      expression:
                        simple:
                          expression: "${header[ce-file]}"
            otherwise:
              steps:
                - setHeader:
                    name: CamelGoogleCloudStorageObjectName
                    expression:
                      simple:
                        expression: "${exchangeId}"
        - to:
            uri: "google-storage://{{bucketNameOrArn}}?autoCreateBucket={{autoCreateBucket}}&impersonatedServiceAccount={{?impersonatedServiceAccount}}&objectName=RAW({{?objectName}})&serviceAccountKey=RAW(base64:{{?serviceAccountKey}})&storageLocation={{?storageLocation}}&useWorkloadIdentityFederation={{?useWorkloadIdentityFederation}}&workloadIdentityConfig={{?workloadIdentityConfig}}"
