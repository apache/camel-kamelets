apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: kafka-not-secured-apicurio-registry-json-source
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Kafka"
    camel.apache.org/kamelet.namespace: "Kafka"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "Kafka not secured with Apicurio Registry secured with Keycloak for JSON schema support Source"
    description: |-
      Receives each record written with a JSON Schema from topics in Apache Kafka, with the schema kept in an Apicurio Registry secured with Keycloak.

      Use it to read JSON records that other applications write with a JSON Schema of the registry, when the registry needs a Keycloak login and Kafka needs none. For Avro records use `kafka-not-secured-apicurio-registry-source`; when the registry needs no login use `kafka-apicurio-registry-not-secured-source`.

      Output: the body is the value of the record as parsed JSON. The `kafka-topic`, `kafka-key`, `kafka-partition`, `kafka-offset` and `kafka-timestamp` (in milliseconds since 1970) headers say where the record came from. They are also set as `ce-kafkatopic`, `ce-kafkakey` and so on, and as the `CamelKafka*` headers that the Kafka actions read. The record headers become message headers, as text unless `deserializeHeaders` is false.

      Good to know: Kafka is not secured: it connects to the brokers with no login and no TLS. A new consumer group starts at the newest records, unless `autoOffsetReset` is `earliest`. Without `consumerGroup`, every start uses a new group, so the records sent while the integration was stopped are skipped.
    required:
      - topic
      - bootstrapServers
      - apicurioRegistryUrl
      - apicurioAuthServiceUrl
      - apicurioAuthRealm
      - apicurioAuthClientId
      - apicurioAuthClientSecret
      - apicurioAuthUsername
      - apicurioAuthPassword
    type: object
    properties:
      topic:
        title: Topic Names
        description: "The topics to read from, separated by commas. When `topicIsPattern` is true, a regular expression that the names of the topics must match instead."
        type: string
        example: "orders"
      bootstrapServers:
        title: Bootstrap Servers
        description: "The address of one or more Kafka brokers to connect to first, as `host:port`, separated by commas. The other brokers of the cluster are found from them."
        type: string
        example: "broker1:9092,broker2:9092"
      autoCommitEnable:
        title: Auto Commit
        description: "If true, the position reached in each partition (the offset) is saved in Kafka automatically every 5 seconds, so that a restarted integration goes on from there. Set it to false together with `allowManualCommit` true to save the position yourself with `kafka-manual-commit-action`."
        type: boolean
        default: true
      allowManualCommit:
        title: Allow Manual Commit
        description: "If true, each message carries what `kafka-manual-commit-action` needs to save the position of its record in Kafka. Set `autoCommitEnable` to false too, or the position is also saved automatically."
        type: boolean
        default: false
      pollOnError:
        title: Poll On Error Behavior
        description: "What to do when reading from Kafka fails: `ERROR_HANDLER` logs the error and goes on with the next records, `DISCARD` skips the records that failed, `RECONNECT` connects again and retries, `RETRY` reads the same records again, and `STOP` stops reading until the integration is restarted."
        type: string
        default: "ERROR_HANDLER"
        enum: ["DISCARD", "ERROR_HANDLER", "RECONNECT", "RETRY", "STOP"]
      autoOffsetReset:
        title: Auto Offset Reset
        description: "Where to start when the consumer group has no saved position yet: `latest` reads only the records sent from now on, `earliest` reads all the records still in the topic, and `none` fails."
        type: string
        default: "latest"
        example: "earliest"
      consumerGroup:
        title: Consumer Group
        description: "The name of the consumer group. Integrations with the same group share the records of the topics between them, and the group remembers the position reached, so that a restarted integration goes on where it stopped. When it is not set, a new random group is used on every start."
        type: string
        example: "my-group-id"
      deserializeHeaders:
        title: Automatically Deserialize Headers
        description: "If true, the values of the record headers are turned into text. If false, they stay bytes."
        type: boolean
        default: true
      valueDeserializer:
        title: Value Deserializer
        description: "The Java class that turns the value of the record into the body. The default reads JSON checked against the JSON Schema from the registry. Change it only to use another deserializer of the Apicurio Registry library."
        type: string
        default: "io.apicurio.registry.serde.jsonschema.JsonSchemaKafkaDeserializer"
      apicurioRegistryUrl:
        title: Apicurio Registry URL
        description: "The URL of the API of the Apicurio Registry that holds the schemas, such as `http://registry:8080/apis/registry/v2`."
        type: string
        example: "http://registry.example.com:8080/apis/registry/v2"
      apicurioAuthServiceUrl:
        title: Keycloak URL
        description: "The URL of the Keycloak server that secures the registry."
        type: string
        example: "https://keycloak.example.com"
      apicurioAuthRealm:
        title: Keycloak Realm
        description: "The Keycloak realm in which the client and the user of the registry are defined."
        type: string
        example: "registry"
      apicurioAuthClientId:
        title: Keycloak Client ID
        description: "The ID of the Keycloak client that has access to the registry."
        type: string
      apicurioAuthClientSecret:
        title: Keycloak Client Secret
        description: "The secret of the Keycloak client `apicurioAuthClientId`, from the Credentials tab of the client in the Keycloak admin console."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      apicurioAuthUsername:
        title: Registry Username
        description: "The user name to log in to the registry with, through Keycloak."
        type: string
      apicurioAuthPassword:
        title: Registry Password
        description: "The password of `apicurioAuthUsername`."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      topicIsPattern:
        title: Topic Is Pattern
        description: "If true, `topic` is a regular expression, such as `orders-.*`, and the Kamelet reads from every topic whose name matches it."
        type: boolean
        default: false
  dataTypes:
    out:
      headers:
        kafka-topic:
          title: Kafka Topic
          description: "The topic the record was read from."
          type: string
        kafka-key:
          title: Kafka Key
          description: "The key of the record. Not set when the record has no key."
          type: string
        kafka-partition:
          title: Kafka Partition
          description: "The number of the partition the record was read from."
          type: integer
        kafka-offset:
          title: Kafka Offset
          description: "The position of the record in its partition."
          type: integer
        kafka-timestamp:
          title: Kafka Timestamp
          description: "The time of the record, in milliseconds since 1970-01-01 UTC."
          type: integer
        ce-kafkatopic:
          title: CloudEvents Kafka Topic
          description: "The same as `kafka-topic`."
          type: string
        ce-kafkakey:
          title: CloudEvents Kafka Key
          description: "The same as `kafka-key`."
          type: string
        ce-kafkapartition:
          title: CloudEvents Kafka Partition
          description: "The same as `kafka-partition`."
          type: integer
        ce-kafkaoffset:
          title: CloudEvents Kafka Offset
          description: "The same as `kafka-offset`."
          type: integer
        ce-kafkatimestamp:
          title: CloudEvents Kafka Timestamp
          description: "The same as `kafka-timestamp`."
          type: integer
  dependencies:
    - "camel:kafka"
    - "camel:kamelet"
    - "mvn:io.apicurio:apicurio-registry-serdes-jsonschema-serde:2.5.11.Final"
  template:
    beans:
      - name: kafkaHeaderDeserializer
        type: "#class:org.apache.camel.component.kafka.KafkaHeaderDeserializer"
        properties:
          enabled: "{{deserializeHeaders}}"
    from:
      uri: kafka
      parameters:
        topic: "{{topic}}"
        additionalProperties.apicurio.auth.client.id: "{{apicurioAuthClientId}}"
        additionalProperties.apicurio.auth.client.secret: "{{apicurioAuthClientSecret}}"
        additionalProperties.apicurio.auth.password: "{{apicurioAuthPassword}}"
        additionalProperties.apicurio.auth.realm: "{{apicurioAuthRealm}}"
        additionalProperties.apicurio.auth.service.url: "{{apicurioAuthServiceUrl}}"
        additionalProperties.apicurio.auth.username: "{{apicurioAuthUsername}}"
        additionalProperties.apicurio.registry.url: "{{apicurioRegistryUrl}}"
        allowManualCommit: "{{allowManualCommit}}"
        autoCommitEnable: "{{autoCommitEnable}}"
        autoOffsetReset: "{{autoOffsetReset}}"
        brokers: "{{bootstrapServers}}"
        groupId: "{{?consumerGroup}}"
        pollOnError: "{{pollOnError}}"
        topicIsPattern: "{{topicIsPattern}}"
        valueDeserializer: "{{valueDeserializer}}"
      steps:
        - process:
            ref: "{{kafkaHeaderDeserializer}}"
        # Kafka record metadata, surfaced under names that are not Camel
        # internals, so a downstream consumer does not have to depend on the
        # CamelKafka* headers. Plain form plus a CloudEvents one, as
        # infinispan-source and ftp-source do. The CamelKafka* headers are left
        # in place, so existing consumers are unaffected.
        - setHeader:
            name: kafka-topic
            expression:
              simple:
                expression: "${header[CamelKafkaTopic]}"
        - setHeader:
            name: ce-kafkatopic
            expression:
              simple:
                expression: "${header[CamelKafkaTopic]}"
        - setHeader:
            name: kafka-key
            expression:
              simple:
                expression: "${header[CamelKafkaKey]}"
        - setHeader:
            name: ce-kafkakey
            expression:
              simple:
                expression: "${header[CamelKafkaKey]}"
        - setHeader:
            name: kafka-partition
            expression:
              simple:
                expression: "${header[CamelKafkaPartition]}"
        - setHeader:
            name: ce-kafkapartition
            expression:
              simple:
                expression: "${header[CamelKafkaPartition]}"
        - setHeader:
            name: kafka-offset
            expression:
              simple:
                expression: "${header[CamelKafkaOffset]}"
        - setHeader:
            name: ce-kafkaoffset
            expression:
              simple:
                expression: "${header[CamelKafkaOffset]}"
        - setHeader:
            name: kafka-timestamp
            expression:
              simple:
                expression: "${header[CamelKafkaTimestamp]}"
        - setHeader:
            name: ce-kafkatimestamp
            expression:
              simple:
                expression: "${header[CamelKafkaTimestamp]}"
        - to:
            uri: kamelet:sink
