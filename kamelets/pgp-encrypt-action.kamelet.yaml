apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: pgp-encrypt-action
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Actions"
    camel.apache.org/kamelet.namespace: "Transformation"
  labels:
    camel.apache.org/kamelet.type: "action"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "PGP Encrypt Action"
    description: |-
      Encrypts the body of each message with OpenPGP for the public key of a recipient, and can also sign it, as GnuPG (gpg) does.

      Use it to encrypt a file before you send it to a partner, for example with `sftp-sink`, `ftp-sink` or `aws-s3-sink`, when the partner gave you their public key. The partner decrypts it with gpg, or with `pgp-decrypt-action`.

      Input: any body: text, bytes, a stream or a file.

      Output: the body is the OpenPGP message, as a stream: binary, or ASCII text that starts with `-----BEGIN PGP MESSAGE-----` when `armored` is true. The `Content-Type` header is set to `application/pgp-encrypted`. The other headers are kept.

      Good to know: the data is compressed, encrypted with AES-256 and protected against changes. When `signingKeyRing` is set, the message is also signed with your secret key, with SHA-256, so the recipient can check that it comes from you. The keys and the passphrase come only from the options: the headers of the message, such as `CamelPGPDataFormatKeyUserid`, are removed first, so a message cannot choose another key. The file name in the `CamelFileName` header, which file sources set, is stored in the message. A key ring that cannot be read, or a `keyUserId` that matches no key, fails each message. When `signingKeyRing` is set without `signingKeyUserId` or `signingPassphrase`, the Kamelet does not start.
    required:
      - publicKeyRing
      - keyUserId
    type: object
    properties:
      publicKeyRing:
        title: Public Key Ring
        description: "Where to load the public key ring of the recipient from: `file:` followed by the path of a file, `classpath:` followed by a resource in the application, or `base64:` followed by the key ring itself, in Base64. A key ring exported with `gpg --export`, binary or armored, fits."
        type: string
        example: "file:/etc/keys/partner-public.gpg"
        pattern: "^(file|classpath|base64):.+"
      keyUserId:
        title: Key User ID
        description: "Which key of the key ring to encrypt for: its user id, such as `Partner Ltd <files@partner.example.com>`, or a part of it, such as the email address. The message is encrypted for every key whose user id contains this text."
        type: string
        example: "files@partner.example.com"
      armored:
        title: Armored
        description: "Whether to write the message as ASCII text (armored), which fits where only text is allowed, such as an email or a JSON field, instead of binary. Armored text is about a third larger."
        type: boolean
        default: false
      signingKeyRing:
        title: Signing Key Ring
        description: "Where to load your secret key ring from, to sign the message: `file:`, `classpath:` or `base64:`, as for `publicKeyRing`. A key ring exported with `gpg --export-secret-keys` fits. When it is not set, the message is not signed. Requires `signingKeyUserId` and `signingPassphrase`."
        type: string
        example: "file:/etc/keys/my-secret.gpg"
        pattern: "^(file|classpath|base64):.+"
      signingKeyUserId:
        title: Signing Key User ID
        description: "Which key of `signingKeyRing` to sign with: its user id, or a part of it, such as the email address. Required when `signingKeyRing` is set."
        type: string
        example: "exports@mycompany.example.com"
      signingPassphrase:
        title: Signing Passphrase
        description: "The passphrase of the secret key to sign with. Required when `signingKeyRing` is set."
        type: string
        format: password
        x-descriptors:
          - urn:camel:group:credentials
  dataTypes:
    # No 'default:' here on purpose: a default would read the whole body into memory first, while the
    # PGP data format reads a file or a stream as it encrypts it.
    in:
      types:
        binary:
          format: "application-octet-stream"
          description: "The data to encrypt: text, bytes, a stream or a file."
          mediaType: application/octet-stream
    out:
      types:
        binary:
          format: "application-octet-stream"
          description: "The OpenPGP message, as a stream: binary, or ASCII armored text when `armored` is true."
          mediaType: application/pgp-encrypted
  dependencies:
    - "camel:kamelet"
    - "camel:crypto-pgp"
  template:
    from:
      uri: kamelet:source
      steps:
        # the PGP data format reads the key ring, the user id, the passphrase and the algorithms from these
        # headers before its options: the message must not choose them
        - removeHeaders:
            pattern: "CamelPGPDataFormat*"
        - choice:
            precondition: true
            when:
              - expression:
                  simple:
                    expression: "${propertiesExist:signingKeyRing}"
                steps:
                  - marshal:
                      pgp:
                        keyFileName: "{{publicKeyRing}}"
                        keyUserid: "{{keyUserId}}"
                        armored: "{{armored}}"
                        integrity: "true"
                        # AES-256 and SHA-256, the defaults of the data format since Camel 4.24 (CAMEL-27450), set here so they do not depend on the Camel version
                        algorithm: "9"
                        signatureKeyFileName: "{{signingKeyRing}}"
                        signatureKeyUserid: "{{signingKeyUserId}}"
                        signaturePassword: "{{signingPassphrase}}"
                        hashAlgorithm: "8"
            otherwise:
              steps:
                - marshal:
                    pgp:
                      keyFileName: "{{publicKeyRing}}"
                      keyUserid: "{{keyUserId}}"
                      armored: "{{armored}}"
                      integrity: "true"
                      algorithm: "9"
        - removeHeaders:
            pattern: "CamelPGPDataFormat*"
        - setHeader:
            name: Content-Type
            expression:
              constant:
                expression: application/pgp-encrypted
