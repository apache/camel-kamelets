apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: jolt-transformation-action
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Actions"
    camel.apache.org/kamelet.namespace: "Transformation"
  labels:
    camel.apache.org/kamelet.type: "action"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "Jolt Transformation Action"
    description: |-
      Reshapes each JSON message into other JSON, as a Jolt specification describes: moves, renames, removes fields or adds defaults.

      Use it to map the JSON of one system to the JSON another system expects, for example to rename fields or move them into a nested object, when you already have Jolt specifications. `jslt-action` does the same with a query language, and is often easier to write.

      Input: parsed JSON as a Map (or a List), or a JSON object or array as text, bytes or a stream. JSON text, bytes and a stream need Camel 4.24 or later; with older versions they do not fail but give an empty body.

      Output: the body is the result as parsed JSON, a Map (or a List), not JSON text. Add `json-serialize-action` after it to get JSON text. The headers are kept.

      Good to know: a Jackson `JsonNode`, such as the output of `json-deserialize-action`, is not read: the body becomes empty (null), with no error. Put `json-serialize-action` before it to give it JSON text. Text that is not a JSON object or array, such as `hello`, also gives an empty body. The specification cannot read headers, only the body. It is loaded from a file, the classpath or a URL given by the `template` option; it cannot come from the message. Headers that start with `CamelJolt` are removed from the message first, so they cannot change what the Kamelet does.
    required:
      - template
    type: object
    properties:
      template:
        title: Template
        description: "Where to load the Jolt specification from, not the Jolt specification itself: `file://` followed by the path of a file, `classpath://` followed by a resource in the application, or an `http://` or `https://` URL. With the default `transform`, the file holds a JSON array of steps, such as `[{\"operation\": \"shift\", \"spec\": {\"name\": \"customer.fullName\"}}]`."
        type: string
        example: "file:///opt/templates/order-spec.json"
        pattern: "^(http|https|file|classpath|ref|bean)://.*"
      transform:
        title: Transform DSL
        description: "The kind of Jolt specification in the `template` file. `Chainr`, the default, is a list of steps, each with an `operation` (such as `shift`, `default` or `remove`) and a `spec`. The others take the spec of one operation alone: `Shiftr` moves and renames fields, `Defaultr` adds default values, `Removr` removes fields, and `Sortr` sorts the fields by name."
        type: string
        default: "Chainr"
        enum: ["Chainr", "Shiftr", "Defaultr", "Removr", "Sortr"]
  dependencies:
  - "camel:jolt"
  - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: CamelJolt*
        - to:
            uri: "jolt:?resourceUri={{template}}&transformDsl={{transform}}"
