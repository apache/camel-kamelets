apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: drop-headers-action
  labels:
    camel.apache.org/kamelet.type: "action"
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Actions"
    camel.apache.org/kamelet.namespace: "EIP"
spec:
  definition:
    title: "Drop Headers Action"
    description: |-
      Removes from each message all the headers whose names match a pattern, such as `Camel*`.

      Use it to remove the internal `Camel*` headers that came with a message from outside before it reaches a sink, or to clear many headers at once before a message goes to another system. To remove a single header by its name, `drop-header-action` is enough.

      Input: any message.

      Output: the same body, without the headers that match `pattern`. The headers that match `excludePattern` are kept.

      Good to know: a pattern is compared with each header name first as an exact name, then as a wildcard when it ends with `*` (`x-*` matches every name that starts with `x-`), and then as a Java regular expression, such as `x-(one|two)`. None of these comparisons is case-sensitive.
    required:
      - pattern
    type: object
    properties:
      pattern:
        title: Header Pattern
        description: "The headers to remove: an exact header name, a text that ends with `*` to match every name that starts with the text before it, or a regular expression. Upper and lower case do not matter."
        type: string
        example: "Camel*"
      excludePattern:
        title: Exclusion Pattern
        description: "The headers to keep even when they match `pattern`, written in the same way. When it is not set, every header that matches `pattern` is removed."
        type: string
        example: "CamelKafkaKey"
  dependencies:
    - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: "{{pattern}}"
            excludePattern: "{{?excludePattern}}"
