apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: ssh-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "SSH"
    camel.apache.org/kamelet.namespace: "File"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "SSH Source"
    description: |-
      Runs a command on a remote server over SSH again and again, at a regular interval, and sends what the command prints as a message each time.

      Use it to watch a server without installing anything on it, for example check the free disk space, the state of a service or the last lines of a log file every minute. To run a command for each incoming message instead, use `ssh-sink`.

      Output: the body is what the command printed on its standard output, as text. The `CamelSshExitValue` header holds the exit code of the command, and `CamelSshStderr` what it printed on its standard error, as a stream.

      Good to know: it runs `pollCommand` with the rights of `username`, so log in with an account that may do only what is needed. It runs it every half second by default; set `delay` to how often you need it. A command that fails still sends a message, with its exit code in `CamelSshExitValue`. Log in with `password`, or with a private key in `privateKeyResource` when the server does not take passwords; when a key is set, the password is not used. The key of the server is checked only when `knownHostsResource` is set; without it, any server is accepted. A server that is not listed in that file is still accepted, unless `failOnUnknownHost` is true.
    required:
      - connectionHost
      - connectionPort
      - username
      - pollCommand
    type: object
    properties:
      connectionHost:
        title: Connection Host
        description: The host name or IP address of the SSH server, without a port.
        type: string
        example: server.example.com
      connectionPort:
        title: Connection Port
        description: The port of the SSH server, usually 22.
        type: string
        default: 22
      username:
        title: Username
        description: The user to log in as. The command runs with the rights of this user.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      password:
        title: Password
        description: The password of `username` on the SSH server. Leave it empty to log in with a private key in `privateKeyResource` instead; when a key is set, the password is not used. With neither of them set, every run fails with `No password provided`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      privateKeyResource:
        title: Private Key Resource
        description: A private key to log in with instead of a password, starting with `file:` followed by the path of the key file, `classpath:`, `http:` or `https:`. The matching public key must be in the `authorized_keys` file of `username` on the server. OpenSSH keys, such as those made with `ssh-keygen`, and PEM keys can be read. A key that cannot be read, or a wrong passphrase, makes every run fail with `No key-pair to add`.
        type: string
        pattern: "^(http|https|file|classpath|ref|bean):.*"
        example: file:/etc/ssh-keys/id_ed25519
      privateKeyPassphrase:
        title: Private Key Passphrase
        description: The passphrase of the key in `privateKeyResource`, when the key is protected by one.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      knownHostsResource:
        title: Known Hosts Resource
        description: A known_hosts file that holds the key of the server, starting with `file:`, `classpath:`, `http:` or `https:`. Its lines can be made with `ssh-keyscan`. A server whose key does not match is refused. When it is not set, the key of the server is not checked, so any server is accepted.
        type: string
        pattern: "^(http|https|file|classpath|ref|bean):.*"
        example: file:/etc/ssh/known_hosts
      failOnUnknownHost:
        title: Fail On Unknown Host
        description: If true, a server that is not listed in `knownHostsResource` is refused. When it is not set or false, such a server is accepted, and only a server that is listed with another key is refused. Only used when `knownHostsResource` is set.
        type: boolean
      connectTimeout:
        title: Connect Timeout
        description: How long to wait for the connection, for the login and for the command to start, each in milliseconds. It does not limit how long the command runs. When it is not set, it is 30000, which is 30 seconds.
        type: integer
        example: 10000
      delay:
        title: Delay
        description: How long to wait between two runs of the command, in milliseconds. For example, 60000 is one minute.
        type: integer
        default: 500
        example: 60000
      pollCommand:
        title: Poll Command
        description: The command to run each time, as you would type it in a shell on the server. It can hold several commands separated by `;`.
        type: string
        example: df -h /
  dataTypes:
    out:
      headers:
        CamelSshExitValue:
          title: Exit Code
          description: The exit code of the command, such as 0 when it succeeded.
          type: integer
        CamelSshStderr:
          title: Standard Error
          description: What the command printed on its standard error, as a stream.
          type: object
  dependencies:
    - "camel:ssh"
    - "camel:kamelet"
  template:
    from:
      uri: "ssh://{{connectionHost}}:{{connectionPort}}?delay={{delay}}&certResource={{?privateKeyResource}}&certResourcePassword=RAW({{?privateKeyPassphrase}})&failOnUnknownHost={{?failOnUnknownHost}}&knownHostsResource={{?knownHostsResource}}&password=RAW({{?password}})&pollCommand=RAW({{pollCommand}})&timeout={{?connectTimeout}}&username=RAW({{username}})"
      steps:
        - convertBodyTo:
            type: java.lang.String
        - to:
            uri: kamelet:sink
