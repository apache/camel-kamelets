apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: mqtt5-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "MQTT v5"
    camel.apache.org/kamelet.namespace: "Messaging"
  labels:
    camel.apache.org/kamelet.type: "sink"
spec:
  definition:
    title: "MQTT v5 Sink"
    description: |-
      Publishes each message to a topic on an MQTT broker, such as Eclipse Mosquitto or HiveMQ, with MQTT 5.

      Use it to send commands or data to IoT devices, or to publish readings and events, when the broker or the clients use MQTT 5. The broker must support MQTT 5.

      Input: the body is the payload, as text or bytes, and is sent as it is. Turn structured data such as a Map into JSON text first, for example with `json-serialize-action`. The headers of the message are not sent, not even as MQTT 5 user properties.

      Output: the message is unchanged.

      Good to know: messages are published with quality of service 2 (exactly once) unless `qos` is set, and the broker does not keep them for clients that subscribe later unless `retained` is true. It connects with no TLS unless `brokerUrl` starts with `ssl://`. With TLS it checks the certificate and the host name of the broker, and trusts the certificate authorities that Java trusts by default, or instead the ones in `sslTruststoreLocation`. It connects when the integration starts, and the integration fails to start when the broker cannot be reached or fails these checks. Headers that start with `CamelPaho` are removed from the message first, so they cannot change what the Kamelet does.
    required:
    - topic
    - brokerUrl
    type: object
    properties:
      topic:
        title: "Topic"
        description: "The topic to publish each message to, such as `sensors/temperature`. Wildcards (`+` and `#`) cannot be used here."
        type: string
        example: "sensors/temperature"
      brokerUrl:
        title: "Broker URL"
        description: "The address of the MQTT broker, as `tcp://host:port` (usually port 1883), or `ssl://host:port` for TLS (usually port 8883). For a broker with a certificate from a private or self-signed authority, also set `sslTruststoreLocation`."
        type: string
        example: "tcp://mosquitto:1883"
      username:
        title: "Username"
        description: "The user name to log in to the broker with. Leave it empty for a broker that accepts clients without a login."
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      password:
        title: "Password"
        description: "The password to log in to the broker with, for the user `username`."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      qos:
        title: "Quality of Service"
        description: "The quality of service to publish each message with: 0 (at most once, with no confirmation from the broker), 1 (at least once, a message can arrive twice) or 2 (exactly once). When it is not set, 2 is used. A subscriber receives the message with the lower of this and the quality of service it subscribed with."
        type: integer
        enum: [0, 1, 2]
        example: 1
      retained:
        title: "Retained"
        description: "Whether the broker keeps the message as the last one of the topic, and gives it to every client that subscribes to the topic later, such as the last known state of a device. Each retained message replaces the one before. When it is not set, messages are not retained."
        type: boolean
      sslTruststoreLocation:
        title: "SSL Truststore Location"
        description: "The path of a trust store file, in JKS or PKCS12 format, with the certificate of the authority that signed the certificate of the broker. Needed only with an `ssl://` address when the broker uses a certificate that Java does not trust by default, such as one from a private or self-signed authority. Not used with `tcp://`."
        type: string
        example: "/etc/mqtt/truststore.jks"
      sslTruststorePassword:
        title: "SSL Truststore Password"
        description: "The password of the trust store file in `sslTruststoreLocation`."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
  dependencies:
    - "camel:paho-mqtt5"
    - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: CamelPaho*
        - to:
            uri: paho-mqtt5
            parameters:
              topic: "{{topic}}"
              brokerUrl: "{{brokerUrl}}"
              password: "RAW({{?password}})"
              userName: "RAW({{?username}})"
              qos: "{{?qos}}"
              retained: "{{?retained}}"
              "sslClientProps[com.ibm.ssl.trustStore]": "{{?sslTruststoreLocation}}"
              "sslClientProps[com.ibm.ssl.trustStorePassword]": "RAW({{?sslTruststorePassword}})"
