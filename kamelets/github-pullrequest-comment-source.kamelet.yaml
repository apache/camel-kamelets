apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: github-pullrequest-comment-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "GitHub"
    camel.apache.org/kamelet.namespace: "Cloud"
  labels:
    camel.apache.org/kamelet.type: "source"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "GitHub Pull Request Comments Source"
    description: |-
      Receives each new comment written on the open pull requests of a GitHub repository, one message per comment, by asking the GitHub API for new comments.

      Use it to react to the discussion on pull requests, for example to answer a command written in a comment, such as `/retest`, or to forward the comments to a chat channel. To receive the pull requests themselves, use `github-pullrequest-source`.

      Output: the body is the comment as JSON text in bytes, an object with the fields of the GitHub API that say what it is: `id`, `body` (the text of the comment), `html_url` (its web address), `user.login` (its author), `author_association` (the role of the author in the repository, such as `OWNER` or `CONTRIBUTOR`), `created_at` and `updated_at`. The `CamelGitHubPullRequest` header gives the number of the pull request it was written on. The `Content-Type` header is `application/json`.

      Good to know: only the comments written after the start are sent, and only on pull requests that are still open. These are the comments of the conversation of a pull request, not the review comments on lines of code. It works with github.com, not with GitHub Enterprise Server. Once a minute by default (`delay`), it asks GitHub for the open pull requests and for the comments of each of them, and every request counts against the API rate limit of the token.
    required:
      - repoName
      - repoOwner
      - oauthToken
    type: object
    properties:
      repoName:
        title: Repository Name
        description: The name of the repository, such as `camel` in `https://github.com/apache/camel`.
        type: string
        example: camel
      repoOwner:
        title: Repository Owner
        description: The user or organization that owns the repository, such as `apache` in `https://github.com/apache/camel`.
        type: string
        example: apache
      oauthToken:
        title: OAuth Token
        description: A GitHub personal access token, created on GitHub under Settings, Developer settings, Personal access tokens. It needs read access to the repository and its pull requests.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      delay:
        title: Delay
        description: How long to wait between two polls of GitHub, in milliseconds. For example, 60000 is one minute.
        type: integer
        default: 60000
  dataTypes:
    out:
      default: json
      types:
        json:
          format: "application-json"
          description: "The comment, as JSON text in bytes."
          mediaType: application/json
      headers:
        CamelGitHubPullRequest:
          title: Pull Request Number
          description: The number of the pull request the comment was written on.
          type: integer
  types:
    out:
      mediaType: application/json
  dependencies:
  - "camel:github2"
  - "camel:jq"
  - "camel:kamelet"
  template:
    beans:
      # writes the object from its fields, as the GitHub library reads it: unlike its getters, this asks GitHub
      # for nothing more
      - name: gitHubJson
        type: "#class:org.kohsuke.github.GitHub"
        factoryMethod: getMappingObjectWriter
    from:
      uri: "github2://pullRequestComment?oauthToken=RAW({{oauthToken}})&repoName={{repoName}}&repoOwner={{repoOwner}}&delay={{delay}}"
      steps:
        - bean:
            ref: "{{gitHubJson}}"
            method: writeValueAsString
        # keep the fields the description lists
        - transform:
            expression:
              jq:
                resultType: java.lang.String
                expression: "{id: .id, body: .body, html_url: .html_url, user: {login: .user.login}, author_association: .author_association, created_at: .created_at, updated_at: .updated_at}"
        - setHeader:
            name: Content-Type
            expression:
              constant:
                expression: application/json
        - to:
            uri: kamelet:sink
