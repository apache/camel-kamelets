apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: mllp-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3QgeD0iNCIgeT0iNCIgd2lkdGg9IjU2IiBoZWlnaHQ9IjU2IiByeD0iMTAiIGZpbGw9IiMyYTdhYjAiLz48cGF0aCBkPSJNMjYgMTRoMTJ2MTJoMTJ2MTJIMzh2MTJIMjZWMzhIMTRWMjZoMTJ6IiBmaWxsPSIjZmZmIi8+PC9zdmc+"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "MLLP"
    camel.apache.org/kamelet.namespace: "Messaging"
  labels:
    camel.apache.org/kamelet.type: "sink"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "MLLP Sink"
    description: |-
      Sends each message as an HL7 v2 message to a hospital system over MLLP, a plain TCP connection, and waits for its HL7 acknowledgement (ACK).

      Use it to send admissions, orders or results to a hospital information system, a lab system or an interface engine that receives HL7 v2 over MLLP, or to forward the messages that `mllp-source` receives. To write FHIR resources instead, use `fhir-sink`.

      Input: the body is the HL7 message, as text with its segments separated by a carriage return (`\r`), or as bytes, which are sent as they are. Text is sent in `charset`, which is ISO-8859-1 when it is not set: set it to the charset that the MSH-18 field of the messages names, such as `UTF-8` for `UNICODE UTF-8`, because it is not read from the message.

      Output: when it is used inside a route, the body is unchanged afterwards. `CamelMllpAcknowledgementType` is the code of the acknowledgement, `AA` when the receiver accepted the message, `CamelMllpAcknowledgementString` the acknowledgement as text, and `CamelMllpAcknowledgement` the same as bytes.

      Good to know: an acknowledgement `AE` (error) or `AR` (rejected) fails the message, and `CamelMllpAcknowledgementType` and `CamelMllpAcknowledgementString` are still set, so that a step that handles the error can read the reason in the MSA-3 field. A receiver that cannot be reached, or that does not answer within `ackTimeout`, fails the message. It connects at the first message and keeps the connection open for the next ones. It connects with no TLS. For TLS, set the application properties `camel.ssl.enabled=true`, `camel.ssl.trustStore`, `camel.ssl.trustStorePassword` and `camel.component.mllp.useGlobalSslContextParameters=true`: every MLLP source and sink of the application then uses TLS. Headers that start with `CamelMllpAcknowledgement`, and `CamelCharsetName`, are removed from the message first, so they cannot change what the Kamelet sends or reports.
    required:
    - host
    - port
    type: object
    properties:
      host:
        title: Host
        description: The host name or IP address of the system to send the messages to.
        type: string
        example: "hl7.hospital.example.com"
        pattern: "^[A-Za-z0-9._:-]+$"
      port:
        title: Port
        description: The TCP port that the system listens on for MLLP, often 2575.
        type: integer
        example: 2575
      charset:
        title: Charset
        description: The charset to send text in, such as `UTF-8`. Set it to the charset that MSH-18 of the messages names; it is not read from the message. It is also used to read the acknowledgement when its MSH-18 is empty.
        type: string
        default: ISO-8859-1
        example: UTF-8
        pattern: "^[A-Za-z0-9._:-]+$"
      connectTimeout:
        title: Connect Timeout
        description: How long to wait for the connection to the system, in milliseconds. When it is not set, it is 30000 (30 seconds).
        type: integer
        example: 5000
      ackTimeout:
        title: Acknowledgement Timeout
        description: How long to wait for the acknowledgement of a message, in milliseconds. When it is not set, it is 15000 (15 seconds).
        type: integer
        example: 30000
  dataTypes:
    # No 'default:' here on purpose: the body is sent as it is, text or bytes. See #3117.
    in:
      headers: {}
    out:
      headers:
        CamelMllpAcknowledgementType:
          title: Acknowledgement Type
          description: The code of the acknowledgement, `AA` (accepted), `AE` (error) or `AR` (rejected).
          type: string
        CamelMllpAcknowledgementString:
          title: Acknowledgement
          description: The acknowledgement the receiver sent, as text, with its MSH and MSA segments.
          type: string
  dependencies:
    - "camel:mllp"
    - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: CamelMllpAcknowledgement*
        # The charset of the text is `charset`: a CamelCharsetName header or exchange property, which
        # the MLLP component reads first and which mllp-source and earlier MLLP sends set, would win.
        - removeHeader:
            name: CamelCharsetName
        - setProperty:
            name: CamelCharsetName
            expression:
              constant:
                expression: "{{charset}}"
        - to:
            uri: mllp
            parameters:
              hostname: "{{host}}"
              port: "{{port}}"
              charsetName: "{{charset}}"
              connectTimeout: "{{?connectTimeout}}"
              receiveTimeout: "{{?ackTimeout}}"
