apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: file-watch-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "File Watch"
    camel.apache.org/kamelet.namespace: "File"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "File Watch Source"
    description: |-
      Sends a message each time a file in a local directory is created, changed or deleted, with the kind of change and the path of the file.

      Use it to react to files that another program writes into a directory on the same machine, for example to start processing when a new export appears, or to keep track of the changes in a folder. To read files from a remote server instead, use `ftp-source`, `sftp-source` or `aws-s3-source`.

      Output: the body is the file that changed, which the next step can read as text or bytes; a deleted file or a directory has no content to read. The `CamelFileEventType` header is `CREATE`, `MODIFY` or `DELETE`, `CamelFileName` is the path of the file relative to the watched directory, and `CamelFileAbsolutePath` is its full path.

      Good to know: it watches the subdirectories too, new ones included, unless `recursive` is false. To send only the changes of some files, set `antInclude`. It never changes or deletes the files. Only changes made while it runs are sent, not the files that are already there when it starts. The path must be a directory, not a single file; it is created when it does not exist. On Kubernetes, mount the directory into the pod as a volume.
    required:
      - filePath
      - events
    type: object
    properties:
      filePath:
        title: Directory to Watch
        description: "The full path of the local directory to watch. It must be a directory, not a single file: to follow one file, watch its directory. Changes in its subdirectories are sent too, unless `recursive` is false."
        type: string
        example: /data/incoming
      events:
        title: Events
        description: "The kinds of change to send, as a comma-separated list of `CREATE`, `MODIFY` and `DELETE`. For example, `CREATE` sends only the new files."
        type: string
        default: "CREATE,MODIFY,DELETE"
        example: CREATE
      antInclude:
        title: Include Files (Wildcards)
        description: "A wildcard pattern that the path of a file must match for its changes to be sent, such as `**/*.csv`. The path is relative to `filePath`, such as `2026/orders.csv`. `*` matches any part of a name, and `**` any number of directories: `*.csv` matches the CSV files in `filePath` only, and `**/*.csv` those in the subdirectories too. Upper and lower case differ. When it is not set, the changes of all the files are sent."
        type: string
        example: "**/*.csv"
      recursive:
        title: Recursive
        description: If true, the changes in the subdirectories of `filePath` are sent too, new subdirectories included. If false, only the changes of the files and directories directly in `filePath` are sent.
        type: boolean
        default: true
  dataTypes:
    out:
      headers:
        CamelFileEventType:
          title: Event Type
          description: The kind of change, `CREATE`, `MODIFY` or `DELETE`.
          type: string
        CamelFileName:
          title: File Name
          description: The path of the file relative to the watched directory, such as `orders.csv` or `2026/orders.csv`.
          type: string
        CamelFileAbsolutePath:
          title: Absolute Path
          description: The full path of the file, such as `/data/incoming/orders.csv`.
          type: string
  dependencies:
    - "camel:file-watch"
    - "camel:kamelet"
  template:
    from:
      uri: file-watch
      parameters:
        path: "{{filePath}}"
        antInclude: "RAW({{?antInclude}})"
        events: "{{events}}"
        recursive: "{{recursive}}"
      steps:
        - to:
            uri: kamelet:sink
