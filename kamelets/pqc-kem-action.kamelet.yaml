apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: pqc-kem-action
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "PQC"
    camel.apache.org/kamelet.namespace: "PQC"
  labels:
    camel.apache.org/kamelet.type: "action"
spec:
  definition:
    title: "PQC Key Encapsulation/Decapsulation Action"
    description: |-
      Creates a new secret key for a symmetric cipher, such as AES, together with its encapsulation by a post-quantum algorithm such as ML-KEM, or takes the secret key back out of such an encapsulation.

      Use it to try out post-quantum key establishment (a KEM, key encapsulation mechanism): one step creates a secret key and its encapsulation, the protected form of the key that may be sent to the holder of the private key, and a later step takes the same secret key out of it. To encrypt the messages themselves with a fixed key, use `crypto-encrypt-action`.

      Input: for `generateSecretKeyEncapsulation`, any body; it is not used. For `extractSecretKeyEncapsulation` and `extractSecretKeyFromEncapsulation`, the body must be the result of `generateSecretKeyEncapsulation`.

      Output: `generateSecretKeyEncapsulation` and `extractSecretKeyEncapsulation` give a Java object that holds the secret key and its encapsulation. `extractSecretKeyFromEncapsulation` gives the secret key, as a Java object. None of them is text or bytes, so the next step must be one that works with Java key objects.

      Good to know: the key pair of the post-quantum algorithm is created when the application starts, and no option can set it, so an encapsulation can be opened only by the same running application.
    required:
    - keyEncapsulationAlgorithm
    - operation
    - symmetricKeyAlgorithm
    type: object
    properties:
      keyEncapsulationAlgorithm:
        title: PQC Key Encapsulation Algorithm
        description: The post-quantum algorithm that encapsulates the secret key. `MLKEM` (ML-KEM, the NIST standard FIPS 203) is the usual choice. Use the same algorithm in the steps that create and that open an encapsulation.
        type: string
        enum: ["MLKEM","BIKE","HQC","CMCE","SABER","FRODO","NTRU","NTRULPRime"]
      operation:
        title: PQC KEM Operation
        description: What to do with each message. `generateSecretKeyEncapsulation` creates a new secret key and its encapsulation; `extractSecretKeyEncapsulation` gives the encapsulation again; `extractSecretKeyFromEncapsulation` gives the secret key taken out of the encapsulation.
        type: string
        enum: ["generateSecretKeyEncapsulation","extractSecretKeyEncapsulation","extractSecretKeyFromEncapsulation"]
      symmetricKeyAlgorithm:
        title: Symmetric Key Algorithm
        description: The symmetric cipher the secret key is for, such as `AES`, the usual choice. The cipher must accept a key of the length the Camel PQC component creates (256 bits in recent Camel versions); with one that does not, such as `SEED` or `SM4`, the integration fails to start.
        type: string
        enum: ["AES","RC2","RC5","ARIA","CAMELLIA","CAST5","CAST6","CHACHA7539","DSTU7624","GOST28147","GOST3412_2015","GRAIN128","HC128","HC256","SALSA20","SEED","SM4","DESEDE"]
  dependencies:
  - "camel:pqc"
  - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - to:
            uri: pqc
            parameters:
              label: kem
              keyEncapsulationAlgorithm: "{{keyEncapsulationAlgorithm}}"
              operation: "{{operation}}"
              symmetricKeyAlgorithm: "{{symmetricKeyAlgorithm}}"
