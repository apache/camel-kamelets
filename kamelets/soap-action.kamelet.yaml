apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: soap-action
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "SOAP"
    camel.apache.org/kamelet.namespace: "HTTP"
  labels:
    camel.apache.org/kamelet.type: "action"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "SOAP Action"
    description: |-
      Calls an operation of a SOAP web service described by a WSDL file for each message, and gives back the response.

      Use it to call an existing SOAP service from a route, such as an order or customer service of an older system, with XML and without generating Java code from the WSDL. To serve a SOAP service, use `soap-source`.

      Input: the body is the request element of the operation as XML text, such as `<getOrder xmlns="http://example.com/orders"><orderId>7</orderId></getOrder>`. It is put in the SOAP Body as it is.

      Output: the body is the content of the SOAP Body of the response as XML text: the response element of the operation, such as `<getOrderResponse xmlns="http://example.com/orders">...</getOrderResponse>`.

      Good to know: a SOAP fault from the service fails the message with an `org.apache.cxf.binding.soap.SoapFault` error, whose message is the text of the fault, so that a route can catch it by its class name. When `faultAsBody` is true, the message goes on instead: the body is the content of the `detail` element of the fault as XML text, such as the fault element the WSDL declares (no body when the fault has no detail), the header `SoapFault` is the text of the fault, and `SoapFaultCode` its code: `Client` or `Server` with SOAP 1.1, `Sender` or `Receiver` with SOAP 1.2. A request that the service refuses, for example because it does not match its XML schema, is a SOAP fault too. SOAP 1.1 or 1.2 is used as the WSDL says. To log in with a WS-Security UsernameToken, set `wsSecurityUsername` and `wsSecurityPassword`: the integration then needs the jar `org.apache.cxf:cxf-rt-ws-security` of the CXF version that Camel uses, such as `camel run --dep=mvn:org.apache.cxf:cxf-rt-ws-security:4.2.4` with Camel 4.24, or it fails to start with a message that says so. Headers that start with `Camel`, and the `SOAPAction`, `Authorization` and `Proxy-Authorization` headers, are removed from the message first, so a message cannot change the address, the operation or the login.
    required:
      - wsdlURL
      - operation
    type: object
    properties:
      address:
        title: Address
        description: The URL of the SOAP service. When it is not set, the address that the WSDL gives for the port is called, the `location` of its `soap:address`.
        type: string
        example: "https://legacy.example.com/orders"
        pattern: "^https?://.+"
      wsdlURL:
        title: WSDL Location
        description: Where to read the WSDL file of the service from. `file:` followed by a path, `classpath:` followed by a resource in the application, or an `https://` URL (an `http://` URL works too, but the WSDL decides what is called, so it should not travel unprotected), such as the address of the service followed by `?wsdl`.
        type: string
        example: "https://legacy.example.com/orders?wsdl"
        pattern: "^(file|classpath|https?):.+"
      operation:
        title: Operation
        description: The name of the operation to call, as the WSDL names it.
        type: string
        example: "getOrder"
      operationNamespace:
        title: Operation Namespace
        description: The namespace of the operation. Only needed when the WSDL has two operations of the same name.
        type: string
        example: "http://example.com/orders"
      serviceName:
        title: Service Name
        description: The service of the WSDL to call, as `\{namespace}name`. Only needed when the WSDL has more than one service; otherwise the first one is used.
        type: string
        example: "{http://example.com/orders}OrderService"
        pattern: "^\\{[^}]*\\}[^{}]+$"
      portName:
        title: Port Name
        description: The port of the service to call, as `\{namespace}name`. Only needed when the service has more than one port; otherwise the first one is used.
        type: string
        example: "{http://example.com/orders}OrderPort"
        pattern: "^\\{[^}]*\\}[^{}]+$"
      faultAsBody:
        title: Fault As Body
        description: Whether a SOAP fault from the service gives a message with the detail of the fault as body and the `SoapFault` and `SoapFaultCode` headers, instead of failing the message.
        type: boolean
        default: false
      username:
        title: Username
        description: The user name for HTTP Basic authentication. When it is set, every request carries it, with `password`.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      password:
        title: Password
        description: The password for HTTP Basic authentication.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      wsSecurityUsername:
        title: WS-Security Username
        description: The user name to send in a WS-Security UsernameToken, in the SOAP header of each request, for a service that requires one. It is not the same as `username`, which is for HTTP Basic authentication. Set `wsSecurityPassword` too.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      wsSecurityPassword:
        title: WS-Security Password
        description: The password of `wsSecurityUsername`, sent in the UsernameToken.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      wsSecurityPasswordType:
        title: WS-Security Password Type
        description: How the UsernameToken carries the password. `Text` sends it as it is, so only use it over HTTPS. `Digest` sends a SHA-1 digest of it, which is no replacement for HTTPS. It must be the type the service requires, or the service refuses the token. When the WSDL has a WS-SecurityPolicy, the policy decides instead. When it is not set, `Text`.
        type: string
        enum: ["Text", "Digest"]
        example: Digest
  dataTypes:
    # No 'default:' on purpose: the body is the XML of the request and of the response, as it is. See #3117.
    in:
      headers: {}
    out:
      headers:
        SoapFault:
          title: SOAP Fault
          description: The text of the SOAP fault that the service returned. Only set when `faultAsBody` is true.
          type: string
        SoapFaultCode:
          title: SOAP Fault Code
          description: The code of the SOAP fault, such as `Client` or `Server`. Only set when `faultAsBody` is true.
          type: string
  dependencies:
  - "camel:cxf-soap"
  - "camel:xpath"
  - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        # The operation (CamelCxfOperationName, the former operationName), the address (CamelDestinationOverrideUrl)
        # and the CXF request context come from the options only. SOAPAction and the login headers would be sent as
        # HTTP headers, and SOAP headers that came in through soap-source would be relayed.
        - removeHeaders:
            pattern: Camel.*|RequestContext|ResponseContext|operationName|operationNamespace|SoapFault.*|SOAPAction|Authorization|Proxy-Authorization|org\.apache\.cxf\..*
        - doTry:
            steps:
              - to:
                  uri: "cxf://{{?address}}?wsdlURL=RAW({{wsdlURL}})&serviceName={{?serviceName}}&portName={{?portName}}&dataFormat=PAYLOAD&defaultOperationName={{operation}}&defaultOperationNamespace={{?operationNamespace}}&username=RAW({{?username}})&password=RAW({{?password}})&wsSecurityUsername=RAW({{?wsSecurityUsername}})&wsSecurityPassword=RAW({{?wsSecurityPassword}})&wsSecurityPasswordType={{?wsSecurityPasswordType}}"
              - convertBodyTo:
                  type: java.lang.String
              - doCatch:
                  exception:
                    - org.apache.cxf.binding.soap.SoapFault
                  onWhen:
                    expression:
                      simple:
                        expression: "{{faultAsBody}}"
                  steps:
                    - setHeader:
                        name: SoapFault
                        expression:
                          simple:
                            expression: "${exception.message}"
                    - setHeader:
                        name: SoapFaultCode
                        expression:
                          simple:
                            expression: "${exception.faultCode.localPart}"
                    # the content of the detail element: the fault elements, as XML text
                    - choice:
                        when:
                          - expression:
                              simple:
                                expression: "${exception.detail} != null"
                            steps:
                              - setBody:
                                  expression:
                                    simple:
                                      expression: "${exception.detail}"
                              - transform:
                                  expression:
                                    xpath:
                                      resultType: org.w3c.dom.NodeList
                                      expression: /*/*
                              - convertBodyTo:
                                  type: java.lang.String
                        otherwise:
                          steps:
                            - setBody:
                                expression:
                                  simple:
                                    expression: "${null}"
