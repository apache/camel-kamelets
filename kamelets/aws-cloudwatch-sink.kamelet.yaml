apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: aws-cloudwatch-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "AWS Cloudwatch"
    camel.apache.org/kamelet.namespace: "AWS"
  labels:
    camel.apache.org/kamelet.type: "sink"
spec:
  definition:
    title: "AWS CloudWatch Metrics Sink"
    description: |-
      Sends one data point of a custom metric to Amazon CloudWatch for each message, with the name, the value and the unit of the metric taken from headers.

      Use it to record business or technical numbers from an integration, such as orders processed, items in stock or processing time, and to graph them or set alarms on them in CloudWatch.

      Input: the body is not used. The `metric-name` header (or `ce-metricname`) is the name of the metric, and is required. The optional `metric-value` header (or `ce-metricvalue`) is the value, a number, 1 when it is not set. The optional `metric-unit` header (or `ce-metricunit`) is the unit, such as `Count`, `Seconds`, `Bytes` or `Percent`, `Count` when it is not set. The optional `metric-dimension-name` and `metric-dimension-value` headers (or `ce-metricdimensionname` and `ce-metricdimensionvalue`) add one dimension, such as `Region` and `eu`. The optional `metric-timestamp` header (or `ce-metrictimestamp`) is the time of the data point.

      Output: the message is unchanged.

      Good to know: a message without a metric name, or with a value that is not a number, fails. The time in `metric-timestamp` must be a Java `Instant` or `Date`: text is ignored, and then the data point gets the time it is sent. To reach AWS through an HTTP proxy, set `proxyHost` and `proxyPort`, and set `proxyProtocol` to `HTTP` for a proxy that takes plain HTTP, such as Squid.
    required:
      - cwNamespace
      - region
    type: object
    properties:
      cwNamespace:
        title: CloudWatch Namespace
        description: The namespace that groups your metrics in CloudWatch, such as `MyApp/Orders`. It must not start with `AWS/`, which is kept for the metrics of AWS services.
        example: MyApp/Orders
        type: string
      accessKey:
        title: Access Key
        description: The access key ID of an IAM user, which you create in the AWS console under IAM, Users, Security credentials. Use it together with `secretKey`. Leave both out when `useDefaultCredentialsProvider` or `useProfileCredentialsProvider` is true.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      secretKey:
        title: Secret Key
        description: The secret access key that belongs to `accessKey`. The AWS console shows it only once, when the access key is created.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      region:
        title: AWS Region
        description: The AWS region of the metrics, as a region code such as `eu-west-1` or `us-east-1`.
        example: eu-west-1
        type: string
        enum: ["ap-south-1", "eu-south-1", "us-gov-east-1", "me-central-1", "ca-central-1", "eu-central-1", "us-iso-west-1", "us-west-1", "us-west-2", "af-south-1", "eu-north-1", "eu-west-3", "eu-west-2", "eu-west-1", "ap-northeast-3", "ap-northeast-2", "ap-northeast-1", "me-south-1", "sa-east-1", "ap-east-1", "cn-north-1", "us-gov-west-1", "ap-southeast-1", "ap-southeast-2", "us-iso-east-1", "ap-southeast-3", "us-east-1", "us-east-2", "cn-northwest-1", "us-isob-east-1", "aws-global", "aws-cn-global", "aws-us-gov-global", "aws-iso-global", "aws-iso-b-global"]
      useDefaultCredentialsProvider:
        title: Default Credentials Provider
        description: "If true, the credentials are found in the environment instead of in `accessKey` and `secretKey`: the `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY` environment variables, the `~/.aws/credentials` file, or the IAM role of the EC2 instance, ECS task or Kubernetes pod the integration runs on."
        type: boolean
        default: false
      useProfileCredentialsProvider:
        title: Profile Credentials Provider
        description: If true, the credentials are read from a named profile in the AWS credentials file (`~/.aws/credentials`), as the AWS CLI does. Name the profile in `profileCredentialsName`.
        type: boolean
        default: false
      useSessionCredentials:
        title: Session Credentials
        description: "If true, it logs in with temporary credentials: `accessKey`, `secretKey` and `sessionToken`, such as the ones AWS STS gives when you assume an IAM role."
        type: boolean
        default: false
      profileCredentialsName:
        title: Profile Credentials Name
        description: The name of the profile in the AWS credentials file. Only used when `useProfileCredentialsProvider` is true; when it is not set, the default profile is used.
        example: production
        type: string
      sessionToken:
        title: Session Token
        description: The session token of temporary credentials, which comes with their access key and secret key, for example from AWS STS when you assume an IAM role. Only used when `useSessionCredentials` is true.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      uriEndpointOverride:
        title: Overwrite Endpoint URI
        description: The address to connect to instead of AWS, as a URL such as `http://localhost:4566` for LocalStack. Only used when `overrideEndpoint` is true.
        example: http://localhost:4566
        type: string
      overrideEndpoint:
        title: Endpoint Overwrite
        description: If true, it connects to the address in `uriEndpointOverride` instead of to AWS. Use it for a local stand-in of AWS such as LocalStack.
        type: boolean
        default: false
      proxyHost:
        title: Proxy Host
        description: The host name or IP address of an HTTP proxy to send the calls to AWS through, such as the proxy of a company network. Used only together with `proxyPort`. When it is not set, the calls go straight to AWS.
        type: string
        pattern: "^[A-Za-z0-9._-]+$"
        example: proxy.example.com
      proxyPort:
        title: Proxy Port
        description: The port of the proxy in `proxyHost`, such as `3128` for Squid. Used only together with `proxyHost`.
        type: integer
        example: 3128
      proxyProtocol:
        title: Proxy Protocol
        description: "How to talk to the proxy itself: `HTTP` or `HTTPS`. It is not the protocol of the calls to AWS, which stay encrypted, as the proxy only passes them on. When it is not set, it is `HTTPS`, which needs a proxy that takes TLS connections. Most company proxies, such as Squid, take plain HTTP: set `HTTP` for them. With the wrong one, every call fails, for example with `Unsupported or unrecognized SSL message`."
        type: string
        enum: ["HTTP", "HTTPS"]
        example: HTTP
  dataTypes:
    in:
      headers:
        metric-name:
          title: Metric Name
          description: The name of the metric, such as `OrdersProcessed`. `ce-metricname` works too. Required.
          type: string
        metric-value:
          title: Metric Value
          description: The value of the data point, a number. `ce-metricvalue` works too. 1 when it is not set.
          type: number
        metric-unit:
          title: Metric Unit
          description: The unit of the value, such as `Count`, `Seconds`, `Bytes` or `Percent`. `ce-metricunit` works too. `Count` when it is not set.
          type: string
        metric-dimension-name:
          title: Dimension Name
          description: The name of a dimension of the data point, such as `Region`. `ce-metricdimensionname` works too. Used with `metric-dimension-value`.
          type: string
        metric-dimension-value:
          title: Dimension Value
          description: The value of the dimension, such as `eu`. `ce-metricdimensionvalue` works too.
          type: string
        metric-timestamp:
          title: Metric Timestamp
          description: The time of the data point, as a Java `Instant` or `Date`; text is ignored. `ce-metrictimestamp` works too. When it is not set, the time it is sent is used.
          type: object
  dependencies:
    - "camel:aws2-cw"
    - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[metric-name]}"
                steps:
                  - setHeader:
                      name: CamelAwsCwMetricName
                      expression:
                        simple:
                          expression: "${header[metric-name]}"
              - expression:
                  simple:
                    expression: "${header[ce-metricname]}"
                steps:
                  - setHeader:
                      name: CamelAwsCwMetricName
                      expression:
                        simple:
                          expression: "${header[ce-metricname]}"
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[metric-value]}"
                steps:
                  - setHeader:
                      name: CamelAwsCwMetricValue
                      expression:
                        simple:
                          expression: "${header[metric-value]}"
              - expression:
                  simple:
                    expression: "${header[ce-metricvalue]}"
                steps:
                  - setHeader:
                      name: CamelAwsCwMetricValue
                      expression:
                        simple:
                          expression: "${header[ce-metricvalue]}"
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[metric-unit]}"
                steps:
                  - setHeader:
                      name: CamelAwsCwMetricUnit
                      expression:
                        simple:
                          expression: "${header[metric-unit]}"
              - expression:
                  simple:
                    expression: "${header[ce-metricunit]}"
                steps:
                  - setHeader:
                      name: CamelAwsCwMetricUnit
                      expression:
                        simple:
                          expression: "${header[ce-metricunit]}"
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[metric-timestamp]}"
                steps:
                  - setHeader:
                      name: CamelAwsCwMetricTimestamp
                      expression:
                        simple:
                          expression: "${header[metric-timestamp]}"
              - expression:
                  simple:
                    expression: "${header[ce-metrictimestamp]}"
                steps:
                  - setHeader:
                      name: CamelAwsCwMetricTimestamp
                      expression:
                        simple:
                          expression: "${header[ce-metrictimestamp]}"
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[metric-dimension-name]}"
                steps:
                  - setHeader:
                      name: CamelAwsCwMetricDimensionName
                      expression:
                        simple:
                          expression: "${header[metric-dimension-name]}"
              - expression:
                  simple:
                    expression: "${header[ce-metricdimensionname]}"
                steps:
                  - setHeader:
                      name: CamelAwsCwMetricDimensionName
                      expression:
                        simple:
                          expression: "${header[ce-metricdimensionname]}"
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[metric-dimension-value]}"
                steps:
                  - setHeader:
                      name: CamelAwsCwMetricDimensionValue
                      expression:
                        simple:
                          expression: "${header[metric-dimension-value]}"
              - expression:
                  simple:
                    expression: "${header[ce-metricdimensionvalue]}"
                steps:
                  - setHeader:
                      name: CamelAwsCwMetricDimensionValue
                      expression:
                        simple:
                          expression: "${header[ce-metricdimensionvalue]}"
        - to:
            uri: aws2-cw
            parameters:
              namespace: "{{cwNamespace}}"
              accessKey: "RAW({{?accessKey}})"
              overrideEndpoint: "{{overrideEndpoint}}"
              profileCredentialsName: "{{?profileCredentialsName}}"
              region: "{{region}}"
              secretKey: "RAW({{?secretKey}})"
              sessionToken: "RAW({{?sessionToken}})"
              uriEndpointOverride: "{{?uriEndpointOverride}}"
              useDefaultCredentialsProvider: "{{useDefaultCredentialsProvider}}"
              useProfileCredentialsProvider: "{{useProfileCredentialsProvider}}"
              useSessionCredentials: "{{useSessionCredentials}}"
              proxyHost: "{{?proxyHost}}"
              proxyPort: "{{?proxyPort}}"
              proxyProtocol: "{{?proxyProtocol}}"
