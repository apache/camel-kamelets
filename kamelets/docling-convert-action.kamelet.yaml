apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: docling-convert-action
  labels:
    camel.apache.org/kamelet.type: "action"
    camel.apache.org/kamelet.verified: "true"
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Actions"
    camel.apache.org/kamelet.namespace: "AI"
spec:
  definition:
    title: "Docling Convert Action"
    description: |-
      Turns each document, such as a PDF, an office document or an HTML page, into Markdown, HTML or plain text with Docling, keeping its headings, lists and tables.

      Use it to get well-structured text out of documents before an AI step, for example in front of `langchain4j-ingest-sink` to load them into a vector store. For plain text without a Docling server, use `tika-extract-text-action`.

      Input: the document, as bytes, a stream, a file or text. The header named in `documentIdHeader` (by default `CamelLangChain4jIngestDocumentId`) is the id of the document, if any; it is kept for `langchain4j-ingest-sink` further on.

      Output: the body is the document as Markdown, as text, or as HTML or plain text with `operation`. The `Content-Type` header is set to `text/plain`, also for HTML. The other headers of the message are kept.

      Good to know: to use a Docling Serve server, which is the usual setup, set both `useDoclingServe` to true and `doclingServeUrl`; otherwise it runs the `docling` command-line program, which must be installed on the machine of the integration. A server started with an API key needs `authenticationScheme` set to `API_KEY` and the key in `authenticationToken`. A conversion that takes longer than `processTimeout`, 30 seconds when it is not set, fails the message; the first conversion after a Docling Serve server starts, and a large PDF on a server without a GPU, can take longer than that. The text in images, such as scanned pages, is read with OCR unless `enableOcr` is false. With `maxDocumentSize`, a larger document fails the message without being sent.
    type: object
    properties:
      documentIdHeader:
        title: Document ID Header
        description: The name of the header that holds the id of the document, such as its file name. The id is kept for `langchain4j-ingest-sink`, which writes it on every piece of the document in the store, and takes precedence over the headers it reads. Change it when the id comes in another header.
        type: string
        default: CamelLangChain4jIngestDocumentId
        example: CamelFileName
      maxDocumentSize:
        title: Max Document Size
        description: The largest document to convert, in bytes. A larger document fails the message without being converted. 0, the default, means no limit.
        type: integer
        default: 0
        example: 10485760
      doclingServeUrl:
        title: Docling Serve URL
        description: The address of a Docling Serve server, starting with `http://` or `https://`. Only used when `useDoclingServe` is true.
        type: string
        example: http://docling-serve:5001
      useDoclingServe:
        title: Use Docling Serve
        description: If true, the documents are converted by the Docling Serve server at `doclingServeUrl`. When it is not set, the `docling` command-line program is run on the machine of the integration.
        type: boolean
      operation:
        title: Operation
        description: What the document is turned into. `CONVERT_TO_MARKDOWN`, the default, gives Markdown text. `CONVERT_TO_HTML` gives a whole HTML page, with its styles, as text. `EXTRACT_TEXT` gives the text without the Markdown marks of headings and images; tables are still drawn with `|` characters.
        type: string
        enum: ["CONVERT_TO_MARKDOWN", "CONVERT_TO_HTML", "EXTRACT_TEXT"]
        default: CONVERT_TO_MARKDOWN
      enableOcr:
        title: Enable OCR
        description: If false, the text in images, such as the pages of a scanned PDF, is not read (OCR, optical character recognition), which is faster, and a scanned page gives no text. If true, OCR is asked for, in `ocrLanguage`. When it is not set, a Docling Serve server uses its own setting, which is to read the images.
        type: boolean
      ocrLanguage:
        title: OCR Language
        description: The language of the text in images, as a code that the OCR engine knows, such as `en` or `de`, or `eng` or `iso:en` for Tesseract. The engine must have a model for the language, else the message fails. With Docling Serve, it is used only when `enableOcr` is true. When it is not set, `en` is used.
        type: string
        pattern: "[A-Za-z_:-]+"
        example: de
      forceOcr:
        title: Force OCR
        description: If true, every page is read with OCR, even a page that holds text, whose text is then replaced by what OCR reads. Use it for a PDF whose text layer is wrong. Only used with Docling Serve.
        type: boolean
      ocrEngine:
        title: OCR Engine
        description: The OCR engine that reads the images, which must be installed on the Docling Serve server, else the message fails; `OCRMAC` works only on a Mac. With `TESSERACT`, also set `enableOcr` to true and `ocrLanguage` to a language installed for it. When it is not set, the server chooses. Only used with Docling Serve.
        type: string
        enum: ["AUTO", "EASYOCR", "RAPIDOCR", "TESSERACT", "TESSEROCR", "OCRMAC"]
      processTimeout:
        title: Process Timeout
        description: How long to wait for a document to be converted, in milliseconds. A slower conversion fails the message. With Docling Serve, it is how long to wait for the answer of the server. When it is not set, 30000 (30 seconds) is used, which is often too short for a large PDF.
        type: integer
        example: 300000
      documentTimeout:
        title: Document Timeout
        description: How long the Docling Serve server may work on one document, in seconds. When the time is up, the server stops, and the body holds only the part of the document it converted, without failing the message. Only used with Docling Serve. When it is not set, the server uses its own limit.
        type: integer
        example: 120
      authenticationScheme:
        title: Authentication Scheme
        description: How to send `authenticationToken` to the Docling Serve server. `API_KEY` sends it in the `X-Api-Key` header, which is what a Docling Serve server started with an API key (`DOCLING_SERVE_API_KEY`) expects. `BEARER` sends it in the `Authorization` header as `Bearer` followed by the token, for a server behind a gateway that asks for one. Set it together with `authenticationToken`.
        type: string
        enum: ["API_KEY", "BEARER"]
      authenticationToken:
        title: Authentication Token
        description: The API key or token to log in to the Docling Serve server with, sent as `authenticationScheme` says. Only used with Docling Serve.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
  dataTypes:
    in:
      headers:
        CamelLangChain4jIngestDocumentId:
          title: Document ID
          description: The id of the document, such as its file name, kept for `langchain4j-ingest-sink`. Read from this header unless `documentIdHeader` names another one.
          type: string
    out:
      default: text
      types:
        text:
          format: "text-plain"
          description: "The document as Markdown, HTML or plain text, as `operation` says."
          mediaType: text/plain
  dependencies:
    - "camel:docling"
    - "camel:kamelet"
    - "camel:bean"
  template:
    from:
      uri: kamelet:source
      steps:
        # captured before the conversion, so a document cannot forge its own identity
        - setProperty:
            name: CamelLangChain4jIngestDocumentId
            expression:
              simple:
                expression: "${header[{{documentIdHeader}}]}"
        # the size cap, present only when maxDocumentSize is set: the conversion materializes
        # the document, so an oversized one is rejected first. The precondition is evaluated
        # once, when the Kamelet is instantiated - only then does ${properties:maxDocumentSize:0}
        # see the parameter, at runtime it resolves to 0 - so the check must stay a
        # precondition, and the comparisons below use {{maxDocumentSize}}
        - choice:
            precondition: true
            when:
              - expression:
                  simple:
                    expression: "${properties:maxDocumentSize:0} > 0"
                steps:
                  # length() would read a stream to its end, so one that stream caching (on by
                  # default) left uncached is read at most one byte past the cap, within the int
                  # readNBytes takes, and closed: that byte rejects it below, else the bytes are
                  # the document. The stream is held in a property: a variable is stream-cached,
                  # which fails on an exchange that turned caching off for itself
                  - choice:
                      when:
                        - expression:
                            simple:
                              expression: "${body} is 'java.io.InputStream' && ${body} !is 'org.apache.camel.StreamCache'"
                          steps:
                            - setProperty:
                                name: documentStream
                                expression:
                                  simple:
                                    expression: "${body}"
                            - setBody:
                                expression:
                                  simple:
                                    expression: "${body.readNBytes(${min({{maxDocumentSize}},2147483646)}++)}"
                            - script:
                                expression:
                                  simple:
                                    expression: "${exchangeProperty.documentStream.close()}"
                            - removeProperty:
                                name: documentStream
                  # a file is sized by the CamelFileLength header its consumer set, without a read;
                  # the header is believed only next to that file, elsewhere it may be stale or
                  # caller-supplied. A plain java.io.File, and a cache spooled to disk, the only one
                  # past an int, are sized by their long length(). Other bodies are measured; a
                  # capped stream's size is unknown
                  - choice:
                      when:
                        - expression:
                            simple:
                              expression: "${body} is 'org.apache.camel.WrappedFile' && ${header.CamelFileLength} != null"
                          steps:
                            - choice:
                                when:
                                  - expression:
                                      simple:
                                        expression: "${header.CamelFileLength} > {{maxDocumentSize}}"
                                    steps:
                                      - throwException:
                                          exceptionType: java.lang.IllegalArgumentException
                                          message: "Document '${exchangeProperty.CamelLangChain4jIngestDocumentId}' exceeds maxDocumentSize (${header.CamelFileLength} > {{maxDocumentSize}} bytes)"
                        - expression:
                            simple:
                              expression: "${body} is 'java.io.File' || ${body} is 'org.apache.camel.converter.stream.FileInputStreamCache'"
                          steps:
                            - choice:
                                when:
                                  - expression:
                                      simple:
                                        expression: "${body.length()} > {{maxDocumentSize}}"
                                    steps:
                                      - throwException:
                                          exceptionType: java.lang.IllegalArgumentException
                                          message: "Document '${exchangeProperty.CamelLangChain4jIngestDocumentId}' exceeds maxDocumentSize (${body.length()} > {{maxDocumentSize}} bytes)"
                        - expression:
                            simple:
                              expression: "${length()} > {{maxDocumentSize}}"
                          steps:
                            - throwException:
                                exceptionType: java.lang.IllegalArgumentException
                                message: "Document '${exchangeProperty.CamelLangChain4jIngestDocumentId}' exceeds maxDocumentSize (more than {{maxDocumentSize}} bytes)"
        - convertBodyTo:
            type: byte[]
        - removeHeaders:
            pattern: CamelDocling*
        - to:
            uri: docling
            parameters:
              operationId: convert
              contentInBody: true
              authenticationScheme: "{{?authenticationScheme}}"
              authenticationToken: "RAW({{?authenticationToken}})"
              doclingServeUrl: "{{?doclingServeUrl}}"
              # the OCR switch is read as enableOCR by the docling command line, and as doOcr by Docling Serve
              doOcr: "{{?enableOcr}}"
              documentTimeout: "{{?documentTimeout}}"
              enableOCR: "{{?enableOcr}}"
              forceOcr: "{{?forceOcr}}"
              ocrEngine: "{{?ocrEngine}}"
              ocrLanguage: "{{?ocrLanguage}}"
              operation: "{{operation}}"
              processTimeout: "{{?processTimeout}}"
              useDoclingServe: "{{?useDoclingServe}}"
