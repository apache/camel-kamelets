apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: nats-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "NATS"
    camel.apache.org/kamelet.namespace: "Messaging"
  labels:
    camel.apache.org/kamelet.type: "sink"
spec:
  definition:
    title: "NATS Sink"
    description: |-
      Publishes each message to a subject on a NATS server, or to a JetStream stream that stores the messages.

      Use it to send events or commands to services that listen on NATS, such as microservices or edge devices. Use `nats-source` to receive them.

      Input: the body is the payload, as text or bytes. A Map is sent as its Java text form, such as `{a=1, b=x}`, so turn it into JSON text first, for example with `json-serialize-action`. Headers of the message, such as `Content-Type`, are sent as NATS headers.

      Output: the message is unchanged.

      Good to know: a plain NATS subject stores nothing: only the receivers subscribed at that moment get the message, unless a JetStream stream takes in the subject. With `jetstreamEnabled`, the sink waits until the stream that takes in the subject has stored the message, and sending fails with `503 No Responders Available For Request` when no stream takes it in. The stream must exist already, for example created by `nats-source`. On a server without JetStream, `jetstreamEnabled` is ignored and the message is published as plain NATS. It connects with TLS when `secure` is true. The certificate of the server is checked against the certificate authorities that Java trusts. To trust a private one with Camel JBang or Camel Main, set the application properties `camel.ssl.enabled=true`, `camel.ssl.trustStore`, `camel.ssl.trustStorePassword` and `camel.component.nats.useGlobalSslContextParameters=true`: that trust store then replaces the one of Java for every NATS connection of the application that has `secure` set. The integration fails to start when no server can be reached, or when the server refuses the login. It publishes the message and does not wait for a reply, even when the incoming message expects one, as one from `webhook-source` does. Headers that start with `CamelNats` are removed from the message first, so they cannot change what the Kamelet does.
    required:
      - topic
      - servers
    type: object
    properties:
      topic:
        title: "Subject"
        description: "The NATS subject to publish the messages to."
        example: "orders.created"
        type: string
      servers:
        title: "Servers"
        description: "The addresses of one or more NATS servers, as `host:port` or `nats://host:port`, separated by commas. The usual NATS port is 4222. For a server that needs a login, put the user and password in the address, as `nats://user:password@host:4222`, or a token, as `nats://token@host:4222`. To log in with a NATS credentials file instead, use `credentialsFilePath`."
        example: "nats://localhost:4222"
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      secure:
        title: "Secure (TLS)"
        description: "If true, it connects with TLS, which a server with TLS in its configuration requires; without it, such a server refuses the connection with `SSL required by server`. The certificate of the server is checked against the certificate authorities that Java trusts, or against the trust store set in the `camel.ssl` application properties when `camel.component.nats.useGlobalSslContextParameters` is true. An address that starts with `tls://` also connects with TLS, but uses that trust store only when `secure` is true. When not set, it connects with TLS only to a `tls://` address."
        type: boolean
      credentialsFilePath:
        title: "Credentials File"
        description: "A NATS credentials file (`.creds`) to log in with, which holds a user JWT and the NKey seed of the user. Servers with decentralized authentication, such as Synadia Cloud, use it. Start it with `file:` followed by the path of the file, or with `classpath:`, `http:` or `https:`. The `nsc generate creds` command makes one. A file that does not exist makes the integration fail to start, and a user that the server does not know is refused with `Authorization Violation`."
        example: "file:/etc/nats/user.creds"
        type: string
        pattern: "^(file|classpath|http|https):.+"
      jetstreamEnabled:
        title: "JetStream Enabled"
        description: "If true, each message is published to JetStream, and the sink waits until the stream that takes in the subject in `topic` has stored it. Sending fails when no stream takes in the subject, or when the server does not answer within a few seconds."
        type: boolean
        default: false
      jetstreamName:
        title: "JetStream Stream Name"
        description: "Not used by the sink: the message is stored by the stream that takes in the subject in `topic`, whatever its name."
        example: "ORDERS"
        type: string
      jetstreamAsync:
        title: "JetStream Async"
        description: "How the sink waits for JetStream to confirm that it stored a message. Either way it waits before it sends the next message. When the server does not answer, sending fails after about 2 seconds when false, and after 2 to 8 seconds when true. Only used when `jetstreamEnabled` is true."
        type: boolean
        default: true
  dependencies:
  - "camel:nats"
  - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: CamelNats*
        - to:
            uri: nats
            pattern: InOnly
            parameters:
              topic: "{{topic}}"
              jetstreamAsync: "{{?jetstreamAsync}}"
              jetstreamEnabled: "{{?jetstreamEnabled}}"
              jetstreamName: "{{?jetstreamName}}"
              servers: "RAW({{servers}})"
              secure: "{{?secure}}"
              credentialsFilePath: "{{?credentialsFilePath}}"
