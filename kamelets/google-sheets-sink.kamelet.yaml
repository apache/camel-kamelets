apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: google-sheets-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Google Sheets"
    camel.apache.org/kamelet.namespace: "GCP"
  labels:
    camel.apache.org/kamelet.type: "sink"
spec:
  definition:
    title: "Google Sheets Sink"
    description: |-
      Writes each message as one or more rows to a Google Sheets spreadsheet, either appended after the last row or written over a given range of cells.

      Use it to collect data in a spreadsheet that people can read and share, such as form submissions, orders or daily figures. To read the rows of a spreadsheet, use `google-sheets-source`.

      Input: the body is JSON text: a JSON object for one row, or a JSON array of objects for several rows. The keys are the column letters of the cells to write, such as `{"A": "Alice", "B": 3}`, or the names set in `columnNames`. Only the columns of `range` are written, so set `range` to cover them, such as `A:B`.

      Output: when it is used inside a route, the body afterwards is the response of Google Sheets, which says which cells were written.

      Good to know: without `range`, only column `A` is written. With the default `operation` of `append`, the rows are added after the last row of the table found in `range`; with `update`, they overwrite the cells of `range`. It logs in to Google either with OAuth (an OAuth client of a Google Cloud project, and an access token and a refresh token of the Google account that owns or may edit the spreadsheet), or with the key of a service account in `serviceAccountKey` together with `scopes`; share the spreadsheet with the email address of the service account as an editor, or set `delegate`.
    required:
      - spreadsheetId
    type: object
    properties:
      spreadsheetId:
        title: Spreadsheet ID
        description: The ID of the spreadsheet, the long part of its address between `/d/` and `/edit`, as in `https://docs.google.com/spreadsheets/d/<ID>/edit`.
        type: string
        example: 1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms
      clientId:
        title: Client ID
        description: The client ID of an OAuth client, created in the Google Cloud console under APIs & Services > Credentials, in a project where the Google Sheets API is enabled. Not needed when logging in with `serviceAccountKey`.
        type: string
        format: password
        x-descriptors:
          - urn:camel:group:credentials
      clientSecret:
        title: Client Secret
        description: The client secret of the OAuth client of `clientId`. Not needed when logging in with `serviceAccountKey`.
        type: string
        format: password
        x-descriptors:
          - urn:camel:group:credentials
      accessToken:
        title: Access Token
        description: An OAuth 2 access token of the Google account, with access to Google Sheets. It expires after about an hour; the Kamelet then gets a new one with `refreshToken`. Not needed when logging in with `serviceAccountKey`.
        type: string
        format: password
        x-descriptors:
          - urn:camel:group:credentials
      refreshToken:
        title: Refresh Token
        description: An OAuth 2 refresh token of the Google account, which the Kamelet uses to get a new access token when the current one expires. You get it together with the access token, for example from the Google OAuth 2.0 Playground. Not needed when logging in with `serviceAccountKey`.
        type: string
        format: password
        x-descriptors:
          - urn:camel:group:credentials
      serviceAccountKey:
        title: Service Account Key
        description: "The JSON key of a Google service account, to log in with instead of OAuth: `file:` followed by the path of the key file, `classpath:` followed by a resource of the application, or `base64:` followed by the Base64 encoding of the key. Create the key in the Google Cloud console under IAM & Admin > Service Accounts > Keys. The service account writes to the spreadsheets that are shared with its email address as an editor, or those of the user in `delegate`. It needs `scopes`. Only used when `clientId` and `clientSecret` are not set. When none of the three is set, the Application Default Credentials are used: the key file named in the `GOOGLE_APPLICATION_CREDENTIALS` environment variable, or the service account of the Google Cloud machine it runs on."
        type: string
        format: password
        x-descriptors:
          - urn:camel:group:credentials
        pattern: "^(file|classpath|base64):.+"
        example: file:/etc/google/service-account.json
      delegate:
        title: Delegate User
        description: The email address of a user of your Google Workspace, whose spreadsheets the service account of `serviceAccountKey` writes to on their behalf. A Workspace administrator must first allow the client ID of the service account, with the scopes of `scopes`, under Security > Access and data control > API controls > Domain-wide delegation. Only used with `serviceAccountKey`.
        type: string
        pattern: "^[^@\\s]+@[^@\\s]+$"
        example: alice@example.com
      scopes:
        title: Scopes
        description: "The permissions to ask Google for, as URLs separated by commas, such as `https://www.googleapis.com/auth/spreadsheets`. Needed with `serviceAccountKey` and with the Application Default Credentials: without them, the login asks Google for no permission at all. Leave it unset with `clientId` and `clientSecret`; with them, setting it makes the Kamelet fail."
        type: string
        pattern: "^https://[^,\\s]+(,https://[^,\\s]+)*$"
        example: https://www.googleapis.com/auth/spreadsheets
      applicationName:
        title: Application Name
        description: A name for your application, sent to Google with each call, such as `my-company-sheets/1.0`.
        type: string
        example: my-company-sheets/1.0
      operation:
        title: Operation Mode
        description: "`append` adds the rows after the last row of the table found in `range`; `update` writes them over the cells of `range`."
        type: string
        enum: [ "update", "append" ]
        default: append
        example: append
      range:
        title: Cells Range
        description: The cells to write to, in A1 notation, optionally with the name of the sheet, such as `Sheet1!A:C` or `A1:B3`. Its columns decide which keys of each JSON object are written.
        type: string
        example: "Sheet1!A:C"
      majorDimension:
        title: Major Dimension
        description: "`ROWS` writes each JSON object as a row; `COLUMNS` writes each JSON object as a column, with the keys `#1`, `#2` and so on for the row numbers."
        type: string
        enum: [ "COLUMNS", "ROWS" ]
        default: "ROWS"
        example: "ROWS"
      columnNames:
        title: Column Names
        description: Names to use as keys in the JSON objects instead of the column letters, separated by commas, in the order of the columns of `range`. For example, with `range` `A:B`, `name,qty` reads the key `name` into column A and `qty` into column B.
        type: string
        default: "A"
        example: name,qty
      valueInputOption:
        title: Value Input Option
        description: "`USER_ENTERED` reads each value as if a person typed it, so `=SUM(A1:A3)` becomes a formula and `3` a number; `RAW` stores each value as it is."
        type: string
        enum: [ "USER_ENTERED", "RAW" ]
        default: "USER_ENTERED"
        example: "USER_ENTERED"
  dataTypes:
    in:
      default: json-struct
      types:
        json-struct:
          format: "google-sheets:application-x-struct"
          description: Special Json representation of Google Sheets ValueRange object with just row and column values as a generic JsonNode.
          headers:
            CamelGoogleSheets.range:
              title: Range
              description: Cells range to write data to.
              default: A:A
              type: string
            CamelGoogleSheets.spreadsheetId:
              title: Spreadsheet id
              description: The Spreadsheet ID to be used as identifier.
              type: string
            CamelGoogleSheets.majorDimension:
              title: Major dimension
              description: Specifies the major dimension that the given values should use (ROWS or COLUMNS).
              default: ROWS
              type: string
            CamelGoogleSheets.columnNames:
              title: Column Names
              description: Optional custom column names that map to cell coordinates based on their position.
              default: A
              type: string
            CamelGoogleSheets.valueInputOption:
              title: Value Input Option
              description: Controls how the entered values should be be interpreted when adding them.
              default: USER_ENTERED
              type: string
          mediaType: application/json
  dependencies:
    - "camel:jackson3"
    - "camel:kamelet"
    - "camel:google-sheets"
  template:
    from:
      uri: kamelet:source
      steps:
        - setHeader:
            name: CamelGoogleSheets.spreadsheetId
            expression:
              simple:
                expression: "{{spreadsheetId}}"
        - setHeader:
            name: CamelGoogleSheets.range
            expression:
              simple:
                expression: "{{?range}}"
        - setHeader:
            name: CamelGoogleSheets.majorDimension
            expression:
              simple:
                expression: "{{?majorDimension}}"
        - setHeader:
            name: CamelGoogleSheets.columnNames
            expression:
              simple:
                expression: "{{?columnNames}}"
        - setHeader:
            name: CamelGoogleSheets.valueInputOption
            expression:
              simple:
                expression: "{{?valueInputOption}}"
        - transformDataType:
            toType: google-sheets:application-x-struct
        - to:
            uri: google-sheets
            parameters:
              apiName: data
              methodName: "{{operation}}"
              accessToken: "RAW({{?accessToken}})"
              applicationName: "{{?applicationName}}"
              clientId: "{{?clientId}}"
              clientSecret: "RAW({{?clientSecret}})"
              delegate: "RAW({{?delegate}})"
              range: "{{?range}}"
              refreshToken: "RAW({{?refreshToken}})"
              scopes: "{{?scopes}}"
              serviceAccountKey: "RAW({{?serviceAccountKey}})"
              spreadsheetId: "{{spreadsheetId}}"
