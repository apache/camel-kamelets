apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: oracle-database-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "SQL"
    camel.apache.org/kamelet.namespace: "Database"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "Oracle Database Source"
    description: |-
      Runs an SQL query in an Oracle Database database again and again, and sends each row it returns as a message, as a JSON object.

      Use it to pick up the rows that another application adds to a table, such as new orders or events, and pass them on to another system. To write rows, use `oracle-database-sink`.

      Output: the body is one row as JSON text, an object with the column names as keys, such as `{"ID":1,"USERNAME":"oscerd","CITY":"Rome"}` (Oracle gives the names in upper case). The `Content-Type` header is `application/json`.

      Good to know: the query runs again half a second after the previous run, so the same rows are sent again and again, unless `consumedQuery` marks or deletes each row once it is sent and `query` leaves such rows out: for example `SELECT * FROM accounts WHERE processed = false` with `UPDATE accounts SET processed = true WHERE id = :#id`. When the next step fails for a row, `consumedQuery` is not run for it, and the row is read again. A query that finds no rows sends nothing. `query` cannot contain `?`. The format of date and time columns in the JSON depends on the Camel version. The JDBC driver of Oracle Database is not included: add `mvn:com.oracle.database.jdbc:ojdbc17` to the dependencies of the integration. Camel JBang (`camel run`) adds it by itself.
    required:
      - serverName
      - username
      - password
      - query
      - databaseName
    type: object
    properties:
      serverName:
        title: Server Name
        description: The host name or IP address of the Oracle Database server, without the port.
        type: string
        example: db.example.com
      serverPort:
        title: Server Port
        description: The port of the Oracle listener on the server. Oracle uses 1521 unless it was set up otherwise.
        type: string
        default: 1521
      username:
        title: Username
        description: The database user to log in as. It needs the rights to run the queries of this Kamelet on their tables.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      password:
        title: Password
        description: The password of the database user `username`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      query:
        title: Query
        description: The SQL query to run on each poll, usually a SELECT. Each row it returns becomes a message.
        type: string
        example: SELECT * FROM accounts WHERE processed = false
      databaseName:
        title: Database Name
        description: The service name of the database to connect to, such as `FREEPDB1` or `ORCLPDB1`. It is a service name, not a SID.
        type: string
        example: ORCLPDB1
      consumedQuery:
        title: Consumed Query
        description: An SQL statement to run after each row has been sent on, to mark the row as read or to delete it, so that `query` does not return it again. Write `:#column` where the value of a column of that row goes, such as `:#id`. When it is not set, nothing is changed, and the same rows are read on every poll.
        type: string
        example: UPDATE accounts SET processed = true WHERE id = :#id
  types:
    out:
      mediaType: application/json
  dataTypes:
    out:
      headers:
        Content-Type:
          title: Content Type
          description: Always `application/json`, as the body is a JSON object.
          type: string
  dependencies:
  - "camel:jackson3"
  - "camel:kamelet"
  - "camel:sql"
  - "mvn:org.apache.commons:commons-dbcp2:2.14.0"
  template:
    beans:
      - name: local-sql-oracle-source
        type: "#class:org.apache.camel.component.sql.SqlComponent"
        properties:
          autowiredEnabled: "false"
      - name: dsBean
        type: "#class:org.apache.commons.dbcp2.BasicDataSource"
        properties:
          username: "{{username}}"
          password: "{{password}}"
          url: "jdbc:oracle:thin:@{{serverName}}:{{serverPort}}/{{databaseName}}"
          driverClassName: oracle.jdbc.driver.OracleDriver
    from:
      uri: "{{local-sql-oracle-source}}:{{query}}?dataSource=#bean:{{dsBean}}&onConsume=RAW({{?consumedQuery}})"
      steps:
        - marshal:
            json: {}
        - to:
            uri: kamelet:sink
