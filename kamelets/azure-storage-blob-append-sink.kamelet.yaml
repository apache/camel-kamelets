apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: azure-storage-blob-append-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Azure Storage Blob"
    camel.apache.org/kamelet.namespace: "Azure"
  labels:
    camel.apache.org/kamelet.type: "sink"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "Azure Storage Blob Append Sink"
    description: |-
      Adds each message at the end of an append blob in Azure Blob Storage, named after the `file` header, and creates the blob when it does not exist yet.

      Use it to collect log lines, audit records or CSV rows from many messages into one growing blob. To write each message as a blob of its own, use `azure-storage-blob-sink`.

      Input: the body is the data to add: text, bytes or a stream. Text is turned into bytes before it is added, and the `Content-Type` header is set to `application/octet-stream`. A file is passed on as it is, and so is a stream, unless stream caching is turned off. It is added as it is, so end each line with a line break yourself. Turn structured data such as a Map into JSON text first, for example with `json-serialize-action`. The `file` header (or `ce-file`) is the name of the blob, such as `logs/app.log`. Without it, each message goes to a new blob with a generated unique name.

      Output: the body afterwards is `true`, the `Content-Type` header is `application/octet-stream`, and headers such as `CamelAzureStorageBlobAppendOffset` and `CamelAzureStorageBlobCommittedBlockCount` describe the append.

      Good to know: the container must exist: a missing container fails the message. A name that is already used by a block blob, such as one written by `azure-storage-blob-sink`, fails the message too. Headers that start with `CamelAzureStorageBlob` are removed from the message first, so they cannot change what the Kamelet does.
    required:
      - accountName
      - containerName
    type: object
    properties:
      accountName:
        title: Account Name
        description: The name of the storage account, as shown in the Azure portal under Storage accounts. It is the first part of the address of the account, `https://<accountName>.blob.core.windows.net`.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
        example: mystorageaccount
      containerName:
        title: Container Name
        description: The name of the container in the storage account that holds the append blobs.
        type: string
        example: logs
      accessKey:
        title: Access Key
        description: "An access key of the storage account, from the Azure portal: the storage account, then Security + networking, then Access keys. Used when `credentialType` is `SHARED_ACCOUNT_KEY`, the default."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      clientId:
        title: Client ID
        description: The application (client) ID of an app registration (service principal) in Microsoft Entra ID that has access to the storage account, from the Overview page of the app registration in the Azure portal. Used with `clientSecret` and `tenantId` when `credentialType` is `AZURE_IDENTITY`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      clientSecret:
        title: Client Secret
        description: "A client secret of the app registration, from the Azure portal: the app registration, then Certificates & secrets. Used with `clientId` and `tenantId` when `credentialType` is `AZURE_IDENTITY`."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      tenantId:
        title: Tenant ID
        description: The directory (tenant) ID of the app registration, from its Overview page in the Azure portal. Used with `clientId` and `clientSecret` when `credentialType` is `AZURE_IDENTITY`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      sasToken:
        title: SAS Token
        description: "A shared access signature (SAS) token for the storage account or for the container, from the Azure portal: the storage account, then Security + networking, then Shared access signature, or the container, then Shared access tokens. Used when `credentialType` is `AZURE_SAS`. Give the token only, such as `sv=2022-11-02&ss=b&srt=sco&sp=rw&se=2026-12-31T00:00:00Z&spr=https&sig=...`, with or without the leading `?`, not the whole SAS URL. It needs the Read and Write permissions."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
        pattern: "^\\??[A-Za-z]+=[^&]*(&[A-Za-z]+=[^&]*)*$"
      credentialType:
        title: Credential Type
        description: "How to log in to the storage account. `SHARED_ACCOUNT_KEY`, the default, uses `accessKey`. `AZURE_SAS` uses `sasToken`. `AZURE_IDENTITY` uses `clientId`, `clientSecret` and `tenantId` when all three are set, and otherwise the Azure identity of the environment, such as the `AZURE_CLIENT_ID`, `AZURE_TENANT_ID` and `AZURE_CLIENT_SECRET` environment variables, a managed identity or the Azure CLI login. Do not use `CLIENT_SECRET`: it does not use the three client options."
        type: string
        default: "SHARED_ACCOUNT_KEY"
        enum: ["SHARED_ACCOUNT_KEY", "AZURE_SAS", "AZURE_IDENTITY", "CLIENT_SECRET"]
  dataTypes:
    in:
      default: binary
      types:
        binary:
          format: "application-octet-stream"
          description: "The content of the file, as bytes. A file, and a stream while stream caching is on, are passed on as they are."
          mediaType: application/octet-stream
      headers:
        file:
          title: File Name
          description: The name of the append blob to add to, such as `logs/app.log`. Without it (and without `ce-file`), each message goes to a new blob with a generated unique name.
          type: string
        ce-file:
          title: File Name
          description: The name of the append blob, as a CloudEvents extension. Used when `file` is not set.
          type: string
  dependencies:
    - "camel:azure-storage-blob"
    - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: CamelAzureStorageBlob*
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[file]}"
                steps:
                  - setHeader:
                      name: CamelAzureStorageBlobBlobName
                      expression:
                        simple:
                          expression: "${header[file]}"
              - expression:
                  simple:
                    expression: "${header[ce-file]}"
                steps:
                  - setHeader:
                      name: CamelAzureStorageBlobBlobName
                      expression:
                        simple:
                          expression: "${header[ce-file]}"
            otherwise:
              steps:
                - setHeader:
                    name: CamelAzureStorageBlobBlobName
                    expression:
                      simple:
                        expression: "${exchangeId}"
        - to:
            uri: "azure-storage-blob://{{accountName}}/{{containerName}}?accessKey=RAW({{?accessKey}})&azureClientId=RAW({{?clientId}})&azureClientSecret=RAW({{?clientSecret}})&azureTenantId=RAW({{?tenantId}})&blobType=appendBlob&credentialType={{credentialType}}&operation=commitAppendBlob&sasToken=RAW({{?sasToken}})"
