apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: opensearch-search-action
  labels:
    camel.apache.org/kamelet.type: "action"
    camel.apache.org/kamelet.verified: "true"
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/kamelet.group: "OpenSearch"
    camel.apache.org/kamelet.namespace: "Search"
    camel.apache.org/provider: "Apache Software Foundation"
spec:
  definition:
    title: "OpenSearch Search Action"
    description: |-
      Searches an index of OpenSearch for each message, and gives back the documents found, as a JSON array.

      Use it to look something up in the middle of a flow, for example to find the customer of an order, or to enrich an event with the records that match it. To store documents in OpenSearch, use `opensearch-index-sink`; for Elasticsearch, use `elasticsearch-search-action`.

      Input: the body is the search. Text that starts with `{` is a search in the Query DSL of OpenSearch, as JSON text: either a query alone, such as `{"match": {"city": "Oslo"}}`, or the body of a `_search` request with a `query`, such as `{"query": {"match_all": {}}, "sort": [{"age": "desc"}]}`. Any other text is searched for as words in all the fields of the documents: `Oslo Rome` finds the documents that contain Oslo or Rome. An empty body finds nothing. Bytes are read as text, and a Map (parsed JSON) is used as the Query DSL. With `queryDsl` set to false, every body is searched for as words, also one that starts with `{`. A vector search is a Query DSL search too: `{"query": {"knn": {"embedding": {"vector": [0.1, 0.2, 0.3], "k": 3}}}, "_source": ["name"]}` finds the documents whose vector in the `knn_vector` field `embedding` is closest, best first, and gives only their `name`; the index needs the setting `index.knn`, and `k` is counted for each part (segment) of the index, so more than `k` documents can match.

      Output: the body is a JSON array, as text, with the documents found (their `_source`, with the id of the document added as `_id`), best match first unless the search has a `sort`, such as `[{"name": "Alice Smith", "city": "Oslo", "_id": "1"}]`; an empty array `[]` when nothing matches. The `CamelOpensearchTotalHits` header is the number of documents that match, which can be more than the documents in the body. The `Content-Type` header is `application/json`.

      Good to know: the body holds at most `size` documents; a `size` in the search is ignored. OpenSearch stops counting the matches at 10000, so a larger number is given as 10000. A search with `"_source": false` gives an empty array. A search that is not valid JSON, an index that does not exist, or a query that OpenSearch rejects, fails the message. Headers that start with `CamelOpensearch` are removed from the message first, so they cannot change the index, the operation or the size. Whoever writes the body can read every document of the index, and the Query DSL can also look up values in other indices, such as a `terms` query that reads its terms from a document of another index: log in as a user, or with an API key, that can read only the index to search. When the body comes from untrusted input or from an AI agent, such as through `ai-tool-source`, set `queryDsl` to false, so that the body can only be words to search for. It connects with TLS by default (`enableSSL`); for a self-signed certificate, give the certificate of its certificate authority (CA) in `certificate`, and for a client certificate (mutual TLS), a trust store or a TLS version, an `SSLContextParameters` object in `sslContextParameters`.
    required:
      - clusterName
      - hostAddresses
      - indexName
    type: object
    properties:
      user:
        title: Username
        description: The OpenSearch user to log in as, such as `admin`. Leave it out for a cluster without security.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      password:
        title: Password
        description: The password of the OpenSearch user in `user`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      apiKey:
        title: API Key
        description: An API key to log in with, instead of `user` and `password`. It is the token, which starts with `os_`, that OpenSearch gives when the API token is created (OpenSearch 3.7 or later). It is sent in the `Authorization` header, only to the nodes of the cluster. Set either `apiKey` or `user`, not both.
        type: string
        example: "os_my-token"
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      enableSSL:
        title: Enable SSL
        description: If true, it connects with HTTPS. Set it to false for a cluster that is reached with plain HTTP.
        type: boolean
        default: true
      hostAddresses:
        title: Host Addresses
        description: The address of the OpenSearch HTTP API, as `host:port`, or several nodes separated by commas. The port is 9200 by default.
        type: string
        example: opensearch-cluster-master:9200
      clusterName:
        title: OpenSearch Cluster Name
        description: The name of the OpenSearch cluster. Required, but not checked against the cluster.
        type: string
        example: quickstart
      indexName:
        title: Index in OpenSearch
        description: The name of the index to search.
        type: string
        example: customers
      size:
        title: Size
        description: The largest number of documents to give back in the body, for each message. It takes precedence over a `size` in the search.
        type: integer
        default: 10
      queryDsl:
        title: Query DSL
        description: Whether a body that starts with `{`, or a Map, is a search in the Query DSL. When it is false, every body is searched for as words in all the fields, so that whoever writes the body cannot run other queries; set it to false when the body comes from untrusted input or from an AI agent.
        type: boolean
        default: true
      sslContextParameters:
        title: SSL Context Parameters
        description: For TLS settings that `certificate` cannot give, such as a client certificate (mutual TLS), a trust store, or a TLS version, an `SSLContextParameters` object defined in the application, as `#bean:` followed by its name. It takes precedence over `certificate`; set one or the other.
        type: string
        example: "#bean:mySslContext"
      certificate:
        title: Certificate
        description: The certificate of the certificate authority (CA) that signed the certificate of the cluster, such as the `root-ca.pem` file of the OpenSearch demo configuration, as a PEM or DER file encoded in base64 on one line, such as the output of `base64 -w0 root-ca.pem` (`base64 -i root-ca.pem` on macOS). Needed when the cluster uses a self-signed certificate, or one signed by a private CA. When it is set, only this CA is trusted; when it is not set, the certificates that Java trusts are used.
        type: string
      connectionTimeout:
        title: Connection Timeout
        description: How long to wait for the connection to OpenSearch, in milliseconds. When it is not set, it is 30000, which is 30 seconds.
        type: integer
        example: 5000
      socketTimeout:
        title: Socket Timeout
        description: How long to wait for data from OpenSearch, in milliseconds. When OpenSearch sends nothing for this long, the message fails. When it is not set, it is 30000, which is 30 seconds.
        type: integer
        example: 10000
  dataTypes:
    # No 'default:' on purpose: the body is made text in the template. See #3117.
    in:
      headers: {}
    out:
      headers:
        CamelOpensearchTotalHits:
          title: Total Hits
          description: 'The number of documents that match the search, counted up to 10000. It has no value when the search sets `"track_total_hits": false`.'
          type: integer
  dependencies:
    - "camel:jackson3"
    - "camel:kamelet"
    - "camel:opensearch"
  template:
    beans:
      - name: local-opensearch
        type: "#class:org.apache.camel.component.opensearch.OpensearchComponent"
        properties:
          user: "{{?user}}"
          password: "{{?password}}"
          apiKey: "{{?apiKey}}"
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: "CamelOpensearch*"
        - choice:
            when:
              # queryDsl=false: every body is searched for as words, whatever it holds
              - expression:
                  simple:
                    expression: "'{{queryDsl}}' == 'false'"
                steps:
                  - convertBodyTo:
                      type: java.lang.String
                  - setBody:
                      expression:
                        simple:
                          expression: '{"query": {"multi_match": {"query": "${escape(json)}"} } }'
              - expression:
                  simple:
                    expression: "${body} !is 'java.util.Map'"
                steps:
                  - convertBodyTo:
                      type: java.lang.String
                  - choice:
                      when:
                        - expression:
                            simple:
                              expression: "${body.trim()} !startsWith '{'"
                          steps:
                            - setBody:
                                expression:
                                  simple:
                                    expression: '{"query": {"multi_match": {"query": "${escape(json)}"} } }'
        - to:
            uri: "{{local-opensearch}}:{{clusterName}}?operation=Search&indexName={{indexName}}&size={{size}}&documentClass=java.util.Map&hostAddresses={{hostAddresses}}&enableSSL={{enableSSL}}&certificatePath=RAW(base64:{{?certificate}})&sslContextParameters={{?sslContextParameters}}&connectionTimeout={{?connectionTimeout}}&socketTimeout={{?socketTimeout}}"
        - removeHeaders:
            pattern: "CamelOpensearch*"
        - setHeader:
            name: CamelOpensearchTotalHits
            expression:
              simple:
                expression: "${body?.total.value}"
        - setBody:
            expression:
              simple:
                expression: "${forEach(${body.hits},${mapAdd(${body.source},_id,${body.id})})}"
        - marshal:
            json: {}
        - convertBodyTo:
            type: java.lang.String
