apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: spring-rabbitmq-source
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "RabbitMQ"
    camel.apache.org/kamelet.namespace: "Messaging"
  labels:
    camel.apache.org/kamelet.type: "source"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "RabbitMQ Source"
    description: |-
      Receives each message from a queue in a RabbitMQ broker, and can create that queue and bind it to an exchange with a routing key.

      Use it to process work or events that other applications publish to RabbitMQ. Use `spring-rabbitmq-sink` to publish them.

      Output: the body is text when the content type of the message starts with `text`, and bytes otherwise. The headers of the RabbitMQ message become headers, along with `CamelSpringRabbitmqExchangeName`, `CamelSpringRabbitmqRoutingKey` and `CamelSpringRabbitmqContentType`.

      Good to know: with `autoDeclare` false, the default, the queue must exist already, bound to the exchange; until it does, the source keeps trying again. With `autoDeclare` true, it creates the exchange, as a `direct` exchange unless `exchangeType` says otherwise, the queue in `queues` and the binding with `routingKey`; when the exchange or the queue exists already with other settings, such as another type or another dead letter exchange, the source fails to start. Without `queues`, it reads from a new queue with a generated name. A message whose processing fails is tried 6 times, one second apart (see `maximumRetryAttempts` and `retryDelay`), and then dropped, or sent to the dead letter exchange of the queue when it has one, such as the one in `deadLetterExchange`. One consumer processes one message at a time; `concurrentConsumers` processes several in parallel, so not in order. It connects with no TLS unless `protocol` is `amqps`. With `amqps`, the certificate of the broker must be trusted by Java, or by the trust store in `sslTruststoreLocation`, and must name the host in `host`; otherwise it cannot connect.
    required:
      - host
      - port
      - exchangeName
    type: object
    properties:
      host:
        title: "Server Address"
        description: "The host name or IP address of the RabbitMQ broker."
        type: string
        example: "localhost"
      port:
        title: "Server Port"
        description: "The port of the RabbitMQ broker: usually 5672, or 5671 for `amqps`."
        type: integer
        example: 5672
      routingKey:
        title: "Routing Key"
        description: "The routing key that binds the queue to the exchange, when `autoDeclare` is true. A `direct` exchange then routes to the queue the messages sent with this key."
        example: "new-order"
        type: string
      username:
        title: "Username"
        description: "The user name to log in to RabbitMQ with. When it is not set, `guest` is used."
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      password:
        title: "Password"
        description: "The password to log in to RabbitMQ with, for the user `username`."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      exchangeName:
        title: "Exchange Name"
        description: "The name of the exchange that the queue is bound to."
        example: "orders"
        type: string
      queues:
        title: "Queue Name"
        description: "The queue to receive the messages from. When it is not set, a new queue with a generated name is used, which only makes sense with `autoDeclare` true."
        example: "orders"
        type: string
      autoDeclare:
        title: "Create Exchange and Queue"
        description: "If true, the source creates the exchange (as a `direct` exchange) and the queue in `queues`, and binds them with `routingKey`, when it starts. If false, they must exist already."
        type: boolean
        default: false
      vhost:
        title: "Virtual Host"
        description: "The virtual host of the broker to connect to, which holds the exchanges and queues. RabbitMQ has the virtual host `/` from the start."
        type: string
        default: "/"
      protocol:
        title: "Protocol"
        description: "`amqp` for a plain connection, or `amqps` for a connection encrypted with TLS, which checks the certificate of the broker and its host name."
        type: string
        enum: ["amqp", "amqps"]
        default: "amqp"
      sslTruststoreLocation:
        title: "SSL Truststore Location"
        description: "The location of a trust store, in JKS or PKCS12 format, with the certificate of the authority that signed the certificate of the broker, such as `file:/etc/rabbitmq/truststore.p12`, or `classpath:truststore.p12` for one on the classpath. A path without `file:` is looked up on the classpath. Needed only with `amqps` when the broker uses a certificate that Java does not trust by default, such as one from a private or self-signed authority. Not used with `amqp`."
        type: string
        example: "file:/etc/rabbitmq/truststore.p12"
      sslTruststorePassword:
        title: "SSL Truststore Password"
        description: "The password of the trust store in `sslTruststoreLocation`."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      exchangeType:
        title: "Exchange Type"
        description: "The type of the exchange that the source creates when `autoDeclare` is true: `direct`, `fanout`, `headers` or `topic`. When it is not set, it is `direct`. With `topic`, `routingKey` can be a pattern: `orders.*` matches `orders.new`, and `orders.#` also matches `orders.eu.new`. Not used when `autoDeclare` is false."
        type: string
        enum: ["direct", "fanout", "headers", "topic"]
      concurrentConsumers:
        title: "Concurrent Consumers"
        description: "How many consumers receive from the queue at the same time, each on its own channel, so that as many messages are processed in parallel. When it is not set, there is one consumer, and the messages are processed one at a time."
        type: integer
        example: 4
      prefetchCount:
        title: "Prefetch Count"
        description: "How many messages RabbitMQ sends ahead to each consumer, before they are acknowledged. When it is not set, it is 250."
        type: integer
        example: 10
      acknowledgeMode:
        title: "Acknowledge Mode"
        description: "When RabbitMQ removes a message from the queue: with `AUTO`, once it has been processed, or has failed after the retries; with `NONE`, as soon as it is delivered, so a message whose processing fails is lost and does not go to the dead letter exchange. When it is not set, `AUTO` is used."
        type: string
        enum: ["AUTO", "NONE"]
      maximumRetryAttempts:
        title: "Maximum Retry Attempts"
        description: "How many times a message whose processing fails is tried again, after the first try. When it is not set, it is tried again 5 times, so 6 times in all. With 0, it is not tried again."
        type: integer
        example: 3
      retryDelay:
        title: "Retry Delay"
        description: "How long to wait before a failing message is tried again, in milliseconds. When it is not set, it waits 1000 milliseconds."
        type: integer
        example: 5000
      deadLetterExchange:
        title: "Dead Letter Exchange"
        description: "The exchange that RabbitMQ sends a message to when its processing still fails after the retries. The source creates this exchange, and creates the queue in `queues` with it as its dead letter exchange. Needs `autoDeclare` true; with `autoDeclare` false, it is not used, and the dead letter exchange must be set on the queue in RabbitMQ, for example with a policy."
        type: string
        example: "orders.dlx"
        pattern: "^[A-Za-z0-9_.:-]+$"
      deadLetterRoutingKey:
        title: "Dead Letter Routing Key"
        description: "The routing key that a failed message is sent to `deadLetterExchange` with, and that binds `deadLetterQueue` to it. When it is not set, a failed message keeps the routing key it was published with. Needs `deadLetterExchange` and `autoDeclare` true."
        type: string
        example: "failed"
        pattern: "^[A-Za-z0-9_.:-]+$"
      deadLetterQueue:
        title: "Dead Letter Queue"
        description: "A queue that the source creates and binds to `deadLetterExchange` with `deadLetterRoutingKey`, to keep the failed messages. Needs `deadLetterExchange`, `deadLetterRoutingKey` and `autoDeclare` true; without `deadLetterRoutingKey`, the source fails to start."
        type: string
        example: "orders.dlq"
        pattern: "^[A-Za-z0-9_.:-]+$"
      deadLetterExchangeType:
        title: "Dead Letter Exchange Type"
        description: "The type of the exchange that the source creates in `deadLetterExchange`: `direct`, `fanout`, `headers` or `topic`. When it is not set, it is `direct`."
        type: string
        enum: ["direct", "fanout", "headers", "topic"]
  dataTypes:
    # No 'default:' here on purpose: the content type of the message decides whether the body is text
    # or bytes. See #3117.
    out:
      headers:
        CamelSpringRabbitmqExchangeName:
          title: "Exchange Name"
          description: "The exchange the message was published to."
          type: string
        CamelSpringRabbitmqRoutingKey:
          title: "Routing Key"
          description: "The routing key the message was published with."
          type: string
        CamelSpringRabbitmqContentType:
          title: "Content Type"
          description: "The content type of the message, such as `text/plain`."
          type: string
  dependencies:
    - "camel:spring-rabbitmq"
    - "camel:kamelet"
  template:
    beans:
      - name: rabbitConnectionFactory
        type: "#class:com.rabbitmq.client.ConnectionFactory"
        builderClass: org.springframework.amqp.rabbit.connection.RabbitConnectionFactoryBean
        builderMethod: getObject
        properties:
          singleton: false
          uri: "{{protocol}}://{{host}}:{{port}}"
          virtualHost: "{{vhost}}"
          username: "{{?username}}"
          password: "{{?password}}"
          trustStore: "{{?sslTruststoreLocation}}"
          trustStorePassphrase: "{{?sslTruststorePassword}}"
      - name: connectionFactory
        type: "#class:org.springframework.amqp.rabbit.connection.CachingConnectionFactory"
        constructors:
          0: "#bean:{{rabbitConnectionFactory}}"
    from:
      uri: "spring-rabbitmq://{{exchangeName}}?autoDeclare={{autoDeclare}}&connectionFactory=#bean:{{connectionFactory}}&queues={{?queues}}&routingKey={{?routingKey}}&exchangeType={{?exchangeType}}&concurrentConsumers={{?concurrentConsumers}}&prefetchCount={{?prefetchCount}}&acknowledgeMode={{?acknowledgeMode}}&maximumRetryAttempts={{?maximumRetryAttempts}}&retryDelay={{?retryDelay}}&deadLetterExchange={{?deadLetterExchange}}&deadLetterRoutingKey={{?deadLetterRoutingKey}}&deadLetterQueue={{?deadLetterQueue}}&deadLetterExchangeType={{?deadLetterExchangeType}}"
      steps:
        - to:
            uri: kamelet:sink
