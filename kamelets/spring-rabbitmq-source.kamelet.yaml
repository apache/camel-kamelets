apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: spring-rabbitmq-source
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "RabbitMQ"
    camel.apache.org/kamelet.namespace: "Messaging"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "RabbitMQ Source"
    description: |-
      Receives each message from a queue in a RabbitMQ broker, and can create that queue and bind it to an exchange with a routing key.

      Use it to process work or events that other applications publish to RabbitMQ. Use `spring-rabbitmq-sink` to publish them.

      Output: the body is text when the content type of the message starts with `text`, and bytes otherwise. The headers of the RabbitMQ message become headers, along with `CamelSpringRabbitmqExchangeName`, `CamelSpringRabbitmqRoutingKey` and `CamelSpringRabbitmqContentType`.

      Good to know: with `autoDeclare` false, the default, the queue must exist already, bound to the exchange; until it does, the source keeps trying again. With `autoDeclare` true, it creates the exchange as a `direct` exchange, the queue in `queues` and the binding with `routingKey`. Without `queues`, it reads from a new queue with a generated name. A message whose processing fails is tried 5 times, one second apart, and then dropped, or sent to the dead letter exchange of the queue when RabbitMQ has one. It connects with no TLS unless `protocol` is `amqps`. With `amqps`, the certificate of the broker must be trusted by Java, or by the trust store in `sslTruststoreLocation`, and must name the host in `host`; otherwise it cannot connect.
    required:
      - host
      - port
      - exchangeName
    type: object
    properties:
      host:
        title: "Server Address"
        description: "The host name or IP address of the RabbitMQ broker."
        type: string
        example: "localhost"
      port:
        title: "Server Port"
        description: "The port of the RabbitMQ broker: usually 5672, or 5671 for `amqps`."
        type: integer
        example: 5672
      routingKey:
        title: "Routing Key"
        description: "The routing key that binds the queue to the exchange, when `autoDeclare` is true. A `direct` exchange then routes to the queue the messages sent with this key."
        example: "new-order"
        type: string
      username:
        title: "Username"
        description: "The user name to log in to RabbitMQ with. When it is not set, `guest` is used."
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      password:
        title: "Password"
        description: "The password to log in to RabbitMQ with, for the user `username`."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      exchangeName:
        title: "Exchange Name"
        description: "The name of the exchange that the queue is bound to."
        example: "orders"
        type: string
      queues:
        title: "Queue Name"
        description: "The queue to receive the messages from. When it is not set, a new queue with a generated name is used, which only makes sense with `autoDeclare` true."
        example: "orders"
        type: string
      autoDeclare:
        title: "Create Exchange and Queue"
        description: "If true, the source creates the exchange (as a `direct` exchange) and the queue in `queues`, and binds them with `routingKey`, when it starts. If false, they must exist already."
        type: boolean
        default: false
      vhost:
        title: "Virtual Host"
        description: "The virtual host of the broker to connect to, which holds the exchanges and queues. RabbitMQ has the virtual host `/` from the start."
        type: string
        default: "/"
      protocol:
        title: "Protocol"
        description: "`amqp` for a plain connection, or `amqps` for a connection encrypted with TLS, which checks the certificate of the broker and its host name."
        type: string
        enum: ["amqp", "amqps"]
        default: "amqp"
      sslTruststoreLocation:
        title: "SSL Truststore Location"
        description: "The location of a trust store, in JKS or PKCS12 format, with the certificate of the authority that signed the certificate of the broker, such as `file:/etc/rabbitmq/truststore.p12`, or `classpath:truststore.p12` for one on the classpath. A path without `file:` is looked up on the classpath. Needed only with `amqps` when the broker uses a certificate that Java does not trust by default, such as one from a private or self-signed authority. Not used with `amqp`."
        type: string
        example: "file:/etc/rabbitmq/truststore.p12"
      sslTruststorePassword:
        title: "SSL Truststore Password"
        description: "The password of the trust store in `sslTruststoreLocation`."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
  dataTypes:
    out:
      headers:
        CamelSpringRabbitmqExchangeName:
          title: "Exchange Name"
          description: "The exchange the message was published to."
          type: string
        CamelSpringRabbitmqRoutingKey:
          title: "Routing Key"
          description: "The routing key the message was published with."
          type: string
        CamelSpringRabbitmqContentType:
          title: "Content Type"
          description: "The content type of the message, such as `text/plain`."
          type: string
  dependencies:
    - "camel:spring-rabbitmq"
    - "camel:kamelet"
  template:
    beans:
      - name: rabbitConnectionFactory
        type: "#class:com.rabbitmq.client.ConnectionFactory"
        builderClass: org.springframework.amqp.rabbit.connection.RabbitConnectionFactoryBean
        builderMethod: getObject
        properties:
          singleton: false
          uri: "{{protocol}}://{{host}}:{{port}}"
          virtualHost: "{{vhost}}"
          username: "{{?username}}"
          password: "{{?password}}"
          trustStore: "{{?sslTruststoreLocation}}"
          trustStorePassphrase: "{{?sslTruststorePassword}}"
      - name: connectionFactory
        type: "#class:org.springframework.amqp.rabbit.connection.CachingConnectionFactory"
        constructors:
          0: "#bean:{{rabbitConnectionFactory}}"
    from:
      uri: "spring-rabbitmq://{{exchangeName}}?autoDeclare={{autoDeclare}}&connectionFactory=#bean:{{connectionFactory}}&queues={{?queues}}&routingKey={{?routingKey}}"
      steps:
        - to:
            uri: kamelet:sink
