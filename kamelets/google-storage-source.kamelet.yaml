apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: google-storage-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Google Storage"
    camel.apache.org/kamelet.namespace: "GCP"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "Google Storage Source"
    description: |-
      Reads the files (objects) in a Google Cloud Storage bucket, one message per file, and by default deletes each file once it has been read.

      Use it to process files that another system drops into a bucket, such as uploaded documents, exported reports or log files. To react to new files through Pub/Sub notifications instead of reading the bucket over and over, use `google-storage-event-based-source`.

      Output: the body is the content of the file, as a stream, and the `Content-Type` header is `application/octet-stream`. The headers give the bucket name (`CamelGoogleCloudStorageBucketName`), the object name, that is the path of the file in the bucket (`CamelGoogleCloudStorageObjectName`), the content type and the ETag of the file.

      Good to know: files are deleted from the bucket after they are read, unless `deleteAfterRead` is set to false; then the same files are read again on every poll, about twice a second, or every `delay` milliseconds. With `moveAfterRead`, they are copied to `destinationBucket` first. A file whose processing fails is not deleted or moved, and is read again on the next poll. Without `serviceAccountKey`, it logs in with the Application Default Credentials of the environment where it runs, or with Workload Identity Federation when `useWorkloadIdentityFederation` is true.
    required:
      - bucketNameOrArn
    type: object
    properties:
      bucketNameOrArn:
        title: Bucket Name
        description: The name of the bucket to read the files from, without `gs://`.
        type: string
        example: my-bucket
      serviceAccountKey:
        title: Service Account Key
        description: "The JSON key of a service account that may read (and delete) the files of the bucket, encoded in Base64: create the key in the Google Cloud console under IAM & Admin > Service Accounts > Keys, then encode the downloaded file, for example with `base64 -w0 key.json`. When it is not set, the Application Default Credentials are used: the key file named in the `GOOGLE_APPLICATION_CREDENTIALS` environment variable, or the service account of the Google Cloud machine it runs on."
        type: binary
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      deleteAfterRead:
        title: Auto-delete Objects
        description: If true, each file is deleted from the bucket after it has been read. Set it to false to keep the files; they are then read again on every poll.
        type: boolean
        default: true
      autoCreateBucket:
        title: Autocreate Bucket
        description: If true, the bucket is created when it does not exist yet.
        type: boolean
        default: false
      prefix:
        title: Prefix
        description: Only read the files whose name starts with this text, such as a folder followed by `/`.
        type: string
        example: 'inbox/'
      filter:
        title: Filter
        description: A regular expression that the whole name of a file must match for the file to be read, such as `.*\.csv` for the CSV files only. The name includes the folders, as in `inbox/orders.csv`.
        type: string
        example: '.*\.csv'
      moveAfterRead:
        title: Move Objects After Read
        description: If true, each file is copied to `destinationBucket` after it has been read, under the same name, and then deleted from this bucket unless `deleteAfterRead` is false. A file whose processing fails is not moved. When it is not set, it is false.
        type: boolean
      destinationBucket:
        title: Destination Bucket
        description: The name of the bucket to move the files to, without `gs://`. Only used when `moveAfterRead` is true. The bucket must exist; when it does not, a warning is logged and each file stays in its bucket, so it is read again on every poll.
        type: string
        example: my-archive-bucket
        pattern: "^[a-z0-9][a-z0-9._-]*[a-z0-9]$"
      includeBody:
        title: Include Body
        description: If true, the body is the content of the file. If false, the content is not downloaded, the body is empty, and only the headers describe the file, such as its size in `CamelGoogleCloudStorageContentLength`. When it is not set, it is true.
        type: boolean
      includeFolders:
        title: Include Folders
        description: If true, folder markers, that is empty objects whose name ends with `/`, are read as files too. Set it to false to skip them. When it is not set, it is true.
        type: boolean
      delay:
        title: Delay
        description: How long to wait between two reads of the bucket, in milliseconds. For example, 60000 is one minute. When it is not set, it is 500.
        type: integer
        example: 60000
      useWorkloadIdentityFederation:
        title: Use Workload Identity Federation
        description: If true, it logs in with Workload Identity Federation instead of `serviceAccountKey`, which is then ignored. It uses the credential configuration file in `workloadIdentityConfig` or, when that is not set, the Application Default Credentials. When it is not set, it is false.
        type: boolean
      workloadIdentityConfig:
        title: Workload Identity Configuration
        description: "Where to load the Workload Identity Federation credential configuration file from: the JSON file of type `external_account` that `gcloud iam workload-identity-pools create-cred-config` creates, which tells how to exchange a token of another identity provider, such as AWS, Azure or Kubernetes, for Google credentials. Prefix the path with `file:`, `classpath:`, `http:` or `https:`. Only used when `useWorkloadIdentityFederation` is true."
        type: string
        example: "file:/var/run/secrets/gcp/credential-config.json"
        pattern: "^(file|classpath|http|https):.+$"
      impersonatedServiceAccount:
        title: Impersonated Service Account
        description: The email of a service account to act as, with the credentials of Workload Identity Federation, so that the Kamelet gets the permissions of that service account. The federated identity needs the Service Account Token Creator role on it. Only used when `useWorkloadIdentityFederation` is true.
        type: string
        example: storage-reader@my-project-123.iam.gserviceaccount.com
        pattern: "^[^@\\s]+@[^@\\s]+$"
  dataTypes:
    out:
      default: binary
      headers:
        CamelGoogleCloudStorageBucketName:
          title: Bucket Name
          description: The name of the bucket the file was read from.
          type: string
        CamelGoogleCloudStorageObjectName:
          title: Object Name
          description: The name of the file in the bucket, with its folders, such as `inbox/orders.csv`.
          type: string
        CamelGoogleCloudStorageContentType:
          title: Content Type
          description: The content type stored with the file.
          default: application/octet-stream
          type: string
        CamelGoogleCloudStorageETag:
          title: ETag
          description: The ETag of the file, which changes when the file changes.
          type: string
      types:
        binary:
          format: "application-octet-stream"
          description: Default binary representation of the Google Storage Cloud object retrieved from the bucket.
          mediaType: application/octet-stream
        cloudevents:
          format: "google-storage:application-cloudevents"
          description: Output data type represents Google Storage download response as CloudEvent V1. The data type sets Camel specific CloudEvent headers on the exchange with respective data from the Google Storage bucket and its derived object.
          headers:
            CamelCloudEventID:
              title: CloudEvent ID
              description: The Camel exchange id set as event id
              type: string
            CamelCloudEventType:
              title: CloudEvent Type
              description: The event type
              default: "org.apache.camel.event.google.storage.downloadTo"
              type: string
            CamelCloudEventSource:
              title: CloudEvent Source
              description: The event source. By default, the Google Cloud Storage bucket name with prefix "google.storage.bucket.".
              type: string
            CamelCloudEventSubject:
              title: CloudEvent Subject
              description: The event subject. Usually the Google Cloud Storage object name.
              type: string
            CamelCloudEventTime:
              title: CloudEvent Time
              description: The exchange creation timestamp as event time.
              type: string
  dependencies:
    - "camel:kamelet"
    - "camel:google-storage"
    - "camel:jackson3"
  template:
    from:
      uri: "google-storage://{{bucketNameOrArn}}?autoCreateBucket={{autoCreateBucket}}&delay={{?delay}}&deleteAfterRead={{deleteAfterRead}}&destinationBucket={{?destinationBucket}}&filter={{?filter}}&impersonatedServiceAccount={{?impersonatedServiceAccount}}&includeBody={{?includeBody}}&includeFolders={{?includeFolders}}&moveAfterRead={{?moveAfterRead}}&prefix={{?prefix}}&serviceAccountKey=RAW(base64:{{?serviceAccountKey}})&useWorkloadIdentityFederation={{?useWorkloadIdentityFederation}}&workloadIdentityConfig={{?workloadIdentityConfig}}"
      steps:
        - choice:
            precondition: true
            when:
              - expression:
                  simple:
                    expression: "${properties:includeBody:true} == 'false'"
                steps:
                  - setBody:
                      expression:
                        constant:
                          expression: ""
        - to:
            uri: kamelet:sink
