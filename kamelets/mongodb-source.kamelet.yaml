apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: mongodb-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "MongoDB"
    camel.apache.org/kamelet.namespace: "Nosql"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "MongoDB Source"
    description: |-
      Reads the documents of a capped collection in a MongoDB database, first those already there and then each new one as it is added, one message per document, as JSON text.

      Use it to pass on records that an application appends to a capped collection, such as log entries or events, as they arrive. For a normal collection, or to also see updates and deletes, use `mongodb-changes-stream-source`. To write documents, use `mongodb-sink`.

      Output: the body is one document as JSON text. An `_id` that is an ObjectId comes out as an object with only its time (`timestamp` and `date`), not as the ID text, and the format of dates depends on the Camel version. The `CamelMongoDbDatabase` and `CamelMongoDbCollection` headers name where the document comes from.

      Good to know: the collection must be capped (created with a fixed size), or the Kamelet fails to start. Each time the integration starts, it reads the whole collection again from the start, unless `persistentTailTracking` is true. Set either `hosts` or `connectionString`. With `hosts`, it connects with TLS by default; set `ssl` to false for a MongoDB without TLS, such as a local one. With `connectionString`, such as the `mongodb+srv://` string of MongoDB Atlas, it connects only as that string says, and `hosts`, `username`, `password`, `ssl` and `sslValidationEnabled` are not used. For a user defined in a database other than `admin`, use `connectionString` with `authSource`.
    required:
      - collection
      - database
    type: object
    properties:
      hosts:
        title: MongoDB Hosts
        description: The address of one or more MongoDB servers, as `host:port`, separated by commas. MongoDB uses port 27017 unless it was set up otherwise. For a replica set, list its members. Set either `hosts` or `connectionString`. When neither is set, the Kamelet fails to start with the error `The connection string contains an empty host`.
        type: string
        example: mongo1.example.com:27017,mongo2.example.com:27017
      connectionString:
        title: Connection String
        description: "The MongoDB connection string, which starts with `mongodb://` or `mongodb+srv://`, such as the one MongoDB Atlas shows under Connect. Use it instead of `hosts` for MongoDB Atlas, for a user defined in a database other than `admin` (add `authSource`, such as `?authSource=shop`), or for settings such as `replicaSet` or `tls`. When it is set, `hosts`, `username`, `password`, `ssl` and `sslValidationEnabled` are not used. TLS is used as the string says: always with `mongodb+srv://`, and with `mongodb://` only when it has `tls=true`. Write `@`, `/`, `:` and `%` in the user name or the password as `%40`, `%2F`, `%3A` and `%25`."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
        example: "mongodb+srv://myuser:mypassword@cluster0.abcde.mongodb.net/?retryWrites=true&w=majority"
      collection:
        title: MongoDB Collection
        description: The name of the capped collection to read.
        type: string
        example: events
      password:
        title: MongoDB Password
        description: The password of the MongoDB user `username`. Write `@`, `/`, `:` and `%` in it as `%40`, `%2F`, `%3A` and `%25`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      username:
        title: MongoDB Username
        description: The MongoDB user to log in as, defined in the `admin` database. For a user defined in another database, use `connectionString` with `authSource` instead. Leave it empty for a MongoDB that does not ask for a login.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      ssl:
        title: Use TLS
        description: Whether to connect with TLS (SSL). Set it to false for a MongoDB that does not offer TLS. Not used with `connectionString`.
        type: boolean
        default: true
      sslValidationEnabled:
        title: Check TLS Certificate
        description: Whether to check the certificate and the host name of the server when `ssl` is true. Set it to false only for tests, as the connection can then be intercepted. Not used with `connectionString`.
        type: boolean
        default: true
      database:
        title: MongoDB Database
        description: The name of the database that holds the collection.
        type: string
        example: shop
      persistentTailTracking:
        title: Remember Last Document
        description: If true, the Kamelet stores the `tailTrackIncreasingField` value of the last document it read in the `camelTailTracking` collection of the same database, and after a restart goes on from there instead of reading the whole collection again. Needs `tailTrackIncreasingField`.
        type: boolean
        default: false
      tailTrackIncreasingField:
        title: Increasing Field
        description: The name of a field whose value grows with each new document, such as a sequence number or a time, used to find the place to go on reading from. Required when `persistentTailTracking` is true.
        type: string
        example: seq
  dataTypes:
    out:
      headers:
        CamelMongoDbDatabase:
          title: Database
          description: The name of the database the document comes from.
          type: string
        CamelMongoDbCollection:
          title: Collection
          description: The name of the collection the document comes from.
          type: string
        Content-Type:
          title: Content Type
          description: Always `application/json`, as the body is a JSON document.
          type: string
  dependencies:
    - "camel:kamelet"
    - "camel:mongodb"
    - "camel:jackson"
  template:
    beans:
      - name: mongo-client
        type: "#class:org.apache.camel.component.mongodb.SslAwareMongoClient"
        properties:
          password: "{{?password}}"
          username: "{{?username}}"
          hosts: "{{hosts:}}"
          ssl: "{{ssl}}"
          sslValidationEnabled: "{{sslValidationEnabled}}"
      - name: local-mongodb
        type: "#class:org.apache.camel.component.mongodb.MongoDbComponent"
        properties:
          mongoConnection: "#{{mongo-client}}"
    from:
      uri: "{{local-mongodb}}:test?collection={{collection}}&database={{database}}&persistentTailTracking={{persistentTailTracking}}&tailTrackIncreasingField={{?tailTrackIncreasingField}}&connectionUriString=RAW({{?connectionString}})"
      steps:
        - marshal:
            json: {}
        - to:
            uri: kamelet:sink
