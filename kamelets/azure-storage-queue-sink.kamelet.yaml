apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: azure-storage-queue-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Azure Storage Queue"
    camel.apache.org/kamelet.namespace: "Azure"
  labels:
    camel.apache.org/kamelet.type: "sink"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "Azure Storage Queue Sink"
    description: |-
      Adds each message to a queue in Azure Queue Storage, as the text of a queue message.

      Use it to hand work to another application or worker that reads the queue, such as orders to process or jobs to run. For a message broker with topics and dead-letter queues, use `azure-servicebus-sink`.

      Input: the body is the text of the queue message: text or bytes. A Map is sent as its text form, so turn it into JSON text first, for example with `json-serialize-action`. The optional `expiration` header (or `ce-expiration`) sets how long the message stays in the queue, as an ISO-8601 duration such as `PT1H` (one hour) or `P2D` (two days); without it, the message expires after 7 days.

      Output: the body afterwards is `true`, and headers such as `CamelAzureStorageQueueMessageId` and `CamelAzureStorageQueueExpirationTime` describe the message sent.

      Good to know: the queue must exist, or a message fails, unless `createQueue` is true. A message can be held back for a while before readers see it, with `visibilityTimeout`. An `expiration` that is a plain number, such as `600`, fails the message. Headers that start with `CamelAzureStorageQueue` are removed from the message first, so they cannot change what the Kamelet does.
    required:
      - accountName
      - queueName
      - accessKey
    type: object
    properties:
      accountName:
        title: Account Name
        description: The name of the storage account, as shown in the Azure portal under Storage accounts. It is the first part of the address of the account, `https://<accountName>.queue.core.windows.net`.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
        example: mystorageaccount
      queueName:
        title: Queue Name
        description: The name of the queue in the storage account to send the messages to.
        type: string
        example: orders
      accessKey:
        title: Access Key
        description: "An access key of the storage account, from the Azure portal: the storage account, then Security + networking, then Access keys. Used when `credentialType` is `SHARED_ACCOUNT_KEY`, the default."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      credentialType:
        title: Credential Type
        description: How to log in to the storage account. `SHARED_ACCOUNT_KEY`, the default, and `SHARED_KEY_CREDENTIAL` use `accessKey`. `AZURE_IDENTITY` uses the Azure identity of the environment, such as the `AZURE_CLIENT_ID`, `AZURE_TENANT_ID` and `AZURE_CLIENT_SECRET` environment variables, a managed identity or the Azure CLI login; `accessKey` must still be given, but is not used.
        type: string
        default: "SHARED_ACCOUNT_KEY"
        enum: ["SHARED_ACCOUNT_KEY", "SHARED_KEY_CREDENTIAL", "AZURE_IDENTITY"]
      createQueue:
        title: Create Queue
        description: If true, the queue is created when it does not exist yet, before each message is sent. The login must be allowed to create queues. When it is not set, the queue must exist, or the message fails.
        type: boolean
      visibilityTimeout:
        title: Visibility Timeout
        description: How long each message stays hidden after it is added, before readers of the queue can receive it, as an ISO-8601 duration such as `PT30S` (30 seconds) or `PT1H` (one hour). Use it to delay the handling of a message. At most 7 days, and shorter than the time the message stays in the queue (`expiration`, 7 days by default); a longer value fails the message. A plain number is read as milliseconds, not seconds. When it is not set, a message can be received at once.
        type: string
        example: PT5M
        pattern: "^P(\\d+D)?(T(\\d+H)?(\\d+M)?(\\d+(\\.\\d+)?S)?)?$"
  dataTypes:
    in:
      headers:
        expiration:
          title: Expiration
          description: "How long the message stays in the queue, as an ISO-8601 duration such as `PT1H` or `P2D`. Optional: without it (and without `ce-expiration`), 7 days."
          type: string
        ce-expiration:
          title: Expiration
          description: How long the message stays in the queue, as a CloudEvents extension. Used when `expiration` is not set.
          type: string
  dependencies:
    - "camel:azure-storage-queue"
    - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: CamelAzureStorageQueue*
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[expiration]}"
                steps:
                  - setHeader:
                      name: CamelAzureStorageQueueTimeToLive
                      expression:
                        simple:
                          expression: "${header[expiration]}"
              - expression:
                  simple:
                    expression: "${header[ce-expiration]}"
                steps:
                  - setHeader:
                      name: CamelAzureStorageQueueTimeToLive
                      expression:
                        simple:
                          expression: "${header[ce-expiration]}"
        - to:
            uri: "azure-storage-queue://{{accountName}}/{{queueName}}?accessKey=RAW({{accessKey}})&credentialType={{credentialType}}&createQueue={{?createQueue}}&visibilityTimeout={{?visibilityTimeout}}"
