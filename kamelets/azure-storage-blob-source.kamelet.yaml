apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: azure-storage-blob-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Azure Storage Blob"
    camel.apache.org/kamelet.namespace: "Azure"
  labels:
    camel.apache.org/kamelet.type: "source"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "Azure Storage Blob Source"
    description: |-
      Reads the files (blobs) in a container of Azure Blob Storage, one message per blob, and can delete each blob, or move it to another container, once it has been read.

      Use it to process files that another system drops into a container, such as uploaded documents, exported reports or log files. To react to new blobs through Event Grid events instead of reading the container over and over, use `azure-storage-blob-event-based-source`.

      Output: the body is the content of the blob, as a stream of bytes, and the `Content-Type` header is `application/octet-stream`. The headers give the name of the blob (`CamelAzureStorageBlobBlobName`, with its folder path), its type, content type, size, ETag and last-modified time.

      Good to know: blobs are kept after they are read, so the same blobs are read again on every poll, every 500 milliseconds by default; set `deleteAfterRead` to true to delete each blob once it has been processed, or `moveAfterRead` to move it to another container. A poll gets all its blobs before it sends the first one; to read a large container in smaller polls, set `maxMessagesPerPoll`. It reads all the blobs of the container, those in virtual folders too, unless `prefix` or `regex` narrows them down. With `deleteAfterRead`, the blob deleted is the one named in the `CamelAzureStorageBlobBlobName` header when processing ends, so do not change that header.
    required:
      - accountName
      - containerName
    type: object
    properties:
      accountName:
        title: Account Name
        description: The name of the storage account, as shown in the Azure portal under Storage accounts. It is the first part of the address of the account, `https://<accountName>.blob.core.windows.net`.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
        example: mystorageaccount
      containerName:
        title: Container Name
        description: The name of the container in the storage account to read the blobs from.
        type: string
        example: invoices
      accessKey:
        title: Access Key
        description: "An access key of the storage account, from the Azure portal: the storage account, then Security + networking, then Access keys. Used when `credentialType` is `SHARED_ACCOUNT_KEY`, the default."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      clientId:
        title: Client ID
        description: The application (client) ID of an app registration (service principal) in Microsoft Entra ID that has access to the storage account, from the Overview page of the app registration in the Azure portal. Used with `clientSecret` and `tenantId` when `credentialType` is `AZURE_IDENTITY`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      clientSecret:
        title: Client Secret
        description: "A client secret of the app registration, from the Azure portal: the app registration, then Certificates & secrets. Used with `clientId` and `tenantId` when `credentialType` is `AZURE_IDENTITY`."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      tenantId:
        title: Tenant ID
        description: The directory (tenant) ID of the app registration, from its Overview page in the Azure portal. Used with `clientId` and `clientSecret` when `credentialType` is `AZURE_IDENTITY`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      sasToken:
        title: SAS Token
        description: "A shared access signature (SAS) token for the storage account or for the container, from the Azure portal: the storage account, then Security + networking, then Shared access signature, or the container, then Shared access tokens. Used when `credentialType` is `AZURE_SAS`. Give the token only, such as `sv=2022-11-02&ss=b&srt=sco&sp=rl&se=2026-12-31T00:00:00Z&spr=https&sig=...`, with or without the leading `?`, not the whole SAS URL. It needs the List and Read permissions, and also Delete with `deleteAfterRead`, or Write and Delete with `moveAfterRead`."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
        pattern: "^\\??[A-Za-z]+=[^&]*(&[A-Za-z]+=[^&]*)*$"
      delay:
        title: Delay
        description: How long to wait between two polls of the container, in milliseconds.
        type: integer
        default: 500
      deleteAfterRead:
        title: Auto-delete Blob
        description: If true, each blob is deleted from the container once it has been processed. When false, the blobs stay and are read again on every poll.
        type: boolean
        default: false
      maxMessagesPerPoll:
        title: Max Blobs Per Poll
        description: The most blobs to read in one poll. The next poll goes on with the blobs after them, and after the last blob of the container it starts again from the first, so every blob is reached, also when the blobs are kept. When it is not set, each poll reads all the blobs of the container.
        type: integer
        example: 100
      prefix:
        title: Blob Name Prefix
        description: Reads only the blobs whose name starts with this text, such as `in/` for the blobs in the virtual folder `in` and its subfolders, or `invoice-`. Ignored when `regex` is set. When neither is set, all the blobs of the container are read.
        type: string
        example: "in/"
      regex:
        title: Blob Name Pattern
        description: "Reads only the blobs whose whole name, with its virtual folder path, matches this Java regular expression, such as `.*\\.csv` for the CSV files in any folder, or `in/[^/]*\\.csv` for those directly in the folder `in`. It must match the whole name: `csv` alone matches no blob. When it is set, `prefix` is ignored, and the names of all the blobs of the container are listed on each poll and then filtered."
        type: string
        example: ".*\\.csv"
      moveAfterRead:
        title: Move Blob After Read
        description: If true, each blob is moved to `destinationContainer` once it has been processed. It is copied there under the same name, with its virtual folder path, and then deleted from `containerName`. If the copy fails, for example because `destinationContainer` does not exist, the blob is kept and read again on the next poll, and a warning is logged. When both `moveAfterRead` and `deleteAfterRead` are true, the blob is moved.
        type: boolean
      destinationContainer:
        title: Destination Container
        description: The name of the container, in the same storage account, to move the blobs to when `moveAfterRead` is true, such as `processed`. It must exist. A container name has 3 to 63 lowercase letters, digits and hyphens. Required with `moveAfterRead`, without it the Kamelet does not start.
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$"
        example: processed
      credentialType:
        title: Credential Type
        description: "How to log in to the storage account. `SHARED_ACCOUNT_KEY`, the default, uses `accessKey`. `AZURE_SAS` uses `sasToken`. `AZURE_IDENTITY` uses `clientId`, `clientSecret` and `tenantId` when all three are set, and otherwise the Azure identity of the environment, such as the `AZURE_CLIENT_ID`, `AZURE_TENANT_ID` and `AZURE_CLIENT_SECRET` environment variables, a managed identity or the Azure CLI login. Do not use `CLIENT_SECRET`: it does not use the three client options."
        type: string
        default: "SHARED_ACCOUNT_KEY"
        enum: ["SHARED_ACCOUNT_KEY", "AZURE_SAS", "AZURE_IDENTITY", "CLIENT_SECRET"]
  dataTypes:
    out:
      default: binary
      headers:
        CamelAzureStorageBlobBlobName:
          title: Blob Name
          description: The name of the blob, with its virtual folder path, such as `in/report.csv`.
          type: string
        CamelAzureStorageBlobConsumedContainerName:
          title: Container Name
          description: The name of the container the blob was read from, as set in `containerName`.
          type: string
        CamelAzureStorageBlobBlobType:
          title: Blob Type
          description: The type of the blob, such as `BlockBlob` or `AppendBlob`.
          type: string
        CamelAzureStorageBlobContentType:
          title: Content Type
          description: The content type of the retrieved object.
          default: application/octet-stream
          type: string
        CamelAzureStorageBlobETag:
          title: ETag Value
          description: The ETag of the blob, which changes each time the blob changes.
          type: string
        CamelAzureStorageBlobCreationTime:
          title: Creation Time
          description: When the blob was created.
          type: string
        CamelAzureStorageBlobLastModified:
          title: Last Modified
          description: When the blob was last changed.
          type: string
        CamelAzureStorageBlobLeaseStatus:
          title: Lease status
          description: Status of the lease on the blob, one of locked or unlocked
          type: string
        CamelAzureStorageBlobMetadata:
          title: Blob Metadata
          description: Additional Metadata of the blob of type Map<String,Object>
          type: object
      types:
        binary:
          format: "application-octet-stream"
          description: Default binary representation of the Blob object retrieved from the container.
          mediaType: application/octet-stream
        cloudevents:
          format: "azure-storage-blob:application-cloudevents"
          description: Output data type represents Azure Storage Blob get blob response as CloudEvent V1. The data type sets Camel specific CloudEvent headers on the exchange with respective data from the Azure container and its derived object.
          headers:
            CamelCloudEventID:
              title: CloudEvent ID
              description: The Camel exchange id set as event id
              type: string
            CamelCloudEventType:
              title: CloudEvent Type
              description: The event type
              default: "org.apache.camel.event.azure.storage.blob.getBlob"
              type: string
            CamelCloudEventSource:
              title: CloudEvent Source
              description: The event source, which is the name of the container with the prefix "azure.storage.blob.", such as `azure.storage.blob.invoices`.
              type: string
            CamelCloudEventSubject:
              title: CloudEvent Subject
              description: The event subject. Usually the Azure Storage Blob name.
              type: string
            CamelCloudEventTime:
              title: CloudEvent Time
              description: The exchange creation timestamp as event time.
              type: string
  dependencies:
    - "camel:azure-storage-blob"
    - "camel:kamelet"
    - "camel:jsonpath"
  template:
    from:
      uri: azure-storage-blob
      parameters:
        accountName: "{{accountName}}"
        containerName: "{{containerName}}"
        accessKey: "RAW({{?accessKey}})"
        azureClientId: "RAW({{?clientId}})"
        azureClientSecret: "RAW({{?clientSecret}})"
        azureTenantId: "RAW({{?tenantId}})"
        credentialType: "{{credentialType}}"
        sasToken: "RAW({{?sasToken}})"
        delay: "{{delay}}"
        maxMessagesPerPoll: "{{?maxMessagesPerPoll}}"
        prefix: "RAW({{?prefix}})"
        regex: "RAW({{?regex}})"
        moveAfterRead: "{{?moveAfterRead}}"
        destinationContainer: "{{?destinationContainer}}"
      steps:
        - to:
            uri: kamelet:sink
        - choice:
            precondition: true
            when:
              - expression:
                  simple:
                    expression: "${properties:deleteAfterRead:false} == true && ${properties:moveAfterRead:false} != true"
                steps:
                  - to:
                      uri: azure-storage-blob
                      parameters:
                        accountName: "{{accountName}}"
                        containerName: "{{containerName}}"
                        accessKey: "RAW({{?accessKey}})"
                        azureClientId: "RAW({{?clientId}})"
                        azureClientSecret: "RAW({{?clientSecret}})"
                        azureTenantId: "RAW({{?tenantId}})"
                        credentialType: "{{credentialType}}"
                        sasToken: "RAW({{?sasToken}})"
                        operation: deleteBlob

