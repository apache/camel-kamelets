apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: exec-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Exec"
    camel.apache.org/kamelet.namespace: "System"
  labels:
    camel.apache.org/kamelet.type: "sink"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "Exec Sink"
    description: |-
      Runs a program or command on the machine where the integration runs, once for each message, with the body as its standard input.

      Use it to hand each message to an existing script or command-line tool, for example a script that imports a file or a tool that converts data, and to use what the program prints in the next step.

      Input: the body is written to the standard input of the program, when it is text, bytes, a stream or a file. Another body, or no body, runs the program without input.

      Output: when it is used inside a route, the body afterwards is what the program printed on its standard output, as a stream, or no body when it printed nothing. The `CamelExecExitValue` header is the exit code of the program, and `CamelExecStderr` what it printed on its standard error.

      Good to know: this Kamelet runs programs by design, with the rights of the integration, so never place it after a source of untrusted messages. `executable` is only the name or path of the program, and its arguments go in `args`. Only the options decide what runs: `CamelExecCommand*` headers on the message are ignored. The program is started directly, not through a shell, so `*`, `$HOME`, `|`, `>` and `;` in the arguments are passed on as they are. A program that ends with an error exit code does not fail the message; check `CamelExecExitValue`, or list the exit codes that mean success in `exitValues`. A program that is not found, or a `workingDir` that does not exist, fails the message. A program that runs longer than `commandTimeout` is stopped.
    required:
    - executable
    type: object
    properties:
      executable:
        title: Executable Command
        description: The name of the program to run, found on the `PATH` of the machine, or its full path, without arguments. A value with a space, such as `ls -l`, fails, because no program has that name; put the arguments in `args`.
        type: string
        example: /opt/scripts/import-order.sh
      args:
        title: Arguments
        description: The arguments to give to the program, separated by spaces, such as `-l /data`. Put an argument that contains a space in double or single quotes, such as `--name "John Doe"`; the program gets the text inside the quotes as one argument, without the quotes. To pass a quote character, put the argument in the other kind of quotes, such as `"it's"`. When not set, the program runs without arguments.
        type: string
        example: '--input /data/orders.csv --name "John Doe"'
      workingDir:
        title: Working Directory
        description: The directory to run the program in, as a full path. A directory that does not exist fails the message. When not set, the program runs in the working directory of the integration.
        type: string
        example: /opt/scripts
      commandTimeout:
        title: Timeout
        description: How long the program may run, in milliseconds, such as 60000 for one minute. A program that runs longer is stopped. The message then carries on, with what the program printed so far as the body and the exit code of the stopped program, such as 143, in `CamelExecExitValue`; set `exitValues` to fail the message instead. When not set, the Kamelet waits until the program ends.
        type: integer
        example: 60000
      exitValues:
        title: Exit Values
        description: The exit codes that mean the program succeeded, separated by commas without spaces, such as `0` or `0,1`. The message fails when the program ends with another exit code, or is stopped by `commandTimeout`. When not set, any exit code is accepted and the message carries on.
        type: string
        example: "0"
        pattern: "^-?[0-9]+(,-?[0-9]+)*$"
  dataTypes:
    # No 'default:' here on purpose: text, bytes, a stream or a file is written to the standard input
    # as it is, and any other body runs the program without input; a default would convert every body
    # and change that. See #3117.
    out:
      headers:
        CamelExecExitValue:
          title: Exit Value
          description: The exit code of the program; 0 usually means it succeeded.
          type: integer
        CamelExecStderr:
          title: Standard Error
          description: What the program printed on its standard error, as a stream, or no value when it printed nothing.
          type: object
    in:
      headers: {}
  dependencies:
    - "camel:exec"
    - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - to:
            uri: exec
            parameters:
              executable: "{{executable}}"
              allowControlHeaders: false
              args: "RAW({{?args}})"
              workingDir: "RAW({{?workingDir}})"
              timeout: "{{?commandTimeout}}"
              exitValues: "{{?exitValues}}"
        - setBody:
            expression:
              simple:
                expression: "${body.stdout}"
