apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: pqc-signature-action
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "PQC"
    camel.apache.org/kamelet.namespace: "PQC"
  labels:
    camel.apache.org/kamelet.type: "action"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "PQC Signature Action"
    description: |-
      Signs each message with a post-quantum digital signature algorithm, such as ML-DSA, or checks the signature of a message signed before.

      Use it to try out post-quantum signatures, or to check inside one running application that a message was not changed between two steps: sign it with `operation` set to `sign`, and check it later with a second copy of this Kamelet with `operation` set to `verify` and the same algorithm.

      Input: the body is the data to sign or to check, as text, bytes or a stream. To check, the `CamelPQCSignature` header must hold the signature that `sign` set.

      Output: the body is unchanged. `sign` sets the `CamelPQCSignature` header to the signature, as bytes. `verify` sets the `CamelPQCVerification` header to true when the signature matches the body, and to false when it does not.

      Good to know: unless the key pair comes from `keyStore` or `keyPair`, it is created when the application starts, so a signature can be checked only by the same running application, and not after a restart. With a key pair from a key store, a signature can be checked after a restart, and by any application that has the public key. When the application has exactly one Java `KeyStore`, or one `KeyPair`, it is used even when `keyStore` or `keyPair` is not set; `keyPairAlias` and `keyStorePassword` are then needed for the key store, else the messages fail. A `verify` without a `CamelPQCSignature` header fails the message. Headers that start with `CamelPQC`, except `CamelPQCSignature`, are removed from the message first, so they cannot change what the Kamelet does.
    required:
    - signatureAlgorithm
    - operation
    type: object
    properties:
      signatureAlgorithm:
        title: PQC Signature Algorithm
        description: The post-quantum signature algorithm. `MLDSA` (ML-DSA, the NIST standard FIPS 204) is the usual choice; `SLHDSA` is the hash-based NIST standard. Use the same algorithm to sign and to check.
        type: string
        enum: ["MLDSA","SLHDSA","LMS","XMSS","FALCON"]
      operation:
        title: PQC Signature Operation
        description: What to do with each message. `sign` adds a signature of the body in the `CamelPQCSignature` header; `verify` checks the body against that header and sets `CamelPQCVerification`.
        type: string
        enum: ["sign","verify"]
      keyStore:
        title: Key Store
        description: A Java `KeyStore` defined in the application, as `#bean:` followed by its name, that holds the key pair to use, such as a PKCS12 file made with `keytool` (Java 24 or later makes ML-DSA keys). The key pair is then the same after a restart, and in other applications that load the same key store. Set `keyPairAlias` and `keyStorePassword` with it; without both, no key pair is taken from the key store, none is created either, and the messages fail.
        type: string
        example: "#bean:pqcKeyStore"
      keyPairAlias:
        title: Key Pair Alias
        description: The alias, the name in `keyStore`, of the ML-DSA key pair to use.
        type: string
        example: signer
      keyStorePassword:
        title: Key Store Password
        description: The password of `keyStore`. It is also the password of the key pair in it, so both must be the same.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      keyPair:
        title: Key Pair
        description: A Java `KeyPair` of the algorithm, defined in the application, as `#bean:` followed by its name, to use instead of `keyStore`.
        type: string
        example: "#bean:pqcKeyPair"
  dataTypes:
    in:
      default: unchanged
      headers:
        CamelPQCSignature:
          title: Signature
          description: The signature to check, as bytes, as set by `sign`. Required for `verify`.
          type: string
          format: binary
      types:
        unchanged:
          format: "application-x-unchanged"
          description: "The data to sign or to check, as text, bytes or a stream. It is read, not changed."
    out:
      default: unchanged
      headers:
        CamelPQCSignature:
          title: Signature
          description: The signature of the body, as bytes. Set by `sign`.
          type: string
          format: binary
        CamelPQCVerification:
          title: Verification Result
          description: True when the signature matches the body, false when it does not. Set by `verify`.
          type: boolean
      types:
        unchanged:
          format: "application-x-unchanged"
          description: "The body as it came in, of the same type."
  dependencies:
  - "camel:pqc"
  - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: CamelPQC*
            excludePattern: CamelPQCSignature
        - to:
            uri: pqc
            parameters:
              label: sign
              keyPair: "{{?keyPair}}"
              keyPairAlias: "{{?keyPairAlias}}"
              keyStore: "{{?keyStore}}"
              keyStorePassword: "RAW({{?keyStorePassword}})"
              operation: "{{operation}}"
              signatureAlgorithm: "{{signatureAlgorithm}}"
