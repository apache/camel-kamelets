apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: kafka-batch-azure-schema-registry-source
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Kafka"
    camel.apache.org/kamelet.namespace: "Kafka"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "Azure Kafka Batch through Eventhubs with Azure Schema Registry Source"
    description: |-
      Receives Avro records from event hubs in Azure Event Hubs in batches, through its Kafka interface, with the schema kept in Azure Schema Registry.

      Use it to read many Avro records at once from Azure Event Hubs, for example to write them to a database in one go. For one record at a time use `kafka-azure-schema-registry-source`.

      Output: the body is a List with one entry per record, up to `batchSize`. Each entry is a message of its own, with the value of the record as its body (an object of the `specificAvroValueType` class), and the key, offset and timestamp of the record in its `CamelKafkaKey`, `CamelKafkaOffset` and `CamelKafkaTimestamp` headers. The record headers are in the entries too, as bytes. The message itself has the `CamelKafkaTopic` and `CamelKafkaPartition` headers. The `kafka-topic`, `kafka-key` and other headers of `kafka-source` are not set.

      Good to know: it logs in to Event Hubs with the connection string in `password`, and to the schema registry with the Azure credentials of the environment the integration runs in, such as the `AZURE_CLIENT_ID`, `AZURE_TENANT_ID` and `AZURE_CLIENT_SECRET` environment variables of a service principal, or a managed identity. The schemas must be in a schema group named `avro`. To save the position in Kafka only once a batch was handled, set `allowManualCommit` to true and `autoCommitEnable` to false, and end the flow with `kafka-batch-manual-commit-action`.
    required:
      - topic
      - bootstrapServers
      - azureRegistryUrl
      - password
    type: object
    properties:
      topic:
        title: Event Hub Names
        description: "The event hubs to read from, which Kafka calls topics, separated by commas. When `topicIsPattern` is true, a regular expression that their names must match instead."
        type: string
        example: "orders"
      bootstrapServers:
        title: Bootstrap Servers
        description: "The Kafka address of the Event Hubs namespace, as `<namespace>.servicebus.windows.net:9093`."
        type: string
        example: "my-namespace.servicebus.windows.net:9093"
      securityProtocol:
        title: Security Protocol
        description: "How to connect to Event Hubs. Keep the default `SASL_SSL`, a login over TLS, which Event Hubs requires. The other values are `SASL_PLAINTEXT`, `PLAINTEXT` and `SSL`."
        type: string
        default: SASL_SSL
      saslMechanism:
        title: SASL Mechanism
        description: "The login method. Keep the default `PLAIN`, which the login with the connection string in `password` needs."
        type: string
        default: PLAIN
      password:
        title: Connection String
        description: "The connection string of the Event Hubs namespace, which starts with `Endpoint=sb://`. Find it in the Azure portal, under Shared access policies of the namespace."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      autoCommitEnable:
        title: Auto Commit
        description: "If true, the position reached in each partition (the offset) is saved in Kafka automatically every 5 seconds, so that a restarted integration goes on from there. Set it to false together with `allowManualCommit` true to save the position yourself with `kafka-batch-manual-commit-action`."
        type: boolean
        default: true
      allowManualCommit:
        title: Allow Manual Commit
        description: "If true, each message carries what `kafka-batch-manual-commit-action` needs to save the position of its records in Kafka. Set `autoCommitEnable` to false too, or the position is also saved automatically."
        type: boolean
        default: false
      pollOnError:
        title: Poll On Error Behavior
        description: "What to do when reading from Kafka fails: `ERROR_HANDLER` logs the error and goes on with the next records, `DISCARD` skips the records that failed, `RECONNECT` connects again and retries, `RETRY` reads the same records again, and `STOP` stops reading until the integration is restarted."
        type: string
        default: "ERROR_HANDLER"
        enum: ["DISCARD", "ERROR_HANDLER", "RECONNECT", "RETRY", "STOP"]
      autoOffsetReset:
        title: Auto Offset Reset
        description: "Where to start when the consumer group has no saved position yet: `latest` reads only the records sent from now on, `earliest` reads all the records still in the topic, and `none` fails."
        type: string
        default: "latest"
        example: "earliest"
      consumerGroup:
        title: Consumer Group
        description: "The name of the consumer group. Integrations with the same group share the records of the topics between them, and the group remembers the position reached, so that a restarted integration goes on where it stopped. When it is not set, a new random group is used on every start."
        type: string
        example: "my-group-id"
      deserializeHeaders:
        title: Automatically Deserialize Headers
        description: "Meant to turn the values of the record headers into text. In a batch it has no effect: the record headers of the entries of the list stay bytes."
        type: boolean
        default: true
      valueDeserializer:
        title: Value Deserializer
        description: "The Java class that turns the value of the record into the body. The default reads Avro with the schema from Azure Schema Registry."
        type: string
        default: "com.microsoft.azure.schemaregistry.kafka.avro.KafkaAvroDeserializer"
      azureRegistryUrl:
        title: Azure Schema Registry URL
        description: "The URL of the Azure Schema Registry, which is the address of the Event Hubs namespace that holds it, as `https://<namespace>.servicebus.windows.net`."
        type: string
        example: "https://my-namespace.servicebus.windows.net"
      specificAvroValueType:
        title: Specific Avro Value Type
        description: "The full name of the Java class generated from the Avro schema of the records, into which each record is read. The class must be part of the integration. The Kamelet does not start without this option, although it is not marked as required."
        type: string
        example: "com.example.Order"
      batchSize:
        title: Batch Size
        description: "The largest number of records in one message. A message holds fewer when fewer records are waiting."
        type: integer
        default: 500
      pollTimeout:
        title: Poll Timeout
        description: "How long one read from Kafka waits for new records, in milliseconds."
        type: integer
        default: 5000
      maxPollIntervalMs:
        title: Max Poll Interval
        description: "The longest time, in milliseconds, that the integration may take to handle one batch. When it takes longer, Kafka considers it failed and gives its partitions to another member of the consumer group. When it is not set, the Kafka default of 300000 (5 minutes) applies."
        type: integer
        example: 600000
      batchingIntervalMs:
        title: Batching Interval
        description: "When set, a batch that has not reached `batchSize` is sent on after about this many milliseconds. It is checked only between two reads, so it can take up to `pollTimeout` longer."
        type: integer
        example: 10000
      topicIsPattern:
        title: Topic Is Pattern
        description: "If true, `topic` is a regular expression, such as `orders-.*`, and the Kamelet reads from every topic whose name matches it."
        type: boolean
        default: false
  dataTypes:
    out:
      headers:
        CamelKafkaTopic:
          title: Kafka Topic
          description: "The topic the records were read from."
          type: string
        CamelKafkaPartition:
          title: Kafka Partition
          description: "The number of the partition the records were read from."
          type: integer
        CamelKafkaManualCommit:
          title: Kafka Manual Commit
          description: "Set only when `allowManualCommit` is true: what `kafka-batch-manual-commit-action` uses to save the position reached."
          type: object
  dependencies:
    - "camel:kafka"
    - "camel:kamelet"
    - "camel:azure-schema-registry"
    - "mvn:com.microsoft.azure:azure-schemaregistry-kafka-avro:1.1.4"
    - "mvn:com.azure:azure-data-schemaregistry-apacheavro:1.1.30"
    - "mvn:com.azure:azure-identity:1.18.1"
  template:
    beans:
      - name: defaultAzureCredential
        type: "#class:org.apache.camel.component.azure.schema.registry.DefaultAzureCredentialWrapper"
      - name: kafkaHeaderDeserializer
        type: "#class:org.apache.camel.component.kafka.KafkaHeaderDeserializer"
        properties:
          enabled: "{{deserializeHeaders}}"
      - name: manualCommitFactory
        type: "#class:org.apache.camel.component.kafka.consumer.DefaultKafkaManualCommitFactory"
    from:
      uri: kafka
      parameters:
        topic: "{{topic}}"
        additionalProperties.schema.group: avro
        additionalProperties.schema.registry.credential: "#bean:defaultAzureCredential"
        additionalProperties.schema.registry.url: "{{azureRegistryUrl}}"
        additionalProperties.specific.avro.reader: "#valueAs(boolean):true"
        additionalProperties.specific.avro.value.type: "#valueAs(java.lang.Class):{{specificAvroValueType}}"
        allowManualCommit: "{{allowManualCommit}}"
        autoCommitEnable: "{{autoCommitEnable}}"
        autoOffsetReset: "{{autoOffsetReset}}"
        batching: true
        batchingIntervalMs: "{{?batchingIntervalMs}}"
        brokers: "{{bootstrapServers}}"
        groupId: "{{?consumerGroup}}"
        kafkaManualCommitFactory: "#bean:{{manualCommitFactory}}"
        maxPollIntervalMs: "{{?maxPollIntervalMs}}"
        maxPollRecords: "{{batchSize}}"
        pollOnError: "{{pollOnError}}"
        pollTimeoutMs: "{{pollTimeout}}"
        saslJaasConfig: "RAW(org.apache.kafka.common.security.plain.PlainLoginModule required username=\"$ConnectionString\" password=\"{{password}}\";)"
        saslMechanism: "{{saslMechanism}}"
        securityProtocol: "{{securityProtocol}}"
        topicIsPattern: "{{topicIsPattern}}"
        valueDeserializer: "{{valueDeserializer}}"
      steps:
        - process:
            ref: "{{kafkaHeaderDeserializer}}"
        - to:
            uri: kamelet:sink
