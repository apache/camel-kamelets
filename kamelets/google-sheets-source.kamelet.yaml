apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: google-sheets-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Google Sheets"
    camel.apache.org/kamelet.namespace: "GCP"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "Google Sheets Source"
    description: |-
      Reads the cells of a Google Sheets spreadsheet again and again, at a regular interval, and sends each row of the range as a message.

      Use it to feed the content of a spreadsheet that people maintain, such as a price list, a contact list or a list of tasks, to another system on a schedule. To write rows to a spreadsheet, use `google-sheets-sink`.

      Output: with `range` set, the body is one row as JSON text, a JSON array of the values of the row (or of one column, with `majorDimension` set to `COLUMNS`), such as `["Alice","3"]`; with `splitResults` set to false, it is the whole range as JSON text, with the rows in its `values` field. Without `range`, the body is the description of the spreadsheet (its sheets and properties) as JSON text, not its cells. The `CamelGoogleSheets.spreadsheetId` and `CamelGoogleSheets.range` headers repeat the options.

      Good to know: every poll reads the whole range again, by default every 500 milliseconds, so the same rows come again and again until `repeatCount` is reached; it does not track which rows are new. It logs in to Google either with OAuth (an OAuth client of a Google Cloud project, and an access token and a refresh token of a Google account that may read the spreadsheet), or with the key of a service account in `serviceAccountKey` together with `scopes`; share the spreadsheet with the email address of the service account, or set `delegate`.
    required:
      - spreadsheetId
    type: object
    properties:
      spreadsheetId:
        title: Spreadsheet ID
        description: The ID of the spreadsheet, the long part of its address between `/d/` and `/edit`, as in `https://docs.google.com/spreadsheets/d/<ID>/edit`.
        type: string
        example: 1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms
      clientId:
        title: Client ID
        description: The client ID of an OAuth client, created in the Google Cloud console under APIs & Services > Credentials, in a project where the Google Sheets API is enabled. Not needed when logging in with `serviceAccountKey`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      clientSecret:
        title: Client Secret
        description: The client secret of the OAuth client of `clientId`. Not needed when logging in with `serviceAccountKey`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      accessToken:
        title: Access Token
        description: An OAuth 2 access token of the Google account, with access to Google Sheets. It expires after about an hour; the Kamelet then gets a new one with `refreshToken`. Not needed when logging in with `serviceAccountKey`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      refreshToken:
        title: Refresh Token
        description: An OAuth 2 refresh token of the Google account, which the Kamelet uses to get a new access token when the current one expires. You get it together with the access token, for example from the Google OAuth 2.0 Playground. Not needed when logging in with `serviceAccountKey`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      serviceAccountKey:
        title: Service Account Key
        description: "The JSON key of a Google service account, to log in with instead of OAuth: `file:` followed by the path of the key file, `classpath:` followed by a resource of the application, or `base64:` followed by the Base64 encoding of the key. Create the key in the Google Cloud console under IAM & Admin > Service Accounts > Keys. The service account reads the spreadsheets that are shared with its email address, or those of the user in `delegate`. It needs `scopes`. Only used when `clientId` and `clientSecret` are not set. When none of the three is set, the Application Default Credentials are used: the key file named in the `GOOGLE_APPLICATION_CREDENTIALS` environment variable, or the service account of the Google Cloud machine it runs on."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
        pattern: "^(file|classpath|base64):.+"
        example: file:/etc/google/service-account.json
      delegate:
        title: Delegate User
        description: The email address of a user of your Google Workspace, whose spreadsheets the service account of `serviceAccountKey` reads on their behalf. A Workspace administrator must first allow the client ID of the service account, with the scopes of `scopes`, under Security > Access and data control > API controls > Domain-wide delegation. Only used with `serviceAccountKey`.
        type: string
        pattern: "^[^@\\s]+@[^@\\s]+$"
        example: alice@example.com
      scopes:
        title: Scopes
        description: "The permissions to ask Google for, as URLs separated by commas, such as `https://www.googleapis.com/auth/spreadsheets.readonly`. Needed with `serviceAccountKey` and with the Application Default Credentials: without them, the login asks Google for no permission at all. Leave it unset with `clientId` and `clientSecret`; with them, setting it makes the Kamelet fail."
        type: string
        pattern: "^https://[^,\\s]+(,https://[^,\\s]+)*$"
        example: https://www.googleapis.com/auth/spreadsheets.readonly
      delay:
        title: Delay
        description: How long to wait between two reads of the spreadsheet, in milliseconds. For example, 60000 is one minute.
        type: integer
        default: 500
        example: 60000
      repeatCount:
        title: Repeat Count
        description: How many times to read the spreadsheet in total, such as 1 to read it once. When it is not set, it is read again every `delay` until the integration is stopped.
        type: integer
        example: 1
      applicationName:
        title: Application Name
        description: A name for your application, sent to Google with each call, such as `my-company-sheets/1.0`.
        type: string
        example: my-company-sheets/1.0
      splitResults:
        title: Split Results
        description: If true, each row of `range` is sent as a message of its own. If false, the whole range is sent as one message. Only used when `range` is set.
        type: boolean
        default: true
      range:
        title: Cells Range
        description: The cells to read, in A1 notation, optionally with the name of the sheet, such as `Sheet1!A2:C100`. Several ranges can be given, separated by commas. When it is not set, the description of the spreadsheet is read instead of its cells.
        type: string
        example: "Sheet1!A2:C100"
      majorDimension:
        title: Major Dimension
        description: Whether the cells are read by rows (`ROWS`) or by columns (`COLUMNS`). With `COLUMNS`, each message holds one column instead of one row. It is also set as the `CamelGoogleSheets.majorDimension` header.
        type: string
        enum: [ "COLUMNS", "ROWS" ]
        default: "ROWS"
        example: "ROWS"
      columnNames:
        title: Column Names
        description: Sets the `CamelGoogleSheets.columnNames` header, for a later step that turns the rows into JSON objects with these names as keys instead of the column letters. Names separated by commas, in the order of the columns.
        type: string
        default: "A"
        example: name,qty
      valueRenderOption:
        title: Value Render Option
        description: "How the cells are read: `FORMATTED_VALUE` as the spreadsheet shows them, as text such as `$1.50`; `UNFORMATTED_VALUE` as their values, so a number is a number such as `1.5`; `FORMULA` gives the formula of a cell, such as `=B2*2`, instead of its result. When it is not set, `FORMATTED_VALUE` is used."
        type: string
        enum: [ "FORMATTED_VALUE", "UNFORMATTED_VALUE", "FORMULA" ]
        example: "UNFORMATTED_VALUE"
      maxResults:
        title: Max Results
        description: The most rows of each range to send, counted from the first, or the most columns with `majorDimension` set to `COLUMNS`. For example, 1 sends only the first row. Google still returns the whole range, and the other rows are left out. When it is not set, all the rows are sent.
        type: integer
        example: 100
  dataTypes:
    out:
      default: json
      headers:
        CamelGoogleSheets.range:
          title: Range
          description: The `range` option.
          default: A:A
          type: string
        CamelGoogleSheets.spreadsheetId:
          title: Spreadsheet ID
          description: The `spreadsheetId` option.
          type: string
        CamelGoogleSheets.majorDimension:
          title: Major Dimension
          description: The `majorDimension` option.
          default: ROWS
          type: string
        CamelGoogleSheets.columnNames:
          title: Column Names
          description: The `columnNames` option.
          default: A
          type: string
        CamelGoogleSheets.splitResults:
          title: Split Results
          description: The `splitResults` option.
          default: "true"
          type: boolean
      types:
        json:
          format: "application-json"
          description: Json representation of a GoogleSheets ValueRange object that holds all values for the given cell range.
          mediaType: application/json
        json-struct:
          format: "google-sheets:application-x-struct"
          description: Special Json representation of Google Sheets ValueRange object with just row and column values as a generic JsonNode.
          mediaType: application/json
        cloudevents:
          format: "google-sheets-stream:application-cloudevents"
          description: Output data type represents Google Sheets Stream response as CloudEvent V1. The data type sets Camel specific CloudEvent headers on the exchange with respective data from the Spreadsheet and its derived object.
          headers:
            CamelCloudEventID:
              title: CloudEvent ID
              description: The Camel exchange id set as event id
              type: string
            CamelCloudEventType:
              title: CloudEvent Type
              description: The event type
              default: "org.apache.camel.event.google.sheets.stream.consume"
              type: string
            CamelCloudEventSource:
              title: CloudEvent Source
              description: The event source. By default, the Spreadsheet Id with prefix "google.sheets.stream.".
              type: string
            CamelCloudEventSubject:
              title: CloudEvent Subject
              description: The event subject. Usually the Spreadsheet URL.
              type: string
            CamelCloudEventTime:
              title: CloudEvent Time
              description: The exchange creation timestamp as event time.
              type: string
  dependencies:
  - "camel:jackson3"
  - "camel:kamelet"
  - "camel:google-sheets"
  template:
    from:
      uri: "google-sheets-stream://{{spreadsheetId}}?accessToken=RAW({{?accessToken}})&applicationName={{?applicationName}}&clientId={{?clientId}}&clientSecret=RAW({{?clientSecret}})&delay={{delay}}&delegate=RAW({{?delegate}})&majorDimension={{majorDimension}}&maxResults={{?maxResults}}&range={{?range}}&refreshToken=RAW({{?refreshToken}})&repeatCount={{?repeatCount}}&scopes={{?scopes}}&serviceAccountKey=RAW({{?serviceAccountKey}})&splitResults={{splitResults}}&valueRenderOption={{?valueRenderOption}}"
      steps:
        - marshal:
            json: {}
        - setHeader:
            name: CamelGoogleSheets.spreadsheetId
            expression:
              simple:
                expression: "{{spreadsheetId}}"
        - setHeader:
            name: CamelGoogleSheets.range
            expression:
              simple:
                expression: "{{?range}}"
        - setHeader:
            name: CamelGoogleSheets.majorDimension
            expression:
              simple:
                expression: "{{?majorDimension}}"
        - setHeader:
            name: CamelGoogleSheets.columnNames
            expression:
              simple:
                expression: "{{?columnNames}}"
        - setHeader:
            name: CamelGoogleSheets.splitResults
            expression:
              simple:
                expression: "{{?splitResults}}"
        - to:
            uri: kamelet:sink
