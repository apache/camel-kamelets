apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: ceph-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Ceph"
    camel.apache.org/kamelet.namespace: "Cloud"
  labels:
    camel.apache.org/kamelet.type: "sink"
spec:
  definition:
    title: "Ceph Sink"
    description: |-
      Uploads each message as a file (object) to a bucket of a Ceph Object Gateway, the S3-compatible storage of Ceph.

      Use it to store data in Ceph, such as reports, exports, images or received messages to keep as an archive. For MinIO use `minio-sink`, and for Amazon S3 use `aws-s3-sink`.

      Input: the body is the content of the file, as text, bytes or a stream. Text is turned into bytes before the upload, and the `Content-Type` header is set to `application/octet-stream`. A file is passed on as it is, and so is a stream, unless stream caching is turned off. The key (the name of the file in the bucket) comes from the optional `file` header, or the `ce-file` header; when neither is set it is `keyName`, or a generated unique name when `keyName` is not set either.

      Output: the body is the content of the file, as bytes when it was text, and the `Content-Type` header is `application/octet-stream`.

      Good to know: a file with the same key is overwritten, so with `keyName` set and no `file` header each message replaces the previous one. The bucket is addressed as part of the host name (such as `my-bucket.ceph.example.com`) unless `cephUrl` uses an IP address; set `forcePathStyle` to true when the DNS of the gateway has no wildcard name for its buckets. Headers that start with `CamelAwsS3` are removed from the message first, so they cannot change what the Kamelet does.
    required:
      - cephUrl
      - accessKey
      - secretKey
      - bucketName
      - zoneGroup
    type: object
    properties:
      bucketName:
        title: Bucket Name
        description: The name of the bucket to store the files in.
        type: string
        example: my-bucket
      accessKey:
        title: Access Key
        description: The S3 access key of a Ceph Object Gateway user, as shown by `radosgw-admin user info`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      secretKey:
        title: Secret Key
        description: The S3 secret key that goes with `accessKey`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      zoneGroup:
        title: Bucket Zone Group
        description: The name of the zone group of the Ceph Object Gateway, used as the region of the requests. A Ceph cluster that was not set up with several zone groups uses `default`.
        type: string
        example: default
      autoCreateBucket:
        title: Autocreate Bucket
        description: If true, the bucket is created when it does not exist yet. If false, the bucket must already exist.
        type: boolean
        default: false
      cephUrl:
        title: Ceph Url Address
        description: The address of the Ceph Object Gateway (RGW), as a URL with the scheme and the port.
        type: string
        example: "http://ceph-rgw.example.com:7480"
      forcePathStyle:
        title: Force Path Style
        description: If true, the bucket name is put in the path of the address (`http://ceph-rgw.example.com:7480/my-bucket/key`) instead of in the host name (`http://my-bucket.ceph-rgw.example.com:7480/key`). The Ceph Object Gateway always accepts the path style; the host name style works only when the gateway has a wildcard DNS name for its buckets.
        type: boolean
        default: false
      keyName:
        title: Key Name
        description: The key to store the files under, with its folder if any, used when a message has no `file` or `ce-file` header. When it is not set either, each file gets a generated unique name.
        type: string
        example: reports/latest.csv
  dataTypes:
    in:
      default: binary
      types:
        binary:
          format: "application-octet-stream"
          description: "The content of the file, as bytes. A file, and a stream while stream caching is on, are passed on as they are."
          mediaType: application/octet-stream
      headers:
        file:
          title: File Name
          description: The key to store the file under, such as `reports/january.csv`. It takes precedence over `keyName`.
          type: string
        ce-file:
          title: File Name
          description: The key to store the file under, used when the `file` header is not set. It takes precedence over `keyName`.
          type: string
  dependencies:
    - "camel:aws2-s3"
    - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: CamelAwsS3*
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${header[file]}"
                steps:
                  - setHeader:
                      name: CamelAwsS3Key
                      expression:
                        simple:
                          expression: "${header[file]}"
              - expression:
                  simple:
                    expression: "${header[ce-file]}"
                steps:
                  - setHeader:
                      name: CamelAwsS3Key
                      expression:
                        simple:
                          expression: "${header[ce-file]}"
              - expression:
                  simple:
                    expression: "'{{?keyName}}' == ''"
                steps:
                  - setHeader:
                      name: CamelAwsS3Key
                      expression:
                        simple:
                          expression: "${exchangeId}"
        - to:
            uri: "aws2-s3:{{bucketName}}?accessKey=RAW({{?accessKey}})&autoCreateBucket={{autoCreateBucket}}&keyName={{?keyName}}&forcePathStyle={{forcePathStyle}}&overrideEndpoint=true&region={{zoneGroup}}&secretKey=RAW({{?secretKey}})&uriEndpointOverride={{?cephUrl}}"
