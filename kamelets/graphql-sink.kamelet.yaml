apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: graphql-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Graphql"
    camel.apache.org/kamelet.namespace: "Graphql"
  labels:
    camel.apache.org/kamelet.type: "sink"
spec:
  definition:
    title: "GraphQL Sink"
    description: |-
      Sends a GraphQL query or mutation, from the body of each message or from a file, to a GraphQL server with an HTTP POST, and gives back the answer of the server.

      Use it to create or change data through a GraphQL API with a mutation, for example to add a record for each event, or to fetch data with a query. It can also run a stored query from `queryFile` each time a message arrives.

      Input: the body is the GraphQL query or mutation itself, as text, such as `{ books { title } }`. A body that is not text, such as a Map, fails the message. With `queryFile`, the query comes from that file instead, and the body is not sent, except that a Map body is sent as the variables of the query when `variables` is not set. The other headers of the message, except the Camel ones, are sent as HTTP headers.

      Output: when it is used inside a route, the body afterwards is the answer of the server, as JSON text with its `data` and `errors`.

      Good to know: GraphQL errors in the answer do not fail the message, but an HTTP status outside 200 to 299 does. Without `queryFile`, the body is run as a query, so only send it messages from a source you trust. When the query defines several operations, `operationName` picks the one to run. To go through an HTTP proxy, set `proxyHost` to its host and port; a proxy that asks for a login is not supported. Headers on the message cannot change where the request is sent.
    required:
    - url
    type: object
    properties:
      url:
        title: GraphQL Server URL
        description: The address of the GraphQL API, starting with `http://` or `https://`.
        type: string
        example: "https://api.example.com/graphql"
        pattern: "^(http|https)://.*"
      accessToken:
        title: GraphQL Access Token
        description: A token from the provider of the API, sent as `Authorization` `Bearer` with each request. Leave it out for an API that needs no login.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      queryFile:
        title: Query File
        description: Where to load the GraphQL query or mutation from, in place of the body. `classpath:` followed by a resource in the application, or `file:` followed by the path of a file. The variables then come from `variables`, or from the body when it is a Map.
        type: string
        example: "file:/etc/graphql/add-book.graphql"
        pattern: "^(classpath:|file:)[^?&#]+$"
      operationName:
        title: Operation Name
        description: The name of the operation to run, when the query defines more than one, such as `AddBook` for `mutation AddBook { ... }`.
        type: string
        example: AddBook
        pattern: "^[_A-Za-z][_0-9A-Za-z]*$"
      variables:
        title: Variables
        description: The values of the variables of the query, as a JSON object, such as `{"title":"Dune"}` for a query that declares `$title`. When it is set, the body is not used as the variables.
        type: string
        example: '{"title":"Dune","year":1965}'
        pattern: "^\\s*\\{[\\s\\S]*\\}\\s*$"
      proxyHost:
        title: Proxy
        description: The host name or IP address and the port of an HTTP proxy to send the requests through, as `host:port`, such as `proxy.example.com:3128`. A proxy that asks for a login is not supported.
        type: string
        example: "proxy.example.com:3128"
        pattern: "^[A-Za-z0-9._-]+:[0-9]{1,5}$"
  dependencies:
  - "camel:graphql"
  - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - to:
            uri: "graphql://{{url}}?accessToken=RAW({{?accessToken}})&queryFile={{?queryFile}}&operationName={{?operationName}}&variables=RAW({{?variables}})&proxyHost={{?proxyHost}}"
