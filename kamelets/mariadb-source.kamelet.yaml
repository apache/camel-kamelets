apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: mariadb-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "SQL"
    camel.apache.org/kamelet.namespace: "Database"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "MariaDB Source"
    description: |-
      Runs an SQL query in a MariaDB database again and again, and sends each row it returns as a message, as a JSON object.

      Use it to pick up the rows that another application adds to a table, such as new orders or events, and pass them on to another system. To write rows, use `mariadb-sink`.

      Output: the body is one row as JSON text, an object with the column names as keys, such as `{"id":1,"username":"oscerd","city":"Rome"}`. When `useIterator` is false, the body is instead one JSON array with all the rows of a poll. The `Content-Type` header is `application/json`.

      Good to know: the query runs again `delay` milliseconds after the previous run, so the same rows are sent again and again, unless `consumedQuery` marks or deletes each row once it is sent and `query` leaves such rows out: for example `SELECT * FROM accounts WHERE processed = false` with `UPDATE accounts SET processed = true WHERE id = :#id`. When the next step fails for a row, `consumedQuery` is not run for it, and the row is read again, unless `onConsumeFailed` marks it. A query that finds no rows sends nothing. `maxMessagesPerPoll` limits how many rows one poll sends. `query` cannot contain `?`. The format of date and time columns in the JSON depends on the Camel version. The JDBC driver of MariaDB is not included: add `mvn:org.mariadb.jdbc:mariadb-java-client` to the dependencies of the integration. Camel JBang (`camel run`) adds it by itself. Whether the connection uses TLS when `connectionProperties` is not set depends on the version of the MariaDB driver: set `sslMode=trust` in `connectionProperties` to insist on TLS.
    required:
      - serverName
      - username
      - password
      - query
      - databaseName
    type: object
    properties:
      serverName:
        title: Server Name
        description: The host name or IP address of the MariaDB server, without the port.
        type: string
        example: db.example.com
      serverPort:
        title: Server Port
        description: The port the MariaDB server listens on. MariaDB uses 3306 unless it was set up otherwise.
        type: string
        default: 3306
      username:
        title: Username
        description: The database user to log in as. It needs the rights to run the queries of this Kamelet on their tables.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      password:
        title: Password
        description: The password of the database user `username`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      query:
        title: Query
        description: The SQL query to run on each poll, usually a SELECT. Each row it returns becomes a message.
        type: string
        example: SELECT * FROM accounts WHERE processed = false
      databaseName:
        title: Database Name
        description: The name of the database to connect to on the MariaDB server.
        type: string
        example: shop
      consumedQuery:
        title: Consumed Query
        description: An SQL statement to run after each row has been sent on, to mark the row as read or to delete it, so that `query` does not return it again. Write `:#column` where the value of a column of that row goes, such as `:#id`. When it is not set, nothing is changed, and the same rows are read on every poll.
        type: string
        example: UPDATE accounts SET processed = true WHERE id = :#id
      delay:
        title: Delay
        description: How long to wait after one run of `query` before the next, in milliseconds.
        type: integer
        default: 500
      connectionProperties:
        title: Connection Properties
        description: "Extra settings for the MariaDB JDBC driver (MariaDB Connector/J), as `name=value` pairs separated by `;`, such as `sslMode=trust;connectTimeout=10000`. Use it for TLS: `sslMode=trust` makes the connection use TLS without checking the certificate of the server, and `sslMode=disable` turns TLS off. When it is not set, the default of the driver applies, and it depends on its version: Connector/J 3 connects without TLS, Connector/J 4 with TLS. The value is not hidden like a password, and it can show in the log when the integration starts, so do not put a password in it."
        type: string
        example: sslMode=trust
      onConsumeFailed:
        title: Failed Row Query
        description: An SQL statement to run instead of `consumedQuery` when the next step fails for a row, to mark the row as failed so that `query` leaves it out. Write `:#column` where the value of a column of that row goes, such as `:#id`. When it is not set, nothing is changed for a failed row, and it is read again on the next poll.
        type: string
        example: UPDATE accounts SET failed = true WHERE id = :#id
      onConsumeBatchComplete:
        title: Poll Complete Query
        description: An SQL statement to run once after all the rows of one poll have been sent on, such as an UPDATE that marks them all at once. It cannot use `:#column`. It does not run when the query finds no rows. A row added after `query` ran is not sent in this poll, so make sure the statement does not mark it.
        type: string
        example: UPDATE poll_status SET last_poll = CURRENT_TIMESTAMP
      maxMessagesPerPoll:
        title: Max Rows Per Poll
        description: The most rows to read in one poll. The other rows are read by the next polls, as long as `consumedQuery` marks the rows that were sent and `query` leaves them out. When it is not set, every row that `query` returns is sent.
        type: integer
        example: 100
      initialDelay:
        title: Initial Delay
        description: How long to wait after the start before the first run of `query`, in milliseconds. When it is not set, the first run is one second after the start.
        type: integer
        example: 10000
      useIterator:
        title: One Message Per Row
        description: 'Whether to send each row as a message of its own. When false, all the rows of one poll are sent as one message, a JSON array of objects, such as `[{"id":1},{"id":2}]`. `consumedQuery` and `onConsumeFailed` then cannot use `:#column`, but `onConsumeBatchComplete` can mark all the rows at once. When it is not set, each row is a message.'
        type: boolean
      routeEmptyResultSet:
        title: Send Empty Result
        description: Whether to send a message with an empty JSON array, `[]`, when `query` finds no rows. Only used when `useIterator` is false. When it is not set, nothing is sent when no rows are found.
        type: boolean
      maxTotal:
        title: Max Connections
        description: The most connections to the database that the Kamelet opens at the same time. While it sends the rows of a poll, the Kamelet keeps one connection, and `consumedQuery`, `onConsumeFailed` and `onConsumeBatchComplete` each need a second one, so do not set it to 1 when you use them. When all of them are in use, the next message waits for one to be free, as long as `maxWaitMillis` allows. When it is not set, the limit is 8.
        type: integer
        example: 20
      maxIdle:
        title: Max Idle Connections
        description: The most unused connections to keep open for later. A connection that is given back when this many are unused already is closed. When it is not set, up to 8 are kept open.
        type: integer
        example: 2
      maxWaitMillis:
        title: Max Wait
        description: How long to wait for a free connection when `maxTotal` connections are in use, in milliseconds. After that, the message fails. When it is not set, it waits as long as it takes.
        type: integer
        example: 5000
  types:
    out:
      mediaType: application/json
  dataTypes:
    out:
      headers:
        Content-Type:
          title: Content Type
          description: Always `application/json`, as the body is JSON.
          type: string
  dependencies:
  - "camel:jackson3"
  - "camel:kamelet"
  - "camel:sql"
  - "mvn:org.apache.commons:commons-dbcp2:2.14.0"
  template:
    beans:
      - name: local-sql-mariadb-source
        type: "#class:org.apache.camel.component.sql.SqlComponent"
        properties:
          autowiredEnabled: "false"
      - name: dsBean
        type: "#class:org.apache.commons.dbcp2.BasicDataSource"
        properties:
          username: "{{username}}"
          password: "{{password}}"
          url: "jdbc:mariadb://{{serverName}}:{{serverPort}}/{{databaseName}}"
          driverClassName: org.mariadb.jdbc.Driver
          connectionProperties: "{{?connectionProperties}}"
          maxTotal: "{{?maxTotal}}"
          maxIdle: "{{?maxIdle}}"
          maxWaitMillis: "{{?maxWaitMillis}}"
    from:
      uri: "{{local-sql-mariadb-source}}:{{query}}?dataSource=#bean:{{dsBean}}&onConsume=RAW({{?consumedQuery}})&delay={{delay}}&initialDelay={{?initialDelay}}&maxMessagesPerPoll={{?maxMessagesPerPoll}}&onConsumeFailed=RAW({{?onConsumeFailed}})&onConsumeBatchComplete=RAW({{?onConsumeBatchComplete}})&useIterator={{?useIterator}}&routeEmptyResultSet={{?routeEmptyResultSet}}"
      steps:
        - marshal:
            json: {}
        - to:
            uri: kamelet:sink
