apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: aws-cloudtrail-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "AWS Cloudtrail"
    camel.apache.org/kamelet.namespace: "AWS"
  labels:
    camel.apache.org/kamelet.type: "source"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "AWS Cloudtrail Source"
    description: |-
      Reads the events that AWS CloudTrail records in an AWS account, such as API calls and console sign-ins, one message per event.

      Use it to react to activity in an AWS account, for example to raise an alert when a secret is read, a security group is changed or someone signs in to the console. Set `eventSource` to read the events of one AWS service only.

      Output: the body is the CloudTrail record of the event, as JSON text in bytes, and the `Content-Type` header is `application/json`. The headers give the ID, the name (such as `GetSecretValue`), the source (such as `secretsmanager.amazonaws.com`) and the user name of the event.

      Good to know: it looks up the management events that CloudTrail keeps for the region, and reads the events that happen after it starts. It remembers where it is only while it runs: the events that happen while it is stopped are not read. Nothing is removed from CloudTrail. An event can be looked up only some minutes after it happened, and sometimes after a newer event: every `lookBackInterval` it looks up the last `lookBackWindow` again, and reads the events it missed. To reach AWS through an HTTP proxy, set `proxyHost` and `proxyPort`, and set `proxyProtocol` to `HTTP` for a proxy that takes plain HTTP, such as Squid.
    required:
      - region
    type: object
    properties:
      accessKey:
        title: Access Key
        description: The access key ID of an IAM user, which you create in the AWS console under IAM, Users, Security credentials. Use it together with `secretKey`. Leave both out when `useDefaultCredentialsProvider` or `useProfileCredentialsProvider` is true.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      secretKey:
        title: Secret Key
        description: The secret access key that belongs to `accessKey`. The AWS console shows it only once, when the access key is created.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      region:
        title: AWS Region
        description: The AWS region of the events to read, as a region code such as `eu-west-1` or `us-east-1`.
        example: eu-west-1
        type: string
        enum: ["ap-south-1", "eu-south-1", "us-gov-east-1", "me-central-1", "ca-central-1", "eu-central-1", "us-iso-west-1", "us-west-1", "us-west-2", "af-south-1", "eu-north-1", "eu-west-3", "eu-west-2", "eu-west-1", "ap-northeast-3", "ap-northeast-2", "ap-northeast-1", "me-south-1", "sa-east-1", "ap-east-1", "cn-north-1", "us-gov-west-1", "ap-southeast-1", "ap-southeast-2", "us-iso-east-1", "ap-southeast-3", "us-east-1", "us-east-2", "cn-northwest-1", "us-isob-east-1", "aws-global", "aws-cn-global", "aws-us-gov-global", "aws-iso-global", "aws-iso-b-global"]
      useDefaultCredentialsProvider:
        title: Default Credentials Provider
        description: "If true, the credentials are found in the environment instead of in `accessKey` and `secretKey`: the `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY` environment variables, the `~/.aws/credentials` file, or the IAM role of the EC2 instance, ECS task or Kubernetes pod the integration runs on."
        type: boolean
        default: false
      useProfileCredentialsProvider:
        title: Profile Credentials Provider
        description: If true, the credentials are read from a named profile in the AWS credentials file (`~/.aws/credentials`), as the AWS CLI does. Name the profile in `profileCredentialsName`.
        type: boolean
        default: false
      useSessionCredentials:
        title: Session Credentials
        description: "If true, it logs in with temporary credentials: `accessKey`, `secretKey` and `sessionToken`, such as the ones AWS STS gives when you assume an IAM role."
        type: boolean
        default: false
      profileCredentialsName:
        title: Profile Credentials Name
        description: The name of the profile in the AWS credentials file. Only used when `useProfileCredentialsProvider` is true; when it is not set, the default profile is used.
        example: production
        type: string
      sessionToken:
        title: Session Token
        description: The session token of temporary credentials, which comes with their access key and secret key, for example from AWS STS when you assume an IAM role. Only used when `useSessionCredentials` is true.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      uriEndpointOverride:
        title: Overwrite Endpoint URI
        description: The address to connect to instead of AWS, as a URL such as `http://localhost:4566` for LocalStack. Only used when `overrideEndpoint` is true.
        example: http://localhost:4566
        type: string
      overrideEndpoint:
        title: Endpoint Overwrite
        description: If true, it connects to the address in `uriEndpointOverride` instead of to AWS. Use it for a local stand-in of AWS such as LocalStack.
        type: boolean
        default: false
      maxResults:
        title: Max Results
        description: How many events to fetch in one request to CloudTrail, from 1 to 50. Depending on the Camel version, a poll reads one such page of the newest events, or all new events page by page.
        type: integer
        default: 1
      eventSource:
        title: Event Source
        description: Read only the events of this AWS service, given as its address, such as `s3.amazonaws.com` or `secretsmanager.amazonaws.com`. When it is not set, the events of all services are read.
        type: string
        example: secretsmanager.amazonaws.com
      lookBackWindow:
        title: Look Back Window
        description: How far back it looks up the events again, in milliseconds, to read the events that CloudTrail made visible after a newer one. When it is not set, it is 600000, ten minutes. 0 turns the second lookup off, and then such a late event is not read. Needs Camel 4.24 or later.
        type: integer
        example: 600000
      lookBackInterval:
        title: Look Back Interval
        description: How often it looks up the `lookBackWindow` again, in milliseconds. A late event is read at most this long after it became visible. When it is not set, it is 60000, one minute. It must be above 0 unless `lookBackWindow` is 0, or the integration does not start. Needs Camel 4.24 or later.
        type: integer
        example: 60000
      proxyHost:
        title: Proxy Host
        description: The host name or IP address of an HTTP proxy to send the calls to AWS through, such as the proxy of a company network. Used only together with `proxyPort`. When it is not set, the calls go straight to AWS.
        type: string
        pattern: "^[A-Za-z0-9._-]+$"
        example: proxy.example.com
      proxyPort:
        title: Proxy Port
        description: The port of the proxy in `proxyHost`, such as `3128` for Squid. Used only together with `proxyHost`.
        type: integer
        example: 3128
      proxyProtocol:
        title: Proxy Protocol
        description: "How to talk to the proxy itself: `HTTP` or `HTTPS`. It is not the protocol of the calls to AWS, which stay encrypted, as the proxy only passes them on. When it is not set, it is `HTTPS`, which needs a proxy that takes TLS connections. Most company proxies, such as Squid, take plain HTTP: set `HTTP` for them. With the wrong one, every call fails, for example with `Unsupported or unrecognized SSL message`."
        type: string
        enum: ["HTTP", "HTTPS"]
        example: HTTP
  dataTypes:
    out:
      default: json
      headers:
        CamelAwsCloudTrailEventId:
          title: CloudTrail Event ID
          description: The ID of the CloudTrail event.
          type: string
        CamelAwsCloudTrailEventName:
          title: CloudTrail Event Name
          description: The name of the event, which is the name of the API call, such as `GetSecretValue` or `ConsoleLogin`.
          type: string
        CamelAwsCloudTrailEventSource:
          title: CloudTrail Event Source
          description: The AWS service the event comes from, such as `secretsmanager.amazonaws.com`.
          type: string
        CamelAwsCloudTrailEventUsername:
          title: CloudTrail Event Username
          description: The name of the user or role that made the call, when CloudTrail knows it.
          type: string
      types:
        json:
          format: "application-json"
          description: "The CloudTrail record of the event, as JSON text in bytes."
          mediaType: application/json
        text:
          format: "text-plain"
          description: Default text representation of the Cloudtrail Event
          mediaType: text/plain
        cloudevents:
          format: "aws-cloudtrail:application-cloudevents"
          description: Data type transformer converts AWS Cloudtrail lookup events response to CloudEvent v1_0 data format. The data type sets Camel specific CloudEvent headers with values extracted from AWS Cloudtrail lookup events response.
          headers:
            CamelCloudEventID:
              title: CloudEvent ID
              description: The Camel exchange id set as event id
              type: string
            CamelCloudEventType:
              title: CloudEvent Type
              description: The event type
              default: "org.apache.camel.event.aws.cloudtrail.lookupEvents"
              type: string
            CamelCloudEventSource:
              title: CloudEvent Source
              description: The event source. By default, the Cloudtrail event source name with prefix "aws.cloudtrail.event.source.".
              type: string
            CamelCloudEventSubject:
              title: CloudEvent Subject
              description: The event subject. The Cloudtrail Event Id.
              type: string
            CamelCloudEventTime:
              title: CloudEvent Time
              description: The exchange creation timestamp as event time.
              type: string
  dependencies:
    - "camel:jackson3"
    - "camel:aws-cloudtrail"
    - "camel:kamelet"
  template:
    from:
      uri: aws-cloudtrail
      parameters:
        label: cloudtrail
        accessKey: "RAW({{?accessKey}})"
        eventSource: "{{?eventSource}}"
        maxResults: "{{maxResults}}"
        overrideEndpoint: "{{overrideEndpoint}}"
        profileCredentialsName: "{{?profileCredentialsName}}"
        region: "{{region}}"
        secretKey: "RAW({{?secretKey}})"
        sessionToken: "RAW({{?sessionToken}})"
        uriEndpointOverride: "{{?uriEndpointOverride}}"
        useDefaultCredentialsProvider: "{{useDefaultCredentialsProvider}}"
        useProfileCredentialsProvider: "{{useProfileCredentialsProvider}}"
        useSessionCredentials: "{{useSessionCredentials}}"
        proxyHost: "{{?proxyHost}}"
        proxyPort: "{{?proxyPort}}"
        proxyProtocol: "{{?proxyProtocol}}"
        lookBackWindow: "{{?lookBackWindow}}"
        lookBackInterval: "{{?lookBackInterval}}"
      steps:
        - to:
            uri: kamelet:sink
