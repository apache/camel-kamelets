apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: websocket-source
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "WebSocket"
    camel.apache.org/kamelet.namespace: "HTTP"
  labels:
    camel.apache.org/kamelet.type: "source"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "WebSocket Source"
    description: |-
      Connects to a WebSocket server, such as a feed of prices, notifications or status updates, and sends on each message the server pushes.

      Use it to receive live data that a partner or a public service pushes over WebSocket. To send messages to a WebSocket server, use `websocket-sink`. For a service that calls a URL of yours for each event (a webhook), use `webhook-source`.

      Output: the body is the message as the server sent it: text for a text message, bytes for a binary message. No headers are set.

      Good to know: it connects when the integration starts, and the integration fails to start when the server cannot be reached, refuses the connection or fails the TLS checks. When the connection is lost, for example because the server restarts, it connects again every `reconnectInterval` milliseconds, without end unless `maxReconnectAttempts` is set. Messages the server sends while it is not connected are lost. The messages are passed on one after the other, in the order the server sent them. For a server that sends nothing until the client asks, such as a feed that needs a subscribe request, set `connectMessage`: it is sent as a text message each time the source connects, when the integration starts and after each reconnect, so the subscription is made again after the connection was lost. Apart from that one message, it only receives. The login comes only from `authorization`, sent as the `Authorization` header when it connects. Query parameters in `url` are sent with it, but a value with an encoded `&` or `+` (`%26` or `%2B`) arrives changed. A `wss://` URL connects with TLS, and the certificate and the host name of the server are checked against the certificate authorities that Java trusts. To trust a private one with Camel JBang or Camel Main, set the application properties `camel.ssl.enabled=true`, `camel.ssl.trustStore`, `camel.ssl.trustStorePassword` and `camel.component.vertx-websocket.useGlobalSslContextParameters=true`: that trust store then replaces the one of Java for every WebSocket connection of the application. A `ws://` URL connects without TLS.
    required:
    - url
    type: object
    properties:
      url:
        title: URL
        description: The address of the WebSocket server, with the path and any query parameters. It starts with `ws://`, or with `wss://` for TLS. Without a port, it is 80 for `ws://` and 443 for `wss://`.
        type: string
        example: "wss://stream.example.com/prices?symbols=ACME"
        pattern: "^wss?://.+"
      authorization:
        title: Authorization
        description: The value of the `Authorization` header to send when connecting, for a server that asks for a login, such as `Bearer` followed by a token. It is sent once, when the connection opens, not with each message.
        type: string
        example: "Bearer my-token"
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      subProtocols:
        title: Subprotocols
        description: The subprotocols to ask the server for, separated by commas, sent in the `Sec-WebSocket-Protocol` header when connecting. Set it only for a server that needs one, such as a GraphQL server.
        type: string
        example: "graphql-transport-ws"
      connectMessage:
        title: Connect Message
        description: A text message to send to the server each time the source connects, when the integration starts and after each reconnect, such as a subscribe request. It is sent as it is written. Leave it empty for a server that pushes without being asked.
        type: string
        example: '{"op": "subscribe", "args": ["prices"]}'
      reconnectInterval:
        title: Reconnect Interval
        description: How long to wait between two attempts to connect again after the connection was lost, in milliseconds. The first attempt is made at once.
        type: integer
        default: 1000
      maxReconnectAttempts:
        title: Max Reconnect Attempts
        description: How many attempts to connect again it makes after the connection was lost, before it gives up. After it gives up, it receives nothing more until the integration is restarted. 0 means no limit.
        type: integer
        default: 0
  dataTypes:
    # No 'default:' here on purpose: the body is text or bytes, as the server sent the message, and
    # a default would turn every message into one of the two. See #3117.
    out:
      headers: {}
  dependencies:
    - "camel:vertx-websocket"
    - "camel:kamelet"
  template:
    from:
      uri: "vertx-websocket:{{url}}"
      parameters:
        consumeAsClient: true
        reconnectInterval: "{{reconnectInterval}}"
        maxReconnectAttempts: "{{maxReconnectAttempts}}"
        clientSubProtocols: "{{?subProtocols}}"
        connectMessage: "RAW({{?connectMessage}})"
        "handshake.Authorization": "RAW({{?authorization}})"
      steps:
        - to:
            uri: kamelet:sink
