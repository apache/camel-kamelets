apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: aws-ddb-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "AWS DynamoDB Streams"
    camel.apache.org/kamelet.namespace: "AWS"
  labels:
    camel.apache.org/kamelet.type: "sink"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "AWS DynamoDB Sink"
    description: |-
      Writes each message as an item into an Amazon DynamoDB table: it creates or replaces, updates or deletes the item, depending on the operation.

      Use it to store events or records, such as orders, sensor readings or user profiles, as items of a DynamoDB table, or to delete items. To receive the changes made to a table, use `aws-ddb-streams-source`.

      Input: the body is a JSON object, as JSON text, whose fields are the attributes of the item, such as `{"id":"A-1","customer":"Alice","total":42}`; it must hold the key attributes of the table. Text becomes a string attribute, a number a number, true or false a boolean, an object a map, and a list a set of strings or of numbers. With `DeleteItem` the body only needs the key. With `UpdateItem` the body holds a `key` object with the key attributes and an `item` object with the attributes to set, such as `{"key":{"id":"A-1"},"item":{"status":"shipped"}}`. The optional `CamelAwsDdbOperation` header chooses the operation for one message.

      Output: the body is unchanged. The `CamelAwsDdbAttributes` header holds the attributes of the item before the change (`PutItem`, `DeleteItem`) or after it (`UpdateItem`).

      Good to know: `PutItem`, the default, replaces the whole item that has the same key, so the attributes missing from the body are lost; use `UpdateItem` to change some attributes only. A body without the key of the table fails. Do not choose the operation with an `operation` field in the body: depending on the Camel version it is ignored, and the item is then replaced as with `PutItem`, or the message fails. To reach AWS through an HTTP proxy, set `proxyHost` and `proxyPort`, and set `proxyProtocol` to `HTTP` for a proxy that takes plain HTTP, such as Squid. Headers that start with `CamelAwsDdb`, except `CamelAwsDdbOperation` and `CamelAwsDdbReturnValues`, are removed from the message first, so they cannot change what the Kamelet does.
    required:
      - table
      - region
    type: object
    properties:
      table:
        title: Table Name
        description: "The name of the DynamoDB table to write the items to. The table must exist: the Kamelet does not start when it does not."
        type: string
        example: orders
      accessKey:
        title: Access Key
        description: "The access key ID of an IAM user, which AWS gives when you create an access key for the user (in the AWS console: IAM, Users, Security credentials). Use it together with `secretKey`, or leave both empty and set `useDefaultCredentialsProvider` or `useProfileCredentialsProvider` instead."
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      secretKey:
        title: Secret Key
        description: The secret access key that goes with `accessKey`. AWS shows it only once, when the access key is created.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      region:
        title: AWS Region
        description: The AWS region of the table, such as `eu-west-1`.
        type: string
        example: eu-west-1
        enum: ["ap-south-1", "eu-south-1", "us-gov-east-1", "me-central-1", "ca-central-1", "eu-central-1", "us-iso-west-1", "us-west-1", "us-west-2", "af-south-1", "eu-north-1", "eu-west-3", "eu-west-2", "eu-west-1", "ap-northeast-3", "ap-northeast-2", "ap-northeast-1", "me-south-1", "sa-east-1", "ap-east-1", "cn-north-1", "us-gov-west-1", "ap-southeast-1", "ap-southeast-2", "us-iso-east-1", "ap-southeast-3", "us-east-1", "us-east-2", "cn-northwest-1", "us-isob-east-1", "aws-global", "aws-cn-global", "aws-us-gov-global", "aws-iso-global", "aws-iso-b-global"]
      operation:
        title: Operation
        description: "What to do with each message: `PutItem` creates the item, or replaces the item with the same key; `UpdateItem` changes only the given attributes of an item; `DeleteItem` deletes the item. The `CamelAwsDdbOperation` header overrides it for one message."
        type: string
        default: PutItem
        example: PutItem
        enum: ["PutItem", "UpdateItem", "DeleteItem"]
      useDefaultCredentialsProvider:
        title: Default Credentials Provider
        description: "If true, the credentials are found the way the AWS SDK finds them: from the `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY` environment variables, the shared credentials file, or the IAM role of the machine, container or pod it runs on. Then `accessKey` and `secretKey` are not needed."
        type: boolean
        default: false
      useProfileCredentialsProvider:
        title: Profile Credentials Provider
        description: If true, the credentials are read from a profile of the AWS credentials file (`~/.aws/credentials`), the one named in `profileCredentialsName`.
        type: boolean
        default: false
      useSessionCredentials:
        title: Session Credentials
        description: "If true, it logs in with temporary credentials, such as those of an assumed IAM role: `accessKey`, `secretKey` and `sessionToken` together."
        type: boolean
        default: false
      profileCredentialsName:
        title: Profile Credentials Name
        description: The name of the profile to use from the AWS credentials file. Only used when `useProfileCredentialsProvider` is true.
        type: string
      sessionToken:
        title: Session Token
        description: The session token of temporary credentials, which AWS gives together with their access key and secret key. Only used when `useSessionCredentials` is true.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      uriEndpointOverride:
        title: Overwrite Endpoint URI
        description: The address to send the requests to instead of the usual AWS address, such as `http://localhost:4566` for LocalStack. Only used when `overrideEndpoint` is true.
        type: string
        example: http://localhost:4566
      overrideEndpoint:
        title: Endpoint Overwrite
        description: If true, the requests go to the address in `uriEndpointOverride` instead of AWS, for example to test against LocalStack.
        type: boolean
        default: false
      proxyHost:
        title: Proxy Host
        description: The host name or IP address of an HTTP proxy to send the calls to AWS through, such as the proxy of a company network. Used only together with `proxyPort`. When it is not set, the calls go straight to AWS.
        type: string
        pattern: "^[A-Za-z0-9._-]+$"
        example: proxy.example.com
      proxyPort:
        title: Proxy Port
        description: The port of the proxy in `proxyHost`, such as `3128` for Squid. Used only together with `proxyHost`.
        type: integer
        example: 3128
      proxyProtocol:
        title: Proxy Protocol
        description: "How to talk to the proxy itself: `HTTP` or `HTTPS`. It is not the protocol of the calls to AWS, which stay encrypted, as the proxy only passes them on. When it is not set, it is `HTTPS`, which needs a proxy that takes TLS connections. Most company proxies, such as Squid, take plain HTTP: set `HTTP` for them. With the wrong one, every call fails, for example with `Unsupported or unrecognized SSL message`."
        type: string
        enum: ["HTTP", "HTTPS"]
        example: HTTP
  dataTypes:
    # No 'default:' here on purpose. Camel runs a default input type at the
    # kamelet:source boundary, before any step below, when the operation of
    # the template is not known yet: a body with an `operation` field then
    # fails, even one that names the configured operation. The
    # transformDataType step below applies the type after the operation is
    # set. See #2941 and #3117.
    in:
      headers:
        CamelAwsDdbOperation:
          title: Operation
          description: The operation for this message, `PutItem`, `UpdateItem` or `DeleteItem`, instead of the `operation` option.
          type: string
        CamelAwsDdbReturnValues:
          title: Return Values
          description: Which attributes to give back in the `CamelAwsDdbAttributes` header, such as `NONE`, `ALL_OLD` or `ALL_NEW`. By default `ALL_OLD` for `PutItem` and `DeleteItem`, and `ALL_NEW` for `UpdateItem`.
          type: string
      types:
        json:
          format: "aws2-ddb:application-json"
          description: Json representation of a DDB operation. The input type supports the operations PutItem, UpdateItem, DeleteItem. For PutItem operation the Json body defines all item attributes. For DeleteItem operation the Json body defines only the primary key attributes that identify the item to delete. For UpdateItem operation the Json body defines both key attributes to identify the item to be updated and all item attributes that get updated on the item.
          headers:
            CamelAwsDdbOperation:
              title: Operation
              description: "The operation to perform. Overwrites the operation given in the Json body. One of PutItem, UpdateItem, DeleteItem."
              default: PutItem
              type: string
            CamelAwsDdbReturnValues:
              title: Return Values
              description: Use this parameter if you want to get the attribute name-value pairs before or after they are modified. Possible values are NONE, ALL_OLD, UPDATED_OLD, ALL_NEW, UPDATED_NEW.
              type: string
          mediaType: application/json
          schema:
            type: object
            required: [ "key" ]
            properties:
              operation:
                type: string
                description: The operator to perform. One of PutItem, UpdateItem, DeleteItem
              key:
                type: object
                description: The primary key specifies the selection criteria for the query.
              item:
                type: object
                description: Attribute value map specifies all attributes to change with the given operation.
    out:
      headers:
        CamelAwsDdbAttributes:
          title: Attributes
          description: The attributes of the item before the change (`PutItem`, `DeleteItem`) or after it (`UpdateItem`), as a Map of attribute values of the AWS SDK.
          type: object
  dependencies:
  - "camel:jackson3"
  - "camel:aws2-ddb"
  - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: CamelAwsDdb*
            excludePattern: "CamelAwsDdb(Operation|ReturnValues)"
        - setProperty:
            name: operation
            expression:
              constant:
                expression: "{{operation}}"
        - transformDataType:
            toType: aws2-ddb:application-json
        - to:
            uri: aws2-ddb
            parameters:
              tableName: "{{table}}"
              accessKey: "RAW({{?accessKey}})"
              operation: "{{operation}}"
              overrideEndpoint: "{{overrideEndpoint}}"
              profileCredentialsName: "{{?profileCredentialsName}}"
              region: "{{region}}"
              secretKey: "RAW({{?secretKey}})"
              sessionToken: "RAW({{?sessionToken}})"
              uriEndpointOverride: "{{?uriEndpointOverride}}"
              useDefaultCredentialsProvider: "{{useDefaultCredentialsProvider}}"
              useProfileCredentialsProvider: "{{useProfileCredentialsProvider}}"
              useSessionCredentials: "{{useSessionCredentials}}"
              proxyHost: "{{?proxyHost}}"
              proxyPort: "{{?proxyPort}}"
              proxyProtocol: "{{?proxyProtocol}}"
