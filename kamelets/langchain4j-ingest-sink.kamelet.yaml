apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: langchain4j-ingest-sink
  labels:
    camel.apache.org/kamelet.type: "sink"
    camel.apache.org/kamelet.verified: "true"
  annotations:
    camel.apache.org/kamelet.support.level: "Preview"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/kamelet.group: "LangChain4j Ingest"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.namespace: "AI"
spec:
  definition:
    title: "LangChain4j Ingest Sink"
    description: |-
      Splits each document into small pieces of text, turns each piece into an embedding (a vector of numbers) with an AI embedding model, and writes them to a LangChain4j embedding store.

      Use it to load documents into a vector store, so that an AI assistant can later find the pieces that answer a question (RAG). Read PDF or office documents with `tika-extract-text-action` or `docling-convert-action` first, and a directory with `langchain4j-ingest-file-source`.

      Input: the document, as text, bytes, a stream or a file, read as text. Every document needs an id, such as its file name, in the `CamelLangChain4jIngestDocumentId` header (or the one named in `documentIdHeader`); an id kept by `tika-extract-text-action` or `docling-convert-action` comes first.

      Output: when it is used inside a route, the body afterwards is a result object with the pipeline name, the document id, the number of pieces written, and the outcome: `INGESTED`, `EMPTY` (an empty document, nothing written), `SKIPPED` (an id seen before, with `idempotentRepository`) or `FILTERED` (left out by `includeId`, `excludeId`, `minDocumentSize` or `documentFilter`).

      Good to know: the embedding store and the embedding model are objects you define in the application, such as in the `beans` section of a YAML route; when there is one of each, the options can be left out. Writing a document again adds new pieces, and does not replace the ones written before. With `idempotentRepository`, only the first document with a given id is written, so a changed version of a file is skipped. A message without a document id, or larger than `maxDocumentSize`, fails.
    type: object
    properties:
      pipelineName:
        title: Pipeline Name
        description: A name for this ingestion, written on every piece in the store, so that the pieces of several pipelines can be told apart. Letters, digits, dots, underscores and dashes only.
        type: string
        pattern: "[A-Za-z0-9._-]+"
        default: ingest
        example: product-manuals
      documentIdHeader:
        title: Document ID Header
        description: The name of the header that holds the id of the document, such as its file name or path. Set it to the header your source fills, such as `CamelAwsS3Key` for `aws-s3-source`. An id kept by `tika-extract-text-action` or `docling-convert-action` takes precedence.
        type: string
        default: CamelLangChain4jIngestDocumentId
        example: CamelAwsS3Key
      modality:
        title: Modality
        description: What the documents are. `text`, used when it is not set, splits the text into pieces. `media` embeds each document whole, as one vector, for an image, audio, video or a PDF; it needs an embedding model that accepts that kind of content, else the integration fails to start, and the splitting options and `embeddingBatchSize` are not used.
        type: string
        enum: ["text", "media"]
      contentType:
        title: Content Type
        description: The kind of content of the documents, as a MIME type, handed to the embedding model. Only with `modality` set to `media`. When it is not set, it is guessed from the extension of the document id, such as `.png`.
        type: string
        pattern: "^[^/ ;]+/[^/ ;]+(;.*)?$"
        example: image/png
      maxSegmentSize:
        title: Max Segment Size
        description: The longest piece of text to embed, in characters. Smaller pieces give more precise search results; larger ones keep more context together.
        type: integer
        default: 500
      maxOverlapSize:
        title: Max Overlap Size
        description: How many characters at the end of a piece are repeated at the start of the next one, so that a sentence cut in two is still found.
        type: integer
        default: 50
      embeddingBatchSize:
        title: Embedding Batch Size
        description: How many pieces are sent to the embedding model in one request.
        type: integer
        default: 32
      maxDocumentSize:
        title: Max Document Size
        description: The largest document to write, in characters, or in bytes with `modality` set to `media`. A larger document fails the message. When it is not set, there is no limit; the whole document is held in memory.
        type: integer
        example: 1000000
      includeId:
        title: Include ID
        description: Ant-style patterns that the document id must match to be written, separated by commas, such as `**/*.md` for every Markdown file in any directory. Other documents are left out, with the outcome `FILTERED`. When it is not set, every document is written.
        type: string
        example: "docs/**,*.md"
      excludeId:
        title: Exclude ID
        description: Patterns for the document ids to leave out, separated by commas, in the same form as `includeId`. It wins over `includeId`.
        type: string
        example: "**/draft-*"
      minDocumentSize:
        title: Min Document Size
        description: The smallest document to write, in characters, or in bytes with `modality` set to `media`. A smaller document is left out, with the outcome `FILTERED`.
        type: integer
        example: 100
      documentFilter:
        title: Document Filter
        description: A filter object defined in the application (a Camel `Predicate`) that decides for each document whether it is written, as `#bean:` followed by its name. A document it refuses gets the outcome `FILTERED`.
        type: string
        example: "#bean:myFilter"
      documentSplitter:
        title: Document Splitter
        description: A LangChain4j `DocumentSplitter` defined in the application, to cut the text into pieces your own way, as `#bean:` followed by its name. `maxSegmentSize` and `maxOverlapSize` are then not used. Not allowed with `modality` set to `media`.
        type: string
        example: "#bean:mySplitter"
      embeddingStore:
        title: Embedding Store
        description: The LangChain4j `EmbeddingStore` to write to, defined in the application, as `#bean:` followed by its name. When it is not set, the only embedding store of the application is used.
        type: string
        example: "#bean:store"
      embeddingModel:
        title: Embedding Model
        description: The LangChain4j `EmbeddingModel` that turns the text into vectors, defined in the application, as `#bean:` followed by its name. When it is not set, the only embedding model of the application is used.
        type: string
        example: "#bean:model"
      idempotentRepository:
        title: Idempotent Repository
        description: A Camel `IdempotentRepository` defined in the application, as `#bean:` followed by its name, that remembers the ids of the documents written. A document whose id it has seen before is not written again, and gets the outcome `SKIPPED`, even when its content changed.
        type: string
        example: "#bean:ingestedIds"
  dataTypes:
    # No 'default:' here on purpose: the document is taken as it is, as text, bytes, a stream or a
    # file, which the component reads as text itself; a text default would read a file or a stream
    # into memory first. See #3117.
    in:
      headers:
        CamelLangChain4jIngestDocumentId:
          title: Document ID
          description: The id of the document, such as its file name or path. Required, unless `documentIdHeader` names another header, or `tika-extract-text-action` or `docling-convert-action` kept the id before.
          type: string
  dependencies:
    - "camel:langchain4j-ingest"
    - "camel:kamelet"
  template:
    from:
      uri: kamelet:source
      steps:
        # the endpoint itself resolves the id - the exchange property (set pre-parse by the
        # parser actions) wins over the header, so no re-capture happens here: reading the
        # header after a parse could hand a crafted document its own identity
        - to:
            uri: langchain4j-ingest
            parameters:
              pipelineName: "{{pipelineName}}"
              contentType: "{{?contentType}}"
              documentFilter: "{{?documentFilter}}"
              documentIdHeader: "{{documentIdHeader}}"
              documentSplitter: "{{?documentSplitter}}"
              embeddingBatchSize: "{{embeddingBatchSize}}"
              embeddingModel: "{{?embeddingModel}}"
              embeddingStore: "{{?embeddingStore}}"
              excludeId: "{{?excludeId}}"
              idempotentRepository: "{{?idempotentRepository}}"
              includeId: "{{?includeId}}"
              maxDocumentSize: "{{?maxDocumentSize}}"
              maxOverlapSize: "{{maxOverlapSize}}"
              maxSegmentSize: "{{maxSegmentSize}}"
              minDocumentSize: "{{?minDocumentSize}}"
              modality: "{{?modality}}"
