apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: nats-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "NATS"
    camel.apache.org/kamelet.namespace: "Messaging"
  labels:
    camel.apache.org/kamelet.type: "source"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "NATS Source"
    description: |-
      Receives each message published to a subject on a NATS server, or stored in a JetStream stream.

      Use it to react to events or commands that services publish on NATS. Use `nats-sink` to publish them.

      Output: the body is the payload, as bytes, unchanged. The `CamelNatsSubject` header is the subject, and the NATS headers of the message become headers too.

      Good to know: without JetStream, it receives only the messages published while it is connected. With `jetstreamEnabled`, it creates the stream `jetstreamName` for the subject when it does not exist. Each time it starts it reads the stream from the beginning, so messages already read are received again, unless `durableName` is set: then it carries on after the last message it acknowledged. A message is acknowledged once it has been processed. A message that fails is delivered again 5 seconds later, with no end unless `maxDeliver` is set. When an integration with a `durableName` stops abruptly, the messages it had not finished come back after 30 seconds, so the one in progress can be received twice. When several copies of the integration run, each copy receives every message, unless they share a `queueName` (without JetStream) or a `durableName` (with JetStream): then each message goes to only one of them. It connects with TLS when `secure` is true. The certificate of the server is checked against the certificate authorities that Java trusts. To trust a private one with Camel JBang or Camel Main, set the application properties `camel.ssl.enabled=true`, `camel.ssl.trustStore`, `camel.ssl.trustStorePassword` and `camel.component.nats.useGlobalSslContextParameters=true`: that trust store then replaces the one of Java for every NATS connection of the application that has `secure` set. The integration fails to start when no server can be reached, or when the server refuses the login.
    required:
      - topic
      - servers
    type: object
    properties:
      topic:
        title: "Subject"
        description: "The NATS subject to receive the messages from."
        example: "orders.created"
        type: string
      servers:
        title: "Servers"
        description: "The addresses of one or more NATS servers, as `host:port` or `nats://host:port`, separated by commas. The usual NATS port is 4222. For a server that needs a login, put the user and password in the address, as `nats://user:password@host:4222`, or a token, as `nats://token@host:4222`. To log in with a NATS credentials file instead, use `credentialsFilePath`."
        example: "nats://localhost:4222"
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      queueName:
        title: "Queue Group"
        description: "The name of a NATS queue group to join. The subscribers of `topic` that use the same queue group share its messages: each message goes to only one of them. Set the same name on every copy of the integration when you run several of them, so that each message is processed once; without it, each copy receives every message. Only used without JetStream: with `jetstreamEnabled`, each copy still receives every message of the stream, unless the copies share a `durableName`."
        example: "order-workers"
        type: string
        pattern: "^\\S+$"
      secure:
        title: "Secure (TLS)"
        description: "If true, it connects with TLS, which a server with TLS in its configuration requires; without it, such a server refuses the connection with `SSL required by server`. The certificate of the server is checked against the certificate authorities that Java trusts, or against the trust store set in the `camel.ssl` application properties when `camel.component.nats.useGlobalSslContextParameters` is true. An address that starts with `tls://` also connects with TLS, but uses that trust store only when `secure` is true. When not set, it connects with TLS only to a `tls://` address."
        type: boolean
      credentialsFilePath:
        title: "Credentials File"
        description: "A NATS credentials file (`.creds`) to log in with, which holds a user JWT and the NKey seed of the user. Servers with decentralized authentication, such as Synadia Cloud, use it. Start it with `file:` followed by the path of the file, or with `classpath:`, `http:` or `https:`. The `nsc generate creds` command makes one. A file that does not exist makes the integration fail to start, and a user that the server does not know is refused with `Authorization Violation`."
        example: "file:/etc/nats/user.creds"
        type: string
        pattern: "^(file|classpath|http|https):.+"
      jetstreamEnabled:
        title: "JetStream Enabled"
        description: "If true, the messages are read from the JetStream stream `jetstreamName`, which keeps them, instead of from plain NATS. The stream is created for the subject in `topic` when it does not exist."
        type: boolean
        default: false
      jetstreamName:
        title: "JetStream Stream Name"
        description: "The name of the JetStream stream that stores the messages. Only used when `jetstreamEnabled` is true."
        example: "ORDERS"
        type: string
      jetstreamAsync:
        title: "JetStream Async"
        description: "Not used by the source, which receives the messages the same way whether it is true or false."
        type: boolean
        default: true
      durableName:
        title: "Durable Consumer Name"
        description: "The name of a durable JetStream consumer: the server keeps it, and the position of the integration in the stream, when the integration stops. After a restart, it carries on with the first message that was not acknowledged, instead of reading the stream from the beginning. Copies of the integration with the same `durableName` share the messages: each message goes to only one of them. A new durable consumer starts at the beginning of the stream. On the server, the consumer is named after it with `-durable` added, such as `order-processor-durable`. It stays on the server when the integration is removed: delete it with `nats consumer rm <stream> <name>-durable`. Its `ackPolicy` and `maxDeliver` cannot be changed afterwards: the integration then logs `Existing consumer cannot be modified` and receives nothing, so delete the consumer first. Letters, digits, `-` and `_` only. Only used when `jetstreamEnabled` is true."
        example: "order-processor"
        type: string
        pattern: "^[A-Za-z0-9_-]+$"
      ackPolicy:
        title: "Acknowledge Policy"
        description: "How the messages are acknowledged to JetStream, so that it does not deliver them again. `Explicit`: each message on its own, once it has been processed; a message that fails is delivered again. `All`: the same, but acknowledging a message also acknowledges all the earlier ones, so a message that failed is not delivered again once a later message succeeds. `None`: JetStream counts a message as done when it sends it, so a message that fails is not delivered again. When not set, `Explicit`. Only used when `jetstreamEnabled` is true."
        type: string
        enum: ["Explicit", "All", "None"]
      maxDeliver:
        title: "Maximum Deliveries"
        description: "How many times at most a message is delivered, the first time included. A message that fails is delivered again 5 seconds later, until it has been delivered this many times; it then stays in the stream but is not delivered again. When not set, a message that fails is delivered again with no end. Only used when `jetstreamEnabled` is true."
        example: 5
        type: integer
  types:
    out:
      mediaType: application/octet-stream
  dataTypes:
    # No 'default:' here on purpose: the NATS headers of the message become headers, a Content-Type
    # the publisher set too, and a binary default would replace it with application/octet-stream. See
    # #3117.
    out:
      headers:
        CamelNatsSubject:
          title: "Subject"
          description: "The subject the message was published to."
          type: string
        CamelNatsReplyTo:
          title: "Reply Subject"
          description: "The subject to send a reply to, when the sender asked for one."
          type: string
  dependencies:
  - "camel:jackson3"
  - "camel:nats"
  - "camel:kamelet"
  template:
    from:
      uri: nats
      parameters:
        topic: "{{topic}}"
        jetstreamAsync: "{{?jetstreamAsync}}"
        jetstreamEnabled: "{{?jetstreamEnabled}}"
        jetstreamName: "{{?jetstreamName}}"
        servers: "RAW({{servers}})"
        secure: "{{?secure}}"
        credentialsFilePath: "{{?credentialsFilePath}}"
        queueName: "{{?queueName}}"
        durableName: "{{?durableName}}"
        ackPolicy: "{{?ackPolicy}}"
        maxDeliver: "{{?maxDeliver}}"
      steps:
        - to:
            uri: kamelet:sink
