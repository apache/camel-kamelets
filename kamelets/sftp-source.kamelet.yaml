apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: sftp-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "FTP"
    camel.apache.org/kamelet.namespace: "File"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "SFTP Source"
    description: |-
      Reads the files in a directory on an SFTP server, over an encrypted SSH connection, one message per file, and by default leaves them on the server.

      Use it to collect the files that a partner or another system drops on a server you reach with SSH, such as orders, invoices or exports. For an FTP server use `ftp-source` or `ftps-source`.

      Output: the body is the content of the file, as bytes. The `file` and `ce-file` headers hold the name of the file, with its path below `directoryName` when `recursive` is true, such as `2026/orders.csv`. `CamelFileName` holds the same name, and `CamelFileLength` the size of the file in bytes.

      Good to know: files are not deleted or moved after they are read, unless `delete` is true. A file is read only once while the integration runs (`idempotent`), but the files left on the server are all read again after a restart; set `delete` to true to read each file only once. Log in with `username` and either `password` or a private key. The key of the server must be in a known_hosts file, `knownHostsUri` or else `~/.ssh/known_hosts` of the user that runs the integration, or the connection fails.
    required:
      - connectionHost
      - connectionPort
      - directoryName
    type: object
    properties:
      connectionHost:
        title: Connection Host
        description: The host name or IP address of the SFTP server, without `sftp://` and without a port.
        type: string
        example: sftp.example.com
      connectionPort:
        title: Connection Port
        description: The port of the SFTP server, which is its SSH port, usually 22.
        type: string
        default: 22
      username:
        title: Username
        description: The user to log in to the SFTP server as.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      password:
        title: Password
        description: The password of `username`. Leave it empty to log in with a private key instead, set in `privateKeyFile` or `privateKeyUri`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      directoryName:
        title: Directory Name
        description: The directory on the server to read the files from. A path without a leading `/` is relative to the home directory of the user.
        type: string
        example: outgoing/orders
      passiveMode:
        title: Passive Mode
        description: A setting of FTP that has no effect on SFTP. Leave it unset.
        type: boolean
        default: false
      recursive:
        title: Recursive
        description: If true, the files in the subdirectories of `directoryName` are read too.
        type: boolean
        default: false
      idempotent:
        title: Skip Files Already Read
        description: If true, a file is read only once while the integration runs, even when it stays on the server. The list of the files read is kept in memory, so after a restart the files still on the server are read again. If false, and `delete` is false, the same files are read again on every poll.
        type: boolean
        default: true
      ignoreFileNotFoundOrPermissionError:
        title: Ignore Access Errors
        description: If true, a directory or a file that does not exist, or that `username` may not read, is skipped. If false, it causes an error.
        type: boolean
        default: false
      binary:
        title: Binary Mode
        description: A setting of FTP that has no effect on SFTP, which always transfers files byte for byte. Leave it unset.
        type: boolean
        default: false
      privateKeyFile:
        title: Private Key File
        description: The path of a private key file on the machine that runs the integration, to log in with instead of a password. The matching public key must be in the `authorized_keys` of `username` on the server.
        type: string
        example: /etc/sftp/keys/id_rsa
      privateKeyPassphrase:
        title: Private Key Passphrase
        description: The passphrase of the private key, when the key is protected with one.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      privateKeyUri:
        title: Private Key URI
        description: Where to load the private key from, instead of `privateKeyFile`. It starts with `file://` for a file, `classpath://` for a resource in the application, or `http://` or `https://`.
        type: string
        pattern: "^(http|https|file|classpath|ref|bean)://.*"
        example: file:///etc/sftp/keys/id_rsa
      strictHostKeyChecking:
        title: Strict Host Checking
        description: Whether the key of the server must be found in a known_hosts file. With `yes`, a server that is not in it is refused. With `no`, any server is accepted without checking its key, so someone in between could read the files and the password. `ask` is meant for interactive use.
        type: string
        enum: ["yes", "no", "ask"]
        default: "yes"
      knownHostsUri:
        title: Known Hosts URI
        description: The known_hosts file that holds the key of the server, starting with `file://`, `classpath://`, `http://` or `https://`. Its lines can be made with `ssh-keyscan`. When it is not set, `~/.ssh/known_hosts` of the user that runs the integration is used, unless `useUserKnownHostsFile` is false; set it when that file does not exist, for example in a container.
        type: string
        pattern: "^(http|https|file|classpath|ref|bean)://.*"
        example: file:///etc/sftp/known_hosts
      useUserKnownHostsFile:
        title: Use User Known Hosts File
        description: If true and `knownHostsUri` is not set, the key of the server is looked up in `~/.ssh/known_hosts` of the user that runs the integration.
        type: boolean
        default: true
      autoCreate:
        title: Autocreate Missing Directories
        description: If true, `directoryName` is created on the server when it does not exist.
        type: boolean
        default: true
      delete:
        title: Delete
        description: If true, each file is deleted from the server once it has been read and handed on successfully. Use it to read each file only once, also across restarts.
        type: boolean
        default: false
  dataTypes:
    out:
      headers:
        file:
          title: File Name
          description: The name of the file, with its path below `directoryName` when `recursive` is true, such as `2026/orders.csv`.
          type: string
        ce-file:
          title: File Name (CloudEvents)
          description: The same value as `file`.
          type: string
        CamelFileName:
          title: Camel File Name
          description: The same value as `file`.
          type: string
        CamelFileLength:
          title: File Size
          description: The size of the file, in bytes.
          type: integer
  dependencies:
    - "camel:ftp"
    - "camel:kamelet"
  template:
    from:
      uri: sftp
      parameters:
        host: "{{connectionHost}}"
        port: "{{connectionPort}}"
        directoryName: "{{directoryName}}"
        autoCreate: "{{autoCreate}}"
        binary: "{{binary}}"
        delete: "{{delete}}"
        idempotent: "{{idempotent}}"
        ignoreFileNotFoundOrPermissionError: "{{ignoreFileNotFoundOrPermissionError}}"
        knownHostsUri: "RAW({{?knownHostsUri}})"
        passiveMode: "{{passiveMode}}"
        password: "RAW({{?password}})"
        privateKeyFile: "RAW({{?privateKeyFile}})"
        privateKeyPassphrase: "RAW({{?privateKeyPassphrase}})"
        privateKeyUri: "RAW({{?privateKeyUri}})"
        recursive: "{{recursive}}"
        strictHostKeyChecking: "{{?strictHostKeyChecking}}"
        useUserKnownHostsFile: "{{?useUserKnownHostsFile}}"
        username: "RAW({{?username}})"
      steps:
        - setBody:
            expression:
              simple:
                expression: "${body.getBody()}"
        - setHeader:
            name: file
            expression:
              simple:
                expression: "${header[CamelFileName]}"
        - setHeader:
            name: ce-file
            expression:
              simple:
                expression: "${header[CamelFileName]}"
        - to:
            uri: kamelet:sink
