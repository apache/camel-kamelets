apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: oracle-database-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "SQL"
    camel.apache.org/kamelet.namespace: "Database"
  labels:
    camel.apache.org/kamelet.type: "sink"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "Oracle Database Sink"
    description: |-
      Runs an SQL statement, such as an INSERT, in an Oracle Database database for each message, with values taken from the fields of the JSON object in the body.

      Use it to store records from another system as rows of a table, such as each order that arrives on a Kafka topic, or to update or delete rows. To read rows, use `oracle-database-source`.

      Input: the body is one JSON object, as text, such as `{"username":"oscerd","city":"Rome"}`. In `query`, write `:#username` where the value of the field `username` goes. When the object has no field of that name, the header of that name is used instead. Fields that `query` does not name are ignored. When `batch` is true, the body can also be a JSON array of such objects, and `query` runs once for each of them.

      Output: the body afterwards is the JSON object as a Map, and the `CamelSqlUpdateCount` header holds the number of rows the statement changed. For a JSON array with `batch`, the body is a List of Maps, and the header holds the total for all of them. When `query` is a SELECT, the body is instead a List of the rows found, each a Map, and the `CamelSqlRowCount` header holds their number. The `Content-Type` header is set to `application/json`.

      Good to know: a message fails when its body is not a JSON object (plain text, for example, or a JSON array when `batch` is not true), or when it has no value for a parameter of `query`. With `batch`, all the rows of one message are written in one transaction: when one of them fails, none is written. The values are sent to the database apart from the SQL text, so the content of a message cannot change the statement. Do not write `?` in `query`, not even in a quoted string: the Kamelet then fails to start. The JDBC driver of Oracle Database is not included: add `mvn:com.oracle.database.jdbc:ojdbc17` to the dependencies of the integration. Camel JBang (`camel run`) adds it by itself.
    required:
      - serverName
      - username
      - password
      - query
      - databaseName
    type: object
    properties:
      serverName:
        title: Server Name
        description: The host name or IP address of the Oracle Database server, without the port.
        type: string
        example: db.example.com
      serverPort:
        title: Server Port
        description: The port of the Oracle listener on the server. Oracle uses 1521 unless it was set up otherwise.
        type: string
        default: 1521
      username:
        title: Username
        description: The database user to log in as. It needs the rights to run the queries of this Kamelet on their tables.
        type: string
        x-descriptors:
        - urn:camel:group:credentials
      password:
        title: Password
        description: The password of the database user `username`.
        type: string
        format: password
        x-descriptors:
        - urn:camel:group:credentials
      query:
        title: Query
        description: The SQL statement to run for each message, such as an INSERT, UPDATE or DELETE. Write `:#name` where the value of the field `name` of the JSON body goes.
        type: string
        example: 'INSERT INTO accounts (username,city) VALUES (:#username,:#city)'
      databaseName:
        title: Database Name
        description: The service name of the database to connect to, such as `FREEPDB1` or `ORCLPDB1`. It is a service name, not a SID.
        type: string
        example: ORCLPDB1
      batch:
        title: Batch
        description: 'Whether the body can be a JSON array of objects, such as `[{"username":"oscerd","city":"Rome"},{"username":"ann","city":"Oslo"}]`, to write several rows from one message. `query` runs once for each object, and all of them are written in one database transaction: when one of them fails, none is written. A single JSON object still works. When it is not set, the body must be one JSON object.'
        type: boolean
      maxTotal:
        title: Max Connections
        description: The most connections to the database that the Kamelet opens at the same time. When all of them are in use, the next message waits for one to be free, as long as `maxWaitMillis` allows. When it is not set, the limit is 8.
        type: integer
        example: 20
      maxIdle:
        title: Max Idle Connections
        description: The most unused connections to keep open for later. A connection that is given back when this many are unused already is closed. When it is not set, up to 8 are kept open.
        type: integer
        example: 2
      maxWaitMillis:
        title: Max Wait
        description: How long to wait for a free connection when `maxTotal` connections are in use, in milliseconds. After that, the message fails. When it is not set, it waits as long as it takes.
        type: integer
        example: 5000
  types:
    in:
      mediaType: application/json
  dataTypes:
    in:
      default: json
      types:
        json:
          format: "application-json"
          description: "One JSON object, or with `batch` a JSON array of objects, as JSON text in bytes."
          mediaType: application/json
    out:
      headers:
        CamelSqlUpdateCount:
          title: Update Count
          description: The number of rows the statement inserted, updated or deleted. With `batch`, the total for all the objects of the message.
          type: integer
        CamelSqlRowCount:
          title: Row Count
          description: The number of rows a SELECT returned. Only set when `query` is a SELECT.
          type: integer
  dependencies:
  - "camel:jackson3"
  - "camel:kamelet"
  - "camel:sql"
  - "mvn:org.apache.commons:commons-dbcp2:2.14.0"
  template:
    beans:
      - name: local-sql-oracle-sink
        type: "#class:org.apache.camel.component.sql.SqlComponent"
        properties:
          autowiredEnabled: "false"
      - name: dsBean
        type: "#class:org.apache.commons.dbcp2.BasicDataSource"
        properties:
          username: "{{username}}"
          password: "{{password}}"
          url: "jdbc:oracle:thin:@{{serverName}}:{{serverPort}}/{{databaseName}}"
          driverClassName: oracle.jdbc.driver.OracleDriver
          maxTotal: "{{?maxTotal}}"
          maxIdle: "{{?maxIdle}}"
          maxWaitMillis: "{{?maxWaitMillis}}"
    from:
      uri: kamelet:source
      steps:
        - unmarshal:
            json: {}
        - removeHeader:
            name: CamelSqlQuery
        - removeHeader:
            name: CamelSqlParameters
        - to:
            uri: "{{local-sql-oracle-sink}}:{{query}}?dataSource=#bean:{{dsBean}}&batch={{?batch}}"
