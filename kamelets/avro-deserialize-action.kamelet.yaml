apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: avro-deserialize-action
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Actions"
    camel.apache.org/kamelet.namespace: "Transformation"
  labels:
    camel.apache.org/kamelet.type: "action"
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: "Avro Deserialize Action"
    description: |-
      Turns each message of Avro binary data back into a JSON object, using the Avro schema the data was written with.

      Use it to read records that arrive in Avro, a compact binary format described by a schema, for example from a Kafka topic, and work on them as JSON. To turn JSON into Avro, use `avro-serialize-action`; for Protobuf, use `protobuf-deserialize-action`.

      Input: Avro binary data, as bytes, without the schema in it, such as `avro-serialize-action` writes.

      Output: the body is parsed JSON (a Jackson `JsonNode`) with one field for each field of the schema. The `Content-Type` header is removed. Put `json-serialize-action` after this action to get JSON text.

      Good to know: Avro data does not say which schema it was written with, so the schema must be the one the writer used. When `schema` is not set, the schema found by an earlier `resolve-pojo-schema-action` is used.
    type: object
    properties:
      schema:
        title: Schema
        description: "The Avro schema the data was written with, as JSON text: a record with a name and a list of fields, each with a name and a type. When it is not set, the schema found by an earlier `resolve-pojo-schema-action` is used."
        type: string
        example: '{"type": "record", "namespace": "com.example", "name": "FullName", "fields": [{"name": "first", "type": "string"},{"name": "last", "type": "string"}]}'
      validate:
        title: Validate
        description: Meant to turn the check of the content against the schema on or off. It has no effect.
        type: boolean
        default: true
  dataTypes:
    in:
      default: binary
      types:
        binary:
          format: "application-octet-stream"
          description: "The Avro binary data, as bytes."
          mediaType: application/octet-stream
  dependencies:
  - "camel:kamelet"
  - "camel:jackson3-avro"
  template:
    beans:
      - name: schemaResolver
        type: "#class:org.apache.camel.component.jackson3.avro.transform.AvroSchemaResolver"
        properties:
          validate: "{{validate}}"
          schema: "{{schema:}}"
    from:
      uri: kamelet:source
      steps:
        - unmarshal:
            avro:
              unmarshalType: tools.jackson.databind.JsonNode
              library: Jackson
              schemaResolver: "#bean:{{schemaResolver}}"
        - removeHeader:
            name: Content-Type
