apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: wttrin-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "4.24.0-SNAPSHOT"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Apache Software Foundation"
    camel.apache.org/kamelet.group: "Weather"
    camel.apache.org/kamelet.namespace: "Dataset"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "wttr.in Source"
    description: |-
      Fetches the current weather or the forecast for a place from the public wttr.in service at a regular interval, and sends it as JSON.

      Use it to feed weather data into a dashboard, a chat message or a decision, such as a frost alert, or as real, changing JSON data for a demo. No account is needed.

      Output: the body is JSON text. With `output` set to `current`, the default, it is an object with the current conditions, such as `temp_C`, `humidity` and `weatherDesc`. With `weather`, it is a list with the forecast for each day, starting today. With `full`, it is the whole answer of wttr.in, which has both. The `Content-Type` header is `application/json`, and the other headers of the HTTP answer are kept.

      Good to know: it calls `https://wttr.in` over the internet. When `wttrLocation` is not set, wttr.in guesses the place from the IP address of the machine.
    type: object
    properties:
      period:
        title: Period
        description: "How long to wait between two fetches, in milliseconds. For example, 3600000 is one hour."
        type: integer
        default: 60000
        example: 3600000
      wttrLocation:
        title: Location
        description: "The place to get the weather for: a city name such as `Paris` or `New York`, an airport code such as `muc`, a landmark after `~` such as `~Eiffel+tower`, a postal code, or a latitude and longitude such as `48.85,2.35`. When it is not set, wttr.in guesses the place from the IP address of the machine."
        type: string
        example: "Paris"
      wttrLanguage:
        title: Language
        description: "The language of the weather descriptions, as a language code such as `fr` or `de`. The descriptions in that language are added to the JSON in a field such as `lang_fr`; the other fields stay in English. When it is not set, the descriptions are in English only."
        type: string
        example: "fr"
      output:
        title: Output
        description: "What to send: `current` for the current conditions, `weather` for the forecast of each day, or `full` for the whole answer of wttr.in. Any other value works like `full`."
        type: string
        example: "weather"
        default: current
  types:
    out:
      mediaType: application/json
  dependencies:
    - "camel:http"
    - "camel:jackson3"
    - "camel:jsonpath"
    - "camel:kamelet"
    - "camel:timer"
  template:
    from:
      uri: timer
      parameters:
        timerName: wttr.in
        period: "{{period}}"
      steps:
        - to:
            uri: "https://wttr.in/{{?wttrLocation}}?format=j1&lang={{?wttrLanguage}}"
        - choice:
            when:
              - expression:
                  simple:
                    expression: "'{{output}}' == 'current'"
                steps:
                  - transform:
                      expression:
                        jsonpath:
                          expression: "$.current_condition[0]"
                  - marshal:
                      json: {}
              - expression:
                  simple:
                    expression: "'{{output}}' == 'weather'"
                steps:
                  - transform:
                      expression:
                        jsonpath:
                          expression: "$.weather"
                  - marshal:
                      json: {}
        - to:
            uri: kamelet:sink
