name: Catalog Dependency Scan

# The artifacts pinned in spec.dependencies are not visible to Dependabot, which
# reads poms rather than Kamelet YAML, so nothing else watches these versions. The
# camel: components are scanned too, at the newest Camel release, since OSV answers
# nothing for the SNAPSHOT the catalog builds against.
on:
  schedule:
    # Mondays, deliberately away from the Sunday SBOM job
    - cron: '15 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    if: github.repository == 'apache/camel-kamelets'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Query OSV for the pinned artifacts
        id: scan
        run: |
          set +e
          python3 script/security/scan_catalog_dependencies.py --report report.md
          echo "found=$?" >> "$GITHUB_OUTPUT"

      - name: Fail the run if OSV could not be reached
        if: steps.scan.outputs.found == '2'
        run: |
          echo "The scan could not complete; see the step above."
          exit 1

      - name: Raise an issue for the findings
        if: steps.scan.outputs.found == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Catalog dependency scan: advisories against pinned artifacts"

          # Reuse the open issue if there is one, so a finding that persists
          # across weeks does not open a new issue every Monday.
          existing=$(gh issue list --state open --search "\"$title\" in:title" \
                       --json number --jq '.[0].number // empty')

          {
            cat report.md
            echo
            echo "Raised by the \`Catalog Dependency Scan\` workflow, which reads"
            echo "\`camel-kamelets-sbom/camel-kamelets-catalog-sbom.json\` and queries https://osv.dev."
            echo "Artifacts the catalog pins are fixed by editing the Kamelet. Camel components are"
            echo "versioned by the runtime, so they are scanned at the newest Camel release and an"
            echo "advisory there is addressed by moving Camel rather than by changing this catalog."
          } > body.md

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md --label dependencies --label "automated pr"
          fi
